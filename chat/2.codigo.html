      const unzipped = unzip(new Uint8Array(arrayBuffer));

        if (path.endsWith('.md')) {
          const text = new TextDecoder().decode(data);
          const name = path.split('/').pop().replace('.md', '');

        orderItem.draggable = true;
        orderItem.innerHTML = `<span>${index + 1}. ${name}</span>`;

        };
        orderItem.ondragover = (e) => e.preventDefault();
        order.appendChild(orderItem);

      const content = files.map(name => fileContents[name]).join(separator);
      const name = document.getElementById('finalName').value || 'documento';

      a.download = `${name}.md`;

      URL.revokeObjectURL(url);

        alert('✅ Copiado para clipboard!');

        files = [];
        fileContents = {};
        updateFileList();
        document.getElementById('output').textContent = '';
      }
    }
  </script>

<body>
  <div class=&quot;container&quot;>
    <h1>📊 Importador de JSON para Markdown</h1>
    
    <div class=&quot;section&quot;>
      <h2>1️⃣ Importar JSON</h2>
      
      <div class=&quot;input-group&quot;>
        <label>Selecione arquivo JSON:</label>
        <input type=&quot;file&quot; id=&quot;jsonFile&quot; accept=&quot;.json&quot; />
      </div>
      
      <button onclick=&quot;importJson()&quot;>📥 Importar JSON</button>
    </div>
    
    <div class=&quot;section&quot;>
      <h2>2️⃣ Configurar Conversão</h2>
      
      <div class=&quot;input-group&quot;>
        <label>Tipo de JSON:</label>
        <select id=&quot;jsonType&quot;>
          <option value=&quot;array&quot;>Array de objetos</option>
          <option value=&quot;object&quot;>Objeto único</option>
          <option value=&quot;nested&quot;>Objeto aninhado</option>
        </select>
      </div>
      
      <div class=&quot;input-group&quot;>
        <label>Nível de título principal (h1-h6):</label>
        <select id=&quot;titleLevel&quot;>
          <option value=&quot;1&quot;>H1 (#)</option>
          <option value=&quot;2&quot;>H2 (##)</option>
          <option value=&quot;3&quot;>H3 (###)</option>
        </select>
      </div>
      
      <div class=&quot;input-group&quot;>
        <label>Incluir chaves como títulos?</label>
        <select id=&quot;includeKeys&quot;>
          <option value=&quot;yes&quot;>Sim</option>
          <option value=&quot;no&quot;>Não</option>
        </select>
      </div>
    </div>
    
    <div class=&quot;section&quot;>
      <h2>3️⃣ Ações</h2>
      <button onclick=&quot;convertToMarkdown()&quot;>🔄 Converter para Markdown</button>
      <button onclick=&quot;downloadMarkdown()&quot;>⬇️ Baixar Markdown</button>
      <button onclick=&quot;copyToClipboard()&quot;>📋 Copiar para Clipboard</button>
      <button onclick=&quot;clearAll()&quot;>🗑️ Limpar Tudo</button>
    </div>
    
    <div class=&quot;section&quot;>
      <h2>4️⃣ Resultado</h2>
      <div id=&quot;output&quot;></div>
    </div>
  </div>

  <script>
    let jsonData = null;
    let markdownOutput = '';

    async function importJson() {
      const input = document.getElementById('jsonFile');
      const file = input.files[0];
      
      if (!file) {
        alert('Selecione um arquivo JSON!');
        return;
      }
      
      const text = await file.text();
      try {
        jsonData = JSON.parse(text);
        alert('✅ JSON importado com sucesso!');
      } catch (e) {
        alert('❌ Erro ao parsear JSON: ' + e.message);
      }
    }

    function convertToMarkdown() {
      if (!jsonData) {
        alert('Importe um JSON primeiro!');
        return;
      }
      
      const type = document.getElementById('jsonType').value;
      const titleLevel = parseInt(document.getElementById('titleLevel').value);
      const includeKeys = document.getElementById('includeKeys').value === 'yes';
      
      let markdown = '';
      
      if (type === 'array') {
        markdown = convertArray(jsonData, titleLevel, includeKeys);
      } else if (type === 'object') {
        markdown = convertObject(jsonData, titleLevel, includeKeys);
      } else if (type === 'nested') {
        markdown = convertNested(jsonData, titleLevel, includeKeys);
      }
      
      markdownOutput = markdown;
      document.getElementById('output').textContent = markdown;
    }

    function convertArray(arr, titleLevel, includeKeys) {
      let md = '';
      arr.forEach((item, index) => {
        md += `${'#'.repeat(titleLevel)} Item ${index + 1}\n\n`;
        md += convertObject(item, titleLevel + 1, includeKeys);
        md += '\n\n';
      });
      return md;
    }

    function convertObject(obj, titleLevel, includeKeys) {
      let md = '';
      for (const [key, value] of Object.entries(obj)) {
        if (includeKeys) {
          md += `${'#'.repeat(titleLevel)} ${key}\n\n`;
        }
        
        if (typeof value === 'object' &amp;&amp; value !== null) {
          if (Array.isArray(value)) {
            md += convertArray(value, titleLevel + 1, includeKeys);
          } else {
            md += convertObject(value, titleLevel + 1, includeKeys);
          }
        } else {
          md += `${value}\n\n`;
        }
      }
      return md;
    }

    function convertNested(obj, titleLevel, includeKeys) {
      let md = '';
      
      function traverse(current, level) {
        for (const [key, value] of Object.entries(current)) {
          md += `${'#'.repeat(level)} ${key}\n\n`;
          
          if (typeof value === 'object' &amp;&amp; value !== null) {
            if (Array.isArray(value)) {
              value.forEach((item, idx) => {
                md += `- Item ${idx + 1}: ${JSON.stringify(item)}\n`;
              });
            } else {
              traverse(value, level + 1);
            }
          } else {
            md += `${value}\n\n`;
          }
        }
      }
      
      traverse(obj, titleLevel);
      return md;
    }

    function downloadMarkdown() {
      if (!markdownOutput) {
        alert('Converta o JSON primeiro!');
        return;
      }
      
      const blob = new Blob([markdownOutput], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'documento-convertido.md';
      a.click();
      URL.revokeObjectURL(url);
    }

    function copyToClipboard() {
      if (!markdownOutput) {
        alert('Converta o JSON primeiro!');
        return;
      }
      navigator.clipboard.writeText(markdownOutput).then(() => {
        alert('✅ Copiado para clipboard!');
      });
    }

    function clearAll() {
      if (confirm('Tem certeza? Vai limpar tudo!')) {
        jsonData = null;
        markdownOutput = '';
        document.getElementById('output').textContent = '';
        document.getElementById('jsonFile').value = '';
      }
    }
  </script>
</body>

<body>
  <div class=&quot;container&quot;>
    <h1>📝 Markdown → HTML com Pontos de Referência</h1>
    
    <div class=&quot;section&quot; id=&quot;markdown&quot;>
      <h2>Markdown</h2>
      <textarea id=&quot;markdownInput&quot; placeholder=&quot;Cole seu Markdown aqui...&quot;></textarea>
      <button onclick=&quot;convertMarkdownToHtml()&quot;>🔄 Converter</button>
      <button onclick=&quot;loadSample()&quot;>📋 Carregar Exemplo</button>
    </div>
    
    <div class=&quot;section&quot; id=&quot;htmlOutput&quot;>
      <h2>HTML Gerado</h2>
      <div id=&quot;htmlPreview&quot; style=&quot;background: #1a1a1a; padding: 15px; border-radius: 4px; min-height: 300px; border: 1px solid #00ff00; overflow-y: auto;&quot;></div>
      <button onclick=&quot;downloadHtml()&quot;>⬇️ Baixar HTML</button>
      <button onclick=&quot;copyHtmlToClipboard()&quot;>📋 Copiar HTML</button>
    </div>
    
    <div class=&quot;section&quot; id=&quot;references&quot;>
      <h2>🔗 Pontos de Referência (Títulos e Seções)</h2>
      <div id=&quot;referenceList&quot;></div>
      <button onclick=&quot;copyAllReferences()&quot;>📋 Copiar Todas as Referências</button>
    </div>
  </div>

  <script>
    let htmlContent = '';
    let references = [];

    function convertMarkdownToHtml() {
      const markdown = document.getElementById('markdownInput').value;
      
      // Simples conversão Markdown → HTML
      let html = markdown
        .replace(/^### (.*?)$/gm, '<h3>$1</h3>')
        .replace(/^## (.*?)$/gm, '<h2>$1</h2>')
        .replace(/^# (.*?)$/gm, '<h1>$1</h1>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href=&quot;$2&quot;>$1</a>')
        .replace(/^- (.*?)$/gm, '<li>$1</li>')
        .replace(/(<li>.*?<\/li>)/s, '<ul>$1</ul>')
        .replace(/\n\n/g, '</p><p>')
        .replace(/^/gm, '<p>')
        .replace(/$/gm, '</p>')
        .replace(/<p><\/p>/g, '');
      
      // Extrai referências
      extractReferences(markdown);
      
      // Adiciona IDs aos títulos
      html = html.replace(/<h([1-6])>(.*?)<\/h\1>/g, (match, level, text) => {
        const id = text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        return `<h${level} id=&quot;${id}&quot;>${text}</h${level}>`;
      });
      
      htmlContent = html;
      document.getElementById('htmlPreview').innerHTML = html;
      updateReferences();
    }

    function extractReferences(markdown) {
      references = [];
      const lines = markdown.split('\n');
      
      lines.forEach((line, index) => {
        if (line.match(/^#+\s/)) {
          const level = line.match(/^#+/)[0].length;
          const text = line.replace(/^#+\s/, '').trim();
          const id = text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

    function updateReferences() {

          </div>

        list.appendChild(item);
      });
    }

    function copyReference(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('✅ Copiado: ' + text);
      });
    }

    function copyAllReferences() {
      const refs = references.map(r => `[${r.text}](#${r.id})`).join('\n');

</body>

      const blob = new Blob([fullHtml], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');

    <div class=&quot;grid&quot;>

  <script>
    let plans = [];

    function createPlan() {

      if (!name) {
        alert('Digite um nome para o plano!');
        return;
      }
      
      currentPlan = {
        name,
        description,
        sections: sections.map(s => ({ name: s, points: [] })),
        createdAt: new Date().toLocaleString('pt-BR')
      };
      
      plans.push(currentPlan);
      updateUI();
      clearForm();
    }

    function addPoint() {
      if (!currentPlan) {
        alert('Crie um plano primeiro!');
        return;
      }
      
      const sectionName = document.getElementById('sectionSelect').value;
      const title = document.getElementById('pointTitle').value;
      const content = document.getElementById('pointContent').value;
      
      if (!title) {
        alert('Digite um título!');
        return;
      }
      
      const section = currentPlan.sections.find(s => s.name === sectionName);
      if (section) {
        section.points.push({

      updateUI();
      clearForm();
    }

      const sectionSelect = document.getElementById('sectionSelect');
      sectionSelect.innerHTML = '';
      
      if (currentPlan) {
        currentPlan.sections.forEach(section => {

          option.value = section.name;
          option.textContent = section.name;
          sectionSelect.appendChild(option);
        });
      }
      
      updatePlansList();

      list.innerHTML = '';
      
      plans.forEach((plan, planIndex) => {

                <strong>${section.name}</strong> (${section.points.length} pontos)
                ${section.points.map(point => `

                    • ${point.title}
                  </div>

      let markdown = '';
      
      plans.forEach(plan => {
        markdown += `# ${plan.name}\n\n`;
        markdown += `${plan.description}\n\n`;
        markdown += `*Criado em: ${plan.createdAt}*\n\n`;
        
        plan.sections.forEach(section => {
          markdown += `## ${section.name}\n\n`;
          section.points.forEach(point => {
            markdown += `### ${point.title}\n\n`;
            markdown += `${point.content}\n\n`;

      });
      
      document.getElementById('output').value = markdown;
    }

    function generateJson() {

        plans = [];
        currentPlan = null;
        updateUI();
      }
    }
  </script>

<body>

<header>

<script>
'use strict';

let rawMarkdown = '';
let currentFileName = '';
let searchHits = [];
let searchIdx = 0;

/*══════════════════════════════════════════════════════════════════
  CONFIG MARKED
══════════════════════════════════════════════════════════════════*/
marked.setOptions({
  breaks: true,
  gfm: true,
  headerIds: true,
  mangle: false,
});

// Renderer customizado pra blocos de código
const renderer = new marked.Renderer();
renderer.code = function(code, lang) {
  const language = (lang || '').toLowerCase().trim() || 'texto';
  let highlighted = escapeHTML(code);
  try {
    if (lang &amp;&amp; hljs.getLanguage(lang)) {
      highlighted = hljs.highlight(code, { language: lang }).value;
    } else {
      highlighted = hljs.highlightAuto(code).value;
    }
  } catch(e) { /* fallback pra escape */ }

  const safeCode = escapeAttr(code);
  return (
    '<div class=&quot;code-wrap&quot;>'+
      '<div class=&quot;code-head&quot;>'+
        '<span class=&quot;code-lang&quot;>'+language+'</span>'+
        '<button class=&quot;code-copy&quot; data-code=&quot;'+safeCode+'&quot;>📋 Copiar código</button>'+
      '</div>'+
      '<pre><code class=&quot;hljs language-'+language+'&quot;>'+highlighted+'</code></pre>'+
    '</div>'
  );
};

// Headings com botões de copiar seção
renderer.heading = function(text, level, raw) {
  const slug = slugify(raw);
  return (
    '<h'+level+' id=&quot;'+slug+'&quot; data-heading=&quot;'+level+'&quot; data-raw=&quot;'+escapeAttr(raw)+'&quot;>'+
      text+
      '<span class=&quot;section-copy&quot;>'+
        '<button onclick=&quot;copySection(\''+slug+'\')&quot; title=&quot;Copiar essa seção inteira&quot;>📋 Seção</button>'+
        '<button onclick=&quot;copySectionMD(\''+slug+'\')&quot; title=&quot;Copiar a seção em Markdown&quot;>📝 MD</button>'+
      '</span>'+
    '</h'+level+'>'
  );
};

marked.use({ renderer });

/*══════════════════════════════════════════════════════════════════
  CARREGAR ARQUIVO
══════════════════════════════════════════════════════════════════*/
function loadFile(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  e.target.value = '';
  readFile(file);
}

function readFile(file) {
  currentFileName = file.name;
  const reader = new FileReader();
  reader.onload = ev => {
    rawMarkdown = ev.target.result || '';
    render();
    toast('✓ '+file.name+' carregado');
  };
  reader.onerror = () => toast('Erro ao ler arquivo','err');
  reader.readAsText(file, 'UTF-8');
}

/*══════════════════════════════════════════════════════════════════
  RENDERIZAR
══════════════════════════════════════════════════════════════════*/
function render() {
  if (!rawMarkdown) return;
  const html = marked.parse(rawMarkdown);
  const content = document.getElementById('content');
  content.innerHTML = '<div class=&quot;md&quot; id=&quot;md&quot;>'+html+'</div>';
  document.getElementById('exportBtn').style.display = '';
  document.getElementById('docTitle').textContent = currentFileName || 'Documento';
  buildTOC();
  bindCodeCopies();
}

function buildTOC() {
  const list = document.getElementById('tocList');
  const headings = document.querySelectorAll('#md h1, #md h2, #md h3, #md h4, #md h5, #md h6');
  if (!headings.length) {
    list.innerHTML = '<div style=&quot;font-size:12px;color:var(--muted);text-align:center;padding:20px 10px&quot;>Documento sem títulos</div>';
    return;
  }
  list.innerHTML = '';
  headings.forEach(h => {
    const lvl = h.tagName.toLowerCase();
    const id  = h.id;
    const txt = h.dataset.raw || h.textContent.replace(/📋.*$/,'').trim();
    const item = document.createElement('div');
    item.className = 'toc-item ' + lvl;
    item.innerHTML =
      '<span class=&quot;toc-text&quot; title=&quot;'+escapeAttr(txt)+'&quot;>'+escapeHTML(txt)+'</span>'+
      '<button class=&quot;toc-copy&quot; title=&quot;Copiar essa seção&quot; onclick=&quot;event.stopPropagation();copySection(\''+id+'\')&quot;>📋</button>';
    item.onclick = () => {
      document.getElementById(id)?.scrollIntoView({ behavior:'smooth', block:'start' });
      if (window.innerWidth <= 768) toggleTOC();
      document.querySelectorAll('.toc-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
    };
    list.appendChild(item);
  });
}

function bindCodeCopies() {
  document.querySelectorAll('.code-copy').forEach(btn => {
    btn.onclick = () => {
      const code = btn.dataset.code || '';
      navigator.clipboard.writeText(decodeAttr(code)).then(() => {
        const orig = btn.innerHTML;
        btn.innerHTML = '✓ Copiado!';
        setTimeout(() => btn.innerHTML = orig, 1500);
      });
    };
  });
}

/*══════════════════════════════════════════════════════════════════
  COPIAR SEÇÃO
══════════════════════════════════════════════════════════════════*/
function copySection(headingId, asMarkdown) {
  const h = document.getElementById(headingId);
  if (!h) return;
  const level = parseInt(h.dataset.heading || '1');

  // Coleta todos os elementos da seção (até o próximo heading de nível <= )
  const elements = [h];
  let el = h.nextElementSibling;
  while (el) {
    if (/^H[1-6]$/.test(el.tagName)) {
      const lvl = parseInt(el.dataset.heading || el.tagName[1]);
      if (lvl <= level) break;
    }
    elements.push(el);
    el = el.nextElementSibling;
  }

  let text;
  if (asMarkdown) {
    text = extractMarkdownSection(headingId);
  } else {
    text = elements.map(e => extractText(e)).join('\n\n').trim();
  }

  navigator.clipboard.writeText(text).then(() => {
    toast('✓ Seção copiada ('+text.length+' caracteres)');
  }).catch(() => toast('Erro ao copiar','err'));
}

function copySectionMD(headingId) {
  copySection(headingId, true);
}

function extractText(el) {
  // Mantém quebras de bloco de código
  if (el.classList?.contains('code-wrap')) {
    const lang = el.querySelector('.code-lang')?.textContent || '';
    const code = decodeAttr(el.querySelector('.code-copy')?.dataset.code || '');
    return '```'+lang+'\n'+code+'\n```';
  }
  // Heading
  if (/^H[1-6]$/.test(el.tagName)) {
    const lvl = parseInt(el.tagName[1]);
    const raw = el.dataset.raw || el.textContent.replace(/📋.*$/,'').trim();
    return '#'.repeat(lvl)+' '+raw;
  }
  return el.innerText || el.textContent || '';
}

/* Extrai a seção do MD bruto (mais fiel) */
function extractMarkdownSection(headingId) {
  const lines = rawMarkdown.split('\n');
  const headings = [];
  lines.forEach((line, i) => {
    const m = line.match(/^(#{1,6})\s+(.+?)\s*$/);
    if (m) headings.push({ idx:i, level:m[1].length, text:m[2], slug:slugify(m[2]) });
  });
  const start = headings.find(h => h.slug === headingId);
  if (!start) return '';
  const next = headings.find(h => h.idx > start.idx &amp;&amp; h.level <= start.level);
  const endIdx = next ? next.idx : lines.length;
  return lines.slice(start.idx, endIdx).join('\n').trim();
}

/*══════════════════════════════════════════════════════════════════
  EXPORTAR HTML
══════════════════════════════════════════════════════════════════*/
function exportHTML() {
  if (!rawMarkdown) return;
  const md = document.getElementById('md');
  if (!md) return;

  // CSS embutido pra o HTML ficar standalone bonito
  const css = `
    body{font-family:Georgia,Cambria,'Times New Roman',serif;max-width:860px;margin:30px auto;padding:0 24px;color:#222;line-height:1.7;background:#fafafa}
    h1,h2,h3,h4{color:#2d4a1e;margin-top:28px;margin-bottom:12px}
    h1{border-bottom:2px solid #5aab56;padding-bottom:8px}
    h2{border-bottom:1px solid #ccc;padding-bottom:6px}
    a{color:#0066cc}
    code{background:#eee;padding:2px 5px;border-radius:3px;font-family:Consolas,monospace;font-size:90%}
    pre{background:#0d1309;color:#a8d5a2;padding:14px;border-radius:6px;overflow-x:auto;font-size:13px;line-height:1.5}
    pre code{background:transparent;color:inherit;padding:0}
    blockquote{border-left:4px solid #5aab56;padding:6px 14px;margin:14px 0;background:#f0f7ed;color:#444}
    table{border-collapse:collapse;margin:14px 0;width:100%}
    th,td{border:1px solid #ccc;padding:8px 12px;text-align:left}
    th{background:#e8f5e9}
    .copy-btn{font-size:11px;padding:4px 10px;border:1px solid #5aab56;background:#fff;color:#2d4a1e;border-radius:5px;cursor:pointer;margin-left:8px}
    .copy-btn:hover{background:#5aab56;color:#fff}
    .code-wrap{position:relative;margin:14px 0}
    .code-wrap .copy-btn{position:absolute;top:8px;right:8px}
    @media print{.copy-btn{display:none}body{background:#fff}}
  `;

  // Clona conteúdo e adiciona botões de copiar funcionais (com JS embutido)
  const clone = md.cloneNode(true);
  // Remove botões antigos de seção
  clone.querySelectorAll('.section-copy').forEach(s => s.remove());
  // Substitui code-wrap pra simplificar
  clone.querySelectorAll('.code-wrap').forEach(w => {
    const code = decodeAttr(w.querySelector('.code-copy')?.dataset.code || '');
    const lang = w.querySelector('.code-lang')?.textContent || '';
    const newWrap = document.createElement('div');
    newWrap.className = 'code-wrap';
    newWrap.innerHTML =
      '<button class=&quot;copy-btn&quot; data-code=&quot;'+escapeAttr(code)+'&quot;>📋 Copiar</button>'+
      '<pre><code class=&quot;language-'+lang+'&quot;>'+escapeHTML(code)+'</code></pre>';
    w.replaceWith(newWrap);
  });
  // Adiciona botão em cada heading
  clone.querySelectorAll('h1,h2,h3,h4').forEach(h => {
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = '📋 Seção';
    btn.dataset.section = h.id;
    h.appendChild(btn);
  });

  const script = `
    <script>
    document.querySelectorAll('.copy-btn[data-code]').forEach(b=>{
      b.onclick=()=>{navigator.clipboard.writeText(b.dataset.code);b.textContent='✓ Copiado!';setTimeout(()=>b.textContent='📋 Copiar',1500)};
    });
    document.querySelectorAll('.copy-btn[data-section]').forEach(b=>{
      b.onclick=()=>{
        const h=document.getElementById(b.dataset.section);
        const lvl=parseInt(h.tagName[1]);
        let txt=h.innerText.replace('📋 Seção','').trim()+'\\n\\n';
        let el=h.nextElementSibling;
        while(el){
          if(/^H[1-6]$/.test(el.tagName)&amp;&amp;parseInt(el.tagName[1])<=lvl)break;
          txt+=el.innerText+'\\n\\n';
          el=el.nextElementSibling;
        }
        navigator.clipboard.writeText(txt.trim());
        b.textContent='✓ Copiado!';setTimeout(()=>b.textContent='📋 Seção',1500);
      };
    });
    <\/script>
  `;

  const fullHTML =
    '<!DOCTYPE html><html lang=&quot;pt-BR&quot;><head><meta charset=&quot;UTF-8&quot;>'+
    '<meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1.0&quot;>'+
    '<title>'+escapeHTML(currentFileName||'Documento')+'</title>'+
    '<style>'+css+'</style></head><body>'+
    '<h1 style=&quot;border:none&quot;>'+escapeHTML(currentFileName||'Documento')+'</h1>'+
    clone.outerHTML+
    script+
    '</body></html>';

  const blob = new Blob([fullHTML], { type:'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (currentFileName.replace(/\.(md|markdown|mdx|txt)$/i,'') || 'documento') + '.html';
  a.click();
  toast('💾 HTML exportado!');
}

/*══════════════════════════════════════════════════════════════════
  BUSCA
══════════════════════════════════════════════════════════════════*/
function toggleSearch() {
  const bar = document.getElementById('searchBar');
  const show = !bar.classList.contains('show');
  bar.classList.toggle('show', show);
  if (show) {
    document.getElementById('searchInput').focus();
  } else {
    clearSearch();
  }
}

function clearSearch() {
  document.querySelectorAll('mark.search-hit').forEach(m => {
    const parent = m.parentNode;
    parent.replaceChild(document.createTextNode(m.textContent), m);
    parent.normalize();
  });
  searchHits = [];
  searchIdx = 0;
  document.getElementById('searchCount').textContent = '0/0';
}

function doSearch() {
  clearSearch();
  const q = document.getElementById('searchInput').value.trim();
  if (!q || q.length < 2) { document.getElementById('searchCount').textContent='0/0'; return; }

  const md = document.getElementById('md');
  if (!md) return;

  const re = new RegExp(escapeRegex(q), 'gi');
  walkAndHighlight(md, re);
  searchHits = [...document.querySelectorAll('mark.search-hit')];
  searchIdx = 0;
  if (searchHits.length) {
    searchHits[0].classList.add('current');
    searchHits[0].scrollIntoView({ behavior:'smooth', block:'center' });
  }
  document.getElementById('searchCount').textContent = (searchHits.length ? 1 : 0) + '/' + searchHits.length;
}

function walkAndHighlight(node, re) {
  if (node.nodeType === 3) { // text
    const text = node.nodeValue;
    if (!re.test(text)) return;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const mark = document.createElement('mark');
      mark.className = 'search-hit';
      mark.textContent = m[0];
      frag.appendChild(mark);
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  } else if (node.nodeType === 1 &amp;&amp; !['SCRIPT','STYLE','MARK'].includes(node.tagName)) {
    [...node.childNodes].forEach(c => walkAndHighlight(c, re));
  }
}

function searchKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (!searchHits.length) return;
    searchHits[searchIdx].classList.remove('current');
    searchIdx = e.shiftKey
      ? (searchIdx - 1 + searchHits.length) % searchHits.length
      : (searchIdx + 1) % searchHits.length;
    searchHits[searchIdx].classList.add('current');
    searchHits[searchIdx].scrollIntoView({ behavior:'smooth', block:'center' });
    document.getElementById('searchCount').textContent = (searchIdx+1)+'/'+searchHits.length;
  } else if (e.key === 'Escape') {
    toggleSearch();
  }
}

/*══════════════════════════════════════════════════════════════════
  TOC TOGGLE
══════════════════════════════════════════════════════════════════*/
function toggleTOC() {
  const toc = document.getElementById('toc');
  const bd  = document.getElementById('backdrop');
  if (window.innerWidth <= 768) {
    const show = !toc.classList.contains('show-mobile');
    toc.classList.toggle('show-mobile', show);
    bd.classList.toggle('show', show);
  } else {
    toc.classList.toggle('hidden');
  }
  document.getElementById('tocToggle').classList.toggle('active');
}

/*══════════════════════════════════════════════════════════════════
  DRAG &amp; DROP / PASTE
══════════════════════════════════════════════════════════════════*/
const dz = document.getElementById('dropZone');
['dragenter','dragover'].forEach(ev => {
  document.addEventListener(ev, e => {
    e.preventDefault();
    dz?.classList.add('dragover');
  });
});
['dragleave','drop'].forEach(ev => {
  document.addEventListener(ev, e => {
    e.preventDefault();
    dz?.classList.remove('dragover');
  });
});
document.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer?.files?.[0];
  if (f) readFile(f);
});

document.addEventListener('paste', e => {
  if (document.activeElement?.tagName === 'INPUT') return;
  const txt = e.clipboardData?.getData('text');
  if (txt &amp;&amp; txt.length > 50) {
    rawMarkdown = txt;
    currentFileName = 'colado.md';
    render();
    toast('✓ Texto colado renderizado');
  }
});

/*══════════════════════════════════════════════════════════════════
  ATALHOS
══════════════════════════════════════════════════════════════════*/
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) &amp;&amp; e.key === 'f') {
    e.preventDefault();
    toggleSearch();
  }
});

/*══════════════════════════════════════════════════════════════════
  UTILS
══════════════════════════════════════════════════════════════════*/
function escapeHTML(s) {
  return String(s)
    .replace(/&amp;/g,'&amp;amp;').replace(/</g,'&amp;lt;')
    .replace(/>/g,'&amp;gt;').replace(/&quot;/g,'&amp;quot;').replace(/'/g,'&amp;#39;');
}
function escapeAttr(s) { return escapeHTML(s); }
function decodeAttr(s) {
  return String(s)
    .replace(/&amp;#39;/g,&quot;'&quot;).replace(/&amp;quot;/g,'&quot;')
    .replace(/&amp;gt;/g,'>').replace(/&amp;lt;/g,'<').replace(/&amp;amp;/g,'&amp;');
}
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&amp;'); }
function slugify(s) {
  return String(s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s-]/g,'')
    .trim().replace(/\s+/g,'-').replace(/-+/g,'-');
}

let toastTimer;
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', type === 'err');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
