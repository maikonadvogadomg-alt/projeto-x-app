// ══════════════════════════════════════════════════════
//  EXPORTAR WORD (DOCX)
// ══════════════════════════════════════════════════════
function baixarWord() {
  if (!resultado || !window.docx) { alert('Biblioteca docx não carregada.'); return; }
  
  const { Document, Paragraph, TextRun, AlignmentType, HeadingLevel } = docx;
  const paragrafos = resultado.split(/\n{2,}/).map(block =&amp;gt; {
    const t = block.trim();
    if (!t) return null;
    
    const isTitulo = t === t.toUpperCase() &amp;amp;&amp;amp; t.length &amp;gt; 2 &amp;amp;&amp;amp; /[A-Z]/.test(t) &amp;amp;&amp;amp; !/^\d/.test(t);
    
    if (isTitulo) {
      return new Paragraph({
        text: t,
        heading: HeadingLevel.HEADING_1,
        alignment: AlignmentType.CENTER,
        spacing: { before: 240, after: 120 }
      });
    }
    
    return new Paragraph({
      children: [new TextRun(t)],
      alignment: AlignmentType.JUSTIFIED,
      indent: { firstLine: 1134 },
      spacing: { line: 360 }
    });
  }).filter(Boolean);

  const doc = new Document({
    sections: [{
      properties: {},
      children: paragrafos
    }]
  });

  docx.Packer.toBlob(doc).then(blob =&amp;gt; {
    saveAs(blob, `juridico-${Date.now()}.docx`);
  });
}

async function enviarChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim(); if (!msg || !resultado) return;
  input.value = '';
  chatHistory.push({ role: 'user', content: msg });
  renderChat();
  const kg = getChaveGeracao();
  const kr = getChaveResumo();
  const chave = kg || kr;
  if (!chave) { chatHistory.push({ role:'assistant', content:'⚠️ Configure uma chave de API para usar o chat.' }); renderChat(); return; }
  try {
    const resposta = await chamarIA(chave, chatHistory);
    chatHistory.push({ role:'assistant', content: resposta });
    if (resposta.length &amp;gt; resultado.length * 0.5 &amp;amp;&amp;amp; !resposta.toLowerCase().startsWith('para'))
      resultado = resposta;
    renderChat();
    renderResultado(resultado);
  } catch(e) {
    chatHistory.push({ role:'assistant', content:'❌ Erro: ' + e.message });
    renderChat();
  }
}
document.getElementById('chat-input')?.addEventListener('keydown', e =&amp;gt; {
  if (e.key === 'Enter' &amp;amp;&amp;amp; !e.shiftKey) { e.preventDefault(); enviarChat(); }
});
function renderChat() {
  const container = document.getElementById('chat-msgs');
  container.innerHTML = '';
  chatHistory.filter(m =&amp;gt; m.role !== 'system').forEach(m =&amp;gt; {
    const div = document.createElement('div');
    div.className = m.role === 'user' ? 'msg-user' : 'msg-ia';
    const role = document.createElement('div');
    role.className = 'msg-role';
    role.textContent = m.role === 'user' ? 'Você' : 'IA';
    div.appendChild(role);
    div.appendChild(document.createTextNode(m.content));
    container.appendChild(div);
  });
  container.scrollTop = container.scrollHeight;
}

  saveLS('aj_formatacao', formatacaoAtual);
}

function limparEditor() {
  if (!confirm('Limpar todo o conteúdo do editor?')) return;
  document.getElementById('editor-content').innerHTML = '&amp;lt;p&amp;gt;Digite ou cole seu texto aqui para formatar...&amp;lt;/p&amp;gt;';
  salvarEditorAuto();
}

function enviarParaEditor() {
  if (!resultado) return;
  document.getElementById('editor-content').innerHTML = resultado.split('\n\n').map(p =&amp;gt; `&amp;lt;p&amp;gt;${p}&amp;lt;/p&amp;gt;`).join('');
  salvarEditorAuto();
  mudarAba('editor', document.querySelectorAll('.tab-btn')[1]);
}

async function gerarPecaDoEditor() {
  const conteudo = document.getElementById('editor-content').innerText.trim();
  if (!conteudo) { alert('Editor vazio.'); return; }
  
  document.getElementById('txt-processo').value = conteudo;
  mudarAba('processar', document.querySelector('.tab-btn'));
  await executar('modo-redacao');
}

function baixarEditorWord() {
  const conteudo = document.getElementById('editor-content').innerText.trim();
  if (!conteudo || !window.docx) { alert('Editor vazio ou biblioteca não carregada.'); return; }
  
  const { Document, Paragraph, TextRun, AlignmentType } = docx;
  const paragrafos = conteudo.split(/\n{2,}/).map(t =&amp;gt; {
    if (!t.trim()) return null;
    return new Paragraph({
      children: [new TextRun(t.trim())],
      alignment: AlignmentType.JUSTIFIED,
      indent: { firstLine: formatacaoAtual.recuo * 567 },
      spacing: { line: formatacaoAtual.espacamento * 240 }
    });
  }).filter(Boolean);

  const doc = new Document({ sections: [{ properties: {}, children: paragrafos }] });
  docx.Packer.toBlob(doc).then(blob =&amp;gt; saveAs(blob, `editor-${Date.now()}.docx`));
}

function baixarEditorMarkdown() {
  const conteudo = document.getElementById('editor-content').innerText.trim();
  if (!conteudo) { alert('Editor vazio.'); return; }
  
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([conteudo], { type: 'text/markdown' }));
  a.download = `editor-${Date.now()}.md`;
  a.click();
}

function abrirFormTemplate(id) {

  if (id) {

function fecharModalTemplate() {
  document.getElementById('modal-template').classList.remove('aberto');
  editTemplateId = null;
}

function confirmarSalvarTemplate() {
  const nome = document.getElementById('tpl-nome').value.trim();
  if (!nome) { alert('Digite um nome para o template.'); return; }
  
  const desc = document.getElementById('tpl-desc').value.trim();
  const config = { ...formatacaoAtual };
  
  if (editTemplateId) {
    templates = templates.map(t =&amp;gt; t.id === editTemplateId ? { ...t, nome, descricao: desc, config } : t);
  } else {
    templates.push({
      id: Date.now().toString(),
      nome,
      descricao: desc,
      config,
      criadoEm: new Date().toLocaleString('pt-BR')
    });
  }
  
  saveLS('aj_templates', templates);
  fecharModalTemplate();
  renderTemplates();
}

function deletarTemplate(id) {
  if (!confirm('Remover este template?')) return;
  templates = templates.filter(t =&amp;gt; t.id !== id);
  if (templateAtivo === id) {
    templateAtivo = null;
    saveLS('aj_template_ativo', null);
  }
  saveLS('aj_templates', templates);
  renderTemplates();
}

function ativarTemplate(id) {
  templateAtivo = id;
  saveLS('aj_template_ativo', id);
  renderTemplates();
}

function aplicarTemplateAtivo() {
  if (!templateAtivo) { alert('Selecione um template primeiro.'); return; }
  const tpl = templates.find(t =&amp;gt; t.id === templateAtivo);
  if (!tpl) return;
  
  formatacaoAtual = { ...tpl.config };
  
  document.getElementById('ed-fonte').value = formatacaoAtual.fonte;
  document.getElementById('ed-tamanho').value = formatacaoAtual.tamanho;
  document.getElementById('ed-recuo').value = formatacaoAtual.recuo;
  document.getElementById('ed-espacamento').value = formatacaoAtual.espacamento;
  
  ['bold','italic','underline'].forEach(t =&amp;gt; {
    document.getElementById(`fmt-${t}`).classList.toggle('ativo', formatacaoAtual[t]);
  });
  
  ['left','center','right','justify'].forEach(a =&amp;gt; {
    document.getElementById(`align-${a}`).classList.toggle('ativo', a === formatacaoAtual.alinhamento);
  });
  
  aplicarFormatacao();
  alert(`Template &amp;quot;${tpl.nome}&amp;quot; aplicado!`);
}

//  FUNÇÕES DE FILTROS
// ══════════════════════════════════════════════════════
function carregarFiltros() {
  const filtrosSalvos = loadLS('aj_filtros', {});
  
  if (filtrosSalvos.regexManter) document.getElementById('regex-manter').value = filtrosSalvos.regexManter.join('\n');
  if (filtrosSalvos.regexExcluir) document.getElementById('regex-excluir').value = filtrosSalvos.regexExcluir.join('\n');
  if (filtrosSalvos.termosManter) document.getElementById('termos-manter').value = filtrosSalvos.termosManter.join(', ');
  if (filtrosSalvos.termosExcluir) document.getElementById('termos-excluir').value = filtrosSalvos.termosExcluir.join(', ');
  
  document.getElementById('filtro-ocr').checked = filtrosSalvos.limparOCR !== false;
  document.getElementById('filtro-markdown').checked = filtrosSalvos.limparMarkdown !== false;
  document.getElementById('filtro-certificados').checked = filtrosSalvos.limparCertificados !== false;
}

function salvarFiltros() {
  const regexManter = document.getElementById('regex-manter').value.split('\n').filter(Boolean);
  const regexExcluir = document.getElementById('regex-excluir').value.split('\n').filter(Boolean);
  const termosManter = document.getElementById('termos-manter').value.split(',').map(t =&amp;gt; t.trim()).filter(Boolean);
  const termosExcluir = document.getElementById('termos-excluir').value.split(',').map(t =&amp;gt; t.trim()).filter(Boolean);
  
  const filtros = {
    regexManter,
    regexExcluir,
    termosManter,
    termosExcluir,
    limparOCR: document.getElementById('filtro-ocr').checked,
    limparMarkdown: document.getElementById('filtro-markdown').checked,
    limparCertificados: document.getElementById('filtro-certificados').checked
  };
  
  saveLS('aj_filtros', filtros);
  filtrosAtivos = filtros;
}

function adicionarRegexPreset(tipo, preset) {
  const presets = {
    manter: {
      ementa: '^EMENTA.*|^Ementa.*',
      acordao: '^ACÓRDÃO.*|^Acórdão.*',
      sentenca: '^SENTENÇA.*|^Sentença.*|^DECISÃO.*'
    },
    excluir: {
      pagina: '^Página \\d+.*|^Pág\\. \\d+.*|^\\d+/\\d+$',
      certificado: '.*[Cc]ertificado [Dd]igital.*|.*[Aa]ssinado eletronicamente.*|.*[Aa]ssinatura [Ee]letrônica.*',
      cabecalho: '^PODER JUDICIÁRIO.*|^TRIBUNAL.*|^JUSTIÇA.*'
    }
  };
  
  const campo = tipo === 'manter' ? 'regex-manter' : 'regex-excluir';
  const textarea = document.getElementById(campo);
  const valor = textarea.value.trim();
  const novoValor = valor ? valor + '\n' + presets[tipo][preset] : presets[tipo][preset];
  textarea.value = novoValor;
  salvarFiltros();
}

function limparTexto(texto) {
  let resultado = texto;
  
  // Limpar OCR
  if (filtrosAtivos.limparOCR) {
    // Remover caracteres estranhos comuns em OCR
    resultado = resultado.replace(/[�]/g, '');
    resultado = resultado.replace(/\s{3,}/g, ' ');
    resultado = resultado.replace(/\n{4,}/g, '\n\n\n');
    resultado = resultado.replace(/[^\S\n]{2,}/g, ' ');
  }
  
  // Limpar Markdown
  if (filtrosAtivos.limparMarkdown) {
    resultado = resultado.replace(/^#{1,6}\s+/gm, '');
    resultado = resultado.replace(/\*\*(.+?)\*\*/g, '$1');
    resultado = resultado.replace(/__(.+?)__/g, '$1');
    resultado = resultado.replace(/\*(.+?)\*/g, '$1');
    resultado = resultado.replace(/_(.+?)_/g, '$1');
    resultado = resultado.replace(/~~(.+?)~~/g, '$1');
    resultado = resultado.replace(/`(.+?)`/g, '$1');
  }
  
  // Limpar certificados
  if (filtrosAtivos.limparCertificados) {
    const linhas = resultado.split('\n');
    resultado = linhas.filter(linha =&amp;gt; {
      const l = linha.toLowerCase();
      return !l.includes('certificado digital') &amp;amp;&amp;amp;
             !l.includes('assinado eletronicamente') &amp;amp;&amp;amp;
             !l.includes('assinatura eletrônica') &amp;amp;&amp;amp;
             !l.includes('documento assinado digitalmente') &amp;amp;&amp;amp;
             !/^[A-F0-9]{32,}$/.test(linha.trim());
    }).join('\n');
  }
  
  return resultado;
}

function aplicarFiltros() {
  salvarFiltros();
  
  const textoProcesso = document.getElementById('txt-processo').value.trim();
  if (!textoProcesso) {
    alert('Cole um texto na aba Processar primeiro.');
    return;
  }
  
  textoOriginal = textoProcesso;
  let texto = limparTexto(textoOriginal);
  
  const linhas = texto.split('\n');
  let linhasMantidas = [...linhas];
  let linhasExcluidas = [];
  
  // Aplicar filtros de regex para manter
  if (filtrosAtivos.regexManter &amp;amp;&amp;amp; filtrosAtivos.regexManter.length &amp;gt; 0) {
    const regexs = filtrosAtivos.regexManter.map(r =&amp;gt; {
      try { return new RegExp(r, 'i'); } catch { return null; }
    }).filter(Boolean);
    
    if (regexs.length &amp;gt; 0) {
      const novasLinhasMantidas = [];
      linhasMantidas.forEach(linha =&amp;gt; {
        const mantida = regexs.some(regex =&amp;gt; regex.test(linha));
        if (mantida) novasLinhasMantidas.push(linha);
        else linhasExcluidas.push(linha);
      });
      linhasMantidas = novasLinhasMantidas;
    }
  }
  
  // Aplicar filtros de regex para excluir
  if (filtrosAtivos.regexExcluir &amp;amp;&amp;amp; filtrosAtivos.regexExcluir.length &amp;gt; 0) {
    const regexs = filtrosAtivos.regexExcluir.map(r =&amp;gt; {
      try { return new RegExp(r, 'i'); } catch { return null; }
    }).filter(Boolean);
    
    if (regexs.length &amp;gt; 0) {
      const novasLinhasMantidas = [];
      linhasMantidas.forEach(linha =&amp;gt; {
        const excluida = regexs.some(regex =&amp;gt; regex.test(linha));
        if (excluida) linhasExcluidas.push(linha);
        else novasLinhasMantidas.push(linha);
      });
      linhasMantidas = novasLinhasMantidas;
    }
  }
  
  // Aplicar filtros por termo para manter
  if (filtrosAtivos.termosManter &amp;amp;&amp;amp; filtrosAtivos.termosManter.length &amp;gt; 0) {
    const paragrafos = linhasMantidas.join('\n').split(/\n\n+/);
    const paragrafosMantidos = [];
    const paragrafosExcluidos = [];
    
    paragrafos.forEach(p =&amp;gt; {
      const mantido = filtrosAtivos.termosManter.some(termo =&amp;gt; 
        p.toLowerCase().includes(termo.toLowerCase())
      );
      if (mantido) paragrafosMantidos.push(p);
      else paragrafosExcluidos.push(p);
    });
    
    linhasMantidas = paragrafosMantidos.join('\n\n').split('\n');
    linhasExcluidas.push(...paragrafosExcluidos.join('\n\n').split('\n'));
  }
  
  // Aplicar filtros por termo para excluir
  if (filtrosAtivos.termosExcluir &amp;amp;&amp;amp; filtrosAtivos.termosExcluir.length &amp;gt; 0) {
    const paragrafos = linhasMantidas.join('\n').split(/\n\n+/);
    const paragrafosMantidos = [];
    const paragrafosExcluidos = [];
    
    paragrafos.forEach(p =&amp;gt; {
      const excluido = filtrosAtivos.termosExcluir.some(termo =&amp;gt; 
        p.toLowerCase().includes(termo.toLowerCase())
      );
      if (excluido) paragrafosExcluidos.push(p);
      else paragrafosMantidos.push(p);
    });
    
    linhasMantidas = paragrafosMantidos.join('\n\n').split('\n');
    linhasExcluidas.push(...paragrafosExcluidos.join('\n\n').split('\n'));
  }
  
  textoFiltrado = linhasMantidas.join('\n').trim();
  textoExcluido = linhasExcluidas.join('\n').trim();
  
  // Atualizar estatísticas
  atualizarEstatisticas();
  
  // Mostrar resultado
  verTextoMantido();
}

function atualizarEstatisticas() {
  const lenOriginal = textoOriginal.length;
  const lenMantido = textoFiltrado.length;
  const lenExcluido = textoExcluido.length;
  const reducao = lenOriginal &amp;gt; 0 ? Math.round((lenExcluido / lenOriginal) * 100) : 0;
  
  document.getElementById('stat-original').textContent = lenOriginal.toLocaleString('pt-BR') + ' caracteres';
  document.getElementById('stat-mantido').textContent = lenMantido.toLocaleString('pt-BR') + ' caracteres';
  document.getElementById('stat-excluido').textContent = lenExcluido.toLocaleString('pt-BR') + ' caracteres';
  document.getElementById('stat-reducao').textContent = reducao + '%';
}

  const preview = document.getElementById('preview-filtros');

    preview.innerHTML = '&amp;lt;div class=&amp;quot;text-muted fs11&amp;quot; style=&amp;quot;text-align:center;padding:40px&amp;quot;&amp;gt;Nenhum texto filtrado ainda.&amp;lt;/div&amp;gt;';
    return;
  }
  preview.innerHTML = '';
  const pre = document.createElement('pre');
  pre.style.cssText = 'white-space:pre-wrap;font-family:monospace;font-size:11px;line-height:1.6;margin:0';
  pre.textContent = textoFiltrado;
  preview.appendChild(pre);
}

async function extrairTrechosRelevantes(ementa, contexto) {
  const kr = getChaveResumo();

  try {
    const prompt = `Extraia APENAS os trechos mais relevantes da ementa abaixo para o seguinte contexto jurídico. Mantenha citações literais e a fonte original.

CONTEXTO:
${contexto.substring(0, 500)}

      { role: 'user', content: prompt }

      ? `${textoFinal}\n\n---\nJURISPRUDÊNCIA E EMENTAS PARA CITAR (use apenas os trechos relevantes, mantendo as fontes):\n${jurisFull}`

const importarImagemOriginal = window.importarImagem;
window.importarImagem = async function(input) {
  const file = input.files[0]; input.value = '';
  if (!file) return;
  const sp = document.getElementById('import-spinner');
  sp.classList.remove('hidden');
  
  try {
    // Criar preview
    const img = new Image();
    img.src = URL.createObjectURL(file);
    await new Promise(resolve =&amp;gt; img.onload = resolve);
    
    // Pré-processar imagem para melhor OCR
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = img.width;
    canvas.height = img.height;
    
    // Aplicar filtros para melhorar OCR
    ctx.filter = 'contrast(1.2) brightness(1.1)';
    ctx.drawImage(img, 0, 0);
    
    // Converter para blob
    const blob = await new Promise(resolve =&amp;gt; canvas.toBlob(resolve, 'image/png'));
    
    // OCR com configurações otimizadas
    const worker = await Tesseract.createWorker('por', 1, {
      logger: m =&amp;gt; {
        if (m.status === 'recognizing text') {
          const pct = Math.round(m.progress * 100);
          atualizarResultado(`⏳ Processando OCR... ${pct}%`);
        }
      }
    });
    
    await worker.setParameters({
      tessedit_pageseg_mode: Tesseract.PSM.AUTO,
      preserve_interword_spaces: '1',
    });
    
    const { data: { text, confidence } } = await worker.recognize(blob);
    await worker.terminate();
    
    if (!text.trim()) throw new Error('Não foi possível extrair texto da imagem.');
    
    // Limpar texto automaticamente
    let textoLimpo = text;
    textoLimpo = textoLimpo.replace(/[�]/g, '');
    textoLimpo = textoLimpo.replace(/\s{3,}/g, ' ');
    textoLimpo = textoLimpo.replace(/\n{4,}/g, '\n\n');
    
    const ta = document.getElementById('txt-processo');
    ta.value = ta.value ? ta.value + '\n\n' + textoLimpo : textoLimpo;
    
    // Mostrar confiança
    const confPct = Math.round(confidence);
    atualizarResultado(`✅ OCR concluído! Confiança: ${confPct}%${confPct &amp;lt; 80 ? ' (revise o texto)' : ''}`);
    
  } catch(e) { 
    alert('Erro no OCR: ' + e.message); 
    atualizarResultado('');
  } finally { 
    sp.classList.add('hidden'); 
  }
};

// ── INDEXEDDB SETUP ──
let db = null;
const DB_NAME = 'AssistenteJuridicoProDB';
const DB_VERSION = 1;

async function initDB() {
  return new Promise((resolve, reject) =&amp;gt; {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    
    request.onerror = () =&amp;gt; reject(request.error);
    request.onsuccess = () =&amp;gt; {
      db = request.result;
      resolve(db);
    };
    
    request.onupgradeneeded = (event) =&amp;gt; {
      const db = event.target.result;
      
      // Store para documentos/peças
      if (!db.objectStoreNames.contains('documentos')) {
        const docStore = db.createObjectStore('documentos', { keyPath: 'id', autoIncrement: true });
        docStore.createIndex('tipo', 'tipo', { unique: false });
        docStore.createIndex('timestamp', 'timestamp', { unique: false });
        docStore.createIndex('tags', 'tags', { unique: false, multiEntry: true });
      }
      
      // Store para ementas
      if (!db.objectStoreNames.contains('ementas')) {
        const ementaStore = db.createObjectStore('ementas', { keyPath: 'id' });
        ementaStore.createIndex('categoria', 'categoria', { unique: false });
        ementaStore.createIndex('titulo', 'titulo', { unique: false });
      }
      
      // Store para templates
      if (!db.objectStoreNames.contains('templates')) {
        db.createObjectStore('templates', { keyPath: 'id' });
      }
      
      // Store para configurações
      if (!db.objectStoreNames.contains('config')) {
        db.createObjectStore('config', { keyPath: 'key' });
      }
      
      // Store para histórico
      if (!db.objectStoreNames.contains('historico')) {
        const histStore = db.createObjectStore('historico', { keyPath: 'id' });
        histStore.createIndex('timestamp', 'timestamp', { unique: false });
      }
    };
  });
}

// Funções auxiliares IndexedDB
async function salvarNoDB(storeName, data) {
  if (!db) await initDB();
  return new Promise((resolve, reject) =&amp;gt; {
    const transaction = db.transaction([storeName], 'readwrite');
    const store = transaction.objectStore(storeName);
    const request = store.put(data);
    request.onsuccess = () =&amp;gt; resolve(request.result);
    request.onerror = () =&amp;gt; reject(request.error);
  });
}

async function lerDoDB(storeName, key) {
  if (!db) await initDB();
  return new Promise((resolve, reject) =&amp;gt; {
    const transaction = db.transaction([storeName], 'readonly');
    const store = transaction.objectStore(storeName);
    const request = store.get(key);
    request.onsuccess = () =&amp;gt; resolve(request.result);
    request.onerror = () =&amp;gt; reject(request.error);
  });
}

async function listarDoDB(storeName) {
  if (!db) await initDB();
  return new Promise((resolve, reject) =&amp;gt; {
    const transaction = db.transaction([storeName], 'readonly');
    const store = transaction.objectStore(storeName);
    const request = store.getAll();
    request.onsuccess = () =&amp;gt; resolve(request.result);
    request.onerror = () =&amp;gt; reject(request.error);
  });
}

async function deletarDoDB(storeName, key) {
  if (!db) await initDB();
  return new Promise((resolve, reject) =&amp;gt; {
    const transaction = db.transaction([storeName], 'readwrite');
    const store = transaction.objectStore(storeName);
    const request = store.delete(key);
    request.onsuccess = () =&amp;gt; resolve();
    request.onerror = () =&amp;gt; reject(request.error);
  });
}

async function sincronizarComDB() {
  if (!db) await initDB();
  
  // Salvar ementas
  for (const ementa of ementas) {
    await salvarNoDB('ementas', ementa);
  }
  
  // Salvar templates
  for (const template of templates) {
    await salvarNoDB('templates', template);
  }
  
  // Salvar histórico
  for (const item of historico) {
    await salvarNoDB('historico', item);
  }
  
  // Salvar configurações
  await salvarNoDB('config', { key: 'filtros', value: filtrosAtivos });
  await salvarNoDB('config', { key: 'formatacao', value: formatacaoAtual });
  await salvarNoDB('config', { key: 'acoes_custom', value: acoesCustom });
}

async function carregarDoDB() {
  if (!db) await initDB();
  
  try {
    // Carregar ementas
    const ementasDB = await listarDoDB('ementas');
    if (ementasDB.length &amp;gt; 0) {
      ementas = ementasDB;
      saveLS('aj_ementas', ementas);
    }
    
    // Carregar templates
    const templatesDB = await listarDoDB('templates');
    if (templatesDB.length &amp;gt; 0) {
      templates = templatesDB;
      saveLS('aj_templates', templates);
    }
    
    // Carregar histórico
    const historicoDB = await listarDoDB('historico');
    if (historicoDB.length &amp;gt; 0) {
      historico = historicoDB;
      saveLS('aj_historico', historico);
    }
    
    // Carregar configurações
    const configFiltros = await lerDoDB('config', 'filtros');
    if (configFiltros) {
      filtrosAtivos = configFiltros.value;
      saveLS('aj_filtros', filtrosAtivos);

    const configAcoes = await lerDoDB('config', 'acoes_custom');
    if (configAcoes) {
      acoesCustom = configAcoes.value;
      saveLS('aj_acoes_custom', acoesCustom);
    }
    
    console.log('✅ Dados carregados do IndexedDB');
  } catch(e) {
    console.error('Erro ao carregar do DB:', e);
  }
}

async function importarBackup(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  
  try {
    const texto = await file.text();
    const backup = JSON.parse(texto);
    
    if (!backup.versao || !backup.dados) {
      throw new Error('Arquivo de backup inválido');
    }
    
    if (!confirm('⚠️ Isso substituirá TODOS os dados atuais. Deseja continuar?')) {
      return;
    }
    
    // Restaurar dados
    ementas = backup.dados.ementas || [];
    templates = backup.dados.templates || [];
    historico = backup.dados.historico || [];
    acoesCustom = backup.dados.acoesCustom || [];
    filtrosAtivos = backup.dados.filtros || filtrosAtivos;
    formatacaoAtual = backup.dados.formatacao || formatacaoAtual;
    
    // Restaurar configurações
    if (backup.dados.config) {
      effortLevel = backup.dados.config.effort || 3;
      verbosity = backup.dados.config.verbosity || 'longa';
      templateAtivo = backup.dados.config.templateAtivo || null;
    }
    
    // Restaurar chaves (opcional)
    if (backup.dados.chaves &amp;amp;&amp;amp; confirm('Deseja restaurar também as chaves de API?')) {
      document.getElementById('key-resumo').value = backup.dados.chaves.resumo || '';
      document.getElementById('key-geracao').value = backup.dados.chaves.geracao || '';
      document.getElementById('modelo-geracao').value = backup.dados.chaves.modelo || '';
      document.getElementById('prompt-global').value = backup.dados.chaves.promptGlobal || '';
      salvarChaves();
    }
    
    // Salvar tudo
    saveLS('aj_ementas', ementas);
    saveLS('aj_templates', templates);
    saveLS('aj_historico', historico);
    saveLS('aj_acoes_custom', acoesCustom);
    saveLS('aj_filtros', filtrosAtivos);
    saveLS('aj_formatacao', formatacaoAtual);
    saveLS('aj_effort', effortLevel);
    saveLS('aj_verbosity', verbosity);
    saveLS('aj_template_ativo', templateAtivo);
    
    // Sincronizar com IndexedDB
    await sincronizarComDB();
    
    // Atualizar interface
    renderEmentas();
    renderTemplates();
    renderHistorico();
    renderAcoes();
    renderAcoesCustomGrid();
    atualizarEstatisticas();
    
    alert('✅ Backup restaurado com sucesso! Recarregue a página para aplicar todas as mudanças.');
    
  } catch(e) {
    alert('❌ Erro ao importar backup: ' + e.message);
  }
}

// ══════════════════════════════════════════════════════
//  CRIPTOGRAFIA SIMPLES (Base64 + XOR)
// ══════════════════════════════════════════════════════
function criptografar(texto, senha) {
  const key = senha.split('').map(c =&amp;gt; c.charCodeAt(0));
  const encrypted = texto.split('').map((c, i) =&amp;gt; {
    return String.fromCharCode(c.charCodeAt(0) ^ key[i % key.length]);
  }).join('');
  return btoa(encrypted);
}

function descriptografar(textoCripto, senha) {
  const encrypted = atob(textoCripto);
  const key = senha.split('').map(c =&amp;gt; c.charCodeAt(0));
  return encrypted.split('').map((c, i) =&amp;gt; {
    return String.fromCharCode(c.charCodeAt(0) ^ key[i % key.length]);
  }).join('');
}

async function exportarBackupCriptografado() {
  const senha = prompt('Digite uma senha para criptografar o backup:');
  if (!senha) return;
  
  const senhaConfirm = prompt('Confirme a senha:');
  if (senha !== senhaConfirm) {
    alert('❌ Senhas não coincidem!');
    return;
  }
  
  try {
    const backup = {
      versao: '2.0',
      timestamp: new Date().toISOString(),
      dados: {
        ementas, templates, historico, acoesCustom,
        filtros: filtrosAtivos,
        formatacao: formatacaoAtual
      }
    };
    
    const json = JSON.stringify(backup);
    const encrypted = criptografar(json, senha);
    
    const blob = new Blob([encrypted], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `backup-criptografado-${Date.now()}.enc`;
    a.click();
    URL.revokeObjectURL(url);
    
    alert('✅ Backup criptografado exportado! Guarde a senha em local seguro.');
  } catch(e) {
    alert('❌ Erro: ' + e.message);
  }
}

async function importarBackupCriptografado(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  
  const senha = prompt('Digite a senha do backup:');
  if (!senha) return;
  
  try {
    const encrypted = await file.text();
    const json = descriptografar(encrypted, senha);
    const backup = JSON.parse(json);
    
    if (!confirm('⚠️ Isso substituirá todos os dados. Continuar?')) return;
    
    ementas = backup.dados.ementas || [];

    historico = backup.dados.historico || [];
    acoesCustom = backup.dados.acoesCustom || [];
    filtrosAtivos = backup.dados.filtros || filtrosAtivos;

async function testarDrive() {
  const token = document.getElementById('api-drive-token').value.trim();
  if (!token) {
    alert('Configure o token primeiro.');
    return;
  }
  
  try {
    const resp = await fetch('https://www.googleapis.com/drive/v3/about?fields=user', {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    
    if (!resp.ok) throw new Error('Token inválido');
    
    const data = await resp.json();
    alert(`✅ Conectado como: ${data.user.emailAddress}`);
  } catch(e) {
    alert('❌ Erro: ' + e.message);
  }
}

async function enviarParaDrive(nomeArquivo, conteudo, mimeType) {
  const token = loadLS('aj_drive_token', '');
  const folderId = loadLS('aj_drive_folder', '');
  
  if (!token) {
    alert('Configure o Google Drive primeiro na aba Backup.');
    return;
  }
  
  try {
    const metadata = {
      name: nomeArquivo,
      mimeType: mimeType
    };
    
    if (folderId) metadata.parents = [folderId];
    
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
    form.append('file', new Blob([conteudo], { type: mimeType }));
    
    const resp = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}` },
      body: form
    });
    
    if (!resp.ok) throw new Error('Erro ao enviar');
    
    alert('✅ Arquivo enviado para o Drive!');
  } catch(e) {
    alert('❌ Erro ao enviar: ' + e.message);
  }
}

  if (prompt('Digite &amp;quot;CONFIRMAR&amp;quot; para apagar tudo:') !== 'CONFIRMAR') {
    return;
  }
  
  try {
    // Limpar localStorage
    localStorage.clear();
    
    // Limpar IndexedDB
    if (db) {
      const stores = ['documentos', 'ementas', 'templates', 'config', 'historico'];
      for (const store of stores) {
        const transaction = db.transaction([store], 'readwrite');
        const objectStore = transaction.objectStore(store);
        objectStore.clear();
      }
    }
    
    // Resetar variáveis
    ementas = [];
    templates = [];
    historico = [];
    acoesCustom = [];
    emsSelected.clear();
    
    alert('✅ Todos os dados foram apagados. Recarregue a página.');
    location.reload();
  } catch(e) {
    alert('❌ Erro: ' + e.message);
  }
}

async function buscarNaInternet(query) {
  if (!internetAtivo || !apiInternetConfig.apiKey) {
    throw new Error('Configure o acesso à internet primeiro');
  }
  
  const provider = apiInternetConfig.provider;
  const apiKey = apiInternetConfig.apiKey;
  const numResults = apiInternetConfig.numResults || 5;
  
  try {
    let resultados = [];
    
    if (provider === 'serper') {
      const resp = await fetch('https://google.serper.dev/search', {
        method: 'POST',
        headers: {
          'X-API-KEY': apiKey,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          q: query,
          num: numResults,
          gl: 'br',
          hl: 'pt'
        })
      });
      
      if (!resp.ok) throw new Error('Erro na busca');
      const data = await resp.json();
      
      resultados = (data.organic || []).map(r =&amp;gt; ({
        titulo: r.title,
        snippet: r.snippet,
        url: r.link
      }));
      
    } else if (provider === 'serpapi') {
      const url = `https://serpapi.com/search?q=${encodeURIComponent(query)}&amp;amp;api_key=${apiKey}&amp;amp;num=${numResults}&amp;amp;gl=br&amp;amp;hl=pt`;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('Erro na busca');
      const data = await resp.json();
      
      resultados = (data.organic_results || []).map(r =&amp;gt; ({
        titulo: r.title,
        snippet: r.snippet,
        url: r.link
      }));
      
    } else if (provider === 'brave') {
      const resp = await fetch(`https://api.search.brave.com/res/v1/web/search?q=${encodeURIComponent(query)}&amp;amp;count=${numResults}`, {
        headers: {
          'X-Subscription-Token': apiKey,
          'Accept': 'application/json'
        }
      });
      
      if (!resp.ok) throw new Error('Erro na busca');
      const data = await resp.json();
      
      resultados = (data.web?.results || []).map(r =&amp;gt; ({
        titulo: r.title,
        snippet: r.description,
        url: r.url
      }));
      
    } else if (provider === 'tavily') {
      const resp = await fetch('https://api.tavily.com/search', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          api_key: apiKey,
          query: query,
          search_depth: 'advanced',
          max_results: numResults
        })
      });
      
      if (!resp.ok) throw new Error('Erro na busca');
      const data = await resp.json();
      
      resultados = (data.results || []).map(r =&amp;gt; ({
        titulo: r.title,
        snippet: r.content,
        url: r.url
      }));
      
    } else if (provider === 'custom') {
      const url = apiInternetConfig.customUrl.replace('{query}', encodeURIComponent(query));
      const resp = await fetch(url, {
        headers: { 'Authorization': `Bearer ${apiKey}` }
      });
      
      if (!resp.ok) throw new Error('Erro na busca');
      const data = await resp.json();
      
      // Assumir formato padrão ou adaptar conforme necessário
      resultados = data.results || data.items || [];
    }
    
    return resultados;
    
  } catch(e) {
    throw new Error('Erro ao buscar: ' + e.message);
  }
}

  const input = document.getElementById('busca-manual-input');
  const query = input.value.trim();
  
  if (!query) {

  }
  
  const container = document.getElementById('resultados-busca');
  container.classList.remove('hidden');
  container.innerHTML = '&amp;lt;div class=&amp;quot;text-muted fs11&amp;quot;&amp;gt;🔍 Buscando...&amp;lt;/div&amp;gt;';
  
  try {
    const resultados = await buscarNaInternet(query);
    
    if (resultados.length === 0) {
      container.innerHTML = '&amp;lt;div class=&amp;quot;text-muted fs11&amp;quot;&amp;gt;Nenhum resultado encontrado.&amp;lt;/div&amp;gt;';
      return;

      `;
      container.appendChild(div);
    });
    
  } catch(e) {
    container.innerHTML = `&amp;lt;div class=&amp;quot;text-red fs11&amp;quot;&amp;gt;❌ ${e.message}&amp;lt;/div&amp;gt;`;
  }
}

  setLoading(true);

  try {

    if (kr &amp;amp;&amp;amp; texto.length &amp;gt; 1500) {
      atualizarResultado('⏳ Limpando e resumindo o texto com Gemini...');

        { role: 'user', content: texto }
      ];
      textoFinal = await chamarGemini(kr, resumoMsgs, 'gemini-1.5-flash');

    }

    const promptSistema = buildPromptSistema(acao, customPrompt);
    const userContent = jurisFull
      ? `${textoFinal}\n\n---\nJURISPRUDÊNCIA E EMENTAS PARA CITAR (use apenas os trechos relevantes, mantendo as fontes):\n${jurisFull}`
      : textoFinal;

    const msgs = [
      { role: 'system', content: promptSistema },
      { role: 'user', content: userContent }
    ];

    let resposta = '';
    if (kg) {
      atualizarResultado('⏳ Gerando peça...');

        resposta = await chamarGemini(kr, msgs, 'gemini-1.5-flash');
        document.getElementById('badge-demo').classList.remove('hidden');
      } else {
        atualizarResultado('⚠️ Configure ao menos uma chave de API em ⚙️ Configurações.');
        setLoading(false);
        return;
      }

    resultado = resposta;

function instalarPWA() {
  // Criar manifest.json dinamicamente
  const manifest = {
    name: 'Assistente Jurídico Pro',
    short_name: 'AJ Pro',
    description: 'Assistente jurídico avançado com IA, filtros inteligentes e backup completo',
    start_url: '.',
    display: 'standalone',
    background_color: '#141c0d',
    theme_color: '#d97706',
    orientation: 'any',
    icons: [
      {
        src: 'data:image/svg+xml,&amp;lt;svg xmlns=&amp;quot;http://www.w3.org/2000/svg&amp;quot; viewBox=&amp;quot;0 0 100 100&amp;quot;&amp;gt;&amp;lt;rect fill=&amp;quot;%23d97706&amp;quot; width=&amp;quot;100&amp;quot; height=&amp;quot;100&amp;quot;/&amp;gt;&amp;lt;text y=&amp;quot;75&amp;quot; font-size=&amp;quot;70&amp;quot; fill=&amp;quot;white&amp;quot; text-anchor=&amp;quot;middle&amp;quot; x=&amp;quot;50&amp;quot;&amp;gt;⚖️&amp;lt;/text&amp;gt;&amp;lt;/svg&amp;gt;',
        sizes: '512x512',
        type: 'image/svg+xml',
        purpose: 'any maskable'
      }
    ]
  };
  
  const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const manifestURL = URL.createObjectURL(manifestBlob);
  
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestURL;
  document.head.appendChild(link);
  
  // Service Worker inline
  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE_NAME = 'aj-pro-v2';
      const urlsToCache = ['/'];
      
      self.addEventListener('install', event =&amp;gt; {
        event.waitUntil(
          caches.open(CACHE_NAME).then(cache =&amp;gt; cache.addAll(urlsToCache))
        );
      });
      
      self.addEventListener('fetch', event =&amp;gt; {
        event.respondWith(
          caches.match(event.request).then(response =&amp;gt; response || fetch(event.request))
        );
      });
    `;
    
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swURL = URL.createObjectURL(blob);
    
    navigator.serviceWorker.register(swURL).then(() =&amp;gt; {
      console.log('✅ PWA instalado');
    }).catch(err =&amp;gt; {
      console.error('Erro ao registrar SW:', err);
    });
  }
}

// Debounce para inputs
function debounce(func, wait) {
  let timeout;
  return function executedFunction(...args) {
    const later = () =&amp;gt; {
      clearTimeout(timeout);
      func(...args);
    };
    clearTimeout(timeout);
    timeout = setTimeout(later, wait);
  };
}

// Aplicar debounce em campos de texto
window.addEventListener('DOMContentLoaded', () =&amp;gt; {
  setTimeout(() =&amp;gt; {
    const textareas = document.querySelectorAll('textarea');
    textareas.forEach(ta =&amp;gt; {
      if (ta.oninput) {
        const originalHandler = ta.oninput;
        ta.oninput = debounce(originalHandler, 500);
      }
    });
  }, 3000);
});

//  ESTADO GLOBAL
// ══════════════════════════════════════════════════════
let effortLevel  = parseInt(loadLS('aj_effort','3'));
let verbosity    = loadLS('aj_verbosity','longa');
let ementas      = loadLS('aj_ementas', []);
let historico    = loadLS('aj_historico', []);
let acoesCustom  = loadLS('aj_acoes_custom', []);

let chatHistory  = [];
let abortCtrl    = null;

// ══════════════════════════════════════════════════════
//  LOCALSTORAGE
// ══════════════════════════════════════════════════════
function loadLS(k, def) {
  try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; }
}
function saveLS(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
}

// ══════════════════════════════════════════════════════
//  CHAVES
// ══════════════════════════════════════════════════════
const PROVIDERS = [
  ['AIza',   'Gemini'],
  ['gsk_',   'Groq'],
  ['sk-ant', 'Claude'],
  ['sk-or-', 'OpenRouter'],
  ['pplx-',  'Perplexity'],
  ['xai-',   'xAI/Grok'],
  ['sk-',    'OpenAI'],
];
function detectProvider(k) {
  for (const [p,n] of PROVIDERS) if ((k||'').startsWith(p)) return n;
  return null;
}
function getChaveResumo()  { return (document.getElementById('key-resumo').value  || '').trim(); }
function getChaveGeracao() { return (document.getElementById('key-geracao').value || '').trim(); }
function getModelo()       { return (document.getElementById('modelo-geracao').value || '').trim(); }

function salvarChaves() {
  const kr = getChaveResumo(), kg = getChaveGeracao(), m = getModelo();
  saveLS('aj_key_resumo',   kr);
  saveLS('aj_key_geracao',  kg);
  saveLS('aj_modelo',       m);
  document.getElementById('tag-resumo').textContent  = detectProvider(kr) || '';
  document.getElementById('tag-geracao').textContent = detectProvider(kg) || '';
  atualizarBadge();
}
function limparChaves() {
  ['key-resumo','key-geracao','modelo-geracao'].forEach(id =&amp;gt; document.getElementById(id).value = '');
  ['aj_key_resumo','aj_key_geracao','aj_modelo'].forEach(k =&amp;gt; localStorage.removeItem(k));
  salvarChaves();
}
function atualizarBadge() {
  const kg = getChaveGeracao();
  const badge = document.getElementById('badge-status');
  if (kg) {
    badge.textContent = detectProvider(kg) || 'Chave Própria';
    badge.className = 'badge badge-ok';
  } else {
    badge.textContent = 'Demo';
    badge.className = 'badge badge-demo';
  }
}

// Carregar chaves salvas
window.addEventListener('DOMContentLoaded', () =&amp;gt; {
  document.getElementById('key-resumo').value   = loadLS('aj_key_resumo','');
  document.getElementById('key-geracao').value  = loadLS('aj_key_geracao','');
  document.getElementById('modelo-geracao').value = loadLS('aj_modelo','');
  salvarChaves();
  atualizarEsforco();
  atualizarVerbosity();
  renderEmentas();
  renderHistorico();
  renderAcoes();
  renderAcoesCustomGrid();
  // PDF.js worker
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
});

// ══════════════════════════════════════════════════════
//  TESTAR CHAVES
// ══════════════════════════════════════════════════════
async function testarChaves() {
  const kr = getChaveResumo(), kg = getChaveGeracao();
  const sp = document.getElementById('test-spinner');
  const rt = document.getElementById('test-result');
  sp.classList.remove('hidden'); rt.textContent = '';
  try {
    if (kr) {
      await chamarGemini(kr, [{ role:'user', content:'Responda apenas: OK' }], 'gemini-1.5-flash');
      rt.textContent = '✅ Resumo OK';
    }
    if (kg) {
      const prov = detectProvider(kg);
      let r = '';
      if (prov === 'Gemini')      r = await chamarGemini(kg, [{role:'user',content:'Responda apenas: OK'}]);
      else if (prov === 'Claude') r = await chamarClaude(kg, [{role:'user',content:'Responda apenas: OK'}], getModelo()||'claude-haiku-3-5');
      else                        r = await chamarOpenAI(kg, [{role:'user',content:'Responda apenas: OK'}], getModelo()||'gpt-4o-mini');
      rt.textContent += (kr?' | ':'') + `✅ Geração OK (${prov||'Custom'})`;
    }
    if (!kr &amp;amp;&amp;amp; !kg) rt.textContent = '⚠️ Insira ao menos uma chave.';
  } catch(e) {
    rt.textContent = '❌ ' + e.message.substring(0,100);
    rt.className = 'fs11 text-red';
  } finally { sp.classList.add('hidden'); }
}

// ══════════════════════════════════════════════════════
//  ESFORÇO + VERBOSIDADE
// ══════════════════════════════════════════════════════
const EFFORT_INFO = {
  1: { label:'⚡ Rápido',    color:'var(--blue)',   desc:'Resposta direta e concisa' },
  2: { label:'⚡ Básico',    color:'#22d3ee',       desc:'Pontos principais' },
  3: { label:'⚡ Detalhado', color:'var(--amber2)', desc:'Análise completa' },
  4: { label:'⚡ Profundo',  color:'#fb923c',       desc:'Fundamentação robusta' },
  5: { label:'⚡ Exaustivo', color:'var(--purple)', desc:'Máximo esforço possível' },
};
function atualizarEsforco() {
  effortLevel = parseInt(document.getElementById('effort-range').value);
  const info = EFFORT_INFO[effortLevel];
  const el = document.getElementById('effort-label');
  el.textContent = info.label;
  el.style.color = info.color;
  saveLS('aj_effort', effortLevel);
}
function atualizarVerbosity() {
  const btn = document.getElementById('verbosity-btn');
  if (verbosity === 'curta') {
    btn.textContent = '📝 Concisa';
    btn.style.borderColor = '#3b82f655';
    btn.style.color = 'var(--blue)';
  } else {
    btn.textContent = '📄 Completa';
    btn.style.borderColor = '#92400e55';
    btn.style.color = 'var(--amber2)';
  }
}
function toggleVerbosity() {
  verbosity = verbosity === 'curta' ? 'longa' : 'curta';
  saveLS('aj_verbosity', verbosity);
  atualizarVerbosity();
}

  document.querySelectorAll('.tab-pane').forEach(p =&amp;gt; p.classList.remove('ativo'));

// ══════════════════════════════════════════════════════
//  IMPORTAR ARQUIVO
// ══════════════════════════════════════════════════════
async function importarArquivo(input) {
  const file = input.files[0]; input.value = '';
  if (!file) return;
  const sp = document.getElementById('import-spinner');
  sp.classList.remove('hidden');
  try {
    const ext = file.name.split('.').pop().toLowerCase();
    let texto = '';
    if (ext === 'pdf') {
      texto = await extrairPDF(file);
    } else if (ext === 'docx' || ext === 'doc') {
      texto = await extrairDOCX(file);
    } else {
      texto = await file.text();
    }
    if (!texto.trim()) throw new Error('Arquivo sem texto legível.');
    const ta = document.getElementById('txt-processo');
    ta.value = ta.value ? ta.value + '\n\n' + texto : texto;
  } catch(e) { alert('Erro ao importar: ' + e.message); }
  finally { sp.classList.add('hidden'); }
}

async function extrairPDF(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let texto = '';
  for (let i = 1; i &amp;lt;= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    texto += content.items.map(it =&amp;gt; it.str).join(' ') + '\n';
  }
  return texto;
}

async function extrairDOCX(file) {
  const buf = await file.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer: buf });
  return result.value;
}

// ══════════════════════════════════════════════════════
async function importarImagem(input) {
  const file = input.files[0]; input.value = '';
  if (!file) return;
  const sp = document.getElementById('import-spinner');
  sp.classList.remove('hidden');
  try {
    const worker = await Tesseract.createWorker('por');
    const { data: { text } } = await worker.recognize(file);
    await worker.terminate();
    if (!text.trim()) throw new Error('Não foi possível extrair texto da imagem.');
    const ta = document.getElementById('txt-processo');
    ta.value = ta.value ? ta.value + '\n\n' + text : text;
  } catch(e) { alert('Erro no OCR: ' + e.message); }
  finally { sp.classList.add('hidden'); }
}

//  VOZ
// ══════════════════════════════════════════════════════
function toggleVoz() {
  if (isListening) { recognition?.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Use Chrome ou Edge para ditar por voz.'); return; }
  recognition = new SR();
  recognition.lang = 'pt-BR'; recognition.continuous = true; recognition.interimResults = true;
  let fullText = ''; let timer = null;
  const scheduleStop = () =&amp;gt; {
    if (timer) clearTimeout(timer);
    timer = setTimeout(() =&amp;gt; { try { recognition.stop(); } catch {} }, 1800);
  };
  recognition.onresult = e =&amp;gt; {
    let f = '', itr = '';
    for (let i = 0; i &amp;lt; e.results.length; i++) {
      if (e.results[i].isFinal) f += e.results[i][0].transcript;
      else itr += e.results[i][0].transcript;
    }
    fullText = f || itr;
    if (fullText) scheduleStop();
  };
  recognition.onend = () =&amp;gt; {
    if (timer) clearTimeout(timer);
    isListening = false;
    document.getElementById('btn-voz').textContent = '🎤 Ditar';
    if (fullText.trim()) {
      const ta = document.getElementById('txt-processo');
      ta.value = ta.value ? ta.value.trimEnd() + '\n\n' + fullText.trim() : fullText.trim();
    }
  };
  recognition.onerror = () =&amp;gt; { isListening = false; document.getElementById('btn-voz').textContent = '🎤 Ditar'; };
  recognition.start();
  isListening = true;
  document.getElementById('btn-voz').textContent = '🔴 Parar';
}

// ══════════════════════════════════════════════════════
//  CHAMADAS DE API
// ══════════════════════════════════════════════════════
async function chamarGemini(chave, msgs, modelo) {
  modelo = modelo || 'gemini-1.5-flash';
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${chave}`;
  const system = msgs.find(m =&amp;gt; m.role === 'system');
  const contents = msgs.filter(m =&amp;gt; m.role !== 'system').map(m =&amp;gt; ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.content }]
  }));
  if (system &amp;amp;&amp;amp; contents.length &amp;gt; 0) contents[0].parts[0].text = system.content + '\n\n' + contents[0].parts[0].text;
  const resp = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents, generationConfig: { temperature: 0.7 } })
  });
  if (!resp.ok) { const e = await resp.json().catch(()=&amp;gt;({})); throw new Error(e.error?.message || `Gemini erro ${resp.status}`); }
  const d = await resp.json();
  return d.candidates[0].content.parts[0].text;
}

async function chamarOpenAI(chave, msgs, modelo, baseUrl) {
  modelo = modelo || 'gpt-4o';
  baseUrl = baseUrl || 'https://api.openai.com/v1';
  const resp = await fetch(`${baseUrl}/chat/completions`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${chave}` },
    body: JSON.stringify({ model: modelo, messages: msgs, temperature: 0.7, stream: false })
  });
  if (!resp.ok) { const e = await resp.json().catch(()=&amp;gt;({})); throw new Error(e.error?.message || `OpenAI erro ${resp.status}`); }
  const d = await resp.json();
  return d.choices[0].message.content;
}

async function chamarClaude(chave, msgs, modelo) {
  modelo = modelo || 'claude-haiku-3-5';
  const system = msgs.find(m =&amp;gt; m.role === 'system');
  const messages = msgs.filter(m =&amp;gt; m.role !== 'system');
  const body = { model: modelo, max_tokens: 8192, messages, temperature: 0.7 };
  if (system) body.system = system.content;
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': chave,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify(body)
  });
  if (!resp.ok) { const e = await resp.json().catch(()=&amp;gt;({})); throw new Error(e.error?.message || `Claude erro ${resp.status}`); }
  const d = await resp.json();
  return d.content[0].text;
}

async function chamarGroq(chave, msgs, modelo) {
  modelo = modelo || 'llama-3.3-70b-versatile';
  return chamarOpenAI(chave, msgs, modelo, 'https://api.groq.com/openai/v1');
}

async function chamarIA(chave, msgs, modeloOverride) {
  const prov = detectProvider(chave);
  const modelo = modeloOverride || getModelo() || '';
  if (prov === 'Gemini')  return chamarGemini(chave, msgs, modelo || 'gemini-1.5-pro');
  if (prov === 'Claude')  return chamarClaude(chave, msgs, modelo || 'claude-haiku-3-5');
  if (prov === 'Groq')    return chamarGroq(chave, msgs, modelo);
  return chamarOpenAI(chave, msgs, modelo || 'gpt-4o');
}

// ══════════════════════════════════════════════════════
//  EXECUTAR AÇÃO PRINCIPAL
// ══════════════════════════════════════════════════════
async function executar(acao, customPrompt) {
  const texto = document.getElementById('txt-processo').value.trim();
  if (!texto) { alert('Cole ou importe o texto do documento antes.'); return; }

  const kr = getChaveResumo();
  const kg = getChaveGeracao();

  // Ementas selecionadas
  const emsTexto = [...emsSelected].map(id =&amp;gt; {
    const em = ementas.find(e =&amp;gt; e.id === id);
    return em ? `[${em.titulo} — ${em.categoria}]\n${em.texto}` : '';
  }).filter(Boolean).join('\n\n');

  const jurisManual = document.getElementById('txt-juris').value.trim();
  const jurisFull = [jurisManual, emsTexto].filter(Boolean).join('\n\n');

  setLoading(true);
  document.getElementById('badge-demo').classList.add('hidden');

  try {
    let textoFinal = texto;

    // ── PASSO 1: Resumir/limpar com Gemini (se chave disponível e texto longo) ──
    if (kr &amp;amp;&amp;amp; texto.length &amp;gt; 1500) {
      atualizarResultado('⏳ Limpando e resumindo o texto com Gemini...');
      const resumoMsgs = [
        { role: 'system', content: 'Você é um assistente jurídico. Resuma o texto abaixo de forma objetiva, mantendo todos os fatos relevantes, partes, pedidos, decisões e fundamentos legais. Elimine cabeçalhos de página, rodapés, certificados digitais e repetições.' },
        { role: 'user', content: texto }
      ];
      textoFinal = await chamarGemini(kr, resumoMsgs, 'gemini-1.5-flash');
      textoResumido = textoFinal;
    }

    // ── PASSO 2: Gerar peça com chave principal ──
    const promptSistema = buildPromptSistema(acao, customPrompt);
    const userContent = jurisFull
      ? `${textoFinal}\n\n---\nJURISPRUDÊNCIA E EMENTAS PARA CITAR:\n${jurisFull}`
      : textoFinal;

    const msgs = [
      { role: 'system', content: promptSistema },
      { role: 'user', content: userContent }
    ];

    let resposta = '';
    if (kg) {
      atualizarResultado('⏳ Gerando peça...');
      resposta = await chamarIA(kg, msgs);
    } else {
      // Demo: usa Gemini Flash gratuito se tiver chave de resumo, senão avisa
      if (kr) {
        atualizarResultado('⏳ Gerando (modo demo com Gemini)...');
        resposta = await chamarGemini(kr, msgs, 'gemini-1.5-flash');
        document.getElementById('badge-demo').classList.remove('hidden');
      } else {
        atualizarResultado('⚠️ Configure ao menos uma chave de API em ⚙️ Configurações.');
        setLoading(false);
        return;
      }
    }

    // Salvar resultado
    resultado = resposta;
    renderResultado(resposta);
    chatHistory = [
      { role: 'system', content: 'Você é um advogado consultor jurídico experiente de Minas Gerais. Responda de forma direta e técnica.' },
      { role: 'user', content: `O documento gerado foi:\n\n${resposta}` },
      { role: 'assistant', content: 'Entendido. Estou pronto para refinar.' }
    ];

    // Salvar no histórico
    const labelAcao = customPrompt
      ? (acoesCustom.find(a =&amp;gt; a.id === acao)?.label || 'Ação Custom')
      : ({ resumir:'Resumir', revisar:'Revisar', refinar:'Refinar', simplificar:'Linguagem Simples', minuta:'Gerar Minuta', analisar:'Analisar', 'modo-estrito':'Corrigir Texto', 'modo-redacao':'Redação Jurídica', 'modo-interativo':'Verificar Lacunas' }[acao] || acao);
    historico = [{ id: Date.now().toString(), acao: labelAcao, inputSnippet: texto.substring(0,120), resultado: resposta, timestamp: new Date().toLocaleString('pt-BR') }, ...historico].slice(0,15);
    saveLS('aj_historico', historico);
    renderHistorico();

  } catch(e) {
    if (e.name === 'AbortError') return;
    atualizarResultado('❌ Erro: ' + e.message);
  } finally {
    setLoading(false);
  }
}

// ══════════════════════════════════════════════════════
//  RENDER RESULTADO
// ══════════════════════════════════════════════════════
function atualizarResultado(txt) {
  document.getElementById('secao-resultado').classList.remove('hidden');
  const box = document.getElementById('resultado-box');
  box.innerHTML = '';
  box.textContent = txt;
}

function renderResultado(txt) {
  document.getElementById('secao-resultado').classList.remove('hidden');
  const box = document.getElementById('resultado-box');
  box.innerHTML = '';
  const blocks = txt.split(/\n{2,}/);
  blocks.forEach(block =&amp;gt; {
    const t = block.trim(); if (!t) return;
    const p = document.createElement('p');
    const lines = t.split('\n');
    const isSingle = lines.length === 1;
    const isTitulo = isSingle &amp;amp;&amp;amp; t === t.toUpperCase() &amp;amp;&amp;amp; t.length &amp;gt; 2 &amp;amp;&amp;amp; /[A-ZÁÉÍÓÚÃÕ]/.test(t) &amp;amp;&amp;amp; !/^\d+\./.test(t);
    const isLista  = /^\d+[.)]\s/.test(t) || /^[a-z]\)/.test(t) || /^[-–]\s/.test(t);
    const isCitacao = (t.startsWith('&amp;quot;') || t.startsWith('\u201c')) &amp;amp;&amp;amp; t.length &amp;gt; 60;
    if (isTitulo)  p.className = 'titulo-peca';
    else if (isLista)   p.className = 'item-lista';
    else if (isCitacao) p.className = 'citacao';
    else p.className = 'paragrafo';
    lines.forEach((l, i) =&amp;gt; { if (i &amp;gt; 0) p.appendChild(document.createElement('br')); p.appendChild(document.createTextNode(l)); });
    box.appendChild(p);
  });
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function baixarRtf() {
  if (!resultado) return;
  const rtf = `{\\rtf1\\ansi\\deff0\n{\\fonttbl{\\f0 Times New Roman;}}\n{\\f0\\fs26\n${
    resultado.split(/\n\n+/).map(block =&amp;gt; {

        return `\\pard\\qj\\b ${t.replace(/[\\{}]/g,'\\$&amp;amp;')}\\b0\\par\\par`;
      if (/^\d+[.)]\s/.test(t) || /^[-–]\s/.test(t))
        return `\\pard\\qj\\li720 ${t.replace(/[\\{}]/g,'\\$&amp;amp;')}\\par\\par`;
      return `\\pard\\qj\\fi2268 ${t.replace(/[\\{}]/g,'\\$&amp;amp;')}\\par\\par`;
    }).join('\n')
  }\n}}`;

async function enviarChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim(); if (!msg || !resultado) return;
  input.value = '';
  chatHistory.push({ role: 'user', content: msg });
  renderChat();
  const kg = getChaveGeracao();

  const chave = kg || kr;
  if (!chave) { chatHistory.push({ role:'assistant', content:'⚠️ Configure uma chave de API para usar o chat.' }); renderChat(); return; }
  try {
    const resposta = await chamarIA(chave, chatHistory);
    chatHistory.push({ role:'assistant', content: resposta });
    if (resposta.length &amp;gt; resultado.length * 0.5 &amp;amp;&amp;amp; !resposta.toLowerCase().startsWith('para'))
      resultado = resposta;
    renderChat();
    renderResultado(resultado);
  } catch(e) {
    chatHistory.push({ role:'assistant', content:'❌ Erro: ' + e.message });
    renderChat();
  }
}

      &amp;lt;div class=&amp;quot;row&amp;quot; style=&amp;quot;align-items:flex-start;gap:8px&amp;quot;&amp;gt;
        &amp;lt;div class=&amp;quot;ementa-check ${sel ? 'marcado' : ''}&amp;quot; onclick=&amp;quot;toggleEmenta('${em.id}')&amp;quot;&amp;gt;
          ${sel ? '✓' : ''}
        &amp;lt;/div&amp;gt;
        &amp;lt;div style=&amp;quot;flex:1;min-width:0&amp;quot;&amp;gt;
          &amp;lt;div class=&amp;quot;row&amp;quot; style=&amp;quot;gap:6px;flex-wrap:wrap&amp;quot;&amp;gt;
            &amp;lt;span class=&amp;quot;card-title&amp;quot; style=&amp;quot;margin:0&amp;quot;&amp;gt;${em.titulo}&amp;lt;/span&amp;gt;
            ${em.categoria ? `&amp;lt;span class=&amp;quot;badge&amp;quot; style=&amp;quot;background:#1e3a5f33;color:var(--blue);border-color:#3b82f633&amp;quot;&amp;gt;${em.categoria}&amp;lt;/span&amp;gt;` : ''}
          &amp;lt;/div&amp;gt;
          &amp;lt;div class=&amp;quot;card-sub&amp;quot; style=&amp;quot;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden&amp;quot;&amp;gt;${em.texto}&amp;lt;/div&amp;gt;
        &amp;lt;/div&amp;gt;
        &amp;lt;div class=&amp;quot;row&amp;quot; style=&amp;quot;gap:4px;flex-shrink:0&amp;quot;&amp;gt;
          &amp;lt;button class=&amp;quot;btn-icon&amp;quot; onclick=&amp;quot;abrirFormEmenta('${em.id}')&amp;quot; title=&amp;quot;Editar&amp;quot;&amp;gt;✏️&amp;lt;/button&amp;gt;
          &amp;lt;button class=&amp;quot;btn-icon&amp;quot; onclick=&amp;quot;deletarEmenta('${em.id}')&amp;quot; title=&amp;quot;Remover&amp;quot;&amp;gt;🗑&amp;lt;/button&amp;gt;
        &amp;lt;/div&amp;gt;
      &amp;lt;/div&amp;gt;`;
    lista.appendChild(div);
  });
  atualizarTabEmentas();
}

// ══════════════════════════════════════════════════════
//  HISTÓRICO
// ══════════════════════════════════════════════════════
function limparHistorico() {
  if (!confirm('Limpar todo o histórico?')) return;
  historico = []; saveLS('aj_historico', historico);
  renderHistorico();
}
function renderHistorico() {
  const lista = document.getElementById('lista-historico');
  lista.innerHTML = '';
  document.getElementById('tab-hist-btn').textContent =
    `🕐 Histórico${historico.length ? ` (${historico.length})` : ''}`;
  if (!historico.length) {
    lista.innerHTML = '&amp;lt;div class=&amp;quot;text-muted fs12&amp;quot; style=&amp;quot;text-align:center;padding:20px&amp;quot;&amp;gt;Nenhum documento gerado ainda.&amp;lt;/div&amp;gt;';
    return;
  }
  historico.forEach(h =&amp;gt; {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      &amp;lt;div class=&amp;quot;row&amp;quot; style=&amp;quot;justify-content:space-between;margin-bottom:4px&amp;quot;&amp;gt;
        &amp;lt;span class=&amp;quot;card-title&amp;quot; style=&amp;quot;margin:0&amp;quot;&amp;gt;${h.acao}&amp;lt;/span&amp;gt;
        &amp;lt;span class=&amp;quot;fs10 text-muted&amp;quot;&amp;gt;${h.timestamp}&amp;lt;/span&amp;gt;
      &amp;lt;/div&amp;gt;
      &amp;lt;div class=&amp;quot;card-sub&amp;quot; style=&amp;quot;margin-bottom:8px&amp;quot;&amp;gt;${h.inputSnippet}...&amp;lt;/div&amp;gt;
      &amp;lt;div class=&amp;quot;row&amp;quot; style=&amp;quot;gap:6px&amp;quot;&amp;gt;
        &amp;lt;button class=&amp;quot;btn btn-amber&amp;quot; onclick=&amp;quot;restaurarHistorico('${h.id}')&amp;quot;&amp;gt;▶ Restaurar&amp;lt;/button&amp;gt;
        &amp;lt;button class=&amp;quot;btn btn-ghost&amp;quot; onclick=&amp;quot;copiarHistorico('${h.id}')&amp;quot;&amp;gt;📋 Copiar&amp;lt;/button&amp;gt;
        &amp;lt;button class=&amp;quot;btn btn-ghost&amp;quot; onclick=&amp;quot;deletarHistorico('${h.id}')&amp;quot;&amp;gt;🗑&amp;lt;/button&amp;gt;
      &amp;lt;/div&amp;gt;
      &amp;lt;details style=&amp;quot;margin-top:8px&amp;quot;&amp;gt;
        &amp;lt;summary class=&amp;quot;fs10 text-muted&amp;quot; style=&amp;quot;cursor:pointer&amp;quot;&amp;gt;Ver resultado...&amp;lt;/summary&amp;gt;
        &amp;lt;div class=&amp;quot;fs11 text-muted&amp;quot; style=&amp;quot;margin-top:6px;white-space:pre-wrap;max-height:120px;overflow-y:auto;border-top:1px solid var(--border);padding-top:6px&amp;quot;&amp;gt;${h.resultado.substring(0,600)}${h.resultado.length&amp;gt;600?'...':''}&amp;lt;/div&amp;gt;
      &amp;lt;/details&amp;gt;`;
    lista.appendChild(div);
  });
}
function restaurarHistorico(id) {
  const h = historico.find(x =&amp;gt; x.id === id); if (!h) return;
  resultado = h.resultado;
  renderResultado(h.resultado);
  mudarAba('processar', document.querySelector('.tab-btn'));
}
function copiarHistorico(id) {
  const h = historico.find(x =&amp;gt; x.id === id); if (!h) return;
  navigator.clipboard.writeText(h.resultado);
}
function deletarHistorico(id) {
  historico = historico.filter(x =&amp;gt; x.id !== id);
  saveLS('aj_historico', historico);
  renderHistorico();
}

// ══════════════════════════════════════════════════════
//  AÇÕES CUSTOMIZADAS
// ══════════════════════════════════════════════════════
function abrirFormAcao(id) {
  editAcaoId = id || null;
  const form = document.getElementById('form-acao');
  const titulo = document.getElementById('form-acao-titulo');
  if (id) {
    const a = acoesCustom.find(x =&amp;gt; x.id === id);
    document.getElementById('ca-label').value  = a.label;
    document.getElementById('ca-desc').value   = a.descricao;
    document.getElementById('ca-prompt').value = a.prompt;
    titulo.textContent = 'Editar Ação';
  } else {
    document.getElementById('ca-label').value  = '';
    document.getElementById('ca-desc').value   = '';
    document.getElementById('ca-prompt').value = '';
    titulo.textContent = 'Nova Ação';
  }
  form.classList.remove('hidden');
}
function fecharFormAcao() {
  document.getElementById('form-acao').classList.add('hidden');
  editAcaoId = null;
}
function salvarAcao() {
  const label  = document.getElementById('ca-label').value.trim();
  const desc   = document.getElementById('ca-desc').value.trim();
  const prompt = document.getElementById('ca-prompt').value.trim();
  if (!label || !prompt) { alert('Preencha nome e prompt.'); return; }
  if (editAcaoId) {
    acoesCustom = acoesCustom.map(a =&amp;gt; a.id === editAcaoId ? { ...a, label, descricao:desc, prompt } : a);
  } else {
    acoesCustom.push({ id: Date.now().toString(), label, descricao:desc, prompt });
  }
  saveLS('aj_acoes_custom', acoesCustom);
  fecharFormAcao();
  renderAcoes();
  renderAcoesCustomGrid();
}
function deletarAcao(id) {
  if (!confirm('Remover esta ação?')) return;
  acoesCustom = acoesCustom.filter(a =&amp;gt; a.id !== id);
  saveLS('aj_acoes_custom', acoesCustom);
  renderAcoes();
  renderAcoesCustomGrid();
}
function renderAcoes() {
  const lista = document.getElementById('lista-acoes');
  lista.innerHTML = '';
  document.getElementById('tab-acoes-btn').textContent =
    `🪄 Ações${acoesCustom.length ? ` (${acoesCustom.length})` : ''}`;
  if (!acoesCustom.length) {
    lista.innerHTML = '&amp;lt;div class=&amp;quot;text-muted fs12&amp;quot; style=&amp;quot;text-align:center;padding:20px&amp;quot;&amp;gt;Nenhuma ação personalizada. Clique em &amp;quot;+ Nova&amp;quot; para criar.&amp;lt;/div&amp;gt;';
    return;
  }
  acoesCustom.forEach(a =&amp;gt; {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      &amp;lt;div class=&amp;quot;row&amp;quot; style=&amp;quot;justify-content:space-between;margin-bottom:4px&amp;quot;&amp;gt;
        &amp;lt;span class=&amp;quot;card-title text-purple&amp;quot; style=&amp;quot;margin:0&amp;quot;&amp;gt;🪄 ${a.label}&amp;lt;/span&amp;gt;
        &amp;lt;div class=&amp;quot;row&amp;quot; style=&amp;quot;gap:4px&amp;quot;&amp;gt;
          &amp;lt;button class=&amp;quot;btn-icon&amp;quot; onclick=&amp;quot;abrirFormAcao('${a.id}')&amp;quot;&amp;gt;✏️&amp;lt;/button&amp;gt;
          &amp;lt;button class=&amp;quot;btn-icon&amp;quot; onclick=&amp;quot;deletarAcao('${a.id}')&amp;quot;&amp;gt;🗑&amp;lt;/button&amp;gt;
        &amp;lt;/div&amp;gt;
      &amp;lt;/div&amp;gt;
      ${a.descricao ? `&amp;lt;div class=&amp;quot;card-sub&amp;quot; style=&amp;quot;margin-bottom:6px&amp;quot;&amp;gt;${a.descricao}&amp;lt;/div&amp;gt;` : ''}
      &amp;lt;details&amp;gt;
        &amp;lt;summary class=&amp;quot;fs10 text-muted&amp;quot; style=&amp;quot;cursor:pointer&amp;quot;&amp;gt;Ver prompt...&amp;lt;/summary&amp;gt;
        &amp;lt;div class=&amp;quot;fs11 text-muted&amp;quot; style=&amp;quot;margin-top:6px;white-space:pre-wrap;border-top:1px solid var(--border);padding-top:6px&amp;quot;&amp;gt;${a.prompt}&amp;lt;/div&amp;gt;
      &amp;lt;/details&amp;gt;
      &amp;lt;button class=&amp;quot;btn btn-purple&amp;quot; style=&amp;quot;margin-top:8px&amp;quot; onclick=&amp;quot;executarAcaoCustom('${a.id}')&amp;quot;&amp;gt;▶ Executar&amp;lt;/button&amp;gt;`;
    lista.appendChild(div);
  });
}
function renderAcoesCustomGrid() {
  const grid = document.getElementById('grid-acoes-custom');
  const secao = document.getElementById('secao-acoes-custom');
  grid.innerHTML = '';
  if (!acoesCustom.length) { secao.classList.add('hidden'); return; }
  secao.classList.remove('hidden');
  acoesCustom.forEach(a =&amp;gt; {
    const btn = document.createElement('button');
    btn.className = 'action-btn';
    btn.style.cssText = 'border-color:#8b5cf633;color:var(--purple)';
    btn.textContent = '🪄 ' + a.label;
    btn.title = a.descricao || '';
    btn.onclick = () =&amp;gt; executarAcaoCustom(a.id);
    grid.appendChild(btn);
  });
}
function executarAcaoCustom(id) {
  const a = acoesCustom.find(x =&amp;gt; x.id === id); if (!a) return;
  executar(id, a.prompt);
}
