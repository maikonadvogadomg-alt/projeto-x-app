<script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;></script>
<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const resultsDiv = document.getElementById('results');
const loadingDiv = document.getElementById('loading');

// Drag and drop
dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('dragover');
});
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});

fileInput.addEventListener('change', e => {
  handleFiles(e.target.files);
});

async function handleFiles(files) {
  if (files.length === 0) return;
  
  loadingDiv.style.display = 'block';
  resultsDiv.innerHTML = '';
  
  const versions = [];
  
  try {
    for (let file of files) {
      const zip = new JSZip();
      const content = await zip.loadAsync(file);
      const versionName = file.name.replace('.zip', '');
      
      const fileStructure = {};
      const fileContents = {};
      
      for (let [path, zipEntry] of Object.entries(content.files)) {
        if (!zipEntry.dir) {
          fileStructure[path] = zipEntry.date;
          
          // Lê arquivos importantes
          if (path.includes('.js') || path.includes('.html') || path.includes('.json')) {
            try {
              fileContents[path] = await zipEntry.async('text');
            } catch (e) {}
          }
        }
      }
      
      versions.push({
        name: versionName,
        fileStructure,
        fileContents,
        fileCount: Object.keys(fileStructure).length
      });
    }
    
    loadingDiv.style.display = 'none';
    displayAnalysis(versions);
    
  } catch (err) {
    loadingDiv.style.display = 'none';
    resultsDiv.innerHTML = `<div class=&quot;card&quot; style=&quot;border-color: #f87171;&quot;><h3>❌ Erro ao processar</h3><pre>${err.message}</pre></div>`;
  }
}

function displayAnalysis(versions) {
  let html = '';
  
  // 1. RESUMO DE CADA VERSÃO
  html += '<h2 style=&quot;color: #a3a082; margin: 20px 0 15px 0; font-size: 16px;&quot;>📊 Resumo das Versões</h2>';
  html += '<div class=&quot;results&quot;>';
  
  versions.forEach(v => {
    const jsFiles = Object.keys(v.fileContents).filter(f => f.endsWith('.js'));
    const hasBackend = Object.keys(v.fileStructure).some(f => f.includes('server') || f.includes('backend') || f.includes('api'));
    const hasDb = Object.keys(v.fileStructure).some(f => f.includes('database') || f.includes('db') || f.includes('sql'));
    
    html += `
      <div class=&quot;card&quot;>
        <h3>📦 ${v.name}</h3>
        <div class=&quot;stats&quot;>
          <p><strong>Total de arquivos:</strong> <span class=&quot;highlight&quot;>${v.fileCount}</span></p>
          <p><strong>Arquivos JS:</strong> <span class=&quot;highlight&quot;>${jsFiles.length}</span></p>
          <p><strong>Backend:</strong> ${hasBackend ? '<span class=&quot;diff-add&quot;>✓ SIM</span>' : '<span class=&quot;diff-remove&quot;>✗ NÃO</span>'}</p>
          <p><strong>Banco de dados:</strong> ${hasDb ? '<span class=&quot;diff-add&quot;>✓ SIM</span>' : '<span class=&quot;diff-remove&quot;>✗ NÃO</span>'}</p>
        </div>
      </div>
    `;
  });
  
  html += '</div>';
  
  // 2. COMPARAÇÃO DE ARQUIVOS
  if (versions.length >= 2) {
    html += '<h2 style=&quot;color: #a3a082; margin: 20px 0 15px 0; font-size: 16px;&quot;>🔄 Comparação entre Versões</h2>';
    
    const v1 = versions[0];
    const v2 = versions[1];
    
    const files1 = new Set(Object.keys(v1.fileStructure));
    const files2 = new Set(Object.keys(v2.fileStructure));
    
    const added = [...files2].filter(f => !files1.has(f));
    const removed = [...files1].filter(f => !files2.has(f));
    const common = [...files1].filter(f => files2.has(f));
    
    html += `
      <div class=&quot;stats&quot;>
        <p><span class=&quot;diff-add&quot;>✓ Adicionados:</span> ${added.length} arquivos</p>
        <p><span class=&quot;diff-remove&quot;>✗ Removidos:</span> ${removed.length} arquivos</p>
        <p><span class=&quot;diff-neutral&quot;>= Mantidos:</span> ${common.length} arquivos</p>
      </div>
    `;
    
    if (added.length > 0) {
      html += `<div class=&quot;card&quot;><h3 class=&quot;diff-add&quot;>✓ Arquivos Novos</h3><pre>${added.slice(0, 20).join('\n')}</pre></div>`;
    }
    
    if (removed.length > 0) {
      html += `<div class=&quot;card&quot;><h3 class=&quot;diff-remove&quot;>✗ Arquivos Removidos</h3><pre>${removed.slice(0, 20).join('\n')}</pre></div>`;
    }
  }
  
  // 3. ANÁLISE DE CÓDIGO
  html += '<h2 style=&quot;color: #a3a082; margin: 20px 0 15px 0; font-size: 16px;&quot;>🔎 Análise de Código</h2>';
  
  versions.forEach((v, idx) => {
    const jsFiles = Object.keys(v.fileContents).filter(f => f.endsWith('.js'));
    
    let analysis = {
      hasHistorico: false,
      hasMinuta: false,
      hasResumo: false,
      hasAPI: false,
      hasDatabase: false,
      hasAuth: false,
      functions: []
    };
    
    jsFiles.forEach(file => {
      const code = v.fileContents[file];
      
      if (code.includes('historico') || code.includes('history')) analysis.hasHistorico = true;
      if (code.includes('minuta') || code.includes('minute')) analysis.hasMinuta = true;
      if (code.includes('resumo') || code.includes('summary')) analysis.hasResumo = true;
      if (code.includes('fetch') || code.includes('axios')) analysis.hasAPI = true;
      if (code.includes('database') || code.includes('db.')) analysis.hasDatabase = true;
      if (code.includes('auth') || code.includes('token')) analysis.hasAuth = true;
      
      // Extrai funções principais
      const funcMatches = code.match(/(?:async\s+)?function\s+(\w+)|const\s+(\w+)\s*=\s*(?:async\s*)?\(/g);
      if (funcMatches) {
        analysis.functions.push(...funcMatches.slice(0, 5));
      }
    });
    
    html += `
      <div class=&quot;card&quot;>
        <h3>🔧 ${v.name}</h3>
        <div class=&quot;stats&quot;>
          <p><strong>Histórico:</strong> ${analysis.hasHistorico ? '<span class=&quot;diff-add&quot;>✓</span>' : '<span class=&quot;diff-remove&quot;>✗</span>'}</p>
          <p><strong>Minuta:</strong> ${analysis.hasMinuta ? '<span class=&quot;diff-add&quot;>✓</span>' : '<span class=&quot;diff-remove&quot;>✗</span>'}</p>
          <p><strong>Resumo:</strong> ${analysis.hasResumo ? '<span class=&quot;diff-add&quot;>✓</span>' : '<span class=&quot;diff-remove&quot;>✗</span>'}</p>
          <p><strong>API:</strong> ${analysis.hasAPI ? '<span class=&quot;diff-add&quot;>✓</span>' : '<span class=&quot;diff-remove&quot;>✗</span>'}</p>
          <p><strong>Database:</strong> ${analysis.hasDatabase ? '<span class=&quot;diff-add&quot;>✓</span>' : '<span class=&quot;diff-remove&quot;>✗</span>'}</p>
          <p><strong>Auth:</strong> ${analysis.hasAuth ? '<span class=&quot;diff-add&quot;>✓</span>' : '<span class=&quot;diff-remove&quot;>✗</span>'}</p>
        </div>
      </div>
    `;
  });
  
  resultsDiv.innerHTML = html;
}
</script>

<script>

async function handleFile(file) {
  if (!file) return;
  
  loadingDiv.style.display = 'block';
  resultsDiv.innerHTML = '';
  
  try {
    const fileType = file.name.split('.').pop().toLowerCase();
    let fileStructure = {};
    let fileContents = {};
    
    if (fileType === 'zip') {
      ({ fileStructure, fileContents } = await processZip(file));
    } else if (['tar', 'gz', 'tgz', 'bz2'].includes(fileType)) {
      ({ fileStructure, fileContents } = await processTar(file));
    } else {
      throw new Error('Formato não suportado. Use .zip ou .tar');
    }
    
    loadingDiv.style.display = 'none';
    displayAnalysis(fileStructure, fileContents, file.name);
    
  } catch (err) {
    loadingDiv.style.display = 'none';
    resultsDiv.innerHTML = `<div class=&quot;card&quot; style=&quot;border-left-color: #f87171;&quot;>
      <h3>❌ Erro ao processar</h3>
      <p style=&quot;color: #f87171;&quot;>${err.message}</p>
    </div>`;
  }
}

async function processZip(file) {
  const zip = new JSZip();
  const content = await zip.loadAsync(file);
  
  const fileStructure = {};
  const fileContents = {};
  
  for (let [path, zipEntry] of Object.entries(content.files)) {
    if (!zipEntry.dir) {
      fileStructure[path] = {
        size: zipEntry._data.uncompressedSize,
        date: zipEntry.date,
        isHidden: path.includes('/.')
      };
      
      if (shouldExtractContent(path)) {
        try {
          fileContents[path] = await zipEntry.async('text');
        } catch (e) {}
      }
    }
  }
  
  return { fileStructure, fileContents };
}

async function processTar(file) {
  const arrayBuffer = await file.arrayBuffer();
  const fileStructure = {};
  const fileContents = {};
  
  // Simula leitura de TAR (para produção, use biblioteca tar.js completa)
  // Por enquanto, retorna estrutura vazia
  console.warn('TAR processing requer biblioteca adicional');
  
  return { fileStructure, fileContents };
}

function shouldExtractContent(path) {
  const extensions = ['.js', '.html', '.css', '.json', '.md', '.txt', '.env', '.yml', '.yaml'];
  const isLarge = path.split('/').pop().length > 100;
  
  return extensions.some(ext => path.endsWith(ext)) &amp;&amp; !isLarge;
}

function analyzeFileStructure(fileStructure, fileContents) {
  const files = Object.keys(fileStructure);
  const stats = {
    totalFiles: files.length,
    hiddenFiles: files.filter(f => f.includes('/.')).length,
    codeFiles: files.filter(f => /\.(js|html|css|jsx|tsx|py|java|cpp)$/.test(f)).length,
    configFiles: files.filter(f => /\.(json|yml|yaml|env|config)$/.test(f)).length,
    totalSize: Object.values(fileStructure).reduce((sum, f) => sum + (f.size || 0), 0),
    hasGit: files.some(f => f.includes('.git')),
    gitInfo: fileContents[Object.keys(fileContents).find(f => f.includes('.git/config'))] || null
  };
  return stats;
}

function analyzeCodeContent(fileContents) {
  const analysis = {
    technologies: {},
    functions: [],
    issues: []
  };
  
  Object.entries(fileContents).forEach(([path, content]) => {
    // Detectar tecnologias
    if (path.endsWith('.js')) {
      if (content.includes('React')) analysis.technologies['React'] = (analysis.technologies['React'] || 0) + 1;
      if (content.includes('Vue')) analysis.technologies['Vue'] = (analysis.technologies['Vue'] || 0) + 1;
      if (content.includes('Angular')) analysis.technologies['Angular'] = (analysis.technologies['Angular'] || 0) + 1;
      if (content.includes('Express')) analysis.technologies['Express'] = (analysis.technologies['Express'] || 0) + 1;
      if (content.includes('async')) analysis.technologies['Async/Await'] = (analysis.technologies['Async/Await'] || 0) + 1;
    }
    
    if (path.endsWith('.html')) analysis.technologies['HTML'] = (analysis.technologies['HTML'] || 0) + 1;
    if (path.endsWith('.css')) analysis.technologies['CSS'] = (analysis.technologies['CSS'] || 0) + 1;
    if (path.endsWith('.json')) analysis.technologies['JSON'] = (analysis.technologies['JSON'] || 0) + 1;
    
    // Extrair funções
    const funcMatches = content.match(/(?:async\s+)?function\s+(\w+)|const\s+(\w+)\s*=\s*(?:async\s*)?\(/g);
    if (funcMatches) {
      funcMatches.forEach(match => {
        const name = match.replace(/(?:async\s+)?function\s+|const\s+|\s*=\s*(?:async\s*)?\(/g, '');
        if (!analysis.functions.includes(name)) {
          analysis.functions.push(name);
        }
      });
    }
    
    // Detectar problemas
    if (content.includes('console.log') &amp;&amp; path.includes('production')) {
      analysis.issues.push({
        type: 'console.log em produção',
        description: `Arquivo ${path} contém console.log`
      });
    }
    
    if (content.includes('TODO') || content.includes('FIXME')) {
      analysis.issues.push({
        type: 'TODO/FIXME encontrado',
        description: `Arquivo ${path} contém tarefas pendentes`
      });
    }
    
    if (content.includes('eval(') || content.includes('innerHTML')) {
      analysis.issues.push({
        type: 'Possível vulnerabilidade',
        description: `Arquivo ${path} usa eval() ou innerHTML`
      });
    }
  });
  
  return analysis;
}

function generateFolderStructure(fileStructure, showHidden) {
  const folders = new Set();
  
  Object.keys(fileStructure).forEach(path => {
    if (showHidden || !path.includes('/.')) {
      const parts = path.split('/');
      parts.pop();
      let current = '';
      parts.forEach(part => {
        current += part + '/';
        folders.add(current);
      });
    }
  });
  
  const sortedFolders = Array.from(folders).sort();
  
  return sortedFolders.map(folder => {
    const depth = folder.split('/').length - 2;
    const name = folder.split('/').filter(p => p).pop();
    const isHidden = name.startsWith('.');
    
    return `
      <div class=&quot;file-tree-item ${isHidden ? 'hidden' : ''}&quot;>
        ${'&amp;nbsp;&amp;nbsp;'.repeat(depth)}📁 ${name}/
      </div>
    `;
  }).join('');
}

function getImportantFiles(fileContents) {
  const important = {};
  const importantNames = ['README.md', 'package.json', '.env', '.env.example', 'config.json', '.gitignore'];
  
  Object.entries(fileContents).forEach(([path, content]) => {
    const fileName = path.split('/').pop();
    if (importantNames.includes(fileName)) {
      important[fileName] = content;
    }
  });
  
  return important;
}

function escapeHtml(text) {
  const map = {
    '&amp;': '&amp;amp;',
    '<': '&amp;lt;',
    '>': '&amp;gt;',
    '&quot;': '&amp;quot;',
    &quot;'&quot;: '&amp;#039;'
  };
  return text.replace(/[&amp;<>&quot;']/g, m => map[m]);
}

function switchTab(e, tabName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  
  e.target.classList.add('active');
  document.getElementById(tabName).classList.add('active');
}

function exportAsJSON(statsJson) {
  const stats = JSON.parse(statsJson);
  const json = JSON.stringify(stats, null, 2);
  downloadFile(json, 'relatorio.json', 'application/json');
}

function exportAsMarkdown(fileName, statsJson) {

<div class=&quot;container&quot;>
  <h1>📜 Rastreador de Histórico Replit</h1>

  <div class=&quot;upload-area&quot; id=&quot;dropZone&quot;>
    <p style=&quot;font-size: 18px; margin-bottom: 10px;&quot;>📦 Arraste seu ZIP da Replit aqui</p>

  </div>

  <div id=&quot;loading&quot; class=&quot;loading&quot; style=&quot;display:none;&quot;>

  </div>

  <div id=&quot;results&quot;></div>

<script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;></script>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const resultsDiv = document.getElementById('results');
const loadingDiv = document.getElementById('loading');

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('dragover');
});
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', e => {
  handleFile(e.target.files[0]);
});

async function handleFile(file) {
  if (!file) return;
  
  loadingDiv.style.display = 'block';
  resultsDiv.innerHTML = '';
  
  try {
    const zip = new JSZip();
    const content = await zip.loadAsync(file);
    
    const versions = [];
    const allFiles = {};
    
    // Extrai todas as versões
    for (let [path, zipEntry] of Object.entries(content.files)) {
      if (!zipEntry.dir) {
        allFiles[path] = zipEntry;
      }
    }
    
    // Procura por padrões de versão
    const versionPatterns = [
      /\.replit\/versions\/\d+/,
      /\.versions\/\d+/,
      /version_\d+/,
      /v\d+\//,
      /backup_\d+/,
      /snapshot_\d+/
    ];
    
    const versionedFiles = Object.keys(allFiles).filter(path => 
      versionPatterns.some(pattern => pattern.test(path))
    );
    
    loadingDiv.style.display = 'none';
    
    if (versionedFiles.length > 0) {
      await analyzeVersions(content, allFiles, versionedFiles);
    } else {
      // Se não encontrar versões, analisa estrutura geral
      await analyzeStructure(content, allFiles);
    }
    
  } catch (err) {
    loadingDiv.style.display = 'none';
    resultsDiv.innerHTML = `<div class=&quot;card&quot; style=&quot;border-left-color: #f87171;&quot;>
      <h3>❌ Erro ao processar</h3>
      <p style=&quot;color: #f87171;&quot;>${err.message}</p>
    </div>`;
  }
}

async function analyzeVersions(zip, allFiles, versionedFiles) {
  const timeline = [];
  const fileChanges = {};
  
  // Agrupa arquivos por versão
  const versions = new Map();
  
  for (let path of versionedFiles) {
    const match = path.match(/(\d{4}-\d{2}-\d{2})|(\d+)/);
    const versionKey = match ? match[0] : path;
    
    if (!versions.has(versionKey)) {
      versions.set(versionKey, []);
    }
    versions.get(versionKey).push(path);
  }
  
  // Analisa cada versão
  const sortedVersions = Array.from(versions.entries()).sort();
  
  for (let [versionKey, files] of sortedVersions) {
    const versionData = {
      version: versionKey,
      timestamp: parseVersionDate(versionKey),
      files: files,
      changes: [],
      type: 'change'
    };
    
    // Analisa conteúdo dos arquivos
    for (let filePath of files) {
      try {
        const content = await zip.file(filePath).async('text');
        const analysis = analyzeFileContent(content, filePath);
        
        if (analysis.type) {
          versionData.type = analysis.type;
          versionData.changes.push(analysis);
        }
      } catch (e) {}
    }
    
    timeline.push(versionData);
  }
  
  displayTimeline(timeline);
}

async function analyzeStructure(zip, allFiles) {
  // Se não houver versões, analisa a estrutura geral
  const files = Object.keys(allFiles);
  const analysis = {
    totalFiles: files.length,
    jsFiles: files.filter(f => f.endsWith('.js')).length,
    htmlFiles: files.filter(f => f.endsWith('.html')).length,
    cssFiles: files.filter(f => f.endsWith('.css')).length,
    jsonFiles: files.filter(f => f.endsWith('.json')).length,
    hiddenFiles: files.filter(f => f.includes('/.')).length,
    folders: new Set(files.map(f => f.split('/')[0])).size
  };
  
  let html = `
    <div class=&quot;results&quot;>
      <h2>📊 Estrutura do Projeto</h2>
      <div class=&quot;stats-grid&quot;>
        <div class=&quot;stat-box&quot;>
          <strong>${analysis.totalFiles}</strong>
          <span>Total de Arquivos</span>
        </div>
        <div class=&quot;stat-box&quot;>
          <strong>${analysis.jsFiles}</strong>
          <span>Arquivos JS</span>
        </div>
        <div class=&quot;stat-box&quot;>
          <strong>${analysis.htmlFiles}</strong>
          <span>Arquivos HTML</span>
        </div>
        <div class=&quot;stat-box&quot;>
          <strong>${analysis.cssFiles}</strong>
          <span>Arquivos CSS</span>
        </div>
        <div class=&quot;stat-box&quot;>
          <strong>${analysis.jsonFiles}</strong>
          <span>Arquivos JSON</span>
        </div>
        <div class=&quot;stat-box&quot;>
          <strong>${analysis.folders}</strong>
          <span>Pastas</span>
        </div>
      </div>
    </div>
  `;
  
  // Analisa arquivos principais
  const mainFiles = ['package.json', 'index.html', 'app.js', 'server.js', 'README.md'];
  let filesList = '';
  
  for (let [path, file] of Object.entries(allFiles)) {
    const fileName = path.split('/').pop();
    if (mainFiles.includes(fileName)) {
      try {
        const content = await file.async('text');
        filesList += `
          <div class=&quot;card&quot;>
            <h3>📄 ${fileName}</h3>
            <div class=&quot;code-block&quot;>
              ${escapeHtml(content.substring(0, 300))}${content.length > 300 ? '...' : ''}
            </div>
          </div>
        `;
      } catch (e) {}
    }
  }
  
  if (filesList) {
    html += `<div class=&quot;results&quot;><h2>📄 Arquivos Principais</h2>${filesList}</div>`;
  }
  
  resultsDiv.innerHTML = html;
}

function analyzeFileContent(content, filePath) {
  const analysis = {
    file: filePath,
    type: null,
    description: '',
    keywords: []
  };
  
  const lowerContent = content.toLowerCase();
  
  // Detecta tipo de mudança
  if (lowerContent.includes('bug') || lowerContent.includes('erro') || lowerContent.includes('fix')) {
    analysis.type = 'bug';
    analysis.description = '🐛 Correção de bug';
  }
  
  if (lowerContent.includes('feature') || lowerContent.includes('novo') || lowerContent.includes('adicionado')) {
    analysis.type = 'feature';
    analysis.description = '✨ Nova funcionalidade';
  }
  
  if (lowerContent.includes('refactor') || lowerContent.includes('refatoração')) {
    analysis.type = 'refactor';
    analysis.description = '🔄 Refatoração';
  }
  
  if (lowerContent.includes('historico') || lowerContent.includes('history')) {
    analysis.keywords.push('Histórico da IA');
  }
  
  if (lowerContent.includes('minuta') || lowerContent.includes('minute')) {
    analysis.keywords.push('Geração de Minuta');
  }
  
  if (lowerContent.includes('resumo') || lowerContent.includes('summary')) {
    analysis.keywords.push('Resumo');
  }
  
  if (lowerContent.includes('backend') || lowerContent.includes('server') || lowerContent.includes('api')) {
    analysis.keywords.push('Backend/API');
  }
  
  if (lowerContent.includes('database') || lowerContent.includes('db') || lowerContent.includes('sql')) {
    analysis.keywords.push('Banco de Dados');
  }
  
  if (lowerContent.includes('auth') || lowerContent.includes('autenticação')) {
    analysis.keywords.push('Autenticação');
  }
  
  if (lowerContent.includes('ia') || lowerContent.includes('ai') || lowerContent.includes('inteligência')) {
    analysis.keywords.push('Integração IA');
  }
  
  return analysis;
}

function parseVersionDate(versionKey) {
  // Tenta parsear diferentes formatos de data
  const dateMatch = versionKey.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (dateMatch) {
    return new Date(dateMatch[0]);
  }
  
  // Se for número, assume como timestamp
  if (/^\d+$/.test(versionKey)) {
    return new Date(parseInt(versionKey));
  }
  
  return new Date();
}

function displayTimeline(timeline) {
  let html = `
    <div class=&quot;results&quot;>
      <h2>📈 Estatísticas Gerais</h2>
      <div class=&quot;stats-grid&quot;>
        <div class=&quot;stat-box&quot;>
          <strong>${timeline.length}</strong>
          <span>Versões Detectadas</span>
        </div>
        <div class=&quot;stat-box&quot;>
          <strong>${timeline.filter(t => t.type === 'bug').length}</strong>
          <span>Correções</span>
        </div>
        <div class=&quot;stat-box&quot;>
          <strong>${timeline.filter(t => t.type === 'feature').length}</strong>
          <span>Features</span>
        </div>
        <div class=&quot;stat-box&quot;>
          <strong>${timeline.filter(t => t.type === 'refactor').length}</strong>
          <span>Refatorações</span>
        </div>
      </div>
    </div>
  `;
  
  // Timeline visual
  html += `
    <div class=&quot;results&quot;>
      <h2>📜 Histórico de Mudanças</h2>
      <div class=&quot;timeline&quot;>
  `;
  
  timeline.reverse().forEach((item, idx) => {
    const typeClass = item.type || 'change';
    const typeEmoji = {
      'bug': '🐛',
      'feature': '✨',
      'refactor': '🔄',
      'change': '📝'
    }[typeClass] || '📝';
    
    html += `
      <div class=&quot;timeline-item ${typeClass}&quot;>
        <div class=&quot;timeline-dot&quot;></div>
        <div class=&quot;timeline-content&quot;>
          <div class=&quot;timeline-date&quot;>${formatDate(item.timestamp)}</div>
          <div class=&quot;timeline-title&quot;>${typeEmoji} ${item.version}</div>
          <div class=&quot;timeline-desc&quot;>${item.changes.length} arquivo(s) alterado(s)</div>
          
          ${item.changes.length > 0 ? `
            <div class=&quot;timeline-files&quot;>
              ${item.changes.map(c => `
                <div class=&quot;file-item&quot;>
                  ${c.keywords.length > 0 ? `<strong>${c.keywords.join(', ')}</strong><br/>` : ''}
                  ${c.file.split('/').pop()}
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>
      </div>
    `;
  });
  
  html += `
      </div>
    </div>
  `;
  
  // Resumo de funcionalidades
  const allKeywords = new Map();
  timeline.forEach(item => {
    item.changes.forEach(change => {
      change.keywords.forEach(kw => {
        allKeywords.set(kw, (allKeywords.get(kw) || 0) + 1);
      });
    });
  });
  
  if (allKeywords.size > 0) {
    html += `
      <div class=&quot;results&quot;>
        <h2>🎯 Funcionalidades Rastreadas</h2>
    `;
    
    for (let [keyword, count] of allKeywords) {
      html += `
        <div class=&quot;summary-box&quot;>
          <strong>${keyword}</strong>
          <span style=&quot;float: right; color: #a3a082;&quot;>${count} mudança(s)</span>
        </div>
      `;
    }
    
    html += `</div>`;
  }
  
  // Botões de exportação
  html += `
    <div class=&quot;results&quot;>
      <h2>📥 Exportar Relatório</h2>
      <div class=&quot;export-buttons&quot;>
        <button class=&quot;btn btn-secondary&quot; onclick=&quot;exportTimeline('${escapeHtml(JSON.stringify(timeline))}', 'json')&quot;>
          📋 JSON
        </button>
        <button class=&quot;btn btn-secondary&quot; onclick=&quot;exportTimeline('${escapeHtml(JSON.stringify(timeline))}', 'markdown')&quot;>
          📝 Markdown
        </button>
        <button class=&quot;btn btn-secondary&quot; onclick=&quot;exportTimeline('${escapeHtml(JSON.stringify(timeline))}', 'html')&quot;>
          🌐 HTML
        </button>
      </div>
    </div>
  `;
  
  resultsDiv.innerHTML = html;
}

function formatDate(date) {
  if (!date || isNaN(date)) return 'Data desconhecida';
  return date.toLocaleDateString('pt-BR', { 
    year: 'numeric', 
    month: '2-digit', 
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit'
  });
}

function escapeHtml(text) {
  const map = {
    '&amp;': '&amp;amp;',
    '<': '&amp;lt;',
    '>': '&amp;gt;',
    '&quot;': '&amp;quot;',
    &quot;'&quot;: '&amp;#039;'
  };
  return text.replace(/[&amp;<>&quot;']/g, m => map[m]);
}

function exportTimeline(timelineJson, format) {
  const timeline = JSON.parse(timelineJson);
  
  if (format === 'json') {
    const json = JSON.stringify(timeline, null, 2);
    downloadFile(json, 'historico.json', 'application/json');
  } else if (format === 'markdown') {
    let md = '# Histórico de Mudanças — PWA Jurídico\n\n';
    md += `**Gerado em:** ${new Date().toLocaleString('pt-BR')}\n\n`;
    md += `## 📊 Resumo\n`;
    md += `- Total de versões: ${timeline.length}\n`;
    md += `- Correções: ${timeline.filter(t => t.type === 'bug').length}\n`;
    md += `- Features: ${timeline.filter(t => t.type === 'feature').length}\n\n`;
    
    md += `## 📜 Mudanças por Versão\n\n`;
    timeline.forEach(item => {
      md += `### ${item.version} (${formatDate(item.timestamp)})\n`;
      item.changes.forEach(change => {
        md += `- ${change.file}\n`;
        if (change.keywords.length > 0) {
          md += `  - Tags: ${change.keywords.join(', ')}\n`;
        }
      });
      md += '\n';
    });
    
    downloadFile(md, 'historico.md', 'text/markdown');
  } else if (format === 'html') {
    let html = `<!DOCTYPE html>
<html>
<head>
  <meta charset=&quot;UTF-8&quot;>
  <title>Histórico - PWA Jurídico</title>
  <style>
    body { font-family: Arial; background: #f5f5f5; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
    h1 { color: #333; }
    .version { margin: 20px 0; padding: 15px; background: #f9f9f9; border-left: 4px solid #007bff; }
    .file { margin: 10px 0; padding: 10px; background: #f0f0f0; border-radius: 4px; font-family: monospace; }
  </style>
</head>
<body>
  <div class=&quot;container&quot;>
    <h1>📜 Histórico de Mudanças</h1>
    <p><strong>Gerado em:</strong> ${new Date().toLocaleString('pt-BR')}</p>
`;
    
    timeline.forEach(item => {
      html += `<div class=&quot;version&quot;>
        <h2>${item.version}</h2>
        <p><strong>Data:</strong> ${formatDate(item.timestamp)}</p>
        <p><strong>Arquivos:</strong> ${item.changes.length}</p>
`;
      item.changes.forEach(change => {
        html += `<div class=&quot;file&quot;>${change.file}</div>`;
      });
      html += `</div>`;
    });
    
    html += `
  </div>
</body>
</html>`;
    
    downloadFile(html, 'historico.html', 'text/html');
  }
}

function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}
</script>

<div class=&quot;container&quot;>
  <h1>📚 Gerador de Documentação Automática</h1>
  <p class=&quot;subtitle&quot;>Gera documentação completa do projeto em múltiplos formatos</p>

  <div class=&quot;upload-area&quot; id=&quot;dropZone&quot;>
    <p style=&quot;font-size: 18px; margin-bottom: 10px;&quot;>📦 Arraste seu ZIP da Replit aqui</p>
    <p style=&quot;color: #94a3b8; font-size: 13px; margin-bottom: 15px;&quot;>Será analisado e gerará documentação automática</p>
    <button class=&quot;btn&quot; onclick=&quot;document.getElementById('fileInput').click()&quot;>Selecionar ZIP</button>
    <input type=&quot;file&quot; id=&quot;fileInput&quot; accept=&quot;.zip&quot; />
  </div>

  <div id=&quot;loading&quot; class=&quot;loading&quot; style=&quot;display:none;&quot;>
    <div class=&quot;spinner&quot;></div>
    <p>Analisando projeto e gerando documentação...</p>
  </div>

  <div id=&quot;results&quot;></div>
</div>

<script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;></script>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const resultsDiv = document.getElementById('results');
const loadingDiv = document.getElementById('loading');

let projectDocs = {
  projectInfo: {},
  apis: [],
  functions: [],
  components: [],
  modules: [],
  dependencies: [],
  fileStructure: {},
  examples: [],
  gettingStarted: '',
  architecture: ''
};

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('dragover');
});
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', e => {
  handleFile(e.target.files[0]);
});

async function handleFile(file) {
  if (!file) return;
  
  loadingDiv.style.display = 'block';
  resultsDiv.innerHTML = '';
  projectDocs = {
    projectInfo: {},
    apis: [],
    functions: [],
    components: [],
    modules: [],
    dependencies: [],
    fileStructure: {},
    examples: [],
    gettingStarted: '',
    architecture: ''
  };
  
  try {
    const zip = new JSZip();
    const content = await zip.loadAsync(file);
    
    const files = {};
    
    // Extrai arquivos
    for (let [path, zipEntry] of Object.entries(content.files)) {
      if (!zipEntry.dir) {
        try {
          const fileContent = await zipEntry.async('text');
          files[path] = fileContent;
        } catch (e) {}
      }
    }
    
    // Gera documentação
    generateDocumentation(files);
    
    loadingDiv.style.display = 'none';
    displayDocumentation();
    
  } catch (err) {
    loadingDiv.style.display = 'none';
    resultsDiv.innerHTML = `<div class=&quot;card&quot;>
      <div class=&quot;card-title&quot;>❌ Erro ao processar</div>
      <div class=&quot;card-content&quot;>${err.message}</div>
    </div>`;
  }
}

function generateDocumentation(files) {
  // Análise de package.json
  for (let [path, content] of Object.entries(files)) {
    if (path.includes('package.json')) {
      try {
        const pkg = JSON.parse(content);
        projectDocs.projectInfo = {
          name: pkg.name || 'Projeto sem nome',
          version: pkg.version || '1.0.0',
          description: pkg.description || 'Sem descrição',
          author: pkg.author || 'Desconhecido',
          license: pkg.license || 'MIT',
          homepage: pkg.homepage || '',
          repository: pkg.repository || ''
        };
        
        projectDocs.dependencies = Object.entries(pkg.dependencies || {}).map(([name, version]) => ({
          name,
          version,
          type: 'production'
        })).concat(
          Object.entries(pkg.devDependencies || {}).map(([name, version]) => ({
            name,
            version,
            type: 'development'
          }))
        );
      } catch (e) {}
    }
  }
  
  // Análise de arquivos JS/TS
  for (let [path, content] of Object.entries(files)) {
    if (/\.(js|ts|jsx|tsx)$/.test(path)) {
      analyzeJSFile(path, content);
    }
  }
  
  // Análise de estrutura de arquivos
  analyzeFileStructure(files);
  
  // Gera guia de início
  generateGettingStarted();
  
  // Gera arquitetura
  generateArchitecture();
}

function analyzeJSFile(filePath, content) {
  // Detecta funções
  const functionPattern = /(?:export\s+)?(?:async\s+)?function\s+(\w+)\s*\(([^)]*)\)\s*(?::\s*(\w+))?\s*\{/g;
  let match;
  
  while ((match = functionPattern.exec(content)) !== null) {
    const name = match[1];
    const params = match[2].split(',').map(p => p.trim()).filter(p => p);
    const returnType = match[3] || 'void';
    
    // Tenta encontrar comentário JSDoc
    const docPattern = new RegExp(`/\\*\\*[\\s\\S]*?\\*\\/\\s*(?:export\\s+)?(?:async\\s+)?function\\s+${name}`, 'g');
    const docMatch = docPattern.exec(content);
    
    projectDocs.functions.push({
      name,
      file: filePath,
      params,
      returnType,
      description: 'Função do projeto',
      example: `${name}(${params.join(', ')})`
    });
  }
  
  // Detecta APIs (endpoints)
  const apiPatterns = [
    { regex: /app\.(get|post|put|delete|patch)\s*\(\s*['&quot;`]([^'&quot;`]+)['&quot;`]/g, type: 'express' },
    { regex: /router\.(get|post|put|delete|patch)\s*\(\s*['&quot;`]([^'&quot;`]+)['&quot;`]/g, type: 'express' }
  ];
  
  apiPatterns.forEach(pattern => {
    let apiMatch;
    const regex = new RegExp(pattern.regex.source, 'g');
    
    while ((apiMatch = regex.exec(content)) !== null) {
      const method = apiMatch[1].toUpperCase();
      const path = apiMatch[2];
      
      projectDocs.apis.push({
        method,
        path,
        file: filePath,
        description: `${method} ${path}`,
        params: [],
        response: 'JSON'
      });
    }
  });
  
  // Detecta componentes React/Vue
  if (content.includes('export default') || content.includes('export const')) {
    const componentPattern = /(?:export\s+(?:default\s+)?)?(?:const|function)\s+(\w+)\s*(?:=|:)/g;
    let compMatch;
    
    while ((compMatch = componentPattern.exec(content)) !== null) {
      const componentName = compMatch[1];
      if (componentName.charAt(0) === componentName.charAt(0).toUpperCase()) {
        projectDocs.components.push({
          name: componentName,
          file: filePath,
          description: `Componente ${componentName}`,
          props: [],
          usage: `<${componentName} />`
        });
      }
    }
  }
}

function analyzeFileStructure(files) {
  const structure = {};
  
  Object.keys(files).forEach(path => {
    const parts = path.split('/');
    let current = structure;
    
    parts.forEach((part, idx) => {
      if (!current[part]) {
        current[part] = {};
      }
      if (idx === parts.length - 1) {
        current[part]._file = true;
      }
      current = current[part];
    });
  });
  
  projectDocs.fileStructure = structure;
}

function generateGettingStarted() {
  projectDocs.gettingStarted = `
# 🚀 Guia de Início Rápido

## Instalação

\`\`\`bash
npm install
\`\`\`

## Desenvolvimento

\`\`\`bash
npm run dev
\`\`\`

## Build

\`\`\`bash

\`\`\`

## Testes

\`\`\`bash
npm test
\`\`\`

## Estrutura do Projeto

\`\`\`
${generateFileTree()}
\`\`\`
  `;
}

function generateFileTree() {
  let tree = '';
  
  function buildTree(obj, prefix = '') {
    Object.entries(obj).forEach(([key, value], idx, arr) => {
      const isLast = idx === arr.length - 1;
      const connector = isLast ? '└── ' : '├── ';
      tree += prefix + connector + key + '\n';
      
      if (value._file !== true &amp;&amp; Object.keys(value).length > 0) {
        const nextPrefix = prefix + (isLast ? '    ' : '│   ');
        buildTree(value, nextPrefix);
      }
    });
  }
  
  buildTree(projectDocs.fileStructure);
  return tree;
}

## Dependências Principais

${projectDocs.dependencies.filter(d => d.type === 'production').slice(0, 10).map(dep => `- **${dep.name}** (${dep.version})`).join('\n')}

## Fluxo de Dados

1. Cliente faz requisição
2. API processa dados
3. Banco de dados é consultado
4. Resposta é retornada
5. Frontend renderiza resultado
  `;
}

function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function escapeHtml(text) {
  const map = {
    '&amp;': '&amp;amp;',
    '<': '&amp;lt;',
    '>': '&amp;gt;',
    '&quot;': '&amp;quot;',
    &quot;'&quot;: '&amp;#039;'
  };
  return text.replace(/[&amp;<>&quot;']/g, m => map[m]);
}

        };

        // ========================================
        // PADRÕES PARA DETECTAR E REMOVER

        const padroes = {
            // URLs Replit
            urlsReplit: [
                /https?:\/\/[^\/]*replit\.com[^\s\&quot;\'\)>]*/gi,
                /https?:\/\/[^\/]*repl\.co[^\s\&quot;\'\)>]*/gi,
                /https?:\/\/[^\/]*replitusercontent\.com[^\s\&quot;\'\)>]*/gi,
            ],

            // Imports Replit
            importsReplit: [
                /import\s+.*from\s+['&quot;]@replit\/[^'&quot;]+['&quot;]/gi,
                /require\s*\(\s*['&quot;]@replit\/[^'&quot;]+['&quot;]\s*\)/gi,
            ],

            // Endpoints API
            endpointsAPI: [
                /fetch\s*\(\s*['&quot;]\/api\/[^'&quot;]+['&quot;]/gi,
                /axios\.[a-z]+\s*\(\s*['&quot;]\/api\/[^'&quot;]+['&quot;]/gi,
            ],

            // Comentários com TODO/FIXME
            comentarios: [

            consoleLogs: [

        // ========================================
        // PROCESSAR ZIP

        async function processarZip(event) {

            estatisticas = {

                vinculosEncontrados: 0,
                vinculosRemovidos: 0,
                endpointsCorrigidos: 0
            };

            for (const [caminho, arquivo] of Object.entries(conteudo.files)) {
                if (arquivo.dir) continue;

                estatisticas.totalArquivos++;
                
                // Ignora node_modules, .git, etc
                if (caminho.includes('node_modules/') || 
                    caminho.includes('.git/') ||
                    caminho.startsWith('.')) {
                    continue;
                }

                const conteudoOriginal = await arquivo.async('text');
                const conteudoLimpo = limparArquivo(caminho, conteudoOriginal);
                
                arquivosLimpos[caminho] = conteudoLimpo;

            let conteudoLimpo = conteudo;
            let mudancas = 0;

            log(`🔍 Analisando: ${caminho}`, 'info');

            // 1. Remover URLs Replit
            padroes.urlsReplit.forEach(padrao => {
                const matches = conteudo.match(padrao);
                if (matches) {
                    matches.forEach(match => {
                        log(`   ❌ Removendo URL: ${match}`, 'warning');
                        conteudoLimpo = conteudoLimpo.replace(match, '');

                        estatisticas.vinculosEncontrados++;
                        estatisticas.vinculosRemovidos++;

                }
            });

            // 2. Remover Imports Replit
            padroes.importsReplit.forEach(padrao => {
                const matches = conteudo.match(padrao);
                if (matches) {
                    matches.forEach(match => {
                        log(`   ❌ Removendo import: ${match}`, 'warning');
                        conteudoLimpo = conteudoLimpo.replace(match, '// Import removido');
                        mudancas++;
                        estatisticas.vinculosEncontrados++;
                        estatisticas.vinculosRemovidos++;

            });

                const matches = conteudo.match(padrao);

                    matches.forEach(match => {
                        log(`   🔧 Corrigindo endpoint: ${match}`, 'warning');

                        estatisticas.endpointsCorrigidos++;

                conteudoLimpo = conteudoLimpo.replace(padrao, '');
            });

            // 5. Remover console.log com &quot;replit&quot;
            padroes.consoleLogs.forEach(padrao => {
                conteudoLimpo = conteudoLimpo.replace(padrao, '');
            });

            if (mudancas > 0) {
                log(`   ✅ ${mudancas} alterações feitas`, 'success');
            } else {
                log(`   ✓ Arquivo limpo`, 'success');
            }

            return conteudoLimpo;
        }

        // ========================================
        // BAIXAR ZIP LIMPO
        // ========================================
        async function baixarZipLimpo() {

3. Teste o projeto localmente
4. Publique no GitHub Pages ou Netlify

---
Limpo por: Limpador de Replit
Data: ${new Date().toLocaleString('pt-BR')}
`;

            zip.file('README-LIMPEZA.md', readme);
