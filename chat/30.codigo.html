  &lt;style&gt;
    :root {

      padding: 10px 16px;

      background: transparent;

    textarea:focus {

    .file-list {

    }

    .file-item:hover {

      color: var(--accent);
    }

    .file-item.selected {
      background: var(--accent);
      color: #000;
    }

    .status {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 16px;
      border: 1px solid;

      color: var(--blue);

    }

    .status-success {
      background: rgba(74, 222, 128, 0.1);
      color: var(--green);

    }

    .status-warning {
      background: rgba(251, 146, 60, 0.1);

    .status-error {

    .code-preview {

    .search-box {

&lt;body&gt;

&lt;div class=&quot;header&quot;&gt;
  &lt;h1&gt;🔬 Cirurgião 3.0 — Scanner Inteligente&lt;/h1&gt;
  &lt;p&gt;Importar → Analisar → Detectar → Editar → Salvar&lt;/p&gt;
&lt;/div&gt;

&lt;div class=&quot;container&quot;&gt;
  &lt;!-- TABS --&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;button class=&quot;tab-btn active&quot; onclick=&quot;switchTab('import')&quot;&gt;📂 1. Importar&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab('analyze')&quot;&gt;🔍 2. Analisar&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab('detect')&quot;&gt;🐛 3. Detectar&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab('edit')&quot;&gt;✏️ 4. Editar&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab('notes')&quot;&gt;📝 5. Notas&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;switchTab('manual')&quot;&gt;📖 Manual&lt;/button&gt;
  &lt;/div&gt;

  &lt;!-- SEÇÃO 1: IMPORTAR --&gt;
  &lt;div id=&quot;section-import&quot; class=&quot;section active&quot;&gt;
    &lt;h2&gt;📂 Importar Arquivos&lt;/h2&gt;

    &lt;div class=&quot;status status-info&quot;&gt;
      💡 Suporta: ZIP, TAR, TAZ, HTML, JS, CSS, JSON, TXT e mais
    &lt;/div&gt;

    &lt;div class=&quot;grid-2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h3&gt;Carregar Arquivo&lt;/h3&gt;
        &lt;input type=&quot;file&quot; id=&quot;fileInput&quot; class=&quot;input-file&quot; accept=&quot;.zip,.tar,.tar.gz,.taz,.html,.htm,.js,.css,.json,.txt,.jsx,.tsx,.ts&quot;&gt;
        &lt;div class=&quot;btn-group&quot;&gt;
          &lt;button class=&quot;btn btn-primary&quot; onclick=&quot;importarArquivo()&quot;&gt;📁 Carregar&lt;/button&gt;
          &lt;button class=&quot;btn btn-ghost&quot; onclick=&quot;limparImportacao()&quot;&gt;🗑️ Limpar&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;card&quot;&gt;
        &lt;h3&gt;Ou Cole Diretamente&lt;/h3&gt;
        &lt;textarea id=&quot;codigoColado&quot; placeholder=&quot;Cole HTML, JS, JSON, etc aqui...&quot;&gt;&lt;/textarea&gt;
        &lt;div class=&quot;btn-group&quot;&gt;
          &lt;button class=&quot;btn btn-success&quot; onclick=&quot;importarCodigo()&quot;&gt;✅ Importar&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div id=&quot;statusImportacao&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- SEÇÃO 2: ANALISAR --&gt;
  &lt;div id=&quot;section-analyze&quot; class=&quot;section&quot;&gt;
    &lt;h2&gt;🔍 Análise de Arquivos&lt;/h2&gt;

    &lt;div class=&quot;grid-3&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h3&gt;📂 Arquivos Encontrados&lt;/h3&gt;
        &lt;input type=&quot;text&quot; class=&quot;search-box&quot; id=&quot;filtroArquivo&quot; placeholder=&quot;Filtrar por nome...&quot; oninput=&quot;filtrarArquivos()&quot;&gt;
        &lt;div class=&quot;file-list&quot; id=&quot;listaArquivos&quot;&gt;
          &lt;div class=&quot;empty-state&quot;&gt;&lt;p&gt;Nenhum arquivo carregado&lt;/p&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;card&quot;&gt;
        &lt;h3&gt;📊 Conteúdo do Arquivo&lt;/h3&gt;
        &lt;div id=&quot;infoArquivo&quot; style=&quot;font-size: 11px; color: var(--text2); margin-bottom: 8px;&quot;&gt;Selecione um arquivo&lt;/div&gt;
        &lt;div class=&quot;code-preview&quot; id=&quot;conteudoArquivo&quot;&gt;Selecione um arquivo para ver seu conteúdo&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;card&quot;&gt;
        &lt;h3&gt;📈 Estatísticas&lt;/h3&gt;
        &lt;div class=&quot;code-preview&quot; id=&quot;estatisticas&quot;&gt;Nada analisado ainda&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- SEÇÃO 3: DETECTAR --&gt;
  &lt;div id=&quot;section-detect&quot; class=&quot;section&quot;&gt;
    &lt;h2&gt;🐛 Detecção Automática&lt;/h2&gt;

    &lt;div class=&quot;grid-2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h3&gt;🔎 Buscar Termos&lt;/h3&gt;
        &lt;input type=&quot;text&quot; class=&quot;search-box&quot; id=&quot;termosBusca&quot; value=&quot;replit,.replit,replit.nix,package.json,vite,react,bug,TODO,FIXME,error,console.log,undefined,null,import,export&quot;&gt;
        &lt;div class=&quot;btn-group&quot;&gt;
          &lt;button class=&quot;btn btn-primary&quot; onclick=&quot;buscarTermos()&quot;&gt;🔍 Buscar&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;card&quot;&gt;
        &lt;h3&gt;⚙️ Análise Automática&lt;/h3&gt;
        &lt;div class=&quot;btn-group&quot;&gt;
          &lt;button class=&quot;btn btn-success&quot; onclick=&quot;diagnosticar()&quot;&gt;🔧 Diagnosticar&lt;/button&gt;
          &lt;button class=&quot;btn btn-blue&quot; onclick=&quot;analisarComIA()&quot;&gt;🤖 IA Analyze&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;
      &lt;h3&gt;🚨 Erros &amp; Avisos Encontrados&lt;/h3&gt;
      &lt;div id=&quot;errosEncontrados&quot;&gt;
        &lt;div class=&quot;empty-state&quot;&gt;&lt;p&gt;Execute uma busca ou diagnóstico&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- SEÇÃO 4: EDITAR --&gt;
  &lt;div id=&quot;section-edit&quot; class=&quot;section&quot;&gt;
    &lt;h2&gt;✏️ Editar Arquivo&lt;/h2&gt;

    &lt;div class=&quot;card&quot;&gt;
      &lt;h3&gt;Arquivo Selecionado&lt;/h3&gt;
      &lt;div id=&quot;nomeArquivoEditar&quot; style=&quot;font-size: 11px; color: var(--text2); margin-bottom: 12px;&quot;&gt;Nenhum&lt;/div&gt;
      &lt;textarea id=&quot;conteudoEditar&quot; placeholder=&quot;Edite o conteúdo aqui...&quot;&gt;&lt;/textarea&gt;
      &lt;div class=&quot;btn-group&quot;&gt;
        &lt;button class=&quot;btn btn-primary&quot; onclick=&quot;salvarEdicao()&quot;&gt;💾 Salvar&lt;/button&gt;
        &lt;button class=&quot;btn btn-ghost&quot; onclick=&quot;reescreverComIA()&quot;&gt;🤖 IA Reescrever&lt;/button&gt;
        &lt;button class=&quot;btn btn-ghost&quot; onclick=&quot;corrigirSintaxe()&quot;&gt;✅ Corrigir Sintaxe&lt;/button&gt;
        &lt;button class=&quot;btn btn-danger&quot; onclick=&quot;descartarEdicao()&quot;&gt;❌ Descartar&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- SEÇÃO 5: NOTAS --&gt;
  &lt;div id=&quot;section-notes&quot; class=&quot;section&quot;&gt;
    &lt;h2&gt;📝 Notas &amp; Análises Salvas&lt;/h2&gt;

    &lt;div class=&quot;grid-2&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h3&gt;Adicionar Nota&lt;/h3&gt;
        &lt;input type=&quot;text&quot; class=&quot;search-box&quot; id=&quot;notaTitulo&quot; placeholder=&quot;Título da nota...&quot;&gt;
        &lt;textarea id=&quot;notaConteudo&quot; placeholder=&quot;Conteúdo da nota...&quot; style=&quot;min-height: 100px;&quot;&gt;&lt;/textarea&gt;
        &lt;div class=&quot;btn-group&quot;&gt;
          &lt;button class=&quot;btn btn-primary&quot; onclick=&quot;salvarNota()&quot;&gt;💾 Salvar Nota&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;card&quot;&gt;
        &lt;h3&gt;Notas Salvas&lt;/h3&gt;
        &lt;div id=&quot;listaNot as&quot;&gt;
          &lt;div class=&quot;empty-state&quot;&gt;&lt;p&gt;Nenhuma nota salva&lt;/p&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- SEÇÃO 6: MANUAL --&gt;
  &lt;div id=&quot;section-manual&quot; class=&quot;section&quot;&gt;
    &lt;h2&gt;📖 Manual de Uso&lt;/h2&gt;

    &lt;div class=&quot;grid-1&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h3&gt;🎯 O que é o Cirurgião 3.0?&lt;/h3&gt;
        &lt;p style=&quot;font-size: 12px; color: var(--text2); line-height: 1.8;&quot;&gt;
          Uma ferramenta inteligente para importar, analisar, detectar problemas e editar código.
          Suporta múltiplos formatos (ZIP, TAR, HTML, JS, etc) e identifica automaticamente:
          bugs, dependências do Replit, APIs, funções, erros de sintaxe e mais.
        &lt;/p&gt;
      &lt;/div&gt;

function importarArquivo() {

  if (nome.endsWith('.zip')) {
    importarZip(file);
  } else if (nome.endsWith('.tar') || nome.endsWith('.tar.gz') || nome.endsWith('.taz')) {
    importarTar(file);
  } else {
    importarArquivoSimples(file);
  }
}

async function importarZip(file) {
  try {
    const buffer = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(buffer);
    
    arquivos = [];
    conteudosTexto = {};
    
    zip.forEach((path, entry) =&gt; {
      if (!entry.dir) {
        arquivos.push({
          nome: path,
          tipo: 'arquivo',
          tamanho: entry._data.uncompressedSize,
          caminho: path
        });
      }
    });
    
    // Lê arquivos de texto
    for (const item of arquivos) {
      if (ehTexto(item.nome)) {
        try {
          conteudosTexto[item.nome] = await zip.file(item.nome).async('string');
        } catch (e) {
          conteudosTexto[item.nome] = '[ERRO AO LER]';
        }
      }
    }
    
    arquivos.sort((a, b) =&gt; a.nome.localeCompare(b.nome));
    renderizarArquivos();
    mostrarEstatisticas();
    showToast('✅ ZIP importado! ' + arquivos.length + ' arquivos');
    
  } catch (e) {
    showToast('❌ Erro ao ler ZIP: ' + e.message);
  }
}

async function importarTar(file) {
  try {
    const buffer = await file.arrayBuffer();
    const view = new Uint8Array(buffer);
    
    // Detecta se é comprimido
    const isGzip = view[0] === 0x1f &amp;&amp; view[1] === 0x8b;
    
    if (isGzip) {
      // Descompacta GZIP
      const decompressed = await decompressGzip(buffer);
      parsearTar(decompressed);
    } else {
      parsearTar(buffer);
    }
    
    showToast('✅ TAR importado! ' + arquivos.length + ' arquivos');
    
  } catch (e) {
    showToast('❌ Erro ao ler TAR: ' + e.message);
  }
}

function parsearTar(buffer) {
  const view = new Uint8Array(buffer);
  arquivos = [];
  conteudosTexto = {};
  
  let offset = 0;
  while (offset &lt; view.length) {
    const header = view.slice(offset, offset + 512);
    
    // Verifica se é fim do arquivo
    if (header.every(b =&gt; b === 0)) break;
    
    // Extrai nome (primeiros 100 bytes)
    const nomeBytes = header.slice(0, 100);
    const nome = new TextDecoder().decode(nomeBytes).split('\0')[0];
    
    // Extrai tamanho (bytes 124-135)
    const tamanhoOctal = new TextDecoder().decode(header.slice(124, 135)).trim();
    const tamanho = parseInt(tamanhoOctal, 8) || 0;
    
    if (nome) {
      arquivos.push({
        nome: nome,
        tipo: 'arquivo',
        tamanho: tamanho,
        caminho: nome
      });
      
      // Lê conteúdo se for texto
      if (ehTexto(nome) &amp;&amp; tamanho &gt; 0) {
        const conteudoBytes = view.slice(offset + 512, offset + 512 + tamanho);
        try {
          conteudosTexto[nome] = new TextDecoder().decode(conteudoBytes);
        } catch (e) {
          conteudosTexto[nome] = '[ERRO AO DECODIFICAR]';
        }
      }
    }
    
    // Próximo bloco (512 + tamanho arredondado para múltiplo de 512)
    const blocos = Math.ceil((512 + tamanho) / 512);
    offset += blocos * 512;
  }
  
  arquivos.sort((a, b) =&gt; a.nome.localeCompare(b.nome));
  renderizarArquivos();
  mostrarEstatisticas();
}

async function decompressGzip(buffer) {
  // Implementação simplificada - em produção use pako ou similar
  try {
    const ds = new DecompressionStream('gzip');
    const reader = ds.readable.getReader();
    const writer = ds.writable.getWriter();
    
    writer.write(new Uint8Array(buffer));
    writer.close();
    
    const chunks = [];
    let result;
    while (!(result = await reader.read()).done) {
      chunks.push(...result.value);
    }
    
    return new Uint8Array(chunks).buffer;
  } catch (e) {
    showToast('⚠️ Não consegui descomprimir GZIP. Tentando como TAR direto...');
    return buffer;
  }
}

function importarArquivoSimples(file) {

function buscarTermos() {
  const termos = document.getElementById('termosBusca').value
    .split(',')
    .map(t =&gt; t.trim().toLowerCase())
    .filter(Boolean);
  
  if (termos.length === 0) {
    showToast('❌ Digite termos para buscar!');
    return;
  }
  
  let resultados = [];
  
  Object.entries(conteudosTexto).forEach(([arquivo, conteudo]) =&gt; {
    const linhas = conteudo.split('\n');
    
    linhas.forEach((linha, idx) =&gt; {
      const linhaLower = linha.toLowerCase();
      
      termos.forEach(termo =&gt; {
        if (linhaLower.includes(termo)) {
          resultados.push({
            arquivo: arquivo,
            linha: idx + 1,
            termo: termo,
            conteudo: linha.slice(0, 100)
          });
        }
      });
    });
  });
  
  mostrarErros(resultados);
  showToast(`✅ Encontrados ${resultados.length} resultados!`);
}

function diagnosticar() {
  let diagnostico = [];
  
  // Verifica estrutura
  const temPackageJson = arquivos.some(a =&gt; a.nome === 'package.json');
  const temSrc = arquivos.some(a =&gt; a.nome.includes('src/'));
  const temDist = arquivos.some(a =&gt; a.nome.includes('dist/') || a.nome.includes('build/'));
  const temVite = conteudosTexto['package.json']?.includes('vite') || arquivos.some(a =&gt; a.nome === 'vite.config.js');
  const temReact = conteudosTexto['package.json']?.includes('react') || arquivos.some(a =&gt; a.nome.includes('.tsx') || a.nome.includes('.jsx'));
  const temReplit = arquivos.some(a =&gt; a.nome.includes('.replit') || a.nome.includes('replit.nix'));
  const temManifest = arquivos.some(a =&gt; a.nome === 'manifest.json');
  const temServiceWorker = arquivos.some(a =&gt; a.nome.includes('service-worker') || a.nome.includes('sw.js'));
  
  diagnostico.push({
    arquivo: 'package.json',
    linha: 0,
    termo: 'estrutura',
    conteudo: temPackageJson ? '✅ package.json encontrado' : '❌ Sem package.json'
  });
  
  if (temReplit) {
    diagnostico.push({
      arquivo: '.replit',
      linha: 0,
      termo: 'replit',
      conteudo: '⚠️ Marcas do Replit detectadas'
    });
  }
  
  if (temVite) {
    diagnostico.push({
      arquivo: 'package.json',
      linha: 0,
      termo: 'vite',
      conteudo: '✅ Vite detectado'
    });
  }
  
  if (temReact) {
    diagnostico.push({
      arquivo: 'package.json',
      linha: 0,
      termo: 'react',
      conteudo: '✅ React detectado'
    });
  }
  
  if (temManifest) {
    diagnostico.push({
      arquivo: 'manifest.json',
      linha: 0,
      termo: 'pwa',
      conteudo: '✅ PWA manifest encontrado'
    });
  }
  
  if (temServiceWorker) {
    diagnostico.push({
      arquivo: 'service-worker',
      linha: 0,
      termo: 'offline',
      conteudo: '✅ Service Worker detectado'
    });
  }
  
  mostrarErros(diagnostico);
  showToast('✅ Diagnóstico concluído!');
}

function analisarComIA() {
  // Simula análise com IA
  let analise = [];
  
  // Detecta padrões comuns
  Object.entries(conteudosTexto).forEach(([arquivo, conteudo]) =&gt; {
    const linhas = conteudo.split('\n');
    
    linhas.forEach((linha, idx) =&gt; {
      // Detecta console.log
      if (linha.includes('console.log')) {
        analise.push({
          arquivo: arquivo,
          linha: idx + 1,
          termo: 'console.log',
          conteudo: '⚠️ Debug: ' + linha.trim().slice(0, 80)
        });
      }
      
      // Detecta TODO/FIXME
      if (linha.includes('TODO') || linha.includes('FIXME')) {
        analise.push({
          arquivo: arquivo,
          linha: idx + 1,
          termo: 'TODO',
          conteudo: '📝 ' + linha.trim().slice(0, 80)
        });
      }
      
      // Detecta funções
      if (linha.includes('function ') || linha.includes('const ') &amp;&amp; linha.includes('=')) {
        if (linha.includes('function ')) {
          analise.push({
            arquivo: arquivo,
            linha: idx + 1,
            termo: 'function',
            conteudo: '🔧 Função: ' + linha.trim().slice(0, 80)
          });
        }
      }
      
      // Detecta imports/exports
      if (linha.includes('import ') || linha.includes('export ')) {
        analise.push({
          arquivo: arquivo,
          linha: idx + 1,
          termo: 'import',
          conteudo: '📦 ' + linha.trim().slice(0, 80)
        });
      }
      
      // Detecta fetch/API
      if (linha.includes('fetch(') || linha.includes('axios') || linha.includes('http')) {
        analise.push({
          arquivo: arquivo,
          linha: idx + 1,
          termo: 'api',
          conteudo: '🌐 API: ' + linha.trim().slice(0, 80)
        });
      }
    });
  });
  
  mostrarErros(analise);
  showToast(`✅ Análise IA: ${analise.length} itens encontrados!`);
}

function mostrarErros(resultados) {
  const container = document.getElementById('errosEncontrados');
  
  if (resultados.length === 0) {
    container.innerHTML = '&lt;div class=&quot;empty-state&quot;&gt;&lt;p&gt;Nenhum resultado encontrado&lt;/p&gt;&lt;/div&gt;';
    return;
  }
  
  container.innerHTML = resultados.map(r =&gt; `
    &lt;div class=&quot;error-item&quot;&gt;
      &lt;div class=&quot;file&quot;&gt;📁 ${r.arquivo}&lt;/div&gt;
      &lt;div class=&quot;line&quot;&gt;Linha ${r.linha}&lt;/div&gt;
      &lt;div class=&quot;msg&quot;&gt;🏷️ ${r.termo}&lt;/div&gt;
      &lt;div style=&quot;margin-top: 6px; color: var(--text2); font-size: 10px;&quot;&gt;
        ${r.conteudo}
      &lt;/div&gt;
    &lt;/div&gt;
  `).join('');
}

function reescreverComIA() {
  const conteudo = document.getElementById('conteudoEditar').value;
  
  if (!conteudo) {
    showToast('❌ Nenhum conteúdo para reescrever!');
    return;
  }
  
  // Simula reescrita com IA
  let reescrito = conteudo;
  
  // Remove console.log
  reescrito = reescrito.replace(/console\.log\([^)]*\);?/g, '');
  
  // Formata código
  reescrito = reescrito.replace(/\s+/g, ' ').trim();
  
  document.getElementById('conteudoEditar').value = reescrito;
  showToast('🤖 Código reescrito (versão simplificada)!');
}

function corrigirSintaxe() {
  const conteudo = document.getElementById('conteudoEditar').value;
  
  if (!conteudo) {
    showToast('❌ Nenhum conteúdo para corrigir!');
    return;
  }
  
  let corrigido = conteudo;
  
  // Corrige chaves desbalanceadas
  let abertas = (corrigido.match(/\{/g) || []).length;
  let fechadas = (corrigido.match(/\}/g) || []).length;
  if (abertas &gt; fechadas) {
    corrigido += '\n' + '}'.repeat(abertas - fechadas);
  }
  
  // Corrige parênteses
  abertas = (corrigido.match(/\(/g) || []).length;
  fechadas = (corrigido.match(/\)/g) || []).length;
  if (abertas &gt; fechadas) {
    corrigido += ')'.repeat(abertas - fechadas);
  }
  
  document.getElementById('conteudoEditar').value = corrigido;
  showToast('✅ Sintaxe corrigida!');
}

    &lt;/div&gt;

}

function deletarNota(id) {
  notasSalvas = notasSalvas.filter(n =&gt; n.id !== id);
  renderizarNotas();
  showToast('🗑️ Nota deletada!');
}

// ========== UTILITÁRIOS ==========
function ehTexto(nome) {
  const lower = nome.toLowerCase();
  if (lower.includes('package.json') || lower.includes('manifest')) return true;
  if (lower.endsWith('/')) return false;
  return extensoesTexto.some(ext =&gt; lower.endsWith(ext));
}

function formatarTamanho(bytes) {
  if (bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
}

&lt;script&gt;
  // ═══════════════════════════════════════════════════════════
  // ESTADO GLOBAL
  // ═══════════════════════════════════════════════════════════
  let arquivos = [];
  let conteudos = {};
  let arquivoAtual = null;
  let analiseAtual = null;

  // ═══════════════════════════════════════════════════════════
  // CARREGAR ARQUIVO
  // ═══════════════════════════════════════════════════════════
  async function carregarArquivo() {
    const input = document.getElementById('arquivoInput');
    if (!input.files[0]) return alert('Selecione um arquivo!');

    const file = input.files[0];
    const ext = file.name.split('.').pop().toLowerCase();

    if (ext === 'zip' || ext === 'apk') {
      await carregarZIP(file);
    } else if (ext === 'tar' || ext === 'tgz' || ext === 'gz') {
      await carregarTAR(file);
    } else {
      const texto = await file.text();
      arquivos = [{ nome: file.name, tamanho: file.size, legivel: true }];
      conteudos[file.name] = texto;
      renderArquivos();
    }
  }

  async function carregarZIP(file) {
    try {
      const zip = await JSZip.loadAsync(file);
      arquivos = [];
      const promessas = [];

      zip.forEach((path, entry) =&gt; {
        if (!entry.dir) {
          const ext = path.split('.').pop().toLowerCase();
          const legivel = ['js','ts','tsx','jsx','html','css','json','txt','md','xml','yaml','yml','env','py','java','php','cs','kt'].includes(ext);
          arquivos.push({ nome: path, tamanho: entry._data.uncompressedSize, legivel, ext });
          
          if (legivel &amp;&amp; entry._data.uncompressedSize &lt; 1000000) {
            promessas.push(
              entry.async('string').then(texto =&gt; {
                conteudos[path] = texto;
              }).catch(() =&gt; {
                conteudos[path] = '[ERRO AO LER]';
              })
            );
          }
        }
      });

      await Promise.all(promessas);
      arquivos.sort((a, b) =&gt; a.nome.localeCompare(b.nome));
      renderArquivos();
    } catch(e) {
      alert('Erro ao abrir ZIP: ' + e.message);
    }
  }

  async function carregarTAR(file) {
    try {
      let dados = new Uint8Array(await file.arrayBuffer());
      
      if (file.name.endsWith('.gz') || file.name.endsWith('.tgz')) {
        dados = pako.inflate(dados);
      }

      arquivos = [];
      let offset = 0;

      while (offset &lt; dados.length) {
        const header = dados.slice(offset, offset + 512);
        if (header.every(b =&gt; b === 0)) break;

        const nome = new TextDecoder().decode(header.slice(0, 100)).split('\0')[0];
        const tamanhoStr = new TextDecoder().decode(header.slice(124, 136)).trim();
        const tamanho = parseInt(tamanhoStr, 8);
        const tipo = String.fromCharCode(header[156]);

        offset += 512;

        if (nome &amp;&amp; tipo !== '5') {
          const ext = nome.split('.').pop().toLowerCase();
          const legivel = ['js','ts','tsx','jsx','html','css','json','txt','md','xml','yaml','yml','env','py','java','php','cs','kt'].includes(ext);
          arquivos.push({ nome, tamanho, legivel, ext });

          if (legivel &amp;&amp; tamanho &lt; 1000000) {
            const conteudo = new TextDecoder().decode(dados.slice(offset, offset + tamanho));
            conteudos[nome] = conteudo;
          }
        }

        offset += Math.ceil(tamanho / 512) * 512;
      }

      arquivos.sort((a, b) =&gt; a.nome.localeCompare(b.nome));
      renderArquivos();
    } catch(e) {
      alert('Erro ao abrir TAR: ' + e.message);
    }
  }

  // ═══════════════════════════════════════════════════════════
  // ANALISAR ARQUIVO
  // ═══════════════════════════════════════════════════════════
  function analisarArquivo() {
    if (!arquivoAtual) return;

    const conteudo = document.getElementById('editor').value;
    const linhas = conteudo.split('\n');

    analiseAtual = {
      arquivo: arquivoAtual,
      linhas: linhas.length,
      tamanho: conteudo.length,
      bugs: [],
      replit: [],
      apis: []
    };

    // Detectar bugs
    const padroesBug = [
      { regex: /console\.log\s*\([^)]*$/, tipo: 'console.log incompleto', peso: 'médio' },
      { regex: /=\s*undefined\b/, tipo: 'Atribuição para undefined', peso: 'alto' },
      { regex: /[^=!&lt;&gt;]==[^=]/, tipo: 'Comparação fraca (==)', peso: 'médio' },
      { regex: /catch\s*\(\s*\)\s*\{/, tipo: 'catch vazio', peso: 'alto' },
      { regex: /var\s+\w+/, tipo: 'Uso de var (obsoleto)', peso: 'baixo' },
      { regex: /eval\s*\(/, tipo: 'EVAL detectado (perigoso)', peso: 'crítico' },
      { regex: /innerHTML\s*\+=/, tipo: 'innerHTML += (inseguro)', peso: 'alto' },
      { regex: /document\.write\s*\(/, tipo: 'document.write (obsoleto)', peso: 'médio' },
    ];

    linhas.forEach((linha, i) =&gt; {
      padroesBug.forEach(p =&gt; {
        if (p.regex.test(linha)) {
          const inicio = Math.max(0, i - 2);
          const fim = Math.min(linhas.length, i + 3);
          const contexto = linhas.slice(inicio, fim).join('\n');
          analiseAtual.bugs.push({
            linha: i + 1,
            tipo: p.tipo,
            peso: p.peso,
            conteudo: linha.trim().substring(0, 80),
            contexto
          });
        }
      });
    });

    // Detectar Replit
    const padroeReplit = [
      /replit\.com/gi,
      /replit\.dev/gi,
      /REPL_ID/g,
      /REPLIT_DB/g,
      /\/api\/code-assistant/g,
      /\/api\/tts/g,
      /@replit\//g
    ];

    linhas.forEach((linha, i) =&gt; {
      padroeReplit.forEach(p =&gt; {
        if (p.test(linha)) {
          const inicio = Math.max(0, i - 1);
          const fim = Math.min(linhas.length, i + 2);
          const contexto = linhas.slice(inicio, fim).join('\n');
          analiseAtual.replit.push({
            linha: i + 1,
            conteudo: linha.trim().substring(0, 80),
            contexto
          });
          p.lastIndex = 0;
        }
      });
    });

    // Detectar APIs
    const padroeAPI = [
      /fetch\s*\(/gi,
      /apiKey/gi,
      /api_key/gi,
      /Authorization/gi,
      /gemini/gi,
      /openai/gi,
      /gpt-/gi,
      /claude/gi
    ];

    linhas.forEach((linha, i) =&gt; {
      padroeAPI.forEach(p =&gt; {
        if (p.test(linha)) {
          const inicio = Math.max(0, i - 1);
          const fim = Math.min(linhas.length, i + 2);
          const contexto = linhas.slice(inicio, fim).join('\n');
          analiseAtual.apis.push({
            linha: i + 1,
            conteudo: linha.trim().substring(0, 80),
            contexto
          });
          p.lastIndex = 0;
        }
      });
    });

    // Atualizar stats
    document.getElementById('statBugs').textContent = analiseAtual.bugs.length;
    document.getElementById('statReplit').textContent = analiseAtual.replit.length;
    document.getElementById('statAPIs').textContent = analiseAtual.apis.length;

    // Mostrar resultado
    let html = '';

    if (analiseAtual.bugs.length &gt; 0) {
      html += '&lt;h3 style=&quot;color: #fcd34d; margin: 8px 0 4px;&quot;&gt;🐛 Bugs Encontrados&lt;/h3&gt;';
      analiseAtual.bugs.slice(0, 20).forEach(b =&gt; {
        const corPeso = {
          'crítico': 'peso-critico',
          'alto': 'peso-alto',
          'médio': 'peso-medio',
          'baixo': 'peso-baixo'
        }[b.peso] || 'peso-medio';
        html += `
          &lt;div class=&quot;bug-item&quot; onclick=&quot;irParaLinha(${b.linha})&quot;&gt;
            &lt;div class=&quot;bug-tipo&quot;&gt;${b.tipo}&lt;/div&gt;
            &lt;div class=&quot;bug-linha&quot;&gt;Linha ${b.linha}&lt;/div&gt;
            &lt;div class=&quot;bug-desc&quot;&gt;${b.conteudo}&lt;/div&gt;
            &lt;span class=&quot;bug-peso ${corPeso}&quot;&gt;${b.peso.toUpperCase()}&lt;/span&gt;
          &lt;/div&gt;
        `;
      });
    }

    if (analiseAtual.replit.length &gt; 0) {
      html += '&lt;h3 style=&quot;color: #ef4444; margin: 12px 0 4px;&quot;&gt;🚨 Replit Detectado&lt;/h3&gt;';

        html += `

            &lt;div style=&quot;color: #fca5a5; font-weight: bold;&quot;&gt;Linha ${r.linha}&lt;/div&gt;

    if (analiseAtual.apis.length &gt; 0) {
      html += '&lt;h3 style=&quot;color: #0891b2; margin: 12px 0 4px;&quot;&gt;🌐 APIs Detectadas&lt;/h3&gt;';

      html = '&lt;div class=&quot;sucesso&quot;&gt;✅ Nenhum problema óbvio detectado!&lt;/div&gt;';
    }

    document.getElementById('analiseResultado').innerHTML = html;
  }

  async function consultarIA() {
    const chave = document.getElementById('iaChave').value.trim();
    const pergunta = document.getElementById('iaPergunta').value.trim();
    const provider = document.getElementById('iaProvider').value;

    if (!chave || !pergunta) return alert('Preencha chave e pergunta!');

    const p = PROVEDORES[provider];
    const respEl = document.getElementById('iaResposta');
    respEl.style.display = 'block';
    respEl.textContent = '⏳ Consultando IA...';

    try {
      const contexto = analiseAtual ? `\n\nCÓDIGO ANALISADO:\n${document.getElementById('editor').value.substring(0, 5000)}` : '';
      const mensagem = pergunta + contexto;

      let response;

      if (provider === 'groq' || provider === 'openai') {
        response = await fetch(p.url, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${chave}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: p.model,
            messages: [{ role: 'user', content: mensagem }],
            max_tokens: 2000
          })
        });
        const data = await response.json();
        respEl.textContent = data.choices[0].message.content;
      } else if (provider === 'anthropic') {
        response = await fetch(p.url, {
          method: 'POST',
          headers: {
            'x-api-key': chave,
            'anthropic-version': '2023-06-01',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: p.model,
            max_tokens: 2000,
            messages: [{ role: 'user', content: mensagem }]
          })
        });
        const data = await response.json();
        respEl.textContent = data.content[0].text;
      } else if (provider === 'google') {
        response = await fetch(`${p.url}?key=${chave}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: mensagem }] }]
          })
        });
        const data = await response.json();
        respEl.textContent = data.candidates[0].content.parts[0].text;
      }
    } catch(e) {
      respEl.textContent = `❌ Erro: ${e.message}`;
    }
  }

&lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/pako/2.0.4/pako.min.js&quot;&gt;&lt;/script&gt;

&lt;script&gt;
  // ═══════════════════════════════════════════════════════════
  // ESTADO GLOBAL
  // ═══════════════════════════════════════════════════════════
  let arquivos = [];
  let conteudosTexto = {};
  let arquivoAtual = null;
  let bugsDoArquivo = [];
  let bugAtual = null;
  let notasSalvas = [];
  let iaProvider = 'openai';
  let iaChave = '';
  let iaConectado = false;

  const extensoesTexto = [
    '.txt', '.md', '.json', '.js', '.jsx', '.ts', '.tsx', '.html', '.css',
    '.scss', '.xml', '.yml', '.yaml', '.toml', '.env', '.sql', '.gitignore',
    '.nix', '.config', '.cjs', '.mjs', '.py', '.java', '.cpp', '.c', '.go',
    '.rb', '.php', '.sh', '.bash', '.dockerfile', '.properties', '.gradle'
  ];

  // ═══════════════════════════════════════════════════════════
  // IA
  // ═══════════════════════════════════════════════════════════
  function atualizarProvedor() {
    iaProvider = document.getElementById('iaProvider').value;
    document.getElementById('statusIA').textContent = `Provedor: ${iaProvider}`;
    document.getElementById('statusIA').style.color = '#fde68a';
  }

  async function testarIA() {
    iaChave = document.getElementById('iaChave').value.trim();
    if (!iaChave) { alert('Cole uma chave!'); return; }

    const status = document.getElementById('statusIA');
    status.innerHTML = '&lt;span class=&quot;spinner&quot;&gt;&lt;/span&gt; Testando...';

    try {
      const resposta = await chamarIA('Responda com: OK');
      if (resposta.length &gt; 0) {
        status.innerHTML = '&lt;span style=&quot;color: #86efac;&quot;&gt;✅ IA Conectada!&lt;/span&gt;';
        iaConectado = true;
        document.getElementById('btnAnalisar').disabled = false;
      }
    } catch (e) {
      status.innerHTML = `&lt;span style=&quot;color: #fca5a5;&quot;&gt;❌ Erro: ${e.message}&lt;/span&gt;`;
      iaConectado = false;
    }
  }

  async function chamarIA(mensagem) {
    if (!iaChave) throw new Error('Configure sua chave!');

    let url, headers, body;

    if (iaProvider === 'openai') {
      url = 'https://api.openai.com/v1/chat/completions';
      headers = { 'Authorization': `Bearer ${iaChave}`, 'Content-Type': 'application/json' };
      body = { model: 'gpt-3.5-turbo', messages: [{ role: 'user', content: mensagem }], max_tokens: 1000 };
    } else if (iaProvider === 'anthropic') {
      url = 'https://api.anthropic.com/v1/messages';
      headers = { 'x-api-key': iaChave, 'anthropic-version': '2023-06-01', 'Content-Type': 'application/json' };
      body = { model: 'claude-3-sonnet-20240229', max_tokens: 1000, messages: [{ role: 'user', content: mensagem }] };
    } else if (iaProvider === 'groq') {
      url = 'https://api.groq.com/openai/v1/chat/completions';
      headers = { 'Authorization': `Bearer ${iaChave}`, 'Content-Type': 'application/json' };
      body = { model: 'mixtral-8x7b-32768', messages: [{ role: 'user', content: mensagem }], max_tokens: 1000 };
    } else if (iaProvider === 'google') {
      url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${iaChave}`;
      headers = { 'Content-Type': 'application/json' };
      body = { contents: [{ parts: [{ text: mensagem }] }] };
    }

    const response = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
    if (!response.ok) throw new Error(`Erro ${response.status}`);

    const data = await response.json();
    if (iaProvider === 'openai' || iaProvider === 'groq') return data.choices[0].message.content;
    if (iaProvider === 'anthropic') return data.content[0].text;
    if (iaProvider === 'google') return data.candidates[0].content.parts[0].text;
  }

  // ═══════════════════════════════════════════════════════════
  // CARREGAR ARQUIVO
  // ═══════════════════════════════════════════════════════════
  async function carregarArquivo() {
    const input = document.getElementById('arquivoInput');
    if (!input.files || !input.files[0]) { alert('Selecione um arquivo!'); return; }

    const file = input.files[0];
    const buffer = await file.arrayBuffer();
    const formato = document.getElementById('formatoArquivo').value;

    arquivos = [];
    conteudosTexto = {};

    try {
      if (formato === 'auto' || formato === 'zip') {
        if (file.name.endsWith('.zip')) { await processarZIP(buffer); return; }
      }
      if (formato === 'auto' || formato === 'tar' || formato === 'taz') {
        if (file.name.endsWith('.tar') || file.name.endsWith('.tar.gz') || file.name.endsWith('.tgz')) { await processarTAR(buffer); return; }
      }
      if (formato === 'auto' || formato === 'html') {
        if (file.name.endsWith('.html')) { processarHTML(buffer); return; }
      }
      alert('Formato não suportado.');
    } catch (e) {
      alert('Erro: ' + e.message);
    }
  }

  async function processarZIP(buffer) {
    const zip = await JSZip.loadAsync(buffer);
    zip.forEach((path, entry) =&gt; {
      arquivos.push({ nome: path, dir: entry.dir, tamanho: entry._data.uncompressedSize });
    });

    for (const item of arquivos) {
      if (!item.dir &amp;&amp; ehTexto(item.nome)) {
        try {
          conteudosTexto[item.nome] = await zip.file(item.nome).async('string');
        } catch (e) {
          conteudosTexto[item.nome] = '[ERRO AO LER]';
        }
      }
    }

    arquivos.sort((a, b) =&gt; a.nome.localeCompare(b.nome));
    renderArquivos();
  }

  async function processarTAR(buffer) {
    let dados = new Uint8Array(buffer);
    if (document.getElementById('arquivoInput').files[0].name.endsWith('.gz') || document.getElementById('arquivoInput').files[0].name.endsWith('.tgz')) {
      dados = pako.inflate(dados);
    }

    let offset = 0;
    while (offset &lt; dados.length) {
      const headerBytes = dados.slice(offset, offset + 512);
      if (headerBytes.every(b =&gt; b === 0)) break;

      const nome = new TextDecoder().decode(headerBytes.slice(0, 100)).split('\0')[0];
      const tamanhoStr = new TextDecoder().decode(headerBytes.slice(124, 136)).trim();
      const tamanho = parseInt(tamanhoStr, 8);
      const tipo = String.fromCharCode(headerBytes[156]);

      offset += 512;

      if (nome &amp;&amp; tipo !== '5') {
        arquivos.push({ nome, dir: false, tamanho });
        if (ehTexto(nome)) {
          const conteudo = new TextDecoder().decode(dados.slice(offset, offset + tamanho));
          conteudosTexto[nome] = conteudo;
        }
      }

      offset += Math.ceil(tamanho / 512) * 512;
    }

    arquivos.sort((a, b) =&gt; a.nome.localeCompare(b.nome));
    renderArquivos();
  }

  function processarHTML(buffer) {
    const html = new TextDecoder().decode(buffer);
    const nome = document.getElementById('arquivoInput').files[0].name;
    arquivos.push({ nome, dir: false, tamanho: buffer.byteLength });
    conteudosTexto[nome] = html;
    renderArquivos();
  }

  function ehTexto(nome) {
    const lower = nome.toLowerCase();
    if (lower.endsWith('/')) return false;
    return extensoesTexto.some(ext =&gt; lower.endsWith(ext));
  }

  // ═══════════════════════════════════════════════════════════
  // RENDERIZAR ARQUIVOS
  // ═══════════════════════════════════════════════════════════
  function renderArquivos() {
    const filtro = document.getElementById('filtroArquivo').value.toLowerCase();
    const el = document.getElementById('listaArquivos');

    if (!arquivos.length) {
      el.innerHTML = 'Nenhum arquivo carregado.';
      return;
    }

    const filtrados = arquivos.filter(a =&gt; a.nome.toLowerCase().includes(filtro));
    document.getElementById('contadorArquivos').textContent = `${filtrados.length} de ${arquivos.length}`;

    el.innerHTML = filtrados.map(a =&gt; {
      const tipo = a.dir ? '📁' : ehTexto(a.nome) ? '📄' : '📦';
      const tamanhoKB = a.tamanho ? (a.tamanho / 1024).toFixed(1) : '?';
      return `&lt;div class=&quot;file-item ${arquivoAtual === a.nome ? 'selecionado' : ''}&quot; onclick=&quot;abrirArquivo('${a.nome.replace(/'/g, &quot;\\'&quot;)}')&quot;&gt;
        ${tipo} ${a.nome.split('/').pop()} &lt;span class=&quot;small&quot;&gt;(${tamanhoKB}KB)&lt;/span&gt;
      &lt;/div&gt;`;
    }).join('');
  }

  function abrirArquivo(nome) {
    arquivoAtual = nome;
    const conteudo = conteudosTexto[nome];

    if (!conteudo) {
      document.getElementById('conteudoArquivoCompleto').value = '[Arquivo binário]';
      return;
    }

    document.getElementById('conteudoArquivoCompleto').value = conteudo;
    document.getElementById('nomeArquivoCompleto').textContent = nome;
    renderArquivos();
    detectarBugsNoArquivo(nome, conteudo);
  }

  // ═══════════════════════════════════════════════════════════
  // DETECTAR BUGS
  // ═══════════════════════════════════════════════════════════
  function detectarBugsNoArquivo(nome, conteudo) {
    bugsDoArquivo = [];
    const linhas = conteudo.split('\n');

    const padroes = [
      { regex: /replit/gi, tipo: 'replit', peso: 'crítico', nome: 'Referência Replit' },
      { regex: /REPLIT_DB/g, tipo: 'replit', peso: 'crítico', nome: 'REPLIT_DB' },
      { regex: /console\.log\s*\([^)]*$/, tipo: 'bug', peso: 'médio', nome: 'console.log incompleto' },
      { regex: /var\s+\w+/, tipo: 'bug', peso: 'baixo', nome: 'Uso de var' },
      { regex: /==\s*(?![=])/, tipo: 'bug', peso: 'médio', nome: 'Comparação ==' },
      { regex: /catch\s*\(\s*\)/, tipo: 'bug', peso: 'alto', nome: 'Catch vazio' },
      { regex: /eval\s*\(/, tipo: 'bug', peso: 'crítico', nome: 'EVAL detectado' },
      { regex: /innerHTML\s*\+=/, tipo: 'bug', peso: 'alto', nome: 'innerHTML +=' },
      { regex: /fetch\s*\(/, tipo: 'api', peso: 'médio', nome: 'Chamada fetch' },
      { regex: /axios\.(get|post)/, tipo: 'api', peso: 'médio', nome: 'Chamada axios' }
    ];

    linhas.forEach((linha, idx) =&gt; {
      padroes.forEach(p =&gt; {
        if (p.regex.test(linha)) {
          const inicio = Math.max(0, idx - 2);
          const fim = Math.min(linhas.length, idx + 3);
          const contexto = linhas.slice(inicio, fim).join('\n');

          bugsDoArquivo.push({
            linha: idx + 1,
            tipo: p.tipo,
            peso: p.peso,
            nome: p.nome,
            conteudo: linha.trim().substring(0, 80),
            contexto,
            arquivo: nome
          });

          p.regex.lastIndex = 0;
        }
      });
    });

    renderBugs();
  }

  function renderBugs() {
    const el = document.getElementById('listaBugs');
    document.getElementById('contadorBugs').textContent = `${bugsDoArquivo.length} bugs`;

    if (!bugsDoArquivo.length) {
      el.innerHTML = '&lt;div style=&quot;padding: 12px; text-align: center; color: #64748b;&quot;&gt;✅ Nenhum bug detectado!&lt;/div&gt;';
      return;
    }

    el.innerHTML = bugsDoArquivo.map((b, i) =&gt; {
      const corPeso = {
        'crítico': 'peso-critico',
        'alto': 'peso-alto',
        'médio': 'peso-medio',
        'baixo': 'peso-baixo'
      }[b.peso] || 'peso-medio';

      return `&lt;div class=&quot;bug-item ${bugAtual === i ? 'selecionado' : ''}&quot; onclick=&quot;selecionarBug(${i})&quot;&gt;
        &lt;div class=&quot;bug-tipo&quot;&gt;${b.nome}&lt;/div&gt;
        &lt;div class=&quot;bug-linha&quot;&gt;Linha ${b.linha}&lt;/div&gt;
        &lt;div class=&quot;bug-desc&quot;&gt;${b.conteudo}&lt;/div&gt;
        &lt;span class=&quot;bug-peso ${corPeso}&quot;&gt;${b.peso.toUpperCase()}&lt;/span&gt;
      &lt;/div&gt;`;
    }).join('');
  }

  function selecionarBug(idx) {
    bugAtual = idx;
    const bug = bugsDoArquivo[idx];

    document.getElementById('infoBugAtual').textContent = `${bug.arquivo} — Linha ${bug.linha} — ${bug.nome}`;
    document.getElementById('contextoBug').value = bug.contexto;
    renderBugs();
  }

  // ═══════════════════════════════════════════════════════════
  // IA - ANÁLISE
  // ═══════════════════════════════════════════════════════════
  async function analisarBugIA() {
    if (bugAtual === null) { alert('Selecione um bug!'); return; }
    if (!iaConectado) { alert('Conecte a IA primeiro!'); return; }

    const bug = bugsDoArquivo[bugAtual];
    const respEl = document.getElementById('respostaIA');
    respEl.innerHTML = '&lt;div class=&quot;spinner&quot;&gt;&lt;/div&gt; Analisando...';

    try {
      const prompt = `Analise este BUG de código:

ARQUIVO: ${bug.arquivo}
LINHA: ${bug.linha}
TIPO: ${bug.nome}
PESO ESTIMADO: ${bug.peso}

CÓDIGO:
${bug.contexto}

Responda EXATAMENTE neste formato:
1. O QUE É: [explicação breve]
2. POR QUE É PROBLEMA: [impacto]
3. COMO CORRIGIR: [solução com exemplo]
4. PESO REAL: [crítico/alto/médio/baixo]
5. PRIORIDADE: [1-10]`;

      const resposta = await chamarIA(prompt);
      respEl.innerHTML = `&lt;pre&gt;${resposta}&lt;/pre&gt;`;
    } catch (e) {
      respEl.innerHTML = `&lt;div style=&quot;color: #fca5a5;&quot;&gt;❌ Erro: ${e.message}&lt;/div&gt;`;
    }
  }

  async function perguntarIA() {
    if (bugAtual === null) { alert('Selecione um bug!'); return; }
    if (!iaConectado) { alert('Conecte a IA primeiro!'); return; }

    const pergunta = document.getElementById('perguntaCustom').value.trim();
    if (!pergunta) { alert('Digite uma pergunta!'); return; }

    const bug = bugsDoArquivo[bugAtual];
    const respEl = document.getElementById('respostaCustom');
    respEl.innerHTML = '&lt;div class=&quot;spinner&quot;&gt;&lt;/div&gt; Processando...';

    try {
      const prompt = `CONTEXTO:
Arquivo: ${bug.arquivo}
Linha: ${bug.linha}
Bug: ${bug.nome}

CÓDIGO:
${bug.contexto}

PERGUNTA:
${pergunta}`;

      const resposta = await chamarIA(prompt);
      respEl.innerHTML = `&lt;pre&gt;${resposta}&lt;/pre&gt;`;
    } catch (e) {
      respEl.innerHTML = `&lt;div style=&quot;color: #fca5a5;&quot;&gt;❌ Erro: ${e.message}&lt;/div&gt;`;
    }
  }

  // ═══════════════════════════════════════════════════════════
  // SALVAR NOTA
  // ═══════════════════════════════════════════════════════════
  function salvarNota() {
    if (bugAtual === null) { alert('Selecione um bug!'); return; }

    const nomaNota = document.getElementById('nomaNota').value.trim() || `Bug-${Date.now()}`;
    const bug = bugsDoArquivo[bugAtual];
    const respostaIA = document.getElementById('respostaIA').innerHTML;
    const respostaCustom = document.getElementById('respostaCustom').innerHTML;

    const nota = {
      id: Date.now(),
      nome: nomaNota,
      data: new Date().toLocaleString('pt-BR'),
      arquivo: bug.arquivo,
      linha: bug.linha,
      tipo: bug.nome,
      peso: bug.peso,
      contexto: bug.contexto,
      analiseIA: respostaIA,
      perguntaCustom: respostaCustom
    };

    notasSalvas.push(nota);
    document.getElementById('nomaNota').value = '';
    renderNotasSalvas();
    alert('✅ Nota salva!');
  }

  function renderNotasSalvas() {
    const el = document.getElementById('notasSalvas');
    if (!notasSalvas.length) {
      el.innerHTML = '&lt;div class=&quot;small&quot; style=&quot;color: #64748b;&quot;&gt;Nenhuma nota salva.&lt;/div&gt;';
      document.getElementById('btnBaixarNotas').style.display = 'none';
      return;
    }

    document.getElementById('btnBaixarNotas').style.display = 'block';

    el.innerHTML = notasSalvas.map(n =&gt; `
      &lt;div class=&quot;nota-item&quot;&gt;
        &lt;div class=&quot;nota-header&quot;&gt;
          &lt;span class=&quot;nota-titulo&quot;&gt;📝 ${n.nome}&lt;/span&gt;
          &lt;div class=&quot;nota-botoes&quot;&gt;
            &lt;button onclick=&quot;deletarNota(${n.id})&quot; class=&quot;danger&quot;&gt;🗑️&lt;/button&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div style=&quot;color: #cbd5e1;&quot;&gt;
          &lt;strong&gt;${n.arquivo}&lt;/strong&gt; — Linha ${n.linha} — ${n.tipo}
          &lt;br&gt;&lt;span style=&quot;color: #64748b;&quot;&gt;Salvo em ${n.data}&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    `).join('');
  }

  function deletarNota(id) {
    notasSalvas = notasSalvas.filter(n =&gt; n.id !== id);
    renderNotasSalvas();
  }

  function baixarTodasNotas() {
    if (!notasSalvas.length) { alert('Nenhuma nota para baixar!'); return; }

    const relatorio = notasSalvas.map(n =&gt; `
═══════════════════════════════════════════════════════════
NOTA: ${n.nome}
Data: ${n.data}
═══════════════════════════════════════════════════════════

ARQUIVO: ${n.arquivo}
LINHA: ${n.linha}
TIPO: ${n.tipo}
PESO: ${n.peso}

CONTEXTO:
${n.contexto}

ANÁLISE IA:
${n.analiseIA ? n.analiseIA.replace(/&lt;[^&gt;]*&gt;/g, '') : 'Sem análise'}

PERGUNTA CUSTOMIZADA:
${n.perguntaCustom ? n.perguntaCustom.replace(/&lt;[^&gt;]*&gt;/g, '') : 'Sem pergunta'}

`).join('\n');

    const blob = new Blob([relatorio], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `notas-${Date.now()}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ═══════════════════════════════════════════════════════════
  // UTILITÁRIOS
  // ═══════════════════════════════════════════════════════════
  function copiarContexto() {
    const texto = document.getElementById('contextoBug').value;
    navigator.clipboard.writeText(texto).then(() =&gt; alert('✅ Copiado!'));
  }

  function copiarArquivo() {
    const texto = document.getElementById('conteudoArquivoCompleto').value;
    navigator.clipboard.writeText(texto).then(() =&gt; alert('✅ Copiado!'));
  }

  function baixarArquivo() {
    const texto = document.getElementById('conteudoArquivoCompleto').value;
    const nome = arquivoAtual || 'arquivo.txt';
    const blob = new Blob([texto], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nome;
    a.click();
    URL.revokeObjectURL(url);
  }

  function mudarAba(nomeAba) {
    document.querySelectorAll('.tab-content').forEach(el =&gt; el.classList.remove('ativo'));
    document.querySelectorAll('.tab-btn').forEach(el =&gt; el.classList.remove('ativo'));
    document.getElementById(nomeAba).classList.add('ativo');
    event.target.classList.add('ativo');
  }

  function fecharModal(id) {
    document.getElementById(id).classList.remove('ativo');
  }

  function limparTudo() {
    if (confirm('Limpar tudo?')) {
      arquivos = [];
      conteudosTexto = {};
      arquivoAtual = null;
      bugsDoArquivo = [];
      bugAtual = null;
      notasSalvas = [];
      document.getElementById('listaArquivos').innerHTML = 'Nenhum arquivo carregado.';
      document.getElementById('listaBugs').innerHTML = 'Selecione um arquivo.';
      document.getElementById('conteudoArquivoCompleto').value = '';
      document.getElementById('contextoBug').value = '';
      document.getElementById('notasSalvas').innerHTML = '';
      alert('✅ Tudo limpo!');
    }
  }
&lt;/script&gt;

&lt;/body&gt;
&lt;/html&gt;
"></iframe>
</div>


<script>
function trocarProjeto(index) {
  // Esconde todos
  document.querySelectorAll('.project-container').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  
  // Mostra o selecionado
  document.getElementById('projeto' + index).classList.add('active');
  document.querySelectorAll('.nav-btn')[index].classList.add('active');
  
  // Salva preferência
  localStorage.setItem('ultimo-projeto', index);
}

// Restaura último projeto aberto
window.onload = function() {
  const ultimo = localStorage.getItem('ultimo-projeto');
  if (ultimo !== null) trocarProjeto(parseInt(ultimo));
};
</script>
