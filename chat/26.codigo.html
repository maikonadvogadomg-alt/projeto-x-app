&lt;body&gt;

&lt;header&gt;
  &lt;h1&gt;🔎 Scanner Multi-Formato + IA Universal&lt;/h1&gt;
  &lt;div class=&quot;small&quot;&gt;Importa ZIP, TAR, TAZ, HTML | Qualquer IA sem limites | Salva notas | Análise completa&lt;/div&gt;
&lt;/header&gt;

&lt;main&gt;

  &lt;!-- SEÇÃO 1: IMPORTAÇÃO --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;📥 1. Importar Arquivo&lt;/h2&gt;
    &lt;div class=&quot;control-group&quot;&gt;
      &lt;label&gt;Formato:&lt;/label&gt;
      &lt;select id=&quot;formatoArquivo&quot;&gt;
        &lt;option value=&quot;auto&quot;&gt;Auto-detectar&lt;/option&gt;
        &lt;option value=&quot;zip&quot;&gt;ZIP&lt;/option&gt;
        &lt;option value=&quot;tar&quot;&gt;TAR&lt;/option&gt;
        &lt;option value=&quot;taz&quot;&gt;TAZ (TAR.GZ)&lt;/option&gt;
        &lt;option value=&quot;html&quot;&gt;HTML&lt;/option&gt;
      &lt;/select&gt;
    &lt;/div&gt;
    &lt;input type=&quot;file&quot; id=&quot;arquivoInput&quot; accept=&quot;.zip,.tar,.tar.gz,.tgz,.html&quot;&gt;
    &lt;div class=&quot;control-group&quot;&gt;
      &lt;button onclick=&quot;carregarArquivo()&quot;&gt;📂 Carregar Arquivo&lt;/button&gt;
      &lt;button class=&quot;secondary&quot; onclick=&quot;mostrarOpcoesSaida()&quot;&gt;💾 Opções de Saída&lt;/button&gt;
      &lt;button class=&quot;warning&quot; onclick=&quot;mostrarModal('modalNotas')&quot;&gt;📝 Notas Salvas&lt;/button&gt;
      &lt;button class=&quot;danger&quot; onclick=&quot;limparTudo()&quot;&gt;🗑️ Limpar Tudo&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;status-bar&quot; id=&quot;statusBar&quot;&gt;
      &lt;span&gt;&lt;span class=&quot;status-dot yellow&quot;&gt;&lt;/span&gt; Aguardando arquivo...&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- SEÇÃO 2: CONFIGURAÇÕES --&gt;
  &lt;div class=&quot;card&quot;&gt;
    &lt;h2&gt;⚙️ 2. Configurações de Processamento&lt;/h2&gt;
    &lt;div class=&quot;control-group&quot;&gt;
      &lt;label&gt;Tamanho máximo de arquivo (KB):&lt;/label&gt;
      &lt;input type=&quot;range&quot; id=&quot;maxTamanho&quot; min=&quot;100&quot; max=&quot;100000&quot; value=&quot;10000&quot; oninput=&quot;atualizarTamanho()&quot;&gt;
      &lt;input type=&quot;number&quot; id=&quot;maxTamanhoNum&quot; value=&quot;10000&quot; min=&quot;100&quot; max=&quot;100000&quot; oninput=&quot;sincronizarTamanho()&quot;&gt;
      &lt;span class=&quot;small&quot; id=&quot;tamanhoInfo&quot;&gt;10000 KB (~10 MB)&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;control-group&quot;&gt;
      &lt;label&gt;Limite de resposta IA (caracteres):&lt;/label&gt;
      &lt;input type=&quot;range&quot; id=&quot;maxRespostaIA&quot; min=&quot;500&quot; max=&quot;200000&quot; value=&quot;50000&quot; oninput=&quot;atualizarRespostaIA()&quot;&gt;
      &lt;input type=&quot;number&quot; id=&quot;maxRespostaIANum&quot; value=&quot;50000&quot; min=&quot;500&quot; max=&quot;200000&quot; oninput=&quot;sincronizarRespostaIA()&quot;&gt;
      &lt;span class=&quot;small&quot; id=&quot;respostaIAInfo&quot;&gt;50000 caracteres&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;control-group&quot;&gt;
      &lt;label&gt;Contexto máximo enviado à IA (chars):&lt;/label&gt;
      &lt;input type=&quot;range&quot; id=&quot;maxContextoIA&quot; min=&quot;1000&quot; max=&quot;500000&quot; value=&quot;100000&quot; oninput=&quot;atualizarContexto()&quot;&gt;
      &lt;input type=&quot;number&quot; id=&quot;maxContextoIANum&quot; value=&quot;100000&quot; min=&quot;1000&quot; max=&quot;500000&quot; oninput=&quot;sincronizarContexto()&quot;&gt;
      &lt;span class=&quot;small&quot; id=&quot;contextoIAInfo&quot;&gt;100000 chars (~100K tokens aprox.)&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- SEÇÃO 3: CONFIGURAÇÃO DA IA --&gt;
  &lt;div class=&quot;card highlight&quot;&gt;
    &lt;h2&gt;🤖 3. Configurar IA&lt;/h2&gt;
    &lt;div class=&quot;control-group&quot; style=&quot;flex-wrap:wrap; gap:6px; margin-bottom:10px;&quot;&gt;
      &lt;span class=&quot;provider-badge openai&quot;&gt;OpenAI&lt;/span&gt;
      &lt;span class=&quot;provider-badge anthropic&quot;&gt;Anthropic Claude&lt;/span&gt;
      &lt;span class=&quot;provider-badge gemini&quot;&gt;Google Gemini&lt;/span&gt;
      &lt;span class=&quot;provider-badge groq&quot;&gt;Groq GRÁTIS&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ia-config-box&quot;&gt;
      &lt;label&gt;Provedor de IA:&lt;/label&gt;
      &lt;select id=&quot;iaProvedor&quot; onchange=&quot;atualizarConfigIA()&quot;&gt;
        &lt;option value=&quot;openai&quot;&gt;OpenAI (GPT-4o, GPT-4, GPT-3.5)&lt;/option&gt;
        &lt;option value=&quot;anthropic&quot;&gt;Anthropic (Claude 3.5, Claude 3)&lt;/option&gt;
        &lt;option value=&quot;gemini&quot;&gt;Google Gemini (1.5 Pro, Flash)&lt;/option&gt;
        &lt;option value=&quot;groq&quot;&gt;Groq (Llama, Mixtral - GRÁTIS)&lt;/option&gt;
        &lt;option value=&quot;openrouter&quot;&gt;OpenRouter (Multi-modelo)&lt;/option&gt;
        &lt;option value=&quot;ollama&quot;&gt;Ollama (Local - Sem API Key)&lt;/option&gt;
      &lt;/select&gt;

      &lt;label&gt;Modelo:&lt;/label&gt;
      &lt;select id=&quot;iaModelo&quot;&gt;
        &lt;option value=&quot;gpt-4o&quot;&gt;gpt-4o&lt;/option&gt;
      &lt;/select&gt;

      &lt;label&gt;Chave de API (deixe vazio para Ollama):&lt;/label&gt;
      &lt;div style=&quot;position:relative;&quot;&gt;
        &lt;input type=&quot;password&quot; id=&quot;iaToken&quot; placeholder=&quot;sk-... ou AIza... ou gsk_...&quot;&gt;
        &lt;button onclick=&quot;toggleSenha()&quot; style=&quot;position:absolute;right:4px;top:50%;transform:translateY(-50%);padding:4px 8px;margin:0;font-size:11px;&quot;&gt;👁&lt;/button&gt;
      &lt;/div&gt;

      &lt;div id=&quot;urlCustomContainer&quot; style=&quot;display:none;&quot;&gt;
        &lt;label&gt;URL da API:&lt;/label&gt;
        &lt;input type=&quot;text&quot; id=&quot;iaUrlCustom&quot; placeholder=&quot;http://localhost:11434/api/chat&quot; value=&quot;http://localhost:11434/api/chat&quot;&gt;
      &lt;/div&gt;

      &lt;div class=&quot;control-group&quot;&gt;
        &lt;button onclick=&quot;testarConexaoIA()&quot;&gt;🔌 Testar Conexão&lt;/button&gt;
        &lt;button class=&quot;secondary&quot; onclick=&quot;salvarConfigIA()&quot;&gt;💾 Salvar&lt;/button&gt;
        &lt;button class=&quot;secondary&quot; onclick=&quot;carregarConfigIA()&quot;&gt;📂 Carregar&lt;/button&gt;
      &lt;/div&gt;
      &lt;div id=&quot;statusConexaoIA&quot; class=&quot;small&quot; style=&quot;margin-top:6px;&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;modelo-info&quot; id=&quot;modeloInfo&quot; style=&quot;display:none;&quot;&gt;
      &lt;table&gt;
        &lt;tr&gt;&lt;td&gt;Provedor&lt;/td&gt;&lt;td id=&quot;infoProvedor&quot;&gt;-&lt;/td&gt;&lt;/tr&gt;

// ============================================================
// CONFIGURAÇÃO DA IA
// ============================================================
const PROVEDORES = {
  openai: {
    url: 'https://api.openai.com/v1/chat/completions',
    modelos: ['gpt-4o','gpt-4o-mini','gpt-4-turbo','gpt-4','gpt-3.5-turbo'],
    headers: (token) =&gt; ({ 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) =&gt; JSON.stringify({ model: modelo, messages: msgs, max_tokens: maxTokens }),
    extrairResposta: (data) =&gt; data.choices[0].message.content
  },
  anthropic: {
    url: 'https://api.anthropic.com/v1/messages',
    modelos: ['claude-3-5-sonnet-20241022','claude-3-opus-20240229','claude-3-sonnet-20240229','claude-3-haiku-20240307'],
    headers: (token) =&gt; ({ 'x-api-key': token, 'anthropic-version': '2023-06-01', 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) =&gt; {
      const system = msgs.find(m =&gt; m.role === 'system');
      const userMsgs = msgs.filter(m =&gt; m.role !== 'system');
      const payload = { model: modelo, max_tokens: maxTokens, messages: userMsgs };
      if (system) payload.system = system.content;
      return JSON.stringify(payload);
    },
    extrairResposta: (data) =&gt; data.content[0].text
  },
  gemini: {
    url: (modelo, token) =&gt; `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${token}`,
    modelos: ['gemini-1.5-pro-latest','gemini-1.5-flash-latest','gemini-pro'],
    headers: () =&gt; ({ 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) =&gt; {
      const parts = msgs.map(m =&gt; ({ text: `${m.role === 'user' ? 'Usuário' : 'Assistente'}: ${m.content}` }));
      return JSON.stringify({ contents: [{ parts }], generationConfig: { maxOutputTokens: maxTokens } });
    },
    extrairResposta: (data) =&gt; data.candidates[0].content.parts[0].text
  },
  groq: {
    url: 'https://api.groq.com/openai/v1/chat/completions',
    modelos: ['llama-3.1-70b-versatile','llama-3.1-8b-instant','mixtral-8x7b-32768','gemma2-9b-it'],
    headers: (token) =&gt; ({ 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) =&gt; JSON.stringify({ model: modelo, messages: msgs, max_tokens: maxTokens }),
    extrairResposta: (data) =&gt; data.choices[0].message.content
  },
  openrouter: {
    url: 'https://openrouter.ai/api/v1/chat/completions',
    modelos: ['anthropic/claude-3.5-sonnet','openai/gpt-4o','meta-llama/llama-3.1-70b-instruct','google/gemini-flash-1.5'],
    headers: (token) =&gt; ({ 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'HTTP-Referer': window.location.href }),
    body: (modelo, msgs, maxTokens) =&gt; JSON.stringify({ model: modelo, messages: msgs, max_tokens: maxTokens }),
    extrairResposta: (data) =&gt; data.choices[0].message.content
  },
  ollama: {
    url: () =&gt; document.getElementById('iaUrlCustom').value || 'http://localhost:11434/api/chat',
    modelos: ['llama3.1','llama3','mistral','codellama','phi3','qwen2'],
    headers: () =&gt; ({ 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) =&gt; JSON.stringify({ model: modelo, messages: msgs, stream: false }),
    extrairResposta: (data) =&gt; data.message.content
  }
};

function atualizarConfigIA() {
  const provedor = document.getElementById('iaProvedor').value;
  const config = PROVEDORES[provedor];
  const modeloSel = document.getElementById('iaModelo');
  modeloSel.innerHTML = config.modelos.map(m =&gt; `&lt;option value=&quot;${m}&quot;&gt;${m}&lt;/option&gt;`).join('');

  const urlContainer = document.getElementById('urlCustomContainer');
  urlContainer.style.display = (provedor === 'ollama') ? 'block' : 'none';

  if (provedor === 'ollama') {
    document.getElementById('iaUrlCustom').value = 'http://localhost:11434/api/chat';
  }
}

function toggleSenha() {
  const inp = document.getElementById('iaToken');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

function salvarConfigIA() {
  const config = {
    provedor: document.getElementById('iaProvedor').value,
    modelo: document.getElementById('iaModelo').value,
    token: document.getElementById('iaToken').value,
    urlCustom: document.getElementById('iaUrlCustom').value
  };
  localStorage.setItem('ia_config', JSON.stringify(config));
  mostrarToast('✅ Configuração salva!', 'success');
}

function carregarConfigIA() {
  const saved = localStorage.getItem('ia_config');
  if (!saved) return;
  const config = JSON.parse(saved);
  document.getElementById('iaProvedor').value = config.provedor || 'openai';
  atualizarConfigIA();
  document.getElementById('iaModelo').value = config.modelo || '';
  document.getElementById('iaToken').value = config.token || '';
  document.getElementById('iaUrlCustom').value = config.urlCustom || '';
}

async function testarConexaoIA() {
  const statusEl = document.getElementById('statusConexaoIA');
  statusEl.innerHTML = '&lt;span class=&quot;spinner&quot;&gt;&lt;/span&gt; Testando...';
  try {
    const resposta = await chamarIA([{ role: 'user', content: 'Responda apenas: OK' }]);
    iaConectada = true;
    statusEl.innerHTML = `&lt;span class=&quot;ok&quot;&gt;✅ Conectado!&lt;/span&gt;`;
    atualizarInfoModelo();
    mostrarToast('IA conectada!', 'success');
  } catch (e) {
    iaConectada = false;
    statusEl.innerHTML = `&lt;span class=&quot;bad&quot;&gt;❌ ${e.message}&lt;/span&gt;`;
    mostrarToast('Erro: ' + e.message, 'error');
  }
}

  const provedor = document.getElementById('iaProvedor').value;

  document.getElementById('infoStatus').innerHTML = '&lt;span class=&quot;ok&quot;&gt;✅ Conectado&lt;/span&gt;';
  document.getElementById('infoUltimoUso').textContent = new Date().toLocaleString('pt-BR');
}

// ============================================================
// CHAMAR IA - UNIVERSAL
// ============================================================
async function chamarIA(mensagens) {
  const provedor = document.getElementById('iaProvedor').value;
  const modelo = document.getElementById('iaModelo').value;
  const token = document.getElementById('iaToken').value;
  const config = PROVEDORES[provedor];

  if (!config) throw new Error('Provedor não configurado');
  if (provedor !== 'ollama' &amp;&amp; !token) throw new Error('Configure sua chave de API');

  const url = typeof config.url === 'function' ? config.url(modelo, token) : config.url;
  const headers = config.headers(token);
  const maxTokens = Math.min(Math.ceil(maxRespostaIAChars / 4), 32000);
  const body = config.body(modelo, mensagens, maxTokens);

  const response = await fetch(url, { method: 'POST', headers, body });

  if (!response.ok) {
    const errText = await response.text();
    throw new Error(`HTTP ${response.status}: ${errText.substring(0, 200)}`);
  }

  const data = await response.json();
  let resposta = config.extrairResposta(data);

  if (resposta.length &gt; maxRespostaIAChars) {
    resposta = resposta.substring(0, maxRespostaIAChars) + '\n\n[... truncado]';
  }

  atualizarInfoModelo();
  return resposta;
}

// ============================================================
// CONSTRUIR CONTEXTO
// ============================================================
function construirContexto(incluirTodos = false) {
  let ctx = '=== CONTEXTO DO PROJETO ===\n\n';
  ctx += document.getElementById('diagnostico').textContent + '\n\n';

  const arquivosParaIncluir = incluirTodos
    ? Object.keys(conteudosTexto)
    : Object.keys(conteudosTexto)
        .filter(a =&gt;
          a.includes('package.json') || a.includes('README') ||
          a.includes('main') || a.includes('index') ||
          a.includes('app') || a.includes('config')
        )
        .slice(0, 15);

  ctx += `=== ARQUIVOS (${arquivosParaIncluir.length} de ${Object.keys(conteudosTexto).length}) ===\n\n`;

  let totalChars = ctx.length;
  for (const arquivo of arquivosParaIncluir) {
    let conteudo = conteudosTexto[arquivo] || '';
    const maxPorArquivo = Math.floor((maxContextoIAChars - totalChars) / Math.max(1, arquivosParaIncluir.length));
    if (conteudo.length &gt; maxPorArquivo) {
      conteudo = conteudo.substring(0, maxPorArquivo) + '\n[... truncado]';
    }
    const bloco = `\n--- ${arquivo} ---\n${conteudo}\n`;
    if (totalChars + bloco.length &gt; maxContextoIAChars) break;
    ctx += bloco;
    totalChars += bloco.length;
  }

  return ctx;
}

async function carregarArquivo() {
  const input = document.getElementById('arquivoInput');
  if (!input.files || !input.files[0]) {
    mostrarToast('Selecione um arquivo.', 'error');
    return;
  }

  const file = input.files[0];
  const buffer = await file.arrayBuffer();
  const formato = document.getElementById('formatoArquivo').value;

  arquivos = [];
  conteudosTexto = {};

  try {
    if (formato === 'auto' || formato === 'zip') {
      if (file.name.endsWith('.zip')) {
        await processarZIP(buffer);
        return;
      }
    }

    if (formato === 'auto' || formato === 'tar' || formato === 'taz') {
      if (file.name.endsWith('.tar') || file.name.endsWith('.tar.gz') || file.name.endsWith('.tgz')) {
        await processarTAR(buffer);
        return;
      }
    }

    if (formato === 'auto' || formato === 'html') {
      if (file.name.endsWith('.html')) {
        processarHTML(buffer);
        return;
      }
    }

    mostrarToast('Formato não suportado.', 'error');
  } catch (e) {
    mostrarToast('Erro: ' + e.message, 'error');
    console.error(e);
  }
}

async function processarZIP(buffer) {
  const zip = await JSZip.loadAsync(buffer);
  zip.forEach((path, entry) =&gt; {
    arquivos.push({ nome: path, dir: entry.dir, tamanho: entry._data.uncompressedSize });
  });

  for (const item of arquivos) {
    if (!item.dir &amp;&amp; ehTexto(item.nome) &amp;&amp; item.tamanho &lt; maxTamanhoByte) {
      try {
        conteudosTexto[item.nome] = await zip.file(item.nome).async('string');
      } catch (e) {
        conteudosTexto[item.nome] = '[ERRO]';
      }
    }
  }

  arquivos.sort((a, b) =&gt; a.nome.localeCompare(b.nome));
  renderArquivos();
  diagnosticar();
  mostrarToast(`✅ ${arquivos.length} arquivos carregados`, 'success');
  atualizarStatusBar();
}

async function processarTAR(buffer) {
  let dados = new Uint8Array(buffer);

  if (document.getElementById('arquivoInput').files[0].name.endsWith('.gz') ||
      document.getElementById('arquivoInput').files[0].name.endsWith('.tgz')) {
    dados = pako.inflate(dados);
  }

  const view = new DataView(dados.buffer);
  let offset = 0;

  while (offset &lt; dados.length) {
    const headerBytes = dados.slice(offset, offset + 512);
    if (headerBytes.every(b =&gt; b === 0)) break;

    const nome = new TextDecoder().decode(headerBytes.slice(0, 100)).split('\0')[0];
    const tamanhoStr = new TextDecoder().decode(headerBytes.slice(124, 136)).trim();
    const tamanho = parseInt(tamanhoStr, 8);
    const tipo = String.fromCharCode(headerBytes[156]);

    offset += 512;

        if (nome &amp;&amp; tipo !== '5') {
      arquivos.push({ nome, dir: false, tamanho });

      if (ehTexto(nome) &amp;&amp; tamanho &lt; maxTamanhoByte) {
        const conteudo = new TextDecoder().decode(dados.slice(offset, offset + tamanho));
        conteudosTexto[nome] = conteudo;
      }
    }

    offset += Math.ceil(tamanho / 512) * 512;
  }

  arquivos.sort((a, b) =&gt; a.nome.localeCompare(b.nome));
  renderArquivos();
  diagnosticar();
  mostrarToast(`✅ ${arquivos.length} arquivos carregados`, 'success');
  atualizarStatusBar();
}

function processarHTML(buffer) {
  const html = new TextDecoder().decode(buffer);
  const nome = document.getElementById('arquivoInput').files[0].name;

  arquivos.push({ nome, dir: false, tamanho: buffer.byteLength });
  conteudosTexto[nome] = html;

  const scriptRegex = /&lt;script[^&gt;]*&gt;([\s\S]*?)&lt;\/script&gt;/gi;
  const styleRegex = /&lt;style[^&gt;]*&gt;([\s\S]*?)&lt;\/style&gt;/gi;

  let match;
  let contador = 1;

  while ((match = scriptRegex.exec(html)) !== null) {
    const nomeScript = `extracted_script_${contador}.js`;
    arquivos.push({ nome: nomeScript, dir: false, tamanho: match[1].length });
    conteudosTexto[nomeScript] = match[1];
    contador++;
  }

  contador = 1;
  while ((match = styleRegex.exec(html)) !== null) {
    const nomeStyle = `extracted_style_${contador}.css`;
    arquivos.push({ nome: nomeStyle, dir: false, tamanho: match[1].length });
    conteudosTexto[nomeStyle] = match[1];
    contador++;
  }

  renderArquivos();
  diagnosticar();
  mostrarToast(`✅ HTML processado com ${arquivos.length} itens`, 'success');
  atualizarStatusBar();
}

function ehTexto(nome) {
  const lower = nome.toLowerCase();
  if (lower.endsWith('/')) return false;
  return extensoesTexto.some(ext =&gt; lower.endsWith(ext));
}

function atualizarStatusBar() {
  const bar = document.getElementById('statusBar');
  const total = arquivos.length;
  const textos = Object.keys(conteudosTexto).length;

// ============================================================
function buscarTermos() {
  const termos = document.getElementById('termosBusca').value
    .split(',')
    .map(t =&gt; t.trim().toLowerCase())
    .filter(Boolean);

  let saida = '';
  let totalEncontrados = 0;

  Object.entries(conteudosTexto).forEach(([nome, conteudo]) =&gt; {
    const linhas = conteudo.split(/\r?\n/);
    linhas.forEach((linha, idx) =&gt; {
      const low = linha.toLowerCase();
      termos.forEach(termo =&gt; {
        if (low.includes(termo)) {
          totalEncontrados++;
          saida += `${nome}:${idx + 1} | termo: ${termo}\n`;
          saida += linha.slice(0, 300) + '\n\n';
        }
      });
    });
  });

  if (!saida) saida = 'Nenhum termo encontrado.';
  else saida = `Total encontrado: ${totalEncontrados}\n\n` + saida;

  document.getElementById('resultadoBusca').textContent = saida;
}

async function analisarBuscaComIA() {
  if (!iaConectada) {
    mostrarToast('Configure e teste a IA primeiro.', 'error');

  const resultado = document.getElementById('resultadoBusca').textContent;
  if (resultado === 'Resultado aparecerá aqui.') {
    mostrarToast('Execute a busca primeiro.', 'error');
    return;
  }

  const respEl = document.getElementById('resultadoBusca');
  respEl.textContent = 'Analisando com IA...';

  try {
    const msgs = [
      { role: 'user', content: `Analise estes resultados de busca e me diga o que encontrou:\n\n${resultado}` }
    ];
    const resposta = await chamarIA(msgs);
    renderizarRespostaIA(respEl, resposta, 'busca_termos');
  } catch (e) {
    respEl.textContent = `Erro: ${e.message}`;
    mostrarToast('Erro na IA: ' + e.message, 'error');
  }
}

// ============================================================
// DIAGNÓSTICO
// ============================================================
function temArquivo(parte) {
  return arquivos.some(a =&gt; a.nome.toLowerCase().includes(parte.toLowerCase()));
}

function temConteudo(parte) {
  const p = parte.toLowerCase();
  return Object.values(conteudosTexto).some(c =&gt; c.toLowerCase().includes(p));
}

function diagnosticar() {
  let d = '=== DIAGNÓSTICO AUTOMÁTICO ===\n\n';
  d += `Total de itens: ${arquivos.length}\n`;
  d += `Arquivos de texto lidos: ${Object.keys(conteudosTexto).length}\n`;
  d += `Tamanho máximo por arquivo: ${(maxTamanhoByte / 1024).toFixed(0)} KB\n\n`;

  const hasPackage = temArquivo('package.json');
  const hasSrc = temArquivo('src/');
  const hasDist = temArquivo('dist/') || temArquivo('assets/');
  const hasVite = temArquivo('vite.config') || temConteudo('&quot;vite&quot;');
  const hasReact = temConteudo('&quot;react&quot;') || temArquivo('.tsx');
  const hasNext = temArquivo('next.config') || temConteudo('&quot;next&quot;');
  const hasManifest = temArquivo('manifest.json');
  const hasServiceWorker = temArquivo('service-worker') || temArquivo('sw.js');
  const hasSupabase = temConteudo('supabase');
  const hasNeon = temConteudo('neon');
  const hasDocker = temArquivo('dockerfile') || temArquivo('docker-compose');
  const hasGit = temArquivo('.git');
  const hasEnv = temArquivo('.env');

  d += hasPackage ? '✅ Tem package.json\n' : '❌ Sem package.json\n';
  d += hasSrc ? '✅ Tem pasta src/\n' : '⚠️ Sem src/\n';
  d += hasDist ? '⚠️ Tem dist/assets (compilado)\n' : '✅ Sem dist\n';
  d += hasVite ? '✅ Vite detectado\n' : '';
  d += hasReact ? '✅ React detectado\n' : '';
  d += hasNext ? '⚠️ Next.js detectado\n' : '';
  d += hasManifest ? '✅ PWA (manifest.json)\n' : '⚠️ Sem PWA\n';
  d += hasServiceWorker ? '✅ Service Worker (PWA)\n' : '⚠️ Sem SW\n';
  d += hasSupabase ? '⚠️ Supabase detectado\n' : '';
  d += hasNeon ? '⚠️ Neon detectado\n' : '';
  d += hasDocker ? '✅ Docker detectado\n' : '';
  d += hasGit ? '✅ Git detectado\n' : '';
  d += hasEnv ? '✅ Arquivo .env\n' : '⚠️ Sem .env\n';

  d += '\n=== RECOMENDAÇÕES ===\n';
  if (hasPackage &amp;&amp; hasSrc &amp;&amp; hasVite &amp;&amp; hasReact) {
    d += '✅ Projeto React + Vite bem estruturado.\n';
    d += '   Build: npm run build\n';
    d += '   Deploy: Netlify, Vercel ou similar\n';
  } else if (!hasPackage &amp;&amp; hasDist) {
    d += '⚠️ Versão compilada. Difícil de editar.\n';
  } else if (hasManifest &amp;&amp; hasServiceWorker) {

async function enviarChat() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();

  if (!msg) return;
  if (!iaConectada) {
    mostrarToast('Configure a IA primeiro.', 'error');
    return;
  }

  // Adicionar mensagem do usuário ao histórico
  chatHistoricoArr.push({ role: 'user', content: msg });
  renderizarChat();
  input.value = '';

  try {
    const comContexto = document.getElementById('chatComContexto').checked;
    let mensagens = [...chatHistoricoArr];

    if (comContexto &amp;&amp; chatHistoricoArr.length === 1) {
      const ctx = construirContexto(false);
      mensagens[0].content = `${ctx}\n\n${msg}`;
    }

    const resposta = await chamarIA(mensagens);
    chatHistoricoArr.push({ role: 'assistant', content: resposta });
    renderizarChat();
  } catch (e) {
    mostrarToast('Erro: ' + e.message, 'error');
  }
}

function renderizarChat() {
  const el = document.getElementById('chatHistorico');
  if (!chatHistoricoArr.length) {
    el.innerHTML = '&lt;div class=&quot;small&quot; style=&quot;color:#64748b;&quot;&gt;Chat vazio...&lt;/div&gt;';
    return;
  }

  el.innerHTML = chatHistoricoArr.map(msg =&gt; `
    &lt;div class=&quot;chat-msg ${msg.role}&quot;&gt;
      &lt;div class=&quot;chat-msg-label&quot;&gt;${msg.role === 'user' ? '👤 Você' : '🤖 IA'}&lt;/div&gt;
      &lt;div class=&quot;chat-msg-texto&quot;&gt;${escapeHtml(msg.content)}&lt;/div&gt;
    &lt;/div&gt;
  `).join('');

  el.scrollTop = el.scrollHeight;
}

function limparChat() {
  if (!confirm('Limpar histórico do chat?')) return;
  chatHistoricoArr = [];
  renderizarChat();
  mostrarToast('💬 Chat limpo', 'info');
}

function exportarChat() {
  const txt = chatHistoricoArr.map(msg =&gt; `${msg.role === 'user' ? 'Você' : 'IA'}: ${msg.content}`).join('\n\n---\n\n');

  mostrarToast('💾 Chat exportado!', 'success');
}

&lt;script src=&quot;https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://cdn.jsdelivr.net/npm/pako@2.0.4/dist/pako.min.js&quot;&gt;&lt;/script&gt;

&lt;script&gt;
  // ESTADO GLOBAL
  let arquivoCarregado = null;
  let arquivos = [];
  let conteudosTexto = {};
  let maxTamanhoByte = 5000 * 1024;
  let maxRespostaIA = 10000;
  let iaAPI = 'https://api.openai.com/v1/chat/completions'; // Será configurado
  let iaToken = '';

  const extensoesTexto = [
    '.txt', '.md', '.json', '.js', '.jsx', '.ts', '.tsx', '.html', '.css',
    '.scss', '.xml', '.yml', '.yaml', '.toml', '.env', '.sql', '.gitignore',
    '.nix', '.config', '.cjs', '.mjs', '.py', '.java', '.cpp', '.c', '.go',
    '.rb', '.php', '.sh', '.bash', '.dockerfile', '.properties', '.gradle'
  ];

  // ===== CONTROLES DE TAMANHO =====
  function atualizarTamanho() {
    const val = document.getElementById('maxTamanho').value;
    document.getElementById('maxTamanhoNum').value = val;
    maxTamanhoByte = val * 1024;
    document.getElementById('tamanhoInfo').textContent = `${val} KB (~${(val/1024).toFixed(1)} MB)`;
  }

  function sincronizarTamanho() {
    const val = document.getElementById('maxTamanhoNum').value;
    document.getElementById('maxTamanho').value = val;
    atualizarTamanho();
  }

  function atualizarRespostaIA() {
    const val = document.getElementById('maxRespostaIA').value;
    document.getElementById('maxRespostaIANum').value = val;
    maxRespostaIA = val;
    document.getElementById('respostaIAInfo').textContent = `${val} caracteres`;
  }

  function sincronizarRespostaIA() {
    const val = document.getElementById('maxRespostaIANum').value;
    document.getElementById('maxRespostaIA').value = val;
    atualizarRespostaIA();
  }

  // ===== ABAS =====
  function mudarAba(nomeAba) {
    document.querySelectorAll('.tab-content').forEach(el =&gt; el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el =&gt; el.classList.remove('active'));
    document.getElementById(nomeAba).classList.add('active');
    event.target.classList.add('active');
  }

  // ===== MODAL =====
  function mostrarModal(id) {
    document.getElementById(id).classList.add('active');
  }

  function fecharModal(id) {
    document.getElementById(id).classList.remove('active');
  }

  function mostrarOpcoesSaida() {
    if (!arquivos.length) {
      alert('Carregue um arquivo primeiro.');
      return;
    }
    mostrarModal('modalSaida');
  }

  // ===== CARREGAR ARQUIVO =====
  async function carregarArquivo() {
    const input = document.getElementById('arquivoInput');
    if (!input.files || !input.files[0]) {
      alert('Selecione um arquivo primeiro.');
      return;
    }

    const file = input.files[0];
    const buffer = await file.arrayBuffer();
    const formato = document.getElementById('formatoArquivo').value;

    arquivos = [];
    conteudosTexto = {};

    try {
      if (formato === 'auto' || formato === 'zip') {
        if (file.name.endsWith('.zip')) {
          await processarZIP(buffer);
          return;
        }
      }

      if (formato === 'auto' || formato === 'tar' || formato === 'taz') {
        if (file.name.endsWith('.tar') || file.name.endsWith('.tar.gz') || file.name.endsWith('.tgz')) {
          await processarTAR(buffer);
          return;
        }
      }

      if (formato === 'auto' || formato === 'html') {
        if (file.name.endsWith('.html')) {
          processarHTML(buffer);
          return;
        }
      }

      alert('Formato não suportado ou não reconhecido.');
    } catch (e) {
      alert('Erro ao processar arquivo: ' + e.message);
      console.error(e);
    }
  }

  async function processarZIP(buffer) {
    const zip = await JSZip.loadAsync(buffer);
    zip.forEach((path, entry) =&gt; {
      arquivos.push({ nome: path, dir: entry.dir, tamanho: entry._data.uncompressedSize });
    });

    for (const item of arquivos) {
      if (!item.dir &amp;&amp; ehTexto(item.nome) &amp;&amp; item.tamanho &lt; maxTamanhoByte) {
        try {
          conteudosTexto[item.nome] = await zip.file(item.nome).async('string');
        } catch (e) {
          conteudosTexto[item.nome] = '[ERRO AO LER]';
        }
      }
    }

    arquivos.sort((a, b) =&gt; a.nome.localeCompare(b.nome));
    renderArquivos();
    diagnosticar();
  }

  async function processarTAR(buffer) {
    // Descompactar TAR/TAZ usando pako
    let dados = new Uint8Array(buffer);

    if (document.getElementById('arquivoInput').files[0].name.endsWith('.gz') ||
        document.getElementById('arquivoInput').files[0].name.endsWith('.tgz')) {
      dados = pako.inflate(dados);
    }

    // Parsing TAR simples
    const view = new DataView(dados.buffer);
    let offset = 0;

    while (offset &lt; dados.length) {
      const headerBytes = dados.slice(offset, offset + 512);
      if (headerBytes.every(b =&gt; b === 0)) break;

      const nome = new TextDecoder().decode(headerBytes.slice(0, 100)).split('\0')[0];
      const tamanhoStr = new TextDecoder().decode(headerBytes.slice(124, 136)).trim();
      const tamanho = parseInt(tamanhoStr, 8);
      const tipo = String.fromCharCode(headerBytes[156]);

      offset += 512;

      if (nome &amp;&amp; tipo !== '5') { // tipo 5 = diretório
        arquivos.push({ nome, dir: false, tamanho });

        if (ehTexto(nome) &amp;&amp; tamanho &lt; maxTamanhoByte) {
          const conteudo = new TextDecoder().decode(dados.slice(offset, offset + tamanho));
          conteudosTexto[nome] = conteudo;
        }
      }

      offset += Math.ceil(tamanho / 512) * 512;
    }

    arquivos.sort((a, b) =&gt; a.nome.localeCompare(b.nome));
    renderArquivos();
    diagnosticar();
  }

  function processarHTML(buffer) {
    const html = new TextDecoder().decode(buffer);
    const nome = document.getElementById('arquivoInput').files[0].name;

    arquivos.push({ nome, dir: false, tamanho: buffer.byteLength });
    conteudosTexto[nome] = html;

    // Extrair scripts e estilos
    const scriptRegex = /&lt;script[^&gt;]*&gt;([\s\S]*?)&lt;\/script&gt;/gi;
    const styleRegex = /&lt;style[^&gt;]*&gt;([\s\S]*?)&lt;\/style&gt;/gi;

    let match;
    let contador = 1;

    while ((match = scriptRegex.exec(html)) !== null) {
      const nomeScript = `extracted_script_${contador}.js`;
      arquivos.push({ nome: nomeScript, dir: false, tamanho: match[1].length });
      conteudosTexto[nomeScript] = match[1];
      contador++;
    }

    contador = 1;
    while ((match = styleRegex.exec(html)) !== null) {
      const nomeStyle = `extracted_style_${contador}.css`;
      arquivos.push({ nome: nomeStyle, dir: false, tamanho: match[1].length });
      conteudosTexto[nomeStyle] = match[1];
      contador++;
    }

    renderArquivos();
    diagnosticar();
  }

  function ehTexto(nome) {
    const lower = nome.toLowerCase();
    if (lower.endsWith('/')) return false;
    return extensoesTexto.some(ext =&gt; lower.endsWith(ext));
  }

  // ===== RENDERIZAR ARQUIVOS =====
  function renderArquivos() {
    const filtro = document.getElementById('filtroArquivo').value.toLowerCase();
    const el = document.getElementById('listaArquivos');

    if (!arquivos.length) {
      el.innerHTML = 'Nenhum arquivo carregado.';
      document.getElementById('contadorArquivos').textContent = '0 arquivos';
      return;
    }

    const filtrados = arquivos.filter(a =&gt; a.nome.toLowerCase().includes(filtro));
    document.getElementById('contadorArquivos').textContent = `${filtrados.length} de ${arquivos.length} arquivos`;

    el.innerHTML = filtrados.map(a =&gt; {
      const tipo = a.dir ? '📁' : ehTexto(a.nome) ? '📄' : '📦';
      const tamanhoKB = a.tamanho ? (a.tamanho / 1024).toFixed(1) : '?';
      return `&lt;div class=&quot;file-item&quot; onclick=&quot;abrirArquivo('${a.nome.replace(/'/g, &quot;\\'&quot;)}')&quot; title=&quot;${a.nome}&quot;&gt;
        ${tipo} ${a.nome} &lt;span class=&quot;small&quot;&gt;(${tamanhoKB} KB)&lt;/span&gt;
      &lt;/div&gt;`;
    }).join('');
  }

  function abrirArquivo(nome) {
    document.getElementById('arquivoAtual').textContent = nome;
    const area = document.getElementById('conteudoArquivo');

    if (conteudosTexto[nome] !== undefined) {
      let conteudo = conteudosTexto[nome];
      if (conteudo.length &gt; maxTamanhoByte) {
        conteudo = conteudo.substring(0, maxTamanhoByte) + '\n\n[... ARQUIVO TRUNCADO - Ajuste o limite de tamanho para ver mais]';
      }
      area.value = conteudo;
    } else {
      area.value = '[Arquivo binário, pasta, ou tipo não lido como texto]';
    }
  }

  // ===== BUSCAR TERMOS =====
  function buscarTermos() {
    const termos = document.getElementById('termosBusca').value
      .split(',')
      .map(t =&gt; t.trim().toLowerCase())
      .filter(Boolean);

    let saida = '';
    let totalEncontrados = 0;

    Object.entries(conteudosTexto).forEach(([nome, conteudo]) =&gt; {
      const linhas = conteudo.split(/\r?\n/);
      linhas.forEach((linha, idx) =&gt; {
        const low = linha.toLowerCase();
        termos.forEach(termo =&gt; {
          if (low.includes(termo)) {
            totalEncontrados++;
            saida += `${nome}:${idx + 1} | termo: ${termo}\n`;
            saida += linha.slice(0, 300) + '\n\n';
          }
        });
      });
    });

    if (!saida) saida = 'Nenhum termo encontrado.';
    else saida = `Total encontrado: ${totalEncontrados}\n\n` + saida;

    document.getElementById('resultadoBusca').textContent = saida;
  }

  // ===== DIAGNÓSTICO =====
  function temArquivo(parte) {
    return arquivos.some(a =&gt; a.nome.toLowerCase().includes(parte.toLowerCase()));
  }

  function temConteudo(parte) {
    const p = parte.toLowerCase();
    return Object.values(conteudosTexto).some(c =&gt; c.toLowerCase().includes(p));
  }

  function diagnosticar() {
    let d = '=== DIAGNÓSTICO AUTOMÁTICO ===\n\n';
    d += `Total de itens: ${arquivos.length}\n`;
    d += `Arquivos de texto lidos: ${Object.keys(conteudosTexto).length}\n`;
    d += `Tamanho máximo por arquivo: ${(maxTamanhoByte / 1024).toFixed(0)} KB\n\n`;

    const hasPackage = temArquivo('package.json');
    const hasSrc = temArquivo('src/');
    const hasDist = temArquivo('dist/') || temArquivo('assets/');
    const hasVite = temArquivo('vite.config') || temConteudo('&quot;vite&quot;');
    const hasReact = temConteudo('&quot;react&quot;') || temArquivo('.tsx');
    const hasNext = temArquivo('next.config') || temConteudo('&quot;next&quot;');
    const hasCapacitor = temArquivo('capacitor.config');
    const hasNetlify = temArquivo('netlify.toml');
    const hasManifest = temArquivo('manifest.json');
    const hasServiceWorker = temArquivo('service-worker') || temArquivo('sw.js');
    const hasSupabase = temConteudo('supabase');
    const hasNeon = temConteudo('neon');

    d += hasPackage ? '✅ Tem package.json\n' : '❌ Não achei package.json\n';
    d += hasSrc ? '✅ Tem pasta src/\n' : '⚠️ Sem src/ claro\n';
    d += hasDist ? '⚠️ Tem dist/assets (pode ser build compilado)\n' : '✅ Não é só dist/build\n';
    d += hasVite ? '✅ Indício de Vite\n' : '';
    d += hasReact ? '✅ Indício de React\n' : '';
    d += hasNext ? '⚠️ Indício de Next.js\n' : '';
    d += hasCapacitor ? '⚠️ Indício de Capacitor/APK\n' : '';
    d += hasNetlify ? '✅ Indício de Netlify\n' : '';
    d += hasManifest ? '✅ Tem manifest.json (PWA)\n' : '⚠️ Sem manifest.json\n';
    d += hasServiceWorker ? '✅ Tem service worker (PWA)\n' : '⚠️ Sem service worker\n';
    d += hasSupabase ? '⚠️ Indício de Supabase\n' : '';
    d += hasNeon ? '⚠️ Indício de Neon\n' : '';

    d += '\n=== INTERPRETAÇÃO ===\n';

      d += 'Projeto React + Vite. Build: npm run build, publicar em Netlify/Vercel.\n';
    } else if (!hasPackage &amp;&amp; hasDist) {
      d += 'Versão compilada. Abrir como site, mas difícil de editar.\n';
    } else {
      d += 'Tipo não confirmado. Verifique package.json.\n';
    }

    document.getElementById('diagnostico').textContent = d;

  function gerarRelatorioCompleto() {
    diagnosticar();

      arquivos.map(a =&gt; `${a.nome} (${(a.tamanho / 1024).toFixed(1)} KB)`).join('\n')

    return rel;

  // ===== SAÍDA: BAIXAR =====
  function baixarConteudo() {

  // ===== IA INTEGRADA =====
  async function enviarParaIA(tipo) {
    let prompt = '';
    let respEl = '';

    if (tipo === 'analise') {
      prompt = document.getElementById('promptAnalise').value;
      respEl = 'respostaAnalise';
    } else if (tipo === 'correcao') {
      prompt = document.getElementById('promptCorrecao').value;
      respEl = 'respostaCorrecao';
    } else if (tipo === 'orientacao') {
      prompt = document.getElementById('promptOrientacao').value;
      respEl = 'respostaOrientacao';
    }

    if (!prompt.trim()) {
      alert('Digite um prompt primeiro.');
      return;
    }

    const resposta = document.getElementById(respEl);
    resposta.innerHTML = '&lt;div class=&quot;spinner&quot;&gt;&lt;/div&gt; Processando...';

    // Construir contexto com arquivos
    let contexto = 'CONTEXTO DO PROJETO:\n\n';
    contexto += document.getElementById('diagnostico').textContent + '\n\n';
    contexto += 'ARQUIVOS PRINCIPAIS:\n';

    // Limitar a quantidade de arquivos para não estourar token
    const arquivosPrincipais = Object.keys(conteudosTexto)
      .filter(a =&gt; a.includes('package.json') || a.includes('README') || a.includes('main') || a.includes('index'))
      .slice(0, 5);

    for (const arquivo of arquivosPrincipais) {
      let conteudo = conteudosTexto[arquivo];
      if (conteudo.length &gt; 2000) {
        conteudo = conteudo.substring(0, 2000) + '\n[... truncado]';
      }
      contexto += `\n--- ${arquivo} ---\n${conteudo}\n`;
    }

    const mensagemCompleta = `${contexto}\n\nPERGUNTA DO USUÁRIO:\n${prompt}`;

    try {
      // Simular resposta da IA (você precisa configurar sua API)
      const respostaIA = await chamarIA(mensagemCompleta);
      resposta.innerHTML = `&lt;pre&gt;${respostaIA}&lt;/pre&gt;`;
    } catch (e) {
      resposta.innerHTML = `&lt;div class=&quot;bad&quot;&gt;Erro: ${e.message}&lt;/div&gt;&lt;p&gt;Configure sua chave de API da IA nas configurações.&lt;/p&gt;`;
    }
  }

    //     max_tokens: parseInt(maxRespostaIA)
    //   })
    // });

    // Por enquanto, retornar resposta simulada
    return `[IA SIMULADA - Configure sua API]\n\nSua pergunta foi recebida com ${mensagem.length} caracteres.\n\nPara integrar IA real:\n1. Obtenha uma chave de API (OpenAI, Claude, etc)\n2. Configure no código\n3. Descomente o fetch acima\n\nResposta será limitada a ${maxRespostaIA} caracteres.`;
  }

// ============================================================
// CONFIGURAÇÃO IA
// ============================================================
const PROVEDORES = {
  openai: {
    url: 'https://api.openai.com/v1/chat/completions',
    modelos: ['gpt-4o','gpt-4o-mini','gpt-4-turbo','gpt-3.5-turbo'],
    headers: (token) =&gt; ({ 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) =&gt; JSON.stringify({ model: modelo, messages: msgs, max_tokens: maxTokens }),
    extrairResposta: (data) =&gt; data.choices[0].message.content
  },
  anthropic: {
    url: 'https://api.anthropic.com/v1/messages',
    modelos: ['claude-3-5-sonnet-20241022','claude-3-opus-20240229'],
    headers: (token) =&gt; ({ 'x-api-key': token, 'anthropic-version': '2023-06-01', 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) =&gt; {
      const system = msgs.find(m =&gt; m.role === 'system');
      const userMsgs = msgs.filter(m =&gt; m.role !== 'system');
      const payload = { model: modelo, max_tokens: maxTokens, messages: userMsgs };
      if (system) payload.system = system.content;
      return JSON.stringify(payload);
    },
    extrairResposta: (data) =&gt; data.content[0].text
  },
  gemini: {
    url: (modelo, token) =&gt; `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${token}`,
    modelos: ['gemini-1.5-pro-latest','gemini-1.5-flash-latest'],
    headers: () =&gt; ({ 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) =&gt; {
      const parts = msgs.map(m =&gt; ({ text: m.content }));
      return JSON.stringify({ contents: [{ parts }], generationConfig: { maxOutputTokens: maxTokens } });
    },
    extrairResposta: (data) =&gt; data.candidates[0].content.parts[0].text
  },
  groq: {
    url: 'https://api.groq.com/openai/v1/chat/completions',
    modelos: ['llama-3.1-70b-versatile','llama-3.1-8b-instant','mixtral-8x7b-32768'],
    headers: (token) =&gt; ({ 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) =&gt; JSON.stringify({ model: modelo, messages: msgs, max_tokens: maxTokens }),
    extrairResposta: (data) =&gt; data.choices[0].message.content
  },
  ollama: {
    url: () =&gt; 'http://localhost:11434/api/chat',
    modelos: ['llama3.1','llama3','mistral','codellama'],
    headers: () =&gt; ({ 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) =&gt; JSON.stringify({ model: modelo, messages: msgs, stream: false }),
    extrairResposta: (data) =&gt; data.message.content
  }
};

function atualizarConfigIA() {
  const provedor = document.getElementById('iaProvedor').value;
  const config = PROVEDORES[provedor];
  const modeloSel = document.getElementById('iaModelo');
  modeloSel.innerHTML = config.modelos.map(m =&gt; `&lt;option value=&quot;${m}&quot;&gt;${m}&lt;/option&gt;`).join('');
}

function salvarConfigIA() {
  const config = {
    provedor: document.getElementById('iaProvedor').value,
    modelo: document.getElementById('iaModelo').value,
    token: document.getElementById('iaToken').value
  };
  localStorage.setItem('analyzer_ia_config', JSON.stringify(config));
  mostrarToast('✅ Configuração salva!', 'success');
}

function carregarConfigIA() {
  const saved = localStorage.getItem('analyzer_ia_config');
  if (!saved) return;
  const config = JSON.parse(saved);
  document.getElementById('iaProvedor').value = config.provedor || 'openai';
  atualizarConfigIA();
  document.getElementById('iaModelo').value = config.modelo || '';
  document.getElementById('iaToken').value = config.token || '';
}

async function testarConexaoIA() {
  const statusEl = document.getElementById('statusIA');
  statusEl.innerHTML = '&lt;span class=&quot;spinner&quot;&gt;&lt;/span&gt; Testando...';
  try {
    const resposta = await chamarIA([{ role: 'user', content: 'OK' }]);
    iaConectada = true;
    statusEl.innerHTML = `&lt;span class=&quot;ok&quot;&gt;✅ Conectado!&lt;/span&gt;`;
    mostrarToast('IA conectada!', 'success');
  } catch (e) {
    iaConectada = false;
    statusEl.innerHTML = `&lt;span class=&quot;bad&quot;&gt;❌ ${e.message}&lt;/span&gt;`;
    mostrarToast('Erro: ' + e.message, 'error');
  }
}

async function chamarIA(mensagens) {
  const provedor = document.getElementById('iaProvedor').value;
  const modelo = document.getElementById('iaModelo').value;
  const token = document.getElementById('iaToken').value;
  const config = PROVEDORES[provedor];

  if (!config) throw new Error('Provedor não configurado');
  if (provedor !== 'ollama' &amp;&amp; !token) throw new Error('Configure sua chave de API');

  const url = typeof config.url === 'function' ? config.url(modelo, token) : config.url;
  const headers = config.headers(token);
  const maxTokens = 4000;
  const body = config.body(modelo, mensagens, maxTokens);

  const response = await fetch(url, { method: 'POST', headers, body });

  if (!response.ok) {
    const errText = await response.text();
    throw new Error(`HTTP ${response.status}`);
  }

  const data = await response.json();
  return config.extrairResposta(data);
}

// CARREGAR PROJETO
// ============================================================
async function carregarProjeto() {
  const input = document.getElementById('arquivoInput');
  if (!input.files || !input.files[0]) {
    mostrarToast('Selecione um arquivo.', 'error');
    return;
  }

  const file = input.files[0];
  const buffer = await file.arrayBuffer();
  const formato = document.getElementById('formatoArquivo').value;

  arquivos = [];
  conteudosTexto = {};

  try {
    if (formato === 'auto' || formato === 'zip') {
      if (file.name.endsWith('.zip')) {
        await processarZIP(buffer);
        return;
      }
    }

    if (formato === 'auto' || formato === 'tar' || formato === 'taz') {
      if (file.name.endsWith('.tar') || file.name.endsWith('.tar.gz') || file.name.endsWith('.tgz')) {
        await processarTAR(buffer);
        return;
      }
    }

    if (formato === 'auto' || formato === 'html') {
      if (file.name.endsWith('.html')) {
        processarHTML(buffer);
        return;
      }
    }

    mostrarToast('Formato não suportado.', 'error');
  } catch (e) {
    mostrarToast('Erro: ' + e.message, 'error');
  }
}

async function processarZIP(buffer) {
  const zip = await JSZip.loadAsync(buffer);
  zip.forEach((path, entry) =&gt; {
    arquivos.push({ nome: path, dir: entry.dir, tamanho: entry._data.uncompressedSize });
  });

  for (const item of arquivos) {
    if (!item.dir &amp;&amp; ehTexto(item.nome) &amp;&amp; item.tamanho &lt; 1000000) {
      try {
        conteudosTexto[item.nome] = await zip.file(item.nome).async('string');
      } catch (e) {
        conteudosTexto[item.nome] = '[ERRO]';
      }
    }
  }

  arquivos.sort((a, b) =&gt; a.nome.localeCompare(b.nome));
  atualizarResumoGeral();
  mostrarToast(`✅ ${arquivos.length} arquivos carregados`, 'success');
}

async function processarTAR(buffer) {
  let dados = new Uint8Array(buffer);

  if (document.getElementById('arquivoInput').files[0].name.endsWith('.gz') ||
      document.getElementById('arquivoInput').files[0].name.endsWith('.tgz')) {
    dados = pako.inflate(dados);
  }

  let offset = 0;

  while (offset &lt; dados.length) {
    const headerBytes = dados.slice(offset, offset + 512);
    if (headerBytes.every(b =&gt; b === 0)) break;

    const nome = new TextDecoder().decode(headerBytes.slice(0, 100)).split('\0')[0];
    const tamanhoStr = new TextDecoder().decode(headerBytes.slice(124, 136)).trim();
    const tamanho = parseInt(tamanhoStr, 8);
    const tipo = String.fromCharCode(headerBytes[156]);

    offset += 512;

    if (nome &amp;&amp; tipo !== '5') {
      arquivos.push({ nome, dir: false, tamanho });

      if (ehTexto(nome) &amp;&amp; tamanho &lt; 1000000) {
        const conteudo = new TextDecoder().decode(dados.slice(offset, offset + tamanho));
        conteudosTexto[nome] = conteudo;
      }
    }

    offset += Math.ceil(tamanho / 512) * 512;
  }

  arquivos.sort((a, b) =&gt; a.nome.localeCompare(b.nome));
  atualizarResumoGeral();
  mostrarToast(`✅ ${arquivos.length} arquivos carregados`, 'success');
}

function processarHTML(buffer) {
  const html = new TextDecoder().decode(buffer);
  const nome = document.getElementById('arquivoInput').files[0].name;

  arquivos.push({ nome, dir: false, tamanho: buffer.byteLength });
  conteudosTexto[nome] = html;

  const scriptRegex = /&lt;script[^&gt;]*&gt;([\s\S]*?)&lt;\/script&gt;/gi;
  const styleRegex = /&lt;style[^&gt;]*&gt;([\s\S]*?)&lt;\/style&gt;/gi;

  let match;
  let contador = 1;

  while ((match = scriptRegex.exec(html)) !== null) {
    const nomeScript = `extracted_script_${contador}.js`;
    arquivos.push({ nome: nomeScript, dir: false, tamanho: match[1].length });
    conteudosTexto[nomeScript] = match[1];
    contador++;
  }

  contador = 1;
  while ((match = styleRegex.exec(html)) !== null) {
    const nomeStyle = `extracted_style_${contador}.css`;
    arquivos.push({ nome: nomeStyle, dir: false, tamanho: match[1].length });
    conteudosTexto[nomeStyle] = match[1];
    contador++;
  }

  atualizarResumoGeral();
  mostrarToast(`✅ HTML processado`, 'success');
}

function ehTexto(nome) {
  const lower = nome.toLowerCase();
  if (lower.endsWith('/')) return false;
  return extensoesTexto.some(ext =&gt; lower.endsWith(ext));
}

function detectarDependencias() {
  let resultado = '=== DEPENDÊNCIAS DETECTADAS ===\n\n';
  let deps = {};

  // Procurar package.json
  const packageJson = Object.entries(conteudosTexto).find(([nome]) =&gt; nome.includes('package.json'));
  if (packageJson) {
    try {
      const pkg = JSON.parse(packageJson[1]);
      resultado += '📦 DEPENDÊNCIAS (package.json):\n';
      if (pkg.dependencies) {
        Object.entries(pkg.dependencies).forEach(([nome, versao]) =&gt; {
          resultado += `  ✅ ${nome}: ${versao}\n`;
          deps[nome] = versao;
        });
      }
      resultado += '\n📦 DEV DEPENDÊNCIAS:\n';
      if (pkg.devDependencies) {
        Object.entries(pkg.devDependencies).forEach(([nome, versao]) =&gt; {
          resultado += `  🔧 ${nome}: ${versao}\n`;
          deps[nome] = versao;
        });
      }
    } catch (e) {
      resultado += '❌ Erro ao parsear package.json\n';
    }
  }

  // Procurar imports
  resultado += '\n📥 IMPORTS DETECTADOS:\n';
  const importRegex = /import\s+.*\s+from\s+['&quot;](.*?)['&quot;]/g;
  const requireRegex = /require\s*\(\s*['&quot;](.*?)['&quot;]\s*\)/g;

  Object.entries(conteudosTexto).forEach(([arquivo, conteudo]) =&gt; {
    let match;
    while ((match = importRegex.exec(conteudo)) !== null) {
      const lib = match[1];
      if (!lib.startsWith('.')) {
        resultado += `  📦 ${lib} (em ${arquivo})\n`;
      }
    }

    while ((match = requireRegex.exec(conteudo)) !== null) {
      const lib = match[1];
      if (!lib.startsWith('.')) {
        resultado += `  📦 ${lib} (em ${arquivo})\n`;
      }
    }
  });

  resultado += `\n=== RESUMO ===\n`;
  resultado += `Total de dependências: ${Object.keys(deps).length}\n`;

  document.getElementById('conteudoDeps').textContent = resultado;
  document.getElementById('resultadoDeps').style.display = 'block';
  memoriaAnalises.push({ tipo: 'deps', data: new Date().toISOString(), conteudo: resultado });
}

function salvarEmMemoria(tipo) {
  let conteudo = '';
  
  if (tipo === 'apis') conteudo = document.getElementById('conteudoAPIs').textContent;
  else if (tipo === 'bugs') conteudo = document.getElementById('conteudoBugs').textContent;
  else if (tipo === 'deps') conteudo = document.getElementById('conteudoDeps').textContent;
  else if (tipo === 'replit') conteudo = document.getElementById('conteudoReplit').textContent;
  else if (tipo === 'funcoes') conteudo = document.getElementById('conteudoFuncoes').textContent;

  if (!conteudo) {
    mostrarToast('Nada para salvar.', 'error');
    return;
  }

  const analise = {
    id: Date.now(),
    tipo: tipo,
    data: new Date().toISOString(),
    conteudo: conteudo
  };

  memoriaAnalises.push(analise);
  salvarMemoriaLocalStorage();
  mostrarToast(`✅ ${tipo.toUpperCase()} salvo em memória!`, 'success');
  renderizarMemoria();
}

function salvarMemoriaLocalStorage() {
  localStorage.setItem('analyzer_memoria', JSON.stringify(memoriaAnalises));
}

function carregarMemoriaLocalStorage() {
  const saved = localStorage.getItem('analyzer_memoria');
  if (saved) {
    memoriaAnalises = JSON.parse(saved);
    renderizarMemoria();
  }
}

function renderizarMemoria() {
  const el = document.getElementById('listaMemoria');
  if (!memoriaAnalises.length) {
    el.innerHTML = '&lt;div class=&quot;small&quot; style=&quot;color:#64748b;&quot;&gt;Nenhuma análise salva.&lt;/div&gt;';
    return;
  }

  el.innerHTML = memoriaAnalises.slice().reverse().map(analise =&gt; `
    &lt;div class=&quot;memoria-item&quot;&gt;
      &lt;div class=&quot;memoria-item-header&quot;&gt;
        &lt;div&gt;
          &lt;div class=&quot;memoria-item-titulo&quot;&gt;📌 ${analise.tipo.toUpperCase()}&lt;/div&gt;
          &lt;div class=&quot;memoria-item-data&quot;&gt;${new Date(analise.data).toLocaleString('pt-BR')}&lt;/div&gt;
        &lt;/div&gt;
        &lt;div style=&quot;display:flex;gap:4px;&quot;&gt;
          &lt;button class=&quot;btn-mini blue&quot; onclick=&quot;copiarMemoria(${analise.id})&quot;&gt;📋&lt;/button&gt;
          &lt;button class=&quot;btn-mini green&quot; onclick=&quot;baixarMemoria(${analise.id})&quot;&gt;⬇️&lt;/button&gt;
          &lt;button class=&quot;btn-mini red&quot; onclick=&quot;excluirMemoria(${analise.id})&quot;&gt;🗑&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;memoria-item-conteudo&quot;&gt;${analise.conteudo.substring(0, 300)}${analise.conteudo.length &gt; 300 ? '...' : ''}&lt;/div&gt;
    &lt;/div&gt;
  `).join('');
}

function copiarMemoria(id) {
  const analise = memoriaAnalises.find(a =&gt; a.id === id);
  if (!analise) return;
  navigator.clipboard.writeText(analise.conteudo).then(() =&gt; mostrarToast('✅ Copiado!', 'success'));
}

function baixarMemoria(id) {
  const analise = memoriaAnalises.find(a =&gt; a.id === id);
  if (!analise) return;
  const blob = new Blob([analise.conteudo], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `analise_${analise.tipo}_${analise.id}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  mostrarToast('⬇️ Download!', 'success');
}

function excluirMemoria(id) {
  if (!confirm('Excluir?')) return;
  memoriaAnalises = memoriaAnalises.filter(a =&gt; a.id !== id);
  salvarMemoriaLocalStorage();
  renderizarMemoria();

// ============================================================
// IA: CORRIGIR PROJETO
// ============================================================
async function corrigirComIA() {
  if (!iaConectada) {
    mostrarToast('Configure a IA primeiro.', 'error');
    return;
  }

  const prompt = document.getElementById('promptCorrigir').value;
  if (!prompt) {
    mostrarToast('Digite um prompt.', 'error');
    return;
  }

  const respEl = document.getElementById('respostaCorrigir');
  respEl.innerHTML = '&lt;div style=&quot;color:#a78bfa;&quot;&gt;&lt;span class=&quot;spinner&quot;&gt;&lt;/span&gt; Gerando correções...&lt;/div&gt;';

  try {
    // Construir contexto
    let ctx = '=== PROJETO ===\n\n';
    Object.entries(conteudosTexto).slice(0, 10).forEach(([nome, conteudo]) =&gt; {
      ctx += `\n--- ${nome} ---\n${conteudo.substring(0, 1000)}\n`;
    });

    const msgs = [
      { role: 'user', content: `${ctx}\n\n${prompt}` }
    ];

    const resposta = await chamarIA(msgs);
    
    const correcao = {
      id: Date.now(),
      data: new Date().toISOString(),
      prompt: prompt,
      resposta: resposta
    };

    correcoesGeradas.push(correcao);
    localStorage.setItem('analyzer_correcoes', JSON.stringify(correcoesGeradas));

    respEl.innerHTML = `
      &lt;div class=&quot;detector-resultado&quot;&gt;
        &lt;div class=&quot;resultado-header&quot;&gt;
          &lt;span class=&quot;resultado-titulo&quot;&gt;✏️ Correções Geradas&lt;/span&gt;
          &lt;div class=&quot;resultado-acoes&quot;&gt;
            &lt;button class=&quot;btn-mini blue&quot; onclick=&quot;copiarCorrecao(${correcao.id})&quot;&gt;📋&lt;/button&gt;
            &lt;button class=&quot;btn-mini green&quot; onclick=&quot;baixarCorrecao(${correcao.id})&quot;&gt;⬇️&lt;/button&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;resultado-texto&quot;&gt;${resposta}&lt;/div&gt;
      &lt;/div&gt;
    `;

    mostrarToast('✅ Correções geradas!', 'success');
    renderizarCorrecoes();
  } catch (e) {
    respEl.innerHTML = `&lt;div class=&quot;bad&quot;&gt;Erro: ${e.message}&lt;/div&gt;`;
    mostrarToast('Erro: ' + e.message, 'error');
  }
}

function renderizarCorrecoes() {
  const saved = localStorage.getItem('analyzer_correcoes');
  if (!saved) return;
  correcoesGeradas = JSON.parse(saved);

  const el = document.getElementById('listaCorrecoes');
  if (!correcoesGeradas.length) {
    el.innerHTML = '&lt;div class=&quot;small&quot; style=&quot;color:#64748b;&quot;&gt;Nenhuma correção.&lt;/div&gt;';
    return;
  }

  el.innerHTML = correcoesGeradas.slice().reverse().map(cor =&gt; `
    &lt;div class=&quot;memoria-item&quot;&gt;
      &lt;div class=&quot;memoria-item-header&quot;&gt;
        &lt;div&gt;
          &lt;div class=&quot;memoria-item-titulo&quot;&gt;✏️ Correção&lt;/div&gt;
          &lt;div class=&quot;memoria-item-data&quot;&gt;${new Date(cor.data).toLocaleString('pt-BR')}&lt;/div&gt;
        &lt;/div&gt;
        &lt;div style=&quot;display:flex;gap:4px;&quot;&gt;
          &lt;button class=&quot;btn-mini blue&quot; onclick=&quot;copiarCorrecao(${cor.id})&quot;&gt;📋&lt;/button&gt;
          &lt;button class=&quot;btn-mini green&quot; onclick=&quot;baixarCorrecao(${cor.id})&quot;&gt;⬇️&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;memoria-item-conteudo&quot;&gt;&lt;strong&gt;Prompt:&lt;/strong&gt; ${cor.prompt.substring(0, 150)}...\n\n&lt;strong&gt;Resposta:&lt;/strong&gt; ${cor.resposta.substring(0, 200)}...&lt;/div&gt;
    &lt;/div&gt;
  `).join('');
}

function copiarCorrecao(id) {
  const cor = correcoesGeradas.find(c =&gt; c.id === id);
  if (!cor) return;
  navigator.clipboard.writeText(cor.resposta).then(() =&gt; mostrarToast('✅ Copiado!', 'success'));
}

function baixarCorrecao(id) {
  const cor = correcoesGeradas.find(c =&gt; c.id === id);
  if (!cor) return;
  const txt = `PROMPT:\n${cor.prompt}\n\n---\n\nRESPOSTA:\n${cor.resposta}`;
  const blob = new Blob([txt], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `correcao_${cor.id}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  mostrarToast('⬇️ Download!', 'success');
}

<script>
function trocarProjeto(index) {
  // Esconde todos
  document.querySelectorAll('.project-container').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  
  // Mostra o selecionado
  document.getElementById('projeto' + index).classList.add('active');
  document.querySelectorAll('.nav-btn')[index].classList.add('active');
  
  // Salva preferência
  localStorage.setItem('ultimo-projeto', index);
}

// Restaura último projeto aberto
window.onload = function() {
  const ultimo = localStorage.getItem('ultimo-projeto');
  if (ultimo !== null) trocarProjeto(parseInt(ultimo));
};
</script>
