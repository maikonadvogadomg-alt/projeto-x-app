══════════════════════════════════════════════════════════════════*/
function toggleWeb() {
  webOn = !webOn;
  localStorage.setItem('cia_web', webOn ? 'on' : 'off');
  document.getElementById('webBtn').classList.toggle('web-on', webOn);
  toast(webOn ? '🌐 Busca web ATIVADA' : 'Busca web desativada');
}

async function webSearch(query) {
  // Usa DuckDuckGo Instant Answer API (CORS-friendly)
  try {
    const url = 'https://api.duckduckgo.com/?q='+encodeURIComponent(query)+'&amp;amp;format=json&amp;amp;no_html=1&amp;amp;skip_disambig=1';
    const r = await fetch(url);
    const j = await r.json();
    const parts = [];
    if (j.AbstractText) parts.push('RESUMO: '+j.AbstractText+(j.AbstractURL?' (Fonte: '+j.AbstractURL+')':''));
    if (j.Answer) parts.push('RESPOSTA: '+j.Answer);
    if (j.Definition) parts.push('DEFINIÇÃO: '+j.Definition);
    if (j.RelatedTopics?.length) {
      const topics = j.RelatedTopics.slice(0,5)
        .filter(t =&amp;gt; t.Text)
        .map((t,i) =&amp;gt; (i+1)+'. '+t.Text+(t.FirstURL?' ['+t.FirstURL+']':''));
      if (topics.length) parts.push('TÓPICOS:\n'+topics.join('\n'));
    }
    return parts.length ? parts.join('\n\n') : null;
  } catch(e) {
    console.warn('Web search falhou:', e);
    return null;
  }
}

/*══════════════════════════════════════════════════════════════════
  ENVIAR
══════════════════════════════════════════════════════════════════*/
function handleKey(e) {
  if (e.key === 'Enter' &amp;amp;&amp;amp; !e.shiftKey) { e.preventDefault(); send(); }
}
function adjustHeight(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 130) + 'px';
}
function setPrompt(txt) {
  const el = document.getElementById('msgInput');
  el.value = txt; adjustHeight(el); el.focus();
}

async function send(textOverride) {
  const el = document.getElementById('msgInput');
  const text = (textOverride || el.value).trim();
  if (!text) return;

  if (window.speechSynthesis) {
    const u = new SpeechSynthesisUtterance(' '); u.volume = 0;
    window.speechSynthesis.speak(u);
  }

  document.getElementById('emptyState')?.remove();
  el.value = ''; el.style.height = '44px';
  localStorage.removeItem('cia_draft');

  history.push({ role:'user', content:text });
  appendMsg('user', text);
  scheduleSave();

  controller = new AbortController();
  document.getElementById('sendBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'flex';

  const { content: contentEl } = appendMsg('bot', '', true);

  // BUSCA WEB se ativada
  let webContext = '';
  if (webOn) {
    const note = document.createElement('div');
    note.className = 'progress';
    note.textContent = '🌐 Buscando na internet...';
    contentEl.appendChild(note);
    const result = await webSearch(text);
    note.remove();
    if (result) {
      webContext = '\n\n[CONTEXTO DA WEB — use estas informações atuais]:\n'+result+'\n[FIM DO CONTEXTO]';
      const ok = document.createElement('div');
      ok.className = 'progress';
      ok.textContent = '✓ Resultados da web incorporados';
      contentEl.appendChild
      contentEl.appendChild(ok);
      setTimeout(() =&amp;gt; ok.remove(), 2000);
    } else {
      const fail = document.createElement('div');
      fail.className = 'progress';
      fail.style.color = '#f87171';
      fail.textContent = '⚠️ Busca web falhou — continuando sem contexto extra';
      contentEl.appendChild(fail);
      setTimeout(() =&amp;gt; fail.remove(), 2500);
    }
  }

  try {
    const key   = apiKey.trim();
    const url   = (document.getElementById('urlInput').value || apiUrl || 'https://api.groq.com/openai/v1').trim().replace(/\/$/, '');
    const model = document.getElementById('modelInput').value || apiModel || 'llama-3.3-70b-versatile';

    if (!key) {
      contentEl.innerHTML = '&amp;lt;span style=&amp;quot;color:#60a5fa&amp;quot;&amp;gt;⚠️ Configure uma chave de API em ⚙️. Groq é gratuito: &amp;lt;a href=&amp;quot;https://console.groq.com&amp;quot; target=&amp;quot;_blank&amp;quot; style=&amp;quot;color:#7ec87a&amp;quot;&amp;gt;console.groq.com&amp;lt;/a&amp;gt;&amp;lt;/span&amp;gt;';
      history.pop();
      scheduleSave();
      return;
    }

    // Monta mensagens (injeta contexto web se houver)
    let msgs = [...history];
    if (webContext) {
      const last = msgs[msgs.length - 1];
      msgs[msgs.length - 1] = { role:'user', content:last.content + webContext };
    }

    const endpoint = url + '/chat/completions';
    const headers = {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + key,
      'HTTP-Referer': location.origin,
      'X-Title': 'Chat IA Pro',
    };
    const body = JSON.stringify({ model, messages: msgs, stream: true, max_tokens: 16384 });

    const resp = await fetch(endpoint, { method:'POST', headers, body, signal: controller.signal });

    if (!resp.ok) {
      const errText = await resp.text();
      let msg = 'Erro ' + resp.status;
      try { msg = JSON.parse(errText)?.error?.message || msg; } catch {}
      contentEl.innerHTML = '&amp;lt;span style=&amp;quot;color:'+getCSSVar('--err')+'&amp;quot;&amp;gt;❌ ' + esc(msg) + '&amp;lt;/span&amp;gt;';
      history.pop();
      scheduleSave();
      return;
    }

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let full = '', buf = '';

    const cursor = document.createElement('span');
    cursor.className = 'cursor-blink';
    contentEl.appendChild(cursor);

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream:true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const j = line.slice(6).trim();
        if (j === '[DONE]') continue;
        try {
          const p = JSON.parse(j);
          if (p.error) throw new Error(typeof p.error === 'string' ? p.error : p.error.message || 'Erro do provedor');
          const delta = p.choices?.[0]?.delta?.content || p.text || p.content || '';
          if (delta) {
            full += delta;
            cursor.remove();
            contentEl.innerHTML = renderMarkdown(full);
            contentEl.appendChild(cursor);
            scrollBottom();
          }
        } catch(e) { if (e instanceof SyntaxError) continue; throw e; }
      }
    }

    cursor.remove();
    if (full) {
      contentEl.innerHTML = renderMarkdown(full);
      history.push({ role:'assistant', content:full });
      scheduleSave();
      if (ttsOn) speakText(full);
    }

  } catch (err) {
    if (err.name === 'AbortError') {
      contentEl.innerHTML += '&amp;lt;em style=&amp;quot;color:var(--muted);font-size:11px&amp;quot;&amp;gt; [parado]&amp;lt;/em&amp;gt;';
    } else {
      contentEl.innerHTML = '&amp;lt;span style=&amp;quot;color:var(--err)&amp;quot;&amp;gt;❌ ' + esc(err.message) + '&amp;lt;/span&amp;gt;';
      history.pop();
      scheduleSave();
    }
  } finally {
    controller = null;
    document.getElementById('sendBtn').style.display = 'flex';
    document.getElementById('stopBtn').style.display = 'none';
    scrollBottom();
    addCopyListeners();
  }
}

function abortStream() { controller?.abort(); }

/*══════════════════════════════════════════════════════════════════
  RENDERIZAÇÃO
══════════════════════════════════════════════════════════════════*/
function appendMsg(role, text, streaming, isRestore) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  const content = document.createElement('div');
  content.className = 'msg-content';

  if (role === 'user') {
    content.textContent = text;
  } else if (streaming) {
    content.innerHTML = '';
  } else {
    content.innerHTML = renderMarkdown(text);
  }

  bubble.appendChild(content);
  wrap.appendChild(bubble);

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  if (role === 'bot') {
    const prov = apiKey ? (detectProvider(apiKey)?.name || 'IA') : 'IA';
    const btn = document.createElement('button');
    btn.innerHTML = '📋 Copiar';
    btn.onclick = function() { copyText(this, content.textContent); };
    const lbl = document.createElement('span');
    lbl.className = 'prov-label';
    lbl.textContent = prov;
    meta.appendChild(lbl);
    meta.appendChild(btn);
  } else {
    const btn = document.createElement('button');
    btn.innerHTML = '📋 Copiar';
    btn.onclick = function() { copyText(this, text); };
    meta.appendChild(btn);
  }
  wrap.appendChild(meta);

  document.getElementById('chat').appendChild(wrap);
  if (!isRestore) scrollBottom();
  return { el: wrap, content };
}

let copyBlockId = 0;
function renderMarkdown(text) {
  let html = esc(text);
  html = html.replace(/```(\w*?)\n([\s\S]*?)```/g, function(_, lang, code) {
    const id = 'cb' + (++copyBlockId);
    return (
      '&amp;lt;div class=&amp;quot;code-block&amp;quot;&amp;gt;' +
        '&amp;lt;div class=&amp;quot;code-header&amp;quot;&amp;gt;' +
          '&amp;lt;span&amp;gt;' + (lang || 'código') + '&amp;lt;/span&amp;gt;' +
          '&amp;lt;button class=&amp;quot;copy-btn&amp;quot; data-copy=&amp;quot;'+escAttr(code)+'&amp;quot; id=&amp;quot;'+id+'&amp;quot;&amp;gt;📋 Copiar&amp;lt;/button&amp;gt;' +
        '&amp;lt;/div&amp;gt;' +
        '&amp;lt;div class=&amp;quot;code-body&amp;quot;&amp;gt;' + code + '&amp;lt;/div&amp;gt;' +
      '&amp;lt;/div&amp;gt;'
    );
  });
  html = html.replace(/`([^`\n]+?)`/g, '&amp;lt;span class=&amp;quot;inline-code&amp;quot;&amp;gt;$1&amp;lt;/span&amp;gt;');
  html = html.replace(/\*\*([^*]+?)\*\*/g, '&amp;lt;strong&amp;gt;$1&amp;lt;/strong&amp;gt;');
  html = html.replace(/\*([^*]+?)\*/g, '&amp;lt;em&amp;gt;$1&amp;lt;/em&amp;gt;');
  html = html.replace(/(https?:\/\/[^\s&amp;lt;&amp;gt;&amp;quot;']+)/g, '&amp;lt;a href=&amp;quot;$1&amp;quot; target=&amp;quot;_blank&amp;quot; rel=&amp;quot;noopener&amp;quot;&amp;gt;$1&amp;lt;/a&amp;gt;');
  html = html.replace(/\n/g, '&amp;lt;br&amp;gt;');
  return html;
}

function addCopyListeners() {
  document.querySelectorAll('.copy-btn[data-copy]').forEach(btn =&amp;gt; {
    if (btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.onclick = function() { copyText(this, this.dataset.copy); };
  });
}

function copyText(btn, text) {
  navigator.clipboard.writeText(text || '').catch(() =&amp;gt; {});
  const orig = btn.innerHTML;
  btn.innerHTML = '✓ Copiado!';
  setTimeout(() =&amp;gt; { btn.innerHTML = orig; }, 1800);
}

function scrollBottom() {
  const c = document.getElementById('chat');
  c.scrollTop = c.scrollHeight;
}

/*══════════════════════════════════════════════════════════════════
  EXPORTAR — TXT, MD, JSON, PDF
══════════════════════════════════════════════════════════════════*/
function exportConv(format) {
  if (!history.length) { toast('Nada para exportar','err'); return; }
  const date = new Date().toLocaleString('pt-BR');
  let content = '', mime = 'text/plain', ext = format;

  if (format === 'txt') {
    const lines = ['=== CONVERSA — Chat IA Pro ===', 'Data: '+date, ''];
    history.forEach(m =&amp;gt; {
      lines.push('['+(m.role==='user'?'VOCÊ':'IA')+']');
      lines.push(m.content); lines.push('');
    });
    content = lines.join('\n');
  }
  else if (format === 'md') {
    const lines = ['# Conversa Chat IA Pro', '&amp;gt; '+date, ''];
    history.forEach(m =&amp;gt; {
      lines.push('### '+(m.role==='user'?'🧑 Você':'🤖 IA'));
      lines.push(''); lines.push(m.content); lines.push('');
    });
    content = lines.join('\n');
    mime = 'text/markdown';
  }
  else if (format === 'json') {
    content = JSON.stringify({
      title: history.find(m=&amp;gt;m.role==='user')?.content?.slice(0,60) || 'Conversa',
      exportedAt: date,
      provider: apiKey ? (detectProvider(apiKey)?.name || 'Custom') : 'Demo',
      messages: history,
    }, null, 2);
    mime = 'application/json';
  }
  else if (format === 'pdf') {
    // PDF via janela de impressão
    const w = window.open('', '_blank');
    const html = ['&amp;lt;!DOCTYPE html&amp;gt;&amp;lt;html&amp;gt;&amp;lt;head&amp;gt;&amp;lt;meta charset=&amp;quot;UTF-8&amp;quot;&amp;gt;&amp;lt;title&amp;gt;Conversa&amp;lt;/title&amp;gt;',
      '&amp;lt;style&amp;gt;',
      'body{font-family:Georgia,serif;max-width:780px;margin:30px auto;padding:0 20px;color:#222;line-height:1.6}',
      'h1{color:#2d4a1e;border-bottom:2px solid #5aab56;padding-bottom:8px}',
      '.meta{color:#666;font-size:12px;margin-bottom:20px}',
      '.msg{margin:16px 0;padding:12px 16px;border-radius:8px;page-break-inside:avoid}',
      '.user{background:#e8f5e9;border-left:4px solid #5aab56}',
      '.bot{background:#f5f5f5;border-left:4px solid #888}',
      '.role{font-weight:bold;font-size:11px;text-transform:uppercase;color:#555;margin-bottom:4px}',
      'pre{background:#0d1309;color:#a8d5a2;padding:10px;border-radius:6px;overflow-x:auto;font-size:12px}',
      'code{background:#eee;padding:1px 4px;border-radius:3px;font-size:12px}',
      '@media print { body{margin:0} }',
      '&amp;lt;/style&amp;gt;&amp;lt;/head&amp;gt;&amp;lt;body&amp;gt;',
      '&amp;lt;h1&amp;gt;Conversa — Chat IA Pro&amp;lt;/h1&amp;gt;',
      '&amp;lt;div class=&amp;quot;meta&amp;quot;&amp;gt;Exportado em '+date+' · '+history.length+' mensagens&amp;lt;/div&amp;gt;'];
    history.forEach(m =&amp;gt; {
      const safe = esc(m.content).replace(/\n/g,'&amp;lt;br&amp;gt;');
      html.push('&amp;lt;div class=&amp;quot;msg '+(m.role==='user'?'user':'bot')+'&amp;quot;&amp;gt;');
      html.push('&amp;lt;div class=&amp;quot;role&amp;quot;&amp;gt;'+(m.role==='user'?'🧑 Você':'🤖 IA')+'&amp;lt;/div&amp;gt;');
      html.push('&amp;lt;div&amp;gt;'+safe+'&amp;lt;/div&amp;gt;&amp;lt;/div&amp;gt;');
    });
    html.push('&amp;lt;script&amp;gt;window.onload=()=&amp;gt;setTimeout(()=&amp;gt;window.print(),300)&amp;lt;\/script&amp;gt;&amp;lt;/body&amp;gt;&amp;lt;/html&amp;gt;');
    w.document.write(html.join(''));
    w.document.close();
    toast('PDF: use &amp;quot;Salvar como PDF&amp;quot; na impressão');
    return;
  }

  const blob = new Blob([content], { type: mime+';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'conversa-' + Date.now() + '.' + ext;
  a.click();
  toast('Exportado: ' + ext.toUpperCase());
}

/*══════════════════════════════════════════════════════════════════
  IMPORTAR — TXT, MD, CSV, JSON, PDF
══════════════════════════════════════════════════════════════════*/
async function importFile(e) {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!file) return;

  const name = file.name.toLowerCase();
  const el = document.getElementById('msgInput');

  try {
    let txt = '';

    if (name.endsWith('.pdf')) {
      toast('📕 Lendo PDF...');
      txt = await extractPDF(file);
    }
    else if (name.endsWith('.json')) {
      const raw = await file.text();
      try {
        const j = JSON.parse(raw);
        // Se for conversa exportada, oferecer importar
        if (j.messages &amp;amp;&amp;amp; Array.isArray(j.messages)) {
          if (confirm('Este JSON é uma conversa exportada. Restaurar como nova conversa?')) {
            history = j.messages;
            currentConvId = null;
            restoreUI();
            scheduleSave();
            togglePanel('ioPanel','ioBtn');
            toast('Conversa importada ✓');
            return;
          }
        }
        txt = JSON.stringify(j, null, 2);
      } catch { txt = raw; }
    }
    else {
      txt = await file.text();
    }

    if (txt) {
      el.value = el.value ? el.value + '\n\n' + txt : txt;
      adjustHeight(el);
      autoSaveDraft();
      togglePanel('ioPanel','ioBtn');
      toast('Arquivo importado ('+txt.length+' chars)');
    }
  } catch(err) {
    toast('Erro: '+err.message, 'err');
  }
}

async function extractPDF(file) {
  if (typeof pdfjsLib === 'undefined') throw new Error('PDF.js não carregou');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const pages = [];
  for (let i = 1; i &amp;lt;= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    pages.push('--- Página '+i+' ---\n' + tc.items.map(it =&amp;gt; it.str).join(' '));
  }
  return pages.join('\n\n');
}

/*══════════════════════════════════════════════════════════════════
  OCR — Imagem para texto
══════════════════════════════════════════════════════════════════*/
async function importImage(e) {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!file) return;

  if (typeof Tesseract === 'undefined') { toast('Tesseract não carregou','err'); return; }

  const el = document.getElementById('msgInput');
  const progress = document.createElement('div');
  progress.className = 'progress';
  progress.style.position = 'fixed';
  progress.style.top = '60px';
  progress.style.left = '50%';
  progress.style.transform = 'translateX(-50%)';
  progress.style.zIndex = '1000';
  progress.textContent = '🔍 OCR iniciando...';
  document.body.appendChild(progress);

  try {
    const { data } = await Tesseract.recognize(file, 'por+eng', {
      logger: m =&amp;gt; {
        if (m.status === 'recognizing text') {
          progress.textContent = '🔍 OCR: ' + Math.round(m.progress*100) + '%';
        } else if (m.status) {
          progress.textContent = '🔍 ' + m.status + '...';
        }
      }
    });
    const txt = (data?.text || '').trim();
    if (txt) {
      el.value = el.value ? el.value + '\n\n[OCR]\n' + txt : '[OCR]\n' + txt;
      adjustHeight(el);
      autoSaveDraft();
      togglePanel('ioPanel','ioBtn');
      toast('OCR concluído ('+txt.length+' chars)');
    } else {
      toast('Nenhum texto encontrado na imagem','err');
    }
  } catch(err) {
    toast('Erro OCR: '+err.message,'err');
  } finally {
    progress.remove();
  }
}

/*══════════════════════════════════════════════════════════════════
  BACKUP COMPLETO
══════════════════════════════════════════════════════════════════*/
async function backupAll() {
  const convs = db ? await dbGetAll('conversations') : [];
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    keys: savedKeys,
    conversations: convs,
    settings: {
      apiKey, apiUrl, apiModel,
      ttsOn, webOn,
    }
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'chatia-backup-' + Date.now() + '.json';
  a.click();
  toast('Backup completo gerado ✓');
}

async function restoreBackup(e) {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!file) return;
  if (!confirm('Restaurar backup? Suas chaves e conversas atuais serão MESCLADAS.')) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.keys?.length) {
      const existing = new Set(savedKeys.map(k =&amp;gt; k.key));
      data.keys.forEach(k =&amp;gt; { if (!existing.has(k.key)) savedKeys.push(k); });
      localStorage.setItem('cia_saved', JSON.stringify(savedKeys));
    }
    if (data.conversations?.length &amp;amp;&amp;amp; db) {
      for (const c of data.conversations) await dbPut('conversations', c);
    }
    renderSavedKeys();
    await renderConvList();
    toast('Backup restaurado ✓');
  } catch(err) {
    toast('Erro: backup inválido','err');
  }
}

/*══════════════════════════════════════════════════════════════════
  VOZ — STT
══════════════════════════════════════════════════════════════════*/
function toggleVoice() {
  if (isRecording) { stopVoice(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Use Chrome ou Edge para voz','err'); return; }

  recog = new SR();
  recog.lang = 'pt-BR';
  recog.continuous = true;
  recog.interimResults = true;

  let fullText = '';
  const schedSend = () =&amp;gt; {
    clearTimeout(silTimer);
    silTimer = setTimeout(() =&amp;gt; {
      try { recog.stop(); } catch {}
      if (fullText.trim()) { setPrompt(''); send(fullText.trim()); }
    }, 1800);
  };

  recog.onresult = ev =&amp;gt; {
    let final = '', interim = '';
    for (let i = 0; i &amp;lt; ev.results.length; i++) {
      if (ev.results[i].isFinal) final += ev.results[i][0].transcript;
      else interim += ev.results[i][0].transcript;
    }
    fullText = final || interim;
    document.getElementById('msgInput').value = fullText;
    adjustHeight(document.getElementById('msgInput'));
    if (fullText) schedSend();
  };

  recog.onerror = recog.onend = () =&amp;gt; {
    clearTimeout(silTimer);
    isRecording = false;
    recog = null;
    document.getElementById('micBtn').classList.remove('listening');
  };

  try { recog.start(); } catch { return; }
  isRecording = true;
  document.getElementById('micBtn').classList.add('listening');
}

function stopVoice() {
  try { recog?.stop(); } catch {}
  recog = null;
  isRecording = false;
  clearTimeout(silTimer);
  document.getElementById('micBtn').classList.remove('listening');
}

/*══════════════════════════════════════════════════════════════════
  TTS
══════════════════════════════════════════════════════════════════*/
function toggleTTS() {
  ttsOn = !ttsOn;
  localStorage.setItem('cia_tts', ttsOn ? 'on' : 'off');
  document.getElementById('ttsBtn').style.opacity = ttsOn ? '1' : '0.4';
  if (!ttsOn) window.speechSynthesis?.cancel();
}

function speakText(text) {
  if (!ttsOn || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/&amp;lt;[^&amp;gt;]+&amp;gt;/g, '').replace(/[`*#]/g, '').substring(0, 800);
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'pt-BR';
  window.speechSynthesis.speak(u);
}

function esc(s) {
  return String(s)
    .replace(/&amp;amp;/g,'&amp;amp;amp;').replace(/&amp;lt;/g,'&amp;amp;lt;')
    .replace(/&amp;gt;/g,'&amp;amp;gt;').replace(/&amp;quot;/g,'&amp;amp;quot;');
}
function escAttr(s) { return esc(s).replace(/'/g,'&amp;amp;#39;'); }
function getCSSVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

let toastTimer;
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', type === 'err');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() =&amp;gt; t.classList.remove('show'), 2500);
}

    async function importZip() {
      const input = document.getElementById('zipFile');

        return;
      }
      
      const { unzip } = await import('https://cdn.jsdelivr.net/npm/fflate@0.8.0/+esm');
      const arrayBuffer = await file.arrayBuffer();
      const unzipped = unzip(new Uint8Array(arrayBuffer));
      
      for (const [path, data] of Object.entries(unzipped)) {
        if (path.endsWith('.md')) {
          const text = new TextDecoder().decode(data);
          const name = path.split('/').pop().replace('.md', '');
          files.push(name);
          fileContents[name] = text;
        }
      }
      
      updateFileList();
      input.value = '';
    }

    function updateFileList() {
      const list = document.getElementById('fileList');

        orderItem.innerHTML = `&lt;span&gt;${index + 1}. ${name}&lt;/span&gt;`;

        orderItem.ondrop = (e) =&gt; {
          e.preventDefault();
          const draggedIndex = parseInt(e.dataTransfer.getData('text'));
          const targetIndex = files.indexOf(name);
          [files[draggedIndex], files[targetIndex]] = [files[targetIndex], files[draggedIndex]];
          updateFileList();
        };
        orderItem.ondragover = (e) =&gt; e.preventDefault();
        order.appendChild(orderItem);
      });

      &lt;button onclick=&amp;quot;downloadMarkdown()&amp;quot;&gt;⬇️ Baixar Markdown&lt;/button&gt;
      &lt;button onclick=&amp;quot;copyToClipboard()&amp;quot;&gt;📋 Copiar para Clipboard&lt;/button&gt;
      &lt;button onclick=&amp;quot;clearAll()&amp;quot;&gt;🗑️ Limpar Tudo&lt;/button&gt;
    &lt;/div&gt;
    
    &lt;div class=&amp;quot;section&amp;quot;&gt;
      &lt;h2&gt;4️⃣ Resultado&lt;/h2&gt;
      &lt;div id=&amp;quot;output&amp;quot;&gt;&lt;/div&gt;
    &lt;/div&gt;

  &lt;script&gt;
    let jsonData = null;
    let markdownOutput = '';

    async function importJson() {
      const input = document.getElementById('jsonFile');
      const file = input.files[0];
      
      if (!file) {
        alert('Selecione um arquivo JSON!');
        return;
      }
      
      const text = await file.text();
      try {
        jsonData = JSON.parse(text);
        alert('✅ JSON importado com sucesso!');
      } catch (e) {
        alert('❌ Erro ao parsear JSON: ' + e.message);
      }
    }

    function convertToMarkdown() {
      if (!jsonData) {
        alert('Importe um JSON primeiro!');
        return;
      }
      
      const type = document.getElementById('jsonType').value;
      const titleLevel = parseInt(document.getElementById('titleLevel').value);
      const includeKeys = document.getElementById('includeKeys').value === 'yes';
      
      let markdown = '';
      
      if (type === 'array') {
        markdown = convertArray(jsonData, titleLevel, includeKeys);
      } else if (type === 'object') {
        markdown = convertObject(jsonData, titleLevel, includeKeys);
      } else if (type === 'nested') {
        markdown = convertNested(jsonData, titleLevel, includeKeys);
      }
      
      markdownOutput = markdown;
      document.getElementById('output').textContent = markdown;
    }

    function convertArray(arr, titleLevel, includeKeys) {
      let md = '';
      arr.forEach((item, index) =&gt; {
        md += `${'#'.repeat(titleLevel)} Item ${index + 1}\n\n`;
        md += convertObject(item, titleLevel + 1, includeKeys);
        md += '\n\n';
      });
      return md;
    }

    function convertObject(obj, titleLevel, includeKeys) {
      let md = '';
      for (const [key, value] of Object.entries(obj)) {
        if (includeKeys) {
          md += `${'#'.repeat(titleLevel)} ${key}\n\n`;
        }
        
        if (typeof value === 'object' &amp;amp;&amp;amp; value !== null) {
          if (Array.isArray(value)) {
            md += convertArray(value, titleLevel + 1, includeKeys);
          } else {
            md += convertObject(value, titleLevel + 1, includeKeys);
          }
        } else {
          md += `${value}\n\n`;
        }
      }
      return md;
    }

    function convertNested(obj, titleLevel, includeKeys) {
      let md = '';
      
      function traverse(current, level) {
        for (const [key, value] of Object.entries(current)) {
          md += `${'#'.repeat(level)} ${key}\n\n`;
          
          if (typeof value === 'object' &amp;amp;&amp;amp; value !== null) {
            if (Array.isArray(value)) {
              value.forEach((item, idx) =&gt; {
                md += `- Item ${idx + 1}: ${JSON.stringify(item)}\n`;
              });
            } else {
              traverse(value, level + 1);
            }
          } else {
            md += `${value}\n\n`;
          }
        }
      }
      
      traverse(obj, titleLevel);
      return md;
    }

    function downloadMarkdown() {
      if (!markdownOutput) {
        alert('Converta o JSON primeiro!');
        return;
      }
      
      const blob = new Blob([markdownOutput], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'documento-convertido.md';
      a.click();
      URL.revokeObjectURL(url);
    }

    function copyToClipboard() {
      if (!markdownOutput) {
        alert('Converta o JSON primeiro!');
        return;
      }
      navigator.clipboard.writeText(markdownOutput).then(() =&gt; {
        alert('✅ Copiado para clipboard!');
      });
    }

    function clearAll() {
      if (confirm('Tem certeza? Vai limpar tudo!')) {
        jsonData = null;
        markdownOutput = '';
        document.getElementById('output').textContent = '';
        document.getElementById('jsonFile').value = '';
      }
    }
  &lt;/script&gt;

  &lt;script&gt;
    let htmlContent = '';
    let references = [];

    function convertMarkdownToHtml() {
      const markdown = document.getElementById('markdownInput').value;
      
      // Simples conversão Markdown → HTML
      let html = markdown
        .replace(/^### (.*?)$/gm, '&lt;h3&gt;$1&lt;/h3&gt;')
        .replace(/^## (.*?)$/gm, '&lt;h2&gt;$1&lt;/h2&gt;')
        .replace(/^# (.*?)$/gm, '&lt;h1&gt;$1&lt;/h1&gt;')
        .replace(/\*\*(.*?)\*\*/g, '&lt;strong&gt;$1&lt;/strong&gt;')
        .replace(/\*(.*?)\*/g, '&lt;em&gt;$1&lt;/em&gt;')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '&lt;a href=&amp;quot;$2&amp;quot;&gt;$1&lt;/a&gt;')
        .replace(/^- (.*?)$/gm, '&lt;li&gt;$1&lt;/li&gt;')
        .replace(/(&lt;li&gt;.*?&lt;\/li&gt;)/s, '&lt;ul&gt;$1&lt;/ul&gt;')
        .replace(/\n\n/g, '&lt;/p&gt;&lt;p&gt;')
        .replace(/^/gm, '&lt;p&gt;')
        .replace(/$/gm, '&lt;/p&gt;')
        .replace(/&lt;p&gt;&lt;\/p&gt;/g, '');
      
      // Extrai referências
      extractReferences(markdown);
      
      // Adiciona IDs aos títulos
      html = html.replace(/&lt;h([1-6])&gt;(.*?)&lt;\/h\1&gt;/g, (match, level, text) =&gt; {
        const id = text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        return `&lt;h${level} id=&amp;quot;${id}&amp;quot;&gt;${text}&lt;/h${level}&gt;`;
      });
      
      htmlContent = html;
      document.getElementById('htmlPreview').innerHTML = html;
      updateReferences();
    }

    function extractReferences(markdown) {
      references = [];
      const lines = markdown.split('\n');
      
      lines.forEach((line, index) =&gt; {
        if (line.match(/^#+\s/)) {
          const level = line.match(/^#+/)[0].length;
          const text = line.replace(/^#+\s/, '').trim();
          const id = text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
          references.push({ level, text, id, line: index + 1 });
        }
      });
    }

    function updateReferences() {
      const list = document.getElementById('referenceList');
      list.innerHTML = '';
      
      references.forEach(ref =&gt; {
        const item = document.createElement('div');
        item.className = 'reference-item';
        item.style.marginLeft = (ref.level - 1) * 20 + 'px';
        item.innerHTML = `
          &lt;strong&gt;#${ref.line}&lt;/strong&gt; - ${ref.text}
          &lt;div style=&amp;quot;margin-top: 5px;&amp;quot;&gt;
            &lt;button class=&amp;quot;copy-btn&amp;quot; onclick=&amp;quot;copyReference('${ref.id}')&amp;quot;&gt;📋 ID&lt;/button&gt;
            &lt;button class=&amp;quot;copy-btn&amp;quot; onclick=&amp;quot;copyReference('${ref.text}')&amp;quot;&gt;📋 Texto&lt;/button&gt;
            &lt;button class=&amp;quot;copy-btn&amp;quot; onclick=&amp;quot;copyReference('#${ref.id}')&amp;quot;&gt;🔗 Link&lt;/button&gt;
          &lt;/div&gt;
        `;
        list.appendChild(item);
      });
    }

    function copyReference(text) {
      navigator.clipboard.writeText(text).then(() =&gt; {
        alert('✅ Copiado: ' + text);
      });
    }

    function copyAllReferences() {
      const refs = references.map(r =&gt; `[${r.text}](#${r.id})`).join('\n');
      navigator.clipboard.writeText(refs).then(() =&gt; {
        alert('✅ Todas as referências copiadas!');
      });
    }

    function downloadHtml() {
      const fullHtml = `&lt;!DOCTYPE html&gt;
&lt;html lang=&amp;quot;pt-BR&amp;quot;&gt;
&lt;head&gt;
  &lt;meta charset=&amp;quot;UTF-8&amp;quot;/&gt;

  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
${htmlContent}
&lt;/body&gt;
&lt;/html&gt;`;
      
      const blob = new Blob([fullHtml], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'documento.html';
      a.click();
      URL.revokeObjectURL(url);
    }

    function copyHtmlToClipboard() {
      navigator.clipboard.writeText(htmlContent).then(() =&gt; {
        alert('✅ HTML copiado para clipboard!');
      });
    }

      document.getElementById('markdownInput').value = `# Título Principal

## Seção 1

Conteúdo da seção 2.

- Item 1

      convertMarkdownToHtml();
    }

  &lt;script&gt;
    let plans = [];
    let currentPlan = null;

    function createPlan() {
      const name = document.getElementById('planName').value;
      const description = document.getElementById('planDescription').value;
      const sections = document.getElementById('planSections').value.split(',').map(s =&gt; s.trim());
      
      if (!name) {
        alert('Digite um nome para o plano!');
        return;
      }
      
      currentPlan = {
        name,
        description,
        sections: sections.map(s =&gt; ({ name: s, points: [] })),
        createdAt: new Date().toLocaleString('pt-BR')
      };
      
      plans.push(currentPlan);
      updateUI();
      clearForm();
    }

    function addPoint() {
      if (!currentPlan) {
        alert('Crie um plano primeiro!');
        return;
      }
      
      const sectionName = document.getElementById('sectionSelect').value;
      const title = document.getElementById('pointTitle').value;
      const content = document.getElementById('pointContent').value;
      
      if (!title) {
        alert('Digite um título!');
        return;
      }
      
      const section = currentPlan.sections.find(s =&gt; s.name === sectionName);
      if (section) {
        section.points.push({
          title,
          content,
          id: title.toLowerCase().replace(/[^a-z0-9]+/g, '-')
        });
      }
      
      updateUI();
      clearForm();
    }

    function updateUI() {
      const sectionSelect = document.getElementById('sectionSelect');
      sectionSelect.innerHTML = '';
      
      if (currentPlan) {
        currentPlan.sections.forEach(section =&gt; {
          const option = document.createElement('option');
          option.value = section.name;
          option.textContent = section.name;
          sectionSelect.appendChild(option);
        });
      }
      
      updatePlansList();
    }

    function updatePlansList() {
      const list = document.getElementById('plansList');
      list.innerHTML = '';
      
      plans.forEach((plan, planIndex) =&gt; {
        const planDiv = document.createElement('div');
        planDiv.className = 'plan-item';
        planDiv.innerHTML = `
          &lt;h3&gt;${plan.name}&lt;/h3&gt;
          &lt;p&gt;${plan.description}&lt;/p&gt;
          &lt;p style=&amp;quot;color: #666; font-size: 12px;&amp;quot;&gt;Criado em: ${plan.createdAt}&lt;/p&gt;
          &lt;div style=&amp;quot;margin-top: 10px;&amp;quot;&gt;
            ${plan.sections.map(section =&gt; `
              &lt;div style=&amp;quot;margin-left: 20px; margin-top: 10px;&amp;quot;&gt;
                &lt;strong&gt;${section.name}&lt;/strong&gt; (${section.points.length} pontos)
                ${section.points.map(point =&gt; `
                  &lt;div style=&amp;quot;margin-left: 20px; margin-top: 5px; font-size: 12px;&amp;quot;&gt;
                    • ${point.title}
                  &lt;/div&gt;
                `).join('')}
              &lt;/div&gt;
            `).join('')}
          &lt;/div&gt;
          &lt;button onclick=&amp;quot;selectPlan(${planIndex})&amp;quot; style=&amp;quot;background: #0066ff; margin-top: 10px;&amp;quot;&gt;✏️ Editar&lt;/button&gt;
          &lt;button onclick=&amp;quot;deletePlan(${planIndex})&amp;quot; style=&amp;quot;background: #ff4444;&amp;quot;&gt;🗑️ Deletar&lt;/button&gt;
        `;
        list.appendChild(planDiv);
      });
    }

    function selectPlan(index) {
      currentPlan = plans[index];
      updateUI();
    }

    function deletePlan(index) {
      if (confirm('Tem certeza?')) {
        plans.splice(index, 1);
        if (currentPlan === plans[index]) currentPlan = null;
        updateUI();
      }
    }

    function generateMarkdown() {
      let markdown = '';
      
      plans.forEach(plan =&gt; {
        markdown += `# ${plan.name}\n\n`;
        markdown += `${plan.description}\n\n`;
        markdown += `*Criado em: ${plan.createdAt}*\n\n`;
        
        plan.sections.forEach(section =&gt; {
          markdown += `## ${section.name}\n\n`;
          section.points.forEach(point =&gt; {
            markdown += `### ${point.title}\n\n`;
            markdown += `${point.content}\n\n`;
          });
        });
      });
      
      document.getElementById('output').value = markdown;
    }

    function generateJson() {
      document.getElementById('output').value = JSON.stringify(plans, null, 2);
    }

    function downloadPlans() {
      const markdown = generateMarkdownContent();
      const blob = new Blob([markdown], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'planos.md';
      a.click();
      URL.revokeObjectURL(url);
    }

    function generateMarkdownContent() {
      let markdown = '';
      plans.forEach(plan =&gt; {
        markdown += `# ${plan.name}\n\n${plan.description}\n\n`;
        plan.sections.forEach(section =&gt; {
          markdown += `## ${section.name}\n\n`;
          section.points.forEach(point =&gt; {
            markdown += `### ${point.title}\n\n${point.content}\n\n`;
          });
        });
      });
      return markdown;
    }

    function copyOutput() {
      const output = document.getElementById('output').value;
      navigator.clipboard.writeText(output).then(() =&gt; {
        alert('✅ Copiado!');
      });
    }

    function clearForm() {
      document.getElementById('planName').value = '';
      document.getElementById('planDescription').value = '';
      document.getElementById('planSections').value = '';
      document.getElementById('pointTitle').value = '';
      document.getElementById('pointContent').value = '';
    }

    function clearPlans() {
      if (confirm('Tem certeza? Vai deletar TUDO!')) {
        plans = [];
        currentPlan = null;
        updateUI();
      }
    }
  &lt;/script&gt;

    &lt;div id=&amp;quot;emptyState&amp;quot;&gt;

        Perfeito pra trazer documentação de projetos pra conversar com a IA.

          Suporta: .md, .markdown, .mdx, .txt
        &lt;/div&gt;

&lt;script&gt;
'use strict';

let rawMarkdown = '';
let currentFileName = '';
let searchHits = [];
let searchIdx = 0;

/*══════════════════════════════════════════════════════════════════
  CONFIG MARKED
══════════════════════════════════════════════════════════════════*/
marked.setOptions({
  breaks: true,
  gfm: true,
  headerIds: true,
  mangle: false,
});

// Renderer customizado pra blocos de código
const renderer = new marked.Renderer();
renderer.code = function(code, lang) {
  const language = (lang || '').toLowerCase().trim() || 'texto';
  let highlighted = escapeHTML(code);
  try {
    if (lang &amp;amp;&amp;amp; hljs.getLanguage(lang)) {
      highlighted = hljs.highlight(code, { language: lang }).value;
    } else {
      highlighted = hljs.highlightAuto(code).value;
    }
  } catch(e) { /* fallback pra escape */ }

  const safeCode = escapeAttr(code);
  return (
    '&lt;div class=&amp;quot;code-wrap&amp;quot;&gt;'+
      '&lt;div class=&amp;quot;code-head&amp;quot;&gt;'+
        '&lt;span class=&amp;quot;code-lang&amp;quot;&gt;'+language+'&lt;/span&gt;'+
        '&lt;button class=&amp;quot;code-copy&amp;quot; data-code=&amp;quot;'+safeCode+'&amp;quot;&gt;📋 Copiar código&lt;/button&gt;'+
      '&lt;/div&gt;'+
      '&lt;pre&gt;&lt;code class=&amp;quot;hljs language-'+language+'&amp;quot;&gt;'+highlighted+'&lt;/code&gt;&lt;/pre&gt;'+
    '&lt;/div&gt;'
  );
};

// Headings com botões de copiar seção
renderer.heading = function(text, level, raw) {
  const slug = slugify(raw);
  return (
    '&lt;h'+level+' id=&amp;quot;'+slug+'&amp;quot; data-heading=&amp;quot;'+level+'&amp;quot; data-raw=&amp;quot;'+escapeAttr(raw)+'&amp;quot;&gt;'+
      text+
      '&lt;span class=&amp;quot;section-copy&amp;quot;&gt;'+
        '&lt;button onclick=&amp;quot;copySection(\''+slug+'\')&amp;quot; title=&amp;quot;Copiar essa seção inteira&amp;quot;&gt;📋 Seção&lt;/button&gt;'+
        '&lt;button onclick=&amp;quot;copySectionMD(\''+slug+'\')&amp;quot; title=&amp;quot;Copiar a seção em Markdown&amp;quot;&gt;📝 MD&lt;/button&gt;'+
      '&lt;/span&gt;'+
    '&lt;/h'+level+'&gt;'
  );
};

marked.use({ renderer });

/*══════════════════════════════════════════════════════════════════
  CARREGAR ARQUIVO
══════════════════════════════════════════════════════════════════*/
function loadFile(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  e.target.value = '';
  readFile(file);
}

function readFile(file) {
  currentFileName = file.name;
  const reader = new FileReader();
  reader.onload = ev =&gt; {
    rawMarkdown = ev.target.result || '';
    render();
    toast('✓ '+file.name+' carregado');
  };
  reader.onerror = () =&gt; toast('Erro ao ler arquivo','err');
  reader.readAsText(file, 'UTF-8');
}

/*══════════════════════════════════════════════════════════════════
  RENDERIZAR
══════════════════════════════════════════════════════════════════*/
function render() {
  if (!rawMarkdown) return;
  const html = marked.parse(rawMarkdown);
  const content = document.getElementById('content');
  content.innerHTML = '&lt;div class=&amp;quot;md&amp;quot; id=&amp;quot;md&amp;quot;&gt;'+html+'&lt;/div&gt;';
  document.getElementById('exportBtn').style.display = '';
  document.getElementById('docTitle').textContent = currentFileName || 'Documento';
  buildTOC();
  bindCodeCopies();
}

function buildTOC() {
  const list = document.getElementById('tocList');
  const headings = document.querySelectorAll('#md h1, #md h2, #md h3, #md h4, #md h5, #md h6');
  if (!headings.length) {
    list.innerHTML = '&lt;div style=&amp;quot;font-size:12px;color:var(--muted);text-align:center;padding:20px 10px&amp;quot;&gt;Documento sem títulos&lt;/div&gt;';
    return;
  }
  list.innerHTML = '';
  headings.forEach(h =&gt; {
    const lvl = h.tagName.toLowerCase();
    const id  = h.id;
    const txt = h.dataset.raw || h.textContent.replace(/📋.*$/,'').trim();
    const item = document.createElement('div');
    item.className = 'toc-item ' + lvl;
    item.innerHTML =
      '&lt;span class=&amp;quot;toc-text&amp;quot; title=&amp;quot;'+escapeAttr(txt)+'&amp;quot;&gt;'+escapeHTML(txt)+'&lt;/span&gt;'+
      '&lt;button class=&amp;quot;toc-copy&amp;quot; title=&amp;quot;Copiar essa seção&amp;quot; onclick=&amp;quot;event.stopPropagation();copySection(\''+id+'\')&amp;quot;&gt;📋&lt;/button&gt;';
    item.onclick = () =&gt; {
      document.getElementById(id)?.scrollIntoView({ behavior:'smooth', block:'start' });
      if (window.innerWidth &lt;= 768) toggleTOC();
      document.querySelectorAll('.toc-item').forEach(i =&gt; i.classList.remove('active'));
      item.classList.add('active');
    };
    list.appendChild(item);
  });
}

function bindCodeCopies() {
  document.querySelectorAll('.code-copy').forEach(btn =&gt; {
    btn.onclick = () =&gt; {
      const code = btn.dataset.code || '';
      navigator.clipboard.writeText(decodeAttr(code)).then(() =&gt; {
        const orig = btn.innerHTML;
        btn.innerHTML = '✓ Copiado!';
        setTimeout(() =&gt; btn.innerHTML = orig, 1500);
      });
    };
  });
}

/*══════════════════════════════════════════════════════════════════
  COPIAR SEÇÃO
══════════════════════════════════════════════════════════════════*/
function copySection(headingId, asMarkdown) {
  const h = document.getElementById(headingId);
  if (!h) return;
  const level = parseInt(h.dataset.heading || '1');

  // Coleta todos os elementos da seção (até o próximo heading de nível &lt;= )
  const elements = [h];
  let el = h.nextElementSibling;
  while (el) {
    if (/^H[1-6]$/.test(el.tagName)) {
      const lvl = parseInt(el.dataset.heading || el.tagName[1]);
      if (lvl &lt;= level) break;
    }
    elements.push(el);
    el = el.nextElementSibling;
  }

  let text;
  if (asMarkdown) {
    text = extractMarkdownSection(headingId);
  } else {
    text = elements.map(e =&gt; extractText(e)).join('\n\n').trim();
  }

  navigator.clipboard.writeText(text).then(() =&gt; {
    toast('✓ Seção copiada ('+text.length+' caracteres)');
  }).catch(() =&gt; toast('Erro ao copiar','err'));
}

function copySectionMD(headingId) {
  copySection(headingId, true);
}

function extractText(el) {
  // Mantém quebras de bloco de código
  if (el.classList?.contains('code-wrap')) {
    const lang = el.querySelector('.code-lang')?.textContent || '';
    const code = decodeAttr(el.querySelector('.code-copy')?.dataset.code || '');
    return '```'+lang+'\n'+code+'\n```';
  }
  // Heading
  if (/^H[1-6]$/.test(el.tagName)) {
    const lvl = parseInt(el.tagName[1]);
    const raw = el.dataset.raw || el.textContent.replace(/📋.*$/,'').trim();
    return '#'.repeat(lvl)+' '+raw;
  }
  return el.innerText || el.textContent || '';
}

/* Extrai a seção do MD bruto (mais fiel) */
function extractMarkdownSection(headingId) {
  const lines = rawMarkdown.split('\n');
  const headings = [];
  lines.forEach((line, i) =&gt; {
    const m = line.match(/^(#{1,6})\s+(.+?)\s*$/);
    if (m) headings.push({ idx:i, level:m[1].length, text:m[2], slug:slugify(m[2]) });
  });
  const start = headings.find(h =&gt; h.slug === headingId);
  if (!start) return '';
  const next = headings.find(h =&gt; h.idx &gt; start.idx &amp;amp;&amp;amp; h.level &lt;= start.level);
  const endIdx = next ? next.idx : lines.length;
  return lines.slice(start.idx, endIdx).join('\n').trim();
}

      b.onclick=()=&gt;{navigator.clipboard.writeText(b.dataset.code);b.textContent='✓ Copiado!';setTimeout(()=&gt;b.textContent='📋 Copiar',1500)};
    });
    document.querySelectorAll('.copy-btn[data-section]').forEach(b=&gt;{
      b.onclick=()=&gt;{

        while(el){
          if(/^H[1-6]$/.test(el.tagName)&amp;amp;&amp;amp;parseInt(el.tagName[1])&lt;=lvl)break;
          txt+=el.innerText+'\\n\\n';
          el=el.nextElementSibling;

        b.textContent='✓ Copiado!';setTimeout(()=&gt;b.textContent='📋 Seção',1500);

/*══════════════════════════════════════════════════════════════════
  BUSCA
══════════════════════════════════════════════════════════════════*/
function toggleSearch() {
  const bar = document.getElementById('searchBar');
  const show = !bar.classList.contains('show');
  bar.classList.toggle('show', show);
  if (show) {
    document.getElementById('searchInput').focus();
  } else {
    clearSearch();
  }
}

function clearSearch() {
  document.querySelectorAll('mark.search-hit').forEach(m =&gt; {
    const parent = m.parentNode;
    parent.replaceChild(document.createTextNode(m.textContent), m);
    parent.normalize();
  });
  searchHits = [];
  searchIdx = 0;
  document.getElementById('searchCount').textContent = '0/0';
}

function doSearch() {
  clearSearch();
  const q = document.getElementById('searchInput').value.trim();
  if (!q || q.length &lt; 2) { document.getElementById('searchCount').textContent='0/0'; return; }

  const md = document.getElementById('md');
  if (!md) return;

  const re = new RegExp(escapeRegex(q), 'gi');
  walkAndHighlight(md, re);
  searchHits = [...document.querySelectorAll('mark.search-hit')];
  searchIdx = 0;
  if (searchHits.length) {
    searchHits[0].classList.add('current');
    searchHits[0].scrollIntoView({ behavior:'smooth', block:'center' });
  }
  document.getElementById('searchCount').textContent = (searchHits.length ? 1 : 0) + '/' + searchHits.length;
}

function walkAndHighlight(node, re) {
  if (node.nodeType === 3) { // text
    const text = node.nodeValue;
    if (!re.test(text)) return;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index &gt; last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const mark = document.createElement('mark');
      mark.className = 'search-hit';
      mark.textContent = m[0];
      frag.appendChild(mark);
      last = m.index + m[0].length;
    }
    if (last &lt; text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  } else if (node.nodeType === 1 &amp;amp;&amp;amp; !['SCRIPT','STYLE','MARK'].includes(node.tagName)) {
    [...node.childNodes].forEach(c =&gt; walkAndHighlight(c, re));
  }
}

function searchKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (!searchHits.length) return;
    searchHits[searchIdx].classList.remove('current');
    searchIdx = e.shiftKey
      ? (searchIdx - 1 + searchHits.length) % searchHits.length
      : (searchIdx + 1) % searchHits.length;
    searchHits[searchIdx].classList.add('current');
    searchHits[searchIdx].scrollIntoView({ behavior:'smooth', block:'center' });
    document.getElementById('searchCount').textContent = (searchIdx+1)+'/'+searchHits.length;
  } else if (e.key === 'Escape') {
    toggleSearch();
  }
}

/*══════════════════════════════════════════════════════════════════

function toggleTOC() {
  const toc = document.getElementById('toc');
  const bd  = document.getElementById('backdrop');
  if (window.innerWidth &lt;= 768) {
    const show = !toc.classList.contains('show-mobile');
    toc.classList.toggle('show-mobile', show);
    bd.classList.toggle('show', show);
  } else {
    toc.classList.toggle('hidden');
  }
  document.getElementById('tocToggle').classList.toggle('active');
}

/*══════════════════════════════════════════════════════════════════
  UTILS
══════════════════════════════════════════════════════════════════*/
function escapeHTML(s) {
  return String(s)
    .replace(/&amp;amp;/g,'&amp;amp;amp;').replace(/&lt;/g,'&amp;amp;lt;')
    .replace(/&gt;/g,'&amp;amp;gt;').replace(/&amp;quot;/g,'&amp;amp;quot;').replace(/'/g,'&amp;amp;#39;');
}
function escapeAttr(s) { return escapeHTML(s); }
function decodeAttr(s) {
  return String(s)
    .replace(/&amp;amp;#39;/g,&amp;quot;'&amp;quot;).replace(/&amp;amp;quot;/g,'&amp;quot;')
    .replace(/&amp;amp;gt;/g,'&gt;').replace(/&amp;amp;lt;/g,'&lt;').replace(/&amp;amp;amp;/g,'&amp;amp;');
}
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&amp;amp;'); }
function slugify(s) {
  return String(s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s-]/g,'')
    .trim().replace(/\s+/g,'-').replace(/-+/g,'-');
}

let toastTimer;
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', type === 'err');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() =&gt; t.classList.remove('show'), 2200);
}
