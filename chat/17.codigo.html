                    &lt;button class=&quot;btn-primary&quot; onclick=&quot;adicionarLink()&quot;&gt;💾 Salvar Link&lt;/button&gt;

                &lt;/div&gt;
            &lt;/div&gt;

                &lt;/div&gt;

            &lt;div class=&quot;section&quot;&gt;
                &lt;div class=&quot;button-group&quot;&gt;
                    &lt;button class=&quot;btn-primary&quot; onclick=&quot;abrirSelecionados()&quot;&gt;🚀 Abrir Selecionados&lt;/button&gt;

    &lt;script&gt;
        // VARIÁVEIS GLOBAIS
        let links = [];
        let indiceAtual = 0;
        let telaCheia = false;

        // CARREGAR DADOS
        function carregarDados() {
            const dados = localStorage.getItem('gerenciadorLinks');
            if (dados) {
                links = JSON.parse(dados);
            }
            atualizarLista();
        }

        // SALVAR DADOS
        function salvarDados() {
            localStorage.setItem('gerenciadorLinks', JSON.stringify(links));
        }

        // ADICIONAR LINK
        function adicionarLink() {
            const nome = document.getElementById('linkName').value.trim();
            const url = document.getElementById('linkUrl').value.trim();

            if (!nome || !url) {
                alert('⚠️ Preencha nome e URL!');
                return;
            }

            // Validar URL
            try {
                new URL(url);
            } catch (e) {
                alert('⚠️ URL inválida! Comece com http:// ou https://');
                return;
            }

            links.push({
                id: Date.now(),
                nome: nome,
                url: url,
                checked: false
            });

            salvarDados();
            limparFormulario();
            atualizarLista();
        }

        // LIMPAR FORMULÁRIO
        function limparFormulario() {
            document.getElementById('linkName').value = '';
            document.getElementById('linkUrl').value = '';
            document.getElementById('linkName').focus();
        }

        // ATUALIZAR LISTA
        function atualizarLista() {
            const lista = document.getElementById('linksList');

            if (links.length === 0) {
                lista.innerHTML = `
                    &lt;div class=&quot;empty-state&quot;&gt;
                        &lt;p&gt;Nenhum link adicionado ainda&lt;/p&gt;
                        &lt;p style=&quot;font-size: 12px; margin-top: 10px;&quot;&gt;Adicione um link acima para começar!&lt;/p&gt;
                    &lt;/div&gt;
                `;
                atualizarEstatisticas();
                return;
            }

            lista.innerHTML = links.map(link =&gt; `
                &lt;div class=&quot;link-item ${link.checked ? 'checked' : ''}&quot;&gt;
                    &lt;input type=&quot;checkbox&quot; ${link.checked ? 'checked' : ''} onchange=&quot;alternarLink(${link.id})&quot;&gt;
                    &lt;div class=&quot;link-info&quot;&gt;
                        &lt;div class=&quot;link-name&quot;&gt;${link.nome}&lt;/div&gt;
                        &lt;div class=&quot;link-url&quot;&gt;${link.url}&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;button class=&quot;btn-remove&quot; onclick=&quot;removerLink(${link.id})&quot;&gt;Remover&lt;/button&gt;
                &lt;/div&gt;
            `).join('');

            atualizarEstatisticas();
        }

        // ALTERNAR LINK
        function alternarLink(id) {
            const link = links.find(l =&gt; l.id === id);
            if (link) {
                link.checked = !link.checked;
                salvarDados();
                atualizarLista();
            }
        }

        // REMOVER LINK
        function removerLink(id) {
            if (confirm('Tem certeza que quer remover este link?')) {
                links = links.filter(l =&gt; l.id !== id);
                salvarDados();
                atualizarLista();
            }
        }

        // MARCAR TODOS
        function marcarTodos() {
            links.forEach(link =&gt; link.checked = true);
            salvarDados();
            atualizarLista();
        }

        // DESMARCAR TODOS
        function desmarcarTodos() {
            links.forEach(link =&gt; link.checked = false);
            salvarDados();
            atualizarLista();
        }

        // LIMPAR TUDO
        function limparTudo() {
            if (confirm('⚠️ Tem certeza? Isso vai deletar TODOS os links!')) {
                links = [];
                salvarDados();
                atualizarLista();
            }
        }

        // ATUALIZAR ESTATÍSTICAS
        function atualizarEstatisticas() {
            document.getElementById('totalLinks').textContent = links.length;
            document.getElementById('checkedLinks').textContent = links.filter(l =&gt; l.checked).length;
        }

        // ABRIR SELECIONADOS
        function abrirSelecionados() {
            const selecionados = links.filter(l =&gt; l.checked);

            if (selecionados.length === 0) {
                alert('⚠️ Marque pelo menos um link!');
                return;
            }

            indiceAtual = 0;
            telaCheia = false;
            abrirVisualizador();
        }

        // ABRIR VISUALIZADOR
        function abrirVisualizador() {
            const selecionados = links.filter(l =&gt; l.checked);

            if (selecionados.length === 0) return;

            const linkAtual = selecionados[indiceAtual];
            document.getElementById('viewerTitle').textContent = `${indiceAtual + 1}/${selecionados.length} - ${linkAtual.nome}`;
            document.getElementById('viewerIframe').src = linkAtual.url;
            document.getElementById('viewerContainer').classList.add('active');
        }

        // ALTERNAR TELA CHEIA
        function alternarTelaCheia() {
            telaCheia = !telaCheia;
            const container = document.getElementById('viewerContainer');
            
            if (telaCheia) {
                container.classList.add('fullscreen');
            } else {
                container.classList.remove('fullscreen');
            }
        }

        // PRÓXIMO LINK
        function proximoLink() {
            const selecionados = links.filter(l =&gt; l.checked);
            indiceAtual = (indiceAtual + 1) % selecionados.length;
            abrirVisualizador();
        }

        // LINK ANTERIOR
        function linkAnterior() {
            const selecionados = links.filter(l =&gt; l.checked);
            indiceAtual = (indiceAtual - 1 + selecionados.length) % selecionados.length;
            abrirVisualizador();
        }

        // FECHAR VISUALIZADOR
        function fecharVisualizador() {
            document.getElementById('viewerContainer').classList.remove('active');
            telaCheia = false;
        }

        // INICIALIZAR
        carregarDados();
    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;

.b-roxo { background: #7c3aed; }
.b-laranja { background: #d97706; }
.b-escuro { background: #111827; }
.b-vermelho { background: #dc2626; }
.b-cinza { background: #6b7280; }

.contador-geral { font-size: 13px; color: #6b7280; margin-bottom: 10px; }

.grid { display: grid; grid-template-columns: 360px 1fr; gap: 18px; }
@media(max-width:900px){ .grid { grid-template-columns: 1fr; } }

.lista { display: flex; flex-direction: column; gap: 8px; max-height: 680px; overflow-y: auto; padding-right: 4px; }

.card { border: 1px solid #e5e7eb; background: #f9fafb; border-radius: 10px; padding: 12px; cursor: pointer; transition: 0.15s; }
.card:hover { border-color: #2563eb; background: #eff6ff; }
.card.ativo { border-color: #2563eb; background: #eff6ff; }

.card-topo { display: flex; gap: 8px; align-items: flex-start; }
.icone { font-size: 22px; min-width: 28px; text-align: center; }
.card-info { flex: 1; min-width: 0; }
.card-titulo { font-weight: bold; color: #1f2937; font-size: 14px; word-break: break-word; }
.card-meta { color: #6b7280; font-size: 11px; margin-top: 3px; }

.tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.tag { font-size: 10px; font-weight: bold; padding: 2px 7px; border-radius: 999px; }
.tag-html { background: #fef3c7; color: #92400e; }
.tag-css  { background: #ede9fe; color: #5b21b6; }
.tag-js   { background: #dcfce7; color: #14532d; }
.tag-vazio{ background: #f3f4f6; color: #9ca3af; }

.mini-acoes { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.mini-acoes button { font-size: 11px; padding: 5px 8px; }

/* PREVIEW */
.preview-topo { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.preview-topo h2 { font-size: 15px; color: #111827; word-break: break-word; }

.abas { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.aba { background: #e5e7eb; color: #374151; padding: 7px 12px; border-radius: 7px; cursor: pointer; font-weight: bold; font-size: 12px; }
.aba.ativa { background: #2563eb; color: white; }

.preview-box { border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
iframe { width: 100%; height: 560px; border: none; background: white; display: block; }

pre { background: #1e1e1e; color: #d4d4d4; padding: 16px; font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 560px; overflow-y: auto; margin: 0; }

.vazio { color: #9ca3af; text-align: center; padding: 60px 20px; font-size: 14px; }
.aviso { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 10px; }
.ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 10px; }

.progress { background: #e5e7eb; border-radius: 999px; height: 8px; margin: 10px 0; }
.progress-bar { background: #2563eb; height: 8px; border-radius: 999px; transition: width 0.3s; }
.progress-txt { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;

&lt;h1&gt;🗂 Extrator de Projetos Replit&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;Importa seu CSV exportado do Replit · Visualiza · Renderiza · Baixa cada projeto separado&lt;/p&gt;

&lt;div class=&quot;painel&quot;&gt;
  &lt;h2&gt;📥 Importar arquivo CSV&lt;/h2&gt;
  &lt;div class=&quot;drop&quot; id=&quot;drop&quot; onclick=&quot;document.getElementById('inp').click()&quot;&gt;
    &lt;div&gt;Clique aqui ou arraste o arquivo &lt;strong&gt;snippets.csv&lt;/strong&gt;&lt;/div&gt;
    &lt;div style=&quot;font-size:12px;margin-top:6px;color:#4b5563;&quot;&gt;Suporta arquivos grandes · Processamento local · Nada é enviado para internet&lt;/div&gt;
    &lt;input type=&quot;file&quot; id=&quot;inp&quot; accept=&quot;.csv&quot; onchange=&quot;carregarCSV(event)&quot;&gt;
  &lt;/div&gt;
  &lt;div id=&quot;progressArea&quot; style=&quot;display:none;margin-top:12px;&quot;&gt;
    &lt;div class=&quot;progress-txt&quot; id=&quot;progressTxt&quot;&gt;Carregando...&lt;/div&gt;
    &lt;div class=&quot;progress&quot;&gt;&lt;div class=&quot;progress-bar&quot; id=&quot;progressBar&quot; style=&quot;width:0%&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;painel&quot; id=&quot;painelPrincipal&quot; style=&quot;display:none;&quot;&gt;

  &lt;div class=&quot;barra&quot;&gt;
    &lt;input type=&quot;text&quot; id=&quot;busca&quot; placeholder=&quot;🔎 Buscar por título...&quot; oninput=&quot;filtrar()&quot;&gt;
    &lt;button class=&quot;b-escuro&quot; onclick=&quot;baixarTodos()&quot;&gt;⬇ Baixar todos como HTML&lt;/button&gt;
    &lt;button class=&quot;b-vermelho&quot; onclick=&quot;limpar()&quot;&gt;🗑 Limpar&lt;/button&gt;
  &lt;/div&gt;

  &lt;div class=&quot;contador-geral&quot; id=&quot;contadorGeral&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;

    &lt;div&gt;
      &lt;div class=&quot;lista&quot; id=&quot;lista&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div&gt;
      &lt;div class=&quot;preview-topo&quot;&gt;
        &lt;h2 id=&quot;previewTitulo&quot;&gt;👁 Selecione um projeto&lt;/h2&gt;
        &lt;div style=&quot;display:flex;gap:6px;flex-wrap:wrap;&quot; id=&quot;previewAcoes&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;abas&quot; id=&quot;abas&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;preview-box&quot; id=&quot;previewBox&quot;&gt;
        &lt;div class=&quot;vazio&quot;&gt;Selecione um projeto na lista para visualizar.&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
let projetos = [];
let projetoAtivo = null;
let abaAtiva = &quot;render&quot;;
let filtrados = [];

// DRAG DROP
const drop = document.getElementById(&quot;drop&quot;);
drop.addEventListener(&quot;dragover&quot;, e =&gt; { e.preventDefault(); drop.style.background = &quot;#dbeafe&quot;; });
drop.addEventListener(&quot;dragleave&quot;, () =&gt; { drop.style.background = &quot;#eff6ff&quot;; });
drop.addEventListener(&quot;drop&quot;, e =&gt; {
  e.preventDefault();
  drop.style.background = &quot;#eff6ff&quot;;
  const f = e.dataTransfer.files[0];
  if (f) processarArquivo(f);
});

function carregarCSV(e) {
  const f = e.target.files[0];
  if (f) processarArquivo(f);
}

function processarArquivo(file) {
  document.getElementById(&quot;progressArea&quot;).style.display = &quot;block&quot;;
  document.getElementById(&quot;progressTxt&quot;).textContent = &quot;Lendo arquivo...&quot;;
  document.getElementById(&quot;progressBar&quot;).style.width = &quot;10%&quot;;

  const reader = new FileReader();
  reader.onload = function(e) {
    document.getElementById(&quot;progressBar&quot;).style.width = &quot;40%&quot;;
    document.getElementById(&quot;progressTxt&quot;).textContent = &quot;Processando linhas...&quot;;

    setTimeout(() =&gt; {
      try {
        projetos = parseCSVCompleto(e.target.result);
        document.getElementById(&quot;progressBar&quot;).style.width = &quot;90%&quot;;
        document.getElementById(&quot;progressTxt&quot;).textContent = projetos.length + &quot; projetos encontrados!&quot;;

        setTimeout(() =&gt; {
          document.getElementById(&quot;progressArea&quot;).style.display = &quot;none&quot;;
          document.getElementById(&quot;painelPrincipal&quot;).style.display = &quot;block&quot;;
          filtrados = [...projetos];
          renderizarLista();
        }, 400);
      } catch(err) {
        alert(&quot;Erro ao processar CSV:\n&quot; + err.message);
        document.getElementById(&quot;progressArea&quot;).style.display = &quot;none&quot;;
      }
    }, 50);
  };
  reader.readAsText(file, &quot;UTF-8&quot;);
}

// PARSER CSV ROBUSTO — lida com campos gigantes com quebras de linha
function parseCSVCompleto(texto) {
  const resultado = [];
  let i = 0;
  const len = texto.length;

  // Detectar separador
  const primeiraLinha = texto.slice(0, 500);
  const sep = primeiraLinha.includes(&quot;\t&quot;) ? &quot;\t&quot; : &quot;,&quot;;

  // Ler cabeçalho
  const cabecalho = lerLinha(texto, 0, sep);
  const colunas = cabecalho.valores.map(c =&gt; c.trim().toLowerCase());
  i = cabecalho.proximo;

  // Mapear índices
  const iId    = colunas.findIndex(c =&gt; c === &quot;id&quot;);
  const iTitle = colunas.findIndex(c =&gt; c.includes(&quot;title&quot;) || c.includes(&quot;titulo&quot;) || c.includes(&quot;nome&quot;));
  const iHtml  = colunas.findIndex(c =&gt; c === &quot;html&quot;);
  const iCss   = colunas.findIndex(c =&gt; c === &quot;css&quot;);
  const iJs    = colunas.findIndex(c =&gt; c === &quot;js&quot; || c === &quot;javascript&quot;);
  const iMode  = colunas.findIndex(c =&gt; c === &quot;mode&quot; || c === &quot;tipo&quot; || c === &quot;type&quot;);

  let count = 0;
  while (i &lt; len) {
    const linha = lerLinha(texto, i, sep);
    if (!linha) break;
    i = linha.proximo;

    const v = linha.valores;
    if (!v || v.length &lt; 2) continue;

    const proj = {
      id:    iId    &gt;= 0 ? v[iId]    || &quot;&quot; : String(count + 1),
      title: iTitle &gt;= 0 ? v[iTitle] || &quot;&quot; : &quot;Projeto &quot; + (count + 1),
      html:  iHtml  &gt;= 0 ? v[iHtml]  || &quot;&quot; : &quot;&quot;,
      css:   iCss   &gt;= 0 ? v[iCss]   || &quot;&quot; : &quot;&quot;,
      js:    iJs    &gt;= 0 ? v[iJs]    || &quot;&quot; : &quot;&quot;,
      mode:  iMode  &gt;= 0 ? v[iMode]  || &quot;&quot; : &quot;&quot;,
    };

    if (!proj.title.trim()) proj.title = &quot;Projeto &quot; + (count + 1);

    resultado.push(proj);
    count++;
  }

  return resultado;
}

function lerLinha(texto, inicio, sep) {
  const valores = [];
  let i = inicio;
  const len = texto.length;
  let campo = &quot;&quot;;
  let dentroAspas = false;

  while (i &lt; len) {
    const c = texto[i];

    if (c === '&quot;') {
      if (dentroAspas &amp;&amp; texto[i+1] === '&quot;') {
        campo += '&quot;';
        i += 2;
        continue;
      }
      dentroAspas = !dentroAspas;
      i++;
      continue;
    }

    if (c === sep &amp;&amp; !dentroAspas) {
      valores.push(campo);
      campo = &quot;&quot;;
      i++;
      continue;
    }

    if ((c === &quot;\n&quot; || (c === &quot;\r&quot; &amp;&amp; texto[i+1] === &quot;\n&quot;)) &amp;&amp; !dentroAspas) {
      valores.push(campo);
      if (c === &quot;\r&quot;) i++;
      i++;
      return { valores, proximo: i };
    }

    campo += c;
    i++;
  }

  if (campo || valores.length) {
    valores.push(campo);
    return { valores, proximo: i };
  }

  return null;
}

// FILTRAR
function filtrar() {
  const termo = document.getElementById(&quot;busca&quot;).value.toLowerCase().trim();
  filtrados = termo
    ? projetos.filter(p =&gt; p.title.toLowerCase().includes(termo) || p.mode.toLowerCase().includes(termo))
    : [...projetos];
  renderizarLista();
}

// RENDERIZAR LISTA
function renderizarLista() {
  const lista = document.getElementById(&quot;lista&quot;);
  const contador = document.getElementById(&quot;contadorGeral&quot;);
  lista.innerHTML = &quot;&quot;;

  contador.textContent = filtrados.length + &quot; de &quot; + projetos.length + &quot; projeto(s)&quot;;

  if (!filtrados.length) {
    lista.innerHTML = '&lt;div class=&quot;vazio&quot;&gt;Nenhum projeto encontrado.&lt;/div&gt;';
    return;
  }

  filtrados.forEach(p =&gt; {
    const temHtml = p.html.trim().length &gt; 0;
    const temCss  = p.css.trim().length &gt; 0;
    const temJs   = p.js.trim().length &gt; 0;

    const tamanho = ((p.html.length + p.css.length + p.js.length) / 1024).toFixed(1);

    const card = document.createElement(&quot;div&quot;);
    card.className = &quot;card&quot; + (projetoAtivo?.id === p.id ? &quot; ativo&quot; : &quot;&quot;);
    card.innerHTML = `
      &lt;div class=&quot;card-topo&quot;&gt;
        &lt;div class=&quot;icone&quot;&gt;🌐&lt;/div&gt;
        &lt;div class=&quot;card-info&quot;&gt;
          &lt;div class=&quot;card-titulo&quot;&gt;${esc(p.title)}&lt;/div&gt;
          &lt;div class=&quot;card-meta&quot;&gt;ID: ${esc(p.id)} · ${tamanho} KB ${p.mode ? &quot;· &quot; + esc(p.mode) : &quot;&quot;}&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tags&quot;&gt;
        ${temHtml ? '&lt;span class=&quot;tag tag-html&quot;&gt;HTML&lt;/span&gt;' : '&lt;span class=&quot;tag tag-vazio&quot;&gt;sem HTML&lt;/span&gt;'}
        ${temCss  ? '&lt;span class=&quot;tag tag-css&quot;&gt;CSS&lt;/span&gt;'   : &quot;&quot;}
        ${temJs   ? '&lt;span class=&quot;tag tag-js&quot;&gt;JS&lt;/span&gt;'     : &quot;&quot;}
      &lt;/div&gt;
      &lt;div class=&quot;mini-acoes&quot;&gt;
        &lt;button class=&quot;b-azul&quot;   onclick=&quot;abrirProjeto('${esc(p.id)}')&quot;&gt;👁 Ver&lt;/button&gt;
        &lt;button class=&quot;b-verde&quot;  onclick=&quot;baixarProjeto('${esc(p.id)}')&quot;&gt;⬇ HTML&lt;/button&gt;
        &lt;button class=&quot;b-roxo&quot;   onclick=&quot;copiarProjeto('${esc(p.id)}')&quot;&gt;📋 Copiar&lt;/button&gt;
      &lt;/div&gt;
    `;

    card.addEventListener(&quot;click&quot;, function(ev) {
      if (ev.target.tagName === &quot;BUTTON&quot;) return;
      abrirProjeto(p.id);
    });

    lista.appendChild(card);
  });
}

// ABRIR PROJETO
function abrirProjeto(id) {
  projetoAtivo = projetos.find(p =&gt; p.id === id) || filtrados.find(p =&gt; p.id === id);
  if (!projetoAtivo) return;
  abaAtiva = &quot;render&quot;;
  renderizarLista();
  renderizarPreview();
  document.getElementById(&quot;painelPrincipal&quot;).scrollIntoView({ behavior: &quot;smooth&quot; });
}

// RENDERIZAR PREVIEW
function renderizarPreview() {
  const p = projetoAtivo;
  if (!p) return;

  document.getElementById(&quot;previewTitulo&quot;).textContent = &quot;👁 &quot; + p.title;

  // Ações
  document.getElementById(&quot;previewAcoes&quot;).innerHTML = `
    &lt;button class=&quot;b-verde&quot;  onclick=&quot;baixarProjeto('${esc(p.id)}')&quot;&gt;⬇ Baixar HTML&lt;/button&gt;
    &lt;button class=&quot;b-roxo&quot;   onclick=&quot;copiarProjeto('${esc(p.id)}')&quot;&gt;📋 Copiar&lt;/button&gt;
    &lt;button class=&quot;b-laranja&quot; onclick=&quot;abrirNovaAba('${esc(p.id)}')&quot;&gt;🔗 Abrir em nova aba&lt;/button&gt;
  `;

  // Abas
  const abas = [
    { id: &quot;render&quot;, label: &quot;🌐 Render&quot; },
    { id: &quot;html&quot;,   label: &quot;HTML&quot; },
    { id: &quot;css&quot;,    label: &quot;CSS&quot; },
    { id: &quot;js&quot;,     label: &quot;JS&quot; },
    { id: &quot;tudo&quot;,   label: &quot;📄 Código completo&quot; },
  ];

  document.getElementById(&quot;abas&quot;).innerHTML = abas.map(a =&gt;
    `&lt;div class=&quot;aba ${abaAtiva === a.id ? &quot;ativa&quot; : &quot;&quot;}&quot; onclick=&quot;mudarAba('${a.id}')&quot;&gt;${a.label}&lt;/div&gt;`
  ).join(&quot;&quot;);

  // Conteúdo
  const box = document.getElementById(&quot;previewBox&quot;);

  if (abaAtiva === &quot;render&quot;) {
    const html = montarHTML(p);
    box.innerHTML = `&lt;iframe id=&quot;iframePreview&quot; srcdoc=&quot;${escAttr(html)}&quot;&gt;&lt;/iframe&gt;`;
  } else if (abaAtiva === &quot;html&quot;) {
    box.innerHTML = `&lt;pre&gt;${esc(p.html || &quot;(vazio)&quot;)}&lt;/pre&gt;`;
  } else if (abaAtiva === &quot;css&quot;) {
    box.innerHTML = `&lt;pre&gt;${esc(p.css || &quot;(vazio)&quot;)}&lt;/pre&gt;`;
  } else if (abaAtiva === &quot;js&quot;) {
    box.innerHTML = `&lt;pre&gt;${esc(p.js || &quot;(vazio)&quot;)}&lt;/pre&gt;`;
  } else if (abaAtiva === &quot;tudo&quot;) {
    box.innerHTML = `&lt;pre&gt;${esc(montarHTML(p))}&lt;/pre&gt;`;
  }
}

function mudarAba(aba) {
  abaAtiva = aba;
  renderizarPreview();
}

// MONTAR HTML COMPLETO
function montarHTML(p) {
  // Se o HTML já é um documento completo
  const htmlTrim = (p.html || &quot;&quot;).trim();

  if (htmlTrim.toLowerCase().includes(&quot;&lt;!doctype&quot;) || htmlTrim.toLowerCase().startsWith(&quot;&lt;html&quot;)) {
    // Já é documento completo — injeta CSS e JS se existirem separados
    let resultado = htmlTrim;

    if (p.css &amp;&amp; p.css.trim()) {
      resultado = resultado.replace(&quot;&lt;/head&gt;&quot;, `&lt;style&gt;\n${p.css}\n&lt;/style&gt;\n&lt;/head&gt;`);
      if (!resultado.includes(&quot;&lt;/head&gt;&quot;)) {
        resultado = `&lt;style&gt;\n${p.css}\n&lt;/style&gt;\n` + resultado;
      }
    }

    if (p.js &amp;&amp; p.js.trim()) {
      resultado = resultado.replace(&quot;&lt;/body&gt;&quot;, `&lt;script&gt;\n${p.js}\n&lt;\/script&gt;\n&lt;/body&gt;`);
      if (!resultado.includes(&quot;&lt;/body&gt;&quot;)) {
        resultado += `\n&lt;script&gt;\n${p.js}\n&lt;\/script&gt;`;
      }
    }

    return resultado;
  }

  // Monta documento do zero
  return `&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;pt-BR&quot;&gt;
&lt;head&gt;
  &lt;meta charset=&quot;UTF-8&quot;&gt;
  &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
  &lt;title&gt;${esc(p.title)}&lt;/title&gt;
  &lt;style&gt;
${p.css || &quot;&quot;}
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
${p.html || &quot;&quot;}
&lt;script&gt;
${p.js || &quot;&quot;}
&lt;\/script&gt;
&lt;/body&gt;
&lt;/html&gt;`;
}

// BAIXAR PROJETO
function baixarProjeto(id) {
  const p = projetos.find(x =&gt; x.id === id) || filtrados.find(x =&gt; x.id === id);
  if (!p) return;

  const html = montarHTML(p);
  const nome = limparNome(p.title) + &quot;.html&quot;;
  baixarBlob(html, nome, &quot;text/html;charset=utf-8&quot;);
}

// ABRIR EM NOVA ABA
function abrirNovaAba(id) {
  const p = projetos.find(x =&gt; x.id === id) || filtrados.find(x =&gt; x.id === id);
  if (!p) return;

  const html = montarHTML(p);
  const blob = new Blob([html], { type: &quot;text/html;charset=utf-8&quot; });
  const url = URL.createObjectURL(blob);
  window.open(url, &quot;_blank&quot;);
}

// COPIAR
function copiarProjeto(id) {
  const p = projetos.find(x =&gt; x.id === id) || filtrados.find(x =&gt; x.id === id);
  if (!p) return;

  navigator.clipboard.writeText(montarHTML(p))
    .then(() =&gt; alert(&quot;Código copiado! Cole no Bloco de Notas e salve como .html&quot;))
    .catch(() =&gt; alert(&quot;Não foi possível copiar automaticamente.&quot;));
}

// BAIXAR TODOS
function baixarTodos() {
  if (!filtrados.length) return;

  if (!confirm(&quot;Baixar &quot; + filtrados.length + &quot; projetos? Serão baixados um por um.&quot;)) return;

  let i = 0;
  function proximo() {
    if (i &gt;= filtrados.length) {
      alert(&quot;Todos os projetos foram baixados!&quot;);
      return;
    }
    baixarProjeto(filtrados[i].id);
    i++;
    setTimeout(proximo, 600);
  }
  proximo();
}

// LIMPAR
function limpar() {
  if (!confirm(&quot;Limpar tudo?&quot;)) return;
  projetos = [];
  filtrados = [];
  projetoAtivo = null;
  document.getElementById(&quot;painelPrincipal&quot;).style.display = &quot;none&quot;;
  document.getElementById(&quot;inp&quot;).value = &quot;&quot;;
}

// UTILITÁRIOS
function limparNome(nome) {
  return String(nome)
    .normalize(&quot;NFD&quot;).replace(/[\u0300-\u036f]/g, &quot;&quot;)
    .replace(/[^\w\s\-]/g, &quot;&quot;)
    .replace(/\s+/g, &quot;-&quot;)
    .replace(/-+/g, &quot;-&quot;)
    .replace(/^-|-$/g, &quot;&quot;)
    .toLowerCase()
    .slice(0, 80) || &quot;projeto&quot;;
}

function baixarBlob(conteudo, nome, tipo) {
  const blob = new Blob([conteudo], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement(&quot;a&quot;);
  a.href = url;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

/*══════════════════════════════════════════════════════════════════
  AUTO-DETECÇÃO AMPLIADA DE PROVEDORES
══════════════════════════════════════════════════════════════════*/
const AUTO_DETECT = [
  { prefix:'gsk_',    url:'https://api.groq.com/openai/v1',                          model:'llama-3.3-70b-versatile', name:'Groq' },
  { prefix:'sk-or-',  url:'https://openrouter.ai/api/v1',                            model:'openai/gpt-4o-mini',      name:'OpenRouter' },
  { prefix:'sk-ant-', url:'https://api.anthropic.com/v1',                            model:'claude-3-5-haiku-latest', name:'Anthropic Claude' },
  { prefix:'pplx-',   url:'https://api.perplexity.ai',                               model:'sonar-pro',               name:'Perplexity' },
  { prefix:'AIza',    url:'https://generativelanguage.googleapis.com/v1beta/openai', model:'gemini-2.0-flash',        name:'Google Gemini' },
  { prefix:'xai-',    url:'https://api.x.ai/v1',                                     model:'grok-2-latest',           name:'xAI/Grok' },
  { prefix:'hf_',     url:'https://api-inference.huggingface.co/v1',                 model:'meta-llama/Llama-3.3-70B-Instruct', name:'HuggingFace' },
  { prefix:'csk-',    url:'https://api.cerebras.ai/v1',                              model:'llama-3.3-70b',           name:'Cerebras' },
  { prefix:'fw_',     url:'https://api.fireworks.ai/inference/v1',                   model:'accounts/fireworks/models/llama-v3p3-70b-instruct', name:'Fireworks' },
  { prefix:'tgp_',    url:'https://api.together.xyz/v1',                             model:'meta-llama/Llama-3.3-70B-Instruct-Turbo', name:'Together AI' },
  // Mistral (32 chars hex), DeepSeek (sk-...), Cohere — detectados por regex abaixo
  { prefix:'sk-',     url:'https://api.openai.com/v1',                               model:'gpt-4o-mini',             name:'OpenAI' },
];

const REGEX_DETECT = [
  { regex:/^[a-zA-Z0-9]{32}$/, url:'https://api.mistral.ai/v1', model:'mistral-small-latest', name:'Mistral' },
];

function detectProvider(key) {
  if (!key) return null;
  for (const p of AUTO_DETECT) if (key.startsWith(p.prefix)) return p;
  for (const p of REGEX_DETECT) if (p.regex.test(key)) return p;
  return null;
}

/*══════════════════════════════════════════════════════════════════
  INDEXEDDB — Auto-save robusto
══════════════════════════════════════════════════════════════════*/
const DB_NAME = 'ChatIAProDB';
const DB_VER  = 1;
let db = null;

function openDB() {
  return new Promise((resolve, reject) =&amp;gt; {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = ev =&amp;gt; {
      const d = ev.target.result;
      if (!d.objectStoreNames.contains('conversations')) {
        d.createObjectStore('conversations', { keyPath:'id' });
      }
      if (!d.objectStoreNames.contains('settings')) {
        d.createObjectStore('settings', { keyPath:'key' });
      }
    };
    req.onsuccess = () =&amp;gt; { db = req.result; resolve(db); };
    req.onerror   = () =&amp;gt; reject(req.error);
  });
}

function dbPut(store, obj) {
  return new Promise((res, rej) =&amp;gt; {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(obj);
    tx.oncomplete = res; tx.onerror = () =&amp;gt; rej(tx.error);
  });
}
function dbGetAll(store) {
  return new Promise((res, rej) =&amp;gt; {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () =&amp;gt; res(req.result);
    req.onerror   = () =&amp;gt; rej(req.error);
  });
}
function dbGet(store, key) {
  return new Promise((res, rej) =&amp;gt; {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () =&amp;gt; res(req.result);
    req.onerror   = () =&amp;gt; rej(req.error);
  });
}
function dbDelete(store, key) {
  return new Promise((res, rej) =&amp;gt; {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = res; tx.onerror = () =&amp;gt; rej(tx.error);
  });
}

/*══════════════════════════════════════════════════════════════════
  ESTADO
══════════════════════════════════════════════════════════════════*/
let apiKey    = localStorage.getItem('cia_key')   || '';
let apiUrl    = localStorage.getItem('cia_url')   || '';
let apiModel  = localStorage.getItem('cia_model') || '';
let savedKeys = JSON.parse(localStorage.getItem('cia_saved') || '[]');
let ttsOn     = localStorage.getItem('cia_tts') !== 'off';
let webOn     = localStorage.getItem('cia_web') === 'on';
let showKey   = false;

let history    = [];
let currentConvId = null;
let controller = null;
let isRecording= false;
let recog      = null;
let silTimer   = null;
let saveTimer  = null;

/*══════════════════════════════════════════════════════════════════
  BOOT
══════════════════════════════════════════════════════════════════*/
async function boot() {
  try { await openDB(); } catch(e) { console.warn('IndexedDB indisponível:', e); }

  const ki = document.getElementById('keyInput');
  ki.value = apiKey;
  if (apiKey) {
    const d = detectProvider(apiKey);
    if (d) {
      document.getElementById('urlInput').value = d.url;
      document.getElementById('modelInput').value = d.model;
    } else {
      document.getElementById('urlInput').value = apiUrl;
      document.getElementById('modelInput').value = apiModel;
    }
  }
  updateProvBadge();
  updateCfgStatus();
  document.getElementById('ttsBtn').style.opacity = ttsOn ? '1' : '0.4';
  document.getElementById('webBtn').classList.toggle('web-on', webOn);
  renderSavedKeys();
  await renderConvList();

  // Restaura conversa atual se houver
  const last = localStorage.getItem('cia_current_conv');
  if (last &amp;amp;&amp;amp; db) {
    const conv = await dbGet('conversations', last);
    if (conv &amp;amp;&amp;amp; conv.messages?.length) {
      currentConvId = conv.id;
      history = conv.messages;
      restoreUI();
    }
  }

  // Restaura rascunho do input
  const draft = localStorage.getItem('cia_draft');
  if (draft) {
    document.getElementById('msgInput').value = draft;
    adjustHeight(document.getElementById('msgInput'));
  }

  if (!apiKey) togglePanel('cfgPanel','cfgBtn');
}

function restoreUI() {
  document.getElementById('emptyState')?.remove();
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  history.forEach(m =&amp;gt; appendMsg(m.role === 'user' ? 'user' : 'bot', m.content, false, true));
  addCopyListeners();
}

/*══════════════════════════════════════════════════════════════════
  AUTO-SAVE
══════════════════════════════════════════════════════════════════*/
async function autoSave() {
  if (!db || !history.length) return;
  if (!currentConvId) currentConvId = 'conv_' + Date.now();

  const firstUserMsg = history.find(m =&amp;gt; m.role === 'user')?.content || 'Conversa';
  const title = firstUserMsg.slice(0, 60).replace(/\n/g,' ');

  const obj = {
    id: currentConvId,
    title,
    messages: history,
    updatedAt: Date.now(),
    provider: apiKey ? (detectProvider(apiKey)?.name || 'Custom') : 'Demo',
  };
  try {
    await dbPut('conversations', obj);
    localStorage.setItem('cia_current_conv', currentConvId);
  } catch(e) { console.warn('Auto-save falhou:', e); }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(autoSave, 400);
}

function autoSaveDraft() {
  const v = document.getElementById('msgInput').value;
  if (v) localStorage.setItem('cia_draft', v);
  else   localStorage.removeItem('cia_draft');
}

/*══════════════════════════════════════════════════════════════════
  PAINÉIS GENÉRICOS
══════════════════════════════════════════════════════════════════*/
function togglePanel(panelId, btnId) {
  const allPanels = ['cfgPanel','keysPanel','convPanel','ioPanel'];
  const allBtns   = ['cfgBtn','keysBtn','convBtn','ioBtn'];
  const target = document.getElementById(panelId);
  const show = !target.classList.contains('show');
  allPanels.forEach(id =&amp;gt; document.getElementById(id).classList.remove('show'));
  allBtns.forEach(id =&amp;gt; document.getElementById(id)?.classList.remove('active'));
  if (show) {
    target.classList.add('show');
    document.getElementById(btnId)?.classList.add('active');
  }
}

/*══════════════════════════════════════════════════════════════════
  CHAVES
══════════════════════════════════════════════════════════════════*/
function onKeyInput(val) {
  val = val.trim();
  apiKey = val;
  localStorage.setItem('cia_key', val);
  const d = val ? detectProvider(val) : null;
  if (d) {
    document.getElementById('urlInput').value  = d.url;
    document.getElementById('modelInput').value = d.model;
    apiUrl   = d.url;
    apiModel = d.model;
    localStorage.setItem('cia_url',   d.url);
    localStorage.setItem('cia_model', d.model);
    document.getElementById('cfgProvOk').textContent = '✓ ' + d.name + ' · ' + d.model;
    document.getElementById('cfgProvOk').style.display = 'block';
    document.getElementById('cfgNote').style.display = 'none';
  } else {
    document.getElementById('cfgProvOk').style.display = 'none';
    document.getElementById('cfgNote').style.display = '';
  }
  document.getElementById('saveRow').style.display = val ? 'flex' : 'none';
  updateProvBadge();
  updateCfgStatus();
}

function updateProvBadge() {
  const badge = document.getElementById('provBadge');
  if (apiKey) {
    const d = detectProvider(apiKey);
    badge.textContent = d ? d.name : 'Custom';
    badge.style.borderColor = '#5aab56';
    badge.style.color = '#7ec87a';
  } else {
    badge.textContent = 'Demo ✨';
    badge.style.borderColor = '#60a5fa';
    badge.style.color = '#93c5fd';
  }
}

function updateCfgStatus() {
  const el = document.getElementById('cfgStatus');
  if (apiKey) {
    const d = detectProvider(apiKey);
    el.textContent = '✓ ' + (d ? d.name : 'Personalizada') + ' ativa';
    el.className = 'cfg-status ok';
  } else {
    el.textContent = 'Sem chave configurada';
    el.className = 'cfg-status demo';
  }
}

function toggleShowKey() {
  showKey = !showKey;
  document.getElementById('keyInput').type = showKey ? 'text' : 'password';
}

function saveKey() {
  const key   = document.getElementById('keyInput').value.trim();
  const label = document.getElementById('labelInput').value.trim();
  const url   = document.getElementById('urlInput').value.trim();
  const model = document.getElementById('modelInput').value.trim();
  if (!key) return;
  if (savedKeys.some(k =&amp;gt; k.key === key)) { toast('Chave já salva','err'); return; }
  const d = detectProvider(key);
  const finalLabel = label || (d ? d.name : 'Chave ' + (savedKeys.length+1));
  savedKeys.push({ id:Date.now()+'', label:finalLabel, key, url, model, provider:d ? d.name : 'Custom' });
  localStorage.setItem('cia_saved', JSON.stringify(savedKeys));
  document.getElementById('labelInput').value = '';
  renderSavedKeys();
  toast('Chave salva ✓');
}

function renderSavedKeys() {
  const list = document.getElementById('keysList');
  document.getElementById('keysTitle').textContent = 'Chaves Salvas ('+savedKeys.length+')';
  if (!savedKeys.length) {
    list.innerHTML = '&amp;lt;div style=&amp;quot;font-size:12px;color:#6b8f68;text-align:center;padding:10px&amp;quot;&amp;gt;Nenhuma chave salva.&amp;lt;/div&amp;gt;';
    return;
  }
  list.innerHTML = '';
  savedKeys.forEach(sk =&amp;gt; {
    const div = document.createElement('div');
    div.className = 'saved-key' + (sk.key === apiKey ? ' active' : '');
    div.innerHTML =
      '&amp;lt;div class=&amp;quot;saved-key-info&amp;quot; onclick=&amp;quot;loadKey(\''+sk.id+'\')&amp;quot;&amp;gt;'+
        '&amp;lt;div class=&amp;quot;saved-key-label&amp;quot;&amp;gt;'+esc(sk.label)+'&amp;lt;/div&amp;gt;'+
        '&amp;lt;div class=&amp;quot;saved-key-meta&amp;quot;&amp;gt;'+esc(sk.provider)+' · '+sk.key.slice(0,6)+'…'+sk.key.slice(-3)+'&amp;lt;/div&amp;gt;'+
      '&amp;lt;/div&amp;gt;'+
      (sk.key === apiKey ? '&amp;lt;span class=&amp;quot;active-tag&amp;quot;&amp;gt;ATIVA&amp;lt;/span&amp;gt;' : '')+
      '&amp;lt;button class=&amp;quot;del-btn&amp;quot; onclick=&amp;quot;deleteKey(\''+sk.id+'\')&amp;quot;&amp;gt;✕&amp;lt;/button&amp;gt;';
    list.appendChild(div);
  });
}

function loadKey(id) {
  const sk = savedKeys.find(k =&amp;gt; k.id === id);
  if (!sk) return;
  apiKey = sk.key; apiUrl = sk.url; apiModel = sk.model;
  localStorage.setItem('cia_key',   sk.key);
  localStorage.setItem('cia_url',   sk.url);
  localStorage.setItem('cia_model', sk.model);
  document.getElementById('keyInput').value   = sk.key;
  document.getElementById('urlInput').value   = sk.url;
  document.getElementById('modelInput').value = sk.model;
  onKeyInput(sk.key);
  renderSavedKeys();
  togglePanel('keysPanel','keysBtn');
  toast('Chave &amp;quot;'+sk.label+'&amp;quot; ativada');
}

function deleteKey(id) {
  savedKeys = savedKeys.filter(k =&amp;gt; k.id !== id);
  localStorage.setItem('cia_saved', JSON.stringify(savedKeys));
  renderSavedKeys();
}

══════════════════════════════════════════════════════════════════*/
async function renderConvList() {
  const list = document.getElementById('convList');
  if (!db) { list.innerHTML = '&amp;lt;div style=&amp;quot;font-size:12px;color:#6b8f68;text-align:center;padding:10px&amp;quot;&amp;gt;DB indisponível&amp;lt;/div&amp;gt;'; return; }
  const convs = (await dbGetAll('conversations')).sort((a,b) =&amp;gt; b.updatedAt - a.updatedAt);
  document.getElementById('convTitle').textContent = 'Conversas ('+convs.length+')';
  if (!convs.length) {
    list.innerHTML = '&amp;lt;div style=&amp;quot;font-size:12px;color:#6b8f68;text-align:center;padding:10px&amp;quot;&amp;gt;Nenhuma conversa salva ainda.&amp;lt;/div&amp;gt;';
    return;
  }
  list.innerHTML = '';
  convs.forEach(c =&amp;gt; {
    const div = document.createElement('div');
    div.className = 'conv-item' + (c.id === currentConvId ? ' active' : '');
    const date = new Date(c.updatedAt).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    div.innerHTML =
      '&amp;lt;div class=&amp;quot;conv-info&amp;quot; onclick=&amp;quot;loadConv(\''+c.id+'\')&amp;quot;&amp;gt;'+
        '&amp;lt;div class=&amp;quot;conv-title&amp;quot;&amp;gt;'+esc(c.title)+'&amp;lt;/div&amp;gt;'+
        '&amp;lt;div class=&amp;quot;conv-meta&amp;quot;&amp;gt;'+date+' · '+c.messages.length+' msgs · '+esc(c.provider||'')+'&amp;lt;/div&amp;gt;'+
      '&amp;lt;/div&amp;gt;'+
      '&amp;lt;button class=&amp;quot;del-btn&amp;quot; onclick=&amp;quot;deleteConv(\''+c.id+'\')&amp;quot;&amp;gt;✕&amp;lt;/button&amp;gt;';
    list.appendChild(div);
  });
}

async function deleteConv(id) {

  await dbDelete('conversations', id);
  if (id === currentConvId) { currentConvId = null; history = []; restoreUI(); }
  await renderConvList();
}

  BUSCA NA WEB
══════════════════════════════════════════════════════════════════*/
function toggleWeb() {
  webOn = !webOn;
  localStorage.setItem('cia_web', webOn ? 'on' : 'off');
  document.getElementById('webBtn').classList.toggle('web-on', webOn);
  toast(webOn ? '🌐 Busca web ATIVADA' : 'Busca web desativada');
}

async function webSearch(query) {
  // Usa DuckDuckGo Instant Answer API (CORS-friendly)
  try {
    const url = 'https://api.duckduckgo.com/?q='+encodeURIComponent(query)+'&amp;amp;format=json&amp;amp;no_html=1&amp;amp;skip_disambig=1';
    const r = await fetch(url);
    const j = await r.json();
    const parts = [];
    if (j.AbstractText) parts.push('RESUMO: '+j.AbstractText+(j.AbstractURL?' (Fonte: '+j.AbstractURL+')':''));
    if (j.Answer) parts.push('RESPOSTA: '+j.Answer);
    if (j.Definition) parts.push('DEFINIÇÃO: '+j.Definition);
    if (j.RelatedTopics?.length) {
      const topics = j.RelatedTopics.slice(0,5)
        .filter(t =&amp;gt; t.Text)
        .map((t,i) =&amp;gt; (i+1)+'. '+t.Text+(t.FirstURL?' ['+t.FirstURL+']':''));
      if (topics.length) parts.push('TÓPICOS:\n'+topics.join('\n'));
    }
    return parts.length ? parts.join('\n\n') : null;
  } catch(e) {
    console.warn('Web search falhou:', e);
    return null;
  }
}

/*══════════════════════════════════════════════════════════════════
  ENVIAR
══════════════════════════════════════════════════════════════════*/
function handleKey(e) {
  if (e.key === 'Enter' &amp;amp;&amp;amp; !e.shiftKey) { e.preventDefault(); send(); }
}
function adjustHeight(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 130) + 'px';
}
function setPrompt(txt) {
  const el = document.getElementById('msgInput');
  el.value = txt; adjustHeight(el); el.focus();
}

async function send(textOverride) {
  const el = document.getElementById('msgInput');
  const text = (textOverride || el.value).trim();
  if (!text) return;

  if (window.speechSynthesis) {
    const u = new SpeechSynthesisUtterance(' '); u.volume = 0;
    window.speechSynthesis.speak(u);
  }

  document.getElementById('emptyState')?.remove();
  el.value = ''; el.style.height = '44px';
  localStorage.removeItem('cia_draft');

  history.push({ role:'user', content:text });
  appendMsg('user', text);
  scheduleSave();

  controller = new AbortController();
  document.getElementById('sendBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'flex';

  const { content: contentEl } = appendMsg('bot', '', true);

  // BUSCA WEB se ativada
  let webContext = '';
  if (webOn) {
    const note = document.createElement('div');
    note.className = 'progress';
    note.textContent = '🌐 Buscando na internet...';
    contentEl.appendChild(note);
    const result = await webSearch(text);
    note.remove();
    if (result) {
      webContext = '\n\n[CONTEXTO DA WEB — use estas informações atuais]:\n'+result+'\n[FIM DO CONTEXTO]';
      const ok = document.createElement('div');
      ok.className = 'progress';
      ok.textContent = '✓ Resultados da web incorporados';
      contentEl.appendChild
      contentEl.appendChild(ok);
      setTimeout(() =&amp;gt; ok.remove(), 2000);
    } else {
      const fail = document.createElement('div');
      fail.className = 'progress';
      fail.style.color = '#f87171';
      fail.textContent = '⚠️ Busca web falhou — continuando sem contexto extra';
      contentEl.appendChild(fail);
      setTimeout(() =&amp;gt; fail.remove(), 2500);
    }
  }

  try {
    const key   = apiKey.trim();
    const url   = (document.getElementById('urlInput').value || apiUrl || 'https://api.groq.com/openai/v1').trim().replace(/\/$/, '');
    const model = document.getElementById('modelInput').value || apiModel || 'llama-3.3-70b-versatile';

    if (!key) {
      contentEl.innerHTML = '&amp;lt;span style=&amp;quot;color:#60a5fa&amp;quot;&amp;gt;⚠️ Configure uma chave de API em ⚙️. Groq é gratuito: &amp;lt;a href=&amp;quot;https://console.groq.com&amp;quot; target=&amp;quot;_blank&amp;quot; style=&amp;quot;color:#7ec87a&amp;quot;&amp;gt;console.groq.com&amp;lt;/a&amp;gt;&amp;lt;/span&amp;gt;';
      history.pop();
      scheduleSave();
      return;
    }

    // Monta mensagens (injeta contexto web se houver)
    let msgs = [...history];
    if (webContext) {
      const last = msgs[msgs.length - 1];
      msgs[msgs.length - 1] = { role:'user', content:last.content + webContext };
    }

    const endpoint = url + '/chat/completions';
    const headers = {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + key,
      'HTTP-Referer': location.origin,
      'X-Title': 'Chat IA Pro',
    };
    const body = JSON.stringify({ model, messages: msgs, stream: true, max_tokens: 16384 });

    const resp = await fetch(endpoint, { method:'POST', headers, body, signal: controller.signal });

    if (!resp.ok) {
      const errText = await resp.text();
      let msg = 'Erro ' + resp.status;
      try { msg = JSON.parse(errText)?.error?.message || msg; } catch {}
      contentEl.innerHTML = '&amp;lt;span style=&amp;quot;color:'+getCSSVar('--err')+'&amp;quot;&amp;gt;❌ ' + esc(msg) + '&amp;lt;/span&amp;gt;';
      history.pop();
      scheduleSave();
      return;
    }

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let full = '', buf = '';

    const cursor = document.createElement('span');
    cursor.className = 'cursor-blink';
    contentEl.appendChild(cursor);

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream:true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const j = line.slice(6).trim();
        if (j === '[DONE]') continue;
        try {
          const p = JSON.parse(j);
          if (p.error) throw new Error(typeof p.error === 'string' ? p.error : p.error.message || 'Erro do provedor');
          const delta = p.choices?.[0]?.delta?.content || p.text || p.content || '';
          if (delta) {
            full += delta;
            cursor.remove();
            contentEl.innerHTML = renderMarkdown(full);
            contentEl.appendChild(cursor);
            scrollBottom();
          }
        } catch(e) { if (e instanceof SyntaxError) continue; throw e; }
      }
    }

    cursor.remove();
    if (full) {
      contentEl.innerHTML = renderMarkdown(full);
      history.push({ role:'assistant', content:full });
      scheduleSave();
      if (ttsOn) speakText(full);
    }

  } catch (err) {
    if (err.name === 'AbortError') {
      contentEl.innerHTML += '&amp;lt;em style=&amp;quot;color:var(--muted);font-size:11px&amp;quot;&amp;gt; [parado]&amp;lt;/em&amp;gt;';
    } else {
      contentEl.innerHTML = '&amp;lt;span style=&amp;quot;color:var(--err)&amp;quot;&amp;gt;❌ ' + esc(err.message) + '&amp;lt;/span&amp;gt;';
      history.pop();
      scheduleSave();
    }
  } finally {
    controller = null;
    document.getElementById('sendBtn').style.display = 'flex';
    document.getElementById('stopBtn').style.display = 'none';
    scrollBottom();
    addCopyListeners();
  }
}

function abortStream() { controller?.abort(); }

/*══════════════════════════════════════════════════════════════════
  RENDERIZAÇÃO
══════════════════════════════════════════════════════════════════*/
function appendMsg(role, text, streaming, isRestore) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  const content = document.createElement('div');
  content.className = 'msg-content';

  if (role === 'user') {
    content.textContent = text;
  } else if (streaming) {
    content.innerHTML = '';
  } else {
    content.innerHTML = renderMarkdown(text);
  }

  bubble.appendChild(content);
  wrap.appendChild(bubble);

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  if (role === 'bot') {
    const prov = apiKey ? (detectProvider(apiKey)?.name || 'IA') : 'IA';
    const btn = document.createElement('button');
    btn.innerHTML = '📋 Copiar';
    btn.onclick = function() { copyText(this, content.textContent); };
    const lbl = document.createElement('span');
    lbl.className = 'prov-label';
    lbl.textContent = prov;
    meta.appendChild(lbl);
    meta.appendChild(btn);
  } else {
    const btn = document.createElement('button');
    btn.innerHTML = '📋 Copiar';
    btn.onclick = function() { copyText(this, text); };
    meta.appendChild(btn);
  }
  wrap.appendChild(meta);

  document.getElementById('chat').appendChild(wrap);
  if (!isRestore) scrollBottom();
  return { el: wrap, content };
}

let copyBlockId = 0;
function renderMarkdown(text) {
  let html = esc(text);
  html = html.replace(/```(\w*?)\n([\s\S]*?)```/g, function(_, lang, code) {
    const id = 'cb' + (++copyBlockId);
    return (
      '&amp;lt;div class=&amp;quot;code-block&amp;quot;&amp;gt;' +
        '&amp;lt;div class=&amp;quot;code-header&amp;quot;&amp;gt;' +
          '&amp;lt;span&amp;gt;' + (lang || 'código') + '&amp;lt;/span&amp;gt;' +
          '&amp;lt;button class=&amp;quot;copy-btn&amp;quot; data-copy=&amp;quot;'+escAttr(code)+'&amp;quot; id=&amp;quot;'+id+'&amp;quot;&amp;gt;📋 Copiar&amp;lt;/button&amp;gt;' +
        '&amp;lt;/div&amp;gt;' +
        '&amp;lt;div class=&amp;quot;code-body&amp;quot;&amp;gt;' + code + '&amp;lt;/div&amp;gt;' +
      '&amp;lt;/div&amp;gt;'
    );
  });
  html = html.replace(/`([^`\n]+?)`/g, '&amp;lt;span class=&amp;quot;inline-code&amp;quot;&amp;gt;$1&amp;lt;/span&amp;gt;');
  html = html.replace(/\*\*([^*]+?)\*\*/g, '&amp;lt;strong&amp;gt;$1&amp;lt;/strong&amp;gt;');
  html = html.replace(/\*([^*]+?)\*/g, '&amp;lt;em&amp;gt;$1&amp;lt;/em&amp;gt;');
  html = html.replace(/(https?:\/\/[^\s&amp;lt;&amp;gt;&amp;quot;']+)/g, '&amp;lt;a href=&amp;quot;$1&amp;quot; target=&amp;quot;_blank&amp;quot; rel=&amp;quot;noopener&amp;quot;&amp;gt;$1&amp;lt;/a&amp;gt;');
  html = html.replace(/\n/g, '&amp;lt;br&amp;gt;');
  return html;
}

function addCopyListeners() {
  document.querySelectorAll('.copy-btn[data-copy]').forEach(btn =&amp;gt; {
    if (btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.onclick = function() { copyText(this, this.dataset.copy); };
  });
}

function copyText(btn, text) {
  navigator.clipboard.writeText(text || '').catch(() =&amp;gt; {});
  const orig = btn.innerHTML;
  btn.innerHTML = '✓ Copiado!';
  setTimeout(() =&amp;gt; { btn.innerHTML = orig; }, 1800);
}

function scrollBottom() {
  const c = document.getElementById('chat');
  c.scrollTop = c.scrollHeight;
}

/*══════════════════════════════════════════════════════════════════
  EXPORTAR — TXT, MD, JSON, PDF
══════════════════════════════════════════════════════════════════*/
function exportConv(format) {
  if (!history.length) { toast('Nada para exportar','err'); return; }
  const date = new Date().toLocaleString('pt-BR');
  let content = '', mime = 'text/plain', ext = format;

  if (format === 'txt') {
    const lines = ['=== CONVERSA — Chat IA Pro ===', 'Data: '+date, ''];
    history.forEach(m =&amp;gt; {
      lines.push('['+(m.role==='user'?'VOCÊ':'IA')+']');
      lines.push(m.content); lines.push('');
    });
    content = lines.join('\n');
  }
  else if (format === 'md') {
    const lines = ['# Conversa Chat IA Pro', '&amp;gt; '+date, ''];
    history.forEach(m =&amp;gt; {
      lines.push('### '+(m.role==='user'?'🧑 Você':'🤖 IA'));
      lines.push(''); lines.push(m.content); lines.push('');
    });
    content = lines.join('\n');
    mime = 'text/markdown';
  }
  else if (format === 'json') {
    content = JSON.stringify({
      title: history.find(m=&amp;gt;m.role==='user')?.content?.slice(0,60) || 'Conversa',
      exportedAt: date,
      provider: apiKey ? (detectProvider(apiKey)?.name || 'Custom') : 'Demo',
      messages: history,
    }, null, 2);
    mime = 'application/json';
  }
  else if (format === 'pdf') {
    // PDF via janela de impressão
    const w = window.open('', '_blank');
    const html = ['&amp;lt;!DOCTYPE html&amp;gt;&amp;lt;html&amp;gt;&amp;lt;head&amp;gt;&amp;lt;meta charset=&amp;quot;UTF-8&amp;quot;&amp;gt;&amp;lt;title&amp;gt;Conversa&amp;lt;/title&amp;gt;',
      '&amp;lt;style&amp;gt;',
      'body{font-family:Georgia,serif;max-width:780px;margin:30px auto;padding:0 20px;color:#222;line-height:1.6}',
      'h1{color:#2d4a1e;border-bottom:2px solid #5aab56;padding-bottom:8px}',
      '.meta{color:#666;font-size:12px;margin-bottom:20px}',
      '.msg{margin:16px 0;padding:12px 16px;border-radius:8px;page-break-inside:avoid}',
      '.user{background:#e8f5e9;border-left:4px solid #5aab56}',
      '.bot{background:#f5f5f5;border-left:4px solid #888}',
      '.role{font-weight:bold;font-size:11px;text-transform:uppercase;color:#555;margin-bottom:4px}',
      'pre{background:#0d1309;color:#a8d5a2;padding:10px;border-radius:6px;overflow-x:auto;font-size:12px}',
      'code{background:#eee;padding:1px 4px;border-radius:3px;font-size:12px}',
      '@media print { body{margin:0} }',
      '&amp;lt;/style&amp;gt;&amp;lt;/head&amp;gt;&amp;lt;body&amp;gt;',
      '&amp;lt;h1&amp;gt;Conversa — Chat IA Pro&amp;lt;/h1&amp;gt;',
      '&amp;lt;div class=&amp;quot;meta&amp;quot;&amp;gt;Exportado em '+date+' · '+history.length+' mensagens&amp;lt;/div&amp;gt;'];
    history.forEach(m =&amp;gt; {
      const safe = esc(m.content).replace(/\n/g,'&amp;lt;br&amp;gt;');
      html.push('&amp;lt;div class=&amp;quot;msg '+(m.role==='user'?'user':'bot')+'&amp;quot;&amp;gt;');
      html.push('&amp;lt;div class=&amp;quot;role&amp;quot;&amp;gt;'+(m.role==='user'?'🧑 Você':'🤖 IA')+'&amp;lt;/div&amp;gt;');
      html.push('&amp;lt;div&amp;gt;'+safe+'&amp;lt;/div&amp;gt;&amp;lt;/div&amp;gt;');
    });
    html.push('&amp;lt;script&amp;gt;window.onload=()=&amp;gt;setTimeout(()=&amp;gt;window.print(),300)&amp;lt;\/script&amp;gt;&amp;lt;/body&amp;gt;&amp;lt;/html&amp;gt;');
    w.document.write(html.join(''));
    w.document.close();
    toast('PDF: use &amp;quot;Salvar como PDF&amp;quot; na impressão');
    return;
  }

  const blob = new Blob([content], { type: mime+';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'conversa-' + Date.now() + '.' + ext;
  a.click();
  toast('Exportado: ' + ext.toUpperCase());
}

/*══════════════════════════════════════════════════════════════════
  IMPORTAR — TXT, MD, CSV, JSON, PDF
══════════════════════════════════════════════════════════════════*/
async function importFile(e) {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!file) return;

  const name = file.name.toLowerCase();
  const el = document.getElementById('msgInput');

  try {
    let txt = '';

    if (name.endsWith('.pdf')) {
      toast('📕 Lendo PDF...');
      txt = await extractPDF(file);
    }
    else if (name.endsWith('.json')) {
      const raw = await file.text();
      try {
        const j = JSON.parse(raw);
        // Se for conversa exportada, oferecer importar
        if (j.messages &amp;amp;&amp;amp; Array.isArray(j.messages)) {
          if (confirm('Este JSON é uma conversa exportada. Restaurar como nova conversa?')) {
            history = j.messages;
            currentConvId = null;
            restoreUI();
            scheduleSave();
            togglePanel('ioPanel','ioBtn');
            toast('Conversa importada ✓');
            return;
          }
        }
        txt = JSON.stringify(j, null, 2);
      } catch { txt = raw; }
    }
    else {
      txt = await file.text();
    }

    if (txt) {
      el.value = el.value ? el.value + '\n\n' + txt : txt;
      adjustHeight(el);
      autoSaveDraft();
      togglePanel('ioPanel','ioBtn');
      toast('Arquivo importado ('+txt.length+' chars)');
    }
  } catch(err) {
    toast('Erro: '+err.message, 'err');
  }
}

async function extractPDF(file) {
  if (typeof pdfjsLib === 'undefined') throw new Error('PDF.js não carregou');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const pages = [];
  for (let i = 1; i &amp;lt;= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    pages.push('--- Página '+i+' ---\n' + tc.items.map(it =&amp;gt; it.str).join(' '));
  }
  return pages.join('\n\n');
}

/*══════════════════════════════════════════════════════════════════
  OCR — Imagem para texto
══════════════════════════════════════════════════════════════════*/
async function importImage(e) {
  const file = e.target.files?.[0];
  e.target.value = '';
  if (!file) return;

  if (typeof Tesseract === 'undefined') { toast('Tesseract não carregou','err'); return; }

  const el = document.getElementById('msgInput');
  const progress = document.createElement('div');
  progress.className = 'progress';
  progress.style.position = 'fixed';
  progress.style.top = '60px';
  progress.style.left = '50%';
  progress.style.transform = 'translateX(-50%)';
  progress.style.zIndex = '1000';
  progress.textContent = '🔍 OCR iniciando...';
  document.body.appendChild(progress);

  try {
    const { data } = await Tesseract.recognize(file, 'por+eng', {
      logger: m =&amp;gt; {
        if (m.status === 'recognizing text') {
          progress.textContent = '🔍 OCR: ' + Math.round(m.progress*100) + '%';
        } else if (m.status) {
          progress.textContent = '🔍 ' + m.status + '...';
        }
      }
    });
    const txt = (data?.text || '').trim();
    if (txt) {
      el.value = el.value ? el.value + '\n\n[OCR]\n' + txt : '[OCR]\n' + txt;
      adjustHeight(el);
      autoSaveDraft();
      togglePanel('ioPanel','ioBtn');
      toast('OCR concluído ('+txt.length+' chars)');
    } else {
      toast('Nenhum texto encontrado na imagem','err');
    }
  } catch(err) {
    toast('Erro OCR: '+err.message,'err');
  } finally {
    progress.remove();
  }
}

async function restoreBackup(e) {

  try {

      for (const c of data.conversations) await dbPut('conversations', c);

    renderSavedKeys();
    await renderConvList();

    toast('Erro: backup inválido','err');
  }
}

/*══════════════════════════════════════════════════════════════════
  VOZ — STT
══════════════════════════════════════════════════════════════════*/
function toggleVoice() {
  if (isRecording) { stopVoice(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Use Chrome ou Edge para voz','err'); return; }

  recog = new SR();
  recog.lang = 'pt-BR';
  recog.continuous = true;
  recog.interimResults = true;

  let fullText = '';
  const schedSend = () =&amp;gt; {
    clearTimeout(silTimer);
    silTimer = setTimeout(() =&amp;gt; {
      try { recog.stop(); } catch {}
      if (fullText.trim()) { setPrompt(''); send(fullText.trim()); }
    }, 1800);
  };

  recog.onresult = ev =&amp;gt; {
    let final = '', interim = '';
    for (let i = 0; i &amp;lt; ev.results.length; i++) {
      if (ev.results[i].isFinal) final += ev.results[i][0].transcript;
      else interim += ev.results[i][0].transcript;
    }
    fullText = final || interim;
    document.getElementById('msgInput').value = fullText;
    adjustHeight(document.getElementById('msgInput'));
    if (fullText) schedSend();
  };

  recog.onerror = recog.onend = () =&amp;gt; {
    clearTimeout(silTimer);
    isRecording = false;
    recog = null;
    document.getElementById('micBtn').classList.remove('listening');
  };

  try { recog.start(); } catch { return; }
  isRecording = true;
  document.getElementById('micBtn').classList.add('listening');
}

function stopVoice() {
  try { recog?.stop(); } catch {}
  recog = null;
  isRecording = false;
  clearTimeout(silTimer);
  document.getElementById('micBtn').classList.remove('listening');
}

/*══════════════════════════════════════════════════════════════════
  TTS
══════════════════════════════════════════════════════════════════*/
function toggleTTS() {
  ttsOn = !ttsOn;
  localStorage.setItem('cia_tts', ttsOn ? 'on' : 'off');
  document.getElementById('ttsBtn').style.opacity = ttsOn ? '1' : '0.4';
  if (!ttsOn) window.speechSynthesis?.cancel();
}

function speakText(text) {
  if (!ttsOn || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/&amp;lt;[^&amp;gt;]+&amp;gt;/g, '').replace(/[`*#]/g, '').substring(0, 800);
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'pt-BR';
  window.speechSynthesis.speak(u);
}

/*══════════════════════════════════════════════════════════════════
  UTILS
══════════════════════════════════════════════════════════════════*/
function esc(s) {
  return String(s)
    .replace(/&amp;amp;/g,'&amp;amp;amp;').replace(/&amp;lt;/g,'&amp;amp;lt;')
    .replace(/&amp;gt;/g,'&amp;amp;gt;').replace(/&amp;quot;/g,'&amp;amp;quot;');
}
function escAttr(s) { return esc(s).replace(/'/g,'&amp;amp;#39;'); }
function getCSSVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

let toastTimer;
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', type === 'err');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() =&amp;gt; t.classList.remove('show'), 2500);
}

// Salvar antes de fechar
window.addEventListener('beforeunload', () =&amp;gt; {
  if (history.length) autoSave();
  autoSaveDraft();
});

* { box-sizing: border-box; margin: 0; padding: 0; }
:root {

html, body { height: 100%; background: var(--bg); color: var(--text); font-family: Arial, sans-serif; overflow: hidden; }

/* ── LAYOUT ── */

/* ── HEADER ── */
.header {

}
.header-title { font-size: 13px; font-weight: 700; color: var(--amber2); display: flex; align-items: center; gap: 6px; flex: 1; }
.badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; border: 1px solid; white-space: nowrap; }
.badge-demo  { background: #78350f33; color: #fbbf24; border-color: #92400e55; }
.badge-ok    { background: #14532d33; color: #4ade80; border-color: #16653355; }
.badge-pro   { background: #4c1d9533; color: var(--purple); border-color: #8b5cf633; }
.btn-icon { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 8px; color: var(--muted); display: flex; align-items: center; }
.btn-icon:hover { background: #ffffff10; color: var(--text); }
.btn-icon.ativo { background: #ffffff15; color: var(--text); }

/* ── PAINEL CONFIG ── */
.config-panel {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 12px 14px;
  display: none; flex-direction: column; gap: 10px;
  flex-shrink: 0; max-height: 60vh; overflow-y: auto;
}
.config-panel.aberto { display: flex; }
.config-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
.config-row { display: flex; gap: 6px; align-items: center; }
.inp {
  flex: 1; height: 32px; padding: 0 10px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 11px; outline: none;
  font-family: monospace;
}
.inp:focus { border-color: var(--amber); }
.inp-sm { width: 130px; flex: none; }
.provider-tag { font-size: 10px; color: var(--amber2); white-space: nowrap; }

/* ── ABAS ── */
.tabs {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex; flex-shrink: 0; overflow-x: auto;
}
.tab-btn {
  flex: 1; padding: 9px 4px; font-size: 11px; font-weight: 600;
  background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--muted); cursor: pointer; transition: all .15s;
  white-space: nowrap; min-width: 80px;
}
.tab-btn.ativo { border-bottom-color: var(--amber); color: var(--amber2); }

/* ── BARRA ESFORÇO ── */
.effort-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px; background: #1a2411;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.effort-label { font-size: 10px; font-weight: 700; white-space: nowrap; }
.effort-bar input[type=range] { flex: 1; accent-color: var(--amber); height: 3px; }
.verbosity-btn {
  font-size: 10px; padding: 3px 10px; border-radius: 20px;
  border: 1px solid; cursor: pointer; background: none; white-space: nowrap;
}

/* ── CONTEÚDO ── */
.content { flex: 1; overflow-y: auto; }
.tab-pane { display: none; padding: 12px 14px; }
.tab-pane.ativo { display: block; }

/* ── TEXTAREA ── */
textarea {
  width: 100%; resize: none;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); font-size: 12px;
  padding: 10px 12px; outline: none; line-height: 1.6; font-family: Arial;
}

/* ── BOTÕES ── */
.btn {
  display: inline-flex; align-items: center; gap: 5px;

// ══════════════════════════════════════════════════════
async function importarArquivo(input) {
  const file = input.files[0]; input.value = '';
  if (!file) return;
  const sp = document.getElementById('import-spinner');
  sp.classList.remove('hidden');
  try {
    const ext = file.name.split('.').pop().toLowerCase();
    let texto = '';
    if (ext === 'pdf') {
      texto = await extrairPDF(file);
    } else if (ext === 'docx' || ext === 'doc') {
      texto = await extrairDOCX(file);
    } else if (ext === 'md' || ext === 'markdown') {
      texto = await file.text();
    } else {
      texto = await file.text();
    }
    if (!texto.trim()) throw new Error('Arquivo sem texto legível.');
    const ta = document.getElementById('txt-processo');
    ta.value = ta.value ? ta.value + '\n\n' + texto : texto;
  } catch(e) { alert('Erro ao importar: ' + e.message); }
  finally { sp.classList.add('hidden'); }
}

async function extrairPDF(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let texto = '';
  for (let i = 1; i &amp;lt;= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    texto += content.items.map(it =&amp;gt; it.str).join(' ') + '\n';
  }
  return texto;
}

async function extrairDOCX(file) {
  const buf = await file.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer: buf });
  return result.value;
}

// ══════════════════════════════════════════════════════
//  OCR (IMAGEM)
// ══════════════════════════════════════════════════════
async function importarImagem(input) {
  const file = input.files[0]; input.value = '';
  if (!file) return;
  const sp = document.getElementById('import-spinner');
  sp.classList.remove('hidden');
  try {
    const worker = await Tesseract.createWorker('por');
    const { data: { text } } = await worker.recognize(file);
    await worker.terminate();
    if (!text.trim()) throw new Error('Não foi possível extrair texto da imagem.');
    const ta = document.getElementById('txt-processo');
    ta.value = ta.value ? ta.value + '\n\n' + text : text;
  } catch(e) { alert('Erro no OCR: ' + e.message); }
  finally { sp.classList.add('hidden'); }
}

function toggleVoz() {
  if (isListening) { recognition?.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Use Chrome ou Edge para ditar por voz.'); return; }
  recognition = new SR();
  recognition.lang = 'pt-BR'; recognition.continuous = true; recognition.interimResults = true;
  let fullText = ''; let timer = null;
  const scheduleStop = () =&amp;gt; {
    if (timer) clearTimeout(timer);
    timer = setTimeout(() =&amp;gt; { try { recognition.stop(); } catch {} }, 1800);
  };
  recognition.onresult = e =&amp;gt; {
    let f = '', itr = '';
    for (let i = 0; i &amp;lt; e.results.length; i++) {
      if (e.results[i].isFinal) f += e.results[i][0].transcript;
      else itr += e.results[i][0].transcript;
    }
    fullText = f || itr;
    if (fullText) scheduleStop();
  };
  recognition.onend = () =&amp;gt; {
    if (timer) clearTimeout(timer);
    isListening = false;
    document.getElementById('btn-voz').textContent = '🎤 Ditar';
    if (fullText.trim()) {
      const ta = document.getElementById('txt-processo');
      ta.value = ta.value ? ta.value.trimEnd() + '\n\n' + fullText.trim() : fullText.trim();
    }
  };
  recognition.onerror = () =&amp;gt; { isListening = false; document.getElementById('btn-voz').textContent = '🎤 Ditar'; };
  recognition.start();
  isListening = true;
  document.getElementById('btn-voz').textContent = '🔴 Parar';
}

// ══════════════════════════════════════════════════════
//  CHAMADAS DE API
// ══════════════════════════════════════════════════════
async function chamarGemini(chave, msgs, modelo) {
  modelo = modelo || 'gemini-1.5-flash';
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${chave}`;
  const system = msgs.find(m =&amp;gt; m.role === 'system');
  const contents = msgs.filter(m =&amp;gt; m.role !== 'system').map(m =&amp;gt; ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.content }]
  }));
  if (system &amp;amp;&amp;amp; contents.length &amp;gt; 0) contents[0].parts[0].text = system.content + '\n\n' + contents[0].parts[0].text;
  const resp = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents, generationConfig: { temperature: 0.7 } })
  });
  if (!resp.ok) { const e = await resp.json().catch(()=&amp;gt;({})); throw new Error(e.error?.message || `Gemini erro ${resp.status}`); }
  const d = await resp.json();
  return d.candidates[0].content.parts[0].text;
}

async function chamarOpenAI(chave, msgs, modelo, baseUrl) {
  modelo = modelo || 'gpt-4o';
  baseUrl = baseUrl || 'https://api.openai.com/v1';
  const resp = await fetch(`${baseUrl}/chat/completions`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${chave}` },
    body: JSON.stringify({ model: modelo, messages: msgs, temperature: 0.7, stream: false })
  });
  if (!resp.ok) { const e = await resp.json().catch(()=&amp;gt;({})); throw new Error(e.error?.message || `OpenAI erro ${resp.status}`); }
  const d = await resp.json();
  return d.choices[0].message.content;
}

async function chamarClaude(chave, msgs, modelo) {
  modelo = modelo || 'claude-haiku-3-5';
  const system = msgs.find(m =&amp;gt; m.role === 'system');
  const messages = msgs.filter(m =&amp;gt; m.role !== 'system');
  const body = { model: modelo, max_tokens: 8192, messages, temperature: 0.7 };
  if (system) body.system = system.content;
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': chave,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify(body)
  });
  if (!resp.ok) { const e = await resp.json().catch(()=&amp;gt;({})); throw new Error(e.error?.message || `Claude erro ${resp.status}`); }
  const d = await resp.json();
  return d.content[0].text;
}

async function chamarGroq(chave, msgs, modelo) {
  modelo = modelo || 'llama-3.3-70b-versatile';
  return chamarOpenAI(chave, msgs, modelo, 'https://api.groq.com/openai/v1');
}

async function chamarIA(chave, msgs, modeloOverride) {
  const prov = detectProvider(chave);
  const modelo = modeloOverride || getModelo() || '';
  if (prov === 'Gemini')  return chamarGemini(chave, msgs, modelo || 'gemini-1.5-pro');
  if (prov === 'Claude')  return chamarClaude(chave, msgs, modelo || 'claude-haiku-3-5');
  if (prov === 'Groq')    return chamarGroq(chave, msgs, modelo);
  return chamarOpenAI(chave, msgs, modelo || 'gpt-4o');
}

// ══════════════════════════════════════════════════════
//  EXECUTAR AÇÃO PRINCIPAL
// ══════════════════════════════════════════════════════
async function executar(acao, customPrompt) {
  const texto = document.getElementById('txt-processo').value.trim();
  if (!texto) { alert('Cole ou importe o texto do documento antes.'); return; }

  const kr = getChaveResumo();
  const kg = getChaveGeracao();

  // Ementas selecionadas
  const emsTexto = [...emsSelected].map(id =&amp;gt; {
    const em = ementas.find(e =&amp;gt; e.id === id);
    return em ? `[${em.titulo} — ${em.categoria}]\n${em.texto}` : '';
  }).filter(Boolean).join('\n\n');

  const jurisManual = document.getElementById('txt-juris').value.trim();
  const jurisFull = [jurisManual, emsTexto].filter(Boolean).join('\n\n');

  setLoading(true);
  document.getElementById('badge-demo').classList.add('hidden');

  try {
    let textoFinal = texto;

    // ── PASSO 1: Resumir/limpar com Gemini (se chave disponível e texto longo) ──
    if (kr &amp;amp;&amp;amp; texto.length &amp;gt; 1500) {
      atualizarResultado('⏳ Limpando e resumindo o texto com Gemini...');
      const resumoMsgs = [
        { role: 'system', content: 'Você é um assistente jurídico. Resuma o texto abaixo de forma objetiva, mantendo todos os fatos relevantes, partes, pedidos, decisões e fundamentos legais. Elimine cabeçalhos de página, rodapés, certificados digitais e repetições.' },
        { role: 'user', content: texto }
      ];
      textoFinal = await chamarGemini(kr, resumoMsgs, 'gemini-1.5-flash');
      textoResumido = textoFinal;
    }

    // ── PASSO 2: Gerar peça com chave principal ──
    const promptSistema = buildPromptSistema(acao, customPrompt);
    const userContent = jurisFull
      ? `${textoFinal}\n\n---\nJURISPRUDÊNCIA E EMENTAS PARA CITAR:\n${jurisFull}`
      : textoFinal;

    const msgs = [
      { role: 'system', content: promptSistema },
      { role: 'user', content: userContent }
    ];

    let resposta = '';
    if (kg) {
      atualizarResultado('⏳ Gerando peça...');
      resposta = await chamarIA(kg, msgs);
    } else {
      // Demo: usa Gemini Flash gratuito se tiver chave de resumo, senão avisa
      if (kr) {
        atualizarResultado('⏳ Gerando (modo demo com Gemini)...');
        resposta = await chamarGemini(kr, msgs, 'gemini-1.5-flash');
        document.getElementById('badge-demo').classList.remove('hidden');
      } else {
        atualizarResultado('⚠️ Configure ao menos uma chave de API em ⚙️ Configurações.');
        setLoading(false);
        return;
      }
    }

    // Salvar resultado
    resultado = resposta;
    renderResultado(resposta);
    chatHistory = [
      { role: 'system', content: 'Você é um advogado consultor jurídico experiente de Minas Gerais. Responda de forma direta e técnica.' },
      { role: 'user', content: `O documento gerado foi:\n\n${resposta}` },
      { role: 'assistant', content: 'Entendido. Estou pronto para refinar.' }
    ];

    // Salvar no histórico
    const labelAcao = customPrompt
      ? (acoesCustom.find(a =&amp;gt; a.id === acao)?.label || 'Ação Custom')
      : ({ resumir:'Resumir', revisar:'Revisar', refinar:'Refinar', simplificar:'Linguagem Simples', minuta:'Gerar Minuta', analisar:'Analisar', 'modo-estrito':'Corrigir Texto', 'modo-redacao':'Redação Jurídica', 'modo-interativo':'Verificar Lacunas' }[acao] || acao);
    historico = [{ id: Date.now().toString(), acao: labelAcao, inputSnippet: texto.substring(0,120), resultado: resposta, timestamp: new Date().toLocaleString('pt-BR') }, ...historico].slice(0,15);
    saveLS('aj_historico', historico);
    renderHistorico();

  } catch(e) {
    if (e.name === 'AbortError') return;
    atualizarResultado('❌ Erro: ' + e.message);
  } finally {
    setLoading(false);
  }
}

// ══════════════════════════════════════════════════════
//  RENDER RESULTADO
// ══════════════════════════════════════════════════════
function atualizarResultado(txt) {
  document.getElementById('secao-resultado').classList.remove('hidden');
  const box = document.getElementById('resultado-box');
  box.innerHTML = '';
  box.textContent = txt;
}

function renderResultado(txt) {
  document.getElementById('secao-resultado').classList.remove('hidden');
  const box = document.getElementById('resultado-box');
  box.innerHTML = '';
  const blocks = txt.split(/\n{2,}/);
  blocks.forEach(block =&amp;gt; {
    const t = block.trim(); if (!t) return;
    const p = document.createElement('p');
    const lines = t.split('\n');
    const isSingle = lines.length === 1;
    const isTitulo = isSingle &amp;amp;&amp;amp; t === t.toUpperCase() &amp;amp;&amp;amp; t.length &amp;gt; 2 &amp;amp;&amp;amp; /[A-ZÁÉÍÓÚÃÕ]/.test(t) &amp;amp;&amp;amp; !/^\d+\./.test(t);
    const isLista  = /^\d+[.)]\s/.test(t) || /^[a-z]\)/.test(t) || /^[-–]\s/.test(t);
    const isCitacao = (t.startsWith('&amp;quot;') || t.startsWith('\u201c')) &amp;amp;&amp;amp; t.length &amp;gt; 60;
    if (isTitulo)  p.className = 'titulo-peca';
    else if (isLista)   p.className = 'item-lista';
    else if (isCitacao) p.className = 'citacao';
    else p.className = 'paragrafo';
    lines.forEach((l, i) =&amp;gt; { if (i &amp;gt; 0) p.appendChild(document.createElement('br')); p.appendChild(document.createTextNode(l)); });
    box.appendChild(p);
  });
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function baixarRtf() {
  if (!resultado) return;
  const rtf = `{\\rtf1\\ansi\\deff0\n{\\fonttbl{\\f0 Times New Roman;}}\n{\\f0\\fs26\n${
    resultado.split(/\n\n+/).map(block =&amp;gt; {
      const t = block.trim(); if (!t) return '';

        return `\\pard\\qj\\b ${t.replace(/[\\{}]/g,'\\$&amp;amp;')}\\b0\\par\\par`;
      if (/^\d+[.)]\s/.test(t) || /^[-–]\s/.test(t))
        return `\\pard\\qj\\li720 ${t.replace(/[\\{}]/g,'\\$&amp;amp;')}\\par\\par`;
      return `\\pard\\qj\\fi2268 ${t.replace(/[\\{}]/g,'\\$&amp;amp;')}\\par\\par`;
    }).join('\n')
  }\n}}`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rtf], { type: 'application/rtf' }));
