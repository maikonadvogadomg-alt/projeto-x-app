    &lt;/div&gt;

    &lt;!-- Hidden Input for File Import --&gt;
    &lt;input type=&quot;file&quot; id=&quot;fileInput&quot; accept=&quot;.html,.htm,.css,.js,.jsx,.py,.txt&quot; style=&quot;display: none;&quot;&gt;

    &lt;script&gt;
        // ===== STATE MANAGEMENT =====
        const state = {
            mode: 'html',
            activeTab: 'html',
            html: localStorage.getItem('playground_html') || '&lt;div style=&quot;max-width: 600px; margin: 40px auto; padding: 20px; font-family: sans-serif;&quot;&gt;&lt;h1 style=&quot;color: #333;&quot;&gt;Bem-vindo ao HTML Playground&lt;/h1&gt;&lt;p style=&quot;color: #666; margin: 16px 0;&quot;&gt;Cole seu código HTML aqui e veja o resultado ao vivo!&lt;/p&gt;&lt;button onclick=&quot;alert(\'Funcionou!\')&quot; style=&quot;padding: 10px 24px; font-size: 16px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer;&quot;&gt;Clique aqui&lt;/button&gt;&lt;/div&gt;',
            css: localStorage.getItem('playground_css') || '',
            js: localStorage.getItem('playground_js') || '',
            react: localStorage.getItem('playground_react') || 'function App() {\n  return (\n    &lt;div style={{padding: &quot;20px&quot;, fontFamily: &quot;sans-serif&quot;}}&gt;\n      &lt;h1&gt;React Playground&lt;/h1&gt;\n      &lt;p&gt;Escreva seu código React aqui!&lt;/p&gt;\n    &lt;/div&gt;\n  );\n}',
            python: localStorage.getItem('playground_python') || 'print(&quot;Hello, Python!&quot;)\nprint(&quot;Escreva seu código Python aqui&quot;)',
            title: localStorage.getItem('playground_title') || 'Sem titulo',
            snippets: JSON.parse(localStorage.getItem('playground_snippets') || '[]'),
            autoRun: true,
            mobileView: 'editor'
        };

        // ===== DOM ELEMENTS =====
        const elements = {
            projectTitle: document.getElementById('projectTitle'),
            htmlEditor: document.getElementById('htmlEditor'),
            cssEditor: document.getElementById('cssEditor'),
            jsEditor: document.getElementById('jsEditor'),
            reactEditor: document.getElementById('reactEditor'),
            pythonEditor: document.getElementById('pythonEditor'),
            previewFrame: document.getElementById('previewFrame'),
            pythonOutput: document.getElementById('pythonOutput'),
            lineNumbers: document.getElementById('lineNumbers'),
            lineCount: document.getElementById('lineCount'),
            searchInput: document.getElementById('searchInput'),
            editorSection: document.getElementById('editorSection'),
            previewSection: document.getElementById('previewSection'),
            editorToggle: document.getElementById('editorToggle'),
            previewToggle: document.getElementById('previewToggle'),
            snippetsModal: document.getElementById('snippetsModal'),
            snippetList: document.getElementById('snippetList'),
            modalSearchInput: document.getElementById('modalSearchInput'),
            fileInput: document.getElementById('fileInput'),
            runBtn: document.getElementById('runBtn'),
            mobileToggle: document.querySelector('.mobile-toggle'),
            separator1: document.getElementById('separator1')
        };

        // ===== INITIALIZATION =====
        function init() {
            loadState();
            setupEventListeners();
            updateEditors();
            updatePreview();
            checkMobileView();
            window.addEventListener('resize', checkMobileView);
        }

        function loadState() {
            elements.projectTitle.value = state.title;
            elements.htmlEditor.value = state.html;
            elements.cssEditor.value = state.css;
            elements.jsEditor.value = state.js;
            elements.reactEditor.value = state.react;
            elements.pythonEditor.value = state.python;
        }

        function saveState() {
            localStorage.setItem('playground_html', state.html);
            localStorage.setItem('playground_css', state.css);
            localStorage.setItem('playground_js', state.js);
            localStorage.setItem('playground_react', state.react);
            localStorage.setItem('playground_python', state.python);
            localStorage.setItem('playground_title', state.title);
            localStorage.setItem('playground_snippets', JSON.stringify(state.snippets));
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // Mode selector
            document.querySelectorAll('[data-mode]').forEach(btn =&gt; {
                btn.addEventListener('click', () =&gt; switchMode(btn.dataset.mode));
            });

            // Tab selector
            document.querySelectorAll('[data-tab]').forEach(btn =&gt; {
                btn.addEventListener('click', () =&gt; switchTab(btn.dataset.tab));
            });

            // Editors
            elements.htmlEditor.addEventListener('input', (e) =&gt; {
                state.html = e.target.value;
                updateLineNumbers();
                updatePreview();
                saveState();
            });

            elements.cssEditor.addEventListener('input', (e) =&gt; {
                state.css = e.target.value;
                updatePreview();
                saveState();
            });

            elements.jsEditor.addEventListener('input', (e) =&gt; {
                state.js = e.target.value;
                updatePreview();
                saveState();
            });

            elements.reactEditor.addEventListener('input', (e) =&gt; {
                state.react = e.target.value;
                updateLineNumbers();
                updatePreview();
                saveState();
            });

            elements.pythonEditor.addEventListener('input', (e) =&gt; {
                state.python = e.target.value;
                updateLineNumbers();
                saveState();
            });

            // Title
            elements.projectTitle.addEventListener('change', (e) =&gt; {
                state.title = e.target.value || 'Sem titulo';
                saveState();
            });

            // Search
            elements.searchInput.addEventListener('input', (e) =&gt; {
                const query = e.target.value.toLowerCase();
                const editor = getCurrentEditor();
                highlightSearchResults(editor, query);
            });

            // Buttons
            document.getElementById('importBtn').addEventListener('click', () =&gt; elements.fileInput.click());
            document.getElementById('fullscreenBtn').addEventListener('click', openFullscreen);
            document.getElementById('copyBtn').addEventListener('click', copyCode);
            document.getElementById('downloadBtn').addEventListener('click', downloadCode);
            document.getElementById('saveBtn').addEventListener('click', saveSnippet);
            document.getElementById('openBtn').addEventListener('click', openSnippets);
            document.getElementById('resetBtn').addEventListener('click', resetCode);
            document.getElementById('clearBtn').addEventListener('click', clearCode);
            document.getElementById('runBtn').addEventListener('click', runPython);

            // Mobile toggle
            elements.editorToggle?.addEventListener('click', () =&gt; {
                state.mobileView = 'editor';
                updateMobileView();
            });

            elements.previewToggle?.addEventListener('click', () =&gt; {
                state.mobileView = 'preview';
                updateMobileView();
            });

            // File import
            elements.fileInput.addEventListener('change', handleFileImport);

            // Modal
            document.getElementById('closeModal').addEventListener('click', () =&gt; {
                elements.snippetsModal.classList.remove('active');
            });

            elements.modalSearchInput.addEventListener('input', (e) =&gt; {
                filterSnippets(e.target.value);
            });

            // Close modal on outside click
            elements.snippetsModal.addEventListener('click', (e) =&gt; {
                if (e.target === elements.snippetsModal) {
                    elements.snippetsModal.classList.remove('active');
                }
            });
        }

        // ===== MODE &amp; TAB SWITCHING =====
        function switchMode(mode) {
            state.mode = mode;
            state.activeTab = mode === 'html' ? 'html' : mode;

            // Update mode buttons
            document.querySelectorAll('[data-mode]').forEach(btn =&gt; {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });

            // Update tab visibility
            updateTabVisibility();
            updateEditors();
            updatePreview();
        }

        function switchTab(tab) {
            state.activeTab = tab;

            // Update tab buttons
            document.querySelectorAll('[data-tab]').forEach(btn =&gt; {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });

            // Update editor visibility
            updateEditors();
            updateLineNumbers();
        }

        function updateTabVisibility() {
            const tabs = document.querySelectorAll('[data-tab]');
            tabs.forEach(tab =&gt; tab.classList.add('hidden'));

            if (state.mode === 'html') {
                document.querySelector('[data-tab=&quot;html&quot;]')?.classList.remove('hidden');
                document.querySelector('[data-tab=&quot;css&quot;]')?.classList.remove('hidden');
                document.querySelector('[data-tab=&quot;js&quot;]')?.classList.remove('hidden');
            } else if (state.mode === 'react') {
                document.querySelector('[data-tab=&quot;html&quot;]')?.classList.remove('hidden');
                document.querySelector('[data-tab=&quot;html&quot;]').textContent = 'JSX';
            } else if (state.mode === 'python') {
                document.querySelector('[data-tab=&quot;html&quot;]')?.classList.remove('hidden');
                document.querySelector('[data-tab=&quot;html&quot;]').textContent = 'Python';
            }
        }

        function updateEditors() {
            elements.htmlEditor.classList.add('hidden');
            elements.cssEditor.classList.add('hidden');
            elements.jsEditor.classList.add('hidden');
            elements.reactEditor.classList.add('hidden');
            elements.pythonEditor.classList.add('hidden');

            if (state.mode === 'html') {
                if (state.activeTab === 'html') elements.htmlEditor.classList.remove('hidden');
                else if (state.activeTab === 'css') elements.cssEditor.classList.remove('hidden');
                else if (state.activeTab === 'js') elements.jsEditor.classList.remove('hidden');
            } else if (state.mode === 'react') {
                elements.reactEditor.classList.remove('hidden');
            } else if (state.mode === 'python') {
                elements.pythonEditor.classList.remove('hidden');
                elements.runBtn.style.display = 'flex';
            } else {
                elements.runBtn.style.display = 'none';
            }

            updateLineNumbers();
        }

        // ===== LINE NUMBERS =====
        function updateLineNumbers() {
            const editor = getCurrentEditor();
            const lines = editor.value.split('\n').length;
            elements.lineCount.textContent = `${lines} linhas`;

            let html = '';
            for (let i = 1; i &lt;= lines; i++) {
                html += `&lt;div class=&quot;line-number&quot;&gt;${i}&lt;/div&gt;`;
            }
            elements.lineNumbers.innerHTML = html;
        }

        // ===== SEARCH &amp; HIGHLIGHT =====
        function highlightSearchResults(editor, query) {
            if (!query) {
                editor.style.backgroundColor = 'transparent';
                return;
            }

            const text = editor.value;
            const regex = new RegExp(query, 'gi');
            let count = 0;
            while (regex.exec(text)) count++;

            if (count &gt; 0) {
                showMessage(`${count} resultado(s) encontrado(s)`);
            }
        }

        // ===== PREVIEW =====
        function updatePreview() {
            if (state.mode === 'python') {
                elements.pythonOutput.classList.remove('hidden');
                elements.previewFrame.classList.add('hidden');
                return;
            }

            elements.pythonOutput.classList.add('hidden');
            elements.previewFrame.classList.remove('hidden');

            let html;

            if (state.mode === 'react') {
                html = buildReactDocument();
            } else {
                html = buildHtmlDocument();
            }

            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            elements.previewFrame.src = url;
        }

        function buildHtmlDocument() {
            return `&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
    &lt;meta charset=&quot;UTF-8&quot;&gt;
    &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
    &lt;style&gt;${state.css}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
    ${state.html}
    &lt;script&gt;${state.js}&lt;\/script&gt;
&lt;/body&gt;
&lt;/html&gt;`;
        }

        function buildReactDocument() {
            return `&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
    &lt;meta charset=&quot;UTF-8&quot;&gt;
    &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
    &lt;script crossorigin src=&quot;https://unpkg.com/react@18/umd/react.development.js&quot;&gt;&lt;\/script&gt;
    &lt;script crossorigin src=&quot;https://unpkg.com/react-dom@18/umd/react-dom.development.js&quot;&gt;&lt;\/script&gt;
    &lt;script src=&quot;https://unpkg.com/@babel/standalone/babel.min.js&quot;&gt;&lt;\/script&gt;
    &lt;style&gt;* { box-sizing: border-box; } body { margin: 0; font-family: sans-serif; } ${state.css}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;div id=&quot;root&quot;&gt;&lt;/div&gt;
    &lt;script type=&quot;text/babel&quot;&gt;
        const { useState, useEffect, useRef, useCallback } = React;
        ${state.react}
        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(&lt;App /&gt;);
        } catch(e) {
            document.getElementById('root').innerHTML = '&lt;div style=&quot;color:red;padding:20px;font-family:monospace;white-space:pre-wrap&quot;&gt;Erro: ' + e.message + '&lt;/div&gt;';
        }
    &lt;\/script&gt;
&lt;/body&gt;
&lt;/html&gt;`;
        }

        // ===== PYTHON EXECUTION =====
        async function runPython() {
            elements.runBtn.disabled = true;
            elements.pythonOutput.innerHTML = '&lt;span class=&quot;output-info&quot;&gt;⟳ Executando...&lt;/span&gt;';

            try {
                const response = await fetch('/api/code/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: state.python, language: 'python' })
                });

                const data = await response.json();

                if (data.error) {
                    elements.pythonOutput.innerHTML = `&lt;span class=&quot;output-error&quot;&gt;${escapeHtml(data.error)}&lt;/span&gt;`;
                } else {
                    elements.pythonOutput.innerHTML = `&lt;span class=&quot;output-success&quot;&gt;$ python3\n${escapeHtml(data.output || '')}&lt;/span&gt;`;
                }
            } catch (error) {
                elements.pythonOutput.innerHTML = `&lt;span class=&quot;output-error&quot;&gt;Erro: ${error.message}&lt;/span&gt;`;
            } finally {
                elements.runBtn.disabled = false;
            }
        }

        // ===== FILE OPERATIONS =====
        function handleFileImport(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) =&gt; {
                const content = event.target.result;
                const ext = file.name.split('.').pop().toLowerCase();

                if (ext === 'py') {
                    state.mode = 'python';
                    state.python = content;
                    switchMode('python');
                } else if (ext === 'jsx' || ext === 'tsx') {
                    state.mode = 'react';
                    state.react = content;
                    switchMode('react');
                } else {
                    state.mode = 'html';
                    state.html = content;
                    switchMode('html');
                }

                state.title = file.name.replace(/\.[^.]+$/, '');
                elements.projectTitle.value = state.title;
                saveState();
                showMessage(`✅ Arquivo &quot;${file.name}&quot; importado!`);
            };

            reader.readAsText(file);
            e.target.value = '';
        }

        function openFullscreen() {
            const html = state.mode === 'react' ? buildReactDocument() : buildHtmlDocument();
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        }

        function copyCode() {
            const code = state.mode === 'react' ? buildReactDocument() : 
                        state.mode === 'python' ? state.python :
                        buildHtmlDocument();
            navigator.clipboard.writeText(code);
            showMessage('✅ Código copiado!');
        }

        function downloadCode() {
            let content, filename, ext;

            if (state.mode === 'python') {
                content = state.python;
                ext = 'py';
            } else if (state.mode === 'react') {
                content = state.react;
                ext = 'jsx';
            } else {
                content = buildHtmlDocument();
                ext = 'html';
            }

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${state.title || 'playground'}.${ext}`;
            a.click();
            URL.revokeObjectURL(url);
            showMessage(`✅ Arquivo .${ext} baixado!`);
        }

        // ===== SNIPPETS =====
        function saveSnippet() {
            if (!state.title || state.title === 'Sem titulo') {
                showMessage('⚠️ Dê um nome ao projeto primeiro!');
                return;
            }

            const snippet = {
                id: Date.now().toString(),
                title: state.title,
                mode: state.mode,
                html: state.html,
                css: state.css,
                js: state.js,
                react: state.react,
                python: state.python,
                date: new Date().toLocaleString('pt-BR')
            };

            state.snippets = state.snippets.filter(s =&gt; s.title !== state.title);
            state.snippets.unshift(snippet);
            saveState();
            showMessage('✅ Código salvo!');
        }

        function openSnippets() {
            elements.snippetsModal.classList.add('active');
            renderSnippets();
        }

        function renderSnippets(filter = '') {
            const filtered = state.snippets.filter(s =&gt;
                s.title.toLowerCase().includes(filter.toLowerCase())
            );

            elements.snippetList.innerHTML = filtered.length === 0
                ? '&lt;p style=&quot;text-align: center; color: var(--text-secondary); padding: 2rem;&quot;&gt;Nenhum código salvo&lt;/p&gt;'
                : filtered.map(s =&gt; `
                    &lt;div class=&quot;snippet-item&quot; onclick=&quot;loadSnippet('${s.id}')&quot;&gt;
                        &lt;div class=&quot;snippet-info&quot;&gt;
                            &lt;div class=&quot;snippet-title&quot;&gt;${escapeHtml(s.title)}&lt;/div&gt;
                            &lt;div class=&quot;snippet-meta&quot;&gt;${s.mode.toUpperCase()} • ${s.date}&lt;/div&gt;
                        &lt;/div&gt;
                        &lt;div class=&quot;snippet-actions&quot;&gt;
                            &lt;button class=&quot;btn&quot; onclick=&quot;deleteSnippet('${s.id}', event)&quot;&gt;🗑️&lt;/button&gt;
                        &lt;/div&gt;
                    &lt;/div&gt;
                `).join('');
        }

        function loadSnippet(id) {
            const snippet = state.snippets.find(s =&gt; s.id === id);
            if (!snippet) return;

            state.mode = snippet.mode;
            state.html = snippet.html;
            state.css = snippet.css;
            state.js = snippet.js;
            state.react = snippet.react;
            state.python = snippet.python;
            state.title = snippet.title;

            elements.projectTitle.value = state.title;
            loadState();
            switchMode(state.mode);
            elements.snippetsModal.classList.remove('active');
            showMessage(`✅ &quot;${snippet.title}&quot; carregado!`);
        }

        function deleteSnippet(id, event) {
            event.stopPropagation();
            state.snippets = state.snippets.filter(s =&gt; s.id !== id);
            saveState();
            renderSnippets(elements.modalSearchInput.value);
            showMessage('✅ Código removido!');
        }

        function filterSnippets(query) {
            renderSnippets(query);
        }

        // ===== UTILITIES =====
        function getCurrentEditor() {
            if (state.mode === 'react') return elements.reactEditor;
            if (state.mode === 'python') return elements.pythonEditor;
            if (state.activeTab === 'css') return elements.cssEditor;
            if (state.activeTab === 'js') return elements.jsEditor;
            return elements.htmlEditor;
        }

        function resetCode() {
            if (state.mode === 'python') {
                state.python = 'print(&quot;Hello, Python!&quot;)';
            } else if (state.mode === 'react') {
                state.react = 'function App() {\n  return &lt;h1&gt;React App&lt;/h1&gt;;\n}';
            } else {
                state.html = '&lt;h1&gt;Novo projeto&lt;/h1&gt;';
                state.css = '';
                state.js = '';
            }
            loadState();
            updatePreview();
            saveState();
            showMessage('🔄 Código restaurado!');
        }

        function clearCode() {
            if (confirm('Tem certeza? Isso limpará todo o código.')) {
                if (state.mode === 'python') {
                    state.python = '';
                } else if (state.mode === 'react') {
                    state.react = '';
                } else {
                    state.html = '';
                    state.css = '';
                    state.js = '';
                }
                loadState();
                updatePreview();
                saveState();
                showMessage('🗑️ Código limpo!');
            }
        }

        function escapeHtml(text) {
            const map = {
                '&amp;': '&amp;amp;',
                '&lt;': '&amp;lt;',
                '&gt;': '&amp;gt;',
                '&quot;': '&amp;quot;',
                &quot;'&quot;: '&amp;#039;'
            };
            return text.replace(/[&amp;&lt;&gt;&quot;']/g, m =&gt; map[m]);
        }

        function showMessage(text) {
            const msg = document.createElement('div');
            msg.className = 'status-message';
            msg.textContent = text;
            document.body.appendChild(msg);
            setTimeout(() =&gt; msg.remove(), 3000);
        }

        // ===== MOBILE VIEW =====
        function checkMobileView() {
            const isMobile = window.innerWidth &lt;= 768;
            elements.mobileToggle.classList.toggle('hidden', !isMobile);
            elements.separator1.classList.toggle('hidden', !isMobile);

            if (isMobile) {
                updateMobileView();
            } else {
                elements.editorSection.classList.remove('hidden', 'full');
                elements.previewSection.classList.remove('hidden', 'full');
            }
        }

        function updateMobileView() {
            if (state.mobileView === 'editor') {
                elements.editorSection.classList.remove('hidden', 'full');
                elements.previewSection.classList.add('hidden');
                elements.editorToggle.classList.add('active');
                elements.previewToggle.classList.remove('active');
            } else {
                elements.editorSection.classList.add('hidden');
                elements.previewSection.classList.remove('hidden');
                elements.previewSection.classList.add('full');
                elements.editorToggle.classList.remove('active');
                elements.previewToggle.classList.add('active');
            }
        }

        // ===== START =====
        init();
    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
</div>

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}

.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30}

pre.ln{counter-reset:ln}

&lt;div class=&quot;wrap&quot;&gt;

    &lt;button role=&quot;tab&quot; data-tab=&quot;modular&quot; aria-selected=&quot;false&quot;&gt;&lt;span class=&quot;n&quot;&gt;4&lt;/span&gt;Modularizar&lt;/button&gt;
  &lt;/nav&gt;

  &lt;!-- 1. IMPORTAR --&gt;
  &lt;section id=&quot;tab-importar&quot; class=&quot;stack&quot;&gt;
    &lt;div id=&quot;exBanner&quot; class=&quot;banner&quot; hidden&gt;
      &lt;span&gt;Você está vendo uma &lt;b&gt;conversa de exemplo&lt;/b&gt;. Importe o seu arquivo e o exemplo some sozinho.&lt;/span&gt;
    &lt;/div&gt;

      &lt;div class=&quot;stack&quot;&gt;

          &lt;strong&gt;Solte aqui o arquivo da conversa&lt;/strong&gt;

          &lt;span class=&quot;kinds&quot;&gt;.md  .txt  .zip  .html  .js  .css  .py  .json (organização salva)&lt;/span&gt;
          &lt;input id=&quot;fileIn&quot; type=&quot;file&quot; multiple hidden accept=&quot;.md,.markdown,.txt,.zip,.html,.htm,.js,.mjs,.jsx,.ts,.tsx,.css,.scss,.json,.py,.sh,.bat,.ps1,.xml,.svg,.yml,.yaml,.sql,.php,.vue&quot;&gt;
        &lt;/label&gt;

          &lt;h3&gt;Ou cole o texto da conversa&lt;/h3&gt;

      &lt;/div&gt;

        &lt;div class=&quot;panel stack&quot;&gt;
          &lt;h3&gt;Como funciona&lt;/h3&gt;
          &lt;ol class=&quot;how&quot;&gt;
            &lt;li&gt;Tudo roda no seu navegador. O arquivo não é enviado para lugar nenhum.&lt;/li&gt;
            &lt;li&gt;Cada bloco de código da conversa vira um cartão, separado por tipo. O nome do arquivo é lido do texto em volta (ex.: “salve como &lt;span class=&quot;mono&quot;&gt;js/app.js&lt;/span&gt;”).&lt;/li&gt;

            &lt;li&gt;No Projeto você baixa tudo em .zip, com guia de montagem e comandos para criar as pastas.&lt;/li&gt;

        &lt;div class=&quot;panel stack&quot;&gt;

  &lt;!-- 2. BLOCOS --&gt;

  &lt;!-- 3. PROJETO --&gt;

function parseConversation(text, srcName, ctx){

  const id = S.nextId++;
  return { id, src: srcName, line: 1, turn: 0, speaker: '', type, code: text, lines: text.split('\n').length, name: p, how: 'arquivo', path: p, sig: computeSig(type, text) };
}
function clearExample(){ if (S.example){ S = fresh(); } }
async function importFiles(fileList){
  const files = [...fileList]; if (!files.length) return;
  clearExample();
  let before = S.blocks.length, skipped = 0;
  for (const f of files){
    const ext = extOf(f.name);
    try {
      if (ext === 'zip'){
        if (!needZip()) continue;
        const z = await JSZip.loadAsync(f);
        let entries = Object.values(z.files).filter(e =&gt; !e.dir &amp;&amp; !/(^|\/)(__MACOSX|\.git|node_modules)\//.test(e.name) &amp;&amp; !/(^|\/)\.DS_Store$/.test(e.name));
        const tops = new Set(entries.map(e =&gt; e.name.split('/')[0]));
        const strip = tops.size === 1 &amp;&amp; entries.every(e =&gt; e.name.includes('/'));
        const blocks = [];
        for (const e of entries){
          const ex = extOf(e.name); const rel = strip ? e.name.split('/').slice(1).join('/') : e.name;
          if (!TEXT_EXT.has(ex) &amp;&amp; ex !== ''){ skipped++; continue; }
          const txt = await e.async('string');
          if (ex === 'md' || ex === 'markdown' || ex === 'txt'){ const ctx = { nextId: S.nextId }; const r = parseConversation(txt, f.name + '/' + rel, ctx); S.nextId = ctx.nextId;
            if (r.blocks.length) addParsed(r, f.name + '/' + rel, txt.length, 'conversa'); else blocks.push(fileBlock(txt, rel, f.name)); }
          else blocks.push(fileBlock(txt, rel, f.name));
        }
        if (blocks.length){ S.blocks.push(...blocks); S.sources.push({ name: f.name, size: f.size, blocks: blocks.length, kind: 'zip' }); }
      } else if (ext === 'json'){
        const txt = await f.text(); let o = null; try { o = JSON.parse(txt); } catch(e){}
        if (o &amp;&amp; o.app === 'triagem-codigo' &amp;&amp; Array.isArray(o.blocks)){ S = Object.assign(fresh(), o); S.example = false; toast('Organização restaurada: ' + fmt(S.blocks.length) + ' blocos'); before = -1; continue; }
        S.blocks.push(fileBlock(txt, f.name, f.name)); S.sources.push({ name: f.name, size: f.size, blocks: 1, kind: 'arquivo' });
      } else if (ext === 'md' || ext === 'markdown' || ext === 'txt' || ext === ''){
        const txt = await f.text(); const ctx = { nextId: S.nextId }; const r = parseConversation(txt, f.name, ctx); S.nextId = ctx.nextId;
        addParsed(r, f.name, f.size, 'conversa');
      } else if (TEXT_EXT.has(ext)){
        const txt = await f.text(); S.blocks.push(fileBlock(txt, f.name, f.name)); S.sources.push({ name: f.name, size: f.size, blocks: 1, kind: 'arquivo' });
      } else skipped++;
    } catch(e){ toast('Não consegui ler ' + f.name + ': ' + (e.message || e)); }
  }
  suggestNames();
  persist(); renderAll();
  if (before &gt;= 0){
    const n = S.blocks.length - before;
    toast(n ? fmt(n) + ' blocos de código encontrados' + (skipped ? ' (' + skipped + ' arquivos de imagem ou binários ignorados)' : '') : 'Nenhum bloco de código encontrado. Os códigos precisam estar entre ``` no arquivo.');
    if (n) setTab('blocos');
  } else setTab('projeto');
}

  const ctx = { nextId: 1 }; const txt = $('#exemploMd').value; const r = parseConversation(txt, 'exemplo-conversa.md', ctx); S.nextId = ctx.nextId;

function blockMatches(b, ch){
  if (F.type !== 'all' &amp;&amp; b.type !== F.type) return false;
  if (F.show === 'named' &amp;&amp; !b.name) return false;
  if (F.show === 'unnamed' &amp;&amp; b.name) return false;
  if (F.show === 'chosen' &amp;&amp; !ch.has(b.id)) return false;
  if (F.q){ const q = F.q.toLowerCase(); if (!b.path.toLowerCase().includes(q) &amp;&amp; !b.code.toLowerCase().includes(q)) return false; }
  return true;
}

function openCompare(path, idA, idB){
  const list = groups().get(path); if (!list) return;
  const A = list.find(b =&gt; b.id === idA), B = list.find(b =&gt; b.id === idB);
  const opt = sel =&gt; list.map((b,i) =&gt; '&lt;option value=&quot;' + b.id + '&quot;' + (b.id===sel?' selected':'') + '&gt;versão ' + (i+1) + ' · ' + fmt(b.lines) + ' linhas · bloco #' + b.id + '&lt;/option&gt;').join('');
  const fa = new Set(fnNames(A.code)), fb = new Set(fnNames(B.code));
  const onlyA = [...fa].filter(x =&gt; !fb.has(x)), onlyB = [...fb].filter(x =&gt; !fa.has(x));
  let diffHTML = '';
  if (window.Diff &amp;&amp; A.lines + B.lines &lt; 16000){
    const parts = Diff.diffLines(A.code, B.code); let h = '';
    for (const p of parts){
      const ls = p.value.replace(/\n$/,'').split('\n');
      if (p.added) h += '&lt;span class=&quot;a&quot;&gt;' + ls.map(l =&gt; '+ ' + esc(l)).join('\n') + '&lt;/span&gt;';
      else if (p.removed) h += '&lt;span class=&quot;d&quot;&gt;' + ls.map(l =&gt; '− ' + esc(l)).join('\n') + '&lt;/span&gt;';
      else if (ls.length &gt; 6) h += '&lt;span&gt;' + ls.slice(0,2).map(l =&gt; '  ' + esc(l)).join('\n') + '&lt;/span&gt;&lt;span class=&quot;s&quot;&gt;  … ' + fmt(ls.length-4) + ' linhas iguais …&lt;/span&gt;&lt;span&gt;' + ls.slice(-2).map(l =&gt; '  ' + esc(l)).join('\n') + '&lt;/span&gt;';
      else h += '&lt;span&gt;' + ls.map(l =&gt; '  ' + esc(l)).join('\n') + '&lt;/span&gt;';
    }
    diffHTML = '&lt;pre class=&quot;code diff&quot;&gt;' + h + '&lt;/pre&gt;';
  } else diffHTML = '&lt;p class=&quot;note&quot;&gt;Arquivos grandes demais para comparar linha a linha aqui. Veja a lista de funções acima.&lt;/p&gt;';
  openDialog(path, 'Comparar versões', '',
    '&lt;div class=&quot;row-flex&quot;&gt;&lt;label class=&quot;note&quot; for=&quot;cmpA&quot;&gt;De&lt;/label&gt;&lt;select id=&quot;cmpA&quot;&gt;' + opt(idA) + '&lt;/select&gt;&lt;label class=&quot;note&quot; for=&quot;cmpB&quot;&gt;para&lt;/label&gt;&lt;select id=&quot;cmpB&quot;&gt;' + opt(idB) + '&lt;/select&gt;&lt;/div&gt;' +
    '&lt;div class=&quot;meta&quot;&gt;' + fmt(A.lines) + ' → ' + fmt(B.lines) + ' linhas&lt;/div&gt;' +
    (fa.size || fb.size ? '&lt;div class=&quot;fnlist&quot;&gt;&lt;b&gt;Funções que só existem na primeira:&lt;/b&gt; ' + (onlyA.length ? esc(onlyA.join(', ')) : 'nenhuma') + '&lt;br&gt;&lt;b&gt;Funções novas na segunda:&lt;/b&gt; ' + (onlyB.length ? esc(onlyB.join(', ')) : 'nenhuma') + '&lt;/div&gt;' : '') +
    '&lt;p class=&quot;note&quot; style=&quot;margin:0&quot;&gt;Linhas com + entraram, linhas com − saíram.&lt;/p&gt;' + diffHTML);
  const re = () =&gt; openCompare(path, +$('#cmpA').value, +$('#cmpB').value);
  $('#cmpA').addEventListener('change', re); $('#cmpB').addEventListener('change', re);
}

function treeText(root, paths){
  const t = {}; paths.forEach(p =&gt; { let n = t; p.split('/').forEach((seg, i, a) =&gt; { n[seg] = n[seg] || (i === a.length-1 ? null : {}); if (n[seg]) n = n[seg]; }); });
  const lines = [root + '/'];
  const walk = (node, pre) =&gt; { const ks = Object.keys(node).sort((a,b) =&gt; ((node[a]===null) - (node[b]===null)) || a.localeCompare(b)); ks.forEach((k, i) =&gt; { const last = i === ks.length-1; lines.push(pre + (last ? '└─ ' : '├─ ') + k + (node[k] ? '/' : '')); if (node[k]) walk(node[k], pre + (last ? '   ' : '│  ')); }); };
  walk(t, ''); if (!paths.length) lines.push('└─ (vazio)');
  return lines.join('\n');
}
function renderGuide(files){
  const G = $('#guide');

function renderCmds(files){
  const root = S.projectName || 'projeto'; const dirs = new Set([root]);
  files.forEach(f =&gt; { const segs = f.path.split('/'); for (let i=1;i&lt;segs.length;i++) dirs.add(root + '/' + segs.slice(0,i).join('/')); });
  const fps = files.map(f =&gt; root + '/' + f.path); const D = [...dirs].sort();
  const win = p =&gt; p.replace(/\//g, '\\');
  let out = '', hint = '';
  if (shell === 'cmd'){ out = D.map(d =&gt; 'if not exist &quot;' + win(d) + '&quot; mkdir &quot;' + win(d) + '&quot;').join('\n') + '\n' + fps.map(f =&gt; 'if not exist &quot;' + win(f) + '&quot; type nul &gt; &quot;' + win(f) + '&quot;').join('\n'); hint = 'Abra o Prompt de Comando na pasta onde quer criar o projeto (na barra de endereço do Explorer, digite cmd e Enter) e cole. Arquivos que já existem não são apagados.'; }
  else if (shell === 'ps'){ out = D.map(d =&gt; 'New-Item -ItemType Directory -Force -Path &quot;' + win(d) + '&quot; | Out-Null').join('\n') + '\n' + fps.map(f =&gt; 'if (!(Test-Path &quot;' + win(f) + '&quot;)) { New-Item -ItemType File -Path &quot;' + win(f) + '&quot; | Out-Null }').join('\n'); hint = 'No PowerShell ou no terminal do VS Code (Windows). Arquivos que já existem não são apagados.'; }
  else { out = 'mkdir -p ' + D.map(d =&gt; '&quot;' + d + '&quot;').join(' ') + '\n' + fps.map(f =&gt; 'touch &quot;' + f + '&quot;').join('\n'); hint = 'No Terminal do Linux ou Mac. touch não apaga arquivos existentes.'; }
  $('#cmdOut').textContent = files.length ? out : '# Marque arquivos no projeto primeiro';
  $('#shellHint').textContent = hint;
  $$('#shellSeg button').forEach(b =&gt; b.setAttribute('aria-pressed', String(b.dataset.sh === shell)));
}
function onGroupEvent(e){
  const row = e.target.closest('[data-path]'); if (!row) return; const p = row.dataset.path;
  const a = e.target.closest('[data-act]'); if (!a) return; const act = a.dataset.act;
  const list = groups().get(p);
  if (e.type === 'click'){
    if (act === 'gview'){ const b = chosenOf(p, list); openViewer(b); }
    else if (act === 'gcmp'){ const ch = chosenOf(p, list); const i = list.indexOf(ch); const other = i &gt; 0 ? list[i-1] : list[1]; openCompare(p, other.id, ch.id); }
    else if (act === 'gcopy'){ const b = chosenOf(p, list); copyText(b.code, p); }
    return;
  }
  if (act === 'inc'){ S.included[p] = a.checked; }
  else if (act === 'choose'){ S.chosen[p] = +a.value; }
  else if (act === 'gpath'){ renameGroup(p, a.value); }
  else if (act === 'gdone'){ S.guideDone[a.dataset.key] = a.checked; row.classList.toggle('done', a.checked); persist(); return; }
  persist(); renderProject(); renderStats();
}

    base.file('conversas-sem-codigo/' + t.name.replace(/[\\/:*?&quot;&lt;&gt;|]+/g,'_').replace(/\.(md|txt|markdown)$/i,'') + '.md', '# Conversa sem os códigos (para ler a lógica)\n\nCada código foi trocado por uma linha [CÓDIGO] dizendo em qual arquivo ele está.\n\n' + txt);

function renderModSrc(){
  const sel = $('#modSrc'); const cur = sel.value;
  const opts = sortedGroups().filter(([, l]) =&gt; ['html','js','ts'].includes(l[0].type)).flatMap(([p, l]) =&gt; l.map((b,i) =&gt; ({ b, label: (p.startsWith('sem-nome/') ? 'bloco #' + b.id + ' sem nome' : p) + ' · v' + (i+1) + ' · ' + fmt(b.lines) + ' linhas' + (b.id === chosenOf(p,l).id &amp;&amp; l.length &gt; 1 ? ' (escolhida)' : '') })));

let modLabel = '';

$('#modIn').addEventListener('input', () =&gt; { modLabel = ''; });
const modeVal = () =&gt; document.querySelector('input[name=mode]:checked').value;
$('#anaBtn').addEventListener('click', () =&gt; {
  const src = $('#modIn').value; if (!src.trim()){ toast('Cole um HTML ou JS primeiro'); return; }
  let an; try { an = analyzeInput(src); } catch(err){ $('#modAn').innerHTML = '&lt;div class=&quot;panel&quot;&gt;&lt;ul class=&quot;warns&quot;&gt;&lt;li&gt;Não consegui analisar este código: ' + esc(err.message) + '&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;'; return; }

function renderAnalysis(){
  const an = lastAn; const ch = an.chunks;
  const nFn = ch.filter(c =&gt; c.kind==='fn'||c.kind==='fnvar').length, nCl = ch.filter(c =&gt; c.kind==='class').length, nVar = ch.filter(c =&gt; c.kind==='var').length, nCode = ch.filter(c =&gt; c.kind==='code'||c.kind==='import').length;
  const mods = [...new Set(ch.filter(isDecl).map(c =&gt; c.module))];
  const kindLabel = { fn:'função', fnvar:'função', class:'classe', var:'variável', code:'inicialização', import:'import' };
  if (!ch.length &amp;&amp; !an.cssParts.length){ $('#modAn').innerHTML = '&lt;div class=&quot;panel&quot;&gt;&lt;p class=&quot;note&quot; style=&quot;margin:0&quot;&gt;Não encontrei JavaScript nem CSS dentro do código. Se o JS está em arquivos separados (script src=…), abra esses arquivos aqui.&lt;/p&gt;&lt;/div&gt;'; return; }
  $('#modAn').innerHTML = '&lt;div class=&quot;panel stack&quot;&gt;&lt;h2&gt;O que encontrei&lt;/h2&gt;' +
    '&lt;p style=&quot;margin:0&quot;&gt;' + [nFn &amp;&amp; fmt(nFn) + ' funç' + (nFn&gt;1?'ões':'ão'), nCl &amp;&amp; nCl + ' classe' + (nCl&gt;1?'s':''), nVar &amp;&amp; nVar + ' declaraç' + (nVar&gt;1?'ões':'ão') + ' de variáveis', nCode &amp;&amp; nCode + ' trecho' + (nCode&gt;1?'s':'') + ' de inicialização', an.cssParts.length &amp;&amp; an.cssParts.length + ' arquivo' + (an.cssParts.length&gt;1?'s':'') + ' de CSS'].filter(Boolean).join(', ') + '. ' +
    (an.sections.length &gt;= 2 ? 'Usei as seções do próprio código: ' + esc(an.sections.join(', ')) + '.' : 'O código não tem títulos de seção, então agrupei pelo nome das funções.') + ' Proposta: ' + mods.length + ' arquivo' + (mods.length===1?'':'s') + ' de funções.&lt;/p&gt;' +
    (an.warnings.length ? '&lt;ul class=&quot;warns&quot;&gt;' + an.warnings.map(w =&gt; '&lt;li&gt;' + esc(w) + '&lt;/li&gt;').join('') + '&lt;/ul&gt;' : '') +
    '&lt;p class=&quot;note&quot; style=&quot;margin:0&quot;&gt;Para mudar o arquivo de uma função, edite a coluna “Vai para”. Use nomes curtos, sem acento (ex.: chat, lista, api).&lt;/p&gt;' +
    '&lt;datalist id=&quot;modNames&quot;&gt;' + mods.map(m =&gt; '&lt;option value=&quot;' + esc(m) + '&quot;&gt;').join('') + '&lt;/datalist&gt;' +
    '&lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Nome&lt;/th&gt;&lt;th&gt;Tipo&lt;/th&gt;&lt;th&gt;Linhas&lt;/th&gt;&lt;th&gt;Linha no original&lt;/th&gt;&lt;th&gt;Vai para&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;' +
    ch.map(c =&gt; '&lt;tr&gt;&lt;td class=&quot;mono&quot;&gt;' + esc(c.names.length ? c.names.join(', ') : (c.text.trim().split('\n').find(l =&gt; l.trim() &amp;&amp; !/^\s*(\/\/|\/\*|\*)/.test(l)) || '').slice(0,48)) + '&lt;/td&gt;&lt;td&gt;' + kindLabel[c.kind] + '&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;' + fmt(c.nlines) + '&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;' + fmt(c.line) + '&lt;/td&gt;&lt;td&gt;' +
      (isDecl(c) ? '&lt;input list=&quot;modNames&quot; data-cid=&quot;' + c.id + '&quot; value=&quot;' + esc(c.module) + '&quot; aria-label=&quot;Arquivo de ' + esc(c.names[0]) + '&quot;&gt;' : '&lt;span class=&quot;mono&quot;&gt;' + (c.kind==='var' ? 'estado' : 'main') + '&lt;/span&gt;') + '&lt;/td&gt;&lt;/tr&gt;').join('') +

function doGenerate(){

    (g.warnings.length ? '&lt;ul class=&quot;warns&quot;&gt;' + g.warnings.map(w =&gt; '&lt;li&gt;' + esc(w) + '&lt;/li&gt;').join('') + '&lt;/ul&gt;' : '') +
    '&lt;div class=&quot;files&quot;&gt;' + g.files.map((f,i) =&gt; '&lt;div class=&quot;frow&quot;&gt;&lt;span class=&quot;p&quot;&gt;' + esc(f.path) + ' &lt;span class=&quot;meta&quot;&gt;(' + fmt(f.content.split('\n').length) + ' linhas)&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;acts&quot;&gt;&lt;button class=&quot;btn small&quot; data-fi=&quot;' + i + '&quot; data-fa=&quot;view&quot;&gt;Ver&lt;/button&gt;&lt;button class=&quot;btn small&quot; data-fi=&quot;' + i + '&quot; data-fa=&quot;copy&quot;&gt;Copiar&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;').join('') + '&lt;/div&gt;' +
    '&lt;div class=&quot;row-flex&quot;&gt;&lt;button class=&quot;btn primary&quot; id=&quot;modZip&quot;&gt;Baixar .zip&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;modToProj&quot;&gt;Adicionar ao Projeto&lt;/button&gt;&lt;/div&gt;' +
    '&lt;details class=&quot;box&quot;&gt;&lt;summary&gt;Ver o MAPA.md&lt;/summary&gt;&lt;div&gt;&lt;pre class=&quot;code&quot; style=&quot;max-height:420px;white-space:pre-wrap&quot;&gt;' + esc(mapa.content) + '&lt;/pre&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;';
}
$('#modOut').addEventListener('click', async e =&gt; {
  const fb = e.target.closest('[data-fi]');
  if (fb){ const f = lastGen.files[+fb.dataset.fi]; if (fb.dataset.fa === 'view') openFileViewer(f.path, f.content); else copyText(f.content, f.path); return; }
  if (e.target.id === 'modZip'){
    if (!needZip()) return;
    const z = new JSZip(); const name = (slug(modLabel.replace(/\.[a-z]+$/i,'')) || 'codigo') + '-modular'; const root = z.folder(name);
    lastGen.files.forEach(f =&gt; root.file(f.path, f.content));
    saveFile(name + '.zip', await z.generateAsync({ type:'blob' }));
  }
  if (e.target.id === 'modToProj'){
    clearExample();
    const src = 'modularizado' + (modLabel ? ': ' + modLabel : '');
    const nb = lastGen.files.filter(f =&gt; !f.path.startsWith('js/_repetidas')).map(f =&gt; fileBlock(f.content, f.path, src));
    S.blocks.push(...nb); nb.forEach(b =&gt; { S.chosen[b.path] = b.id; S.included[b.path] = true; });
    S.sources.push({ name: src, size: nb.reduce((a,b) =&gt; a + b.code.length, 0), blocks: nb.length, kind: 'modular' });
    persist(); renderStats(); toast(nb.length + ' arquivos adicionados ao Projeto como versão escolhida'); setTab('projeto');
  }

.sidebar{
    width:210px;background:var(--bg2);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;overflow:hidden;
    transition:width 0.2s;
}
.sidebar.collapsed{width:0;overflow:hidden;}
.sidebar-header{
    padding:8px 10px;border-bottom:1px solid var(--border);
    font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;
    display:flex;justify-content:space-between;align-items:center;
}
.conversations{flex:1;overflow-y:auto;padding:6px;}
.conv-item{
    padding:7px 9px;border-radius:6px;cursor:pointer;font-size:12px;
    margin-bottom:3px;border:1px solid transparent;
    display:flex;justify-content:space-between;align-items:center;gap:4px;
}
.conv-item:hover{background:var(--bg3);}
.conv-item.active{background:var(--bg3);border-color:var(--accent);}
.conv-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;}
.conv-meta{font-size:10px;color:var(--text2);}
.conv-delete{color:var(--red);cursor:pointer;font-size:13px;opacity:0;flex-shrink:0;}
.conv-item:hover .conv-delete{opacity:1;}

/* ============================================================
   MÓDULO: ÁREA DE CHAT
   ============================================================ */
.chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.chat-toolbar{
    background:var(--bg2);border-bottom:1px solid var(--border);
    padding:6px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
}
.conv-title-edit{
    font-size:13px;font-weight:600;background:transparent;
    border:1px solid transparent;color:var(--text);border-radius:4px;
    padding:2px 6px;cursor:pointer;
}
.conv-title-edit:hover{border-color:var(--border);}
.conv-title-edit:focus{border-color:var(--accent);outline:none;background:var(--bg3);}
.context-info{font-size:11px;color:var(--text2);margin-left:auto;display:flex;align-items:center;gap:6px;}
.context-bar{width:80px;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;}
.context-fill{height:100%;background:var(--green);transition:width 0.3s,background 0.3s;}
.messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.message{display:flex;gap:8px;max-width:100%;}
.message.user{flex-direction:row-reverse;}
.avatar{
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;flex-shrink:0;
}
.message.user .avatar{background:var(--accent);color:#000;}
.message.ai   .avatar{background:var(--purple);color:#000;}
.message.system-msg .avatar{background:var(--yellow);color:#000;}
.message.memory-msg .avatar{background:var(--orange);color:#000;}
.bubble{
    background:var(--bg2);border:1px solid var(--border);
    border-radius:10px;padding:9px 13px;max-width:82%;
    font-size:13px;line-height:1.6;word-break:break-word;
}
.message.user .bubble{background:var(--bg3);border-color:var(--accent);}
.message.memory-msg .bubble{background:var(--bg3);border-color:var(--orange);font-size:12px;}
.bubble pre{
    background:var(--bg);border:1px solid var(--border);
    border-radius:6px;padding:10px;overflow-x:auto;margin:7px 0;position:relative;
}
.bubble code{font-family:'Consolas','Monaco',monospace;font-size:12px;}
.copy-code-btn{
    position:absolute;top:5px;right:5px;padding:2px 7px;font-size:11px;
    background:var(--bg3);border:1px solid var(--border);
    color:var(--text);border-radius:4px;cursor:pointer;
}
.copy-code-btn:hover{background:var(--accent);color:#000;}
.msg-time{font-size:10px;color:var(--text2);margin-top:4px;text-align:right;}

/* ============================================================
   MÓDULO: INPUT AREA
   ============================================================ */
.input-area{background:var(--bg2);border-top:1px solid var(--border);padding:10px 12px;}
.input-options{display:flex;gap:10px;margin-bottom:7px;flex-wrap:wrap;align-items:center;}
.input-options label{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px;cursor:pointer;}
.input-row{display:flex;gap:7px;align-items:flex-end;}
.input-box{
    flex:1;background:var(--bg3);border:1px solid var(--border);
    color:var(--text);padding:9px 11px;border-radius:8px;font-size:13px;
    resize:none;outline:none;min-height:42px;max-height:180px;
    font-family:inherit;line-height:1.5;
}
.input-box:focus{border-color:var(--accent);}

/* ============================================================
   MÓDULO: PAINEL DE CÓDIGO
   ============================================================ */
.code-panel{
    width:400px;background:var(--bg2);border-left:1px solid var(--border);
    display:flex;flex-direction:column;overflow:hidden;transition:width 0.2s;
}
.code-panel.collapsed{width:0;overflow:hidden;}
.code-panel-header{
    padding:8px 10px;border-bottom:1px solid var(--border);
    display:flex;gap:6px;align-items:center;flex-wrap:wrap;
}
.code-panel-header h3{font-size:12px;color:var(--text2);}
.code-tabs{
    display:flex;border-bottom:1px solid var(--border);
    background:var(--bg);overflow-x:auto;min-height:32px;
}
.code-tab{
    padding:6px 12px;font-size:11px;cursor:pointer;
    border-right:1px solid var(--border);white-space:nowrap;
    display:flex;align-items:center;gap:5px;color:var(--text2);
}
.code-tab:hover{background:var(--bg3);color:var(--text);}
.code-tab.active{background:var(--bg2);color:var(--accent);border-bottom:2px solid var(--accent);}
.code-tab-close{opacity:0;color:var(--red);font-size:13px;}
.code-tab:hover .code-tab-close{opacity:1;}
.code-editor-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.code-editor{
    flex:1;background:var(--bg);color:var(--text);border:none;
    padding:10px;font-family:'Consolas','Monaco',monospace;font-size:12px;
    resize:none;outline:none;line-height:1.6;tab-size:2;
}
.code-actions{
    padding:7px 10px;border-top:1px solid var(--border);
    display:flex;gap:6px;flex-wrap:wrap;align-items:center;
}

/* ============================================================
   MÓDULO: PAINEL CÉREBRO (memória)
   ============================================================ */
.brain-panel{
    width:0;background:var(--bg2);border-left:1px solid var(--border);
    display:flex;flex-direction:column;overflow:hidden;transition:width 0.25s;
}
.brain-panel.open{width:300px;}
.brain-header{
    padding:8px 12px;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;
}
.brain-header h3{font-size:13px;color:var(--orange);}
.brain-content{flex:1;overflow-y:auto;padding:10px;}
.memory-item{
    background:var(--bg3);border:1px solid var(--border);
    border-radius:8px;padding:9px 11px;margin-bottom:8px;
    font-size:12px;line-height:1.5;position:relative;
}
.memory-item:hover{border-color:var(--orange);}
.memory-item .mem-time{font-size:10px;color:var(--text2);margin-top:4px;}
.memory-item .mem-del{
    position:absolute;top:6px;right:8px;
    color:var(--red);cursor:pointer;font-size:13px;opacity:0;
}
.memory-item:hover .mem-del{opacity:1;}
.memory-tag{
    display:inline-block;padding:1px 7px;border-radius:10px;
    font-size:10px;margin-right:4px;margin-bottom:3px;
    background:var(--bg);border:1px solid var(--border);color:var(--text2);
}
.memory-tag.code{border-color:var(--accent);color:var(--accent);}
.memory-tag.context{border-color:var(--orange);color:var(--orange);}
.memory-tag.important{border-color:var(--red);color:var(--red);}
.brain-actions{padding:8px 10px;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;}

/* ============================================================
   MÓDULO: MODAIS
   ============================================================ */
.modal-overlay{
    display:none;position:fixed;inset:0;
    background:rgba(0,0,0,0.75);z-index:1000;
    align-items:center;justify-content:center;
}
.modal-overlay.open{display:flex;}
.modal{
    background:var(--bg2);border:1px solid var(--border);
    border-radius:12px;padding:22px;width:520px;
    max-width:95vw;max-height:90vh;overflow-y:auto;
}
.modal h2{font-size:16px;margin-bottom:18px;color:var(--accent);}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:7px 10px;}
.form-group textarea{
    background:var(--bg3);border:1px solid var(--border);color:var(--text);
    border-radius:6px;font-size:12px;outline:none;resize:vertical;
    min-height:70px;font-family:inherit;
}
.range-row{display:flex;align-items:center;gap:8px;}
.range-row input[type=&quot;range&quot;]{flex:1;accent-color:var(--accent);}
.range-val{min-width:45px;text-align:right;font-size:12px;color:var(--accent);}
.api-row{display:flex;gap:6px;}
.api-row input{flex:1;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
.section-title{
    font-size:11px;color:var(--text2);text-transform:uppercase;
    letter-spacing:1px;margin:14px 0 8px;padding-bottom:4px;
    border-bottom:1px solid var(--border);
}

/* ============================================================
   MÓDULO: NOVO CHAT MODAL (confirmação)
   ============================================================ */
.new-chat-modal .modal{width:420px;}

/* ============================================================
   MÓDULO: TOAST
   ============================================================ */
.toast{
    position:fixed;bottom:18px;right:18px;
    background:var(--bg3);border:1px solid var(--border);
    color:var(--text);padding:9px 15px;border-radius:8px;
    font-size:12px;z-index:9999;opacity:0;
    transform:translateY(8px);transition:all 0.25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{border-color:var(--green);color:var(--green);}
.toast.error{border-color:var(--red);color:var(--red);}
.toast.warn{border-color:var(--yellow);color:var(--yellow);}

/* ============================================================
   MÓDULO: LOADING / TYPING
   ============================================================ */
.typing{display:flex;gap:4px;padding:3px 0;}
.typing span{
    width:7px;height:7px;background:var(--text2);
    border-radius:50%;animation:bounce 1.2s infinite;
}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{
    0%,80%,100%{transform:translateY(0);opacity:.4;}
    40%{transform:translateY(-5px);opacity:1;}
}

/* ============================================================
   MÓDULO: SCROLLBAR
   ============================================================ */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--text2);}

.hidden{display:none!important;}
.divider{height:1px;background:var(--border);margin:10px 0;}
