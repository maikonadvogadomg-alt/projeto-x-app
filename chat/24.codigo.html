    &lt;script&gt;
        // =====================
        // ESTADO GLOBAL
        // =====================
        let projeto = null;
        let planoGerado = '';
        let secoes = {};

        // =====================
        // DRAG &amp; DROP
        // =====================
        const uploadArea = document.getElementById('uploadArea');

        uploadArea.addEventListener('dragover', (e) =&gt; {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () =&gt; {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) =&gt; {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) {
                document.getElementById('fileInput').files = e.dataTransfer.files;
                carregarProjeto({ target: { files: [file] } });
            }
        });

        // =====================
        // DETECTAR PROVEDOR IA
        // =====================
        const PROVEDORES = [
            { prefix: &quot;gsk_&quot;, nome: &quot;Groq&quot;, url: &quot;https://api.groq.com/openai/v1&quot;, model: &quot;llama-3.3-70b-versatile&quot; },
            { prefix: &quot;AIza&quot;, nome: &quot;Google Gemini&quot;, url: &quot;https://generativelanguage.googleapis.com/v1beta/openai&quot;, model: &quot;gemini-2.0-flash&quot; },
            { prefix: &quot;sk-&quot;, nome: &quot;OpenAI&quot;, url: &quot;https://api.openai.com/v1&quot;, model: &quot;gpt-4o-mini&quot; },
            { prefix: &quot;sk-or-&quot;, nome: &quot;OpenRouter&quot;, url: &quot;https://openrouter.ai/api/v1&quot;, model: &quot;openai/gpt-4o-mini&quot; },
        ];

        document.getElementById('iaApiKey').addEventListener('input', function() {
            const chave = this.value.trim();
            const provedor = PROVEDORES.find(p =&gt; chave.startsWith(p.prefix));
            const el = document.getElementById('iaProviderDetectado');
            
            if (provedor) {
                el.textContent = `✅ Detectado: ${provedor.nome}`;
                if (projeto) document.getElementById('btnIA').disabled = false;
            } else if (chave) {
                el.textContent = '❓ Chave não reconhecida';
            } else {
                el.textContent = '';
            }
        });

        // =====================
        // CARREGAR PROJETO
        // =====================
        async function carregarProjeto(event) {
            const file = event.target.files[0];
            if (!file) return;

            mostrarLoading();

            const ext = file.name.split('.').pop().toLowerCase();
            projeto = {
                nome: file.name,
                tamanho: file.size,
                arquivos: {},
                tipo: ext
            };

            if (ext === 'zip') {
                projeto = await carregarZIP(file, projeto);
            } else {
                const conteudo = await file.text();
                projeto.arquivos[file.name] = {
                    nome: file.name,
                    caminho: file.name,
                    conteudo: conteudo,
                    tamanho: file.size,
                    tipo: ext
                };
            }

            analisarProjeto();
            mostrarStats();
            document.getElementById('btnGerar').disabled = false;
            
            const chave = document.getElementById('iaApiKey').value.trim();
            if (chave &amp;&amp; PROVEDORES.some(p =&gt; chave.startsWith(p.prefix))) {
                document.getElementById('btnIA').disabled = false;
            }
        }

        async function carregarZIP(file, projeto) {
            const zip = await JSZip.loadAsync(file);
            const arquivos = {};

            for (const [caminho, entrada] of Object.entries(zip.files)) {
                if (!entrada.dir) {
                    const ext = caminho.split('.').pop().toLowerCase();
                    const legivel = ['js','ts','tsx','jsx','html','htm','css','json','txt','md','xml','yaml','yml'].includes(ext);
                    
                    if (legivel) {
                        try {
                            const conteudo = await entrada.async('text');
                            arquivos[caminho] = {
                                nome: caminho.split('/').pop(),
                                caminho: caminho,
                                conteudo: conteudo,
                                tamanho: conteudo.length,
                                tipo: ext
                            };
                        } catch(e) {}
                    }
                }
            }

            projeto.arquivos = arquivos;
            return projeto;
        }

        // =====================
        // ANALISAR PROJETO
        // =====================
        function analisarProjeto() {
            const analise = {
                totalArquivos: Object.keys(projeto.arquivos).length,
                totalLinhas: 0,
                funcoes: [],
                apis: [],
                tipos: [],
                rotas: [],
                componentes: [],
                hooks: [],
                dependencias: {}
            };

            for (const [caminho, arquivo] of Object.entries(projeto.arquivos)) {
                const linhas = arquivo.conteudo.split('\n');
                analise.totalLinhas += linhas.length;

                // Funções
                const funcoes = [...arquivo.conteudo.matchAll(/(?:function|const|let|var)\s+(\w+)\s*=?\s*(?:async\s*)?\(/g)];
                funcoes.forEach(m =&gt; {
                    analise.funcoes.push({
                        nome: m[1],
                        arquivo: caminho,
                        linha: arquivo.conteudo.substring(0, m.index).split('\n').length
                    });
                });

                // APIs
                const apis = [...arquivo.conteudo.matchAll(/(?:fetch|axios\.(?:get|post|put|delete))\s*\(\s*['&quot;`]([^'&quot;`]+)['&quot;`]/g)];
                apis.forEach(m =&gt; {
                    analise.apis.push({
                        url: m[1],
                        arquivo: caminho,
                        linha: arquivo.conteudo.substring(0, m.index).split('\n').length
                    });
                });

                // Tipos/Interfaces (TypeScript)
                if (['ts', 'tsx'].includes(arquivo.tipo)) {
                    const tipos = [...arquivo.conteudo.matchAll(/(?:interface|type)\s+(\w+)/g)];
                    tipos.forEach(m =&gt; {
                        analise.tipos.push({
                            nome: m[1],
                            arquivo: caminho,
                            linha: arquivo.conteudo.substring(0, m.index).split('\n').length
                        });
                    });
                }

                // Componentes React
                if (['jsx', 'tsx'].includes(arquivo.tipo)) {
                    const componentes = [...arquivo.conteudo.matchAll(/(?:function|const)\s+([A-Z]\w+)\s*[=:]?\s*(?:\([^)]*\))?\s*(?:=&gt;)?\s*\{/g)];
                    componentes.forEach(m =&gt; {
                        analise.componentes.push({
                            nome: m[1],
                            arquivo: caminho
                        });
                    });

                    // Hooks customizados
                    const hooks = [...arquivo.conteudo.matchAll(/(?:function|const)\s+(use[A-Z]\w+)/g)];
                    hooks.forEach(m =&gt; {
                        analise.hooks.push({
                            nome: m[1],
                            arquivo: caminho
                        });
                    });
                }

                // Rotas
                const rotas = [...arquivo.conteudo.matchAll(/(?:path|route):\s*['&quot;`]([^'&quot;`]+)['&quot;`]/gi)];
                rotas.forEach(m =&gt; {
                    analise.rotas.push({
                        caminho: m[1],
                        arquivo: caminho
                    });
                });

                // package.json
                if (arquivo.nome === 'package.json') {
                    try {
                        const pkg = JSON.parse(arquivo.conteudo);
                        analise.dependencias = {
                            ...pkg.dependencies,
                            ...pkg.devDependencies
                        };
                    } catch(e) {}
                }
            }

            projeto.analise = analise;
        }

        function mostrarStats() {
            const a = projeto.analise;
            document.getElementById('projetoInfo').style.display = 'block';
            document.getElementById('stats').innerHTML = `
                &lt;div class=&quot;stat-box&quot;&gt;

            `;
        }

        // =====================
        // GERAR PLANO
        // =====================
        function gerarPlano() {
            if (!projeto) return;

            mostrarLoading();

            setTimeout(() =&gt; {
                const opcoes = {
                    arvore: document.getElementById('opt_arvore').checked,
                    funcoes: document.getElementById('opt_funcoes').checked,
                    apis: document.getElementById('opt_apis').checked,
                    tipos: document.getElementById('opt_tipos').checked,
                    dependencias: document.getElementById('opt_dependencias').checked,
                    rotas: document.getElementById('opt_rotas').checked,
                    componentes: document.getElementById('opt_componentes').checked,
                    hooks: document.getElementById('opt_hooks').checked
                };

                planoGerado = gerarMarkdown(opcoes);
                mostrarPlano(planoGerado);
                gerarSecoes();
                
                document.getElementById('btnCopiar').disabled = false;
                document.getElementById('btnBaixar').disabled = false;
                document.getElementById('cardSecoes').style.display = 'block';
            }, 500);
        }

        function gerarMarkdown(opcoes) {
            const a = projeto.analise;
            let md = '';

            // CABEÇALHO
            md += `# 📋 Plano do Projeto: ${projeto.nome}\n\n`;
            md += `&gt; Gerado automaticamente em ${new Date().toLocaleString('pt-BR')}\n\n`;
            md += `---\n\n`;

            // ÍNDICE
            md += `## 📑 Índice\n\n`;
            if (opcoes.arvore) md += `- [🌳 Estrutura de Arquivos](#estrutura)\n`;
            if (opcoes.dependencias) md += `- [📦 Dependências](#dependencias)\n`;
            if (opcoes.funcoes) md += `- [⚡ Funções](#funcoes)\n`;
            if (opcoes.apis) md += `- [🌐 Rotas de API](#apis)\n`;
            if (opcoes.tipos) md += `- [📘 Tipos/Interfaces](#tipos)\n`;
            if (opcoes.rotas) md += `- [🛣️ Rotas/Páginas](#rotas)\n`;

            md += `\n---\n\n`;

            // ESTATÍSTICAS
            md += `## 📊 Estatísticas\n\n`;
            md += `| Métrica | Valor |\n`;
            md += `|---------|-------|\n`;
            md += `| **Arquivos** | ${a.totalArquivos} |\n`;
            md += `| **Linhas de código** | ${a.totalLinhas.toLocaleString()} |\n`;
            md += `| **Funções** | ${a.funcoes.length} |\n`;
            md += `| **Rotas de API** | ${a.apis.length} |\n`;
            md += `| **Componentes** | ${a.componentes.length} |\n`;
            md += `| **Tipos/Interfaces** | ${a.tipos.length} |\n`;
            md += `\n---\n\n`;

            // ESTRUTURA
            if (opcoes.arvore) {
                md += `## 🌳 Estrutura de Arquivos {#estrutura}\n\n`;
                md += '```\n';
                md += gerarArvore();
                md += '```\n\n';
                md += `---\n\n`;
                
                secoes['estrutura'] = md.split('---\n\n')[md.split('---\n\n').length - 2];
            }

            // DEPENDÊNCIAS
            if (opcoes.dependencias &amp;&amp; Object.keys(a.dependencias).length &gt; 0) {

                md += `Total: **${Object.keys(a.dependencias).length}** pacotes\n\n`;
                md += `| Pacote | Versão |\n`;
                md += `|--------|--------|\n`;

                    md += `| \`${nome}\` | ${versao} |\n`;
                });
                if (Object.keys(a.dependencias).length &gt; 50) {
                    md += `\n... e mais ${Object.keys(a.dependencias).length - 50} pacotes\n`;
                }
                md += `\n---\n\n`;
                
                secoes['dependencias'] = md.split('---\n\n')[md.split('---\n\n').length - 2];
            }

            // FUNÇÕES
            if (opcoes.funcoes &amp;&amp; a.funcoes.length &gt; 0) {
                md += `## ⚡ Funções {#funcoes}\n\n`;
                md += `Total: **${a.funcoes.length}** funções encontradas\n\n`;
                
                const porArquivo = {};
                a.funcoes.forEach(f =&gt; {
                    if (!porArquivo[f.arquivo]) porArquivo[f.arquivo] = [];
                    porArquivo[f.arquivo].push(f);
                });

                Object.entries(porArquivo).forEach(([arquivo, funcoes]) =&gt; {
                    md += `### 📄 \`${arquivo}\`\n\n`;
                    funcoes.forEach(f =&gt; {
                        md += `- **${f.nome}()** (linha ${f.linha})\n`;
                    });
                    md += `\n`;
                });
                
                md += `---\n\n`;
                secoes['funcoes'] = md.split('---\n\n')[md.split('---\n\n').length - 2];
            }

            // APIs
            if (opcoes.apis &amp;&amp; a.apis.length &gt; 0) {
                md += `## 🌐 Rotas de API {#apis}\n\n`;
                md += `Total: **${a.apis.length}** chamadas de API encontradas\n\n`;
                md += `| Endpoint | Arquivo | Linha |\n`;
                md += `|----------|---------|-------|\n`;
                a.apis.forEach(api =&gt; {
                    md += `| \`${api.url}\` | ${api.arquivo} | ${api.linha} |\n`;
                });
                md += `\n---\n\n`;
                
                secoes['apis'] = md.split('---\n\n')[md.split('---\n\n').length - 2];
            }

            // TIPOS
            if (opcoes.tipos &amp;&amp; a.tipos.length &gt; 0) {
                md += `## 📘 Tipos/Interfaces TypeScript {#tipos}\n\n`;
                md += `Total: **${a.tipos.length}** tipos/interfaces\n\n`;
                
                const porArquivo = {};
                a.tipos.forEach(t =&gt; {
                    if (!porArquivo[t.arquivo]) porArquivo[t.arquivo] = [];
                    porArquivo[t.arquivo].push(t);
                });

                Object.entries(porArquivo).forEach(([arquivo, tipos]) =&gt; {
                    md += `### 📄 \`${arquivo}\`\n\n`;
                    tipos.forEach(t =&gt; {
                        md += `- **${t.nome}** (linha ${t.linha})\n`;
                    });
                    md += `\n`;
                });
                
                md += `---\n\n`;
                secoes['tipos'] = md.split('---\n\n')[md.split('---\n\n').length - 2];
            }

            // ROTAS
            if (opcoes.rotas &amp;&amp; a.rotas.length &gt; 0) {

                md += `| Rota | Arquivo |\n`;
                md += `|------|----------|\n`;
                a.rotas.forEach(r =&gt; {
                    md += `| \`${r.caminho}\` | ${r.arquivo} |\n`;
                });
                md += `\n---\n\n`;
                
                secoes['rotas'] = md.split('---\n\n')[md.split('---\n\n').length - 2];
            }

            // COMPONENTES
            if (opcoes.componentes &amp;&amp; a.componentes.length &gt; 0) {
                md += `## 🧩 Componentes React {#componentes}\n\n`;
                md += `Total: **${a.componentes.length}** componentes\n\n`;
                
                const porArquivo = {};
                a.componentes.forEach(c =&gt; {
                    if (!porArquivo[c.arquivo]) porArquivo[c.arquivo] = [];
                    porArquivo[c.arquivo].push(c);
                });

                Object.entries(porArquivo).forEach(([arquivo, componentes]) =&gt; {
                    md += `### 📄 \`${arquivo}\`\n\n`;

                    md += `- **${h.nome}()** em \`${h.arquivo}\`\n`;
                });
                md += `\n---\n\n`;
                
                secoes['hooks'] = md.split('---\n\n')[md.split('---\n\n').length - 2];
            }

            // RODAPÉ
            md += `---\n\n`;
            md += `*Plano gerado automaticamente pelo Gerador de Plano de Projeto*\n`;
            md += `*Data: ${new Date().toLocaleString('pt-BR')}*\n`;

            return md;
        }

        function gerarArvore() {
            const caminhos = Object.keys(projeto.arquivos).sort();
            let arvore = `${projeto.nome}/\n`;

            const estrutura = {};
            caminhos.forEach(caminho =&gt; {
                const partes = caminho.split('/');
                let atual = estrutura;
                partes.forEach((parte, idx) =&gt; {
                    if (!atual[parte]) {
                        atual[parte] = idx === partes.length - 1 ? null : {};
                    }
                    if (atual[parte]) atual = atual[parte];
                });
            });

            function renderizar(obj, prefixo = '') {
                let resultado = '';
                const chaves = Object.keys(obj).sort();
                chaves.forEach((chave, idx) =&gt; {
                    const ultimo = idx === chaves.length - 1;
                    const simbolo = ultimo ? '└── ' : '├── ';
                    const proximoPrefixo = prefixo + (ultimo ? '    ' : '│   ');
                    
                    resultado += prefixo + simbolo + chave + '\n';
                    
                    if (obj[chave] !== null) {
                        resultado += renderizar(obj[chave], proximoPrefixo);
                    }
                });
                return resultado;
            }

            arvore += renderizar(estrutura);
            return arvore;
        }

        function gerarSecoes() {
            const lista = document.getElementById('listaSecoes');
            lista.innerHTML = '';

            const secoesList = [
                { id: 'estrutura', titulo: '🌳 Estrutura de Arquivos', desc: 'Árvore completa' },
                { id: 'dependencias', titulo: '📦 Dependências', desc: 'Pacotes npm' },
                { id: 'funcoes', titulo: '⚡ Funções', desc: 'Todas as funções' },
                { id: 'apis', titulo: '🌐 APIs', desc: 'Rotas e endpoints' },
                { id: 'tipos', titulo: '📘 Tipos', desc: 'TypeScript' },
                { id: 'rotas', titulo: '🛣️ Rotas', desc: 'Páginas do app' },
                { id: 'componentes', titulo: '🧩 Componentes', desc: 'React' },
                { id: 'hooks', titulo: '🪝 Hooks', desc: 'Customizados' }
            ];

            secoesList.forEach(s =&gt; {
                if (secoes[s.id]) {
                    const div = document.createElement('div');
                    div.className = 'secao';
                    div.onclick = () =&gt; copiarSecao(s.id);
                    div.innerHTML = `
                        &lt;div class=&quot;secao-titulo&quot;&gt;${s.titulo}&lt;/div&gt;
                        &lt;div class=&quot;secao-desc&quot;&gt;${s.desc} · Clique para copiar&lt;/div&gt;
                    `;
                    lista.appendChild(div);
                }
            });
        }

        // =====================
        // ANALISAR COM IA
        // =====================
        async function analisarComIA() {
            const chave = document.getElementById('iaApiKey').value.trim();
            if (!chave || !projeto) return;

            const provedor = PROVEDORES.find(p =&gt; chave.startsWith(p.prefix));
            if (!provedor) {
                alert('Chave de API não reconhecida!');
                return;
            }

            mostrarLoading('Analisando com IA...');

            const resumo = `
Projeto: ${projeto.nome}
Arquivos: ${projeto.analise.totalArquivos}
Linhas: ${projeto.analise.totalLinhas}
Funções: ${projeto.analise.funcoes.length}
APIs: ${projeto.analise.apis.length}

Arquivos principais:
${Object.keys(projeto.arquivos).slice(0, 10).join('\n')}

Funções principais:
${projeto.analise.funcoes.slice(0, 20).map(f =&gt; f.nome).join(', ')}

APIs detectadas:
${projeto.analise.apis.slice(0, 10).map(a =&gt; a.url).join('\n')}
            `.trim();

            try {
                const resp = await fetch(`${provedor.url}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${chave}`
                    },
                    body: JSON.stringify({
                        model: provedor.model,
                        messages: [
                            {
                                role: 'system',
                                content: 'Você é um especialista em análise de código. Responda em português brasileiro de forma clara e objetiva.'
                            },
                            {
                                role: 'user',
                                content: `Analise este projeto e me diga:
1. Qual é o propósito do projeto?
2. Quais são as principais funcionalidades?
3. Que tecnologias/frameworks são usados?
4. Há algum problema ou código suspeito?
5. Sugestões de melhoria

Dados do projeto:
${resumo}`
                            }
                        ],
                        max_tokens: 2000,
                        temperature: 0.3
                    })
                });

                if (!resp.ok) throw new Error('Erro na API');

                const data = await resp.json();
                const analise = data.choices[0].message.content;

                planoGerado += `\n\n---\n\n## 🤖 Análise da IA (${provedor.nome})\n\n${analise}\n`;
                mostrarPlano(planoGerado);

            } catch(e) {
                alert('Erro ao consultar IA: ' + e.message);
                mostrarPlano(planoGerado);
            }
        }

        // =====================
        // EXIBIR E COPIAR
        // =====================
        function mostrarPlano(conteudo) {
            document.getElementById('planoContainer').textContent = conteudo;
        }

        function mostrarLoading(texto = 'Gerando plano...') {
            document.getElementById('planoContainer').innerHTML = `
                &lt;div class=&quot;loading&quot;&gt;
                    &lt;div class=&quot;spinner&quot;&gt;&lt;/div&gt;
                    &lt;div style=&quot;margin-top: 16px;&quot;&gt;${texto}&lt;/div&gt;
                &lt;/div&gt;
            `;
        }

        function copiarPlanoCompleto() {
            navigator.clipboard.writeText(planoGerado).then(() =&gt; {
                const btn = document.getElementById('btnCopiar');
                const original = btn.textContent;
                btn.textContent = '✅ Copiado!';
                btn.classList.add('copiado');
                setTimeout(() =&gt; {
                    btn.textContent = original;
                    btn.classList.remove('copiado');
                }, 2000);
            });
        }

        function copiarSecao(id) {
            if (!secoes[id]) return;
            navigator.clipboard.writeText(secoes[id]).then(() =&gt; {
                event.target.closest('.secao').style.background = '#065f46';
                setTimeout(() =&gt; {
                    event.target.closest('.secao').style.background = '';
                }, 1000);
            });
        }

        function baixarMarkdown() {
            const blob = new Blob([planoGerado], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `plano-${projeto.nome.replace(/\.[^.]+$/, '')}-${Date.now()}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }
    &lt;/script&gt;

&lt;script&gt;
'use strict';

let rawMarkdown = '';
let currentFileName = '';
let searchHits = [];
let searchIdx = 0;

/*══════════════════════════════════════════════════════════════════
  CONFIG MARKED
══════════════════════════════════════════════════════════════════*/
marked.setOptions({
  breaks: true,
  gfm: true,
  headerIds: true,
  mangle: false,
});

// Renderer customizado pra blocos de código
const renderer = new marked.Renderer();
renderer.code = function(code, lang) {
  const language = (lang || '').toLowerCase().trim() || 'texto';
  let highlighted = escapeHTML(code);
  try {
    if (lang &amp;&amp; hljs.getLanguage(lang)) {
      highlighted = hljs.highlight(code, { language: lang }).value;
    } else {
      highlighted = hljs.highlightAuto(code).value;
    }
  } catch(e) { /* fallback pra escape */ }

  const safeCode = escapeAttr(code);
  return (
    '&lt;div class=&quot;code-wrap&quot;&gt;'+
      '&lt;div class=&quot;code-head&quot;&gt;'+
        '&lt;span class=&quot;code-lang&quot;&gt;'+language+'&lt;/span&gt;'+
        '&lt;button class=&quot;code-copy&quot; data-code=&quot;'+safeCode+'&quot;&gt;📋 Copiar código&lt;/button&gt;'+
      '&lt;/div&gt;'+
      '&lt;pre&gt;&lt;code class=&quot;hljs language-'+language+'&quot;&gt;'+highlighted+'&lt;/code&gt;&lt;/pre&gt;'+
    '&lt;/div&gt;'
  );
};

// Headings com botões de copiar seção
renderer.heading = function(text, level, raw) {
  const slug = slugify(raw);
  return (
    '&lt;h'+level+' id=&quot;'+slug+'&quot; data-heading=&quot;'+level+'&quot; data-raw=&quot;'+escapeAttr(raw)+'&quot;&gt;'+
      text+
      '&lt;span class=&quot;section-copy&quot;&gt;'+
        '&lt;button onclick=&quot;copySection(\''+slug+'\')&quot; title=&quot;Copiar essa seção inteira&quot;&gt;📋 Seção&lt;/button&gt;'+
        '&lt;button onclick=&quot;copySectionMD(\''+slug+'\')&quot; title=&quot;Copiar a seção em Markdown&quot;&gt;📝 MD&lt;/button&gt;'+
      '&lt;/span&gt;'+
    '&lt;/h'+level+'&gt;'
  );
};

marked.use({ renderer });

/*══════════════════════════════════════════════════════════════════
  CARREGAR ARQUIVO
══════════════════════════════════════════════════════════════════*/
function loadFile(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  e.target.value = '';
  readFile(file);
}

function readFile(file) {
  currentFileName = file.name;
  const reader = new FileReader();
  reader.onload = ev =&gt; {
    rawMarkdown = ev.target.result || '';
    render();
    toast('✓ '+file.name+' carregado');
  };
  reader.onerror = () =&gt; toast('Erro ao ler arquivo','err');
  reader.readAsText(file, 'UTF-8');
}

/*══════════════════════════════════════════════════════════════════
  RENDERIZAR
══════════════════════════════════════════════════════════════════*/
function render() {
  if (!rawMarkdown) return;
  const html = marked.parse(rawMarkdown);
  const content = document.getElementById('content');
  content.innerHTML = '&lt;div class=&quot;md&quot; id=&quot;md&quot;&gt;'+html+'&lt;/div&gt;';
  document.getElementById('exportBtn').style.display = '';
  document.getElementById('docTitle').textContent = currentFileName || 'Documento';
  buildTOC();
  bindCodeCopies();
}

function buildTOC() {
  const list = document.getElementById('tocList');
  const headings = document.querySelectorAll('#md h1, #md h2, #md h3, #md h4, #md h5, #md h6');
  if (!headings.length) {
    list.innerHTML = '&lt;div style=&quot;font-size:12px;color:var(--muted);text-align:center;padding:20px 10px&quot;&gt;Documento sem títulos&lt;/div&gt;';
    return;
  }
  list.innerHTML = '';
  headings.forEach(h =&gt; {
    const lvl = h.tagName.toLowerCase();
    const id  = h.id;
    const txt = h.dataset.raw || h.textContent.replace(/📋.*$/,'').trim();
    const item = document.createElement('div');
    item.className = 'toc-item ' + lvl;
    item.innerHTML =
      '&lt;span class=&quot;toc-text&quot; title=&quot;'+escapeAttr(txt)+'&quot;&gt;'+escapeHTML(txt)+'&lt;/span&gt;'+
      '&lt;button class=&quot;toc-copy&quot; title=&quot;Copiar essa seção&quot; onclick=&quot;event.stopPropagation();copySection(\''+id+'\')&quot;&gt;📋&lt;/button&gt;';
    item.onclick = () =&gt; {
      document.getElementById(id)?.scrollIntoView({ behavior:'smooth', block:'start' });
      if (window.innerWidth &lt;= 768) toggleTOC();
      document.querySelectorAll('.toc-item').forEach(i =&gt; i.classList.remove('active'));
      item.classList.add('active');
    };
    list.appendChild(item);
  });
}

function bindCodeCopies() {
  document.querySelectorAll('.code-copy').forEach(btn =&gt; {
    btn.onclick = () =&gt; {
      const code = btn.dataset.code || '';
      navigator.clipboard.writeText(decodeAttr(code)).then(() =&gt; {
        const orig = btn.innerHTML;
        btn.innerHTML = '✓ Copiado!';
        setTimeout(() =&gt; btn.innerHTML = orig, 1500);
      });
    };
  });
}

/*══════════════════════════════════════════════════════════════════
  COPIAR SEÇÃO
══════════════════════════════════════════════════════════════════*/
function copySection(headingId, asMarkdown) {
  const h = document.getElementById(headingId);
  if (!h) return;
  const level = parseInt(h.dataset.heading || '1');

  // Coleta todos os elementos da seção (até o próximo heading de nível &lt;= )
  const elements = [h];
  let el = h.nextElementSibling;
  while (el) {
    if (/^H[1-6]$/.test(el.tagName)) {
      const lvl = parseInt(el.dataset.heading || el.tagName[1]);
      if (lvl &lt;= level) break;
    }
    elements.push(el);
    el = el.nextElementSibling;
  }

  let text;
  if (asMarkdown) {
    text = extractMarkdownSection(headingId);
  } else {
    text = elements.map(e =&gt; extractText(e)).join('\n\n').trim();
  }

  navigator.clipboard.writeText(text).then(() =&gt; {
    toast('✓ Seção copiada ('+text.length+' caracteres)');
  }).catch(() =&gt; toast('Erro ao copiar','err'));
}

function copySectionMD(headingId) {
  copySection(headingId, true);
}

function extractText(el) {
  // Mantém quebras de bloco de código
  if (el.classList?.contains('code-wrap')) {
    const lang = el.querySelector('.code-lang')?.textContent || '';
    const code = decodeAttr(el.querySelector('.code-copy')?.dataset.code || '');
    return '```'+lang+'\n'+code+'\n```';
  }
  // Heading
  if (/^H[1-6]$/.test(el.tagName)) {
    const lvl = parseInt(el.tagName[1]);
    const raw = el.dataset.raw || el.textContent.replace(/📋.*$/,'').trim();
    return '#'.repeat(lvl)+' '+raw;
  }
  return el.innerText || el.textContent || '';
}

/* Extrai a seção do MD bruto (mais fiel) */
function extractMarkdownSection(headingId) {
  const lines = rawMarkdown.split('\n');
  const headings = [];
  lines.forEach((line, i) =&gt; {
    const m = line.match(/^(#{1,6})\s+(.+?)\s*$/);
    if (m) headings.push({ idx:i, level:m[1].length, text:m[2], slug:slugify(m[2]) });
  });
  const start = headings.find(h =&gt; h.slug === headingId);
  if (!start) return '';
  const next = headings.find(h =&gt; h.idx &gt; start.idx &amp;&amp; h.level &lt;= start.level);
  const endIdx = next ? next.idx : lines.length;
  return lines.slice(start.idx, endIdx).join('\n').trim();
}

/*══════════════════════════════════════════════════════════════════
  EXPORTAR HTML
══════════════════════════════════════════════════════════════════*/

    h.appendChild(btn);
  });

  const script = `
    &lt;script&gt;
    document.querySelectorAll('.copy-btn[data-code]').forEach(b=&gt;{
      b.onclick=()=&gt;{navigator.clipboard.writeText(b.dataset.code);b.textContent='✓ Copiado!';setTimeout(()=&gt;b.textContent='📋 Copiar',1500)};
    });
    document.querySelectorAll('.copy-btn[data-section]').forEach(b=&gt;{
      b.onclick=()=&gt;{
        const h=document.getElementById(b.dataset.section);
        const lvl=parseInt(h.tagName[1]);
        let txt=h.innerText.replace('📋 Seção','').trim()+'\\n\\n';
        let el=h.nextElementSibling;
        while(el){
          if(/^H[1-6]$/.test(el.tagName)&amp;&amp;parseInt(el.tagName[1])&lt;=lvl)break;
          txt+=el.innerText+'\\n\\n';
          el=el.nextElementSibling;
        }
        navigator.clipboard.writeText(txt.trim());
        b.textContent='✓ Copiado!';setTimeout(()=&gt;b.textContent='📋 Seção',1500);

/*══════════════════════════════════════════════════════════════════
  BUSCA
══════════════════════════════════════════════════════════════════*/
function toggleSearch() {
  const bar = document.getElementById('searchBar');
  const show = !bar.classList.contains('show');
  bar.classList.toggle('show', show);
  if (show) {
    document.getElementById('searchInput').focus();
  } else {
    clearSearch();
  }
}

function clearSearch() {
  document.querySelectorAll('mark.search-hit').forEach(m =&gt; {
    const parent = m.parentNode;
    parent.replaceChild(document.createTextNode(m.textContent), m);
    parent.normalize();
  });
  searchHits = [];
  searchIdx = 0;
  document.getElementById('searchCount').textContent = '0/0';
}

function doSearch() {
  clearSearch();
  const q = document.getElementById('searchInput').value.trim();
  if (!q || q.length &lt; 2) { document.getElementById('searchCount').textContent='0/0'; return; }

  const md = document.getElementById('md');
  if (!md) return;

  const re = new RegExp(escapeRegex(q), 'gi');
  walkAndHighlight(md, re);
  searchHits = [...document.querySelectorAll('mark.search-hit')];
  searchIdx = 0;
  if (searchHits.length) {
    searchHits[0].classList.add('current');
    searchHits[0].scrollIntoView({ behavior:'smooth', block:'center' });
  }
  document.getElementById('searchCount').textContent = (searchHits.length ? 1 : 0) + '/' + searchHits.length;
}

function walkAndHighlight(node, re) {
  if (node.nodeType === 3) { // text
    const text = node.nodeValue;
    if (!re.test(text)) return;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index &gt; last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const mark = document.createElement('mark');
      mark.className = 'search-hit';
      mark.textContent = m[0];
      frag.appendChild(mark);
      last = m.index + m[0].length;
    }
    if (last &lt; text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  } else if (node.nodeType === 1 &amp;&amp; !['SCRIPT','STYLE','MARK'].includes(node.tagName)) {
    [...node.childNodes].forEach(c =&gt; walkAndHighlight(c, re));
  }
}

function searchKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (!searchHits.length) return;
    searchHits[searchIdx].classList.remove('current');
    searchIdx = e.shiftKey
      ? (searchIdx - 1 + searchHits.length) % searchHits.length
      : (searchIdx + 1) % searchHits.length;
    searchHits[searchIdx].classList.add('current');
    searchHits[searchIdx].scrollIntoView({ behavior:'smooth', block:'center' });
    document.getElementById('searchCount').textContent = (searchIdx+1)+'/'+searchHits.length;
  } else if (e.key === 'Escape') {
    toggleSearch();
  }
}

/*══════════════════════════════════════════════════════════════════
  TOC TOGGLE
══════════════════════════════════════════════════════════════════*/
function toggleTOC() {
  const toc = document.getElementById('toc');
  const bd  = document.getElementById('backdrop');
  if (window.innerWidth &lt;= 768) {
    const show = !toc.classList.contains('show-mobile');
    toc.classList.toggle('show-mobile', show);
    bd.classList.toggle('show', show);
  } else {
    toc.classList.toggle('hidden');
  }
  document.getElementById('tocToggle').classList.toggle('active');
}

const dz = document.getElementById('dropZone');
['dragenter','dragover'].forEach(ev =&gt; {
  document.addEventListener(ev, e =&gt; {
    e.preventDefault();
    dz?.classList.add('dragover');
  });
});
['dragleave','drop'].forEach(ev =&gt; {
  document.addEventListener(ev, e =&gt; {
    e.preventDefault();
    dz?.classList.remove('dragover');
  });
});
document.addEventListener('drop', e =&gt; {
  e.preventDefault();
  const f = e.dataTransfer?.files?.[0];
  if (f) readFile(f);
});

document.addEventListener('paste', e =&gt; {
  if (document.activeElement?.tagName === 'INPUT') return;
  const txt = e.clipboardData?.getData('text');
  if (txt &amp;&amp; txt.length &gt; 50) {
    rawMarkdown = txt;
    currentFileName = 'colado.md';
    render();
    toast('✓ Texto colado renderizado');

/*══════════════════════════════════════════════════════════════════

function escapeHTML(s) {
  return String(s)
    .replace(/&amp;/g,'&amp;amp;').replace(/&lt;/g,'&amp;lt;')
    .replace(/&gt;/g,'&amp;gt;').replace(/&quot;/g,'&amp;quot;').replace(/'/g,'&amp;#39;');
}
function escapeAttr(s) { return escapeHTML(s); }
function decodeAttr(s) {
  return String(s)
    .replace(/&amp;#39;/g,&quot;'&quot;).replace(/&amp;quot;/g,'&quot;')
    .replace(/&amp;gt;/g,'&gt;').replace(/&amp;lt;/g,'&lt;').replace(/&amp;amp;/g,'&amp;');
}
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&amp;'); }
function slugify(s) {
  return String(s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s-]/g,'')
    .trim().replace(/\s+/g,'-').replace(/-+/g,'-');
}

let toastTimer;
function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', type === 'err');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() =&gt; t.classList.remove('show'), 2200);
}

'use strict';

// ═══════════════════════════════════════
// AUTO-DETECÇÃO DE PROVEDORES
// ═══════════════════════════════════════
const AUTO_DETECT = [
  { prefix:'gsk_',    url:'https://api.groq.com/openai/v1',                          model:'llama-3.3-70b-versatile',  name:'Groq' },
  { prefix:'sk-or-',  url:'https://openrouter.ai/api/v1',                            model:'openai/gpt-4o-mini',       name:'OpenRouter' },
  { prefix:'sk-ant-', url:'https://api.anthropic.com/v1',                            model:'claude-3-5-haiku-latest',  name:'Claude' },
  { prefix:'pplx-',   url:'https://api.perplexity.ai',                               model:'sonar-pro',                name:'Perplexity' },
  { prefix:'AIza',    url:'https://generativelanguage.googleapis.com/v1beta/openai', model:'gemini-2.0-flash',         name:'Gemini' },
  { prefix:'xai-',    url:'https://api.x.ai/v1',                                     model:'grok-2-latest',            name:'xAI/Grok' },
  { prefix:'hf_',     url:'https://api-inference.huggingface.co/v1',                 model:'meta-llama/Llama-3.3-70B-Instruct', name:'HuggingFace' },
  { prefix:'csk-',    url:'https://api.cerebras.ai/v1',                              model:'llama-3.3-70b',            name:'Cerebras' },
  { prefix:'fw_',     url:'https://api.fireworks.ai/inference/v1',                   model:'accounts/fireworks/models/llama-v3p3-70b-instruct', name:'Fireworks' },
  { prefix:'tgp_',    url:'https://api.together.xyz/v1',                             model:'meta-llama/Llama-3.3-70B-Instruct-Turbo', name:'Together AI' },
  { prefix:'sk-',     url:'https://api.openai.com/v1',                               model:'gpt-4o-mini',              name:'OpenAI' },
];
const REGEX_DETECT = [
  { regex:/^[a-zA-Z0-9]{32}$/, url:'https://api.mistral.ai/v1', model:'mistral-small-latest', name:'Mistral' },
];
function detectProvider(key) {
  if (!key) return null;
  for (const p of AUTO_DETECT) if (key.startsWith(p.prefix)) return p;
  for (const p of REGEX_DETECT) if (p.regex.test(key)) return p;
  return null;
}

// ═══════════════════════════════════════
// SYSTEM PROMPT PRESETS
// ═══════════════════════════════════════
const PRESETS = {
  livre: '',
  juridico: `Você é um assistente jurídico especializado no direito brasileiro.
Responda de forma técnica, cite legislação e jurisprudência quando relevante.
Seja objetivo e preciso. Não use linguagem informal.`,
  codigo: `Você é um assistente de programação.
Ao responder: entregue o código completo e funcional.
Explique brevemente o que mudou. Seja direto.`,
  direto: `Responda sempre de forma direta e objetiva.
Sem introduções longas. Sem frases de empatia.
Vá direto ao ponto. Entregue a resposta e pronto.`,
  custom: null,
};

let currentPreset = localStorage.getItem('cia_preset') || 'livre';
let customSysPrompt = localStorage.getItem('cia_sysprompt') || '';
let feedbackOn = localStorage.getItem('cia_feedback') !== 'off';

function getSysPrompt() {
  if (currentPreset === 'custom') return customSysPrompt;
  return PRESETS[currentPreset] || '';
}

function applyPreset(name) {
  currentPreset = name;
  localStorage.setItem('cia_preset', name);
  document.querySelectorAll('.sys-preset').forEach(b =&gt; b.classList.remove('active'));
  document.getElementById('preset-'+name)?.classList.add('active');
  if (name !== 'custom') {
    document.getElementById('sysPromptInput').value = PRESETS[name] || '';
    toast('Preset &quot;'+name+'&quot; aplicado');
  } else {
    document.getElementById('sysPromptInput').value = customSysPrompt;
  }
}

function saveSystemPrompt() {
  const val = document.getElementById('sysPromptInput').value.trim();
  customSysPrompt = val;
  currentPreset = 'custom';
  localStorage.setItem('cia_sysprompt', val);
  localStorage.setItem('cia_preset', 'custom');
  document.querySelectorAll('.sys-preset').forEach(b =&gt; b.classList.remove('active'));
  document.getElementById('preset-custom')?.classList.add('active');
  toast('System Prompt salvo ✓');
}

function initSysPanel() {
  document.getElementById('sysPromptInput').value = getSysPrompt();
  document.querySelectorAll('.sys-preset').forEach(b =&gt; b.classList.remove('active'));
  document.getElementById('preset-'+currentPreset)?.classList.add('active');
}

// ═══════════════════════════════════════
// FEEDBACK
// ═══════════════════════════════════════
function toggleFeedback() {
  feedbackOn = !feedbackOn;
  localStorage.setItem('cia_feedback', feedbackOn ? 'on' : 'off');
  document.getElementById('fbToggleBtn').style.opacity = feedbackOn ? '1' : '0.4';
  toast(feedbackOn ? '⭐ Feedback ATIVADO' : 'Feedback desativado');
}

function addFeedbackBar(msgEl, responseText) {
  if (!feedbackOn) return;
  const bar = document.createElement('div');
  bar.className = 'feedback-bar';

  const label = document.createElement('span');
  label.textContent = 'Resposta útil?';

  const btnUp = document.createElement('button');
  btnUp.className = 'fb-btn';
  btnUp.textContent = '👍';
  btnUp.title = 'Boa resposta';

  const btnDown = document.createElement('button');
  btnDown.className = 'fb-btn';
  btnDown.textContent = '👎';
  btnDown.title = 'Resposta ruim';

  const btnCopy = document.createElement('button');
  btnCopy.className = 'fb-btn';
  btnCopy.textContent = '📋 Copiar';
  btnCopy.onclick = () =&gt; {
    navigator.clipboard.writeText(responseText || '');
    btnCopy.textContent = '✓ Copiado';
    setTimeout(() =&gt; btnCopy.textContent = '📋 Copiar', 1800);
  };

  const note = document.createElement('span');
  note.className = 'fb-note';
  note.id = 'fb-note-'+Date.now();

  let voted = false;
  btnUp.onclick = () =&gt; {
    if (voted) return;
    voted = true;
    btnUp.classList.add('selected');
    note.textContent = 'Obrigado! ✓';
    saveFeedback('up', responseText);
  };
  btnDown.onclick = () =&gt; {
    if (voted) return;
    voted = true;
    btnDown.classList.add('selected');
    note.textContent = 'Anotado. ✓';
    saveFeedback('down', responseText);
  };

  bar.appendChild(label);
  bar.appendChild(btnUp);
  bar.appendChild(btnDown);
  bar.appendChild(btnCopy);
  bar.appendChild(note);
  msgEl.appendChild(bar);
}

function saveFeedback(type, text) {
  const feedbacks = JSON.parse(localStorage.getItem('cia_feedbacks') || '[]');
  feedbacks.push({ type, text: text?.slice(0,200), date: new Date().toISOString(), conv: currentConvId });
  if (feedbacks.length &gt; 200) feedbacks.splice(0, feedbacks.length - 200);
  localStorage.setItem('cia_feedbacks', JSON.stringify(feedbacks));
}

// ═══════════════════════════════════════
// INDEXEDDB
// ═══════════════════════════════════════
const DB_NAME = 'ChatIAProDB_v2';
let db = null;

function openDB() {
  return new Promise((resolve, reject) =&gt; {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = ev =&gt; {
      const d = ev.target.result;
      if (!d.objectStoreNames.contains('conversations')) d.createObjectStore('conversations', { keyPath:'id' });
    };
    req.onsuccess = () =&gt; { db = req.result; resolve(db); };
    req.onerror   = () =&gt; reject(req.error);
  });
}
function dbPut(store, obj) {
  return new Promise((res,rej) =&gt; { const tx=db.transaction(store,'readwrite'); tx.objectStore(store).put(obj); tx.oncomplete=res; tx.onerror=()=&gt;rej(tx.error); });
}
function dbGetAll(store) {
  return new Promise((res,rej) =&gt; { const tx=db.transaction(store,'readonly'); const r=tx.objectStore(store).getAll(); r.onsuccess=()=&gt;res(r.result); r.onerror=()=&gt;rej(r.error); });
}
function dbGet(store, key) {
  return new Promise((res,rej) =&gt; { const tx=db.transaction(store,'readonly'); const r=tx.objectStore(store).get(key); r.onsuccess=()=&gt;res(r.result); r.onerror=()=&gt;rej(r.error); });
}
function dbDelete(store, key) {
  return new Promise((res,rej) =&gt; { const tx=db.transaction(store,'readwrite'); tx.objectStore(store).delete(key); tx.oncomplete=res; tx.onerror=()=&gt;rej(tx.error); });
}

// ═══════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════
let apiKey    = localStorage.getItem('cia_key')   || '';
let apiUrl    = localStorage.getItem('cia_url')   || '';
let apiModel  = localStorage.getItem('cia_model') || '';
let savedKeys = JSON.parse(localStorage.getItem('cia_saved') || '[]');
let ttsOn     = localStorage.getItem('cia_tts') !== 'off';
let webOn     = localStorage.getItem('cia_web') === 'on';
let showKey   = false;

let history       = [];
let currentConvId = null;
let controller    = null;
let isRecording   = false;
let recog         = null;
let silTimer      = null;
let saveTimer     = null;

// ═══════════════════════════════════════
// BOOT
// ═══════════════════════════════════════
async function boot() {
  try { await openDB(); } catch(e) { console.warn('IndexedDB indisponível:', e); }

  document.getElementById('keyInput').value = apiKey;
  if (apiKey) {
    const d = detectProvider(apiKey);
    document.getElementById('urlInput').value   = d ? d.url   : (apiUrl   || '');
    document.getElementById('modelInput').value = d ? d.model : (apiModel || '');
  }

  updateProvBadge();
  updateCfgStatus();
  document.getElementById('ttsBtn').style.opacity    = ttsOn ? '1' : '0.4';
  document.getElementById('fbToggleBtn').style.opacity = feedbackOn ? '1' : '0.4';
  document.getElementById('webBtn').classList.toggle('web-on', webOn);

  initSysPanel();
  renderSavedKeys();
  await renderConvList();

  const last = localStorage.getItem('cia_current_conv');
  if (last &amp;&amp; db) {
    const conv = await dbGet('conversations', last);
    if (conv?.messages?.length) {
      currentConvId = conv.id;
      history = conv.messages;
      restoreUI();
    }
  }

  const draft = localStorage.getItem('cia_draft');
  if (draft) { document.getElementById('msgInput').value = draft; adjustHeight(document.getElementById('msgInput')); }

  if (!apiKey) togglePanel('cfgPanel','cfgBtn');
}

function restoreUI() {
  document.getElementById('emptyState')?.remove();
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  history.forEach(m =&gt; appendMsg(m.role==='user'?'user':'bot', m.content, false, true));
  addCopyListeners();
}

// ═══════════════════════════════════════
// AUTO-SAVE
// ═══════════════════════════════════════
async function autoSave() {
  if (!db || !history.length) return;
  if (!currentConvId) currentConvId = 'conv_'+Date.now();
  const title = (history.find(m=&gt;m.role==='user')?.content||'Conversa').slice(0,60).replace(/\n/g,' ');
  const obj = { id:currentConvId, title, messages:history, updatedAt:Date.now(), provider:apiKey?(detectProvider(apiKey)?.name||'Custom'):'Demo' };
  try { await dbPut('conversations', obj); localStorage.setItem('cia_current_conv', currentConvId); } catch(e) {}
}
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(autoSave, 400); }
function autoSaveDraft() {
  const v = document.getElementById('msgInput').value;
  v ? localStorage.setItem('cia_draft',v) : localStorage.removeItem('cia_draft');
}

// ═══════════════════════════════════════
// PAINÉIS
// ═══════════════════════════════════════
function togglePanel(panelId, btnId) {
  const all = ['cfgPanel','keysPanel','convPanel','ioPanel','sysPanel'];
  const allB= ['cfgBtn','keysBtn','convBtn','ioBtn','sysBtn'];
  const target = document.getElementById(panelId);
  const show = !target.classList.contains('show');
  all.forEach(id=&gt;document.getElementById(id).classList.remove('show'));
  allB.forEach(id=&gt;document.getElementById(id)?.classList.remove('active'));
  if (show) { target.classList.add('show'); document.getElementById(btnId)?.classList.add('active'); }
  if (panelId==='sysPanel') initSysPanel();
  if (panelId==='convPanel') renderConvList();
}

// ═══════════════════════════════════════
// CHAVES
// ═══════════════════════════════════════
function onKeyInput(val) {
  val = val.trim(); apiKey = val;
  localStorage.setItem('cia_key', val);
  const d = val ? detectProvider(val) : null;
  if (d) {
    document.getElementById('urlInput').value  = d.url;
    document.getElementById('modelInput').value= d.model;
    apiUrl=d.url; apiModel=d.model;
    localStorage.setItem('cia_url',d.url); localStorage.setItem('cia_model',d.model);
    document.getElementById('cfgProvOk').textContent='✓ '+d.name+' · '+d.model;
    document.getElementById('cfgProvOk').style.display='block';
    document.getElementById('cfgNote').style.display='none';
  } else {
    document.getElementById('cfgProvOk').style.display='none';
    document.getElementById('cfgNote').style.display='';
  }
  document.getElementById('saveRow').style.display = val?'flex':'none';
  updateProvBadge(); updateCfgStatus();
}
function updateProvBadge() {
  const b=document.getElementById('provBadge');
  if (apiKey) { const d=detectProvider(apiKey); b.textContent=d?d.name:'Custom'; b.style.borderColor='#5aab56'; b.style.color='#7ec87a'; }
  else { b.textContent='Demo ✨'; b.style.borderColor='#60a5fa'; b.style.color='#93c5fd'; }
}
function updateCfgStatus() {
  const el=document.getElementById('cfgStatus');
  if (apiKey) { const d=detectProvider(apiKey); el.textContent='✓ '+(d?d.name:'Custom')+' ativa'; el.className='cfg-status ok'; }
  else { el.textContent='Sem chave'; el.className='cfg-status demo'; }
}
function toggleShowKey() { showKey=!showKey; document.getElementById('keyInput').type=showKey?'text':'password'; }
function saveKey() {
  const key=document.getElementById('keyInput').value.trim();
  const label=document.getElementById('labelInput').value.trim();
  const url=document.getElementById('urlInput').value.trim();
  const model=document.getElementById('modelInput').value.trim();
  if (!key) return;
  if (savedKeys.some(k=&gt;k.key===key)) { toast('Chave já salva','err'); return; }
  const d=detectProvider(key);
  savedKeys.push({ id:Date.now()+'', label:label||(d?d.name:'Chave '+(savedKeys.length+1)), key, url, model, provider:d?d.name:'Custom' });
  localStorage.setItem('cia_saved',JSON.stringify(savedKeys));
  document.getElementById('labelInput').value='';
  renderSavedKeys(); toast('Chave salva ✓');
}
function renderSavedKeys() {

async function webSearch(query) {
  try {
    const url='https://api.duckduckgo.com/?q='+encodeURIComponent(query)+'&amp;format=json&amp;no_html=1&amp;skip_disambig=1';
    const r=await fetch(url); const j=await r.json();
    const parts=[];
    if (j.AbstractText) parts.push('RESUMO: '+j.AbstractText);
    if (j.Answer) parts.push('RESPOSTA: '+j.Answer);
    if (j.RelatedTopics?.length) {
      const t=j.RelatedTopics.slice(0,5).filter(t=&gt;t.Text).map((t,i)=&gt;(i+1)+'. '+t.Text);
      if (t.length) parts.push('TÓPICOS:\n'+t.join('\n'));
    }
    return parts.length?parts.join('\n\n'):null;
  } catch { return null; }
}

function handleKey(e) { if (e.key==='Enter'&amp;&amp;!e.shiftKey){e.preventDefault();send();} }
function adjustHeight(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,130)+'px'; }
function setPrompt(txt) { const el=document.getElementById('msgInput'); el.value=txt; adjustHeight(el); el.focus(); }

async function send(textOverride) {
  const el=document.getElementById('msgInput');
  const text=(textOverride||el.value).trim();
  if (!text) return;

  if (window.speechSynthesis) { const u=new SpeechSynthesisUtterance(' '); u.volume=0; window.speechSynthesis.speak(u); }

  document.getElementById('emptyState')?.remove();
  el.value=''; el.style.height='44px';
  localStorage.removeItem('cia_draft');

  history.push({ role:'user', content:text });
  appendMsg('user', text);
  scheduleSave();

  controller=new AbortController();
  document.getElementById('sendBtn').style.display='none';
  document.getElementById('stopBtn').style.display='flex';

  const { content:contentEl, wrap:wrapEl } = appendMsg('bot','',true);

  // Web search
  let webContext='';
  if (webOn) {
    const note=document.createElement('div'); note.className='progress'; note.textContent='🌐 Buscando...';
    contentEl.appendChild(note);
    const result=await webSearch(text); note.remove();
    if (result) { webContext='\n\n[CONTEXTO WEB]:\n'+result+'\n[FIM]'; }
  }

  try {
    const key=apiKey.trim();
    const url=(document.getElementById('urlInput').value||apiUrl||'https://api.groq.com/openai/v1').trim().replace(/\/$/,'');
    const model=document.getElementById('modelInput').value||apiModel||'llama-3.3-70b-versatile';

    if (!key) {
      contentEl.innerHTML='&lt;span style=&quot;color:#60a5fa&quot;&gt;⚠️ Configure uma chave de API em ⚙️. Groq é gratuito: &lt;a href=&quot;https://console.groq.com&quot; target=&quot;_blank&quot; style=&quot;color:#7ec87a&quot;&gt;console.groq.com&lt;/a&gt;&lt;/span&gt;';
      history.pop(); scheduleSave(); return;
    }

    // Monta mensagens com system prompt
    const sys = getSysPrompt();
    let msgs = sys ? [{ role:'system', content:sys }, ...history] : [...history];
    if (webContext) {
      const last=msgs[msgs.length-1];
      msgs[msgs.length-1]={ role:'user', content:last.content+webContext };
    }

    const resp=await fetch(url+'/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+key, 'HTTP-Referer':location.origin, 'X-Title':'Chat IA Pro' },
      body:JSON.stringify({ model, messages:msgs, stream:true, max_tokens:16384 }),
      signal:controller.signal
    });

    if (!resp.ok) {
      const errText=await resp.text();
      let msg='Erro '+resp.status;
      try { msg=JSON.parse(errText)?.error?.message||msg; } catch {}
      contentEl.innerHTML='&lt;span style=&quot;color:var(--err)&quot;&gt;❌ '+esc(msg)+'&lt;/span&gt;';
      history.pop(); scheduleSave(); return;
    }

    const reader=resp.body.getReader(); const decoder=new TextDecoder();
    let full='', buf='';
    const cursor=document.createElement('span'); cursor.className='cursor-blink';
    contentEl.appendChild(cursor);

    while (true) {
      const { done, value }=await reader.read(); if (done) break;
      buf+=decoder.decode(value,{stream:true});
      const lines=buf.split('\n'); buf=lines.pop()||'';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const j=line.slice(6).trim(); if (j==='[DONE]') continue;
        try {
          const p=JSON.parse(j);
          if (p.error) throw new Error(typeof p.error==='string'?p.error:p.error.message||'Erro');
          const delta=p.choices?.[0]?.delta?.content||p.text||p.content||'';
          if (delta) { full+=delta; cursor.remove(); contentEl.innerHTML=renderMarkdown(full); contentEl.appendChild(cursor); scrollBottom(); }
        } catch(e) { if (e instanceof SyntaxError) continue; throw e; }
      }
    }

    cursor.remove();
    if (full) {
      contentEl.innerHTML=renderMarkdown(full);
      history.push({ role:'assistant', content:full });
      scheduleSave();
      if (ttsOn) speakText(full);
      // FEEDBACK AUTOMÁTICO
      addFeedbackBar(wrapEl, full);
    }

  } catch(err) {
    if (err.name==='AbortError') {
      contentEl.innerHTML+='&lt;em style=&quot;color:var(--muted);font-size:11px&quot;&gt; [parado]&lt;/em&gt;';
    } else {
      contentEl.innerHTML='&lt;span style=&quot;color:var(--err)&quot;&gt;❌ '+esc(err.message)+'&lt;/span&gt;';
      history.pop(); scheduleSave();
    }
  } finally {
    controller=null;
    document.getElementById('sendBtn').style.display='flex';
    document.getElementById('stopBtn').style.display='none';
    scrollBottom(); addCopyListeners();
  }
}

function abortStream() { controller?.abort(); }

// ═══════════════════════════════════════
// RENDERIZAÇÃO
// ═══════════════════════════════════════
function appendMsg(role, text, streaming, isRestore) {
  const wrap=document.createElement('div'); wrap.className='msg '+role;
  const bubble=document.createElement('div'); bubble.className='msg-bubble';
  const content=document.createElement('div'); content.className='msg-content';
  if (role==='user') content.textContent=text;
  else if (streaming) content.innerHTML='';
  else content.innerHTML=renderMarkdown(text);
  bubble.appendChild(content); wrap.appendChild(bubble);
  const meta=document.createElement('div'); meta.className='msg-meta';
  if (role==='bot') {
    const prov=apiKey?(detectProvider(apiKey)?.name||'IA'):'IA';
    const lbl=document.createElement('span'); lbl.className='prov-label'; lbl.textContent=prov;
    const btn=document.createElement('button'); btn.innerHTML='📋 Copiar'; btn.onclick=function(){copyText(this,content.textContent);};
    meta.appendChild(lbl); meta.appendChild(btn);
  } else {
    const btn=document.createElement('button'); btn.innerHTML='📋 Copiar'; btn.onclick=function(){copyText(this,text);};
    meta.appendChild(btn);
  }
  wrap.appendChild(meta);
  document.getElementById('chat').appendChild(wrap);
  if (!isRestore) scrollBottom();
  return { el:wrap, content, wrap };
}

let copyBlockId=0;
function renderMarkdown(text) {
  let html=esc(text);
  html=html.replace(/```(\w*?)\n([\s\S]*?)```/g,(_,lang,code)=&gt;{
    const id='cb'+(++copyBlockId);
    return '&lt;div class=&quot;code-block&quot;&gt;&lt;div class=&quot;code-header&quot;&gt;&lt;span&gt;'+(lang||'código')+'&lt;/span&gt;&lt;button class=&quot;copy-btn&quot; data-copy=&quot;'+escAttr(code)+'&quot; id=&quot;'+id+'&quot;&gt;📋 Copiar&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;code-body&quot;&gt;'+code+'&lt;/div&gt;&lt;/div&gt;';
  });
  html=html.replace(/`([^`\n]+?)`/g,'&lt;span class=&quot;inline-code&quot;&gt;$1&lt;/span&gt;');
  html=html.replace(/\*\*([^*]+?)\*\*/g,'&lt;strong&gt;$1&lt;/strong&gt;');
  html=html.replace(/\*([^*]+?)\*/g,'&lt;em&gt;$1&lt;/em&gt;');
  html=html.replace(/(https?:\/\/[^\s&lt;&gt;&quot;']+)/g,'&lt;a href=&quot;$1&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;$1&lt;/a&gt;');
  html=html.replace(/\n/g,'&lt;br&gt;');
  return html;
}
function addCopyListeners() {
  document.querySelectorAll('.copy-btn[data-copy]').forEach(btn=&gt;{
    if (btn.dataset.bound) return; btn.dataset.bound='1';
    btn.onclick=function(){copyText(this,this.dataset.copy);};
  });
}
function copyText(btn,text) {
  navigator.clipboard.writeText(text||'').catch(()=&gt;{});
  const orig=btn.innerHTML; btn.innerHTML='✓ Copiado!';
  setTimeout(()=&gt;{btn.innerHTML=orig;},1800);
}
function scrollBottom() { const c=document.getElementById('chat'); c.scrollTop=c.scrollHeight; }

function exportConv(format) {
  

  if (!history.length) { toast('Nada para exportar','err'); return; }
  const date=new Date().toLocaleString('pt-BR');
  let content='', mime='text/plain', ext=format;

  if (format==='txt') {
    const lines=['=== CONVERSA — Chat IA Pro ===','Data: '+date,''];
    history.forEach(m=&gt;{ lines.push('['+(m.role==='user'?'VOCÊ':'IA')+']'); lines.push(m.content); lines.push(''); });
    content=lines.join('\n');
  }
  else if (format==='md') {
    const lines=['# Conversa Chat IA Pro','&gt; '+date,''];
    history.forEach(m=&gt;{ lines.push('### '+(m.role==='user'?'🧑 Você':'🤖 IA')); lines.push(''); lines.push(m.content); lines.push(''); });
    content=lines.join('\n'); mime='text/markdown';
  }
  else if (format==='json') {
    const sys=getSysPrompt();
    content=JSON.stringify({
      title: (history.find(m=&gt;m.role==='user')?.content||'Conversa').slice(0,60),
      exportedAt: date,

  else if (format==='pdf') {
    const w=window.open('','_blank');
    const html=['&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;UTF-8&quot;&gt;&lt;title&gt;Conversa&lt;/title&gt;',
      '&lt;style&gt;body{font-family:Georgia,serif;max-width:780px;margin:30px auto;padding:0 20px;color:#222;line-height:1.6}',
      'h1{color:#2d4a1e;border-bottom:2px solid #5aab56;padding-bottom:8px}.meta{color:#666;font-size:12px;margin-bottom:20px}',
      '.msg{margin:16px 0;padding:12px 16px;border-radius:8px;page-break-inside:avoid}',
      '.user{background:#e8f5e9;border-left:4px solid #5aab56}.bot{background:#f5f5f5;border-left:4px solid #888}',
      '.role{font-weight:bold;font-size:11px;text-transform:uppercase;color:#555;margin-bottom:4px}',
      'pre{background:#0d1309;color:#a8d5a2;padding:10px;border-radius:6px;overflow-x:auto;font-size:12px}',
      '@media print{body{margin:0}}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;',
      '&lt;h1&gt;Conversa — Chat IA Pro&lt;/h1&gt;',
      '&lt;div class=&quot;meta&quot;&gt;Exportado em '+date+' · '+history.length+' mensagens&lt;/div&gt;'];
    history.forEach(m=&gt;{
      const safe=esc(m.content).replace(/\n/g,'&lt;br&gt;');
      html.push('&lt;div class=&quot;msg '+(m.role==='user'?'user':'bot')+'&quot;&gt;');
      html.push('&lt;div class=&quot;role&quot;&gt;'+(m.role==='user'?'🧑 Você':'🤖 IA')+'&lt;/div&gt;');
      html.push('&lt;div&gt;'+safe+'&lt;/div&gt;&lt;/div&gt;');
    });
    html.push('&lt;script&gt;window.onload=()=&gt;setTimeout(()=&gt;window.print(),300)&lt;\/script&gt;&lt;/body&gt;&lt;/html&gt;');
    w.document.write(html.join('')); w.document.close();
    toast('PDF: use &quot;Salvar como PDF&quot; na impressão'); return;
  }

  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:mime+';charset=utf-8'}));
  a.download='conversa-'+Date.now()+'.'+ext;

  toast('Exportado: '+ext.toUpperCase());
}

async function importFile(e) {
  const file=e.target.files?.[0]; e.target.value=''; if (!file) return;
  const name=file.name.toLowerCase();
  const el=document.getElementById('msgInput');
  try {
    let txt='';
    if (name.endsWith('.pdf')) { toast('📕 Lendo PDF...'); txt=await extractPDF(file); }
    else if (name.endsWith('.json')) {
      const raw=await file.text();
      try {
        const j=JSON.parse(raw);
        // Conversa exportada — oferece restaurar
        if (j.messages&amp;&amp;Array.isArray(j.messages)) {
          if (confirm('Este JSON é uma conversa exportada. Restaurar agora?\n\n&quot;'+j.title+'&quot;')) {
            history=j.messages; currentConvId=null;
            // Restaura system prompt se tiver
            if (j.systemPrompt) {
              customSysPrompt=j.systemPrompt;
              currentPreset='custom';
              localStorage.setItem('cia_sysprompt',j.systemPrompt);
              localStorage.setItem('cia_preset','custom');
            }
            restoreUI(); scheduleSave();
            togglePanel('ioPanel','ioBtn');
            toast('Conversa restaurada ✓ ('+history.length+' msgs)'); return;
          }
        }
        txt=JSON.stringify(j,null,2);
      } catch { txt=raw; }
    }
    else { txt=await file.text(); }
    if (txt) {
      el.value=el.value?el.value+'\n\n'+txt:txt;
      adjustHeight(el); autoSaveDraft();
      togglePanel('ioPanel','ioBtn');
      toast('Importado ('+txt.length+' chars)');
    }
  } catch(err) { toast('Erro: '+err.message,'err'); }
}

async function extractPDF(file) {
  if (typeof pdfjsLib==='undefined') throw new Error('PDF.js não carregou');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const pages=[];
  for (let i=1;i&lt;=pdf.numPages;i++) {
    const page=await pdf.getPage(i);
    const tc=await page.getTextContent();
    pages.push('--- Página '+i+' ---\n'+tc.items.map(it=&gt;it.str).join(' '));
  }
  return pages.join('\n\n');
}

// OCR
// ═══════════════════════════════════════
async function importImage(e) {
  const file=e.target.files?.[0]; e.target.value=''; if (!file) return;
  if (typeof Tesseract==='undefined') { toast('Tesseract não carregou','err'); return; }
  const el=document.getElementById('msgInput');
  const prog=document.createElement('div');
  prog.className='progress';
  prog.style.cssText='position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:1000;';
  prog.textContent='🔍 OCR iniciando...';
  document.body.appendChild(prog);
  try {
    const { data }=await Tesseract.recognize(file,'por+eng',{
      logger:m=&gt;{ if (m.status==='recognizing text') prog.textContent='🔍 OCR: '+Math.round(m.progress*100)+'%'; }
    });
    const txt=(data?.text||'').trim();
    if (txt) {
      el.value=el.value?el.value+'\n\n[OCR]\n'+txt:'[OCR]\n'+txt;
      adjustHeight(el); autoSaveDraft();
      togglePanel('ioPanel','ioBtn');
      toast('OCR concluído ('+txt.length+' chars)');
    } else { toast('Nenhum texto encontrado','err'); }
  } catch(err) { toast('Erro OCR: '+err.message,'err'); }
  finally { prog.remove(); }
}

async function restoreBackup(e) {
  const file=e.target.files?.[0]; e.target.value=''; if (!file) return;
  if (!confirm('Restaurar backup? Dados atuais serão MESCLADOS.')) return;
  try {
    const data=JSON.parse(await file.text());
    if (data.keys?.length) {
      const existing=new Set(savedKeys.map(k=&gt;k.key));
      data.keys.forEach(k=&gt;{ if (!existing.has(k.key)) savedKeys.push(k); });
      localStorage.setItem('cia_saved',JSON.stringify(savedKeys));
    }
    if (data.conversations?.length&amp;&amp;db) {
      for (const c of data.conversations) await dbPut('conversations',c);
    }
    if (data.settings?.customSysPrompt) {
      customSysPrompt=data.settings.customSysPrompt;
      localStorage.setItem('cia_sysprompt',customSysPrompt);
    }
    if (data.settings?.currentPreset) {
      currentPreset=data.settings.currentPreset;
      localStorage.setItem('cia_preset',currentPreset);
    }
    renderSavedKeys(); await renderConvList();
    toast('Backup restaurado ✓');
  } catch { toast('Erro: backup inválido','err'); }
}

function toggleVoice() {
  if (isRecording) { stopVoice(); return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if (!SR) { toast('Use Chrome ou Edge para voz','err'); return; }
  recog=new SR(); recog.lang='pt-BR'; recog.continuous=true; recog.interimResults=true;
  let fullText='';
  const schedSend=()=&gt;{ clearTimeout(silTimer); silTimer=setTimeout(()=&gt;{ try{recog.stop();}catch{} if(fullText.trim()){setPrompt('');send(fullText.trim());} },1800); };
  recog.onresult=ev=&gt;{
    let final='',interim='';
    for (let i=0;i&lt;ev.results.length;i++) { if(ev.results[i].isFinal) final+=ev.results[i][0].transcript; else interim+=ev.results[i][0].transcript; }
    fullText=final||interim;
    document.getElementById('msgInput').value=fullText; adjustHeight(document.getElementById('msgInput'));
    if (fullText) schedSend();
  };
  recog.onerror=recog.onend=()=&gt;{ clearTimeout(silTimer); isRecording=false; recog=null; document.getElementById('micBtn').classList.remove('listening'); };
  try { recog.start(); } catch { return; }
  isRecording=true; document.getElementById('micBtn').classList.add('listening');
}
function stopVoice() { try{recog?.stop();}catch{} recog=null; isRecording=false; clearTimeout(silTimer); document.getElementById('micBtn').classList.remove('listening'); }

// ═══════════════════════════════════════
// TTS
// ═══════════════════════════════════════
function toggleTTS() {
  ttsOn=!ttsOn; localStorage.setItem('cia_tts',ttsOn?'on':'off');
  document.getElementById('ttsBtn').style.opacity=ttsOn?'1':'0.4';
  if (!ttsOn) window.speechSynthesis?.cancel();
  toast(ttsOn?'🔊 Voz ATIVADA':'Voz desativada');
}
function speakText(text) {
  if (!ttsOn||!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const clean=text.replace(/&lt;[^&gt;]+&gt;/g,'').replace(/[`*#]/g,'').substring(0,800);
  const u=new SpeechSynthesisUtterance(clean); u.lang='pt-BR';
  window.speechSynthesis.speak(u);
}

// ═══════════════════════════════════════
// UTILS
// ═══════════════════════════════════════
function esc(s) { return String(s).replace(/&amp;/g,'&amp;amp;').replace(/&lt;/g,'&amp;lt;').replace(/&gt;/g,'&amp;gt;').replace(/&quot;/g,'&amp;quot;'); }
function escAttr(s) { return esc(s).replace(/'/g,'&amp;#39;'); }

let toastTimer;
function toast(msg,type) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.toggle('err',type==='err');
  t.classList.add('show'); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=&gt;t.classList.remove('show'),2500);
}

window.addEventListener('beforeunload',()=&gt;{ if(history.length) autoSave(); autoSaveDraft(); });

boot();

<script>
function trocarProjeto(index) {
  // Esconde todos
  document.querySelectorAll('.project-container').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  
  // Mostra o selecionado
  document.getElementById('projeto' + index).classList.add('active');
  document.querySelectorAll('.nav-btn')[index].classList.add('active');
  
  // Salva preferência
  localStorage.setItem('ultimo-projeto', index);
}

// Restaura último projeto aberto
window.onload = function() {
  const ultimo = localStorage.getItem('ultimo-projeto');
  if (ultimo !== null) trocarProjeto(parseInt(ultimo));
};
</script>
