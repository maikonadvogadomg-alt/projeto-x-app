&lt;body&gt;
    &lt;div class=&quot;container&quot;&gt;
        &lt;div class=&quot;header&quot;&gt;
            &lt;h1&gt;🔗 Gerenciador de Links&lt;/h1&gt;
            &lt;p&gt;Organize, marque e acesse seus links&lt;/p&gt;
        &lt;/div&gt;

        &lt;div class=&quot;content&quot;&gt;
            &lt;!-- ESTATÍSTICAS --&gt;
            &lt;div class=&quot;stats&quot;&gt;
                &lt;div class=&quot;stat-card&quot;&gt;
                    &lt;div class=&quot;stat-number&quot; id=&quot;totalLinks&quot;&gt;0&lt;/div&gt;
                    &lt;div class=&quot;stat-label&quot;&gt;Total de Links&lt;/div&gt;
                &lt;/div&gt;
                &lt;div class=&quot;stat-card&quot;&gt;
                    &lt;div class=&quot;stat-number&quot; id=&quot;checkedLinks&quot;&gt;0&lt;/div&gt;
                    &lt;div class=&quot;stat-label&quot;&gt;Marcados&lt;/div&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;!-- ADICIONAR LINK --&gt;
            &lt;div class=&quot;section&quot;&gt;
                &lt;div class=&quot;section-title&quot;&gt;➕ Adicionar Novo Link&lt;/div&gt;
                &lt;div class=&quot;form-group&quot;&gt;
                    &lt;label for=&quot;linkName&quot;&gt;Nome do Link&lt;/label&gt;
                    &lt;input type=&quot;text&quot; id=&quot;linkName&quot; placeholder=&quot;Ex: Playground, Chat IA, etc&quot;&gt;
                &lt;/div&gt;
                &lt;div class=&quot;form-group&quot;&gt;
                    &lt;label for=&quot;linkUrl&quot;&gt;URL&lt;/label&gt;
                    &lt;input type=&quot;text&quot; id=&quot;linkUrl&quot; placeholder=&quot;Ex: https://exemplo.com&quot;&gt;
                &lt;/div&gt;
                &lt;div class=&quot;button-group&quot;&gt;
                    &lt;button class=&quot;btn-primary&quot; onclick=&quot;adicionarLink()&quot;&gt;💾 Salvar Link&lt;/button&gt;
                    &lt;button class=&quot;btn-secondary&quot; onclick=&quot;limparFormulario()&quot;&gt;🔄 Limpar&lt;/button&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;!-- LISTA DE LINKS --&gt;
            &lt;div class=&quot;section&quot;&gt;
                &lt;div class=&quot;section-title&quot;&gt;📋 Seus Links&lt;/div&gt;
                &lt;div id=&quot;linksList&quot; class=&quot;links-list&quot;&gt;
                    &lt;div class=&quot;empty-state&quot;&gt;
                        &lt;p&gt;Nenhum link adicionado ainda&lt;/p&gt;
                        &lt;p style=&quot;font-size: 11px; margin-top: 8px;&quot;&gt;Adicione um link acima para começar!&lt;/p&gt;
                    &lt;/div&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;!-- AÇÕES --&gt;
            &lt;div class=&quot;section&quot;&gt;
                &lt;div class=&quot;button-group&quot;&gt;
                    &lt;button class=&quot;btn-primary&quot; onclick=&quot;abrirSelecionados()&quot;&gt;🚀 Abrir Selecionados&lt;/button&gt;
                    &lt;button class=&quot;btn-secondary&quot; onclick=&quot;marcarTodos()&quot;&gt;✅ Marcar Todos&lt;/button&gt;
                    &lt;button class=&quot;btn-secondary&quot; onclick=&quot;desmarcarTodos()&quot;&gt;⬜ Desmarcar&lt;/button&gt;
                    &lt;button class=&quot;btn-danger&quot; onclick=&quot;limparTudo()&quot;&gt;🗑️ Limpar Tudo&lt;/button&gt;
                &lt;/div&gt;
            &lt;/div&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;!-- VISUALIZADOR --&gt;
    &lt;div class=&quot;viewer-container&quot; id=&quot;viewerContainer&quot;&gt;
        &lt;div class=&quot;viewer-box&quot;&gt;
            &lt;div class=&quot;viewer-header&quot;&gt;
                &lt;h2 id=&quot;viewerTitle&quot;&gt;Carregando...&lt;/h2&gt;
                &lt;div class=&quot;viewer-header-buttons&quot;&gt;
                    &lt;button onclick=&quot;alternarTelaCheia()&quot;&gt;⛶&lt;/button&gt;
                    &lt;button onclick=&quot;fecharVisualizador()&quot;&gt;✕&lt;/button&gt;
                &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;viewer-content&quot;&gt;
                &lt;iframe id=&quot;viewerIframe&quot; src=&quot;&quot;&gt;&lt;/iframe&gt;
            &lt;/div&gt;
            &lt;div class=&quot;viewer-footer&quot;&gt;
                &lt;button class=&quot;btn-prev&quot; onclick=&quot;linkAnterior()&quot;&gt;← Anterior&lt;/button&gt;
                &lt;button class=&quot;btn-next&quot; onclick=&quot;proximoLink()&quot;&gt;Próximo →&lt;/button&gt;
            &lt;/div&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;script&gt;
        // VARIÁVEIS GLOBAIS
        let links = [];
        let indiceAtual = 0;
        let telaCheia = false;

        // CARREGAR DADOS
        function carregarDados() {
            const dados = localStorage.getItem('gerenciadorLinks');
            if (dados) {
                try {
                    links = JSON.parse(dados);
                } catch(e) {
                    links = [];
                }
            }
            atualizarLista();
        }

        // SALVAR DADOS
        function salvarDados() {
            localStorage.setItem('gerenciadorLinks', JSON.stringify(links));
        }

        // ADICIONAR LINK
        function adicionarLink() {
            const nome = document.getElementById('linkName').value.trim();
            const url = document.getElementById('linkUrl').value.trim();

            if (!nome || !url) {
                alert('⚠️ Preencha nome e URL!');
                return;
            }

            // Validar URL
            try {
                new URL(url);
            } catch (e) {
                alert('⚠️ URL inválida! Comece com http:// ou https://');
                return;
            }

            links.push({
                id: Date.now(),
                nome: nome,
                url: url,
                checked: false
            });

            salvarDados();
            limparFormulario();
            atualizarLista();
        }

        // LIMPAR FORMULÁRIO
        function limparFormulario() {
            document.getElementById('linkName').value = '';
            document.getElementById('linkUrl').value = '';
            document.getElementById('linkName').focus();
        }

        // ATUALIZAR LISTA
        function atualizarLista() {
            const lista = document.getElementById('linksList');

            if (links.length === 0) {
                lista.innerHTML = `
                    &lt;div class=&quot;empty-state&quot;&gt;
                        &lt;p&gt;Nenhum link adicionado ainda&lt;/p&gt;
                        &lt;p style=&quot;font-size: 11px; margin-top: 8px;&quot;&gt;Adicione um link acima para começar!&lt;/p&gt;
                    &lt;/div&gt;
                `;
                atualizarEstatisticas();
                return;
            }

            lista.innerHTML = links.map(link =&gt; `
                &lt;div class=&quot;link-item ${link.checked ? 'checked' : ''}&quot;&gt;
                    &lt;input type=&quot;checkbox&quot; ${link.checked ? 'checked' : ''} onchange=&quot;alternarLink(${link.id})&quot;&gt;
                    &lt;div class=&quot;link-info&quot;&gt;
                        &lt;div class=&quot;link-name&quot;&gt;${escHtml(link.nome)}&lt;/div&gt;
                        &lt;div class=&quot;link-url&quot;&gt;${escHtml(link.url)}&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;button class=&quot;btn-remove&quot; onclick=&quot;removerLink(${link.id})&quot;&gt;Remover&lt;/button&gt;
                &lt;/div&gt;
            `).join('');

            atualizarEstatisticas();
        }

        // ALTERNAR LINK
        function alternarLink(id) {
            const link = links.find(l =&gt; l.id === id);
            if (link) {
                link.checked = !link.checked;
                salvarDados();
                atualizarLista();
            }
        }

        // REMOVER LINK
        function removerLink(id) {
            if (confirm('Remover este link?')) {
                links = links.filter(l =&gt; l.id !== id);
                salvarDados();
                atualizarLista();
            }
        }

        // MARCAR TODOS
        function marcarTodos() {
            links.forEach(link =&gt; link.checked = true);
            salvarDados();
            atualizarLista();
        }

        // DESMARCAR TODOS
        function desmarcarTodos() {
            links.forEach(link =&gt; link.checked = false);
            salvarDados();
            atualizarLista();
        }

        // LIMPAR TUDO
        function limparTudo() {
            if (confirm('⚠️ Deletar TODOS os links?')) {
                links = [];
                salvarDados();
                atualizarLista();
            }
        }

        // ATUALIZAR ESTATÍSTICAS
        function atualizarEstatisticas() {
            document.getElementById('totalLinks').textContent = links.length;
            document.getElementById('checkedLinks').textContent = links.filter(l =&gt; l.checked).length;
        }

        // ABRIR SELECIONADOS
        function abrirSelecionados() {
            const selecionados = links.filter(l =&gt; l.checked);

            if (selecionados.length === 0) {
                alert('⚠️ Marque pelo menos um link!');
                return;
            }

            indiceAtual = 0;
            telaCheia = false;
            abrirVisualizador();
        }

        // ABRIR VISUALIZADOR
        function abrirVisualizador() {
            const selecionados = links.filter(l =&gt; l.checked);

            if (selecionados.length === 0) return;

            const linkAtual = selecionados[indiceAtual];
            document.getElementById('viewerTitle').textContent = `${indiceAtual + 1}/${selecionados.length} - ${linkAtual.nome}`;
            document.getElementById('viewerIframe').src = linkAtual.url;
            document.getElementById('viewerContainer').classList.add('active');
        }

        // ALTERNAR TELA CHEIA
        function alternarTelaCheia() {
            telaCheia = !telaCheia;
            const container = document.getElementById('viewerContainer');
            
            if (telaCheia) {
                container.classList.add('fullscreen');
            } else {
                container.classList.remove('fullscreen');
            }
        }

        // PRÓXIMO LINK
        function proximoLink() {
            const selecionados = links.filter(l =&gt; l.checked);
            indiceAtual = (indiceAtual + 1) % selecionados.length;
            abrirVisualizador();
        }

        // LINK ANTERIOR
        function linkAnterior() {
            const selecionados = links.filter(l =&gt; l.checked);
            indiceAtual = (indiceAtual - 1 + selecionados.length) % selecionados.length;
            abrirVisualizador();
        }

        // FECHAR VISUALIZADOR
        function fecharVisualizador() {
            document.getElementById('viewerContainer').classList.remove('active');
            telaCheia = false;
        }

        // ESCAPE PARA FECHAR
        document.addEventListener('keydown', (e) =&gt; {
            if (e.key === 'Escape' &amp;&amp; document.getElementById('viewerContainer').classList.contains('active')) {
                fecharVisualizador();
            }
        });

        // ESCAPE HTML
        function escHtml(s) {

                    &lt;input type=&quot;text&quot; id=&quot;linkName&quot; placeholder=&quot;Ex: Playground, Chat IA, etc&quot;&gt;
                &lt;/div&gt;
                &lt;div class=&quot;form-group&quot;&gt;
                    &lt;label for=&quot;linkUrl&quot;&gt;URL&lt;/label&gt;

                &lt;div class=&quot;button-group&quot;&gt;
                    &lt;button class=&quot;btn-primary&quot; onclick=&quot;adicionarLink()&quot;&gt;💾 Salvar Link&lt;/button&gt;
                    &lt;button class=&quot;btn-secondary&quot; onclick=&quot;limparFormulario()&quot;&gt;🔄 Limpar&lt;/button&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;!-- LISTA DE LINKS --&gt;
            &lt;div class=&quot;section&quot;&gt;
                &lt;div class=&quot;section-title&quot;&gt;📋 Seus Links&lt;/div&gt;
                &lt;div id=&quot;linksList&quot; class=&quot;links-list&quot;&gt;
                    &lt;div class=&quot;empty-state&quot;&gt;
                        &lt;p&gt;Nenhum link adicionado ainda&lt;/p&gt;
                        &lt;p style=&quot;font-size: 12px; margin-top: 10px;&quot;&gt;Adicione um link acima para começar!&lt;/p&gt;
                    &lt;/div&gt;
                &lt;/div&gt;
            &lt;/div&gt;

            &lt;!-- AÇÕES --&gt;
            &lt;div class=&quot;section&quot;&gt;
                &lt;div class=&quot;button-group&quot;&gt;
                    &lt;button class=&quot;btn-primary&quot; onclick=&quot;abrirSelecionados()&quot;&gt;🚀 Abrir Selecionados&lt;/button&gt;
                    &lt;button class=&quot;btn-secondary&quot; onclick=&quot;marcarTodos()&quot;&gt;✅ Marcar Todos&lt;/button&gt;
                    &lt;button class=&quot;btn-secondary&quot; onclick=&quot;desmarcarTodos()&quot;&gt;⬜ Desmarcar Todos&lt;/button&gt;

                    &lt;button onclick=&quot;alternarTelaCheia()&quot;&gt;⛶ Tela Cheia&lt;/button&gt;
                    &lt;button onclick=&quot;fecharVisualizador()&quot;&gt;✕ Fechar&lt;/button&gt;
                &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;viewer-content&quot;&gt;
                &lt;iframe id=&quot;viewerIframe&quot; src=&quot;&quot;&gt;&lt;/iframe&gt;
            &lt;/div&gt;
            &lt;div class=&quot;viewer-footer&quot;&gt;
                &lt;button class=&quot;btn-prev&quot; onclick=&quot;linkAnterior()&quot;&gt;← Anterior&lt;/button&gt;
                &lt;button class=&quot;btn-next&quot; onclick=&quot;proximoLink()&quot;&gt;Próximo →&lt;/button&gt;
            &lt;/div&gt;
        &lt;/div&gt;

    &lt;script&gt;
        // VARIÁVEIS GLOBAIS
        let links = [];
        let indiceAtual = 0;
        let telaCheia = false;

        // CARREGAR DADOS
        function carregarDados() {
            const dados = localStorage.getItem('gerenciadorLinks');
            if (dados) {
                links = JSON.parse(dados);
            }
            atualizarLista();
        }

        // SALVAR DADOS
        function salvarDados() {
            localStorage.setItem('gerenciadorLinks', JSON.stringify(links));
        }

        // ADICIONAR LINK
        function adicionarLink() {
            const nome = document.getElementById('linkName').value.trim();
            const url = document.getElementById('linkUrl').value.trim();

            if (!nome || !url) {
                alert('⚠️ Preencha nome e URL!');
                return;
            }

            // Validar URL
            try {
                new URL(url);
            } catch (e) {
                alert('⚠️ URL inválida! Comece com http:// ou https://');
                return;
            }

            links.push({
                id: Date.now(),
                nome: nome,
                url: url,
                checked: false
            });

            salvarDados();
            limparFormulario();
            atualizarLista();
        }

        // LIMPAR FORMULÁRIO
        function limparFormulario() {
            document.getElementById('linkName').value = '';
            document.getElementById('linkUrl').value = '';
            document.getElementById('linkName').focus();
        }

        // ATUALIZAR LISTA
        function atualizarLista() {
            const lista = document.getElementById('linksList');

            if (links.length === 0) {
                lista.innerHTML = `
                    &lt;div class=&quot;empty-state&quot;&gt;
                        &lt;p&gt;Nenhum link adicionado ainda&lt;/p&gt;
                        &lt;p style=&quot;font-size: 12px; margin-top: 10px;&quot;&gt;Adicione um link acima para começar!&lt;/p&gt;
                    &lt;/div&gt;
                `;
                atualizarEstatisticas();
                return;
            }

            lista.innerHTML = links.map(link =&gt; `
                &lt;div class=&quot;link-item ${link.checked ? 'checked' : ''}&quot;&gt;
                    &lt;input type=&quot;checkbox&quot; ${link.checked ? 'checked' : ''} onchange=&quot;alternarLink(${link.id})&quot;&gt;
                    &lt;div class=&quot;link-info&quot;&gt;
                        &lt;div class=&quot;link-name&quot;&gt;${link.nome}&lt;/div&gt;
                        &lt;div class=&quot;link-url&quot;&gt;${link.url}&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;button class=&quot;btn-remove&quot; onclick=&quot;removerLink(${link.id})&quot;&gt;Remover&lt;/button&gt;
                &lt;/div&gt;
            `).join('');

            atualizarEstatisticas();
        }

        // ALTERNAR LINK
        function alternarLink(id) {
            const link = links.find(l =&gt; l.id === id);
            if (link) {
                link.checked = !link.checked;
                salvarDados();
                atualizarLista();
            }
        }

        // REMOVER LINK
        function removerLink(id) {
            if (confirm('Tem certeza que quer remover este link?')) {
                links = links.filter(l =&gt; l.id !== id);
                salvarDados();
                atualizarLista();
            }
        }

        // MARCAR TODOS
        function marcarTodos() {
            links.forEach(link =&gt; link.checked = true);
            salvarDados();
            atualizarLista();
        }

        // DESMARCAR TODOS
        function desmarcarTodos() {
            links.forEach(link =&gt; link.checked = false);
            salvarDados();
            atualizarLista();
        }

        // LIMPAR TUDO
        function limparTudo() {
            if (confirm('⚠️ Tem certeza? Isso vai deletar TODOS os links!')) {
                links = [];
                salvarDados();
                atualizarLista();
            }
        }

        // ATUALIZAR ESTATÍSTICAS
        function atualizarEstatisticas() {
            document.getElementById('totalLinks').textContent = links.length;
            document.getElementById('checkedLinks').textContent = links.filter(l =&gt; l.checked).length;
        }

        // ABRIR SELECIONADOS
        function abrirSelecionados() {
            const selecionados = links.filter(l =&gt; l.checked);

            if (selecionados.length === 0) {
                alert('⚠️ Marque pelo menos um link!');
                return;
            }

            indiceAtual = 0;
            telaCheia = false;
            abrirVisualizador();
        }

        // ABRIR VISUALIZADOR
        function abrirVisualizador() {
            const selecionados = links.filter(l =&gt; l.checked);

            if (selecionados.length === 0) return;

            const linkAtual = selecionados[indiceAtual];
            document.getElementById('viewerTitle').textContent = `${indiceAtual + 1}/${selecionados.length} - ${linkAtual.nome}`;
            document.getElementById('viewerIframe').src = linkAtual.url;
            document.getElementById('viewerContainer').classList.add('active');
        }

        // ALTERNAR TELA CHEIA
        function alternarTelaCheia() {
            telaCheia = !telaCheia;
            const container = document.getElementById('viewerContainer');
            
            if (telaCheia) {
                container.classList.add('fullscreen');
            } else {
                container.classList.remove('fullscreen');
            }
        }

        // PRÓXIMO LINK
        function proximoLink() {
            const selecionados = links.filter(l =&gt; l.checked);
            indiceAtual = (indiceAtual + 1) % selecionados.length;
            abrirVisualizador();
        }

        // LINK ANTERIOR
        function linkAnterior() {
            const selecionados = links.filter(l =&gt; l.checked);
            indiceAtual = (indiceAtual - 1 + selecionados.length) % selecionados.length;
            abrirVisualizador();
        }

        // FECHAR VISUALIZADOR
        function fecharVisualizador() {
            document.getElementById('viewerContainer').classList.remove('active');
            telaCheia = false;
        }

        // INICIALIZAR
        carregarDados();
    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;

.mini-acoes button { font-size: 11px; padding: 5px 8px; }

/* PREVIEW */
.preview-topo { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.preview-topo h2 { font-size: 15px; color: #111827; word-break: break-word; }

.vazio { color: #9ca3af; text-align: center; padding: 60px 20px; font-size: 14px; }

.progress { background: #e5e7eb; border-radius: 999px; height: 8px; margin: 10px 0; }

.progress-txt { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;

&lt;h1&gt;🗂 Extrator de Projetos Replit&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;Importa seu CSV exportado do Replit · Visualiza · Renderiza · Baixa cada projeto separado&lt;/p&gt;

&lt;div class=&quot;painel&quot;&gt;
  &lt;h2&gt;📥 Importar arquivo CSV&lt;/h2&gt;
  &lt;div class=&quot;drop&quot; id=&quot;drop&quot; onclick=&quot;document.getElementById('inp').click()&quot;&gt;
    &lt;div&gt;Clique aqui ou arraste o arquivo &lt;strong&gt;snippets.csv&lt;/strong&gt;&lt;/div&gt;
    &lt;div style=&quot;font-size:12px;margin-top:6px;color:#4b5563;&quot;&gt;Suporta arquivos grandes · Processamento local · Nada é enviado para internet&lt;/div&gt;
    &lt;input type=&quot;file&quot; id=&quot;inp&quot; accept=&quot;.csv&quot; onchange=&quot;carregarCSV(event)&quot;&gt;
  &lt;/div&gt;
  &lt;div id=&quot;progressArea&quot; style=&quot;display:none;margin-top:12px;&quot;&gt;
    &lt;div class=&quot;progress-txt&quot; id=&quot;progressTxt&quot;&gt;Carregando...&lt;/div&gt;
    &lt;div class=&quot;progress&quot;&gt;&lt;div class=&quot;progress-bar&quot; id=&quot;progressBar&quot; style=&quot;width:0%&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;painel&quot; id=&quot;painelPrincipal&quot; style=&quot;display:none;&quot;&gt;

  &lt;div class=&quot;barra&quot;&gt;
    &lt;input type=&quot;text&quot; id=&quot;busca&quot; placeholder=&quot;🔎 Buscar por título...&quot; oninput=&quot;filtrar()&quot;&gt;
    &lt;button class=&quot;b-escuro&quot; onclick=&quot;baixarTodos()&quot;&gt;⬇ Baixar todos como HTML&lt;/button&gt;
    &lt;button class=&quot;b-vermelho&quot; onclick=&quot;limpar()&quot;&gt;🗑 Limpar&lt;/button&gt;
  &lt;/div&gt;

  &lt;div class=&quot;contador-geral&quot; id=&quot;contadorGeral&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;

    &lt;div&gt;
      &lt;div class=&quot;lista&quot; id=&quot;lista&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div&gt;
      &lt;div class=&quot;preview-topo&quot;&gt;
        &lt;h2 id=&quot;previewTitulo&quot;&gt;👁 Selecione um projeto&lt;/h2&gt;
        &lt;div style=&quot;display:flex;gap:6px;flex-wrap:wrap;&quot; id=&quot;previewAcoes&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;abas&quot; id=&quot;abas&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;preview-box&quot; id=&quot;previewBox&quot;&gt;
        &lt;div class=&quot;vazio&quot;&gt;Selecione um projeto na lista para visualizar.&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

  &lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
let projetos = [];
let projetoAtivo = null;
let abaAtiva = &quot;render&quot;;
let filtrados = [];

// DRAG DROP
const drop = document.getElementById(&quot;drop&quot;);
drop.addEventListener(&quot;dragover&quot;, e =&gt; { e.preventDefault(); drop.style.background = &quot;#dbeafe&quot;; });
drop.addEventListener(&quot;dragleave&quot;, () =&gt; { drop.style.background = &quot;#eff6ff&quot;; });
drop.addEventListener(&quot;drop&quot;, e =&gt; {
  e.preventDefault();
  drop.style.background = &quot;#eff6ff&quot;;
  const f = e.dataTransfer.files[0];
  if (f) processarArquivo(f);
});

function carregarCSV(e) {
  const f = e.target.files[0];
  if (f) processarArquivo(f);
}

function processarArquivo(file) {
  document.getElementById(&quot;progressArea&quot;).style.display = &quot;block&quot;;
  document.getElementById(&quot;progressTxt&quot;).textContent = &quot;Lendo arquivo...&quot;;
  document.getElementById(&quot;progressBar&quot;).style.width = &quot;10%&quot;;

  const reader = new FileReader();
  reader.onload = function(e) {
    document.getElementById(&quot;progressBar&quot;).style.width = &quot;40%&quot;;
    document.getElementById(&quot;progressTxt&quot;).textContent = &quot;Processando linhas...&quot;;

    setTimeout(() =&gt; {
      try {
        projetos = parseCSVCompleto(e.target.result);
        document.getElementById(&quot;progressBar&quot;).style.width = &quot;90%&quot;;
        document.getElementById(&quot;progressTxt&quot;).textContent = projetos.length + &quot; projetos encontrados!&quot;;

        setTimeout(() =&gt; {
          document.getElementById(&quot;progressArea&quot;).style.display = &quot;none&quot;;
          document.getElementById(&quot;painelPrincipal&quot;).style.display = &quot;block&quot;;
          filtrados = [...projetos];
          renderizarLista();
        }, 400);
      } catch(err) {
        alert(&quot;Erro ao processar CSV:\n&quot; + err.message);
        document.getElementById(&quot;progressArea&quot;).style.display = &quot;none&quot;;
      }
    }, 50);
  };
  reader.readAsText(file, &quot;UTF-8&quot;);
}

// PARSER CSV ROBUSTO — lida com campos gigantes com quebras de linha
function parseCSVCompleto(texto) {
  const resultado = [];
  let i = 0;
  const len = texto.length;

  // Detectar separador
  const primeiraLinha = texto.slice(0, 500);
  const sep = primeiraLinha.includes(&quot;\t&quot;) ? &quot;\t&quot; : &quot;,&quot;;

  // Ler cabeçalho
  const cabecalho = lerLinha(texto, 0, sep);
  const colunas = cabecalho.valores.map(c =&gt; c.trim().toLowerCase());
  i = cabecalho.proximo;

  // Mapear índices
  const iId    = colunas.findIndex(c =&gt; c === &quot;id&quot;);
  const iTitle = colunas.findIndex(c =&gt; c.includes(&quot;title&quot;) || c.includes(&quot;titulo&quot;) || c.includes(&quot;nome&quot;));
  const iHtml  = colunas.findIndex(c =&gt; c === &quot;html&quot;);
  const iCss   = colunas.findIndex(c =&gt; c === &quot;css&quot;);
  const iJs    = colunas.findIndex(c =&gt; c === &quot;js&quot; || c === &quot;javascript&quot;);
  const iMode  = colunas.findIndex(c =&gt; c === &quot;mode&quot; || c === &quot;tipo&quot; || c === &quot;type&quot;);

  let count = 0;
  while (i &lt; len) {
    const linha = lerLinha(texto, i, sep);
    if (!linha) break;
    i = linha.proximo;

    const v = linha.valores;
    if (!v || v.length &lt; 2) continue;

    const proj = {
      id:    iId    &gt;= 0 ? v[iId]    || &quot;&quot; : String(count + 1),
      title: iTitle &gt;= 0 ? v[iTitle] || &quot;&quot; : &quot;Projeto &quot; + (count + 1),
      html:  iHtml  &gt;= 0 ? v[iHtml]  || &quot;&quot; : &quot;&quot;,
      css:   iCss   &gt;= 0 ? v[iCss]   || &quot;&quot; : &quot;&quot;,
      js:    iJs    &gt;= 0 ? v[iJs]    || &quot;&quot; : &quot;&quot;,
      mode:  iMode  &gt;= 0 ? v[iMode]  || &quot;&quot; : &quot;&quot;,
    };

    if (!proj.title.trim()) proj.title = &quot;Projeto &quot; + (count + 1);

    resultado.push(proj);
    count++;
  }

  return resultado;
}

function lerLinha(texto, inicio, sep) {
  const valores = [];
  let i = inicio;
  const len = texto.length;
  let campo = &quot;&quot;;
  let dentroAspas = false;

  while (i &lt; len) {
    const c = texto[i];

    if (c === '&quot;') {
      if (dentroAspas &amp;&amp; texto[i+1] === '&quot;') {
        campo += '&quot;';
        i += 2;
        continue;
      }
      dentroAspas = !dentroAspas;
      i++;
      continue;
    }

    if (c === sep &amp;&amp; !dentroAspas) {
      valores.push(campo);
      campo = &quot;&quot;;
      i++;
      continue;
    }

    if ((c === &quot;\n&quot; || (c === &quot;\r&quot; &amp;&amp; texto[i+1] === &quot;\n&quot;)) &amp;&amp; !dentroAspas) {
      valores.push(campo);
      if (c === &quot;\r&quot;) i++;
      i++;
      return { valores, proximo: i };
    }

    campo += c;
    i++;
  }

  if (campo || valores.length) {
    valores.push(campo);
    return { valores, proximo: i };
  }

  return null;
}

// FILTRAR
function filtrar() {
  const termo = document.getElementById(&quot;busca&quot;).value.toLowerCase().trim();
  filtrados = termo
    ? projetos.filter(p =&gt; p.title.toLowerCase().includes(termo) || p.mode.toLowerCase().includes(termo))
    : [...projetos];
  renderizarLista();
}

// RENDERIZAR LISTA
function renderizarLista() {
  const lista = document.getElementById(&quot;lista&quot;);
  const contador = document.getElementById(&quot;contadorGeral&quot;);
  lista.innerHTML = &quot;&quot;;

  contador.textContent = filtrados.length + &quot; de &quot; + projetos.length + &quot; projeto(s)&quot;;

  if (!filtrados.length) {
    lista.innerHTML = '&lt;div class=&quot;vazio&quot;&gt;Nenhum projeto encontrado.&lt;/div&gt;';
    return;
  }

  filtrados.forEach(p =&gt; {
    const temHtml = p.html.trim().length &gt; 0;
    const temCss  = p.css.trim().length &gt; 0;
    const temJs   = p.js.trim().length &gt; 0;

    const tamanho = ((p.html.length + p.css.length + p.js.length) / 1024).toFixed(1);

    const card = document.createElement(&quot;div&quot;);
    card.className = &quot;card&quot; + (projetoAtivo?.id === p.id ? &quot; ativo&quot; : &quot;&quot;);
    card.innerHTML = `
      &lt;div class=&quot;card-topo&quot;&gt;
        &lt;div class=&quot;icone&quot;&gt;🌐&lt;/div&gt;
        &lt;div class=&quot;card-info&quot;&gt;
          &lt;div class=&quot;card-titulo&quot;&gt;${esc(p.title)}&lt;/div&gt;
          &lt;div class=&quot;card-meta&quot;&gt;ID: ${esc(p.id)} · ${tamanho} KB ${p.mode ? &quot;· &quot; + esc(p.mode) : &quot;&quot;}&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tags&quot;&gt;
        ${temHtml ? '&lt;span class=&quot;tag tag-html&quot;&gt;HTML&lt;/span&gt;' : '&lt;span class=&quot;tag tag-vazio&quot;&gt;sem HTML&lt;/span&gt;'}
        ${temCss  ? '&lt;span class=&quot;tag tag-css&quot;&gt;CSS&lt;/span&gt;'   : &quot;&quot;}
        ${temJs   ? '&lt;span class=&quot;tag tag-js&quot;&gt;JS&lt;/span&gt;'     : &quot;&quot;}
      &lt;/div&gt;
      &lt;div class=&quot;mini-acoes&quot;&gt;
        &lt;button class=&quot;b-azul&quot;   onclick=&quot;abrirProjeto('${esc(p.id)}')&quot;&gt;👁 Ver&lt;/button&gt;
        &lt;button class=&quot;b-verde&quot;  onclick=&quot;baixarProjeto('${esc(p.id)}')&quot;&gt;⬇ HTML&lt;/button&gt;
        &lt;button class=&quot;b-roxo&quot;   onclick=&quot;copiarProjeto('${esc(p.id)}')&quot;&gt;📋 Copiar&lt;/button&gt;
      &lt;/div&gt;
    `;

    card.addEventListener(&quot;click&quot;, function(ev) {
      if (ev.target.tagName === &quot;BUTTON&quot;) return;
      abrirProjeto(p.id);
    });

    lista.appendChild(card);
  });
}

// ABRIR PROJETO
function abrirProjeto(id) {
  projetoAtivo = projetos.find(p =&gt; p.id === id) || filtrados.find(p =&gt; p.id === id);
  if (!projetoAtivo) return;
  abaAtiva = &quot;render&quot;;
  renderizarLista();
  renderizarPreview();
  document.getElementById(&quot;painelPrincipal&quot;).scrollIntoView({ behavior: &quot;smooth&quot; });
}

// RENDERIZAR PREVIEW
function renderizarPreview() {
  const p = projetoAtivo;
  if (!p) return;

  document.getElementById(&quot;previewTitulo&quot;).textContent = &quot;👁 &quot; + p.title;

  // Ações
  document.getElementById(&quot;previewAcoes&quot;).innerHTML = `
    &lt;button class=&quot;b-verde&quot;  onclick=&quot;baixarProjeto('${esc(p.id)}')&quot;&gt;⬇ Baixar HTML&lt;/button&gt;
    &lt;button class=&quot;b-roxo&quot;   onclick=&quot;copiarProjeto('${esc(p.id)}')&quot;&gt;📋 Copiar&lt;/button&gt;
    &lt;button class=&quot;b-laranja&quot; onclick=&quot;abrirNovaAba('${esc(p.id)}')&quot;&gt;🔗 Abrir em nova aba&lt;/button&gt;
  `;

  // Abas
  const abas = [
    { id: &quot;render&quot;, label: &quot;🌐 Render&quot; },
    { id: &quot;html&quot;,   label: &quot;HTML&quot; },
    { id: &quot;css&quot;,    label: &quot;CSS&quot; },
    { id: &quot;js&quot;,     label: &quot;JS&quot; },
    { id: &quot;tudo&quot;,   label: &quot;📄 Código completo&quot; },
  ];

  document.getElementById(&quot;abas&quot;).innerHTML = abas.map(a =&gt;
    `&lt;div class=&quot;aba ${abaAtiva === a.id ? &quot;ativa&quot; : &quot;&quot;}&quot; onclick=&quot;mudarAba('${a.id}')&quot;&gt;${a.label}&lt;/div&gt;`
  ).join(&quot;&quot;);

  // Conteúdo
  const box = document.getElementById(&quot;previewBox&quot;);

  if (abaAtiva === &quot;render&quot;) {
    const html = montarHTML(p);
    box.innerHTML = `&lt;iframe id=&quot;iframePreview&quot; srcdoc=&quot;${escAttr(html)}&quot;&gt;&lt;/iframe&gt;`;
  } else if (abaAtiva === &quot;html&quot;) {
    box.innerHTML = `&lt;pre&gt;${esc(p.html || &quot;(vazio)&quot;)}&lt;/pre&gt;`;
  } else if (abaAtiva === &quot;css&quot;) {
    box.innerHTML = `&lt;pre&gt;${esc(p.css || &quot;(vazio)&quot;)}&lt;/pre&gt;`;
  } else if (abaAtiva === &quot;js&quot;) {
    box.innerHTML = `&lt;pre&gt;${esc(p.js || &quot;(vazio)&quot;)}&lt;/pre&gt;`;
  } else if (abaAtiva === &quot;tudo&quot;) {
    box.innerHTML = `&lt;pre&gt;${esc(montarHTML(p))}&lt;/pre&gt;`;
  }
}

function mudarAba(aba) {
  abaAtiva = aba;
  renderizarPreview();
}

// MONTAR HTML COMPLETO
function montarHTML(p) {
  // Se o HTML já é um documento completo
  const htmlTrim = (p.html || &quot;&quot;).trim();

  if (htmlTrim.toLowerCase().includes(&quot;&lt;!doctype&quot;) || htmlTrim.toLowerCase().startsWith(&quot;&lt;html&quot;)) {
    // Já é documento completo — injeta CSS e JS se existirem separados
    let resultado = htmlTrim;

    if (p.css &amp;&amp; p.css.trim()) {
      resultado = resultado.replace(&quot;&lt;/head&gt;&quot;, `&lt;style&gt;\n${p.css}\n&lt;/style&gt;\n&lt;/head&gt;`);
      if (!resultado.includes(&quot;&lt;/head&gt;&quot;)) {
        resultado = `&lt;style&gt;\n${p.css}\n&lt;/style&gt;\n` + resultado;
      }
    }

    if (p.js &amp;&amp; p.js.trim()) {
      resultado = resultado.replace(&quot;&lt;/body&gt;&quot;, `&lt;script&gt;\n${p.js}\n&lt;\/script&gt;\n&lt;/body&gt;`);
      if (!resultado.includes(&quot;&lt;/body&gt;&quot;)) {
        resultado += `\n&lt;script&gt;\n${p.js}\n&lt;\/script&gt;`;
      }
    }

    return resultado;
  }

  // Monta documento do zero
  return `&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;pt-BR&quot;&gt;
&lt;head&gt;
  &lt;meta charset=&quot;UTF-8&quot;&gt;
  &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
  &lt;title&gt;${esc(p.title)}&lt;/title&gt;
  &lt;style&gt;
${p.css || &quot;&quot;}
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
${p.html || &quot;&quot;}
&lt;script&gt;
${p.js || &quot;&quot;}
&lt;\/script&gt;
&lt;/body&gt;
&lt;/html&gt;`;
}

// BAIXAR PROJETO
function baixarProjeto(id) {
  const p = projetos.find(x =&gt; x.id === id) || filtrados.find(x =&gt; x.id === id);
  if (!p) return;

  const html = montarHTML(p);
  const nome = limparNome(p.title) + &quot;.html&quot;;
  baixarBlob(html, nome, &quot;text/html;charset=utf-8&quot;);
}

// ABRIR EM NOVA ABA
function abrirNovaAba(id) {
  const p = projetos.find(x =&gt; x.id === id) || filtrados.find(x =&gt; x.id === id);
  if (!p) return;

  const html = montarHTML(p);
  const blob = new Blob([html], { type: &quot;text/html;charset=utf-8&quot; });
  const url = URL.createObjectURL(blob);
  window.open(url, &quot;_blank&quot;);
}

// COPIAR
function copiarProjeto(id) {
  const p = projetos.find(x =&gt; x.id === id) || filtrados.find(x =&gt; x.id === id);
  if (!p) return;

  navigator.clipboard.writeText(montarHTML(p))
    .then(() =&gt; alert(&quot;Código copiado! Cole no Bloco de Notas e salve como .html&quot;))
    .catch(() =&gt; alert(&quot;Não foi possível copiar automaticamente.&quot;));
}

// BAIXAR TODOS
function baixarTodos() {
  if (!filtrados.length) return;

  if (!confirm(&quot;Baixar &quot; + filtrados.length + &quot; projetos? Serão baixados um por um.&quot;)) return;

  let i = 0;
  function proximo() {
    if (i &gt;= filtrados.length) {
      alert(&quot;Todos os projetos foram baixados!&quot;);
      return;
    }
    baixarProjeto(filtrados[i].id);
    i++;
    setTimeout(proximo, 600);
  }
  proximo();
}

// LIMPAR
function limpar() {
  if (!confirm(&quot;Limpar tudo?&quot;)) return;
  projetos = [];
  filtrados = [];
  projetoAtivo = null;
  document.getElementById(&quot;painelPrincipal&quot;).style.display = &quot;none&quot;;
  document.getElementById(&quot;inp&quot;).value = &quot;&quot;;
}

// UTILITÁRIOS
function limparNome(nome) {
  return String(nome)
    .normalize(&quot;NFD&quot;).replace(/[\u0300-\u036f]/g, &quot;&quot;)
    .replace(/[^\w\s\-]/g, &quot;&quot;)
    .replace(/\s+/g, &quot;-&quot;)
    .replace(/-+/g, &quot;-&quot;)
    .replace(/^-|-$/g, &quot;&quot;)
    .toLowerCase()
    .slice(0, 80) || &quot;projeto&quot;;
}

function baixarBlob(conteudo, nome, tipo) {
  const blob = new Blob([conteudo], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement(&quot;a&quot;);
  a.href = url;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function esc(str) {
  return String(str || &quot;&quot;)
    .replace(/&amp;/g, &quot;&amp;amp;&quot;)
    .replace(/&lt;/g, &quot;&amp;lt;&quot;)
    .replace(/&gt;/g, &quot;&amp;gt;&quot;)
    .replace(/&quot;/g, &quot;&amp;quot;&quot;);
}

function escAttr(str) {
  return esc(str).replace(/\n/g, &quot;&amp;#10;&quot;).replace(/'/g, &quot;&amp;#039;&quot;);
}
&lt;/script&gt;
&lt;/body&gt;

&lt;html lang=&quot;pt-BR&quot;&gt;

&lt;style&gt;
:root {
  --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;
  --text:#e2e8f0;--text2:#94a3b8;
  --accent:#a3a082;--accent2:#d4d0a8;
  --blue:#3b82f6;--green:#4ade80;--red:#f87171;--yellow:#fbbf24;
  --border:#334155;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:4px;}
.header-left{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.header-right{display:flex;align-items:center;gap:3px;flex-wrap:wrap;}
.logo{font-weight:800;font-size:13px;color:var(--accent);white-space:nowrap;}
.logo small{font-size:9px;color:var(--text2);font-weight:400;display:block;}
.title-input{background:transparent;border:1px solid transparent;color:var(--text);font-size:12px;padding:3px 7px;border-radius:6px;width:130px;}
.title-input:focus{outline:none;border-color:var(--accent);}
.btn{display:inline-flex;align-items:center;gap:3px;padding:4px 9px;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-icon{padding:5px 7px;border-radius:6px;background:transparent;border:none;color:var(--text2);cursor:pointer;font-size:12px;transition:all .15s;}
.btn-icon:hover{background:var(--bg3);color:var(--text);}
.btn-primary{background:var(--accent);color:#000;}
.btn-primary:hover{background:var(--accent2);}
.btn-ghost{background:transparent;color:var(--text2);}
.btn-ghost:hover{background:var(--bg3);color:var(--text);}
.btn-mode{padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;}
.btn-mode.active{background:var(--accent);color:#000;border-color:var(--accent);}
.mode-group{display:flex;gap:2px;background:var(--bg);padding:2px;border-radius:7px;border:1px solid var(--border);}

/* TABS */
.tabs-bar{display:flex;align-items:center;justify-content:space-between;padding:3px 8px;background:var(--bg2);border-bottom:1px solid var(--border);}
.tabs{display:flex;gap:2px;}
.tab{padding:4px 10px;font-size:11px;font-weight:600;border:none;background:transparent;color:var(--text2);cursor:pointer;border-radius:6px;transition:all .15s;}
.tab.active{background:var(--bg3);color:var(--text);}
.tab-info{font-size:10px;color:var(--text2);display:flex;align-items:center;gap:6px;}
.badge{font-size:9px;padding:2px 5px;border-radius:4px;font-weight:700;text-transform:uppercase;}
.badge-html{background:rgba(239,68,68,.15);color:var(--red);}
.badge-react{background:rgba(59,130,246,.15);color:var(--blue);}
.badge-python{background:rgba(251,191,36,.15);color:var(--yellow);}

/* MAIN */
.main{display:flex;flex:1;overflow:hidden;}

/* EDITOR */
.editor-panel{display:flex;flex-direction:column;width:38%;border-right:1px solid var(--border);transition:width .3s;min-width:0;}
.editor-panel.hidden{display:none;}
.editor-panel.full{width:100%;}
.editor-wrap{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;}
.editor-container{flex:1;position:relative;overflow:hidden;}
.editor-textarea{width:100%;height:100%;resize:none;background:var(--bg);color:var(--text);font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:12px;line-height:1.6;padding:10px 10px 10px 44px;border:none;outline:none;tab-size:2;position:absolute;inset:0;}
.line-numbers{position:absolute;left:0;top:0;bottom:0;width:36px;background:rgba(30,41,59,.6);padding:10px 4px 10px 0;text-align:right;font-family:'Consolas',monospace;font-size:11px;line-height:1.6;color:var(--text2);opacity:.6;overflow:hidden;pointer-events:none;user-select:none;z-index:1;}

/* QUICK EDIT PANEL */
.quick-edit-bar{display:flex;gap:3px;padding:5px 8px;background:var(--bg3);border-bottom:1px solid var(--border);flex-shrink:0;align-items:center;font-size:11px;}
.quick-edit-input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:5px;font-size:11px;flex:1;outline:none;font-family:monospace;}
.quick-edit-input:focus{border-color:var(--accent);}
.quick-edit-actions{display:flex;gap:2px;}

/* PREVIEW */
.preview-panel{display:flex;flex-direction:column;flex:1;min-width:0;border-right:1px solid var(--border);transition:all .3s;}
.preview-panel.minimized{flex:0 0 60px;}
.preview-panel.minimized .preview-frame{display:none;}
.preview-panel.minimized .preview-header{cursor:pointer;}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.preview-frame{flex:1;border:none;background:#fff;}
.preview-header{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;justify-content:space-between;}
.preview-header-left{display:flex;align-items:center;gap:6px;}
.preview-header-right{display:flex;gap:3px;}

/* CHAT IA */
.chat-panel{display:flex;flex-direction:column;width:300px;flex-shrink:0;}
.chat-panel.hidden{display:none;}
.chat-panel.wide{width:420px;}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;}
.chat-header-left{display:flex;align-items:center;gap:6px;}
.chat-messages{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px;}
.msg{padding:8px 10px;border-radius:8px;font-size:11.5px;line-height:1.5;word-break:break-word;}
.msg-user{background:#1e3a8a;color:#fff;align-self:flex-end;max-width:92%;}
.msg-ai{background:#111827;border:1px solid var(--bg3);color:var(--text);align-self:flex-start;max-width:98%;white-space:pre-wrap;}
.msg-sys{background:var(--bg2);border:1px solid var(--border);color:#4b5563;font-size:10px;align-self:center;text-align:center;padding:4px 8px;border-radius:5px;}
.apply-btn{display:block;width:100%;margin-top:7px;padding:6px;background:#15803d;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:11px;font-weight:700;}
.apply-btn:hover{background:#16a34a;}
.chat-bottom{padding:7px;background:var(--bg2);border-top:1px solid var(--border);display:flex;gap:5px;flex-shrink:0;}
#chatInput{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:6px 8px;color:var(--text);font-size:11px;outline:none;resize:none;font-family:inherit;}
#chatInput:focus{border-color:#2563eb;}
#chatSend{background:#1d4ed8;color:#fff;border:none;border-radius:7px;padding:6px 10px;cursor:pointer;font-size:15px;}
#chatSend:hover{background:#2563eb;}
#chatSend:disabled{background:var(--bg3);cursor:not-allowed;}

/* MODAIS */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
.overlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;width:90%;max-width:460px;max-height:82vh;overflow-y:auto;}
.modal h3{font-size:15px;margin-bottom:12px;color:var(--accent);}
.minput{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;margin-bottom:10px;outline:none;font-family:inherit;}
.minput:focus{border-color:var(--accent);}

/* SALVOS */
.sitem{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:5px;cursor:pointer;transition:all .15s;}
.sitem:hover{border-color:var(--accent);background:var(--bg3);}
.sitem-name{font-size:12px;font-weight:600;}
.sitem-meta{font-size:10px;color:var(--text2);}
.sitem-actions{display:flex;gap:2px;flex-shrink:0;}

/* FULLSCREEN EDITOR */
#fsModal{display:none;position:fixed;inset:0;background:var(--bg);z-index:999;flex-direction:column;}
#fsModal.open{display:flex;}
#fsBar{background:var(--bg2);padding:7px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
#fsEditor{flex:1;width:100%;background:var(--bg);color:var(--text);border:none;outline:none;padding:18px;font-family:'Cascadia Code','Consolas',monospace;font-size:14px;line-height:1.7;resize:none;}

/* LOADING */
.dots{display:flex;gap:4px;padding:8px 10px;}
.dot{width:7px;height:7px;background:#7c3aed;border-radius:50%;animation:blink .8s infinite;}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* TOAST */
.toast{position:fixed;bottom:16px;right:16px;background:var(--bg2);border:1px solid var(--accent);border-radius:9px;padding:10px 16px;font-size:12px;font-weight:600;color:var(--accent2);z-index:2000;transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}

/* STATUS */
#saveStatus{font-size:10px;color:#4ade80;}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}

@media(max-width:768px){
  .main{flex-direction:column;}
  .editor-panel{width:100%!important;height:40%;border-right:none;border-bottom:1px solid var(--border);}
  .preview-panel{height:35%;}
  .chat-panel{width:100%;height:25%;}
}

function updateLineNumbers() {

function saveCurrentTab() {
  const t = state.activeTab;
  if (state.mode==='react'&amp;&amp;t==='jsx') state.jsx=editor.value;
  else if (state.mode==='python'&amp;&amp;t==='python') state.python=editor.value;
  else if (t==='html') state.html=editor.value;
  else if (t==='css')  state.css=editor.value;
  else if (t==='js')   state.js=editor.value;
}

function loadEditorContent() {
  const t = state.activeTab;
  if (state.mode==='react'&amp;&amp;t==='jsx') editor.value=state.jsx;
  else if (state.mode==='python'&amp;&amp;t==='python') editor.value=state.python;
  else if (t==='html') editor.value=state.html;
  else if (t==='css')  editor.value=state.css;
  else if (t==='js')   editor.value=state.js;

// EDIÇÃO RÁPIDA

function startQuickEdit() {
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  
  if (start === end) {
    showToast('⚠️ Selecione um trecho para editar');
    return;
  }
  
  quickEditSelection = { start, end };
  quickEditMode = true;
  document.getElementById('quickEditBar').style.display = 'flex';
  document.getElementById('quickEditInput').focus();
  showToast('✏️ Modo edição rápida ativado');
}

function applyQuickEdit() {
  if (!quickEditSelection) return;
  
  const instruction = document.getElementById('quickEditInput').value.trim();
  if (!instruction) {
    showToast('⚠️ Digite uma instrução');
    return;
  }
  
  const selectedText = editor.value.substring(quickEditSelection.start, quickEditSelection.end);
  const before = editor.value.substring(0, quickEditSelection.start);
  const after = editor.value.substring(quickEditSelection.end);
  
  // Aqui você pode chamar a IA para alterar o trecho
  // Por enquanto, vou fazer uma alteração simples como exemplo
  const modified = `/* ${instruction} */\n${selectedText}`;
  
  editor.value = before + modified + after;
  saveCurrentTab();
  updateLineNumbers();
  autoSave();
  updatePreview();
  
  cancelQuickEdit();
  showToast('✅ Trecho atualizado!');
}

function cancelQuickEdit() {
  quickEditMode = false;
  quickEditSelection = null;
  document.getElementById('quickEditBar').style.display = 'none';
  document.getElementById('quickEditInput').value = '';
  editor.focus();
}

function saveProject() {
  saveCurrentTab();
  const snippets = getSnippets();
  const now = new Date().toISOString();
  let id = state.currentId;

  if (!id) {
    id = Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    state.currentId = id;
    localStorage.setItem(K_CURRID, id);
  }

  const item = {
    id,
    title: state.title || 'Sem titulo',
    mode: state.mode,
    activeTab: state.activeTab,
    html: state.html, css: state.css, js: state.js,
    jsx: state.jsx, python: state.python,
    updatedAt: now
  };

  const idx = snippets.findIndex(s=&gt;s.id===id);
  if (idx&gt;=0) {
    item.createdAt = snippets[idx].createdAt || snippets[idx].updatedAt || now;
    snippets[idx] = item;
    showToast('💾 Projeto atualizado!');
  } else {
    item.createdAt = now;
    snippets.unshift(item);
    showToast('💾 Projeto salvo!');
  }

  setSnippets(snippets);
  autoSave();
}

function saveAsNew() {

function loadProject(id) {
  const s = getSnippets().find(x=&gt;x.id===id);
  if (!s) return;

  state.currentId = s.id;
  localStorage.setItem(K_CURRID, s.id);

  state.title   = s.title   || 'Sem titulo';
  state.mode    = s.mode    || 'html';
  state.activeTab = s.activeTab || (s.mode==='react'?'jsx':s.mode==='python'?'python':'html');
  state.html    = s.html    || '';
  state.css     = s.css     || '';
  state.js      = s.js      || '';
  state.jsx     = s.jsx     || '';
  state.python  = s.python  || '';

  titleInput.value = state.title;

  document.querySelectorAll('.btn-mode').forEach(b=&gt;b.classList.remove('active'));
  const mb = document.getElementById('mode'+state.mode.charAt(0).toUpperCase()+state.mode.slice(1));

function deleteProject(id) {
  if (!confirm('Excluir este projeto?')) return;
  setSnippets(getSnippets().filter(s=&gt;s.id!==id));
  if (state.currentId===id) { state.currentId=null; localStorage.removeItem(K_CURRID); }
  renderSaved();
  showToast('🗑️ Excluído!');
}

function renameProject(id) {
  const list = getSnippets();
  const s = list.find(x=&gt;x.id===id);
  if (!s) return;
  const n = prompt('Novo nome:', s.title);
  if (n&amp;&amp;n.trim()) {
    s.title=n.trim();
    if (state.currentId===id) { state.title=s.title; titleInput.value=s.title; }
    setSnippets(list); renderSaved(); showToast('✏️ Renomeado!');
  }
}

  showToast('📊 Backup em CSV realizado!');
}

function importFile() { document.getElementById('fileInput').click(); }

document.getElementById('fileInput').addEventListener('change', e =&gt; {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev =&gt; {
    const content = ev.target.result;
    const ext = file.name.split('.').pop().toLowerCase();
    const name = file.name.replace(/\.[^.]+$/,'');

    if (ext==='csv') {
      // Importar CSV
      importCSV(content);
      return;
    }

    if (ext==='py') { switchMode('python'); state.python=content; }
    else if (ext==='jsx'||ext==='tsx') { switchMode('react'); state.jsx=content; }
    else if (ext==='css') { state.css=content; if(state.mode==='html') switchTab('css'); }
    else if (ext==='js') { state.js=content; if(state.mode==='html') switchTab('js'); }
    else {
      const lower=content.trim().toLowerCase();
      switchMode('html');
      state.html=content; state.css=''; state.js='';
    }

    state.title=name; titleInput.value=name;
    loadEditorContent(); updatePreview(); autoSave();
    showToast('📂 &quot;'+file.name+'&quot; importado!');
  };
  reader.readAsText(file);
  e.target.value='';
});

function importCSV(csvContent) {
  try {
    const lines = csvContent.trim().split('\n');
    if (lines.length &lt; 2) {
      showToast('⚠️ CSV inválido');
      return;
    }
    
    const snippets = getSnippets();
    let imported = 0;
    
    for (let i = 1; i &lt; lines.length; i++) {
      const line = lines[i];
      const parts = parseCSVLine(line);
      
      if (parts.length &gt;= 6) {
        const item = {
          id: parts[0],
          title: parts[1],
          html: parts[2],
          css: parts[3],
          js: parts[4],
          mode: parts[5],
          jsx: '',
          python: '',
          activeTab: 'html',
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        
        const idx = snippets.findIndex(s =&gt; s.id === item.id);
        if (idx &gt;= 0) {
          snippets[idx] = item;
        } else {
          snippets.push(item);
        }
        imported++;
      }
    }
    
    setSnippets(snippets);
    showToast(`✅ ${imported} projeto(s) importado(s)!`);
  } catch (err) {
    showToast('❌ Erro ao importar CSV: ' + err.message);
  }
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  
  for (let i = 0; i &lt; line.length; i++) {
    const char = line[i];
    
    if (char === '&quot;') {
      inQuotes = !inQuotes;
    } else if (char === ';' &amp;&amp; !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += char;
    }
  }
  
  result.push(current);
  return result;
}

function downloadFile() {
  let content, ext, mime;
  if (state.mode==='python'){content=state.python;ext='py';mime='text/plain';}
  else if (state.mode==='react'){content=state.jsx;ext='jsx';mime='text/plain';}
  else {content=buildDocument();ext='html';mime='text/html';}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:mime}));
  a.download=(state.title||'playground')+'.'+ext;
  a.click(); URL.revokeObjectURL(a.href);
  showToast('⬇️ Baixado!');
}

function copyCode() {
  navigator.clipboard.writeText(buildDocument()).then(()=&gt;showToast('📋 Copiado!'));

function clearCode() {

  if (state.mode==='react') state.jsx='';
  else if (state.mode==='python') state.python='';
  else { state.html=''; state.css=''; state.js=''; }
  loadEditorContent(); updatePreview(); autoSave(); showToast('🗑️ Limpo!');
}

function toggleChat() {
  const p = document.getElementById('chatPanel');
  p.classList.toggle('hidden');
  document.getElementById('btnChat').style.color = p.classList.contains('hidden') ? 'var(--text2)' : 'var(--green)';
}

function chatKey(e) {
  if (e.key==='Enter'&amp;&amp;!e.shiftKey) { e.preventDefault(); sendMsg(); }
}

function addMsg(role, text, code) {
  const box = document.getElementById('chatMessages');
  const d = document.createElement('div');
  d.className = 'msg msg-'+role;
  d.textContent = text;
  if (code &amp;&amp; role==='ai') {
    const btn = document.createElement('button');
    btn.className = 'apply-btn';
    btn.textContent = '✅ Aplicar código no editor + atualizar preview';
    btn.onclick = () =&gt; {
      if (state.mode==='react') { state.jsx=code; state.activeTab='jsx'; }
      else if (state.mode==='python') { state.python=code; state.activeTab='python'; }
      else { state.html=code; state.css=''; state.js=''; state.activeTab='html'; }
      updateTabs(); loadEditorContent(); updateLineNumbers(); autoSave(); updatePreview();
      addMsg('sys','✅ Código aplicado. Preview atualizado.');
    };
    d.appendChild(btn);
  }
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function showDots() {
  const box=document.getElementById('chatMessages');
  const d=document.createElement('div');
  d.id='ldots'; d.className='dots';
  d.innerHTML='&lt;div class=&quot;dot&quot;&gt;&lt;/div&gt;&lt;div class=&quot;dot&quot;&gt;&lt;/div&gt;&lt;div class=&quot;dot&quot;&gt;&lt;/div&gt;';
  box.appendChild(d); box.scrollTop=box.scrollHeight;
}
function hideDots() { const el=document.getElementById('ldots'); if(el)el.remove(); }

async function sendMsg() {
  const inp = document.getElementById('chatInput');
  const text = inp.value.trim();
  if (!text) return;
  if (!apiKey) { openApiModal(); showToast('🔑 Configure a API Key primeiro.'); return; }

  inp.value='';
  document.getElementById('chatSend').disabled=true;
  addMsg('user', text);

  const code = buildDocument();
  const fullMsg = `${sysPrompt}

MODO: ${state.mode} | ARQUIVO: ${state.title}

CÓDIGO ATUAL NO EDITOR:
\`\`\`${state.mode==='python'?'python':state.mode==='react'?'jsx':'html'}
${code.substring(0,12000)}
\`\`\`

PEDIDO:
${text}`;

  showDots();
  try {
    const reply = provider==='gemini' ? await callGemini(fullMsg) : await callOpenAI(fullMsg);
    hideDots();
    const match = reply.match(/```(?:html|js|javascript|jsx|tsx|css|python|py)?\n?([\s\S]*?)```/);
    addMsg('ai', reply, match ? match[1].trim() : null);
  } catch(err) {
    hideDots();
    addMsg('sys','❌ '+err.message);
  }
  document.getElementById('chatSend').disabled=false;
}

async function callGemini(msg) {
  const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    contents:[{role:'user',parts:[{text:msg}]}],
    generationConfig:{temperature:0.2,maxOutputTokens:8192}
  })});
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'Erro Gemini');}
  const d=await r.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text||'Sem resposta.';
}

async function callOpenAI(msg) {
  const r=await fetch('https://api.openai.com/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
    body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'user',content:msg}],temperature:0.2,max_tokens:8192})
  });
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'Erro OpenAI');}
  const d=await r.json();
  return d.choices?.[0]?.message?.content||'Sem resposta.';
}

function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showToast('🎙️ Navegador não suporta voz. Use Chrome.'); return; }

  const p = document.getElementById('chatPanel');
  if (p.classList.contains('hidden')) toggleChat();

  const rec = new SR();
  rec.lang='pt-BR'; rec.interimResults=false; rec.maxAlternatives=1;

  showToast('🎙️ Fale agora...');

  rec.onresult = e =&gt; {
    const txt = e.results[0][0].transcript;
    document.getElementById('chatInput').value = txt;
    showToast('🎙️ Capturado: &quot;'+txt+'&quot;');
  };
  rec.onerror = e =&gt; showToast('Erro no microfone: '+e.error);
  rec.start();
}

function esc(s) { 
  return String(s)
    .replace(/&amp;/g,'&amp;amp;')
    .replace(/&lt;/g,'&amp;lt;')
    .replace(/&gt;/g,'&amp;gt;')
    .replace(/&quot;/g,'&amp;quot;')
    .replace(/\n/g,'\\n')
    .replace(/\r/g,'\\r')
    .replace(/\t/g,'\\t');
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; 
  t.classList.add('show');
  setTimeout(()=&gt;t.classList.remove('show'),2500);
}

/*══════════════════════════════════════════════════════════════════
  AUTO-DETECÇÃO AMPLIADA DE PROVEDORES
══════════════════════════════════════════════════════════════════*/
const AUTO_DETECT = [
  { prefix:'gsk_',    url:'https://api.groq.com/openai/v1',                          model:'llama-3.3-70b-versatile', name:'Groq' },
  { prefix:'sk-or-',  url:'https://openrouter.ai/api/v1',                            model:'openai/gpt-4o-mini',      name:'OpenRouter' },
  { prefix:'sk-ant-', url:'https://api.anthropic.com/v1',                            model:'claude-3-5-haiku-latest', name:'Anthropic Claude' },
  { prefix:'pplx-',   url:'https://api.perplexity.ai',                               model:'sonar-pro',               name:'Perplexity' },
  { prefix:'AIza',    url:'https://generativelanguage.googleapis.com/v1beta/openai', model:'gemini-2.0-flash',        name:'Google Gemini' },
  { prefix:'xai-',    url:'https://api.x.ai/v1',                                     model:'grok-2-latest',           name:'xAI/Grok' },
  { prefix:'hf_',     url:'https://api-inference.huggingface.co/v1',                 model:'meta-llama/Llama-3.3-70B-Instruct', name:'HuggingFace' },
  { prefix:'csk-',    url:'https://api.cerebras.ai/v1',                              model:'llama-3.3-70b',           name:'Cerebras' },
  { prefix:'fw_',     url:'https://api.fireworks.ai/inference/v1',                   model:'accounts/fireworks/models/llama-v3p3-70b-instruct', name:'Fireworks' },
  { prefix:'tgp_',    url:'https://api.together.xyz/v1',                             model:'meta-llama/Llama-3.3-70B-Instruct-Turbo', name:'Together AI' },
  // Mistral (32 chars hex), DeepSeek (sk-...), Cohere — detectados por regex abaixo
  { prefix:'sk-',     url:'https://api.openai.com/v1',                               model:'gpt-4o-mini',             name:'OpenAI' },
];

const REGEX_DETECT = [
  { regex:/^[a-zA-Z0-9]{32}$/, url:'https://api.mistral.ai/v1', model:'mistral-small-latest', name:'Mistral' },
];

function detectProvider(key) {
  if (!key) return null;
  for (const p of AUTO_DETECT) if (key.startsWith(p.prefix)) return p;
  for (const p of REGEX_DETECT) if (p.regex.test(key)) return p;
  return null;
}

/*══════════════════════════════════════════════════════════════════
  INDEXEDDB — Auto-save robusto
══════════════════════════════════════════════════════════════════*/
const DB_NAME = 'ChatIAProDB';
const DB_VER  = 1;
let db = null;

function openDB() {
  return new Promise((resolve, reject) =&gt; {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = ev =&gt; {
      const d = ev.target.result;
      if (!d.objectStoreNames.contains('conversations')) {
        d.createObjectStore('conversations', { keyPath:'id' });
      }
      if (!d.objectStoreNames.contains('settings')) {
        d.createObjectStore('settings', { keyPath:'key' });
      }
    };
    req.onsuccess = () =&gt; { db = req.result; resolve(db); };
    req.onerror   = () =&gt; reject(req.error);
  });
}

function dbPut(store, obj) {
  return new Promise((res, rej) =&gt; {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(obj);
    tx.oncomplete = res; tx.onerror = () =&gt; rej(tx.error);
  });
}
function dbGetAll(store) {
  return new Promise((res, rej) =&gt; {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () =&gt; res(req.result);
    req.onerror   = () =&gt; rej(req.error);
  });
}
function dbGet(store, key) {
  return new Promise((res, rej) =&gt; {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () =&gt; res(req.result);
    req.onerror   = () =&gt; rej(req.error);
  });
}
function dbDelete(store, key) {
  return new Promise((res, rej) =&gt; {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = res; tx.onerror = () =&gt; rej(tx.error);
  });
}

/*══════════════════════════════════════════════════════════════════
  ESTADO
══════════════════════════════════════════════════════════════════*/
let apiKey    = localStorage.getItem('cia_key')   || '';
let apiUrl    = localStorage.getItem('cia_url')   || '';
let apiModel  = localStorage.getItem('cia_model') || '';
let savedKeys = JSON.parse(localStorage.getItem('cia_saved') || '[]');
let ttsOn     = localStorage.getItem('cia_tts') !== 'off';
let webOn     = localStorage.getItem('cia_web') === 'on';
let showKey   = false;

let history    = [];
let currentConvId = null;
let controller = null;
let isRecording= false;
let recog      = null;
let silTimer   = null;
let saveTimer  = null;

/*══════════════════════════════════════════════════════════════════
  BOOT
══════════════════════════════════════════════════════════════════*/
async function boot() {
  try { await openDB(); } catch(e) { console.warn('IndexedDB indisponível:', e); }

  const ki = document.getElementById('keyInput');
  ki.value = apiKey;
  if (apiKey) {
    const d = detectProvider(apiKey);
    if (d) {
      document.getElementById('urlInput').value = d.url;
      document.getElementById('modelInput').value = d.model;
    } else {
      document.getElementById('urlInput').value = apiUrl;
      document.getElementById('modelInput').value = apiModel;
    }
  }
  updateProvBadge();
  updateCfgStatus();
  document.getElementById('ttsBtn').style.opacity = ttsOn ? '1' : '0.4';
  document.getElementById('webBtn').classList.toggle('web-on', webOn);
  renderSavedKeys();
  await renderConvList();

  // Restaura conversa atual se houver
  const last = localStorage.getItem('cia_current_conv');
  if (last &amp;&amp; db) {
    const conv = await dbGet('conversations', last);
    if (conv &amp;&amp; conv.messages?.length) {
      currentConvId = conv.id;
      history = conv.messages;
      restoreUI();
    }
  }

  // Restaura rascunho do input
  const draft = localStorage.getItem('cia_draft');
  if (draft) {
    document.getElementById('msgInput').value = draft;
    adjustHeight(document.getElementById('msgInput'));
  }

  if (!apiKey) togglePanel('cfgPanel','cfgBtn');
}

function restoreUI() {
  document.getElementById('emptyState')?.remove();
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  history.forEach(m =&gt; appendMsg(m.role === 'user' ? 'user' : 'bot', m.content, false, true));
  addCopyListeners();
}

/*══════════════════════════════════════════════════════════════════
  AUTO-SAVE
══════════════════════════════════════════════════════════════════*/
async function autoSave() {
  if (!db || !history.length) return;
  if (!currentConvId) currentConvId = 'conv_' + Date.now();

  const firstUserMsg = history.find(m =&gt; m.role === 'user')?.content || 'Conversa';
  const title = firstUserMsg.slice(0, 60).replace(/\n/g,' ');

  const obj = {
    id: currentConvId,
    title,
    messages: history,
    updatedAt: Date.now(),
    provider: apiKey ? (detectProvider(apiKey)?.name || 'Custom') : 'Demo',
  };
  try {
    await dbPut('conversations', obj);
    localStorage.setItem('cia_current_conv', currentConvId);
  } catch(e) { console.warn('Auto-save falhou:', e); }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(autoSave, 400);
}

function autoSaveDraft() {
  const v = document.getElementById('msgInput').value;
  if (v) localStorage.setItem('cia_draft', v);
  else   localStorage.removeItem('cia_draft');
}

/*══════════════════════════════════════════════════════════════════
  PAINÉIS GENÉRICOS
══════════════════════════════════════════════════════════════════*/
function togglePanel(panelId, btnId) {
  const allPanels = ['cfgPanel','keysPanel','convPanel','ioPanel'];
  const allBtns   = ['cfgBtn','keysBtn','convBtn','ioBtn'];
  const target = document.getElementById(panelId);
  const show = !target.classList.contains('show');
  allPanels.forEach(id =&gt; document.getElementById(id).classList.remove('show'));
  allBtns.forEach(id =&gt; document.getElementById(id)?.classList.remove('active'));
  if (show) {
    target.classList.add('show');
    document.getElementById(btnId)?.classList.add('active');
  }
}

/*══════════════════════════════════════════════════════════════════
  CHAVES
══════════════════════════════════════════════════════════════════*/
function onKeyInput(val) {
  val = val.trim();
  apiKey = val;
  localStorage.setItem('cia_key', val);
  const d = val ? detectProvider(val) : null;
  if (d) {
    document.getElementById('urlInput').value  = d.url;
    document.getElementById('modelInput').value = d.model;
    apiUrl   = d.url;
    apiModel = d.model;
    localStorage.setItem('cia_url',   d.url);
    localStorage.setItem('cia_model', d.model);
    document.getElementById('cfgProvOk').textContent = '✓ ' + d.name + ' · ' + d.model;
    document.getElementById('cfgProvOk').style.display = 'block';
    document.getElementById('cfgNote').style.display = 'none';
  } else {
    document.getElementById('cfgProvOk').style.display = 'none';
    document.getElementById('cfgNote').style.display = '';
  }
  document.getElementById('saveRow').style.display = val ? 'flex' : 'none';
  updateProvBadge();
  updateCfgStatus();
}

function updateProvBadge() {
  const badge = document.getElementById('provBadge');
  if (apiKey) {
    const d = detectProvider(apiKey);
    badge.textContent = d ? d.name : 'Custom';
    badge.style.borderColor = '#5aab56';
    badge.style.color = '#7ec87a';
  } else {
    badge.textContent = 'Demo ✨';
    badge.style.borderColor = '#60a5fa';
    badge.style.color = '#93c5fd';
  }
}

function updateCfgStatus() {
  const el = document.getElementById('cfgStatus');
  if (apiKey) {
    const d = detectProvider(apiKey);
    el.textContent = '✓ ' + (d ? d.name : 'Personalizada') + ' ativa';
    el.className = 'cfg-status ok';
  } else {
    el.textContent = 'Sem chave configurada';
    el.className = 'cfg-status demo';
  }
}

function toggleShowKey() {
  showKey = !showKey;
  document.getElementById('keyInput').type = showKey ? 'text' : 'password';
}

function saveKey() {
  const key   = document.getElementById('keyInput').value.trim();
  const label = document.getElementById('labelInput').value.trim();
  const url   = document.getElementById('urlInput').value.trim();
  const model = document.getElementById('modelInput').value.trim();
  if (!key) return;
  if (savedKeys.some(k =&gt; k.key === key)) { toast('Chave já salva','err'); return; }
  const d = detectProvider(key);
  const finalLabel = label || (d ? d.name : 'Chave ' + (savedKeys.length+1));
  savedKeys.push({ id:Date.now()+'', label:finalLabel, key, url, model, provider:d ? d.name : 'Custom' });
  localStorage.setItem('cia_saved', JSON.stringify(savedKeys));
  document.getElementById('labelInput').value = '';
  renderSavedKeys();
  toast('Chave salva ✓');
}

function renderSavedKeys() {
  const list = document.getElementById('keysList');
  document.getElementById('keysTitle').textContent = 'Chaves Salvas ('+savedKeys.length+')';
  if (!savedKeys.length) {
    list.innerHTML = '&lt;div style=&quot;font-size:12px;color:#6b8f68;text-align:center;padding:10px&quot;&gt;Nenhuma chave salva.&lt;/div&gt;';
    return;
  }
  list.innerHTML = '';
  savedKeys.forEach(sk =&gt; {
    const div = document.createElement('div');
    div.className = 'saved-key' + (sk.key === apiKey ? ' active' : '');
    div.innerHTML =
      '&lt;div class=&quot;saved-key-info&quot; onclick=&quot;loadKey(\''+sk.id+'\')&quot;&gt;'+
        '&lt;div class=&quot;saved-key-label&quot;&gt;'+esc(sk.label)+'&lt;/div&gt;'+
        '&lt;div class=&quot;saved-key-meta&quot;&gt;'+esc(sk.provider)+' · '+sk.key.slice(0,6)+'…'+sk.key.slice(-3)+'&lt;/div&gt;'+
      '&lt;/div&gt;'+
      (sk.key === apiKey ? '&lt;span class=&quot;active-tag&quot;&gt;ATIVA&lt;/span&gt;' : '')+
      '&lt;button class=&quot;del-btn&quot; onclick=&quot;deleteKey(\''+sk.id+'\')&quot;&gt;✕&lt;/button&gt;';
    list.appendChild(div);
  });
}

function loadKey(id) {
  const sk = savedKeys.find(k =&gt; k.id === id);
  if (!sk) return;
  apiKey = sk.key; apiUrl = sk.url; apiModel = sk.model;
  localStorage.setItem('cia_key',   sk.key);
  localStorage.setItem('cia_url',   sk.url);
  localStorage.setItem('cia_model', sk.model);
  document.getElementById('keyInput').value   = sk.key;
  document.getElementById('urlInput').value   = sk.url;
  document.getElementById('modelInput').value = sk.model;
  onKeyInput(sk.key);
  renderSavedKeys();
  togglePanel('keysPanel','keysBtn');
  toast('Chave &quot;'+sk.label+'&quot; ativada');
}

function deleteKey(id) {
  savedKeys = savedKeys.filter(k =&gt; k.id !== id);
  localStorage.setItem('cia_saved', JSON.stringify(savedKeys));
  renderSavedKeys();
}

/*══════════════════════════════════════════════════════════════════
  HISTÓRICO DE CONVERSAS
══════════════════════════════════════════════════════════════════*/
async function renderConvList() {
  const list = document.getElementById('convList');
  if (!db) { list.innerHTML = '&lt;div style=&quot;font-size:12px;color:#6b8f68;text-align:center;padding:10px&quot;&gt;DB indisponível&lt;/div&gt;'; return; }
  const convs = (await dbGetAll('conversations')).sort((a,b) =&gt; b.updatedAt - a.updatedAt);
  document.getElementById('convTitle').textContent = 'Conversas ('+convs.length+')';
  if (!convs.length) {
    list.innerHTML = '&lt;div style=&quot;font-size:12px;color:#6b8f68;text-align:center;padding:10px&quot;&gt;Nenhuma conversa salva ainda.&lt;/div&gt;';
    return;
  }
  list.innerHTML = '';
  convs.forEach(c =&gt; {
    const div = document.createElement('div');
    div.className = 'conv-item' + (c.id === currentConvId ? ' active' : '');
    const date = new Date(c.updatedAt).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    div.innerHTML =
      '&lt;div class=&quot;conv-info&quot; onclick=&quot;loadConv(\''+c.id+'\')&quot;&gt;'+
        '&lt;div class=&quot;conv-title&quot;&gt;'+esc(c.title)+'&lt;/div&gt;'+
        '&lt;div class=&quot;conv-meta&quot;&gt;'+date+' · '+c.messages.length+' msgs · '+esc(c.provider||'')+'&lt;/div&gt;'+
      '&lt;/div&gt;'+
      '&lt;button class=&quot;del-btn&quot; onclick=&quot;deleteConv(\''+c.id+'\')&quot;&gt;✕&lt;/button&gt;';
    list.appendChild(div);
  });
}

async function loadConv(id) {

function toggleWeb() {

  localStorage.setItem('cia_web', webOn ? 'on' : 'off');
  document.getElementById('webBtn').classList.toggle('web-on', webOn);
  toast(webOn ? '🌐 Busca web ATIVADA' : 'Busca web desativada');
