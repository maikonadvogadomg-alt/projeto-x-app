&lt;body&gt;

&lt;div class=&quot;container&quot;&gt;
  &lt;h1&gt;📦 Analisador de Histórico — ZIP/TAR/TAZ&lt;/h1&gt;
  &lt;p style=&quot;text-align: center; color: #94a3b8; margin-bottom: 20px; font-size: 13px;&quot;&gt;
    Analisa arquivos compactados incluindo pastas ocultas (.git, .env, etc) e gera relatório completo
  &lt;/p&gt;

  &lt;div class=&quot;upload-area&quot; id=&quot;dropZone&quot;&gt;
    &lt;p style=&quot;font-size: 18px; margin-bottom: 10px;&quot;&gt;📂 Arraste seus arquivos aqui&lt;/p&gt;
    &lt;p style=&quot;color: #94a3b8; font-size: 13px; margin-bottom: 15px;&quot;&gt;Suporta: .zip, .tar, .tar.gz, .tgz, .tar.bz2&lt;/p&gt;
    &lt;button class=&quot;btn&quot; onclick=&quot;document.getElementById('fileInput').click()&quot;&gt;Selecionar Arquivo&lt;/button&gt;
    &lt;input type=&quot;file&quot; id=&quot;fileInput&quot; accept=&quot;.zip,.tar,.gz,.tgz,.bz2&quot; /&gt;
  &lt;/div&gt;

  &lt;div class=&quot;checkbox-group&quot;&gt;
    &lt;label&gt;
      &lt;input type=&quot;checkbox&quot; id=&quot;showHidden&quot; checked /&gt; Mostrar pastas ocultas (.git, .env, etc)
    &lt;/label&gt;
    &lt;label&gt;
      &lt;input type=&quot;checkbox&quot; id=&quot;showGitLog&quot; checked /&gt; Extrair histórico Git
    &lt;/label&gt;
    &lt;label&gt;
      &lt;input type=&quot;checkbox&quot; id=&quot;analyzeCode&quot; checked /&gt; Analisar código
    &lt;/label&gt;
    &lt;label&gt;
      &lt;input type=&quot;checkbox&quot; id=&quot;showFileTree&quot; checked /&gt; Mostrar árvore de arquivos
    &lt;/label&gt;
  &lt;/div&gt;

  &lt;div id=&quot;loading&quot; class=&quot;loading&quot; style=&quot;display:none;&quot;&gt;
    &lt;div class=&quot;spinner&quot;&gt;&lt;/div&gt;
    &lt;p&gt;Analisando arquivo...&lt;/p&gt;
  &lt;/div&gt;

  &lt;div id=&quot;results&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/tar.js/0.3.0/tar.min.js&quot;&gt;&lt;/script&gt;

&lt;script&gt;
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const resultsDiv = document.getElementById('results');
const loadingDiv = document.getElementById('loading');

// Drag and drop
dropZone.addEventListener('dragover', e =&gt; {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () =&gt; {
  dropZone.classList.remove('dragover');
});
dropZone.addEventListener('drop', e =&gt; {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', e =&gt; {
  handleFile(e.target.files[0]);
});

async function handleFile(file) {
  if (!file) return;
  
  loadingDiv.style.display = 'block';
  resultsDiv.innerHTML = '';
  
  try {
    const fileType = file.name.split('.').pop().toLowerCase();
    let fileStructure = {};
    let fileContents = {};
    
    if (fileType === 'zip') {
      ({ fileStructure, fileContents } = await processZip(file));
    } else if (['tar', 'gz', 'tgz', 'bz2'].includes(fileType)) {
      ({ fileStructure, fileContents } = await processTar(file));
    } else {
      throw new Error('Formato não suportado. Use .zip ou .tar');
    }
    
    loadingDiv.style.display = 'none';
    displayAnalysis(fileStructure, fileContents, file.name);
    
  } catch (err) {
    loadingDiv.style.display = 'none';
    resultsDiv.innerHTML = `&lt;div class=&quot;card&quot; style=&quot;border-left-color: #f87171;&quot;&gt;
      &lt;h3&gt;❌ Erro ao processar&lt;/h3&gt;
      &lt;p style=&quot;color: #f87171;&quot;&gt;${err.message}&lt;/p&gt;
    &lt;/div&gt;`;
  }
}

async function processZip(file) {
  const zip = new JSZip();
  const content = await zip.loadAsync(file);
  
  const fileStructure = {};
  const fileContents = {};
  
  for (let [path, zipEntry] of Object.entries(content.files)) {
    if (!zipEntry.dir) {
      fileStructure[path] = {
        size: zipEntry._data.uncompressedSize,
        date: zipEntry.date,
        isHidden: path.includes('/.')
      };
      
      if (shouldExtractContent(path)) {
        try {
          fileContents[path] = await zipEntry.async('text');
        } catch (e) {}
      }
    }
  }
  
  return { fileStructure, fileContents };
}

async function processTar(file) {
  const arrayBuffer = await file.arrayBuffer();
  const fileStructure = {};
  const fileContents = {};
  
  // Simula leitura de TAR (para produção, use biblioteca tar.js completa)
  // Por enquanto, retorna estrutura vazia
  console.warn('TAR processing requer biblioteca adicional');
  
  return { fileStructure, fileContents };
}

function shouldExtractContent(path) {
  const extensions = ['.js', '.html', '.css', '.json', '.md', '.txt', '.env', '.yml', '.yaml'];
  const isLarge = path.split('/').pop().length &gt; 100;
  
  return extensions.some(ext =&gt; path.endsWith(ext)) &amp;&amp; !isLarge;
}

function displayAnalysis(fileStructure, fileContents, fileName) {
  const showHidden = document.getElementById('showHidden').checked;
  const showGitLog = document.getElementById('showGitLog').checked;
  const analyzeCode = document.getElementById('analyzeCode').checked;
  const showFileTree = document.getElementById('showFileTree').checked;
  
  let html = '';
  
  // ═══════════════════════════════════════
  // 1. RESUMO EXECUTIVO
  // ═══════════════════════════════════════
  const stats = analyzeFileStructure(fileStructure, fileContents);
  
  html += `
    &lt;div class=&quot;results&quot;&gt;
      &lt;h2&gt;📊 Resumo Executivo&lt;/h2&gt;
      &lt;div class=&quot;stats-grid&quot;&gt;
        &lt;div class=&quot;stat-box&quot;&gt;
          &lt;strong&gt;${stats.totalFiles}&lt;/strong&gt;
          &lt;span&gt;Total de Arquivos&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;stat-box&quot;&gt;
          &lt;strong&gt;${stats.hiddenFiles}&lt;/strong&gt;
          &lt;span&gt;Pastas Ocultas&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;stat-box&quot;&gt;
          &lt;strong&gt;${stats.codeFiles}&lt;/strong&gt;
          &lt;span&gt;Arquivos de Código&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;stat-box&quot;&gt;
          &lt;strong&gt;${stats.configFiles}&lt;/strong&gt;
          &lt;span&gt;Configurações&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;stat-box&quot;&gt;
          &lt;strong&gt;${(stats.totalSize / 1024 / 1024).toFixed(2)}MB&lt;/strong&gt;
          &lt;span&gt;Tamanho Total&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  `;
  
  // ═══════════════════════════════════════
  // 2. ANÁLISE GIT
  // ═══════════════════════════════════════
  if (showHidden &amp;&amp; stats.hasGit) {
    html += `
      &lt;div class=&quot;results&quot;&gt;
        &lt;h2&gt;🔴 Histórico Git Detectado&lt;/h2&gt;
        &lt;div class=&quot;card card-git&quot;&gt;
          &lt;h3&gt;📝 Informações do Repositório&lt;/h3&gt;
          &lt;p style=&quot;font-size: 12px; color: #94a3b8;&quot;&gt;
            Este projeto foi versionado com Git. Contém histórico de commits, branches e alterações.
          &lt;/p&gt;
          ${stats.gitInfo ? `
            &lt;div class=&quot;code-block&quot;&gt;
              &lt;strong&gt;Configuração Git:&lt;/strong&gt;&lt;br/&gt;
              ${stats.gitInfo}
            &lt;/div&gt;
          ` : ''}
        &lt;/div&gt;
      &lt;/div&gt;
    `;
  }
  
  // ═══════════════════════════════════════
  // 3. ANÁLISE DE ESTRUTURA
  // ═══════════════════════════════════════
  html += `
    &lt;div class=&quot;results&quot;&gt;
      &lt;h2&gt;🏗️ Estrutura do Projeto&lt;/h2&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h3&gt;Pastas Principais&lt;/h3&gt;
        &lt;div class=&quot;file-tree&quot;&gt;
          ${generateFolderStructure(fileStructure, showHidden)}
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  `;
  
  // ═══════════════════════════════════════
  // 4. ANÁLISE DE CÓDIGO
  // ═══════════════════════════════════════
  if (analyzeCode) {
    const codeAnalysis = analyzeCodeContent(fileContents);
    
    html += `
      &lt;div class=&quot;results&quot;&gt;
        &lt;h2&gt;💻 Análise de Código&lt;/h2&gt;
        
        &lt;div class=&quot;tabs&quot;&gt;
          &lt;button class=&quot;tab active&quot; onclick=&quot;switchTab(event, 'tech')&quot;&gt;🛠️ Tecnologias&lt;/button&gt;
          &lt;button class=&quot;tab&quot; onclick=&quot;switchTab(event, 'functions')&quot;&gt;⚙️ Funções&lt;/button&gt;
          &lt;button class=&quot;tab&quot; onclick=&quot;switchTab(event, 'issues')&quot;&gt;⚠️ Possíveis Problemas&lt;/button&gt;
        &lt;/div&gt;
        
        &lt;div id=&quot;tech&quot; class=&quot;tab-content active&quot;&gt;
          &lt;div class=&quot;stats-grid&quot;&gt;
            ${Object.entries(codeAnalysis.technologies).map(([tech, count]) =&gt; `
              &lt;div class=&quot;stat-box&quot;&gt;
                &lt;strong&gt;${count}&lt;/strong&gt;
                &lt;span&gt;${tech}&lt;/span&gt;
              &lt;/div&gt;
            `).join('')}
          &lt;/div&gt;
        &lt;/div&gt;
        
        &lt;div id=&quot;functions&quot; class=&quot;tab-content&quot;&gt;
          &lt;div class=&quot;card&quot;&gt;
            &lt;h3&gt;Funções/Classes Detectadas&lt;/h3&gt;
            &lt;div class=&quot;code-block&quot;&gt;
              ${codeAnalysis.functions.slice(0, 30).map(f =&gt; `&lt;div&gt;• ${f}&lt;/div&gt;`).join('')}
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        
        &lt;div id=&quot;issues&quot; class=&quot;tab-content&quot;&gt;
          &lt;div class=&quot;card&quot;&gt;
            &lt;h3&gt;Possíveis Problemas Identificados&lt;/h3&gt;
            ${codeAnalysis.issues.length &gt; 0 ? `
              &lt;div class=&quot;code-block&quot;&gt;
                ${codeAnalysis.issues.map(issue =&gt; `
                  &lt;div style=&quot;margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #334155;&quot;&gt;
                    &lt;span class=&quot;diff-remove&quot;&gt;⚠️ ${issue.type}&lt;/span&gt;&lt;br/&gt;
                    &lt;span style=&quot;color: #94a3b8; font-size: 11px;&quot;&gt;${issue.description}&lt;/span&gt;
                  &lt;/div&gt;
                `).join('')}
              &lt;/div&gt;
            ` : '&lt;p style=&quot;color: #4ade80;&quot;&gt;✓ Nenhum problema óbvio detectado&lt;/p&gt;'}
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    `;
  }
  
  // ═══════════════════════════════════════
  // 5. ARQUIVOS IMPORTANTES
  // ═══════════════════════════════════════
  const importantFiles = getImportantFiles(fileContents);
  if (Object.keys(importantFiles).length &gt; 0) {
    html += `
      &lt;div class=&quot;results&quot;&gt;
        &lt;h2&gt;📄 Arquivos Importantes&lt;/h2&gt;
        ${Object.entries(importantFiles).map(([name, content]) =&gt; `
          &lt;div class=&quot;card&quot;&gt;
            &lt;h3&gt;${name}&lt;/h3&gt;
            &lt;div class=&quot;code-block&quot; style=&quot;max-height: 200px;&quot;&gt;
              ${escapeHtml(content.substring(0, 500))}${content.length &gt; 500 ? '...' : ''}
            &lt;/div&gt;
          &lt;/div&gt;
        `).join('')}
      &lt;/div&gt;
    `;
  }
  
  // ═══════════════════════════════════════
  // 6. BOTÕES DE EXPORTAÇÃO
  // ═══════════════════════════════════════
  html += `
    &lt;div class=&quot;results&quot;&gt;
      &lt;h2&gt;📥 Exportar Relatório&lt;/h2&gt;
      &lt;div class=&quot;export-buttons&quot;&gt;
        &lt;button class=&quot;btn btn-secondary&quot; onclick=&quot;exportAsJSON('${escapeHtml(JSON.stringify(stats))}')&quot;&gt;
          📋 JSON
        &lt;/button&gt;
        &lt;button class=&quot;btn btn-secondary&quot; onclick=&quot;exportAsMarkdown('${fileName}', '${escapeHtml(JSON.stringify(stats))}')&quot;&gt;
          📝 Markdown
        &lt;/button&gt;
        &lt;button class=&quot;btn btn-secondary&quot; onclick=&quot;exportAsHTML('${fileName}', '${escapeHtml(JSON.stringify(stats))}')&quot;&gt;
          🌐 HTML
        &lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  `;
  
  resultsDiv.innerHTML = html;
}

function analyzeFileStructure(fileStructure, fileContents) {
  const files = Object.keys(fileStructure);
  const stats = {
    totalFiles: files.length,
    hiddenFiles: files.filter(f =&gt; f.includes('/.')).length,
    codeFiles: files.filter(f =&gt; /\.(js|html|css|jsx|tsx|py|java|cpp)$/.test(f)).length,
    configFiles: files.filter(f =&gt; /\.(json|yml|yaml|env|config)$/.test(f)).length,
    totalSize: Object.values(fileStructure).reduce((sum, f) =&gt; sum + (f.size || 0), 0),
    hasGit: files.some(f =&gt; f.includes('.git')),
    gitInfo: fileContents[Object.keys(fileContents).find(f =&gt; f.includes('.git/config'))] || null
  };
  return stats;
}

function analyzeCodeContent(fileContents) {
  const analysis = {
    technologies: {},
    functions: [],
    issues: []
  };
  
  Object.entries(fileContents).forEach(([path, content]) =&gt; {
    // Detectar tecnologias
    if (path.endsWith('.js')) {
      if (content.includes('React')) analysis.technologies['React'] = (analysis.technologies['React'] || 0) + 1;
      if (content.includes('Vue')) analysis.technologies['Vue'] = (analysis.technologies['Vue'] || 0) + 1;
      if (content.includes('Angular')) analysis.technologies['Angular'] = (analysis.technologies['Angular'] || 0) + 1;
      if (content.includes('Express')) analysis.technologies['Express'] = (analysis.technologies['Express'] || 0) + 1;
      if (content.includes('async')) analysis.technologies['Async/Await'] = (analysis.technologies['Async/Await'] || 0) + 1;
    }
    
    if (path.endsWith('.html')) analysis.technologies['HTML'] = (analysis.technologies['HTML'] || 0) + 1;
    if (path.endsWith('.css')) analysis.technologies['CSS'] = (analysis.technologies['CSS'] || 0) + 1;
    if (path.endsWith('.json')) analysis.technologies['JSON'] = (analysis.technologies['JSON'] || 0) + 1;
    
    // Extrair funções
    const funcMatches = content.match(/(?:async\s+)?function\s+(\w+)|const\s+(\w+)\s*=\s*(?:async\s*)?\(/g);
    if (funcMatches) {
      funcMatches.forEach(match =&gt; {
        const name = match.replace(/(?:async\s+)?function\s+|const\s+|\s*=\s*(?:async\s*)?\(/g, '');
        if (!analysis.functions.includes(name)) {
          analysis.functions.push(name);
        }
      });
    }
    
    // Detectar problemas
    if (content.includes('console.log') &amp;&amp; path.includes('production')) {
      analysis.issues.push({
        type: 'console.log em produção',
        description: `Arquivo ${path} contém console.log`
      });
    }
    
    if (content.includes('TODO') || content.includes('FIXME')) {
      analysis.issues.push({
        type: 'TODO/FIXME encontrado',
        description: `Arquivo ${path} contém tarefas pendentes`
      });
    }
    
    if (content.includes('eval(') || content.includes('innerHTML')) {
      analysis.issues.push({
        type: 'Possível vulnerabilidade',
        description: `Arquivo ${path} usa eval() ou innerHTML`
      });
    }
  });
  
  return analysis;
}

function generateFolderStructure(fileStructure, showHidden) {
  const folders = new Set();
  
  Object.keys(fileStructure).forEach(path =&gt; {
    if (showHidden || !path.includes('/.')) {
      const parts = path.split('/');
      parts.pop();
      let current = '';
      parts.forEach(part =&gt; {
        current += part + '/';
        folders.add(current);
      });
    }
  });
  
  const sortedFolders = Array.from(folders).sort();
  
  return sortedFolders.map(folder =&gt; {
    const depth = folder.split('/').length - 2;
    const name = folder.split('/').filter(p =&gt; p).pop();
    const isHidden = name.startsWith('.');
    
    return `
      &lt;div class=&quot;file-tree-item ${isHidden ? 'hidden' : ''}&quot;&gt;
        ${'&amp;nbsp;&amp;nbsp;'.repeat(depth)}📁 ${name}/
      &lt;/div&gt;
    `;
  }).join('');
}

function getImportantFiles(fileContents) {
  const important = {};
  const importantNames = ['README.md', 'package.json', '.env', '.env.example', 'config.json', '.gitignore'];
  
  Object.entries(fileContents).forEach(([path, content]) =&gt; {
    const fileName = path.split('/').pop();
    if (importantNames.includes(fileName)) {
      important[fileName] = content;
    }
  });
  
  return important;
}

function escapeHtml(text) {
  const map = {
    '&amp;': '&amp;amp;',
    '&lt;': '&amp;lt;',
    '&gt;': '&amp;gt;',
    '&quot;': '&amp;quot;',
    &quot;'&quot;: '&amp;#039;'
  };
  return text.replace(/[&amp;&lt;&gt;&quot;']/g, m =&gt; map[m]);
}

function switchTab(e, tabName) {
  document.querySelectorAll('.tab').forEach(t =&gt; t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t =&gt; t.classList.remove('active'));
  
  e.target.classList.add('active');
  document.getElementById(tabName).classList.add('active');
}

async function handleFile(file) {
  if (!file) return;
  
  loadingDiv.style.display = 'block';
  resultsDiv.innerHTML = '';
  
  try {
    const zip = new JSZip();
    const content = await zip.loadAsync(file);
    
    const versions = [];
    const allFiles = {};
    
    // Extrai todas as versões
    for (let [path, zipEntry] of Object.entries(content.files)) {
      if (!zipEntry.dir) {
        allFiles[path] = zipEntry;
      }
    }
    
    // Procura por padrões de versão
    const versionPatterns = [
      /\.replit\/versions\/\d+/,
      /\.versions\/\d+/,
      /version_\d+/,
      /v\d+\//,
      /backup_\d+/,
      /snapshot_\d+/
    ];
    
    const versionedFiles = Object.keys(allFiles).filter(path =&gt; 
      versionPatterns.some(pattern =&gt; pattern.test(path))
    );
    
    loadingDiv.style.display = 'none';
    
    if (versionedFiles.length &gt; 0) {
      await analyzeVersions(content, allFiles, versionedFiles);
    } else {
      // Se não encontrar versões, analisa estrutura geral
      await analyzeStructure(content, allFiles);
    }
    
  } catch (err) {
    loadingDiv.style.display = 'none';

async function analyzeVersions(zip, allFiles, versionedFiles) {
  const timeline = [];

  // Agrupa arquivos por versão
  const versions = new Map();
  
  for (let path of versionedFiles) {
    const match = path.match(/(\d{4}-\d{2}-\d{2})|(\d+)/);
    const versionKey = match ? match[0] : path;
    
    if (!versions.has(versionKey)) {
      versions.set(versionKey, []);
    }
    versions.get(versionKey).push(path);
  }
  
  // Analisa cada versão
  const sortedVersions = Array.from(versions.entries()).sort();
  
  for (let [versionKey, files] of sortedVersions) {
    const versionData = {
      version: versionKey,
      timestamp: parseVersionDate(versionKey),
      files: files,
      changes: [],
      type: 'change'
    };
    
    // Analisa conteúdo dos arquivos
    for (let filePath of files) {
      try {
        const content = await zip.file(filePath).async('text');
        const analysis = analyzeFileContent(content, filePath);
        
        if (analysis.type) {
          versionData.type = analysis.type;
          versionData.changes.push(analysis);
        }
      } catch (e) {}
    }
    
    timeline.push(versionData);

            &lt;h3&gt;📄 ${fileName}&lt;/h3&gt;
            &lt;div class=&quot;code-block&quot;&gt;
              ${escapeHtml(content.substring(0, 300))}${content.length &gt; 300 ? '...' : ''}
            &lt;/div&gt;
          &lt;/div&gt;
        `;
      } catch (e) {}
    }
  }
  
  if (filesList) {
    html += `&lt;div class=&quot;results&quot;&gt;&lt;h2&gt;📄 Arquivos Principais&lt;/h2&gt;${filesList}&lt;/div&gt;`;
  }
  
  resultsDiv.innerHTML = html;
}

function analyzeFileContent(content, filePath) {
  const analysis = {
    file: filePath,
    type: null,
    description: '',
    keywords: []
  };
  
  const lowerContent = content.toLowerCase();
  
  // Detecta tipo de mudança
  if (lowerContent.includes('bug') || lowerContent.includes('erro') || lowerContent.includes('fix')) {
    analysis.type = 'bug';
    analysis.description = '🐛 Correção de bug';
  }
  
  if (lowerContent.includes('feature') || lowerContent.includes('novo') || lowerContent.includes('adicionado')) {
    analysis.type = 'feature';
    analysis.description = '✨ Nova funcionalidade';
  }
  
  if (lowerContent.includes('refactor') || lowerContent.includes('refatoração')) {
    analysis.type = 'refactor';
    analysis.description = '🔄 Refatoração';
  }
  
  if (lowerContent.includes('historico') || lowerContent.includes('history')) {
    analysis.keywords.push('Histórico da IA');
  }
  
  if (lowerContent.includes('minuta') || lowerContent.includes('minute')) {
    analysis.keywords.push('Geração de Minuta');
  }
  
  if (lowerContent.includes('resumo') || lowerContent.includes('summary')) {
    analysis.keywords.push('Resumo');
  }
  
  if (lowerContent.includes('backend') || lowerContent.includes('server') || lowerContent.includes('api')) {
    analysis.keywords.push('Backend/API');
  }
  
  if (lowerContent.includes('database') || lowerContent.includes('db') || lowerContent.includes('sql')) {
    analysis.keywords.push('Banco de Dados');
  }
  
  if (lowerContent.includes('auth') || lowerContent.includes('autenticação')) {
    analysis.keywords.push('Autenticação');
  }
  
  if (lowerContent.includes('ia') || lowerContent.includes('ai') || lowerContent.includes('inteligência')) {
    analysis.keywords.push('Integração IA');
  }
  
  return analysis;
}

function parseVersionDate(versionKey) {
  // Tenta parsear diferentes formatos de data
  const dateMatch = versionKey.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (dateMatch) {
    return new Date(dateMatch[0]);
  }
  
  // Se for número, assume como timestamp
  if (/^\d+$/.test(versionKey)) {
    return new Date(parseInt(versionKey));
  }
  
  return new Date();
}

function displayTimeline(timeline) {
  let html = `
    &lt;div class=&quot;results&quot;&gt;
      &lt;h2&gt;📈 Estatísticas Gerais&lt;/h2&gt;
      &lt;div class=&quot;stats-grid&quot;&gt;
        &lt;div class=&quot;stat-box&quot;&gt;
          &lt;strong&gt;${timeline.length}&lt;/strong&gt;
          &lt;span&gt;Versões Detectadas&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;stat-box&quot;&gt;
          &lt;strong&gt;${timeline.filter(t =&gt; t.type === 'bug').length}&lt;/strong&gt;
          &lt;span&gt;Correções&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;stat-box&quot;&gt;
          &lt;strong&gt;${timeline.filter(t =&gt; t.type === 'feature').length}&lt;/strong&gt;
          &lt;span&gt;Features&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;stat-box&quot;&gt;
          &lt;strong&gt;${timeline.filter(t =&gt; t.type === 'refactor').length}&lt;/strong&gt;
          &lt;span&gt;Refatorações&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  `;
  
  // Timeline visual
  html += `
    &lt;div class=&quot;results&quot;&gt;
      &lt;h2&gt;📜 Histórico de Mudanças&lt;/h2&gt;
      &lt;div class=&quot;timeline&quot;&gt;
  `;
  
  timeline.reverse().forEach((item, idx) =&gt; {
    const typeClass = item.type || 'change';
    const typeEmoji = {
      'bug': '🐛',
      'feature': '✨',
      'refactor': '🔄',
      'change': '📝'
    }[typeClass] || '📝';
    
    html += `
      &lt;div class=&quot;timeline-item ${typeClass}&quot;&gt;
        &lt;div class=&quot;timeline-dot&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;timeline-content&quot;&gt;
          &lt;div class=&quot;timeline-date&quot;&gt;${formatDate(item.timestamp)}&lt;/div&gt;
          &lt;div class=&quot;timeline-title&quot;&gt;${typeEmoji} ${item.version}&lt;/div&gt;
          &lt;div class=&quot;timeline-desc&quot;&gt;${item.changes.length} arquivo(s) alterado(s)&lt;/div&gt;
          
          ${item.changes.length &gt; 0 ? `
            &lt;div class=&quot;timeline-files&quot;&gt;
              ${item.changes.map(c =&gt; `
                &lt;div class=&quot;file-item&quot;&gt;
                  ${c.keywords.length &gt; 0 ? `&lt;strong&gt;${c.keywords.join(', ')}&lt;/strong&gt;&lt;br/&gt;` : ''}
                  ${c.file.split('/').pop()}
                &lt;/div&gt;
              `).join('')}
            &lt;/div&gt;
          ` : ''}
        &lt;/div&gt;
      &lt;/div&gt;
    `;
  });
  
  html += `
      &lt;/div&gt;
    &lt;/div&gt;
  `;
  
  // Resumo de funcionalidades
  const allKeywords = new Map();
  timeline.forEach(item =&gt; {
    item.changes.forEach(change =&gt; {
      change.keywords.forEach(kw =&gt; {
        allKeywords.set(kw, (allKeywords.get(kw) || 0) + 1);
      });
    });
  });
  
  if (allKeywords.size &gt; 0) {
    html += `
      &lt;div class=&quot;results&quot;&gt;
        &lt;h2&gt;🎯 Funcionalidades Rastreadas&lt;/h2&gt;
    `;
    
    for (let [keyword, count] of allKeywords) {
      html += `
        &lt;div class=&quot;summary-box&quot;&gt;
          &lt;strong&gt;${keyword}&lt;/strong&gt;
          &lt;span style=&quot;float: right; color: #a3a082;&quot;&gt;${count} mudança(s)&lt;/span&gt;
        &lt;/div&gt;
      `;
    }
    
    html += `&lt;/div&gt;`;
  }
  
  // Botões de exportação
  html += `
    &lt;div class=&quot;results&quot;&gt;
      &lt;h2&gt;📥 Exportar Relatório&lt;/h2&gt;
      &lt;div class=&quot;export-buttons&quot;&gt;
        &lt;button class=&quot;btn btn-secondary&quot; onclick=&quot;exportTimeline('${escapeHtml(JSON.stringify(timeline))}', 'json')&quot;&gt;
          📋 JSON
        &lt;/button&gt;
        &lt;button class=&quot;btn btn-secondary&quot; onclick=&quot;exportTimeline('${escapeHtml(JSON.stringify(timeline))}', 'markdown')&quot;&gt;
          📝 Markdown
        &lt;/button&gt;
        &lt;button class=&quot;btn btn-secondary&quot; onclick=&quot;exportTimeline('${escapeHtml(JSON.stringify(timeline))}', 'html')&quot;&gt;
          🌐 HTML
        &lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  `;
  
  resultsDiv.innerHTML = html;
}

function formatDate(date) {
  if (!date || isNaN(date)) return 'Data desconhecida';
  return date.toLocaleDateString('pt-BR', { 
    year: 'numeric', 
    month: '2-digit', 
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit'
  });
}

function escapeHtml(text) {
  const map = {
    '&amp;': '&amp;amp;',
    '&lt;': '&amp;lt;',
    '&gt;': '&amp;gt;',
    '&quot;': '&amp;quot;',
    &quot;'&quot;: '&amp;#039;'
  };
  return text.replace(/[&amp;&lt;&gt;&quot;']/g, m =&gt; map[m]);
}

function exportTimeline(timelineJson, format) {
  const timeline = JSON.parse(timelineJson);
  
  if (format === 'json') {
    const json = JSON.stringify(timeline, null, 2);
    downloadFile(json, 'historico.json', 'application/json');
  } else if (format === 'markdown') {
    let md = '# Histórico de Mudanças — PWA Jurídico\n\n';
    md += `**Gerado em:** ${new Date().toLocaleString('pt-BR')}\n\n`;
    md += `## 📊 Resumo\n`;
    md += `- Total de versões: ${timeline.length}\n`;
    md += `- Correções: ${timeline.filter(t =&gt; t.type === 'bug').length}\n`;
    md += `- Features: ${timeline.filter(t =&gt; t.type === 'feature').length}\n\n`;
    
    md += `## 📜 Mudanças por Versão\n\n`;
    timeline.forEach(item =&gt; {
      md += `### ${item.version} (${formatDate(item.timestamp)})\n`;
      item.changes.forEach(change =&gt; {
        md += `- ${change.file}\n`;
        if (change.keywords.length &gt; 0) {
          md += `  - Tags: ${change.keywords.join(', ')}\n`;
        }
      });
      md += '\n';
    });
    
    downloadFile(md, 'historico.md', 'text/markdown');
  } else if (format === 'html') {
    let html = `&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
  &lt;meta charset=&quot;UTF-8&quot;&gt;
  &lt;title&gt;Histórico - PWA Jurídico&lt;/title&gt;
  &lt;style&gt;
    body { font-family: Arial; background: #f5f5f5; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
    h1 { color: #333; }
    .version { margin: 20px 0; padding: 15px; background: #f9f9f9; border-left: 4px solid #007bff; }
    .file { margin: 10px 0; padding: 10px; background: #f0f0f0; border-radius: 4px; font-family: monospace; }
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;div class=&quot;container&quot;&gt;
    &lt;h1&gt;📜 Histórico de Mudanças&lt;/h1&gt;
    &lt;p&gt;&lt;strong&gt;Gerado em:&lt;/strong&gt; ${new Date().toLocaleString('pt-BR')}&lt;/p&gt;
`;
    
    timeline.forEach(item =&gt; {
      html += `&lt;div class=&quot;version&quot;&gt;
        &lt;h2&gt;${item.version}&lt;/h2&gt;
        &lt;p&gt;&lt;strong&gt;Data:&lt;/strong&gt; ${formatDate(item.timestamp)}&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;Arquivos:&lt;/strong&gt; ${item.changes.length}&lt;/p&gt;
`;
      item.changes.forEach(change =&gt; {
        html += `&lt;div class=&quot;file&quot;&gt;${change.file}&lt;/div&gt;`;
      });
      html += `&lt;/div&gt;`;
    });
    
    html += `
  &lt;/div&gt;
&lt;/body&gt;
&lt;/html&gt;`;
    
    downloadFile(html, 'historico.html', 'text/html');
  }
}

function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

<script>
function trocarProjeto(index) {
  document.querySelectorAll('.project-container').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  
  document.getElementById('projeto' + index).classList.add('active');
  document.querySelectorAll('.nav-btn')[index].classList.add('active');
  
  localStorage.setItem('ultimo-projeto', index);
}

window.onload = function() {
  const ultimo = localStorage.getItem('ultimo-projeto');
  if (ultimo !== null) trocarProjeto(parseInt(ultimo));
};

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
