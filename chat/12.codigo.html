&lt;script&gt;
// ========== STORAGE ==========
const LS_MODULOS = 'workstation-modulos-v1';
const LS_SELECTED = 'workstation-selected-v1';

function getModulos() {
  try { return JSON.parse(localStorage.getItem(LS_MODULOS) || '[]'); }
  catch { return []; }
}

function setModulos(list) {
  localStorage.setItem(LS_MODULOS, JSON.stringify(list));
  atualizarContador();
}

function getSelected() {
  try { return JSON.parse(localStorage.getItem(LS_SELECTED) || '[]'); }
  catch { return []; }
}

function setSelected(list) {
  localStorage.setItem(LS_SELECTED, JSON.stringify(list));
}

// ========== NAVEGAÇÃO ==========
function trocarAba(nome) {
  // Esconde todas
  document.querySelectorAll('.workspace').forEach(w =&gt; w.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t =&gt; t.classList.remove('active'));
  
  // Mostra a selecionada
  document.getElementById('ws-' + nome).classList.add('active');
  event.target.classList.add('active');
  
  // Atualiza conteúdo
  if (nome === 'montador') renderModulos();
  if (nome === 'arquivos') renderArquivos();
}

// ========== SCANNER ==========
function analisarCodigo() {
  const codigo = document.getElementById('scannerInput').value;
  if (!codigo.trim()) {
    toast('❌ Cole um código primeiro!');
    return;
  }

  const analise = {
    funcoes: extrairFuncoes(codigo),
    estilos: extrairEstilos(codigo),
    elementos: extrairElementos(codigo),
    scripts: extrairScripts(codigo)
  };

  renderAnalise(analise);
}

function extrairFuncoes(codigo) {
  const regex = /function\s+(\w+)\s*\([^)]*\)\s*\{/g;
  const funcoes = [];
  let match;
  while ((match = regex.exec(codigo)) !== null) {
    const inicio = match.index;
    const fim = encontrarFimFuncao(codigo, inicio);
    funcoes.push({
      nome: match[1],
      codigo: codigo.substring(inicio, fim)
    });
  }
  return funcoes;
}

function encontrarFimFuncao(codigo, inicio) {
  let nivel = 0;
  for (let i = inicio; i &lt; codigo.length; i++) {
    if (codigo[i] === '{') nivel++;
    if (codigo[i] === '}') {
      nivel--;
      if (nivel === 0) return i + 1;
    }
  }
  return codigo.length;
}

function extrairEstilos(codigo) {
  const regex = /&lt;style[^&gt;]*&gt;([\s\S]*?)&lt;\/style&gt;/gi;
  const estilos = [];
  let match;
  while ((match = regex.exec(codigo)) !== null) {
    estilos.push(match[1].trim());
  }
  return estilos;
}

function extrairElementos(codigo) {
  const regex = /&lt;(\w+)[^&gt;]*id=[&quot;']([^&quot;']+)[&quot;'][^&gt;]*&gt;/g;
  const elementos = [];
  let match;
  while ((match = regex.exec(codigo)) !== null) {
    elementos.push({ tag: match[1], id: match[2] });
  }
  return elementos;
}

function extrairScripts(codigo) {
  const regex = /&lt;script[^&gt;]*&gt;([\s\S]*?)&lt;\/script&gt;/gi;
  const scripts = [];
  let match;
  while ((match = regex.exec(codigo)) !== null) {
    scripts.push(match[1].trim());
  }
  return scripts;
}

  // Funções
  if (analise.funcoes.length &gt; 0) {
    html += `
      &lt;div class=&quot;panel&quot;&gt;
        &lt;div class=&quot;panel-header&quot;&gt;
          &lt;div class=&quot;panel-title&quot;&gt;🔧 Funções Encontradas (${analise.funcoes.length})&lt;/div&gt;

          &lt;div class=&quot;file-item&quot;&gt;
            &lt;div&gt;

function extrairTudo() {
  const codigo = document.getElementById('scannerInput').value;
  if (!codigo.trim()) {
    toast('❌ Cole um código primeiro!');
    return;
  }

  const analise = {
    funcoes: extrairFuncoes(codigo),
    estilos: extrairEstilos(codigo)
  };

  let contador = 0;
  
  analise.funcoes.forEach(f =&gt; {
    salvarComoModulo(f.nome, 'funcao', f.codigo);
    contador++;
  });
  
  analise.estilos.forEach((css, i) =&gt; {
    salvarComoModulo(`CSS_${i + 1}`, 'css', css);
    contador++;
  });

  toast(`✅ ${contador} módulos extraídos e salvos!`);
  renderModulos();
}

function copiarParaPlayground(codigo) {
  document.getElementById('playgroundCode').value = codigo;
  trocarAba('playground');
  document.querySelectorAll('.nav-tab')[2].classList.add('active');
  toast('✅ Código copiado para o Playground!');
}

function salvarComoModulo(nome, tipo, codigo) {
  const modulos = getModulos();
  modulos.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    nome,
    tipo,
    codigo,
    data: new Date().toISOString()
  });
  setModulos(modulos);
}

// ========== MONTADOR ==========
function salvarModulo() {
  const nome = document.getElementById('modNome').value.trim();
  const tipo = document.getElementById('modTipo').value;
  const codigo = document.getElementById('modCodigo').value;

  if (!nome || !codigo.trim()) {
    toast('❌ Preencha nome e código!');
    return;
  }

  salvarComoModulo(nome, tipo, codigo);
  limparModulo();
  renderModulos();
  toast('✅ Módulo salvo!');
}

function limparModulo() {
  document.getElementById('modNome').value = '';
  document.getElementById('modCodigo').value = '';
}

function renderModulos() {
  const modulos = getModulos();
  const selected = getSelected();
  const container = document.getElementById('modulosList');
  const checklist = document.getElementById('montadorChecklist');

  if (modulos.length === 0) {
    container.innerHTML = '&lt;p style=&quot;color:var(--text2);font-size:12px;text-align:center;padding:20px;&quot;&gt;Nenhum módulo salvo&lt;/p&gt;';
    if (checklist) checklist.innerHTML = '';
    return;
  }

  // Lista de módulos
  container.innerHTML = modulos.slice(-10).reverse().map(m =&gt; `
    &lt;div class=&quot;file-item&quot;&gt;
      &lt;div&gt;
        &lt;strong&gt;${escHtml(m.nome)}&lt;/strong&gt;
        &lt;span class=&quot;tag tag-${m.tipo}&quot;&gt;${m.tipo}&lt;/span&gt;
      &lt;/div&gt;
      &lt;div style=&quot;display:flex;gap:4px;&quot;&gt;
        &lt;button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;editarModulo('${m.id}')&quot;&gt;✏️&lt;/button&gt;
        &lt;button class=&quot;btn btn-danger btn-sm&quot; onclick=&quot;deletarModulo('${m.id}')&quot;&gt;🗑️&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  `).join('');

  // Checklist para montagem
  if (checklist) {
    checklist.innerHTML = '&lt;div style=&quot;max-height:300px;overflow-y:auto;&quot;&gt;' + modulos.map(m =&gt; `
      &lt;label style=&quot;display:flex;align-items:center;gap:8px;padding:8px;cursor:pointer;border-bottom:1px solid var(--border);&quot;&gt;
        &lt;input type=&quot;checkbox&quot; ${selected.includes(m.id) ? 'checked' : ''} onchange=&quot;toggleModulo('${m.id}')&quot; /&gt;
        &lt;strong style=&quot;font-size:12px;&quot;&gt;${escHtml(m.nome)}&lt;/strong&gt;
        &lt;span class=&quot;tag tag-${m.tipo}&quot;&gt;${m.tipo}&lt;/span&gt;
      &lt;/label&gt;
    `).join('') + '&lt;/div&gt;';
  }
}

function toggleModulo(id) {
  let selected = getSelected();
  if (selected.includes(id)) {
    selected = selected.filter(x =&gt; x !== id);
  } else {
    selected.push(id);
  }
  setSelected(selected);
}

function selecionarTodos() {
  setSelected(getModulos().map(m =&gt; m.id));
  renderModulos();
}

function desselecionarTodos() {
  setSelected([]);
  renderModulos();
}

function deletarModulo(id) {
  if (!confirm('Deletar este módulo?')) return;
  setModulos(getModulos().filter(m =&gt; m.id !== id));
  renderModulos();
  toast('🗑️ Módulo deletado!');
}

function editarModulo(id) {
  const modulo = getModulos().find(m =&gt; m.id === id);
  if (!modulo) return;
  
  document.getElementById('modNome').value = modulo.nome;
  document.getElementById('modTipo').value = modulo.tipo;
  document.getElementById('modCodigo').value = modulo.codigo;
  
  deletarModulo(id);
  toast('✏️ Editando módulo...');
}

function gerarProjetoFinal() {
  const modulos = getModulos();
  const selected = getSelected();
  const escolhidos = modulos.filter(m =&gt; selected.includes(m.id));

  if (escolhidos.length === 0) {
    toast('❌ Selecione pelo menos um módulo!');
    return;
  }

  const nome = document.getElementById('projetoNome').value || 'Projeto';
  
  const html = escolhidos.filter(m =&gt; m.tipo === 'html').map(m =&gt; m.codigo).join('\n\n');
  const css = escolhidos.filter(m =&gt; m.tipo === 'css').map(m =&gt; m.codigo).join('\n\n');
  const js = escolhidos.filter(m =&gt; m.tipo === 'js' || m.tipo === 'funcao').map(m =&gt; m.codigo).join('\n\n');

  const projeto = `&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;pt-BR&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
&lt;title&gt;${escHtml(nome)}&lt;/title&gt;
&lt;style&gt;
${css}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;

${html}

&lt;script&gt;
${js}
&lt;\/script&gt;
&lt;/body&gt;
&lt;/html&gt;`;

  baixarArquivo(projeto, nome.replace(/[^a-z0-9]/gi, '_') + '.html', 'text/html');
  toast('✅ Projeto gerado!');
}

// ========== PLAYGROUND ==========
function executarPlayground() {
  const codigo = document.getElementById('playgroundCode').value;
  const iframe = document.getElementById('playgroundPreview');
  
  const blob = new Blob([codigo], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  iframe.src = url;
  setTimeout(() =&gt; URL.revokeObjectURL(url), 5000);
  
  toast('▶️ Executando...');
}

function salvarDePlayground() {
  const codigo = document.getElementById('playgroundCode').value;
  if (!codigo.trim()) {
    toast('❌ Nada para salvar!');
    return;
  }
  
  const nome = prompt('Nome do módulo:');
  if (!nome) return;
  
  salvarComoModulo(nome, 'html', codigo);
  toast('✅ Salvo como módulo!');
}

function copiarPlayground() {
  const codigo = document.getElementById('playgroundCode').value;
  navigator.clipboard.writeText(codigo);
  toast('📋 Código copiado!');
}

function abrirPreviewNovo() {
  const codigo = document.getElementById('playgroundCode').value;
  const blob = new Blob([codigo], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}

function limparPlayground() {
  document.getElementById('playgroundCode').value = '';
  document.getElementById('playgroundPreview').src = '';
}

// ========== ARQUIVOS ==========
function renderArquivos() {
  const modulos = getModulos();
  const container = document.getElementById('arquivosList');

  if (modulos.length === 0) {
    container.innerHTML = '&lt;p style=&quot;color:var(--text2);text-align:center;padding:40px;&quot;&gt;Nenhum arquivo salvo&lt;/p&gt;';
    return;
  }

  container.innerHTML = modulos.map(m =&gt; `
    &lt;div class=&quot;file-item&quot;&gt;
      &lt;div&gt;
        &lt;strong&gt;${escHtml(m.nome)}&lt;/strong&gt;
        &lt;span class=&quot;tag tag-${m.tipo}&quot;&gt;${m.tipo}&lt;/span&gt;

      &lt;div style=&quot;display:flex;gap:4px;&quot;&gt;
        &lt;button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;copiarParaPlayground(\`${m.codigo.replace(/`/g, '\\`')}\`)&quot;&gt;⚡&lt;/button&gt;
        &lt;button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;baixarModulo('${m.id}')&quot;&gt;📥&lt;/button&gt;
        &lt;button class=&quot;btn btn-danger btn-sm&quot; onclick=&quot;deletarModulo('${m.id}'); renderArquivos();&quot;&gt;🗑️&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  `).join('');
}

function filtrarArquivos(busca) {
  const modulos = getModulos().filter(m =&gt; 
    m.nome.toLowerCase().includes(busca.toLowerCase())
  );
  
  const container = document.getElementById('arquivosList');
  container.innerHTML = modulos.map(m =&gt; `
    &lt;div class=&quot;file-item&quot;&gt;
      &lt;div&gt;
        &lt;strong&gt;${escHtml(m.nome)}&lt;/strong&gt;
        &lt;span class=&quot;tag tag-${m.tipo}&quot;&gt;${m.tipo}&lt;/span&gt;
      &lt;/div&gt;
      &lt;div style=&quot;display:flex;gap:4px;&quot;&gt;
        &lt;button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;copiarParaPlayground(\`${m.codigo.replace(/`/g, '\\`')}\`)&quot;&gt;⚡&lt;/button&gt;
        &lt;button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;baixarModulo('${m.id}')&quot;&gt;📥&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  `).join('');
}

function baixarModulo(id) {
  const modulo = getModulos().find(m =&gt; m.id === id);
  if (!modulo) return;
  
  const ext = { html: '.html', css: '.css', js: '.js', funcao: '.js' }[modulo.tipo] || '.txt';
  baixarArquivo(modulo.codigo, modulo.nome + ext, 'text/plain');
}

function exportarTudo() {
  const data = {
    modulos: getModulos(),
    selected: getSelected(),
    data: new Date().toISOString()
  };
  
  baixarArquivo(JSON.stringify(data, null, 2), 'backup-workstation-' + new Date().toISOString().slice(0, 10) + '.json', 'application/json');
  toast('💾 Backup exportado!');
}

function importarTudo() {
  document.getElementById('backupInput').click();
}

document.getElementById('backupInput').addEventListener('change', (e) =&gt; {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (ev) =&gt; {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.modulos) {
        setModulos(data.modulos);
        if (data.selected) setSelected(data.selected);
        toast('✅ Backup importado!');
        renderModulos();
        renderArquivos();
      }
    } catch (err) {
      toast('❌ Arquivo inválido!');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function limparTudo() {
  if (!confirm('⚠️ ATENÇÃO: Isso vai apagar TUDO! Tem certeza?')) return;
  if (!confirm('Última chance! Realmente deseja apagar tudo?')) return;
  
  localStorage.clear();
  toast('🗑️ Tudo limpo!');
  renderModulos();
  renderArquivos();
}

function importarParaScanner() {
  document.getElementById('fileInput').click();
  document.getElementById('fileInput').onchange = (e) =&gt; {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) =&gt; {
      document.getElementById('scannerInput').value = ev.target.result;
      toast('📂 Arquivo importado!');
    };
    reader.readAsText(file);
    e.target.value = '';
  };
}

function importarParaPlayground() {
  document.getElementById('fileInput').click();
  document.getElementById('fileInput').onchange = (e) =&gt; {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) =&gt; {
      document.getElementById('playgroundCode').value = ev.target.result;
      executarPlayground();
      toast('📂 Arquivo importado!');

    reader.readAsText(file);
    e.target.value = '';
  };
}

function limparScanner() {
  document.getElementById('scannerInput').value = '';
  document.getElementById('scannerResults').innerHTML = '';
}

// ========== UTILS ==========
function escHtml(s) {
  return String(s).replace(/&amp;/g, '&amp;amp;').replace(/&lt;/g, '&amp;lt;').replace(/&gt;/g, '&amp;gt;').replace(/&quot;/g, '&amp;quot;');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.transform = 'translateY(0)';
  t.style.opacity = '1';
  setTimeout(() =&gt; {
    t.style.transform = 'translateY(100px)';
    t.style.opacity = '0';
  }, 2500);
}

function baixarArquivo(conteudo, nome, tipo) {
  const blob = new Blob([conteudo], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  a.click();
  URL.revokeObjectURL(url);
}

function atualizarContador() {
  const count = getModulos().length;
  const el = document.getElementById('modCount');
  if (el) el.textContent = count;
}

.tabs { display:flex; gap:4px; margin-bottom:16px; flex-wrap:wrap; }
.tab-btn { padding:8px 16px; border:1px solid var(--border); background:transparent; color:var(--text2); border-radius:8px; font-size:11px; font-weight:600; cursor:pointer; }
.tab-btn.active { background:var(--accent); color:#000; border-color:var(--accent); }

/* Preview */
.preview-frame { width:100%; height:500px; border:1px solid var(--border); border-radius:8px; background:white; }

/* Status */
.status { padding:10px 14px; border-radius:8px; font-size:11px; font-weight:600; margin-bottom:12px; }
.status-info { background:rgba(96,165,250,0.1); color:var(--blue); border:1px solid rgba(96,165,250,0.2); }
.status-success { background:rgba(74,222,128,0.1); color:var(--green); border:1px solid rgba(74,222,128,0.2); }

/* Responsive */
@media(max-width:768px) {
  .modules-grid { grid-template-columns:1fr; }
  .input-group { grid-template-columns:1fr; }
  .container { padding:12px; }
}

.empty-state { text-align:center; padding:40px; color:var(--text2); }
.empty-state .icon { font-size:48px; margin-bottom:12px; }

.section-title { font-size:12px; color:var(--text2); text-transform:uppercase; letter-spacing:2px; font-weight:700; margin:24px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--border); }

.flex-between { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }

.checklist { list-style:none; }
.checklist li { padding:6px 0; font-size:12px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--border); }
.checklist li:last-child { border:none; }
.check { width:18px; height:18px; border-radius:4px; border:2px solid var(--border); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:10px; transition:all 0.15s; }
.check.checked { background:var(--green); border-color:var(--green); color:#000; }
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;

&lt;div class=&quot;header&quot;&gt;
  &lt;h1&gt;🧩 Montador de Módulos &lt;small&gt;PWA JURÍDICO — MAIKON CALDEIRA&lt;/small&gt;&lt;/h1&gt;
  &lt;div style=&quot;display:flex;gap:6px;flex-wrap:wrap;&quot;&gt;
    &lt;button class=&quot;btn btn-primary&quot; onclick=&quot;exportFinal()&quot;&gt;📦 Gerar HTML Final&lt;/button&gt;
    &lt;button class=&quot;btn btn-ghost&quot; onclick=&quot;exportBackup()&quot;&gt;💾 Backup Módulos&lt;/button&gt;
    &lt;button class=&quot;btn btn-ghost&quot; onclick=&quot;importBackup()&quot;&gt;📂 Importar Backup&lt;/button&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;container&quot;&gt;

  &lt;!-- Instruções --&gt;
  &lt;div class=&quot;status status-info&quot;&gt;
    💡 &lt;strong&gt;Como usar:&lt;/strong&gt; Cole pedaços de código HTML nos módulos abaixo. Dê um nome e descrição para cada um. 
    Depois marque quais quer incluir e clique em &quot;Gerar HTML Final&quot; para combinar tudo num arquivo só.
  &lt;/div&gt;

  &lt;!-- Tabs --&gt;
  &lt;div class=&quot;tabs&quot;&gt;
    &lt;button class=&quot;tab-btn active&quot; onclick=&quot;showSection('add')&quot;&gt;➕ Adicionar Módulo&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;showSection('modules')&quot;&gt;📦 Meus Módulos (&lt;span id=&quot;moduleCount&quot;&gt;0&lt;/span&gt;)&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;showSection('build')&quot;&gt;🔨 Montar Projeto&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;showSection('preview')&quot;&gt;👁️ Preview&lt;/button&gt;
    &lt;button class=&quot;tab-btn&quot; onclick=&quot;showSection('guide')&quot;&gt;📖 Guia&lt;/button&gt;
  &lt;/div&gt;

  &lt;!-- Section: Add Module --&gt;
  &lt;div id=&quot;section-add&quot; class=&quot;workspace&quot;&gt;
    &lt;h2&gt;➕ Adicionar Novo Módulo de Código&lt;/h2&gt;
    
    &lt;div class=&quot;input-group&quot;&gt;
      &lt;div class=&quot;input-row&quot;&gt;
        &lt;label&gt;Nome do Módulo&lt;/label&gt;
        &lt;input type=&quot;text&quot; class=&quot;input&quot; id=&quot;modName&quot; placeholder=&quot;Ex: Importar PDF, Exportar Word, Formulário Cliente...&quot; /&gt;
      &lt;/div&gt;
      &lt;div class=&quot;input-row&quot;&gt;
        &lt;label&gt;Tipo&lt;/label&gt;
        &lt;select class=&quot;input&quot; id=&quot;modType&quot;&gt;
          &lt;option value=&quot;funcao&quot;&gt;🔧 Função/Lógica (JavaScript)&lt;/option&gt;
          &lt;option value=&quot;visual&quot;&gt;🎨 Visual/Interface (HTML+CSS)&lt;/option&gt;
          &lt;option value=&quot;completo&quot;&gt;📄 Bloco Completo (HTML+CSS+JS)&lt;/option&gt;
          &lt;option value=&quot;estilo&quot;&gt;💅 Apenas CSS/Estilo&lt;/option&gt;
          &lt;option value=&quot;dados&quot;&gt;📊 Dados/Templates&lt;/option&gt;
        &lt;/select&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    
    &lt;div class=&quot;input-row&quot;&gt;
      &lt;label&gt;Descrição (o que esse código faz?)&lt;/label&gt;
      &lt;input type=&quot;text&quot; class=&quot;input&quot; id=&quot;modDesc&quot; placeholder=&quot;Ex: Lê arquivo PDF e extrai nome, CPF e endereço do segurado...&quot; /&gt;
    &lt;/div&gt;
    
    &lt;div class=&quot;input-row&quot;&gt;
      &lt;label&gt;Tags (separadas por vírgula)&lt;/label&gt;
      &lt;input type=&quot;text&quot; class=&quot;input&quot; id=&quot;modTags&quot; placeholder=&quot;Ex: pdf, importar, inss, dados&quot; /&gt;
    &lt;/div&gt;
    
    &lt;div class=&quot;input-row&quot;&gt;
      &lt;label&gt;Cole o Código Aqui&lt;/label&gt;
      &lt;textarea class=&quot;code-area large&quot; id=&quot;modCode&quot; placeholder=&quot;Cole aqui o pedaço de código HTML/CSS/JS que quer salvar como módulo...&quot;&gt;&lt;/textarea&gt;
    &lt;/div&gt;
    
    &lt;div style=&quot;display:flex;gap:8px;margin-top:12px;&quot;&gt;
      &lt;button class=&quot;btn btn-primary&quot; onclick=&quot;saveModule()&quot;&gt;💾 Salvar Módulo&lt;/button&gt;
      &lt;button class=&quot;btn btn-ghost&quot; onclick=&quot;clearForm()&quot;&gt;🗑️ Limpar&lt;/button&gt;
      &lt;button class=&quot;btn btn-blue&quot; onclick=&quot;importFromFile()&quot;&gt;📂 Importar de Arquivo&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- Section: Modules List --&gt;
  &lt;div id=&quot;section-modules&quot; class=&quot;workspace&quot; style=&quot;display:none;&quot;&gt;
    &lt;div class=&quot;flex-between&quot;&gt;
      &lt;h2&gt;📦 Módulos Salvos&lt;/h2&gt;
      &lt;input type=&quot;text&quot; class=&quot;input&quot; style=&quot;width:200px;&quot; placeholder=&quot;🔍 Buscar...&quot; oninput=&quot;filterModules(this.value)&quot; /&gt;
    &lt;/div&gt;
    &lt;div class=&quot;modules-grid&quot; id=&quot;modulesGrid&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- Section: Build --&gt;
  &lt;div id=&quot;section-build&quot; class=&quot;workspace&quot; style=&quot;display:none;&quot;&gt;
    &lt;h2&gt;🔨 Montar Projeto Final&lt;/h2&gt;
    &lt;p style=&quot;font-size:12px;color:var(--text2);margin-bottom:16px;&quot;&gt;
      Marque os módulos que deseja incluir no HTML final. A ordem importa — arraste ou use as setas para reorganizar.
    &lt;/p&gt;
    
    &lt;div class=&quot;input-row&quot;&gt;
      &lt;label&gt;Título do Projeto Final&lt;/label&gt;
      &lt;input type=&quot;text&quot; class=&quot;input&quot; id=&quot;buildTitle&quot; value=&quot;PWA Jurídico — Maikon Caldeira&quot; /&gt;
    &lt;/div&gt;
    
    &lt;div class=&quot;input-row&quot;&gt;
      &lt;label&gt;CSS Base (opcional — será incluído no &amp;lt;head&amp;gt;)&lt;/label&gt;
      &lt;textarea class=&quot;code-area&quot; id=&quot;buildBaseCss&quot; style=&quot;min-height:80px;&quot; placeholder=&quot;/* CSS base que vai em todos os projetos */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; }&quot;&gt;&lt;/textarea&gt;
    &lt;/div&gt;
    
    &lt;div class=&quot;section-title&quot;&gt;Selecione os Módulos para Incluir&lt;/div&gt;
    &lt;div id=&quot;buildChecklist&quot;&gt;&lt;/div&gt;
    
    &lt;div style=&quot;margin-top:16px;display:flex;gap:8px;&quot;&gt;
      &lt;button class=&quot;btn btn-success&quot; onclick=&quot;exportFinal()&quot;&gt;📦 Gerar HTML Final&lt;/button&gt;
      &lt;button class=&quot;btn btn-ghost&quot; onclick=&quot;selectAll()&quot;&gt;✅ Selecionar Todos&lt;/button&gt;
      &lt;button class=&quot;btn btn-ghost&quot; onclick=&quot;deselectAll()&quot;&gt;⬜ Desmarcar Todos&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- Section: Preview --&gt;
  &lt;div id=&quot;section-preview&quot; class=&quot;workspace&quot; style=&quot;display:none;&quot;&gt;
    &lt;div class=&quot;flex-between&quot;&gt;
      &lt;h2&gt;👁️ Preview do Projeto Montado&lt;/h2&gt;
      &lt;div style=&quot;display:flex;gap:6px;&quot;&gt;
        &lt;button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;refreshPreview()&quot;&gt;🔄 Atualizar&lt;/button&gt;
        &lt;button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;openFullPreview()&quot;&gt;🔳 Tela Cheia&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;iframe class=&quot;preview-frame&quot; id=&quot;previewFrame&quot;&gt;&lt;/iframe&gt;
  &lt;/div&gt;

  &lt;!-- Section: Guide --&gt;
  &lt;div id=&quot;section-guide&quot; class=&quot;workspace&quot; style=&quot;display:none;&quot;&gt;
    &lt;h2&gt;📖 Guia — Como Montar seu PWA&lt;/h2&gt;
    
    &lt;div class=&quot;status status-info&quot; style=&quot;margin-top:12px;&quot;&gt;
      🎯 &lt;strong&gt;Estratégia:&lt;/strong&gt; Em vez de tentar fazer tudo de uma vez, vamos por partes. 
      Cada funcionalidade vira um &quot;módulo&quot; independente. Depois juntamos.
    &lt;/div&gt;
    
    &lt;div class=&quot;section-title&quot;&gt;Passo a Passo&lt;/div&gt;
    &lt;ol style=&quot;font-size:12px;line-height:2;padding-left:20px;color:var(--text2);&quot;&gt;
      &lt;li&gt;&lt;strong style=&quot;color:var(--text)&quot;&gt;Separe os códigos por função&lt;/strong&gt; — cada pedaço faz UMA coisa (importar PDF, gerar documento, salvar dados...)&lt;/li&gt;
      &lt;li&gt;&lt;strong style=&quot;color:var(--text)&quot;&gt;Cole cada pedaço como módulo&lt;/strong&gt; — use a aba &quot;Adicionar Módulo&quot; e dê nome descritivo&lt;/li&gt;
      &lt;li&gt;&lt;strong style=&quot;color:var(--text)&quot;&gt;Teste individual&lt;/strong&gt; — na aba Preview, veja se cada módulo funciona sozinho&lt;/li&gt;
      &lt;li&gt;&lt;strong style=&quot;color:var(--text)&quot;&gt;Monte o projeto&lt;/strong&gt; — na aba &quot;Montar&quot;, selecione os módulos e gere o HTML final&lt;/li&gt;
      &lt;li&gt;&lt;strong style=&quot;color:var(--text)&quot;&gt;Ajuste conflitos&lt;/strong&gt; — se algo quebrar, traga aqui que te ajudo a resolver&lt;/li&gt;
    &lt;/ol&gt;
    
    &lt;div class=&quot;section-title&quot;&gt;Tipos de Módulo&lt;/div&gt;
    &lt;table style=&quot;width:100%;font-size:11px;border-collapse:collapse;&quot;&gt;
      &lt;tr style=&quot;border-bottom:1px solid var(--border);&quot;&gt;
        &lt;td style=&quot;padding:8px;color:var(--blue);&quot;&gt;🔧 Função/Lógica&lt;/td&gt;
        &lt;td style=&quot;padding:8px;color:var(--text2);&quot;&gt;Código JavaScript puro (funções, cálculos, processamento de dados)&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr style=&quot;border-bottom:1px solid var(--border);&quot;&gt;
        &lt;td style=&quot;padding:8px;color:var(--green);&quot;&gt;🎨 Visual/Interface&lt;/td&gt;
        &lt;td style=&quot;padding:8px;color:var(--text2);&quot;&gt;HTML + CSS (botões, formulários, layout, cards)&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr style=&quot;border-bottom:1px solid var(--border);&quot;&gt;
        &lt;td style=&quot;padding:8px;color:var(--accent);&quot;&gt;📄 Bloco Completo&lt;/td&gt;
        &lt;td style=&quot;padding:8px;color:var(--text2);&quot;&gt;HTML + CSS + JS juntos (componente inteiro que funciona sozinho)&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr style=&quot;border-bottom:1px solid var(--border);&quot;&gt;
        &lt;td style=&quot;padding:8px;color:#c084fc;&quot;&gt;💅 Apenas CSS&lt;/td&gt;
        &lt;td style=&quot;padding:8px;color:var(--text2);&quot;&gt;Estilos visuais (tema, cores, fontes, animações)&lt;/td&gt;
      &lt;/tr&gt;
      &lt;tr&gt;
        &lt;td style=&quot;padding:8px;color:var(--red);&quot;&gt;📊 Dados/Templates&lt;/td&gt;
        &lt;td style=&quot;padding:8px;color:var(--text2);&quot;&gt;Modelos de documentos, arrays de dados, configurações&lt;/td&gt;
      &lt;/tr&gt;
    &lt;/table&gt;
    
    &lt;div class=&quot;section-title&quot;&gt;Sobre o Banco de Dados (Neon)&lt;/div&gt;
    &lt;div style=&quot;font-size:12px;color:var(--text2);line-height:1.8;&quot;&gt;
      &lt;p&gt;⚠️ &lt;strong style=&quot;color:var(--text)&quot;&gt;Importante:&lt;/strong&gt; Um HTML puro no navegador &lt;strong&gt;NÃO consegue&lt;/strong&gt; conectar direto no Neon (PostgreSQL). Precisa de um &quot;servidor&quot; no meio.&lt;/p&gt;
      &lt;p style=&quot;margin-top:8px;&quot;&gt;🟢 &lt;strong style=&quot;color:var(--green)&quot;&gt;Alternativa que funciona sem servidor:&lt;/strong&gt;&lt;/p&gt;
      &lt;ul style=&quot;padding-left:16px;margin-top:4px;&quot;&gt;
        &lt;li&gt;&lt;strong&gt;localStorage&lt;/strong&gt; — salva no navegador (o que estamos usando aqui)&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;IndexedDB&lt;/strong&gt; — banco mais robusto no navegador (suporta mais dados)&lt;/li&gt;
        &lt;li&gt;&lt;strong&gt;Exportar/Importar JSON&lt;/strong&gt; — backup manual dos dados&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p style=&quot;margin-top:8px;&quot;&gt;🔵 &lt;strong style=&quot;color:var(--blue)&quot;&gt;Se quiser Neon no futuro:&lt;/strong&gt; Precisará de um backend (Vercel Functions, Cloudflare Workers, ou Supabase que já dá tudo pronto).&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

&lt;/div&gt;

&lt;!-- Hidden --&gt;
&lt;input type=&quot;file&quot; id=&quot;fileInput&quot; style=&quot;display:none&quot; accept=&quot;.html,.htm,.js,.css,.txt,.json&quot; /&gt;
&lt;input type=&quot;file&quot; id=&quot;backupInput&quot; style=&quot;display:none&quot; accept=&quot;.json&quot; /&gt;

&lt;!-- Toast --&gt;
&lt;div class=&quot;toast&quot; id=&quot;toast&quot; style=&quot;position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--accent);border-radius:10px;padding:12px 20px;font-size:12px;font-weight:600;color:var(--accent2);z-index:2000;transform:translateY(100px);opacity:0;transition:all 0.3s;&quot;&gt;&lt;/div&gt;

&lt;script&gt;
// ========== STATE ==========
const LS_MODULES = 'pwa-modules-v1';
const LS_SELECTED = 'pwa-selected-v1';

function getModules() {
  try { return JSON.parse(localStorage.getItem(LS_MODULES) || '[]'); } catch { return []; }
}
function setModules(list) { localStorage.setItem(LS_MODULES, JSON.stringify(list)); }
function getSelected() {
  try { return JSON.parse(localStorage.getItem(LS_SELECTED) || '[]'); } catch { return []; }
}
function setSelected(list) { localStorage.setItem(LS_SELECTED, JSON.stringify(list)); }

// ========== UI ==========
function showSection(name) {
  ['add','modules','build','preview','guide'].forEach(s =&gt; {
    document.getElementById('section-' + s).style.display = s === name ? 'block' : 'none';
  });
  document.querySelectorAll('.tab-btn').forEach((btn, i) =&gt; {
    const sections = ['add','modules','build','preview','guide'];
    btn.classList.toggle('active', sections[i] === name);
  });
  if (name === 'modules') renderModules();
  if (name === 'build') renderBuildChecklist();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.transform = 'translateY(0)';
  t.style.opacity = '1';
  setTimeout(() =&gt; { t.style.transform = 'translateY(100px)'; t.style.opacity = '0'; }, 2500);
}

// ========== MODULES ==========
function saveModule() {
  const name = document.getElementById('modName').value.trim();
  const type = document.getElementById('modType').value;
  const desc = document.getElementById('modDesc').value.trim();
  const tags = document.getElementById('modTags').value.split(',').map(t =&gt; t.trim()).filter(Boolean);
  const code = document.getElementById('modCode').value;
  
  if (!name) { showToast('❌ Dê um nome ao módulo!'); return; }
  if (!code.trim()) { showToast('❌ Cole algum código!'); return; }
  
  const modules = getModules();
  modules.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name, type, desc, tags, code,
    date: new Date().toISOString()
  });
  setModules(modules);
  updateCount();
  clearForm();
  showToast('✅ Módulo &quot;' + name + '&quot; salvo!');
}

function clearForm() {
  document.getElementById('modName').value = '';
  document.getElementById('modDesc').value = '';
  document.getElementById('modTags').value = '';
  document.getElementById('modCode').value = '';
}

function renderModules(filter = '') {
  const modules = getModules().filter(m =&gt; 
    !filter || m.name.toLowerCase().includes(filter.toLowerCase()) || m.tags.some(t =&gt; t.toLowerCase().includes(filter.toLowerCase()))
  );
  const grid = document.getElementById('modulesGrid');
  
  if (modules.length === 0) {
    grid.innerHTML = '&lt;div class=&quot;empty-state&quot;&gt;&lt;div class=&quot;icon&quot;&gt;📭&lt;/div&gt;&lt;p&gt;Nenhum módulo salvo ainda.&lt;br&gt;Use a aba &quot;Adicionar Módulo&quot; para começar!&lt;/p&gt;&lt;/div&gt;';
    return;
  }
  
  grid.innerHTML = modules.map(m =&gt; `
    &lt;div class=&quot;module-card&quot;&gt;
      &lt;div class=&quot;card-header&quot;&gt;
        &lt;h3&gt;${escHtml(m.name)}&lt;/h3&gt;
        &lt;span class=&quot;tag ${m.type === 'visual' ? 'visual' : m.type === 'funcao' ? 'logica' : ''}&quot;&gt;${getTypeLabel(m.type)}&lt;/span&gt;
      &lt;/div&gt;
      ${m.desc ? `&lt;div class=&quot;desc&quot;&gt;${escHtml(m.desc)}&lt;/div&gt;` : ''}
      &lt;div class=&quot;tags&quot;&gt;${m.tags.map(t =&gt; `&lt;span class=&quot;tag&quot;&gt;${escHtml(t)}&lt;/span&gt;`).join('')}&lt;/div&gt;
      &lt;pre&gt;${escHtml(m.code.slice(0, 200))}${m.code.length &gt; 200 ? '...' : ''}&lt;/pre&gt;
      &lt;div class=&quot;card-actions&quot;&gt;
        &lt;button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;viewModule('${m.id}')&quot;&gt;👁️ Ver&lt;/button&gt;
        &lt;button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;editModule('${m.id}')&quot;&gt;✏️ Editar&lt;/button&gt;
        &lt;button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;copyModule('${m.id}')&quot;&gt;📋 Copiar&lt;/button&gt;
        &lt;button class=&quot;btn btn-danger btn-sm&quot; onclick=&quot;deleteModule('${m.id}')&quot;&gt;🗑️&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  `).join('');
}

function filterModules(query) { renderModules(query); }

function deleteModule(id) {
  if (!confirm('Excluir este módulo?')) return;
  setModules(getModules().filter(m =&gt; m.id !== id));
  renderModules();
  updateCount();
  showToast('🗑️ Módulo excluído!');
}

function copyModule(id) {
  const m = getModules().find(x =&gt; x.id === id);
  if (m) { navigator.clipboard.writeText(m.code); showToast('📋 Código copiado!'); }
}

function viewModule(id) {
  const m = getModules().find(x =&gt; x.id === id);
  if (!m) return;
  document.getElementById('modName').value = m.name;
  document.getElementById('modType').value = m.type;
  document.getElementById('modDesc').value = m.desc;
  document.getElementById('modTags').value = m.tags.join(', ');
  document.getElementById('modCode').value = m.code;
  showSection('add');
}

function editModule(id) {
  const m = getModules().find(x =&gt; x.id === id);
  if (!m) return;
  // Remove old and let user save as new
  setModules(getModules().filter(x =&gt; x.id !== id));
  viewModule(id); // This won't find it anymore, so we set manually
  document.getElementById('modName').value = m.name;
  document.getElementById('modType').value = m.type;
  document.getElementById('modDesc').value = m.desc;
  document.getElementById('modTags').value = m.tags.join(', ');
  document.getElementById('modCode').value = m.code;
  showSection('add');
  updateCount();
  showToast('✏️ Editando módulo — salve quando terminar!');
}

// ========== BUILD ==========
function renderBuildChecklist() {
  const modules = getModules();
  const selected = getSelected();
  const container = document.getElementById('buildChecklist');
  
  if (modules.length === 0) {
    container.innerHTML = '&lt;p style=&quot;color:var(--text2);font-size:12px;&quot;&gt;Nenhum módulo disponível. Adicione módulos primeiro.&lt;/p&gt;';
    return;
  }
  
  container.innerHTML = '&lt;ul class=&quot;checklist&quot;&gt;' + modules.map((m, i) =&gt; `
    &lt;li&gt;
      &lt;div class=&quot;check ${selected.includes(m.id)?'checked':''}&quot; onclick=&quot;toggleSelect('${m.id}')&quot;&gt;
        ${selected.includes(m.id) ? '✓' : ''}
      &lt;/div&gt;
      &lt;div style=&quot;flex:1;&quot;&gt;
        &lt;strong style=&quot;font-size:12px;&quot;&gt;${escHtml(m.name)}&lt;/strong&gt;
        &lt;span style=&quot;font-size:10px;color:var(--text2);margin-left:8px;&quot;&gt;${getTypeLabel(m.type)}&lt;/span&gt;
        ${m.desc ? `&lt;br&gt;&lt;span style=&quot;font-size:10px;color:var(--text2);&quot;&gt;${escHtml(m.desc)}&lt;/span&gt;` : ''}
      &lt;/div&gt;
      &lt;div style=&quot;display:flex;gap:4px;&quot;&gt;
        &lt;button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;moveModule(${i},-1)&quot;&gt;⬆️&lt;/button&gt;
        &lt;button class=&quot;btn btn-ghost btn-sm&quot; onclick=&quot;moveModule(${i},1)&quot;&gt;⬇️&lt;/button&gt;
      &lt;/div&gt;
    &lt;/li&gt;
  `).join('') + '&lt;/ul&gt;';
}

function toggleSelect(id) {
  let selected = getSelected();
  if (selected.includes(id)) selected = selected.filter(x =&gt; x !== id);
  else selected.push(id);
  setSelected(selected);
  renderBuildChecklist();
}

function selectAll() {
  setSelected(getModules().map(m =&gt; m.id));
  renderBuildChecklist();
}

function deselectAll() {
  setSelected([]);
  renderBuildChecklist();
}

function moveModule(index, dir) {
  const modules = getModules();
  const newIndex = index + dir;
  if (newIndex &lt; 0 || newIndex &gt;= modules.length) return;
  [modules[index], modules[newIndex]] = [modules[newIndex], modules[index]];
  setModules(modules);
  renderBuildChecklist();
}

// ========== EXPORT ==========
function exportFinal() {
  const modules = getModules();
  const selected = getSelected();
  const chosen = modules.filter(m =&gt; selected.includes(m.id));
  
  if (chosen.length === 0) {
    showToast('⚠️ Selecione pelo menos um módulo na aba &quot;Montar&quot;!');
    showSection('build');
    return;
  }
  
  const title = document.getElementById('buildTitle').value || 'PWA Jurídico';
  const baseCss = document.getElementById('buildBaseCss').value || '';
  
  // Separate by type
  const styles = chosen.filter(m =&gt; m.type === 'estilo').map(m =&gt; m.code).join('\n\n');
  const htmlParts = chosen.filter(m =&gt; m.type === 'visual' || m.type === 'completo' || m.type === 'dados').map(m =&gt; `\n&lt;!-- === MÓDULO: ${m.name} === --&gt;\n${m.code}`).join('\n');
  const scripts = chosen.filter(m =&gt; m.type === 'funcao').map(m =&gt; `\n// === MÓDULO: ${m.name} ===\n${m.code}`).join('\n');
  
  // Check if any module is a complete document
  const completeDoc = chosen.find(m =&gt; m.code.trim().toLowerCase().includes('&lt;!doctype') || m.code.trim().toLowerCase().includes('&lt;html'));
  
  let finalHtml;
  if (completeDoc &amp;&amp; chosen.length === 1) {
    finalHtml = completeDoc.code;
  } else {
    finalHtml = `&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;pt-BR&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
&lt;title&gt;${escHtml(title)}&lt;/title&gt;
&lt;style&gt;
/* === CSS BASE === */
${baseCss}

/* === MÓDULOS CSS === */
${styles}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;

${htmlParts}

&lt;script&gt;
${scripts}
&lt;\/script&gt;
&lt;/body&gt;
&lt;/html&gt;`;
  }
  
  // Download
  const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (title.replace(/[^a-zA-Z0-9]/g, '_') || 'projeto') + '.html';
  a.click();
  URL.revokeObjectURL(url);
  showToast('📦 HTML final gerado e baixado!');
}

function refreshPreview() {
  const modules = getModules();
  const selected = getSelected();
  const chosen = modules.filter(m =&gt; selected.includes(m.id));
  
  const title = document.getElementById('buildTitle').value || 'PWA Jurídico';
  const baseCss = document.getElementById('buildBaseCss').value || '';
  const styles = chosen.filter(m =&gt; m.type === 'estilo').map(m =&gt; m.code).join('\n');
  const htmlParts = chosen.filter(m =&gt; m.type === 'visual' || m.type === 'completo' || m.type === 'dados').map(m =&gt; m.code).join('\n');
  const scripts = chosen.filter(m =&gt; m.type === 'funcao').map(m =&gt; m.code).join('\n');
  
  const doc = `&lt;!DOCTYPE html&gt;&lt;html&gt;&lt;head&gt;&lt;meta charset=&quot;UTF-8&quot;&gt;&lt;style&gt;${baseCss}\n${styles}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;${htmlParts}&lt;script&gt;${scripts}&lt;\/script&gt;&lt;/body&gt;&lt;/html&gt;`;
  
  const blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  document.getElementById('previewFrame').src = url;
  setTimeout(() =&gt; URL.revokeObjectURL(url), 5000);
}

function openFullPreview() {
  refreshPreview();
  const frame = document.getElementById('previewFrame');
  if (frame.src) window.open(frame.src, '_blank');
}

// ========== BACKUP ==========
function exportBackup() {
  const data = { modules: getModules(), selected: getSelected(), date: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pwa-modulos-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('💾 Backup exportado!');
}

function importBackup() {
  document.getElementById('backupInput').click();
}

document.getElementById('backupInput').addEventListener('change', (e) =&gt; {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) =&gt; {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.modules) {
        const existing = getModules();
        const merged = [...existing, ...data.modules.filter(m =&gt; !existing.find(e =&gt; e.id === m.id))];
        setModules(merged);
        if (data.selected) setSelected(data.selected);
        updateCount();
        showToast('📂 Backup importado! ' + data.modules.length + ' módulos.');
      }
    } catch(err) {
      showToast('❌ Arquivo inválido!');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// Import code from file
function importFromFile() {
  document.getElementById('fileInput').click();
}

document.getElementById('fileInput').addEventListener('change', (e) =&gt; {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) =&gt; {
    document.getElementById('modCode').value = ev.target.result;
    if (!document.getElementById('modName').value) {
      document.getElementById('modName').value = file.name.replace(/\.[^.]+$/, '');
    }
    showToast('📂 Código do arquivo carregado!');
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ========== UTILS ==========
function escHtml(s) { return String(s).replace(/&amp;/g,'&amp;amp;').replace(/&lt;/g,'&amp;lt;').replace(/&gt;/g,'&amp;gt;').replace(/&quot;/g,'&amp;quot;'); }
function getTypeLabel(type) {
  const labels = { funcao:'🔧 Função', visual:'🎨 Visual', completo:'📄 Completo', estilo:'💅 CSS', dados:'📊 Dados' };
  return labels[type] || type;
}
function updateCount() {
  document.getElementById('moduleCount').textContent = getModules().length;
}

// Init
updateCount();

      🧠 Cérebro
    &lt;/button&gt;
    &lt;button class=&quot;btn-filtro&quot; style=&quot;background:#166534;color:#4ade80&quot; onclick=&quot;filtrar('importante',this)&quot;&gt;
      ⭐ Importantes
    &lt;/button&gt;
  &lt;/div&gt;

  &lt;!-- LISTA DE ELEMENTOS --&gt;
  &lt;div id=&quot;lista-elementos&quot;&gt;&lt;/div&gt;

  &lt;!-- TOAST --&gt;
  &lt;div class=&quot;toast&quot; id=&quot;toast&quot;&gt;&lt;/div&gt;

  &lt;script&gt;
    let todosElementos = [];
    let arquivoAtual = null;
    let filtroAtivo = 'todos';

    // =====================
    // INICIALIZAR
    // =====================
    window.onload = function() {
      carregarNotas();
    };

    // =====================
    // LER ARQUIVO
    // =====================
    function lerArquivo(event) {
      const arquivo = event.target.files[0];
      if (!arquivo) return;

      arquivoAtual = arquivo.name;
      const leitor = new FileReader();

      leitor.onload = function(e) {
        const conteudo = e.target.result;
        analisarCodigo(conteudo, arquivo.name);
      };

      leitor.readAsText(arquivo);
    }

    // =====================
    // ANALISAR CÓDIGO
    // =====================
    function analisarCodigo(texto, nomeArquivo) {
      const linhas = texto.split('\n');
      todosElementos = [];

      const extensao = nomeArquivo.split('.').pop().toLowerCase();

      // ANALISAR FUNÇÕES JAVASCRIPT
      if (extensao === 'js' || extensao === 'html') {
        analisarFuncoes(linhas);
      }

      // ANALISAR HTML
      if (extensao === 'html') {
        analisarHTML(texto);
      }

      // ANALISAR CSS
      if (extensao === 'css' || extensao === 'html') {
        analisarCSS(texto);
      }

      // Atualizar resumo
      const funcoes = todosElementos.filter(e =&gt; e.tipo === 'funcao').length;
      const html = todosElementos.filter(e =&gt; e.tipo === 'html').length;
      const css = todosElementos.filter(e =&gt; e.tipo === 'css').length;
      const cerebro = todosElementos.filter(e =&gt; e.cerebro).length;

      document.getElementById('total-elementos').textContent = todosElementos.length;
      document.getElementById('total-linhas').textContent = linhas.length;
      document.getElementById('total-funcoes').textContent = funcoes;
      document.getElementById('total-html').textContent = html;
      document.getElementById('total-css').textContent = css;
      document.getElementById('total-cerebro').textContent = cerebro;

      document.getElementById('resumo').style.display = 'block';
      document.getElementById('acoes-principais').style.display = 'flex';
      document.getElementById('lista-elementos').style.display = 'block';
      document.getElementById('barra-busca').style.display = 'block';
      document.getElementById('filtros').style.display = 'flex';

      renderizarElementos(todosElementos);
      mostrarToast(`✅ ${todosElementos.length} elementos encontrados!`);
    }

    // =====================
    // ANALISAR FUNÇÕES JS
    // =====================
    function analisarFuncoes(linhas) {
      for (let i = 0; i &lt; linhas.length; i++) {
        const linha = linhas[i];
        const padroes = [
          /function\s+(\w+)\s*\(/,
          /const\s+(\w+)\s*=\s*(?:async\s*)?\(/,
          /const\s+(\w+)\s*=\s*(?:async\s*)?function/,
          /(\w+)\s*:\s*(?:async\s*)?function/,
          /(\w+)\s*=\s*(?:async\s*)?\(.*\)\s*=&gt;/,
        ];

        for (const padrao of padroes) {
          const match = linha.match(padrao);
          if (match) {
            const nome = match[1];
            const corpo = pegarCorpo(linhas, i);
            const cerebro = isCerebro(nome, corpo);
            const importante = isImportante(nome, corpo);
            const explicacao = explicarFuncao(nome, corpo, cerebro, importante);

            todosElementos.push({
              tipo: 'funcao',
              nome,
              linha: i + 1,
              corpo,
              cerebro,
              importante,
              explicacao
            });
            break;
          }
        }
      }
    }

    // =====================
    // ANALISAR HTML
    // =====================
    function analisarHTML(texto) {
      const regex = /&lt;(\w+)([^&gt;]*)&gt;/g;
      let match;
      const tagsIgnorar = ['html', 'head', 'body', 'meta', 'title'];

      while ((match = regex.exec(texto)) !== null) {
        const tag = match[1];
        const atributos = match[2];

        if (tagsIgnorar.includes(tag.toLowerCase())) continue;

        const id = atributos.match(/id=[&quot;']([^&quot;']+)[&quot;']/);
        const classe = atributos.match(/class=[&quot;']([^&quot;']+)[&quot;']/);

        const nome = id ? `#${id[1]}` : (classe ? `.${classe[1].split(' ')[0]}` : `&lt;${tag}&gt;`);

        todosElementos.push({
          tipo: 'html',
          nome,
          tag,
          atributos: atributos.trim(),
          corpo: match[0],
          cerebro: false,
          importante: ['button', 'form', 'input'].includes(tag.toLowerCase()),
          explicacao: explicarHTML(tag, atributos)
        });
      }
    }

    // =====================
    // ANALISAR CSS
    // =====================
    function analisarCSS(texto) {
      const regex = /([^{]+)\{([^}]+)\}/g;
      let match;

      while ((match = regex.exec(texto)) !== null) {
        const seletor = match[1].trim();
        const regras = match[2].trim();

        if (seletor.startsWith('@') || seletor.startsWith('*')) continue;

        todosElementos.push({
          tipo: 'css',
          nome: seletor,
          corpo: match[0],
          regras,
          cerebro: false,
          importante: seletor.includes('#') || seletor.includes('.btn'),
          explicacao: explicarCSS(seletor, regras)
        });
      }
    }

    // =====================
    // FUNÇÕES AUXILIARES
    // =====================
    function pegarCorpo(linhas, inicio) {
      let corpo = '';
      let abre = 0;
      let comecou = false;

      for (let i = inicio; i &lt; Math.min(inicio + 60, linhas.length); i++) {
        corpo += linhas[i] + '\n';
        for (const char of linhas[i]) {
          if (char === '{') { abre++; comecou = true; }
          if (char === '}') abre--;
        }
        if (comecou &amp;&amp; abre &lt;= 0) break;
      }
      return corpo;
    }

    function isCerebro(nome, corpo) {
      const nomeMin = nome.toLowerCase();
      const corpoMin = corpo.toLowerCase();
      return nomeMin.includes('memory') || nomeMin.includes('save') || 
             nomeMin.includes('load') || nomeMin.includes('cerebro') ||
             corpoMin.includes('localstorage') || corpoMin.includes('json.stringify');
    }

    function isImportante(nome, corpo) {
      const nomeMin = nome.toLowerCase();
      return nomeMin.includes('init') || nomeMin.includes('main') || 
             nomeMin.includes('start') || nomeMin.includes('chat') ||
             nomeMin.includes('send') || nomeMin.includes('api');
    }

    function explicarFuncao(nome, corpo, cerebro, importante) {
      if (cerebro) {
        return {
          oque: `🧠 Função de MEMÓRIA: &quot;${nome}&quot;`,
          quando: 'Salva ou carrega dados do localStorage',
          dica: 'COPIE ESTA FUNÇÃO — é essencial para o sistema de memória'
        };
      }
      if (importante) {
        return {
          oque: `⭐ Função IMPORTANTE: &quot;${nome}&quot;`,
          quando: 'Faz parte da lógica principal do aplicativo',
          dica: 'Recomendado copiar — é uma função central'
        };
      }
      return {
        oque: `⚡ Função: &quot;${nome}&quot;`,
        quando: 'Função auxiliar ou de suporte',
        dica: 'Copie se outras funções dependerem dela'
      };
    }

    function explicarHTML(tag, atributos) {
      const explicacoes = {
        button: { oque: '🔘 Botão clicável', quando: 'Para ações do usuário', dica: 'Verifique os eventos onclick' },
        input: { oque: '📝 Campo de entrada', quando: 'Para receber dados do usuário', dica: 'Importante para formulários' },
        div: { oque: '📦 Container', quando: 'Para organizar layout', dica: 'Verifique o ID/classe para estilização' },
        form: { oque: '📋 Formulário', quando: 'Para enviar dados', dica: 'Copie se precisar da estrutura de dados' }
      };
      return explicacoes[tag.toLowerCase()] || { oque: `🏗️ Tag HTML: &lt;${tag}&gt;`, quando: 'Elemento estrutural', dica: 'Parte da interface' };
    }

    function explicarCSS(seletor, regras) {
      return {
        oque: `🎨 Estilo para: ${seletor}`,
        quando: 'Define aparência visual',
        dica: regras.includes('display') ? 'Afeta o layout' : 'Afeta cores/tamanhos'
      };
    }

    // =====================
    // RENDERIZAR ELEMENTOS
    // =====================
    function renderizarElementos(lista) {
      const container = document.getElementById('lista-elementos');
      container.innerHTML = '';

      if (lista.length === 0) {
        container.innerHTML = '&lt;p style=&quot;color:#64748b;text-align:center;padding:20px&quot;&gt;Nenhum elemento encontrado&lt;/p&gt;';
        return;
      }

      lista.forEach((el, index) =&gt; {
        const tipoClasse = el.cerebro ? 'cerebro' : (el.importante ? 'importante' : el.tipo);
        const tagTexto = el.cerebro ? '🧠 Cérebro' : (el.importante ? '⭐ Importante' : 
          { funcao: '⚡ Função', html: '🏗️ HTML', css: '🎨 CSS' }[el.tipo]);
        const tagClasse = el.cerebro ? 'tag-cerebro' : (el.importante ? 'tag-importante' : `tag-${el.tipo}`);

        const div = document.createElement('div');
        div.className = 'elemento-card';
        div.dataset.tipo = el.tipo;
        div.dataset.nome = el.nome.toLowerCase();
        if (el.cerebro) div.dataset.cerebro = 'true';
        if (el.importante) div.dataset.importante = 'true';

        div.innerHTML = `
          &lt;div class=&quot;elemento-header ${tipoClasse}&quot; onclick=&quot;toggleCorpo(${index})&quot;&gt;
            &lt;div&gt;
              &lt;strong style=&quot;font-size:1.1em&quot;&gt;${el.nome}&lt;/strong&gt;
              ${el.linha ? `&lt;span style=&quot;color:#64748b;font-size:0.85em;margin-left:10px&quot;&gt;linha ${el.linha}&lt;/span&gt;` : ''}
            &lt;/div&gt;
            &lt;div style=&quot;display:flex;align-items:center;gap:10px&quot;&gt;
              &lt;span class=&quot;tag ${tagClasse}&quot;&gt;${tagTexto}&lt;/span&gt;
              &lt;span id=&quot;seta-${index}&quot;&gt;▼&lt;/span&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;elemento-corpo&quot; id=&quot;corpo-${index}&quot;&gt;
            &lt;div class=&quot;explicacao&quot;&gt;
              &lt;strong&gt;O que é:&lt;/strong&gt; ${el.explicacao.oque}&lt;br&gt;&lt;br&gt;
              &lt;strong&gt;Quando usar:&lt;/strong&gt; ${el.explicacao.quando}&lt;br&gt;&lt;br&gt;
              &lt;strong&gt;💡 Dica:&lt;/strong&gt; &lt;span style=&quot;color:#fde68a&quot;&gt;${el.explicacao.dica}&lt;/span&gt;
            &lt;/div&gt;
            &lt;strong style=&quot;color:#94a3b8;font-size:0.85em&quot;&gt;Código:&lt;/strong&gt;
            &lt;pre id=&quot;pre-${index}&quot;&gt;${escaparHtml(el.corpo)}&lt;/pre&gt;
            &lt;button class=&quot;btn-copiar&quot; onclick=&quot;copiar(${index}, this)&quot;&gt;📋 Copiar este código&lt;/button&gt;
          &lt;/div&gt;
        `;
        container.appendChild(div);
      });
    }

    // =====================
    // TOGGLE ABRIR/FECHAR
    // =====================
    function toggleCorpo(index) {
      const corpo = document.getElementById(`corpo-${index}`);
      const seta = document.getElementById(`seta-${index}`);
      const aberto = corpo.classList.contains('aberto');
      corpo.classList.toggle('aberto');
      seta.textContent = aberto ? '▼' : '▲';
    }

    // =====================
    // COPIAR CÓDIGO
    // =====================
    function copiar(index, btn) {
      const codigo = todosElementos[index].corpo;
      navigator.clipboard.writeText(codigo).then(() =&gt; {
        btn.textContent = '✅ Copiado!';
        btn.classList.add('copiado');
        setTimeout(() =&gt; {
          btn.textContent = '📋 Copiar este código';
          btn.classList.remove('copiado');
        }, 2000);
      });
    }

    function copiarTudo() {
      const tudo = todosElementos.map(el =&gt; el.corpo).join('\n\n');
      navigator.clipboard.writeText(tudo).then(() =&gt; {
        mostrarToast('✅ Todo o código foi copiado!');
      });
    }

    // =====================
    // FILTROS E BUSCA
    // =====================
    function filtrar(tipo, btn) {
      filtroAtivo = tipo;
      document.querySelectorAll('.btn-filtro').forEach(b =&gt; b.classList.remove('ativo'));
      btn.classList.add('ativo');

      let filtradas = todosElementos;
      if (tipo === 'cerebro') filtradas = todosElementos.filter(e =&gt; e.cerebro);
      else if (tipo === 'importante') filtradas = todosElementos.filter(e =&gt; e.importante);
      else if (tipo !== 'todos') filtradas = todosElementos.filter(e =&gt; e.tipo === tipo);

      renderizarElementos(filtradas);
    }

    function filtrarBusca(termo) {
      const filtradas = termo 
        ? todosElementos.filter(e =&gt; e.nome.toLowerCase().includes(termo.toLowerCase()))
        : todosElementos;
      renderizarElementos(filtradas);
    }

    // =====================
    // SISTEMA DE MEMÓRIA
    // =====================
    function salvarNaMemoria() {
      if (!arquivoAtual || todosElementos.length === 0) {
        mostrarToast('❌ Nenhum arquivo analisado!', true);
        return;
      }

      const nota = {
        id: Date.now(),
        nome: arquivoAtual,
        data: new Date().toLocaleString('pt-BR'),
        elementos: todosElementos,
        resumo: {
          total: todosElementos.length,
          funcoes: todosElementos.filter(e =&gt; e.tipo === 'funcao').length,
          html: todosElementos.filter(e =&gt; e.tipo === 'html').length,
          css: todosElementos.filter(e =&gt; e.tipo === 'css').length,
          cerebro: todosElementos.filter(e =&gt; e.cerebro).length
        }
      };

      const notas = JSON.parse(localStorage.getItem('notasProjeto') || '[]');
      notas.push(nota);
      localStorage.setItem('notasProjeto', JSON.stringify(notas));

      carregarNotas();
      mostrarToast('💾 Análise salva na memória!');
    }

    function carregarNotas() {
      const notas = JSON.parse(localStorage.getItem('notasProjeto') || '[]');
      const container = document.getElementById('lista-notas');
      const painel = document.getElementById('painel-memoria');

      if (notas.length === 0) {
        painel.style.display = 'none';
        return;
      }

      painel.style.display = 'block';
      container.innerHTML = '';

      notas.reverse().forEach(nota =&gt; {
        const div = document.createElement('div');
        div.className = 'nota-item';
        div.innerHTML = `
          &lt;div class=&quot;nota-info&quot;&gt;
            &lt;div class=&quot;nota-nome&quot;&gt;📄 ${nota.nome}&lt;/div&gt;
            &lt;div class=&quot;nota-data&quot;&gt;${nota.data} • ${nota.resumo.total} elementos&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;nota-acoes&quot;&gt;
            &lt;button class=&quot;btn-nota&quot; onclick=&quot;carregarNota(${nota.id})&quot;&gt;📂 Abrir&lt;/button&gt;
            &lt;button class=&quot;btn-nota deletar&quot; onclick=&quot;deletarNota(${nota.id})&quot;&gt;🗑️&lt;/button&gt;
          &lt;/div&gt;
        `;
        container.appendChild(div);
      });
    }

    function carregarNota(id) {
      const notas = JSON.parse(localStorage.getItem('notasProjeto') || '[]');
      const nota = notas.find(n =&gt; n.id === id);
      if (!nota) return;

      todosElementos = nota.elementos;
      arquivoAtual = nota.nome;

      document.getElementById('total-elementos').textContent = nota.resumo.total;
      document.getElementById('total-funcoes').textContent = nota.resumo.funcoes;
      document.getElementById('total-html').textContent = nota.resumo.html;
      document.getElementById('total-css').textContent = nota.resumo.css;
      document.getElementById('total-cerebro').textContent = nota.resumo.cerebro;

      document.getElementById('resumo').style.display = 'block';
      document.getElementById('acoes-principais').style.display = 'flex';
      document.getElementById('lista-elementos').style.display = 'block';
      document.getElementById('barra-busca').style.display = 'block';
      document.getElementById('filtros').style.display = 'flex';

      renderizarElementos(todosElementos);
      mostrarToast(`✅ Nota &quot;${nota.nome}&quot; carregada!`);
      window.scrollTo({ top: 300, behavior: 'smooth' });
    }

    function deletarNota(id) {
      if (!confirm('Tem certeza que deseja deletar esta nota?')) return;

      let notas = JSON.parse(localStorage.getItem('notasProjeto') || '[]');
      notas = notas.filter(n =&gt; n.id !== id);
      localStorage.setItem('notasProjeto', JSON.stringify(notas));

      carregarNotas();
      mostrarToast('🗑️ Nota deletada!');
    }

    function limparTodasNotas() {
      if (!confirm('Tem certeza que deseja limpar TODAS as notas da memória?')) return;

      localStorage.removeItem('notasProjeto');
      carregarNotas();
      mostrarToast('🗑️ Memória limpa!');
    }

    // =====================
    // EXPORTAR JSON
    // =====================
    function exportarJSON() {
      const dados = {
        arquivo: arquivoAtual,
        data: new Date().toISOString(),
        elementos: todosElementos
      };

      const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `analise-${arquivoAtual}.json`;
      a.click();

      mostrarToast('📥 JSON exportado!');
    }

    // =====================
    // TOAST
    // =====================
    function mostrarToast(mensagem, erro = false) {
      const toast = document.getElementById('toast');
      toast.textContent = mensagem;
      toast.className = 'toast' + (erro ? ' erro' : '');
      toast.style.display = 'block';

      setTimeout(() =&gt; {
        toast.style.display = 'none';
      }, 3000);
    }

    // =====================
    // ESCAPAR HTML
    // =====================
    function escaparHtml(texto) {
      return texto
        .replace(/&amp;/g, '&amp;amp;')
        .replace(/&lt;/g, '&amp;lt;')
        .replace(/&gt;/g, '&amp;gt;');
    }
  &lt;/script&gt;
&lt;/body&gt;

.editor-panel.hidden{display:none;}
.editor-panel.full{width:100%;}
.editor-wrap{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;}
.editor-container{flex:1;position:relative;overflow:hidden;}
.editor-textarea{width:100%;height:100%;resize:none;background:var(--bg);color:var(--text);font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:12px;line-height:1.6;padding:10px 10px 10px 44px;border:none;outline:none;tab-size:2;position:absolute;inset:0;}
.line-numbers{position:absolute;left:0;top:0;bottom:0;width:36px;background:rgba(30,41,59,.6);padding:10px 4px 10px 0;text-align:right;font-family:'Consolas',monospace;font-size:11px;line-height:1.6;color:var(--text2);opacity:.6;overflow:hidden;pointer-events:none;user-select:none;z-index:1;}

/* QUICK EDIT PANEL */
.quick-edit-bar{display:flex;gap:3px;padding:5px 8px;background:var(--bg3);border-bottom:1px solid var(--border);flex-shrink:0;align-items:center;font-size:11px;}
.quick-edit-input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:5px;font-size:11px;flex:1;outline:none;font-family:monospace;}
.quick-edit-input:focus{border-color:var(--accent);}
.quick-edit-actions{display:flex;gap:2px;}

/* PREVIEW */
.preview-panel{display:flex;flex-direction:column;flex:1;min-width:0;border-right:1px solid var(--border);transition:all .3s;}
.preview-panel.minimized{flex:0 0 60px;}
.preview-panel.minimized .preview-frame{display:none;}
.preview-panel.minimized .preview-header{cursor:pointer;}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.preview-frame{flex:1;border:none;background:#fff;}
.preview-header{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;justify-content:space-between;}
.preview-header-left{display:flex;align-items:center;gap:6px;}
.preview-header-right{display:flex;gap:3px;}

/* CHAT IA */
.chat-panel{display:flex;flex-direction:column;width:300px;flex-shrink:0;}
.chat-panel.hidden{display:none;}
.chat-panel.wide{width:420px;}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;}
.chat-header-left{display:flex;align-items:center;gap:6px;}
.chat-messages{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px;}
.msg{padding:8px 10px;border-radius:8px;font-size:11.5px;line-height:1.5;word-break:break-word;}
.msg-user{background:#1e3a8a;color:#fff;align-self:flex-end;max-width:92%;}
.msg-ai{background:#111827;border:1px solid var(--bg3);color:var(--text);align-self:flex-start;max-width:98%;white-space:pre-wrap;}
.msg-sys{background:var(--bg2);border:1px solid var(--border);color:#4b5563;font-size:10px;align-self:center;text-align:center;padding:4px 8px;border-radius:5px;}
.apply-btn{display:block;width:100%;margin-top:7px;padding:6px;background:#15803d;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:11px;font-weight:700;}
.apply-btn:hover{background:#16a34a;}
.chat-bottom{padding:7px;background:var(--bg2);border-top:1px solid var(--border);display:flex;gap:5px;flex-shrink:0;}
#chatInput{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:6px 8px;color:var(--text);font-size:11px;outline:none;resize:none;font-family:inherit;}
#chatInput:focus{border-color:#2563eb;}
#chatSend{background:#1d4ed8;color:#fff;border:none;border-radius:7px;padding:6px 10px;cursor:pointer;font-size:15px;}
#chatSend:hover{background:#2563eb;}
#chatSend:disabled{background:var(--bg3);cursor:not-allowed;}

/* MODAIS */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
.overlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;width:90%;max-width:460px;max-height:82vh;overflow-y:auto;}
.modal h3{font-size:15px;margin-bottom:12px;color:var(--accent);}
.minput{width:100%;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;margin-bottom:10px;outline:none;font-family:inherit;}
.minput:focus{border-color:var(--accent);}

/* SALVOS */
.sitem{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:5px;cursor:pointer;transition:all .15s;}
.sitem:hover{border-color:var(--accent);background:var(--bg3);}
.sitem-name{font-size:12px;font-weight:600;}
.sitem-meta{font-size:10px;color:var(--text2);}
.sitem-actions{display:flex;gap:2px;flex-shrink:0;}

/* FULLSCREEN EDITOR */
#fsModal{display:none;position:fixed;inset:0;background:var(--bg);z-index:999;flex-direction:column;}
#fsModal.open{display:flex;}
#fsBar{background:var(--bg2);padding:7px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
#fsEditor{flex:1;width:100%;background:var(--bg);color:var(--text);border:none;outline:none;padding:18px;font-family:'Cascadia Code','Consolas',monospace;font-size:14px;line-height:1.7;resize:none;}

/* LOADING */
.dots{display:flex;gap:4px;padding:8px 10px;}
.dot{width:7px;height:7px;background:#7c3aed;border-radius:50%;animation:blink .8s infinite;}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* TOAST */
.toast{position:fixed;bottom:16px;right:16px;background:var(--bg2);border:1px solid var(--accent);border-radius:9px;padding:10px 16px;font-size:12px;font-weight:600;color:var(--accent2);z-index:2000;transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}

/* STATUS */
#saveStatus{font-size:10px;color:#4ade80;}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}

@media(max-width:768px){
  .main{flex-direction:column;}
  .editor-panel{width:100%!important;height:40%;border-right:none;border-bottom:1px solid var(--border);}
  .preview-panel{height:35%;}
  .chat-panel{width:100%;height:25%;}
}

    &lt;button class=&quot;btn&quot; style=&quot;background:#dc2626;color:#fff;&quot; onclick=&quot;closeFsEditor()&quot;&gt;✕ Fechar e Aplicar&lt;/button&gt;

&lt;script&gt;
// ═══════════════════════════════════════
// CHAVES localStorage
// ═══════════════════════════════════════
const K_SNIPPETS  = 'pg_snippets_v4';
const K_AUTOSAVE  = 'pg_autosave_v4';
const K_CURRID    = 'pg_current_id_v4';
const K_APIKEY    = 'pg_apikey_v4';
const K_PROVIDER  = 'pg_provider_v4';
const K_SYSPROMPT = 'pg_sysprompt_v4';

const DEFAULT_SYSTEM = `Você é uma IA integrada a um editor de código. O usuário é Saulo, advogado de Manhumirim-MG.
REGRAS:
1. NUNCA peça desculpas ou use frases de empatia.
2. Vá direto ao ponto.
3. Ao alterar código: devolva o arquivo COMPLETO atualizado entre triple backticks.
4. Diga em uma linha o que mudou, depois o código.
5. Ao final: &quot;Quer mais alguma alteração?&quot;`;

// ═══════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════
let state = {
  mode: 'html',
  activeTab: 'html',
  currentId: null,
  title: 'Sem titulo',
  html: `&lt;div style=&quot;max-width:600px;margin:40px auto;padding:20px;font-family:sans-serif;&quot;&gt;
  &lt;h1 style=&quot;color:#333;&quot;&gt;Playground IA — Saulo&lt;/h1&gt;
  &lt;p style=&quot;color:#666;margin:16px 0;&quot;&gt;Importe um arquivo, cole código ou peça para a IA criar algo.&lt;/p&gt;
  &lt;button onclick=&quot;alert('Funcionou!')&quot; style=&quot;padding:10px 24px;font-size:16px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;&quot;&gt;Testar&lt;/button&gt;
&lt;/div&gt;`,
  css: '',
  js: '// JavaScript aqui\nconsole.log(&quot;Playground IA — Saulo&quot;);',
  jsx: `function App() {
  const [n, setN] = React.useState(0);
  return (
    &lt;div style={{padding:40,fontFamily:'sans-serif',textAlign:'center'}}&gt;
      &lt;h1&gt;⚛️ React Playground&lt;/h1&gt;
      &lt;p&gt;Contador: &lt;strong&gt;{n}&lt;/strong&gt;&lt;/p&gt;
      &lt;button onClick={()=&gt;setN(n+1)} style={{padding:'10px 24px',fontSize:16,background:'#3b82f6',color:'white',border:'none',borderRadius:8,cursor:'pointer'}}&gt;+1&lt;/button&gt;
    &lt;/div&gt;
  );
}`,
  python: `# Python — output aparece no preview
dados = [&quot;João Silva&quot;, &quot;Maria Souza&quot;, &quot;Pedro Lima&quot;]
print(&quot;=== CLIENTES ===&quot;)
for i, nome in enumerate(dados, 1):
    print(f&quot;{i}. {nome}&quot;)
print(f&quot;\\nTotal: {len(dados)}&quot;)`,
};

// Carrega autosave
try {
  const sv = localStorage.getItem(K_AUTOSAVE);
  if (sv) Object.assign(state, JSON.parse(sv));
} catch(e){}

state.currentId = localStorage.getItem(K_CURRID) || null;

let apiKey    = localStorage.getItem(K_APIKEY)    || '';
let provider  = localStorage.getItem(K_PROVIDER)  || 'gemini';
let sysPrompt = localStorage.getItem(K_SYSPROMPT) || DEFAULT_SYSTEM;
let autoPreview = true;
let previewTimer = null;
let previewMinimized = false;
let quickEditMode = false;
let quickEditSelection = null;

// ═══════════════════════════════════════
// DOM
// ═══════════════════════════════════════
const editor       = document.getElementById('editor');
const previewFrame = document.getElementById('previewFrame');
const lineNumbers  = document.getElementById('lineNumbers');
const titleInput   = document.getElementById('projectTitle');

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
titleInput.value = state.title;
updateTabs();
loadEditorContent();
updatePreview();

// ═══════════════════════════════════════
// EVENTOS DO EDITOR
// ═══════════════════════════════════════
editor.addEventListener('input', () =&gt; {
  saveCurrentTab();
  updateLineNumbers();
  autoSave();
  if (autoPreview) {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(updatePreview, 500);
  }
});

editor.addEventListener('scroll', () =&gt; {
  lineNumbers.scrollTop = editor.scrollTop;
});

editor.addEventListener('keydown', e =&gt; {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = editor.selectionStart, end = editor.selectionEnd;
    editor.value = editor.value.substring(0,s) + '  ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = s + 2;
    saveCurrentTab();
  }
  // Ctrl+Q para edição rápida
  if ((e.ctrlKey||e.metaKey) &amp;&amp; e.key === 'q') {
    e.preventDefault();
    startQuickEdit();
  }
});

// EDIÇÃO RÁPIDA
// ═══════════════════════════════════════
function startQuickEdit() {
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  
  if (start === end) {
    showToast('⚠️ Selecione um trecho para editar');
    return;
  }
  
  quickEditSelection = { start, end };
  quickEditMode = true;
  document.getElementById('quickEditBar').style.display = 'flex';
  document.getElementById('quickEditInput').focus();
  showToast('✏️ Modo edição rápida ativado');
}

function applyQuickEdit() {
  if (!quickEditSelection) return;
  
  const instruction = document.getElementById('quickEditInput').value.trim();
  if (!instruction) {
    showToast('⚠️ Digite uma instrução');
    return;
  }
  
  const selectedText = editor.value.substring(quickEditSelection.start, quickEditSelection.end);
  const before = editor.value.substring(0, quickEditSelection.start);
  const after = editor.value.substring(quickEditSelection.end);
  
  // Aqui você pode chamar a IA para alterar o trecho
  // Por enquanto, vou fazer uma alteração simples como exemplo
  const modified = `/* ${instruction} */\n${selectedText}`;
  
  editor.value = before + modified + after;
  saveCurrentTab();
  updateLineNumbers();
  autoSave();
  updatePreview();
  
  cancelQuickEdit();
  showToast('✅ Trecho atualizado!');
}

function cancelQuickEdit() {
  quickEditMode = false;
  quickEditSelection = null;
  document.getElementById('quickEditBar').style.display = 'none';
  document.getElementById('quickEditInput').value = '';
  editor.focus();
}

function saveProject() {
  saveCurrentTab();

  if (!id) {
    id = Date.now().toString(36)+Math.random().toString(36).slice(2,8);

    mode: state.mode,
    activeTab: state.activeTab,
    html: state.html, css: state.css, js: state.js,
    jsx: state.jsx, python: state.python,
    updatedAt: now
  };

  const idx = snippets.findIndex(s=&gt;s.id===id);
  if (idx&gt;=0) {
    item.createdAt = snippets[idx].createdAt || snippets[idx].updatedAt || now;
    snippets[idx] = item;

  } else {
    item.createdAt = now;

    showToast('💾 Projeto salvo!');

  setSnippets(snippets);
  autoSave();
}

document.getElementById('fileInput').addEventListener('change', e =&gt; {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev =&gt; {
    const content = ev.target.result;
    const ext = file.name.split('.').pop().toLowerCase();
    const name = file.name.replace(/\.[^.]+$/,'');

    if (ext==='csv') {
      // Importar CSV
      importCSV(content);
      return;
    }

    if (ext==='py') { switchMode('python'); state.python=content; }
    else if (ext==='jsx'||ext==='tsx') { switchMode('react'); state.jsx=content; }
    else if (ext==='css') { state.css=content; if(state.mode==='html') switchTab('css'); }
    else if (ext==='js') { state.js=content; if(state.mode==='html') switchTab('js'); }
    else {
      const lower=content.trim().toLowerCase();
      switchMode('html');
      state.html=content; state.css=''; state.js='';
    }

    state.title=name; titleInput.value=name;
    loadEditorContent(); updatePreview(); autoSave();
    showToast('📂 &quot;'+file.name+'&quot; importado!');
  };
  reader.readAsText(file);
  e.target.value='';
});

function importCSV(csvContent) {
  try {
    const lines = csvContent.trim().split('\n');
    if (lines.length &lt; 2) {
      showToast('⚠️ CSV inválido');
      return;
    }
    
    const snippets = getSnippets();
    let imported = 0;
    
    for (let i = 1; i &lt; lines.length; i++) {
      const line = lines[i];
      const parts = parseCSVLine(line);
      
      if (parts.length &gt;= 6) {
        const item = {
          id: parts[0],
          title: parts[1],
          html: parts[2],
          css: parts[3],
          js: parts[4],
          mode: parts[5],
          jsx: '',
          python: '',
          activeTab: 'html',
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        
        const idx = snippets.findIndex(s =&gt; s.id === item.id);
        if (idx &gt;= 0) {
          snippets[idx] = item;
        } else {
          snippets.push(item);
        }
        imported++;
      }
    }
    
    setSnippets(snippets);
    showToast(`✅ ${imported} projeto(s) importado(s)!`);
  } catch (err) {
    showToast('❌ Erro ao importar CSV: ' + err.message);
  }
}

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  
  for (let i = 0; i &lt; line.length; i++) {
    const char = line[i];
    
    if (char === '&quot;') {
      inQuotes = !inQuotes;
    } else if (char === ';' &amp;&amp; !inQuotes) {
      result.push(current);
      current = '';
    } else {
      current += char;
    }
  }
  
  result.push(current);
  return result;
}

function downloadFile() {

  if (state.mode==='python'){content=state.python;ext='py';mime='text/plain';}
