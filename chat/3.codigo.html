&lt;body&gt;

&lt;h1&gt;📂 Organizador Universal&lt;/h1&gt;
&lt;p class=&quot;subtitulo&quot;&gt;Importe arquivos CSV, JSON ou XML — visualize, filtre, copie e baixe.&lt;/p&gt;

&lt;!-- ZONA DE IMPORTAÇÃO --&gt;

  &lt;h2&gt;📥 Importar arquivo&lt;/h2&gt;

    &lt;input type=&quot;file&quot; id=&quot;inputArquivo&quot; accept=&quot;.csv,.json,.xml&quot; onchange=&quot;importarArquivo(event)&quot;&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- PAINEL DE RESULTADOS --&gt;
&lt;div class=&quot;painel&quot; id=&quot;painelResultados&quot; style=&quot;display:none;&quot;&gt;

  &lt;h2&gt;📊 Dados importados&lt;/h2&gt;

  &lt;div class=&quot;info-arquivo&quot; id=&quot;infoArquivo&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;abas no-print&quot; id=&quot;abas&quot;&gt;
    &lt;div class=&quot;aba ativa&quot; onclick=&quot;trocarAba('tabela', this)&quot;&gt;Tabela&lt;/div&gt;
    &lt;div class=&quot;aba&quot; onclick=&quot;trocarAba('bruto', this)&quot;&gt;Dados brutos&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- ABA TABELA --&gt;
  &lt;div id=&quot;abaTabela&quot;&gt;
    &lt;div class=&quot;acoes no-print&quot;&gt;
      &lt;input type=&quot;text&quot; id=&quot;filtro&quot; placeholder=&quot;🔍 Filtrar por qualquer valor...&quot; oninput=&quot;filtrarTabela()&quot;&gt;
      &lt;button class=&quot;btn-verde&quot; onclick=&quot;copiarTabela()&quot;&gt;📋 Copiar tabela&lt;/button&gt;
      &lt;button class=&quot;btn-azul&quot; onclick=&quot;baixarCSV()&quot;&gt;⬇ Baixar CSV&lt;/button&gt;
      &lt;button class=&quot;btn-roxo&quot; onclick=&quot;baixarJSON()&quot;&gt;⬇ Baixar JSON&lt;/button&gt;
      &lt;button class=&quot;btn-laranja&quot; onclick=&quot;window.print()&quot;&gt;🖨 PDF / Imprimir&lt;/button&gt;
      &lt;button class=&quot;btn-vermelho&quot; onclick=&quot;limparTudo()&quot;&gt;🗑 Limpar&lt;/button&gt;
    &lt;/div&gt;

    &lt;div class=&quot;tabela-wrapper&quot;&gt;
      &lt;table id=&quot;tabelaDados&quot;&gt;
        &lt;thead id=&quot;cabecalho&quot;&gt;&lt;/thead&gt;
        &lt;tbody id=&quot;corpo&quot;&gt;&lt;/tbody&gt;
      &lt;/table&gt;

  &lt;!-- ABA BRUTO --&gt;
  &lt;div id=&quot;abaBruto&quot; style=&quot;display:none;&quot;&gt;
    &lt;div class=&quot;acoes no-print&quot; style=&quot;margin-bottom:10px;&quot;&gt;
      &lt;button class=&quot;btn-verde&quot; onclick=&quot;copiarBruto()&quot;&gt;📋 Copiar dados brutos&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;json-viewer&quot; id=&quot;dadosBrutos&quot;&gt;&lt;/div&gt;

&lt;script&gt;
  let dadosGlobais = [];
  let colunasGlobais = [];
  let dadosBrutosGlobais = &quot;&quot;;
  let ordenacaoAtual = { coluna: -1, asc: true };

  // ===================== DRAG &amp; DROP =====================
  const zona = document.getElementById(&quot;zonaDrop&quot;);

  zona.addEventListener(&quot;dragover&quot;, e =&gt; {
    e.preventDefault();
    zona.classList.add(&quot;ativo&quot;);
  });

  zona.addEventListener(&quot;dragleave&quot;, () =&gt; zona.classList.remove(&quot;ativo&quot;));

  zona.addEventListener(&quot;drop&quot;, e =&gt; {
    e.preventDefault();
    zona.classList.remove(&quot;ativo&quot;);
    const arquivo = e.dataTransfer.files[0];
    if (arquivo) processarArquivo(arquivo);
  });

  // ===================== IMPORTAR =====================
  function importarArquivo(event) {
    const arquivo = event.target.files[0];
    if (arquivo) processarArquivo(arquivo);
  }

  function processarArquivo(arquivo) {
    const nome = arquivo.name.toLowerCase();
    const leitor = new FileReader();

    leitor.onload = function(e) {
      const conteudo = e.target.result;
      dadosBrutosGlobais = conteudo;
      document.getElementById(&quot;dadosBrutos&quot;).textContent = conteudo;

      try {
        if (nome.endsWith(&quot;.csv&quot;)) {
          processarCSV(conteudo);
        } else if (nome.endsWith(&quot;.json&quot;)) {
          processarJSON(conteudo);
        } else if (nome.endsWith(&quot;.xml&quot;)) {
          processarXML(conteudo);
        } else {
          alert(&quot;Formato não reconhecido. Use CSV, JSON ou XML.&quot;);
          return;
        }

        document.getElementById(&quot;infoArquivo&quot;).innerHTML =
          `&lt;strong&gt;Arquivo:&lt;/strong&gt; ${arquivo.name} &amp;nbsp;|&amp;nbsp; 
           &lt;strong&gt;Tamanho:&lt;/strong&gt; ${(arquivo.size / 1024).toFixed(1)} KB &amp;nbsp;|&amp;nbsp;
           &lt;strong&gt;Registros:&lt;/strong&gt; ${dadosGlobais.length}`;

        document.getElementById(&quot;painelResultados&quot;).style.display = &quot;block&quot;;
        document.getElementById(&quot;painelResultados&quot;).scrollIntoView({ behavior: &quot;smooth&quot; });

      } catch (erro) {
        alert(&quot;Erro ao processar o arquivo:\n&quot; + erro.message);
      }
    };

    leitor.readAsText(arquivo, &quot;UTF-8&quot;);
  }

  // ===================== CSV =====================
  function processarCSV(texto) {
    const linhas = texto.trim().split(/\r?\n/);
    if (linhas.length &lt; 2) throw new Error(&quot;CSV vazio ou sem dados.&quot;);

    const separador = detectarSeparador(linhas[0]);
    colunasGlobais = parseLinha(linhas[0], separador);
    dadosGlobais = [];

    for (let i = 1; i &lt; linhas.length; i++) {
      if (!linhas[i].trim()) continue;
      const valores = parseLinha(linhas[i], separador);
      const obj = {};
      colunasGlobais.forEach((col, idx) =&gt; {
        obj[col] = valores[idx] !== undefined ? valores[idx] : &quot;&quot;;
      });
      dadosGlobais.push(obj);
    }

    renderizarTabela(dadosGlobais);
  }

  function detectarSeparador(linha) {
    const contadores = {
      &quot;,&quot;: (linha.match(/,/g) || []).length,
      &quot;;&quot;: (linha.match(/;/g) || []).length,
      &quot;\t&quot;: (linha.match(/\t/g) || []).length,
      &quot;|&quot;: (linha.match(/\|/g) || []).length
    };
    return Object.keys(contadores).reduce((a, b) =&gt; contadores[a] &gt; contadores[b] ? a : b);
  }

  function parseLinha(linha, sep) {
    const resultado = [];
    let atual = &quot;&quot;;
    let dentroAspas = false;

    for (let i = 0; i &lt; linha.length; i++) {
      const c = linha[i];
      if (c === '&quot;') {
        dentroAspas = !dentroAspas;
      } else if (c === sep &amp;&amp; !dentroAspas) {
        resultado.push(atual.trim());
        atual = &quot;&quot;;
      } else {
        atual += c;
      }
    }

    resultado.push(atual.trim());
    return resultado;
  }

  // ===================== JSON =====================
  function processarJSON(texto) {
    let dados = JSON.parse(texto);

    if (!Array.isArray(dados)) {
      const chaves = Object.keys(dados);
      for (const chave of chaves) {
        if (Array.isArray(dados[chave])) {
          dados = dados[chave];
          break;
        }
      }
    }

    if (!Array.isArray(dados) || dados.length === 0) {
      throw new Error(&quot;JSON não contém um array de dados reconhecível.&quot;);
    }

    colunasGlobais = [...new Set(dados.flatMap(obj =&gt; Object.keys(obj)))];
    dadosGlobais = dados.map(obj =&gt; {
      const linha = {};
      colunasGlobais.forEach(col =&gt; {
        const val = obj[col];
        linha[col] = val !== undefined &amp;&amp; val !== null
          ? (typeof val === &quot;object&quot; ? JSON.stringify(val) : String(val))
          : &quot;&quot;;
      });
      return linha;
    });

    renderizarTabela(dadosGlobais);
  }

  // ===================== XML =====================
  function processarXML(texto) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(texto, &quot;application/xml&quot;);

    const erroParser = doc.querySelector(&quot;parsererror&quot;);
    if (erroParser) throw new Error(&quot;XML inválido.&quot;);

    const raiz = doc.documentElement;
    const filhos = Array.from(raiz.children);

    if (filhos.length === 0) throw new Error(&quot;XML sem registros filhos.&quot;);

    colunasGlobais = [];
    dadosGlobais = [];

    filhos.forEach(filho =&gt; {
      const obj = {};

      // Atributos
      Array.from(filho.attributes).forEach(attr =&gt; {
        obj[attr.name] = attr.value;
        if (!colunasGlobais.includes(attr.name)) colunasGlobais.push(attr.name);
      });

      // Elementos filhos
      Array.from(filho.children).forEach(el =&gt; {
        obj[el.tagName] = el.textContent.trim();
        if (!colunasGlobais.includes(el.tagName)) colunasGlobais.push(el.tagName);
      });

      // Se não tem filhos, usa o texto do próprio elemento
      if (filho.children.length === 0) {
        obj[&quot;valor&quot;] = filho.textContent.trim();
        if (!colunasGlobais.includes(&quot;valor&quot;)) colunasGlobais.push(&quot;valor&quot;);
      }

      dadosGlobais.push(obj);
    });

    renderizarTabela(dadosGlobais);
  }

  // ===================== TABELA =====================
  function renderizarTabela(dados) {
    const cabecalho = document.getElementById(&quot;cabecalho&quot;);
    const corpo = document.getElementById(&quot;corpo&quot;);

    cabecalho.innerHTML = &quot;&quot;;
    corpo.innerHTML = &quot;&quot;;

    if (!dados || dados.length === 0) {
      corpo.innerHTML = `&lt;tr&gt;&lt;td colspan=&quot;99&quot; class=&quot;sem-dados&quot;&gt;Nenhum dado encontrado.&lt;/td&gt;&lt;/tr&gt;`;
      return;
    }

    const tr = document.createElement(&quot;tr&quot;);
    colunasGlobais.forEach((col, idx) =&gt; {
      const th = document.createElement(&quot;th&quot;);
      th.textContent = col;
      th.title = &quot;Clique para ordenar&quot;;
      th.onclick = () =&gt; ordenarPor(idx);
      tr.appendChild(th);
    });
    cabecalho.appendChild(tr);

    dados.forEach(linha =&gt; {
      const tr = document.createElement(&quot;tr&quot;);
      colunasGlobais.forEach(col =&gt; {
        const td = document.createElement(&quot;td&quot;);
        td.textContent = linha[col] || &quot;&quot;;
        tr.appendChild(td);
      });
      corpo.appendChild(tr);
    });

    atualizarContador(dados.length);
  }

  function atualizarContador(total) {
    document.getElementById(&quot;contador&quot;).textContent =
      `Exibindo ${total} de ${dadosGlobais.length} registro(s).`;
  }

  // ===================== FILTRO =====================
  function filtrarTabela() {
    const termo = document.getElementById(&quot;filtro&quot;).value.toLowerCase();

    if (!termo) {
      renderizarTabela(dadosGlobais);
      return;
    }

    const filtrados = dadosGlobais.filter(linha =&gt;
      Object.values(linha).some(val =&gt; String(val).toLowerCase().includes(termo))
    );

    renderizarTabela(filtrados);
  }

  // ===================== ORDENAÇÃO =====================
  function ordenarPor(idx) {
    const col = colunasGlobais[idx];

    if (ordenacaoAtual.coluna === idx) {
      ordenacaoAtual.asc = !ordenacaoAtual.asc;
    } else {
      ordenacaoAtual.coluna = idx;
      ordenacaoAtual.asc = true;
    }

    const ordenados = [...dadosGlobais].sort((a, b) =&gt; {
      const va = a[col] || &quot;&quot;;
      const vb = b[col] || &quot;&quot;;
      const numA = parseFloat(va.replace(/[^\d.,-]/g, &quot;&quot;).replace(&quot;,&quot;, &quot;.&quot;));
      const numB = parseFloat(vb.replace(/[^\d.,-]/g, &quot;&quot;).replace(&quot;,&quot;, &quot;.&quot;));

      if (!isNaN(numA) &amp;&amp; !isNaN(numB)) {
        return ordenacaoAtual.asc ? numA - numB : numB - numA;
      }

      return ordenacaoAtual.asc
        ? va.localeCompare(vb, &quot;pt-BR&quot;)
        : vb.localeCompare(va, &quot;pt-BR&quot;);
    });

    renderizarTabela(ordenados);
  }

  // ===================== COPIAR =====================
  function copiarTabela() {
    const linhas = [colunasGlobais.join(&quot;\t&quot;)];

    dadosGlobais.forEach(linha =&gt; {
      linhas.push(colunasGlobais.map(col =&gt; linha[col] || &quot;&quot;).join(&quot;\t&quot;));
    });

    navigator.clipboard.writeText(linhas.join(&quot;\n&quot;))
      .then(() =&gt; alert(&quot;Tabela copiada! Você pode colar direto no Excel ou Word.&quot;))
      .catch(() =&gt; alert(&quot;Não foi possível copiar automaticamente.&quot;));
  }

  function copiarBruto() {
    navigator.clipboard.writeText(dadosBrutosGlobais)
      .then(() =&gt; alert(&quot;Dados brutos copiados!&quot;))
      .catch(() =&gt; alert(&quot;Não foi possível copiar automaticamente.&quot;));
  }

  // ===================== BAIXAR =====================
  function baixarCSV() {
    const linhas = [colunasGlobais.join(&quot;;&quot;)];

    dadosGlobais.forEach(linha =&gt; {
      linhas.push(colunasGlobais.map(col =&gt; `&quot;${(linha[col] || &quot;&quot;).replace(/&quot;/g, '&quot;&quot;')}&quot;`).join(&quot;;&quot;));
    });

    baixarArquivo(linhas.join(&quot;\n&quot;), &quot;dados_exportados.csv&quot;, &quot;text/csv;charset=utf-8;&quot;);
  }

  function baixarJSON() {
    const json = JSON.stringify(dadosGlobais, null, 2);
    baixarArquivo(json, &quot;dados_exportados.json&quot;, &quot;application/json&quot;);
  }

  function baixarArquivo(conteudo, nome, tipo) {
    const blob = new Blob([&quot;\ufeff&quot;, conteudo], { type: tipo });
    const link = document.createElement(&quot;a&quot;);
    link.href = URL.createObjectURL(blob);
    link.download = nome;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  // ===================== ABAS =====================
  function trocarAba(qual, el) {
    document.getElementById(&quot;abaTabela&quot;).style.display = qual === &quot;tabela&quot; ? &quot;block&quot; : &quot;none&quot;;

&lt;h1&gt;📂 Organizador de Arquivos — Maikon&lt;/h1&gt;
&lt;p class=&quot;subtitulo&quot;&gt;Suporta CSV · JSON · XML · XLS · XLSX · XLSM — Visualize, renomeie, copie, baixe em HTML ou CSV.&lt;/p&gt;

&lt;!-- IMPORTAR --&gt;
&lt;div class=&quot;painel no-print&quot;&gt;
  &lt;h2&gt;📥 Importar arquivos&lt;/h2&gt;
  &lt;div class=&quot;zona-drop&quot; id=&quot;zonaDrop&quot;
       onclick=&quot;document.getElementById('inputArquivo').click()&quot;&gt;
    &lt;div&gt;Clique aqui ou arraste os arquivos&lt;/div&gt;
    &lt;div style=&quot;font-size:12px;margin-top:6px;color:#888;&quot;&gt;Formatos aceitos:&lt;/div&gt;
    &lt;div class=&quot;badges&quot;&gt;
      &lt;span class=&quot;badge badge-azul&quot;&gt;CSV&lt;/span&gt;
      &lt;span class=&quot;badge badge-verde&quot;&gt;JSON&lt;/span&gt;
      &lt;span class=&quot;badge badge-roxo&quot;&gt;XML&lt;/span&gt;
      &lt;span class=&quot;badge badge-laranja&quot;&gt;XLS / XLSX / XLSM&lt;/span&gt;
    &lt;/div&gt;
    &lt;input type=&quot;file&quot; id=&quot;inputArquivo&quot; multiple
           accept=&quot;.csv,.json,.xml,.xls,.xlsx,.xlsm&quot;
           onchange=&quot;importarArquivos(event)&quot;&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;!-- LISTA DE ARQUIVOS --&gt;
&lt;div class=&quot;painel&quot; id=&quot;painelLista&quot; style=&quot;display:none;&quot;&gt;
  &lt;h2&gt;📋 Arquivos importados&lt;/h2&gt;
  &lt;div class=&quot;lista-arquivos&quot; id=&quot;listaArquivos&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;!-- VISUALIZADOR --&gt;
&lt;div class=&quot;painel&quot; id=&quot;painelVisualizador&quot; style=&quot;display:none;&quot;&gt;
  &lt;h2 id=&quot;tituloVisualizador&quot;&gt;Visualizando: —&lt;/h2&gt;

  &lt;div class=&quot;visualizador&quot;&gt;
    &lt;div class=&quot;abas&quot; id=&quot;abasVisualizador&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;conteudo-aba&quot; id=&quot;conteudoAba&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

&lt;script&gt;
  // ===================== ESTADO GLOBAL =====================
  const arquivos = []; // { id, nome, tipo, tamanho, dados, colunas, bruto, planilhas }
  let arquivoAtivo = null;
  let abaAtiva = &quot;tabela&quot;;
  let planilhaAtiva = 0;
  let ordenacao = { col: -1, asc: true };

  // ===================== DRAG &amp; DROP =====================
  const zona = document.getElementById(&quot;zonaDrop&quot;);
  zona.addEventListener(&quot;dragover&quot;, e =&gt; { e.preventDefault(); zona.classList.add(&quot;ativo&quot;); });
  zona.addEventListener(&quot;dragleave&quot;, () =&gt; zona.classList.remove(&quot;ativo&quot;));
  zona.addEventListener(&quot;drop&quot;, e =&gt; {
    e.preventDefault();
    zona.classList.remove(&quot;ativo&quot;);
    processarLista(e.dataTransfer.files);
  });

  // ===================== IMPORTAR =====================
  function importarArquivos(event) {
    processarLista(event.target.files);
  }

  function processarLista(lista) {
    Array.from(lista).forEach(arquivo =&gt; {
      const leitor = new FileReader();
      const nome = arquivo.name;
      const ext = nome.split(&quot;.&quot;).pop().toLowerCase();

      if ([&quot;xls&quot;, &quot;xlsx&quot;, &quot;xlsm&quot;].includes(ext)) {
        const leitorBin = new FileReader();
        leitorBin.onload = e =&gt; processarExcel(arquivo, e.target.result);
        leitorBin.readAsArrayBuffer(arquivo);
      } else {
        leitor.onload = e =&gt; processarTexto(arquivo, e.target.result, ext);
        leitor.readAsText(arquivo, &quot;UTF-8&quot;);
      }
    });
  }

  // ===================== PROCESSAR TEXTO =====================
  function processarTexto(arquivo, conteudo, ext) {
    const id = Date.now() + Math.random();
    let dados = [], colunas = [], planilhas = null;

    try {
      if (ext === &quot;csv&quot;) {
        const r = parseCSV(conteudo);
        dados = r.dados; colunas = r.colunas;
      } else if (ext === &quot;json&quot;) {
        const r = parseJSON(conteudo);
        dados = r.dados; colunas = r.colunas;
      } else if (ext === &quot;xml&quot;) {
        const r = parseXML(conteudo);
        dados = r.dados; colunas = r.colunas;
      }
    } catch(e) {
      alert(&quot;Erro ao processar &quot; + arquivo.name + &quot;:\n&quot; + e.message);
      return;
    }

    arquivos.push({
      id, nome: arquivo.name, tipo: ext.toUpperCase(),
      tamanho: arquivo.size, dados, colunas,
      bruto: conteudo, planilhas
    });

    renderizarLista();
    abrirArquivo(id);
  }

  // ===================== PROCESSAR EXCEL =====================
  function processarExcel(arquivo, buffer) {
    const id = Date.now() + Math.random();
    const workbook = XLSX.read(buffer, { type: &quot;array&quot; });
    const planilhas = workbook.SheetNames.map(nome =&gt; {
      const ws = workbook.Sheets[nome];
      const json = XLSX.utils.sheet_to_json(ws, { defval: &quot;&quot; });
      const colunas = json.length &gt; 0 ? Object.keys(json[0]) : [];
      return { nome, dados: json, colunas };
    });

    const ext = arquivo.name.split(&quot;.&quot;).pop().toUpperCase();
    arquivos.push({
      id, nome: arquivo.name, tipo: ext,
      tamanho: arquivo.size,
      dados: planilhas[0]?.dados || [],
      colunas: planilhas[0]?.colunas || [],
      bruto: `Arquivo Excel com ${planilhas.length} planilha(s): ${planilhas.map(p=&gt;p.nome).join(&quot;, &quot;)}`,
      planilhas
    });

    renderizarLista();
    abrirArquivo(id);
  }

  // ===================== PARSERS =====================
  function parseCSV(texto) {
    const linhas = texto.trim().split(/\r?\n/);
    if (linhas.length &lt; 1) throw new Error(&quot;CSV vazio.&quot;);
    const sep = detectarSep(linhas[0]);
    const colunas = parseLinha(linhas[0], sep);
    const dados = [];
    for (let i = 1; i &lt; linhas.length; i++) {
      if (!linhas[i].trim()) continue;
      const vals = parseLinha(linhas[i], sep);
      const obj = {};
      colunas.forEach((c, idx) =&gt; obj[c] = vals[idx] ?? &quot;&quot;);
      dados.push(obj);
    }
    return { dados, colunas };
  }

  function detectarSep(linha) {
    const seps = [&quot;,&quot;, &quot;;&quot;, &quot;\t&quot;, &quot;|&quot;];
    return seps.reduce((a, b) =&gt;
      (linha.match(new RegExp(&quot;\\&quot; + a, &quot;g&quot;)) || []).length &gt;=
      (linha.match(new RegExp(&quot;\\&quot; + b, &quot;g&quot;)) || []).length ? a : b
    );
  }

  function parseLinha(linha, sep) {
    const res = []; let atual = &quot;&quot;; let aspas = false;
    for (const c of linha) {
      if (c === '&quot;') { aspas = !aspas; }
      else if (c === sep &amp;&amp; !aspas) { res.push(atual.trim()); atual = &quot;&quot;; }
      else atual += c;
    }
    res.push(atual.trim());
    return res;
  }

  function parseJSON(texto) {
    let dados = JSON.parse(texto);
    if (!Array.isArray(dados)) {
      const chave = Object.keys(dados).find(k =&gt; Array.isArray(dados[k]));
      if (chave) dados = dados[chave];
      else dados = [dados];
    }
    const colunas = [...new Set(dados.flatMap(o =&gt; Object.keys(o)))];
    const norm = dados.map(o =&gt; {
      const l = {};
      colunas.forEach(c =&gt; {
        const v = o[c];
        l[c] = v != null ? (typeof v === &quot;object&quot; ? JSON.stringify(v) : String(v)) : &quot;&quot;;
      });
      return l;
    });
    return { dados: norm, colunas };
  }

  function parseXML(texto) {
    const doc = new DOMParser().parseFromString(texto, &quot;application/xml&quot;);
    if (doc.querySelector(&quot;parsererror&quot;)) throw new Error(&quot;XML inválido.&quot;);
    const raiz = doc.documentElement;
    const filhos = Array.from(raiz.children);
    const colunas = [];
    const dados = filhos.map(filho =&gt; {
      const obj = {};
      Array.from(filho.attributes).forEach(a =&gt; {
        obj[a.name] = a.value;
        if (!colunas.includes(a.name)) colunas.push(a.name);
      });
      Array.from(filho.children).forEach(el =&gt; {
        obj[el.tagName] = el.textContent.trim();
        if (!colunas.includes(el.tagName)) colunas.push(el.tagName);
      });
      if (filho.children.length === 0) {
        obj[&quot;valor&quot;] = filho.textContent.trim();
        if (!colunas.includes(&quot;valor&quot;)) colunas.push(&quot;valor&quot;);
      }
      return obj;
    });
    return { dados, colunas };
  }

  // ===================== LISTA DE ARQUIVOS =====================
  function renderizarLista() {
    document.getElementById(&quot;painelLista&quot;).style.display = &quot;block&quot;;
    const lista = document.getElementById(&quot;listaArquivos&quot;);
    lista.innerHTML = &quot;&quot;;

    arquivos.forEach(arq =&gt; {
      const card = document.createElement(&quot;div&quot;);
      card.className = &quot;card-arquivo&quot; + (arquivoAtivo?.id === arq.id ? &quot; ativo&quot; : &quot;&quot;);
      card.id = &quot;card-&quot; + arq.id;

      const icone = iconesTipo(arq.tipo);
      const kb = (arq.tamanho / 1024).toFixed(1);
      const registros = arq.planilhas
        ? arq.planilhas.reduce((s, p) =&gt; s + p.dados.length, 0)
        : arq.dados.length;

      card.innerHTML = `
        &lt;div class=&quot;icone-tipo&quot;&gt;${icone}&lt;/div&gt;
        &lt;div class=&quot;info-card&quot;&gt;
          &lt;div class=&quot;nome-arquivo&quot;&gt;${arq.nome}&lt;/div&gt;
          &lt;div class=&quot;meta&quot;&gt;${arq.tipo} · ${kb} KB · ${registros} registro(s)&lt;/div&gt;
        &lt;/div&gt;
        &lt;input class=&quot;nome-edit&quot; id=&quot;nomeEdit-${arq.id}&quot; value=&quot;${arq.nome}&quot; 
               title=&quot;Renomear arquivo&quot; placeholder=&quot;Novo nome...&quot;&gt;
        &lt;div class=&quot;acoes-card&quot;&gt;
          &lt;button class=&quot;btn-azul&quot; onclick=&quot;abrirArquivo('${arq.id}')&quot;&gt;👁 Ver&lt;/button&gt;
          &lt;button class=&quot;btn-verde&quot; onclick=&quot;renomear('${arq.id}')&quot;&gt;✏️ Renomear&lt;/button&gt;
          &lt;button class=&quot;btn-escuro&quot; onclick=&quot;baixarHTML('${arq.id}')&quot;&gt;⬇ HTML&lt;/button&gt;
          &lt;button class=&quot;btn-roxo&quot; onclick=&quot;baixarCSVArquivo('${arq.id}')&quot;&gt;⬇ CSV&lt;/button&gt;
          &lt;button class=&quot;btn-laranja&quot; onclick=&quot;baixarJSONArquivo('${arq.id}')&quot;&gt;⬇ JSON&lt;/button&gt;
          &lt;button class=&quot;btn-vermelho&quot; onclick=&quot;removerArquivo('${arq.id}')&quot;&gt;🗑&lt;/button&gt;
        &lt;/div&gt;
      `;

      lista.appendChild(card);
    });
  }

  function iconesTipo(tipo) {
    const mapa = {
      CSV: &quot;📊&quot;, JSON: &quot;📋&quot;, XML: &quot;📄&quot;,
      XLS: &quot;📗&quot;, XLSX: &quot;📗&quot;, XLSM: &quot;📗&quot;
    };
    return mapa[tipo] || &quot;📁&quot;;
  }

  // ===================== ABRIR ARQUIVO =====================
  function abrirArquivo(id) {
    arquivoAtivo = arquivos.find(a =&gt; String(a.id) === String(id));
    if (!arquivoAtivo) return;

    planilhaAtiva = 0;
    ordenacao = { col: -1, asc: true };

    renderizarLista();
    renderizarVisualizador();

    document.getElementById(&quot;painelVisualizador&quot;).style.display = &quot;block&quot;;
    document.getElementById(&quot;painelVisualizador&quot;).scrollIntoView({ behavior: &quot;smooth&quot; });
  }

  // ===================== VISUALIZADOR =====================
  function renderizarVisualizador() {
    if (!arquivoAtivo) return;

    document.getElementById(&quot;tituloVisualizador&quot;).textContent =
      &quot;Visualizando: &quot; + arquivoAtivo.nome;

    const abasEl = document.getElementById(&quot;abasVisualizador&quot;);
    abasEl.innerHTML = &quot;&quot;;

    const abas = [&quot;tabela&quot;, &quot;bruto&quot;];
    const labels = { tabela: &quot;📊 Tabela&quot;, bruto: &quot;🔤 Dados brutos&quot; };

    abas.forEach(a =&gt; {
      const el = document.createElement(&quot;div&quot;);
      el.className = &quot;aba&quot; + (abaAtiva === a ? &quot; ativa&quot; : &quot;&quot;);
      el.textContent = labels[a];
      el.onclick = () =&gt; { abaAtiva = a; renderizarVisualizador(); };
      abasEl.appendChild(el);
    });

    const conteudo = document.getElementById(&quot;conteudoAba&quot;);
    conteudo.innerHTML = &quot;&quot;;

    if (abaAtiva === &quot;tabela&quot;) renderizarAbaTabela(conteudo);
    else renderizarAbaBruto(conteudo);
  }

  function renderizarAbaTabela(conteudo) {
    const arq = arquivoAtivo;
    let dados = arq.dados;
    let colunas = arq.colunas;

    // Seletor de planilha para Excel
    if (arq.planilhas &amp;&amp; arq.planilhas.length &gt; 1) {
      const sel = document.createElement(&quot;div&quot;);
      sel.style.marginBottom = &quot;12px&quot;;
      sel.innerHTML = `&lt;label style=&quot;font-weight:bold;font-size:13px;margin-right:8px;&quot;&gt;Planilha:&lt;/label&gt;`;
      const select = document.createElement(&quot;select&quot;);
      arq.planilhas.forEach((p, i) =&gt; {
        const opt = document.createElement(&quot;option&quot;);
        opt.value = i;
        opt.textContent = p.nome;
        if (i === planilhaAtiva) opt.selected = true;
        select.appendChild(opt);
      });
      select.onchange = e =&gt; {
        planilhaAtiva = parseInt(e.target.value);
        dados = arq.planilhas[planilhaAtiva].dados;
        colunas = arq.planilhas[planilhaAtiva].colunas;
        renderizarVisualizador();
      };
      sel.appendChild(select);
      conteudo.appendChild(sel);

      dados = arq.planilhas[planilhaAtiva].dados;
      colunas = arq.planilhas[planilhaAtiva].colunas;
    }

    // Barra de ações
    const barra = document.createElement(&quot;div&quot;);
    barra.className = &quot;barra-filtro no-print&quot;;
    barra.innerHTML = `
      &lt;input type=&quot;text&quot; id=&quot;filtroTabela&quot; placeholder=&quot;🔍 Filtrar...&quot; oninput=&quot;filtrar()&quot;&gt;
      &lt;button class=&quot;btn-verde&quot; onclick=&quot;copiarTabela()&quot;&gt;📋 Copiar&lt;/button&gt;
      &lt;button class=&quot;btn-laranja&quot; onclick=&quot;window.print()&quot;&gt;🖨 PDF&lt;/button&gt;
    `;
    conteudo.appendChild(barra);

    // Tabela
    const wrapper = document.createElement(&quot;div&quot;);
    wrapper.className = &quot;tabela-wrapper&quot;;
    wrapper.id = &quot;tabelaWrapper&quot;;
    conteudo.appendChild(wrapper);

    const contador = document.createElement(&quot;div&quot;);
    contador.className = &quot;contador&quot;;
    contador.id = &quot;contadorTabela&quot;;
    conteudo.appendChild(contador);

    renderizarTabela(dados, colunas, wrapper, contador);
  }

  function renderizarTabela(dados, colunas, wrapper, contador) {
    wrapper.innerHTML = &quot;&quot;;

    if (!dados || dados.length === 0) {
      wrapper.innerHTML = `&lt;div class=&quot;sem-dados&quot;&gt;Nenhum dado encontrado.&lt;/div&gt;`;
      return;
    }

    const table = document.createElement(&quot;table&quot;);
    const thead = document.createElement(&quot;thead&quot;);
    const tbody = document.createElement(&quot;tbody&quot;);

    const trHead = document.createElement(&quot;tr&quot;);
    colunas.forEach((col, idx) =&gt; {
      const th = document.createElement(&quot;th&quot;);
      th.textContent = col;
      th.title = &quot;Clique para ordenar&quot;;
      th.onclick = () =&gt; {
        if (ordenacao.col === idx) ordenacao.asc = !ordenacao.asc;
        else { ordenacao.col = idx; ordenacao.asc = true; }

        const ordenados = [...dados].sort((a, b) =&gt; {
          const va = String(a[col] || &quot;&quot;);
          const vb = String(b[col] || &quot;&quot;);
          const na = parseFloat(va.replace(/[^\d.,-]/g, &quot;&quot;).replace(&quot;,&quot;, &quot;.&quot;));
          const nb = parseFloat(vb.replace(/[^\d.,-]/g, &quot;&quot;).replace(&quot;,&quot;, &quot;.&quot;));
          if (!isNaN(na) &amp;&amp; !isNaN(nb))
            return ordenacao.asc ? na - nb : nb - na;
          return ordenacao.asc
            ? va.localeCompare(vb, &quot;pt-BR&quot;)
            : vb.localeCompare(va, &quot;pt-BR&quot;);
        });

        renderizarTabela(ordenados, colunas, wrapper, contador);
      };
      trHead.appendChild(th);
    });
    thead.appendChild(trHead);

    dados.forEach(linha =&gt; {
      const tr = document.createElement(&quot;tr&quot;);
      colunas.forEach(col =&gt; {
        const td = document.createElement(&quot;td&quot;);
        td.textContent = linha[col] ?? &quot;&quot;;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    table.appendChild(thead);
    table.appendChild(tbody);
    wrapper.appendChild(table);

    if (contador)
      contador.textContent = `${dados.length} registro(s) exibido(s).`;
  }

  function renderizarAbaBruto(conteudo) {
    const barra = document.createElement(&quot;div&quot;);
    barra.className = &quot;barra-filtro no-print&quot;;
    barra.innerHTML = `
      &lt;button class=&quot;btn-verde&quot; onclick=&quot;copiarBruto()&quot;&gt;📋 Copiar dados brutos&lt;/button&gt;
    `;
    conteudo.appendChild(barra);

    const viewer = document.createElement(&quot;div&quot;);
    viewer.className = &quot;json-viewer&quot;;
    viewer.textContent = arquivoAtivo.bruto;
    conteudo.appendChild(viewer);
  }

  // ===================== FILTRO =====================
  function filtrar() {
    const termo = document.getElementById(&quot;filtroTabela&quot;)?.value?.toLowerCase() || &quot;&quot;;
    const arq = arquivoAtivo;
    let dados = arq.planilhas ? arq.planilhas[planilhaAtiva].dados : arq.dados;
    const colunas = arq.planilhas ? arq.planilhas[planilhaAtiva].colunas : arq.colunas;

    const filtrados = termo
      ? dados.filter(l =&gt; Object.values(l).some(v =&gt; String(v).toLowerCase().includes(termo)))
      : dados;

    const wrapper = document.getElementById(&quot;tabelaWrapper&quot;);
    const contador = document.getElementById(&quot;contadorTabela&quot;);
    if (wrapper) renderizarTabela(filtrados, colunas, wrapper, contador);
  }

  // ===================== COPIAR =====================
  function copiarTabela() {
    const arq = arquivoAtivo;
    const dados = arq.planilhas ? arq.planilhas[planilhaAtiva].dados : arq.dados;
    const colunas = arq.planilhas ? arq.planilhas[planilhaAtiva].colunas : arq.colunas;
    const linhas = [colunas.join(&quot;\t&quot;)];
    dados.forEach(l =&gt; linhas.push(colunas.map(c =&gt; l[c] ?? &quot;&quot;).join(&quot;\t&quot;)));
    navigator.clipboard.writeText(linhas.join(&quot;\n&quot;))
      .then(() =&gt; alert(&quot;Copiado! Cole direto no Excel ou Word.&quot;))
      .catch(() =&gt; alert(&quot;Não foi possível copiar automaticamente.&quot;));
  }

  function copiarBruto() {
    navigator.clipboard.writeText(arquivoAtivo.bruto)
      .then(() =&gt; alert(&quot;Dados brutos copiados!&quot;))
      .catch(() =&gt; alert(&quot;Erro ao copiar.&quot;));
  }

  // ===================== BAIXAR HTML =====================
  function baixarHTML(id) {
    const arq = arquivos.find(a =&gt; String(a.id) === String(id));

    const dados = arq.planilhas ? arq.planilhas[0].dados : arq.dados;

    let linhasHTML = dados.map(l =&gt;
      `&lt;tr&gt;${colunas.map(c =&gt; `&lt;td&gt;${l[c] ?? &quot;&quot;}&lt;/td&gt;`).join(&quot;&quot;)}&lt;/tr&gt;`
    ).join(&quot;\n&quot;);

    const html = `&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;pt-BR&quot;&gt;

    tr:hover { background: #eff6ff; }
    .meta { color: #888; font-size: 12px; margin-bottom: 15px; }
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;${arq.nome}&lt;/h1&gt;
  &lt;div class=&quot;meta&quot;&gt;${arq.tipo} · ${dados.length} registro(s) · Exportado em ${new Date().toLocaleDateString(&quot;pt-BR&quot;)}&lt;/div&gt;
  &lt;table&gt;
    &lt;thead&gt;
      &lt;tr&gt;${colunas.map(c =&gt; `&lt;th&gt;${c}&lt;/th&gt;`).join(&quot;&quot;)}&lt;/tr&gt;
    &lt;/thead&gt;
    &lt;tbody&gt;
      ${linhasHTML}
    &lt;/tbody&gt;
  &lt;/table&gt;
&lt;/body&gt;
&lt;/html&gt;`;

    baixarBlob(html, arq.nome.replace(/\.[^.]+$/, &quot;&quot;) + &quot;.html&quot;, &quot;text/html&quot;);
  }

  // ===================== BAIXAR CSV =====================
  function baixarCSVArquivo(id) {
    const arq = arquivos.find(a =&gt; String(a.id) === String(id));
    if (!arq) return;
    const dados = arq.planilhas ? arq.planilhas[0].dados : arq.dados;
    const colunas = arq.planilhas ? arq.planilhas[0].colunas : arq.colunas;
    const linhas = [colunas.join(&quot;;&quot;)];
    dados.forEach(l =&gt; linhas.push(colunas.map(c =&gt; `&quot;${String(l[c] ?? &quot;&quot;).replace(/&quot;/g, '&quot;&quot;')}&quot;`).join(&quot;;&quot;)));
    baixarBlob(linhas.join(&quot;\n&quot;), arq.nome.replace(/\.[^.]+$/, &quot;&quot;) + &quot;.csv&quot;, &quot;text/csv&quot;);
  }

  // ===================== BAIXAR JSON =====================
  function baixarJSONArquivo(id) {
    const arq = arquivos.find(a =&gt; String(a.id) === String(id));
    if (!arq) return;
    const dados = arq.planilhas ? arq.planilhas[0].dados : arq.dados;
    baixarBlob(JSON.stringify(dados, null, 2), arq.nome.replace(/\.[^.]+$/, &quot;&quot;) + &quot;.json&quot;, &quot;application/json&quot;);
  }

  // ===================== RENOMEAR =====================
  function renomear(id) {
    const arq = arquivos.find(a =&gt; String(a.id) === String(id));
    const input = document.getElementById(&quot;nomeEdit-&quot; + id);
    if (!arq || !input) return;
    const novoNome = input.value.trim();
    if (!novoNome) { alert(&quot;Digite um nome válido.&quot;); return; }
    arq.nome = novoNome;
    renderizarLista();
    if (arquivoAtivo?.id === arq.id) {
      arquivoAtivo = arq;
      renderizarVisualizador();
    }
    alert(&quot;Renomeado para: &quot; + novoNome);
  }

  // ===================== REMOVER =====================
  function removerArquivo(id) {
    const idx = arquivos.findIndex(a =&gt; String(a.id) === String(id));
    if (idx === -1) return;
    if (!confirm(&quot;Remover &quot; + arquivos[idx].nome + &quot; da lista?&quot;)) return;
    arquivos.splice(idx, 1);
    if (arquivoAtivo?.id == id) {
      arquivoAtivo = null;
      document.getElementById(&quot;painelVisualizador&quot;).style.display = &quot;none&quot;;
    }
    if (arquivos.length === 0)
      document.getElementById(&quot;painelLista&quot;).style.display = &quot;none&quot;;
    else renderizarLista();
  }

  // ===================== UTILITÁRIO =====================
  function baixarBlob(conteudo, nome, tipo) {
    const blob = new Blob([&quot;\ufeff&quot;, conteudo], { type: tipo });
    const link = document.createElement(&quot;a&quot;);
    link.href = URL.createObjectURL(blob);
    link.download = nome;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

&lt;script&gt;
let projetos = [];
let projetoAtivo = null;
let abaAtiva = &quot;render&quot;;
let filtrados = [];

// DRAG DROP
const drop = document.getElementById(&quot;drop&quot;);
drop.addEventListener(&quot;dragover&quot;, e =&gt; { e.preventDefault(); drop.style.background = &quot;#dbeafe&quot;; });
drop.addEventListener(&quot;dragleave&quot;, () =&gt; { drop.style.background = &quot;#eff6ff&quot;; });
drop.addEventListener(&quot;drop&quot;, e =&gt; {
  e.preventDefault();
  drop.style.background = &quot;#eff6ff&quot;;
  const f = e.dataTransfer.files[0];
  if (f) processarArquivo(f);
});

function carregarCSV(e) {
  const f = e.target.files[0];
  if (f) processarArquivo(f);
}

function processarArquivo(file) {
  document.getElementById(&quot;progressArea&quot;).style.display = &quot;block&quot;;
  document.getElementById(&quot;progressTxt&quot;).textContent = &quot;Lendo arquivo...&quot;;
  document.getElementById(&quot;progressBar&quot;).style.width = &quot;10%&quot;;

  const reader = new FileReader();
  reader.onload = function(e) {
    document.getElementById(&quot;progressBar&quot;).style.width = &quot;40%&quot;;
    document.getElementById(&quot;progressTxt&quot;).textContent = &quot;Processando linhas...&quot;;

    setTimeout(() =&gt; {
      try {
        projetos = parseCSVCompleto(e.target.result);
        document.getElementById(&quot;progressBar&quot;).style.width = &quot;90%&quot;;
        document.getElementById(&quot;progressTxt&quot;).textContent = projetos.length + &quot; projetos encontrados!&quot;;

        setTimeout(() =&gt; {
          document.getElementById(&quot;progressArea&quot;).style.display = &quot;none&quot;;
          document.getElementById(&quot;painelPrincipal&quot;).style.display = &quot;block&quot;;
          filtrados = [...projetos];
          renderizarLista();
        }, 400);
      } catch(err) {
        alert(&quot;Erro ao processar CSV:\n&quot; + err.message);
        document.getElementById(&quot;progressArea&quot;).style.display = &quot;none&quot;;
      }
    }, 50);
  };
  reader.readAsText(file, &quot;UTF-8&quot;);
}

// PARSER CSV ROBUSTO — lida com campos gigantes com quebras de linha
function parseCSVCompleto(texto) {
  const resultado = [];
  let i = 0;
  const len = texto.length;

  // Detectar separador
  const primeiraLinha = texto.slice(0, 500);
  const sep = primeiraLinha.includes(&quot;\t&quot;) ? &quot;\t&quot; : &quot;,&quot;;

  // Ler cabeçalho
  const cabecalho = lerLinha(texto, 0, sep);
  const colunas = cabecalho.valores.map(c =&gt; c.trim().toLowerCase());
  i = cabecalho.proximo;

  // Mapear índices
  const iId    = colunas.findIndex(c =&gt; c === &quot;id&quot;);
  const iTitle = colunas.findIndex(c =&gt; c.includes(&quot;title&quot;) || c.includes(&quot;titulo&quot;) || c.includes(&quot;nome&quot;));
  const iHtml  = colunas.findIndex(c =&gt; c === &quot;html&quot;);
  const iCss   = colunas.findIndex(c =&gt; c === &quot;css&quot;);
  const iJs    = colunas.findIndex(c =&gt; c === &quot;js&quot; || c === &quot;javascript&quot;);
  const iMode  = colunas.findIndex(c =&gt; c === &quot;mode&quot; || c === &quot;tipo&quot; || c === &quot;type&quot;);

  let count = 0;
  while (i &lt; len) {
    const linha = lerLinha(texto, i, sep);
    if (!linha) break;
    i = linha.proximo;

    const v = linha.valores;
    if (!v || v.length &lt; 2) continue;

    const proj = {
      id:    iId    &gt;= 0 ? v[iId]    || &quot;&quot; : String(count + 1),
      title: iTitle &gt;= 0 ? v[iTitle] || &quot;&quot; : &quot;Projeto &quot; + (count + 1),
      html:  iHtml  &gt;= 0 ? v[iHtml]  || &quot;&quot; : &quot;&quot;,
      css:   iCss   &gt;= 0 ? v[iCss]   || &quot;&quot; : &quot;&quot;,
      js:    iJs    &gt;= 0 ? v[iJs]    || &quot;&quot; : &quot;&quot;,
      mode:  iMode  &gt;= 0 ? v[iMode]  || &quot;&quot; : &quot;&quot;,
    };

    if (!proj.title.trim()) proj.title = &quot;Projeto &quot; + (count + 1);

    resultado.push(proj);
    count++;
  }

  return resultado;
}

function lerLinha(texto, inicio, sep) {
  const valores = [];
  let i = inicio;
  const len = texto.length;
  let campo = &quot;&quot;;
  let dentroAspas = false;

  while (i &lt; len) {
    const c = texto[i];

    if (c === '&quot;') {
      if (dentroAspas &amp;&amp; texto[i+1] === '&quot;') {
        campo += '&quot;';
        i += 2;
        continue;
      }
      dentroAspas = !dentroAspas;
      i++;
      continue;
    }

    if (c === sep &amp;&amp; !dentroAspas) {
      valores.push(campo);
      campo = &quot;&quot;;
      i++;
      continue;
    }

    if ((c === &quot;\n&quot; || (c === &quot;\r&quot; &amp;&amp; texto[i+1] === &quot;\n&quot;)) &amp;&amp; !dentroAspas) {
      valores.push(campo);
      if (c === &quot;\r&quot;) i++;
      i++;
      return { valores, proximo: i };
    }

    campo += c;
    i++;
  }

  if (campo || valores.length) {
    valores.push(campo);
    return { valores, proximo: i };
  }

  return null;
}

// FILTRAR
function filtrar() {
  const termo = document.getElementById(&quot;busca&quot;).value.toLowerCase().trim();
  filtrados = termo
    ? projetos.filter(p =&gt; p.title.toLowerCase().includes(termo) || p.mode.toLowerCase().includes(termo))
    : [...projetos];
  renderizarLista();
}

// RENDERIZAR LISTA
function renderizarLista() {
  const lista = document.getElementById(&quot;lista&quot;);
  const contador = document.getElementById(&quot;contadorGeral&quot;);
  lista.innerHTML = &quot;&quot;;

  contador.textContent = filtrados.length + &quot; de &quot; + projetos.length + &quot; projeto(s)&quot;;

  if (!filtrados.length) {
    lista.innerHTML = '&lt;div class=&quot;vazio&quot;&gt;Nenhum projeto encontrado.&lt;/div&gt;';
    return;
  }

  filtrados.forEach(p =&gt; {
    const temHtml = p.html.trim().length &gt; 0;
    const temCss  = p.css.trim().length &gt; 0;
    const temJs   = p.js.trim().length &gt; 0;

    const tamanho = ((p.html.length + p.css.length + p.js.length) / 1024).toFixed(1);

    const card = document.createElement(&quot;div&quot;);
    card.className = &quot;card&quot; + (projetoAtivo?.id === p.id ? &quot; ativo&quot; : &quot;&quot;);
    card.innerHTML = `
      &lt;div class=&quot;card-topo&quot;&gt;
        &lt;div class=&quot;icone&quot;&gt;🌐&lt;/div&gt;
        &lt;div class=&quot;card-info&quot;&gt;
          &lt;div class=&quot;card-titulo&quot;&gt;${esc(p.title)}&lt;/div&gt;
          &lt;div class=&quot;card-meta&quot;&gt;ID: ${esc(p.id)} · ${tamanho} KB ${p.mode ? &quot;· &quot; + esc(p.mode) : &quot;&quot;}&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;tags&quot;&gt;
        ${temHtml ? '&lt;span class=&quot;tag tag-html&quot;&gt;HTML&lt;/span&gt;' : '&lt;span class=&quot;tag tag-vazio&quot;&gt;sem HTML&lt;/span&gt;'}
        ${temCss  ? '&lt;span class=&quot;tag tag-css&quot;&gt;CSS&lt;/span&gt;'   : &quot;&quot;}
        ${temJs   ? '&lt;span class=&quot;tag tag-js&quot;&gt;JS&lt;/span&gt;'     : &quot;&quot;}
      &lt;/div&gt;
      &lt;div class=&quot;mini-acoes&quot;&gt;
        &lt;button class=&quot;b-azul&quot;   onclick=&quot;abrirProjeto('${esc(p.id)}')&quot;&gt;👁 Ver&lt;/button&gt;
        &lt;button class=&quot;b-verde&quot;  onclick=&quot;baixarProjeto('${esc(p.id)}')&quot;&gt;⬇ HTML&lt;/button&gt;
        &lt;button class=&quot;b-roxo&quot;   onclick=&quot;copiarProjeto('${esc(p.id)}')&quot;&gt;📋 Copiar&lt;/button&gt;
      &lt;/div&gt;
    `;

    card.addEventListener(&quot;click&quot;, function(ev) {
      if (ev.target.tagName === &quot;BUTTON&quot;) return;
      abrirProjeto(p.id);
    });

    lista.appendChild(card);
  });
}

// ABRIR PROJETO
function abrirProjeto(id) {
  projetoAtivo = projetos.find(p =&gt; p.id === id) || filtrados.find(p =&gt; p.id === id);
  if (!projetoAtivo) return;
  abaAtiva = &quot;render&quot;;
  renderizarLista();
  renderizarPreview();
  document.getElementById(&quot;painelPrincipal&quot;).scrollIntoView({ behavior: &quot;smooth&quot; });
}

// RENDERIZAR PREVIEW
function renderizarPreview() {
  const p = projetoAtivo;
  if (!p) return;

  document.getElementById(&quot;previewTitulo&quot;).textContent = &quot;👁 &quot; + p.title;

  // Ações
  document.getElementById(&quot;previewAcoes&quot;).innerHTML = `
    &lt;button class=&quot;b-verde&quot;  onclick=&quot;baixarProjeto('${esc(p.id)}')&quot;&gt;⬇ Baixar HTML&lt;/button&gt;
    &lt;button class=&quot;b-roxo&quot;   onclick=&quot;copiarProjeto('${esc(p.id)}')&quot;&gt;📋 Copiar&lt;/button&gt;
    &lt;button class=&quot;b-laranja&quot; onclick=&quot;abrirNovaAba('${esc(p.id)}')&quot;&gt;🔗 Abrir em nova aba&lt;/button&gt;
  `;

  // Abas
  const abas = [
    { id: &quot;render&quot;, label: &quot;🌐 Render&quot; },
    { id: &quot;html&quot;,   label: &quot;HTML&quot; },
    { id: &quot;css&quot;,    label: &quot;CSS&quot; },
    { id: &quot;js&quot;,     label: &quot;JS&quot; },
    { id: &quot;tudo&quot;,   label: &quot;📄 Código completo&quot; },
  ];

  document.getElementById(&quot;abas&quot;).innerHTML = abas.map(a =&gt;
    `&lt;div class=&quot;aba ${abaAtiva === a.id ? &quot;ativa&quot; : &quot;&quot;}&quot; onclick=&quot;mudarAba('${a.id}')&quot;&gt;${a.label}&lt;/div&gt;`
  ).join(&quot;&quot;);

  // Conteúdo
  const box = document.getElementById(&quot;previewBox&quot;);

  if (abaAtiva === &quot;render&quot;) {
    const html = montarHTML(p);
    box.innerHTML = `&lt;iframe id=&quot;iframePreview&quot; srcdoc=&quot;${escAttr(html)}&quot;&gt;&lt;/iframe&gt;`;
  } else if (abaAtiva === &quot;html&quot;) {
    box.innerHTML = `&lt;pre&gt;${esc(p.html || &quot;(vazio)&quot;)}&lt;/pre&gt;`;
  } else if (abaAtiva === &quot;css&quot;) {
    box.innerHTML = `&lt;pre&gt;${esc(p.css || &quot;(vazio)&quot;)}&lt;/pre&gt;`;
  } else if (abaAtiva === &quot;js&quot;) {
    box.innerHTML = `&lt;pre&gt;${esc(p.js || &quot;(vazio)&quot;)}&lt;/pre&gt;`;
  } else if (abaAtiva === &quot;tudo&quot;) {
    box.innerHTML = `&lt;pre&gt;${esc(montarHTML(p))}&lt;/pre&gt;`;
  }
}

function mudarAba(aba) {
  abaAtiva = aba;
  renderizarPreview();
}

// MONTAR HTML COMPLETO
function montarHTML(p) {
  // Se o HTML já é um documento completo
  const htmlTrim = (p.html || &quot;&quot;).trim();

  if (htmlTrim.toLowerCase().includes(&quot;&lt;!doctype&quot;) || htmlTrim.toLowerCase().startsWith(&quot;&lt;html&quot;)) {
    // Já é documento completo — injeta CSS e JS se existirem separados
    let resultado = htmlTrim;

    if (p.css &amp;&amp; p.css.trim()) {
      resultado = resultado.replace(&quot;&lt;/head&gt;&quot;, `&lt;style&gt;\n${p.css}\n&lt;/style&gt;\n&lt;/head&gt;`);
      if (!resultado.includes(&quot;&lt;/head&gt;&quot;)) {
        resultado = `&lt;style&gt;\n${p.css}\n&lt;/style&gt;\n` + resultado;
      }
    }

    if (p.js &amp;&amp; p.js.trim()) {
      resultado = resultado.replace(&quot;&lt;/body&gt;&quot;, `&lt;script&gt;\n${p.js}\n&lt;\/script&gt;\n&lt;/body&gt;`);
      if (!resultado.includes(&quot;&lt;/body&gt;&quot;)) {
        resultado += `\n&lt;script&gt;\n${p.js}\n&lt;\/script&gt;`;
      }
    }

    return resultado;
  }

  // Monta documento do zero
  return `&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;pt-BR&quot;&gt;
&lt;head&gt;
  &lt;meta charset=&quot;UTF-8&quot;&gt;
  &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
  &lt;title&gt;${esc(p.title)}&lt;/title&gt;
  &lt;style&gt;
${p.css || &quot;&quot;}
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
${p.html || &quot;&quot;}
&lt;script&gt;
${p.js || &quot;&quot;}
&lt;\/script&gt;
&lt;/body&gt;
&lt;/html&gt;`;
}

// BAIXAR PROJETO
function baixarProjeto(id) {
  const p = projetos.find(x =&gt; x.id === id) || filtrados.find(x =&gt; x.id === id);
  if (!p) return;

  const html = montarHTML(p);
  const nome = limparNome(p.title) + &quot;.html&quot;;
  baixarBlob(html, nome, &quot;text/html;charset=utf-8&quot;);
}

// ABRIR EM NOVA ABA
function abrirNovaAba(id) {
  const p = projetos.find(x =&gt; x.id === id) || filtrados.find(x =&gt; x.id === id);
  if (!p) return;

  const html = montarHTML(p);
  const blob = new Blob([html], { type: &quot;text/html;charset=utf-8&quot; });
  const url = URL.createObjectURL(blob);
  window.open(url, &quot;_blank&quot;);
}

// COPIAR
function copiarProjeto(id) {
  const p = projetos.find(x =&gt; x.id === id) || filtrados.find(x =&gt; x.id === id);
  if (!p) return;

  navigator.clipboard.writeText(montarHTML(p))
    .then(() =&gt; alert(&quot;Código copiado! Cole no Bloco de Notas e salve como .html&quot;))
    .catch(() =&gt; alert(&quot;Não foi possível copiar automaticamente.&quot;));
}

// BAIXAR TODOS
function baixarTodos() {
  if (!filtrados.length) return;

  if (!confirm(&quot;Baixar &quot; + filtrados.length + &quot; projetos? Serão baixados um por um.&quot;)) return;

  let i = 0;
  function proximo() {
    if (i &gt;= filtrados.length) {
      alert(&quot;Todos os projetos foram baixados!&quot;);
      return;
    }
    baixarProjeto(filtrados[i].id);
    i++;
    setTimeout(proximo, 600);
  }
  proximo();
}

// LIMPAR
function limpar() {
  if (!confirm(&quot;Limpar tudo?&quot;)) return;
  projetos = [];
  filtrados = [];
  projetoAtivo = null;
  document.getElementById(&quot;painelPrincipal&quot;).style.display = &quot;none&quot;;
  document.getElementById(&quot;inp&quot;).value = &quot;&quot;;
}

// UTILITÁRIOS
function limparNome(nome) {
  return String(nome)
    .normalize(&quot;NFD&quot;).replace(/[\u0300-\u036f]/g, &quot;&quot;)
    .replace(/[^\w\s\-]/g, &quot;&quot;)
    .replace(/\s+/g, &quot;-&quot;)
    .replace(/-+/g, &quot;-&quot;)
    .replace(/^-|-$/g, &quot;&quot;)
    .toLowerCase()
    .slice(0, 80) || &quot;projeto&quot;;
}

function baixarBlob(conteudo, nome, tipo) {
  const blob = new Blob([conteudo], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement(&quot;a&quot;);
  a.href = url;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function esc(str) {
  return String(str || &quot;&quot;)
    .replace(/&amp;/g, &quot;&amp;amp;&quot;)
    .replace(/&lt;/g, &quot;&amp;lt;&quot;)
    .replace(/&gt;/g, &quot;&amp;gt;&quot;)
    .replace(/&quot;/g, &quot;&amp;quot;&quot;);
}

function escAttr(str) {
  return esc(str).replace(/\n/g, &quot;&amp;#10;&quot;).replace(/'/g, &quot;&amp;#039;&quot;);
}
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;

<script>
function trocarProjeto(index) {
  // Esconde todos
  document.querySelectorAll('.project-container').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  
  // Mostra o selecionado
  document.getElementById('projeto' + index).classList.add('active');
  document.querySelectorAll('.nav-btn')[index].classList.add('active');
  
  // Salva preferência
  localStorage.setItem('ultimo-projeto', index);
}

// Restaura último projeto aberto
window.onload = function() {
  const ultimo = localStorage.getItem('ultimo-projeto');
  if (ultimo !== null) trocarProjeto(parseInt(ultimo));
};
</script>
