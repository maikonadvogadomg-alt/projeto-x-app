<div class=&quot;container&quot;>
  <h1>🔍 Analisador Automático + Debugger Visual</h1>
  <p class=&quot;subtitle&quot;>Análise completa sem modificar nada - Gera relatório detalhado de todos os problemas</p>

  <div class=&quot;upload-area&quot; id=&quot;dropZone&quot;>
    <p style=&quot;font-size: 18px; margin-bottom: 10px;&quot;>📦 Arraste seu ZIP da Replit aqui</p>
    <p style=&quot;color: #94a3b8; font-size: 13px; margin-bottom: 15px;&quot;>Será analisado completamente e gerará relatório detalhado</p>
    <button class=&quot;btn&quot; onclick=&quot;document.getElementById('fileInput').click()&quot;>Selecionar ZIP</button>
    <input type=&quot;file&quot; id=&quot;fileInput&quot; accept=&quot;.zip&quot; />
  </div>

  <div id=&quot;loading&quot; class=&quot;loading&quot; style=&quot;display:none;&quot;>
    <div class=&quot;spinner&quot;></div>
    <p>Analisando projeto... Isso pode levar alguns segundos...</p>
  </div>

  <div id=&quot;results&quot;></div>
</div>

<script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;></script>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const resultsDiv = document.getElementById('results');
const loadingDiv = document.getElementById('loading');

let projectAnalysis = {
  files: {},
  issues: [],
  endpoints: [],
  dependencies: [],
  replitBindings: [],
  configFiles: {},
  dataFlow: [],
  warnings: []
};

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('dragover');
});
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', e => {
  handleFile(e.target.files[0]);
});

async function handleFile(file) {
  if (!file) return;
  
  loadingDiv.style.display = 'block';
  resultsDiv.innerHTML = '';
  projectAnalysis = {
    files: {},
    issues: [],
    endpoints: [],
    dependencies: [],
    replitBindings: [],
    configFiles: {},
    dataFlow: [],
    warnings: []
  };
  
  try {
    const zip = new JSZip();
    const content = await zip.loadAsync(file);
    
    // Extrai todos os arquivos
    for (let [path, zipEntry] of Object.entries(content.files)) {
      if (!zipEntry.dir) {
        try {
          const fileContent = await zipEntry.async('text');
          projectAnalysis.files[path] = {
            content: fileContent,
            size: zipEntry._data.uncompressedSize,
            ext: path.split('.').pop().toLowerCase()
          };
        } catch (e) {}
      }
    }
    
    // Executa análises
    await analyzeProject();
    
    loadingDiv.style.display = 'none';
    displayResults();
    
  } catch (err) {
    loadingDiv.style.display = 'none';
    resultsDiv.innerHTML = `<div class=&quot;card card-error&quot;>
      <div class=&quot;card-title&quot;>❌ Erro ao processar</div>
      <div class=&quot;card-content&quot;>${err.message}</div>
    </div>`;
  }
}

async function analyzeProject() {
  // Análise de configuração
  analyzeConfig();
  
  // Análise de dependências
  analyzeDependencies();
  
  // Análise de endpoints
  analyzeEndpoints();
  
  // Análise de vínculos Replit
  analyzeReplitBindings();
  
  // Análise de erros
  analyzeErrors();
  
  // Análise de fluxo de dados
  analyzeDataFlow();
  
  // Análise de segurança
  analyzeSecurity();
}

function analyzeConfig() {
  const configFiles = ['package.json', '.replit', 'replit.nix', 'vite.config.js', 'webpack.config.js', '.env', '.env.local'];
  
  for (let [path, file] of Object.entries(projectAnalysis.files)) {
    const fileName = path.split('/').pop();
    
    if (configFiles.includes(fileName)) {
      projectAnalysis.configFiles[path] = file.content;
      
      if (fileName === 'package.json') {
        try {
          const pkg = JSON.parse(file.content);
          
          // Detecta problemas no package.json
          if (!pkg.name) {
            projectAnalysis.issues.push({
              severity: 'warning',
              type: 'config',
              title: 'package.json sem nome',
              detail: 'O arquivo package.json não tem um campo &quot;name&quot;',
              file: path,
              fix: 'Adicione um nome ao projeto'
            });
          }
          
          if (!pkg.scripts || !pkg.scripts.start) {
            projectAnalysis.issues.push({
              severity: 'warning',
              type: 'config',
              title: 'Script &quot;start&quot; não definido',
              detail: 'Não há script de inicialização',
              file: path,
              fix: 'Adicione &quot;start&quot; em scripts'
            });
          }
          
          // Detecta dependências faltando
          const allDeps = { ...pkg.dependencies, ...pkg.devDependencies };
          Object.keys(allDeps).forEach(dep => {
            projectAnalysis.dependencies.push({
              name: dep,
              version: allDeps[dep],
              type: pkg.dependencies[dep] ? 'production' : 'development'
            });
          });
          
        } catch (e) {
          projectAnalysis.issues.push({
            severity: 'error',
            type: 'config',
            title: 'package.json inválido',
            detail: 'JSON malformado: ' + e.message,
            file: path,
            fix: 'Corrija a sintaxe JSON'
          });
        }
      }
      
      if (fileName === '.replit') {
        projectAnalysis.issues.push({
          severity: 'info',
          type: 'replit',
          title: 'Arquivo .replit detectado',
          detail: 'Este arquivo contém configurações específicas da Replit',
          file: path,
          note: 'Pode precisar ser ajustado em outro ambiente'
        });
      }
      
      if (fileName === 'vite.config.js') {
        projectAnalysis.issues.push({
          severity: 'info',
          type: 'build',
          title: 'Vite detectado',
          detail: 'Projeto usa Vite como bundler',
          file: path
        });
      }
    }
  }
}

function analyzeDependencies() {
  for (let [path, file] of Object.entries(projectAnalysis.files)) {
    if (path.includes('package.json')) {
      try {
        const pkg = JSON.parse(file.content);
        const allDeps = { ...pkg.dependencies, ...pkg.devDependencies };
        
        // Verifica dependências críticas
        const criticalDeps = ['express', 'react', 'vue', 'angular', 'next', 'nuxt'];
        
        criticalDeps.forEach(dep => {
          if (allDeps[dep]) {
            projectAnalysis.dependencies.push({
              name: dep,
              version: allDeps[dep],
              status: 'found'
            });
          }
        });
        
      } catch (e) {}
    }
  }
}

function analyzeEndpoints() {
  for (let [path, file] of Object.entries(projectAnalysis.files)) {
    if (file.ext === 'js' || file.ext === 'ts') {
      const content = file.content;
      
      // Detecta endpoints
      const endpointPatterns = [
        { regex: /app\.(get|post|put|delete|patch)\s*\(\s*['&quot;`]([^'&quot;`]+)['&quot;`]/g, type: 'express' },
        { regex: /router\.(get|post|put|delete|patch)\s*\(\s*['&quot;`]([^'&quot;`]+)['&quot;`]/g, type: 'express' },
        { regex: /fetch\s*\(\s*['&quot;`]([^'&quot;`]+)['&quot;`]/g, type: 'fetch' },
        { regex: /axios\.(get|post|put|delete|patch)\s*\(\s*['&quot;`]([^'&quot;`]+)['&quot;`]/g, type: 'axios' }
      ];
      
      endpointPatterns.forEach(pattern => {
        let match;
        const regex = new RegExp(pattern.regex.source, 'g');
        
        while ((match = regex.exec(content)) !== null) {
          const method = match[1] || 'GET';
          const endpoint = match[2] || match[1];
          
          projectAnalysis.endpoints.push({
            method: method.toUpperCase(),
            path: endpoint,
            file: path,
            type: pattern.type,
            line: content.substring(0, match.index).split('\n').length
          });
          
          // Detecta problemas em endpoints
          if (!endpoint.startsWith('/') &amp;&amp; !endpoint.startsWith('http')) {
            projectAnalysis.issues.push({
              severity: 'warning',
              type: 'endpoint',
              title: 'Endpoint sem caminho claro',
              detail: `Endpoint &quot;${endpoint}&quot; pode estar mal formatado`,
              file: path,
              line: content.substring(0, match.index).split('\n').length,
              fix: 'Verifique se o caminho está correto'
            });
          }
        }
      });
    }
  }
}

function analyzeReplitBindings() {
  for (let [path, file] of Object.entries(projectAnalysis.files)) {
    const content = file.content.toLowerCase();
    
    // Detecta referências a Replit
    const replitPatterns = [
      { pattern: 'process.env.replit', type: 'env_var' },
      { pattern: 'replit_db', type: 'database' },
      { pattern: 'replit_audio', type: 'audio' },
      { pattern: 'replit_code', type: 'code_execution' },
      { pattern: '.replit', type: 'config' },
      { pattern: 'replit.com', type: 'url' }
    ];
    
    replitPatterns.forEach(p => {
      if (content.includes(p.pattern)) {
        projectAnalysis.replitBindings.push({
          type: p.type,
          pattern: p.pattern,
          file: path,
          severity: 'warning'
        });
        
        projectAnalysis.issues.push({
          severity: 'warning',
          type: 'replit_binding',
          title: `Vínculo Replit detectado: ${p.type}`,
          detail: `Arquivo contém referência a &quot;${p.pattern}&quot;`,
          file: path,
          note: 'Este código pode não funcionar fora da Replit',
          fix: 'Considere abstrair em variáveis de ambiente'
        });
      }
    });
  }
}

function analyzeErrors() {
  for (let [path, file] of Object.entries(projectAnalysis.files)) {
    if (file.ext === 'js' || file.ext === 'ts' || file.ext === 'json') {
      const content = file.content;
      const lines = content.split('\n');
      
      // Detecta erros comuns
      lines.forEach((line, idx) => {
        // Chaves não fechadas
        const opens = (line.match(/[\{\[\(]/g) || []).length;
        const closes = (line.match(/[\}\]\)]/g) || []).length;
        if (opens !== closes &amp;&amp; opens > 0) {
          projectAnalysis.issues.push({
            severity: 'error',
            type: 'syntax',
            title: 'Possível erro de sintaxe',
            detail: 'Chaves/parênteses não balanceados',
            file: path,
            line: idx + 1,
            code: line.trim(),
            fix: 'Verifique se todas as chaves estão fechadas'
          });
        }
        
        // Variáveis não definidas
        if (line.includes('undefined') &amp;&amp; !line.includes('typeof')) {
          projectAnalysis.issues.push({
            severity: 'warning',
            type: 'reference',
            title: 'Possível referência indefinida',
            detail: 'Linha contém &quot;undefined&quot;',
            file: path,
            line: idx + 1,
            code: line.trim()
          });
        }
        
        // Senhas/tokens
        if (/(password|token|secret|apikey|api_key)\s*[:=]/i.test(line) &amp;&amp; !line.includes('//')) {
          projectAnalysis.issues.push({
            severity: 'critical',
            type: 'security',
            title: '🔐 CRÍTICO: Possível credencial exposta',
            detail: 'Linha contém possível senha/token',
            file: path,
            line: idx + 1,
            fix: 'Mova para variáveis de ambiente'
          });
        }
      });
    }
  }
}

function analyzeDataFlow() {
  // Rastreia fluxo de dados entre componentes
  const flows = [];
  
  for (let [path, file] of Object.entries(projectAnalysis.files)) {
    if (file.ext === 'js' || file.ext === 'ts') {
      const content = file.content;
      
      // Detecta imports/exports
      const imports = content.match(/import\s+.*from\s+['&quot;`]([^'&quot;`]+)['&quot;`]/g) || [];
      const exports = content.match(/export\s+(default\s+)?(function|const|class|interface)\s+(\w+)/g) || [];
      
      imports.forEach(imp => {
        flows.push({
          type: 'import',
          from: path,
          source: imp,
          status: 'detected'
        });
      });
      
      exports.forEach(exp => {
        flows.push({
          type: 'export',
          from: path,
          source: exp,
          status: 'detected'
        });
      });
    }
  }
  
  projectAnalysis.dataFlow = flows;
}

function analyzeSecurity() {
  for (let [path, file] of Object.entries(projectAnalysis.files)) {
    const content = file.content;
    
    // Detecta problemas de segurança
    const securityPatterns = [
      { pattern: /eval\s*\(/g, issue: 'eval() detectado - RISCO DE SEGURANÇA' },
      { pattern: /innerHTML\s*=/g, issue: 'innerHTML detectado - Risco de XSS' },
      { pattern: /dangerouslySetInnerHTML/g, issue: 'dangerouslySetInnerHTML - Risco de XSS' },
      { pattern: /localStorage\.setItem/g, issue: 'localStorage - Dados sensíveis podem ser expostos' },
      { pattern: /document\.write/g, issue: 'document.write() - Método obsoleto' }
    ];
    
    securityPatterns.forEach(p => {
      if (p.pattern.test(content)) {
        projectAnalysis.issues.push({
          severity: 'warning',
          type: 'security',
          title: p.issue,
          detail: `Detectado em ${path}`,
          file: path,
          fix: 'Revise o código para possíveis vulnerabilidades'
        });
      }
    });
  }
}

function switchTab(tabName) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  
  event.target.classList.add('active');
  document.getElementById(`tab-${tabName}`).classList.add('active');
}

function calculateHealth() {
  const total = projectAnalysis.issues.length;
  if (total === 0) return 100;
  
  const critical = projectAnalysis.issues.filter(i => i.severity === 'critical').length * 10;
  const errors = projectAnalysis.issues.filter(i => i.severity === 'error').length * 5;
  const warnings = projectAnalysis.issues.filter(i => i.severity === 'warning').length * 2;
  
  const health = Math.max(0, 100 - (critical + errors + warnings));
  return Math.round(health);
}

function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function escapeHtml(text) {
  const map = {
    '&amp;': '&amp;amp;',
    '<': '&amp;lt;',
    '>': '&amp;gt;',
    '&quot;': '&amp;quot;',
    &quot;'&quot;: '&amp;#039;'
  };
  return text.replace(/[&amp;<>&quot;']/g, m => map[m]);
}

  border-left: 4px solid #a3a082;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 4px;
}

.card-error { border-left-color: #f87171; }
.card-warning { border-left-color: #fbbf24; }
.card-success { border-left-color: #4ade80; }
.card-info { border-left-color: #60a5fa; }
.card-critical { border-left-color: #ef4444; background: rgba(239, 68, 68, 0.05); }

.card-title {
  color: #e2e8f0;
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 8px;
}

.card-content {
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.6;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  gap: 10px;
  margin: 15px 0;
}

.stat-box {
  background: #334155;
  padding: 12px;
  border-radius: 6px;
  text-align: center;
}

.stat-box strong {
  display: block;
  color: #a3a082;
  font-size: 16px;
  margin-bottom: 5px;
}

.stat-box span {
  font-size: 10px;
  color: #94a3b8;
}

.fix-item {
  padding: 15px;
  margin-bottom: 15px;
  border: 1px solid #334155;
  border-radius: 6px;
  background: #1e293b;
}

.fix-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
}

.fix-title {
  color: #e2e8f0;
  font-weight: 600;
  font-size: 13px;
}

.fix-severity {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 600;
}

.fix-severity.critical { background: #ef4444; color: #fff; }
.fix-severity.error { background: #f87171; color: #fff; }
.fix-severity.warning { background: #fbbf24; color: #000; }
.fix-severity.info { background: #60a5fa; color: #fff; }

.fix-detail {
  font-size: 11px;
  color: #94a3b8;
  margin: 8px 0;
}

.code-comparison {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 10px 0;
}

.code-block {
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 4px;
  padding: 10px;
  font-family: 'Courier New', monospace;
  font-size: 11px;
  line-height: 1.4;
  max-height: 150px;
  overflow: auto;
}

.code-before {
  border-left: 4px solid #f87171;
}

.code-after {
  border-left: 4px solid #4ade80;
}

.code-label {
  font-size: 10px;
  font-weight: 600;
  margin-bottom: 5px;
  color: #94a3b8;
}

.fix-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.fix-checkbox {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}

.fix-checkbox input {
  width: 16px;
  height: 16px;
  cursor: pointer;
}

.progress-bar {
  background: #334155;
  border-radius: 4px;
  height: 24px;
  margin: 10px 0;
  overflow: hidden;
}

.progress-fill {
  background: linear-gradient(90deg, #4ade80, #60a5fa);
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #000;
  font-size: 11px;
  font-weight: 600;
}

.summary-box {
  background: #334155;
  border-left: 4px solid #a3a082;
  padding: 15px;
  margin: 15px 0;
  border-radius: 4px;
}

.file-list {
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 6px;
  padding: 15px;
  margin: 10px 0;
  max-height: 400px;
  overflow-y: auto;
}

.file-item {
  padding: 10px;
  margin-bottom: 8px;
  border: 1px solid #334155;
  border-radius: 4px;
  background: #1e293b;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.file-item:hover {
  background: #334155;
  border-color: #a3a082;
}

.file-name {
  flex: 1;
  color: #e2e8f0;
  font-size: 12px;
}

.file-status {
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 3px;
  background: #fbbf24;
  color: #000;
}

.file-status.fixed {
  background: #4ade80;
  color: #000;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.modal.open {
  display: flex;
}

.modal-content {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 20px;
  max-width: 90%;
  max-height: 90vh;
  overflow: auto;
  width: 900px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  padding-bottom: 15px;
  border-bottom: 1px solid #334155;
}

.modal-close {
  background: #f87171;
  color: #fff;
  border: none;
  width: 30px;
  height: 30px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 18px;
  font-weight: bold;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #0f172a; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

@media (max-width: 1200px) {
  .code-comparison { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class=&quot;container&quot;>
  <h1>🔧 Corretor Automático Inteligente</h1>
  <p class=&quot;subtitle&quot;>Detecta problemas e sugere correções automáticas - Você escolhe o que aplicar</p>

  <div class=&quot;upload-area&quot; id=&quot;dropZone&quot;>
    <p style=&quot;font-size: 18px; margin-bottom: 10px;&quot;>📦 Arraste seu ZIP da Replit aqui</p>
    <p style=&quot;color: #94a3b8; font-size: 13px; margin-bottom: 15px;&quot;>Será analisado e sugerirá correções automáticas</p>
    <button class=&quot;btn&quot; onclick=&quot;document.getElementById('fileInput').click()&quot;>Selecionar ZIP</button>
    <input type=&quot;file&quot; id=&quot;fileInput&quot; accept=&quot;.zip&quot; />
  </div>

  <div id=&quot;loading&quot; class=&quot;loading&quot; style=&quot;display:none;&quot;>
    <div class=&quot;spinner&quot;></div>
    <p>Analisando e gerando sugestões de correção...</p>
  </div>

  <div id=&quot;results&quot;></div>
</div>

<script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js&quot;></script>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const resultsDiv = document.getElementById('results');
const loadingDiv = document.getElementById('loading');

let projectData = {
  files: {},
  fixes: [],
  applied: new Set(),
  correctedFiles: {}
};

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('dragover');
});
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', e => {
  handleFile(e.target.files[0]);
});

async function handleFile(file) {
  if (!file) return;
  
  loadingDiv.style.display = 'block';
  resultsDiv.innerHTML = '';
  projectData = {
    files: {},
    fixes: [],
    applied: new Set(),
    correctedFiles: {}
  };
  
  try {
    const zip = new JSZip();
    const content = await zip.loadAsync(file);
    
    // Extrai arquivos
    for (let [path, zipEntry] of Object.entries(content.files)) {
      if (!zipEntry.dir &amp;&amp; /\.(js|ts|jsx|tsx|json|html|css)$/.test(path)) {
        try {
          const fileContent = await zipEntry.async('text');
          projectData.files[path] = fileContent;
        } catch (e) {}
      }
    }
    
    // Gera sugestões de correção
    generateFixes();
    
    loadingDiv.style.display = 'none';
    displayResults();
    
  } catch (err) {
    loadingDiv.style.display = 'none';
    resultsDiv.innerHTML = `<div class=&quot;card card-error&quot;>
      <div class=&quot;card-title&quot;>❌ Erro ao processar</div>
      <div class=&quot;card-content&quot;>${err.message}</div>
    </div>`;
  }
}

function generateFixes() {
  for (let [filePath, content] of Object.entries(projectData.files)) {
    const ext = filePath.split('.').pop().toLowerCase();
    
    if (ext === 'js' || ext === 'ts' || ext === 'jsx' || ext === 'tsx') {
      generateJSFixes(filePath, content);
    } else if (ext === 'json') {
      generateJSONFixes(filePath, content);
    } else if (ext === 'html') {
      generateHTMLFixes(filePath, content);
    }
  }
}

function generateJSFixes(filePath, content) {
  const lines = content.split('\n');
  
  // 1. Adicionar try-catch em promises
  const promisePattern = /\.then\s*\(/g;
  if (promisePattern.test(content)) {
    const thenCount = (content.match(/\.then\s*\(/g) || []).length;
    const catchCount = (content.match(/\.catch\s*\(/g) || []).length;
    
    if (thenCount > catchCount) {
      projectData.fixes.push({
        id: `fix-${projectData.fixes.length}`,
        severity: 'warning',
        file: filePath,
        title: 'Adicionar .catch() em promises',
        detail: `Detectado ${thenCount} .then() mas apenas ${catchCount} .catch()`,
        before: `.then(response => {\n  // seu código\n})`,
        after: `.then(response => {\n  // seu código\n})\n.catch(error => {\n  console.error('Erro:', error);\n})`,
        type: 'promise_catch',
        autoFix: true,
        code: `
// Encontrar todas as promises sem catch
const promiseRegex = /\.then\\s*\\(([^)]+)\\)(?!\\s*\\.catch)/g;
content = content.replace(promiseRegex, '.then($1).catch(error => console.error(error))');
        `
      });
    }
  }
  
  // 2. Remover console.log em produção
  const consolePattern = /console\.(log|error|warn|info|debug)\s*\(/g;
  const consoleMatches = content.match(consolePattern) || [];
  
  if (consoleMatches.length > 0) {
    projectData.fixes.push({
      id: `fix-${projectData.fixes.length}`,
      severity: 'warning',
      file: filePath,
      title: 'Remover console.log em produção',
      detail: `Detectado ${consoleMatches.length} console statement(s)`,
      before: `console.log('Debug:', data);`,
      after: `// console.log('Debug:', data); // Removido em produção`,
      type: 'console_removal',
      autoFix: true,
      code: `
// Comentar console statements
content = content.replace(/console\\.(log|error|warn|info|debug)\\s*\\(/g, '// console.$1(');
      `
    });
  }
  
  // 3. Adicionar async/await em funções
  const asyncPattern = /async\s+function\s+(\w+)/g;
  const asyncFuncs = (content.match(asyncPattern) || []).length;
  const awaitCount = (content.match(/await\s+/g) || []).length;
  
  if (asyncFuncs > 0 &amp;&amp; awaitCount === 0) {
    projectData.fixes.push({
      id: `fix-${projectData.fixes.length}`,
      severity: 'info',
      file: filePath,
      title: 'Função async sem await',
      detail: `${asyncFuncs} função(ões) async sem usar await`,
      before: `async function getData() {\n  return fetch('/api/data');\n}`,
      after: `async function getData() {\n  return await fetch('/api/data');\n}`,
      type: 'async_await',
      autoFix: false
    });
  }
  
  // 4. Adicionar validação de entrada
  const fetchPattern = /fetch\s*\(\s*['&quot;`]([^'&quot;`]+)['&quot;`]/g;
  const fetchMatches = content.match(fetchPattern) || [];
  
  if (fetchMatches.length > 0) {
    projectData.fixes.push({
      id: `fix-${projectData.fixes.length}`,
      severity: 'warning',
      file: filePath,
      title: 'Adicionar validação em fetch',
      detail: `${fetchMatches.length} chamada(s) fetch sem validação de resposta`,
      before: `const response = await fetch(url);\nconst data = await response.json();`,
      after: `const response = await fetch(url);\nif (!response.ok) throw new Error('API error');\nconst data = await response.json();`,
      type: 'fetch_validation',
      autoFix: false
    });
  }
  
  // 5. Adicionar try-catch em JSON.parse
  const jsonParsePattern = /JSON\.parse\s*\(/g;
  if (jsonParsePattern.test(content)) {
    projectData.fixes.push({
      id: `fix-${projectData.fixes.length}`,
      severity: 'warning',
      file: filePath,
      title: 'Adicionar try-catch em JSON.parse',
      detail: 'JSON.parse sem tratamento de erro',
      before: `const data = JSON.parse(jsonString);`,
      after: `let data;\ntry {\n  data = JSON.parse(jsonString);\n} catch (e) {\n  console.error('JSON inválido:', e);\n}`,
      type: 'json_parse_try',
      autoFix: false
    });
  }
  
  // 6. Remover variáveis não usadas
  const varPattern = /(?:const|let|var)\s+(\w+)\s*=/g;
  const usedVars = new Set();
  const declaredVars = new Set();
  
  let match;
  while ((match = varPattern.exec(content)) !== null) {
    declaredVars.add(match[1]);
  }
  
  declaredVars.forEach(varName => {
    const regex = new RegExp(`\\b${varName}\\b`, 'g');
    const occurrences = (content.match(regex) || []).length;
    if (occurrences === 1) {
      projectData.fixes.push({
        id: `fix-${projectData.fixes.length}`,
        severity: 'info',
        file: filePath,
        title: `Variável não usada: ${varName}`,
        detail: `Variável &quot;${varName}&quot; é declarada mas nunca usada`,
        before: `const ${varName} = value;`,
        after: `// const ${varName} = value; // Não utilizada`,
        type: 'unused_var',
        autoFix: false
      });
    }
  });
  
  // 7. Adicionar null checks
  if (content.includes('.') &amp;&amp; !content.includes('?.')) {
    projectData.fixes.push({
      id: `fix-${projectData.fixes.length}`,
      severity: 'info',
      file: filePath,
      title: 'Considerar usar optional chaining (?.)',
      detail: 'Código pode se beneficiar de optional chaining',
      before: `if (user &amp;&amp; user.profile &amp;&amp; user.profile.name) { ... }`,
      after: `if (user?.profile?.name) { ... }`,
      type: 'optional_chaining',
      autoFix: false
    });
  }
}

function generateJSONFixes(filePath, content) {
  try {
    JSON.parse(content);
  } catch (e) {
    projectData.fixes.push({
      id: `fix-${projectData.fixes.length}`,
      severity: 'error',
      file: filePath,
      title: 'JSON inválido',
      detail: `Erro de sintaxe: ${e.message}`,
      before: content.substring(0, 100),
      after: 'JSON válido',
      type: 'json_syntax',
      autoFix: false
    });
  }
  
  // Verifica package.json
  if (filePath.includes('package.json')) {
    try {
      const pkg = JSON.parse(content);
      
      if (!pkg.name) {
        projectData.fixes.push({
          id: `fix-${projectData.fixes.length}`,
          severity: 'warning',
          file: filePath,
          title: 'package.json sem nome',
          detail: 'Campo &quot;name&quot; é obrigatório',
          before: `{\n  &quot;version&quot;: &quot;1.0.0&quot;\n}`,
          after: `{\n  &quot;name&quot;: &quot;meu-projeto&quot;,\n  &quot;version&quot;: &quot;1.0.0&quot;\n}`,
          type: 'pkg_name',
          autoFix: true
        });
      }
      
      if (!pkg.scripts || !pkg.scripts.start) {
        projectData.fixes.push({
          id: `fix-${projectData.fixes.length}`,
          severity: 'warning',
          file: filePath,
          title: 'Script &quot;start&quot; não definido',
          detail: 'Adicione um script de inicialização',
          before: `&quot;scripts&quot;: {}`,
          after: `&quot;scripts&quot;: { &quot;start&quot;: &quot;node index.js&quot; }`,
          type: 'pkg_start',
          autoFix: false
        });
      }
    } catch (e) {}
  }
}

function generateHTMLFixes(filePath, content) {
  // Verifica meta tags
  if (!content.includes('charset')) {
    projectData.fixes.push({
      id: `fix-${projectData.fixes.length}`,
      severity: 'warning',
      file: filePath,
      title: 'Meta charset ausente',
      detail: 'Adicione charset UTF-8',
      before: `<head>\n  <title>Meu Site</title>\n</head>`,
      after: `<head>\n  <meta charset=&quot;UTF-8&quot;>\n  <title>Meu Site</title>\n</head>`,
      type: 'html_charset',
      autoFix: true
    });
  }
  
  // Verifica viewport
  if (!content.includes('viewport')) {
    projectData.fixes.push({
      id: `fix-${projectData.fixes.length}`,
      severity: 'warning',
      file: filePath,
      title: 'Meta viewport ausente',
      detail: 'Adicione viewport para responsividade',
      before: `<head>\n  <meta charset=&quot;UTF-8&quot;>\n</head>`,
      after: `<head>\n  <meta charset=&quot;UTF-8&quot;>\n  <meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>\n</head>`,
      type: 'html_viewport',
      autoFix: true
    });
  }
  
  // Verifica alt em imagens
  const imgPattern = /<img[^>]*>/g;
  const imgs = content.match(imgPattern) || [];
  const imgsWithoutAlt = imgs.filter(img => !img.includes('alt='));
  
  if (imgsWithoutAlt.length > 0) {
    projectData.fixes.push({
      id: `fix-${projectData.fixes.length}`,
      severity: 'warning',
      file: filePath,
      title: `${imgsWithoutAlt.length} imagem(ns) sem alt`,
      detail: 'Adicione atributo alt para acessibilidade',
      before: `<img src=&quot;imagem.jpg&quot;>`,
      after: `<img src=&quot;imagem.jpg&quot; alt=&quot;Descrição da imagem&quot;>`,
      type: 'html_img_alt',
      autoFix: false
    });
  }
}

function displayResults() {
  const critical = projectData.fixes.filter(f => f.severity === 'critical').length;
  const error = projectData.fixes.filter(f => f.severity === 'error').length;
  const warning = projectData.fixes.filter(f => f.severity === 'warning').length;
  const info = projectData.fixes.filter(f => f.severity === 'info').length;
  
  let html = `
    <div class=&quot;tabs&quot;>
      <button class=&quot;tab active&quot; onclick=&quot;switchTab('overview')&quot;>📊 Visão Geral</button>
      <button class=&quot;tab&quot; onclick=&quot;switchTab('fixes')&quot;>🔧 Correções</button>
      <button class=&quot;tab&quot; onclick=&quot;switchTab('apply')&quot;>✅ Aplicar Fixes</button>
      <button class=&quot;tab&quot; onclick=&quot;switchTab('preview')&quot;>👁️ Pré-visualização</button>
    </div>
    
    <!-- TAB: VISÃO GERAL -->
    <div id=&quot;tab-overview&quot; class=&quot;tab-content active&quot;>
      <div class=&quot;results&quot;>
        <h2>📊 Resumo de Correções</h2>
        <div class=&quot;stats-grid&quot;>
          <div class=&quot;stat-box&quot;>
            <strong>${projectData.fixes.length}</strong>
            <span>Total de Fixes</span>
          </div>
          <div class=&quot;stat-box&quot;>
            <strong style=&quot;color: #ef4444;&quot;>${critical}</strong>
            <span>Críticos</span>
          </div>
          <div class=&quot;stat-box&quot;>
            <strong style=&quot;color: #f87171;&quot;>${error}</strong>
            <span>Erros</span>
          </div>
          <div class=&quot;stat-box&quot;>
            <strong style=&quot;color: #fbbf24;&quot;>${warning}</strong>
            <span>Avisos</span>
          </div>
          <div class=&quot;stat-box&quot;>
            <strong style=&quot;color: #60a5fa;&quot;>${info}</strong>
            <span>Informações</span>
          </div>
          <div class=&quot;stat-box&quot;>
            <strong>${projectData.fixes.filter(f => f.autoFix).length}</strong>
            <span>Auto-fix</span>
          </div>
        </div>
      </div>
      
      <div class=&quot;results&quot;>
        <h2>🎯 Prioridade de Correção</h2>
        <div class=&quot;summary-box&quot;>
          <strong>1️⃣ Críticos (${critical})</strong> - Devem ser corrigidos imediatamente
        </div>
        <div class=&quot;summary-box&quot;>
          <strong>2️⃣ Erros (${error})</strong> - Podem quebrar o código
        </div>
        <div class=&quot;summary-box&quot;>
          <strong>3️⃣ Avisos (${warning})</strong> - Melhoram qualidade e segurança
        </div>
        <div class=&quot;summary-box&quot;>
          <strong>4️⃣ Informações (${info})</strong> - Sugestões de melhoria
        </div>
      </div>
    </div>
    
    <!-- TAB: CORREÇÕES -->
    <div id=&quot;tab-fixes&quot; class=&quot;tab-content&quot;>
      <div class=&quot;results&quot;>
        <h2>🔧 Todas as Correções Sugeridas</h2>
        <div id=&quot;fixesList&quot;>
          ${projectData.fixes.length > 0 ? projectData.fixes.map(fix => `
            <div class=&quot;fix-item&quot;>
              <div class=&quot;fix-header&quot;>
                <div>
                  <div class=&quot;fix-title&quot;>${fix.title}</div>
                  <div class=&quot;fix-detail&quot;>${fix.detail}</div>
                  <div class=&quot;fix-detail&quot;>📄 ${fix.file}</div>
                </div>
                <span class=&quot;fix-severity ${fix.severity}&quot;>${fix.severity.toUpperCase()}</span>
              </div>
              
              <div class=&quot;code-comparison&quot;>
                <div>
                  <div class=&quot;code-label&quot;>❌ Antes</div>
                  <div class=&quot;code-block code-before&quot;>${escapeHtml(fix.before)}</div>
                </div>
                <div>
                  <div class=&quot;code-label&quot;>✅ Depois</div>
                  <div class=&quot;code-block code-after&quot;>${escapeHtml(fix.after)}</div>
                </div>
              </div>
              
              <div class=&quot;fix-actions&quot;>
                <div class=&quot;fix-checkbox&quot;>
                  <input type=&quot;checkbox&quot; id=&quot;fix-${fix.id}&quot; onchange=&quot;toggleFix('${fix.id}')&quot;>
                  <label for=&quot;fix-${fix.id}&quot;>Selecionar para aplicar</label>
                </div>

  updateSelectedCount();
}

function applySelectedFixes() {
  const selectedFixes = projectData.fixes.filter(f => projectData.applied.has(f.id));
  
  if (selectedFixes.length === 0) {
    alert('❌ Selecione pelo menos uma correção!');
    return;
  }
  
  projectData.correctedFiles = JSON.parse(JSON.stringify(projectData.files));
  
  selectedFixes.forEach(fix => {
    if (fix.file in projectData.correctedFiles) {
      let content = projectData.correctedFiles[fix.file];
      
      // Aplica a correção baseada no tipo
      switch (fix.type) {
        case 'promise_catch':
          content = content.replace(/\.then\s*\(([^)]+)\)(?!\s*\.catch)/g, '.then($1).catch(error => console.error(error))');
          break;
        case 'console_removal':
          content = content.replace(/console\.(log|error|warn|info|debug)\s*\(/g, '// console.$1(');
          break;
        case 'html_charset':
          content = content.replace(/<head>/i, '<head>\n  <meta charset=&quot;UTF-8&quot;>');
          break;
        case 'html_viewport':
          content = content.replace(/<head>/i, '<head>\n  <meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>');

}

function downloadCorrectedFiles() {
  const zip = new JSZip();
  
  Object.entries(projectData.correctedFiles).forEach(([path, content]) => {
    zip.file(path, content);
  });
  
  zip.generateAsync({ type: 'blob' }).then(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `projeto-corrigido-${new Date().toISOString().split('T')[0]}.zip`;
    a.click();
    URL.revokeObjectURL(url);
  });
}

function downloadCorrectionReport() {
  const applied = projectData.fixes.filter(f => projectData.applied.has(f.id));
  
  let md = `# Relatório de Correções Aplicadas\n\n`;
  md += `**Data:** ${new Date().toLocaleString('pt-BR')}\n\n`;
  md += `**Total de Correções:** ${applied.length}\n\n`;
  
  md += `## Correções Aplicadas\n\n`;

<body>
    <div class=&quot;container&quot;>
        <h1>🔍 Comparador de Projetos</h1>
        <p class=&quot;subtitulo&quot;>Compare 2 ou mais projetos · Detecte diferenças · Veja o que funciona em cada um · Gere relatório completo</p>

        <div class=&quot;grid&quot;>
            <!-- PROJETO 1 -->
            <div class=&quot;card&quot;>
                <h2>📦 Projeto 1 (Original)</h2>
                <div class=&quot;upload-area&quot; id=&quot;upload1&quot; onclick=&quot;document.getElementById('file1').click()&quot;>
                    <div style=&quot;font-size: 48px; margin-bottom: 12px;&quot;>📁</div>
                    <div style=&quot;color: #38bdf8; font-weight: bold; margin-bottom: 8px;&quot;>Clique ou arraste o projeto aqui</div>
                    <div style=&quot;color: #64748b; font-size: 12px;&quot;>ZIP, HTML, JS, JSON ou pasta completa</div>
                </div>
                <input type=&quot;file&quot; id=&quot;file1&quot; accept=&quot;.zip,.html,.js,.json,.txt&quot; onchange=&quot;carregarProjeto(1, event)&quot;>
                <div id=&quot;info1&quot; class=&quot;projeto-info&quot; style=&quot;display: none;&quot;></div>
            </div>

            <!-- PROJETO 2 -->
            <div class=&quot;card&quot;>
                <h2>📦 Projeto 2 (Novo/Atualizado)</h2>
                <div class=&quot;upload-area&quot; id=&quot;upload2&quot; onclick=&quot;document.getElementById('file2').click()&quot;>
                    <div style=&quot;font-size: 48px; margin-bottom: 12px;&quot;>📁</div>
                    <div style=&quot;color: #38bdf8; font-weight: bold; margin-bottom: 8px;&quot;>Clique ou arraste o projeto aqui</div>
                    <div style=&quot;color: #64748b; font-size: 12px;&quot;>ZIP, HTML, JS, JSON ou pasta completa</div>
                </div>
                <input type=&quot;file&quot; id=&quot;file2&quot; accept=&quot;.zip,.html,.js,.json,.txt&quot; onchange=&quot;carregarProjeto(2, event)&quot;>
                <div id=&quot;info2&quot; class=&quot;projeto-info&quot; style=&quot;display: none;&quot;></div>
            </div>
        </div>

        <!-- AÇÕES -->
        <div class=&quot;card&quot;>
            <h2>⚡ Ações</h2>
            <button class=&quot;btn btn-verde&quot; onclick=&quot;compararProjetos()&quot; id=&quot;btnComparar&quot; disabled>
                🔍 Comparar Projetos
            </button>
            <button class=&quot;btn btn-roxo&quot; onclick=&quot;gerarRelatorio()&quot; id=&quot;btnRelatorio&quot; disabled>
                📄 Gerar Relatório Completo
            </button>
            <button class=&quot;btn btn-vermelho&quot; onclick=&quot;limparTudo()&quot;>
                🗑️ Limpar Tudo
            </button>
        </div>

        <!-- RESULTADO -->
        <div class=&quot;resultado&quot; id=&quot;resultado&quot; style=&quot;display: none;&quot;>
            <h2>📊 Resultado da Comparação</h2>
            
            <div class=&quot;stats&quot; id=&quot;stats&quot;></div>

            <div class=&quot;tabs&quot;>
                <div class=&quot;tab ativo&quot; onclick=&quot;mudarTab('resumo')&quot;>📋 Resumo</div>
                <div class=&quot;tab&quot; onclick=&quot;mudarTab('arquivos')&quot;>📁 Arquivos</div>
                <div class=&quot;tab&quot; onclick=&quot;mudarTab('codigo')&quot;>💻 Código</div>
                <div class=&quot;tab&quot; onclick=&quot;mudarTab('dependencias')&quot;>📦 Dependências</div>
                <div class=&quot;tab&quot; onclick=&quot;mudarTab('sugestoes')&quot;>💡 Sugestões</div>
            </div>

            <div class=&quot;tab-content ativo&quot; id=&quot;tab-resumo&quot;></div>
            <div class=&quot;tab-content&quot; id=&quot;tab-arquivos&quot;></div>
            <div class=&quot;tab-content&quot; id=&quot;tab-codigo&quot;></div>
            <div class=&quot;tab-content&quot; id=&quot;tab-dependencias&quot;></div>
            <div class=&quot;tab-content&quot; id=&quot;tab-sugestoes&quot;></div>
        </div>
    </div>

    <script>
        // =====================
        // ESTADO GLOBAL
        // =====================
        let projetos = {
            1: null,
            2: null
        };

        let comparacao = null;

        // =====================
        // DRAG &amp; DROP
        // =====================
        ['upload1', 'upload2'].forEach((id, idx) => {
            const el = document.getElementById(id);
            
            el.addEventListener('dragover', (e) => {
                e.preventDefault();
                el.classList.add('dragover');
            });

            el.addEventListener('dragleave', () => {
                el.classList.remove('dragover');
            });

            el.addEventListener('drop', (e) => {
                e.preventDefault();
                el.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file) {
                    document.getElementById(`file${idx + 1}`).files = e.dataTransfer.files;
                    carregarProjeto(idx + 1, { target: { files: [file] } });
                }
            });
        });

        // =====================
        // CARREGAR PROJETO
        // =====================
        async function carregarProjeto(num, event) {
            const file = event.target.files[0];
            if (!file) return;

            const ext = file.name.split('.').pop().toLowerCase();
            let projeto = {
                nome: file.name,
                tamanho: file.size,
                arquivos: {},
                tipo: ext
            };

            if (ext === 'zip') {
                projeto = await carregarZIP(file, projeto);
            } else {
                const conteudo = await file.text();
                projeto.arquivos[file.name] = {
                    nome: file.name,
                    conteudo: conteudo,
                    tamanho: file.size,
                    tipo: ext
                };
            }

            projetos[num] = projeto;
            mostrarInfo(num, projeto);
            verificarBotaoComparar();
        }

        async function carregarZIP(file, projeto) {
            const zip = await JSZip.loadAsync(file);
            const arquivos = {};

            for (const [caminho, entrada] of Object.entries(zip.files)) {
                if (!entrada.dir) {
                    const ext = caminho.split('.').pop().toLowerCase();
                    const legivel = ['js','ts','tsx','jsx','html','htm','css','json','txt','md','xml'].includes(ext);
                    
                    if (legivel) {
                        try {
                            const conteudo = await entrada.async('text');
                            arquivos[caminho] = {
                                nome: caminho,
                                conteudo: conteudo,
                                tamanho: conteudo.length,
                                tipo: ext
                            };
                        } catch(e) {}
                    }
                }
            }

            projeto.arquivos = arquivos;
            return projeto;
        }

        function mostrarInfo(num, projeto) {
            const el = document.getElementById(`info${num}`);
            const totalArquivos = Object.keys(projeto.arquivos).length;
            const tamanhoTotal = Object.values(projeto.arquivos).reduce((sum, arq) => sum + arq.tamanho, 0);

            el.style.display = 'block';
            el.innerHTML = `
                <div><span class=&quot;label&quot;>Nome:</span> <span class=&quot;valor&quot;>${projeto.nome}</span></div>
                <div><span class=&quot;label&quot;>Arquivos:</span> <span class=&quot;valor&quot;>${totalArquivos}</span></div>
                <div><span class=&quot;label&quot;>Tamanho:</span> <span class=&quot;valor&quot;>${(tamanhoTotal / 1024).toFixed(1)} KB</span></div>
                <div><span class=&quot;label&quot;>Status:</span> <span class=&quot;valor&quot;>✅ Carregado</span></div>
            `;
        }

        function verificarBotaoComparar() {
            const btn = document.getElementById('btnComparar');
            btn.disabled = !(projetos[1] &amp;&amp; projetos[2]);
        }

        // =====================
        // COMPARAR PROJETOS
        // =====================
        function compararProjetos() {
            if (!projetos[1] || !projetos[2]) {
                alert('Carregue os 2 projetos primeiro!');
                return;
            }

            document.getElementById('resultado').style.display = 'block';
            document.getElementById('tab-resumo').innerHTML = '<div class=&quot;loading&quot;><div class=&quot;spinner&quot;></div><div style=&quot;margin-top:16px;&quot;>Comparando projetos...</div></div>';

            setTimeout(() => {
                comparacao = realizarComparacao();
                mostrarResultado();
                document.getElementById('btnRelatorio').disabled = false;
            }, 500);
        }

        function realizarComparacao() {
            const arq1 = projetos[1].arquivos;
            const arq2 = projetos[2].arquivos;

            const nomes1 = new Set(Object.keys(arq1));
            const nomes2 = new Set(Object.keys(arq2));

            const novos = [];
            const deletados = [];
            const modificados = [];
            const iguais = [];

            // Arquivos novos (só no projeto 2)
            for (const nome of nomes2) {
                if (!nomes1.has(nome)) {
                    novos.push({
                        nome,
                        arquivo: arq2[nome]
                    });
                }
            }

            // Arquivos deletados (só no projeto 1)
            for (const nome of nomes1) {
                if (!nomes2.has(nome)) {
                    deletados.push({
                        nome,
                        arquivo: arq1[nome]
                    });
                }
            }

            // Arquivos em ambos (comparar conteúdo)
            for (const nome of nomes1) {
                if (nomes2.has(nome)) {
                    const diff = compararArquivos(arq1[nome], arq2[nome]);
                    if (diff.modificado) {
                        modificados.push({
                            nome,
                            arquivo1: arq1[nome],
                            arquivo2: arq2[nome],
                            diff
                        });
                    } else {
                        iguais.push({
                            nome,
                            arquivo: arq1[nome]
                        });
                    }
                }
            }

            return {
                novos,
                deletados,
                modificados,
                iguais,
                total: nomes1.size + nomes2.size - iguais.length
            };
        }

        function compararArquivos(arq1, arq2) {
            const linhas1 = arq1.conteudo.split('\n');
            const linhas2 = arq2.conteudo.split('\n');

            if (arq1.conteudo === arq2.conteudo) {
                return { modificado: false };
            }

            const diff = [];
            const maxLen = Math.max(linhas1.length, linhas2.length);

            for (let i = 0; i < maxLen; i++) {
                const l1 = linhas1[i];
                const l2 = linhas2[i];

                if (l1 === undefined) {
                    diff.push({ tipo: 'add', linha: i + 1, conteudo: l2 });
                } else if (l2 === undefined) {
                    diff.push({ tipo: 'remove', linha: i + 1, conteudo: l1 });
                } else if (l1 !== l2) {
                    diff.push({ tipo: 'modify', linha: i + 1, antes: l1, depois: l2 });
                } else {
                    diff.push({ tipo: 'igual', linha: i + 1, conteudo: l1 });
                }
            }

            return {
                modificado: true,
                diff,
                linhasAdicionadas: diff.filter(d => d.tipo === 'add').length,
                linhasRemovidas: diff.filter(d => d.tipo === 'remove').length,
                linhasModificadas: diff.filter(d => d.tipo === 'modify').length
            };
        }

        // =====================
        // MOSTRAR RESULTADO
        // =====================
        function mostrarResultado() {
            // STATS
            document.getElementById('stats').innerHTML = `
                <div class=&quot;stat-card&quot;>
                    <div class=&quot;stat-numero&quot; style=&quot;color: #4ade80;&quot;>${comparacao.novos.length}</div>
                    <div class=&quot;stat-label&quot;>Novos</div>
                </div>
                <div class=&quot;stat-card&quot;>
                    <div class=&quot;stat-numero&quot; style=&quot;color: #fbbf24;&quot;>${comparacao.modificados.length}</div>
                    <div class=&quot;stat-label&quot;>Modificados</div>
                </div>
                <div class=&quot;stat-card&quot;>
                    <div class=&quot;stat-numero&quot; style=&quot;color: #f87171;&quot;>${comparacao.deletados.length}</div>
                    <div class=&quot;stat-label&quot;>Deletados</div>
                </div>
                <div class=&quot;stat-card&quot;>
                    <div class=&quot;stat-numero&quot; style=&quot;color: #64748b;&quot;>${comparacao.iguais.length}</div>
                    <div class=&quot;stat-label&quot;>Iguais</div>
                </div>
            `;

            // RESUMO
            mostrarResumo();

            // ARQUIVOS
            mostrarArquivos();

            // SUGESTÕES
            gerarSugestoes();
        }

        function mostrarResumo() {
            let html = '<div class=&quot;diff-container&quot;>';
            
            html += `<div style=&quot;color: #38bdf8; font-weight: bold; font-size: 16px; margin-bottom: 16px;&quot;>📊 RESUMO DA COMPARAÇÃO</div>`;
            
            html += `<div style=&quot;margin-bottom: 20px;&quot;>`;
            html += `<div style=&quot;color: #94a3b8; margin-bottom: 8px;&quot;>PROJETO 1: ${projetos[1].nome}</div>`;
            html += `<div style=&quot;color: #94a3b8;&quot;>PROJETO 2: ${projetos[2].nome}</div>`;
            html += `</div>`;

            if (comparacao.novos.length > 0) {
                html += `<div style=&quot;color: #4ade80; font-weight: bold; margin-top: 16px;&quot;>✅ ARQUIVOS NOVOS (${comparacao.novos.length}):</div>`;
                comparacao.novos.slice(0, 10).forEach(item => {
                    html += `<div class=&quot;diff-linha diff-add&quot;>+ ${item.nome}</div>`;
                });
                if (comparacao.novos.length > 10) {
                    html += `<div style=&quot;color: #64748b; margin: 8px 0;&quot;>... e mais ${comparacao.novos.length - 10} arquivos</div>`;
                }
            }

            if (comparacao.modificados.length > 0) {
                html += `<div style=&quot;color: #fbbf24; font-weight: bold; margin-top: 16px;&quot;>⚠️ ARQUIVOS MODIFICADOS (${comparacao.modificados.length}):</div>`;
                comparacao.modificados.slice(0, 10).forEach(item => {
                    html += `<div class=&quot;diff-linha diff-modify&quot;>~ ${item.nome}</div>`;
                });
                if (comparacao.modificados.length > 10) {
                    html += `<div style=&quot;color: #64748b; margin: 8px 0;&quot;>... e mais ${comparacao.modificados.length - 10} arquivos</div>`;
                }
            }

            if (comparacao.deletados.length > 0) {
                html += `<div style=&quot;color: #f87171; font-weight: bold; margin-top: 16px;&quot;>❌ ARQUIVOS DELETADOS (${comparacao.deletados.length}):</div>`;
                comparacao.deletados.slice(0, 10).forEach(item => {
                    html += `<div class=&quot;diff-linha diff-remove&quot;>- ${item.nome}</div>`;
                });
                if (comparacao.deletados.length > 10) {
                    html += `<div style=&quot;color: #64748b; margin: 8px 0;&quot;>... e mais ${comparacao.deletados.length - 10} arquivos</div>`;
                }
            }

            html += '</div>';
            document.getElementById('tab-resumo').innerHTML = html;
        }

        function mostrarArquivos() {
            let html = '';

            // Novos
            if (comparacao.novos.length > 0) {
                html += `<div style=&quot;color: #4ade80; font-weight: bold; margin-bottom: 12px;&quot;>✅ ARQUIVOS NOVOS:</div>`;
                comparacao.novos.forEach((item, idx) => {
                    html += `
                        <div class=&quot;arquivo-item&quot; onclick=&quot;verArquivo('novo', ${idx})&quot;>
                            <div class=&quot;arquivo-icon&quot;>📄</div>
                            <div class=&quot;arquivo-info&quot;>
                                <div class=&quot;arquivo-nome&quot;>${item.nome}</div>
                                <div class=&quot;arquivo-status status-novo&quot;>Novo · ${(item.arquivo.tamanho / 1024).toFixed(1)} KB</div>
                            </div>
                        </div>
                    `;
                });
            }

            // Modificados
            if (comparacao.modificados.length > 0) {
                html += `<div style=&quot;color: #fbbf24; font-weight: bold; margin: 20px 0 12px;&quot;>⚠️ ARQUIVOS MODIFICADOS:</div>`;
                comparacao.modificados.forEach((item, idx) => {
                    html += `
                        <div class=&quot;arquivo-item&quot; onclick=&quot;verArquivo('modificado', ${idx})&quot;>
                            <div class=&quot;arquivo-icon&quot;>📝</div>
                            <div class=&quot;arquivo-info&quot;>
                                <div class=&quot;arquivo-nome&quot;>${item.nome}</div>
                                <div class=&quot;arquivo-status status-modificado&quot;>

        function verArquivo(tipo, idx) {
            let item, diff;

            if (tipo === 'novo') {
                item = comparacao.novos[idx];
                diff = `<div style=&quot;color: #4ade80; font-weight: bold; margin-bottom: 12px;&quot;>✅ ARQUIVO NOVO: ${item.nome}</div>`;
                diff += '<div class=&quot;diff-container&quot;>';
                item.arquivo.conteudo.split('\n').slice(0, 100).forEach((linha, i) => {
                    diff += `<div class=&quot;diff-linha diff-add&quot;>${i + 1} | ${linha}</div>`;
                });
                diff += '</div>';
            } else if (tipo === 'modificado') {
                item = comparacao.modificados[idx];
                diff = `<div style=&quot;color: #fbbf24; font-weight: bold; margin-bottom: 12px;&quot;>⚠️ ARQUIVO MODIFICADO: ${item.nome}</div>`;
                diff += '<div class=&quot;diff-container&quot;>';
                item.diff.diff.slice(0, 200).forEach(d => {
                    if (d.tipo === 'add') {
                        diff += `<div class=&quot;diff-linha diff-add&quot;>${d.linha} | + ${d.conteudo}</div>`;

                        diff += `<div class=&quot;diff-linha diff-remove&quot;>${d.linha} | - ${d.conteudo}</div>`;

                        diff += `<div class=&quot;diff-linha diff-remove&quot;>${d.linha} | - ${d.antes}</div>`;

                        diff += `<div class=&quot;diff-linha diff-igual&quot;>${d.linha} | ${d.conteudo}</div>`;
                    }

                diff += '</div>';
            } else {
                item = comparacao.deletados[idx];
                diff = `<div style=&quot;color: #f87171; font-weight: bold; margin-bottom: 12px;&quot;>❌ ARQUIVO DELETADO: ${item.nome}</div>`;
                diff += '<div class=&quot;diff-container&quot;>';

ESTATÍSTICAS:
${&quot;─&quot;.repeat(80)}

Arquivos Novos:       ${comparacao.novos.length}
Arquivos Modificados: ${comparacao.modificados.length}
Arquivos Deletados:   ${comparacao.deletados.length}
Arquivos Iguais:      ${comparacao.iguais.length}

ARQUIVOS NOVOS:
${&quot;─&quot;.repeat(80)}

${&quot;═&quot;.repeat(80)}
ARQUIVOS DELETADOS:
${&quot;─&quot;.repeat(80)}

${&quot;═&quot;.repeat(80)}
Gerado por: Comparador de Projetos

            baixarTexto(relatorio, `comparacao-${Date.now()}.txt`);

        function mudarTab(nome) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativo'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('ativo'));
            
            event.target.classList.add('ativo');
            document.getElementById(`tab-${nome}`).classList.add('ativo');
        }

        function limparTudo() {
            projetos = { 1: null, 2: null };
            comparacao = null;
            document.getElementById('file1').value = '';
            document.getElementById('file2').value = '';

            document.getElementById('resultado').style.display = 'none';
            document.getElementById('btnComparar').disabled = true;
            document.getElementById('btnRelatorio').disabled = true;
        }

        function baixarTexto(conteudo, nome) {
            const blob = new Blob([conteudo], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = nome;
            a.click();
            URL.revokeObjectURL(url);
        }

      if (!url) {

      mostrarStatus(&quot;🔄 Testando API...&quot;, &quot;info&quot;);

      let proxiesParaTentar = [];

        }
      } else {
        proxiesParaTentar = [&quot;&quot;];
      }

      let ultimoErro = null;

      for (const proxy of proxiesParaTentar) {
        try {
          let urlFinal = url;

          if (proxy === &quot;&quot;) {
            // Sem proxy
            urlFinal = url;
          } else if (proxy.includes(&quot;allorigins&quot;)) {
            urlFinal = proxy + encodeURIComponent(url);
          } else if (proxy.includes(&quot;cors.sh&quot;)) {

            urlFinal = proxy + url;

          mostrarStatus(`🔄 Tentando: ${proxy || &quot;direto&quot;}...`, &quot;info&quot;);

          document.getElementById(&quot;response&quot;).textContent = JSON.stringify(data, null, 2);
          mostrarStatus(`✅ Sucesso! Proxy: ${proxy || &quot;direto&quot;}`, &quot;success&quot;);

          ultimoErro = err.message;
