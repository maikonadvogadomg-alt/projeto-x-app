// ========== LOCAL DB (localStorage) ==========
function getSnippets() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }
  catch { return []; }
}

function setSnippets(list) {
  localStorage.setItem(LS_KEY, JSON.stringify(list));
}

function saveToLocal() {
  const snippets = getSnippets();
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const item = {
    id,
    title: state.title || 'Sem titulo',
    mode: state.mode,
    html: state.html,
    css: state.css,
    js: state.js,
    jsx: state.jsx,
    python: state.python,
    date: new Date().toISOString()
  };
  snippets.unshift(item);
  setSnippets(snippets);
  showToast('💾 Salvo no banco local!');
}

function openSavedModal() {
  document.getElementById('savedModal').classList.add('open');
  renderSavedList();
}

function closeSavedModal() {
  document.getElementById('savedModal').classList.remove('open');
}

function renderSavedList() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const snippets = getSnippets().filter(s =&amp;gt; s.title.toLowerCase().includes(query));
  const container = document.getElementById('savedList');
  
  if (snippets.length === 0) {
    container.innerHTML = '&amp;lt;p style=&amp;quot;text-align:center;color:var(--text2);font-size:12px;padding:20px;&amp;quot;&amp;gt;Nenhum código salvo.&amp;lt;/p&amp;gt;';
    return;
  }
  
  container.innerHTML = snippets.map(s =&amp;gt; `
    &amp;lt;div class=&amp;quot;snippet-item&amp;quot; onclick=&amp;quot;loadSnippet('${s.id}')&amp;quot;&amp;gt;
      &amp;lt;div&amp;gt;
        &amp;lt;div class=&amp;quot;name&amp;quot;&amp;gt;${escapeHtml(s.title)}&amp;lt;/div&amp;gt;
        &amp;lt;div class=&amp;quot;meta&amp;quot;&amp;gt;${s.mode || 'html'} • ${new Date(s.date).toLocaleDateString('pt-BR')} ${new Date(s.date).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}&amp;lt;/div&amp;gt;
      &amp;lt;/div&amp;gt;
      &amp;lt;div class=&amp;quot;snippet-actions&amp;quot;&amp;gt;
        &amp;lt;button class=&amp;quot;btn-icon&amp;quot; onclick=&amp;quot;event.stopPropagation();renameSnippet('${s.id}')&amp;quot; title=&amp;quot;Renomear&amp;quot;&amp;gt;✏️&amp;lt;/button&amp;gt;
        &amp;lt;button class=&amp;quot;btn-icon&amp;quot; onclick=&amp;quot;event.stopPropagation();deleteSnippet('${s.id}')&amp;quot; title=&amp;quot;Excluir&amp;quot;&amp;gt;🗑️&amp;lt;/button&amp;gt;
      &amp;lt;/div&amp;gt;
    &amp;lt;/div&amp;gt;
  `).join('');
}

function loadSnippet(id) {
  const snippets = getSnippets();
  const s = snippets.find(x =&amp;gt; x.id === id);
  if (!s) return;
  
  state.title = s.title;
  state.mode = s.mode || 'html';
  state.html = s.html || '';
  state.css = s.css || '';
  state.js = s.js || '';
  state.jsx = s.jsx || '';
  state.python = s.python || '';
  
  titleInput.value = state.title;
  switchMode(state.mode);
  closeSavedModal();
  showToast('📂 &amp;quot;' + s.title + '&amp;quot; carregado!');
}

function deleteSnippet(id) {
  if (!confirm('Excluir este código?')) return;
  const snippets = getSnippets().filter(s =&amp;gt; s.id !== id);
  setSnippets(snippets);
  renderSavedList();
  showToast('🗑️ Código excluído!');
}

function renameSnippet(id) {
  const snippets = getSnippets();
  const s = snippets.find(x =&amp;gt; x.id === id);
  if (!s) return;
  const newName = prompt('Novo nome:', s.title);
  if (newName &amp;amp;&amp;amp; newName.trim()) {
    s.title = newName.trim();
    setSnippets(snippets);
    renderSavedList();
    showToast('✏️ Renomeado!');
  }
}

function escapeHtml(str) {
  return str.replace(/&amp;amp;/g,'&amp;amp;amp;').replace(/&amp;lt;/g,'&amp;amp;lt;').replace(/&amp;gt;/g,'&amp;amp;gt;').replace(/&amp;quot;/g,'&amp;amp;quot;');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() =&amp;gt; toast.classList.remove('show'), 2500);
}

// Close modal on overlay click
document.getElementById('savedModal').addEventListener('click', (e) =&amp;gt; {
  if (e.target === document.getElementById('savedModal')) closeSavedModal();
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) =&amp;gt; {
  if (e.ctrlKey || e.metaKey) {
    if (e.key === 's') { e.preventDefault(); saveToLocal(); }
    if (e.key === 'Enter') { e.preventDefault(); updatePreview(); }
  }
});

&amp;lt;script&amp;gt;
// ========== STATE ==========
const LS_KEY = 'playground-projects-v3';

let state = {

});

});

editor.addEventListener('click', updateCursorPosition);
editor.addEventListener('keyup', updateCursorPosition);

editor.addEventListener('keydown', (e) =&amp;gt; {
  // Tab support
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + 2;
    saveCurrentTab();
  }
  
  // Ctrl+G: Go to line
  if ((e.ctrlKey || e.metaKey) &amp;amp;&amp;amp; e.key === 'g') {
    e.preventDefault();

editor.addEventListener('paste', (e) =&amp;gt; {

// ========== LINE NUMBERS ==========
function updateLineNumbers() {
  const lines = editor.value.split('\n');
  const totalLines = lines.length;
  document.getElementById('lineCount').textContent = totalLines + ' linhas';
  
  lineNumbers.innerHTML = lines.map((_, i) =&amp;gt; {
    const lineNum = i + 1;
    const isCurrent = lineNum === state.currentLine;
    return `&amp;lt;div class=&amp;quot;line ${isCurrent ? 'current' : ''}&amp;quot; onclick=&amp;quot;jumpToLine(${lineNum})&amp;quot;&amp;gt;${lineNum}&amp;lt;/div&amp;gt;`;
  }).join('');
}

function updateCursorPosition() {
  const pos = editor.selectionStart;
  const textBefore = editor.value.substring(0, pos);
  const lines = textBefore.split('\n');
  const line = lines.length;
  const col = lines[lines.length - 1].length + 1;
  
  state.currentLine = line;
  document.getElementById('cursorPos').textContent = `Ln ${line}, Col ${col}`;
  updateLineNumbers();
}

function jumpToLine(lineNum) {
  const lines = editor.value.split('\n');
  let pos = 0;
  for (let i = 0; i &amp;lt; lineNum - 1 &amp;amp;&amp;amp; i &amp;lt; lines.length; i++) {
    pos += lines[i].length + 1;
  }
  editor.focus();
  editor.setSelectionRange(pos, pos);
  updateCursorPosition();
}

// ========== GO TO LINE ==========
function openGotoLine() {
  document.getElementById('gotoModal').classList.add('open');
  setTimeout(() =&amp;gt; {
    const input = document.getElementById('gotoLineInput');
    input.value = '';
    input.max = editor.value.split('\n').length;
    input.focus();
  }, 100);
}

function closeGotoLine() {
  document.getElementById('gotoModal').classList.remove('open');
}

function gotoLine() {
  const lineNum = parseInt(document.getElementById('gotoLineInput').value);
  if (lineNum &amp;amp;&amp;amp; lineNum &amp;gt; 0) {
    jumpToLine(lineNum);
    closeGotoLine();
    showToast(`📍 Linha ${lineNum}`);
  }
}

// ========== TABS &amp;amp; MODES ==========
function saveCurrentTab() {
  const tab = state.activeTab;
  if (state.mode === 'react' &amp;amp;&amp;amp; tab === 'jsx') state.jsx = editor.value;
  else if (state.mode === 'python' &amp;amp;&amp;amp; tab === 'python') state.python = editor.value;
  else if (tab === 'html') state.html = editor.value;
  else if (tab === 'css') state.css = editor.value;
  else if (tab === 'js') state.js = editor.value;
}

function loadEditorContent() {
  const tab = state.activeTab;
  if (state.mode === 'react' &amp;amp;&amp;amp; tab === 'jsx') editor.value = state.jsx;
  else if (state.mode === 'python' &amp;amp;&amp;amp; tab === 'python') editor.value = state.python;
  else if (tab === 'html') editor.value = state.html;
  else if (tab === 'css') editor.value = state.css;
  else if (tab === 'js') editor.value = state.js;
  else editor.value = '';
  updateLineNumbers();
  updateCursorPosition();
}

function switchTab(tab) {
  saveCurrentTab();
  state.activeTab = tab;
  document.querySelectorAll('.tab').forEach(t =&amp;gt; t.classList.remove('active'));
  const tabEl = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
  if (tabEl) tabEl.classList.add('active');
  loadEditorContent();
}

      &amp;lt;button class=&amp;quot;tab ${state.activeTab==='js'?'active':''}&amp;quot; id=&amp;quot;tabJs&amp;quot; onclick=&amp;quot;switchTab('js')&amp;quot;&amp;gt;⚙️ JS&amp;lt;/button&amp;gt;

    badge.className = 'status-badge python';

function switchMode(mode) {
  saveCurrentTab();
  state.mode = mode;
  
  document.querySelectorAll('.btn-mode').forEach(b =&amp;gt; b.classList.remove('active'));
  document.getElementById('mode' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
  
  if (mode === 'html') state.activeTab = 'html';
  else if (mode === 'react') state.activeTab = 'jsx';
  else if (mode === 'python') state.activeTab = 'python';
  
  updateTabs();

// ========== PREVIEW ==========
let previewTimer = null;
function debouncePreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(updatePreview, 400);
}

function buildDocument() {
  if (state.mode === 'react') {
    return `&amp;lt;!DOCTYPE html&amp;gt;
&amp;lt;html&amp;gt;&amp;lt;head&amp;gt;&amp;lt;meta charset=&amp;quot;UTF-8&amp;quot;&amp;gt;
&amp;lt;script crossorigin src=&amp;quot;https://unpkg.com/react@18/umd/react.development.js&amp;quot;&amp;gt;&amp;lt;\/script&amp;gt;
&amp;lt;script crossorigin src=&amp;quot;https://unpkg.com/react-dom@18/umd/react-dom.development.js&amp;quot;&amp;gt;&amp;lt;\/script&amp;gt;
&amp;lt;script src=&amp;quot;https://unpkg.com/@babel/standalone/babel.min.js&amp;quot;&amp;gt;&amp;lt;\/script&amp;gt;
&amp;lt;style&amp;gt;*{box-sizing:border-box;}body{margin:0;font-family:sans-serif;}${state.css}&amp;lt;/style&amp;gt;
&amp;lt;/head&amp;gt;&amp;lt;body&amp;gt;&amp;lt;div id=&amp;quot;root&amp;quot;&amp;gt;&amp;lt;/div&amp;gt;
&amp;lt;script type=&amp;quot;text/babel&amp;quot;&amp;gt;
const { useState, useEffect, useRef, useCallback, useMemo, useContext, createContext, Fragment } = React;
${state.jsx}
try {
  const _root = ReactDOM.createRoot(document.getElementById('root'));
  _root.render(&amp;lt;App /&amp;gt;);
} catch(e) {
  document.getElementById('root').innerHTML = '&amp;lt;div style=&amp;quot;color:red;padding:20px;font-family:monospace;white-space:pre-wrap&amp;quot;&amp;gt;Erro: '+e.message+'&amp;lt;/div&amp;gt;';
}
&amp;lt;\/script&amp;gt;&amp;lt;/body&amp;gt;&amp;lt;/html&amp;gt;`;
  }
  
  if (state.mode === 'python') {
    const escapedCode = state.python.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/&amp;lt;\/script&amp;gt;/g,'&amp;lt;\\/script&amp;gt;');
    return `&amp;lt;!DOCTYPE html&amp;gt;
&amp;lt;html&amp;gt;&amp;lt;head&amp;gt;&amp;lt;meta charset=&amp;quot;UTF-8&amp;quot;&amp;gt;
&amp;lt;style&amp;gt;
body{margin:0;background:#0f172a;color:#e2e8f0;font-family:'Consolas',monospace;padding:20px;}
#output{white-space:pre-wrap;font-size:13px;line-height:1.6;}
.loading{color:#60a5fa;}
.error{color:#f87171;}
.success{color:#4ade80;}
&amp;lt;/style&amp;gt;
&amp;lt;/head&amp;gt;&amp;lt;body&amp;gt;
&amp;lt;div id=&amp;quot;output&amp;quot;&amp;gt;&amp;lt;span class=&amp;quot;loading&amp;quot;&amp;gt;⟳ Carregando Pyodide...&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;
&amp;lt;script src=&amp;quot;https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js&amp;quot;&amp;gt;&amp;lt;\/script&amp;gt;
&amp;lt;script&amp;gt;
async function main() {
  const out = document.getElementById('output');
  try {
    const pyodide = await loadPyodide();
    out.innerHTML = '';
    pyodide.runPython(\`
import sys
from io import StringIO
sys.stdout = StringIO()
\`);
    pyodide.runPython(\`${escapedCode}\`);
    const stdout = pyodide.runPython('sys.stdout.getvalue()');
    out.innerHTML = '&amp;lt;span class=&amp;quot;success&amp;quot;&amp;gt;$ python3 script.py&amp;lt;/span&amp;gt;\\n' + stdout;
  } catch(e) {
    out.innerHTML = '&amp;lt;span class=&amp;quot;error&amp;quot;&amp;gt;Erro: ' + e.message + '&amp;lt;/span&amp;gt;';
  }
}
main();
&amp;lt;\/script&amp;gt;&amp;lt;/body&amp;gt;&amp;lt;/html&amp;gt;`;
  }
  
  // HTML mode
  const lower = state.html.trim().toLowerCase();
  const isComplete = lower.includes('&amp;lt;!doctype') || (lower.includes('&amp;lt;html') &amp;amp;&amp;amp; lower.includes('&amp;lt;/html&amp;gt;'));
  
  if (isComplete) return state.html;
  
  return `&amp;lt;!DOCTYPE html&amp;gt;
&amp;lt;html&amp;gt;&amp;lt;head&amp;gt;&amp;lt;meta charset=&amp;quot;UTF-8&amp;quot;&amp;gt;&amp;lt;meta name=&amp;quot;viewport&amp;quot; content=&amp;quot;width=device-width,initial-scale=1.0&amp;quot;&amp;gt;
&amp;lt;style&amp;gt;${state.css}&amp;lt;/style&amp;gt;

${state.html}
&amp;lt;script&amp;gt;${state.js}&amp;lt;\/script&amp;gt;
&amp;lt;/body&amp;gt;&amp;lt;/html&amp;gt;`;
}

function updatePreview() {
  const doc = buildDocument();
  const blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  previewFrame.src = url;
  setTimeout(() =&amp;gt; URL.revokeObjectURL(url), 5000);
}

function autoSave() {
  try {
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(state));
  } catch(e) {}
}

// ========== FILE OPERATIONS ==========
function copyCode() {
  const doc = buildDocument();
  navigator.clipboard.writeText(doc).then(() =&amp;gt; showToast('📋 Código copiado!'));
}

function downloadFile() {
  let content, ext, mime;
  if (state.mode === 'python') { content = state.python; ext = 'py'; mime = 'text/plain'; }
  else if (state.mode === 'react') { content = state.jsx; ext = 'jsx'; mime = 'text/plain'; }
  else { content = buildDocument(); ext = 'html'; mime = 'text/html'; }
  
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (state.title || 'playground') + '.' + ext;
  a.click();
  URL.revokeObjectURL(url);
  showToast('⬇️ Arquivo baixado!');
}

function toggleFullscreen() {
  const doc = buildDocument();
  const blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
  setTimeout(() =&amp;gt; URL.revokeObjectURL(url), 5000);
}

function importFile() {
  fileInput.click();
}

fileInput.addEventListener('change', (e) =&amp;gt; {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) =&amp;gt; {
    const content = ev.target.result;
    const ext = file.name.split('.').pop().toLowerCase();
    const name = file.name.replace(/\.[^.]+$/, '');
    
    if (ext === 'py') {
      switchMode('python');
      state.python = content;
    } else if (ext === 'jsx' || ext === 'tsx') {
      switchMode('react');
      state.jsx = content;
    } else if (ext === 'css') {
      state.css = content;
      if (state.mode === 'html') switchTab('css');
    } else if (ext === 'js') {
      state.js = content;
      if (state.mode === 'html') switchTab('js');
    } else {
      // HTML or text
      const lower = content.trim().toLowerCase();
      if (lower.includes('&amp;lt;!doctype') || lower.includes('&amp;lt;html')) {
        // Complete HTML document - extract parts
        const htmlMatch = content.match(/&amp;lt;body[^&amp;gt;]*&amp;gt;([\s\S]*)&amp;lt;\/body&amp;gt;/i);
        const cssMatch = content.match(/&amp;lt;style[^&amp;gt;]*&amp;gt;([\s\S]*?)&amp;lt;\/style&amp;gt;/i);
        const jsMatch = content.match(/&amp;lt;script[^&amp;gt;]*&amp;gt;([\s\S]*?)&amp;lt;\/script&amp;gt;/i);
        
        state.html = htmlMatch ? htmlMatch[1].trim() : content;
        state.css = cssMatch ? cssMatch[1].trim() : '';
        state.js = jsMatch ? jsMatch[1].trim() : '';
      } else {
        state.html = content;
      }
      switchMode('html');
    }
    
    state.title = name;
    titleInput.value = name;
    loadEditorContent();
    updatePreview();
    autoSave();
    showToast('📂 &amp;quot;' + file.name + '&amp;quot; importado!');
  };
  reader.readAsText(file);
  fileInput.value = '';
});

function toggleEditor() {
  if (state.editorState === 'normal') {
    state.editorState = 'expanded';
    editorPanel.classList.add('expanded');
    previewPanel.classList.add('hidden');
    document.getElementById('btnToggleEditor').textContent = '◧';
  } else if (state.editorState === 'expanded') {
    state.editorState = 'collapsed';
    editorPanel.classList.remove('expanded');
    editorPanel.classList.add('collapsed');
    previewPanel.classList.remove('hidden');
    document.getElementById('btnToggleEditor').textContent = '◨';
  } else {
    state.editorState = 'normal';
    editorPanel.classList.remove('collapsed', 'expanded');
    previewPanel.classList.remove('hidden');
    document.getElementById('btnToggleEditor').textContent = '⬜';
  }
}

function clearCode() {
  if (!confirm('Limpar todo o código atual?')) return;
  if (state.mode === 'react') state.jsx = '';
  else if (state.mode === 'python') state.python = '';
  else { state.html = ''; state.css = ''; state.js = ''; }
  loadEditorContent();
  updatePreview();
  autoSave();
  showToast('🗑️ Código limpo!');
}

function resetCode() {
  if (!confirm('Resetar para o código padrão?')) return;
  if (state.mode === 'react') {
    state.jsx = `function App() {\n  const [count, setCount] = React.useState(0);\n  return (\n    &amp;lt;div style={{padding:40,fontFamily:'sans-serif',textAlign:'center'}}&amp;gt;\n      &amp;lt;h1&amp;gt;⚛️ React no Playground&amp;lt;/h1&amp;gt;\n      &amp;lt;p&amp;gt;Contador: &amp;lt;strong&amp;gt;{count}&amp;lt;/strong&amp;gt;&amp;lt;/p&amp;gt;\n      &amp;lt;button onClick={() =&amp;gt; setCount(count + 1)}&amp;gt;\n        Incrementar\n      &amp;lt;/button&amp;gt;\n    &amp;lt;/div&amp;gt;\n  );\n}`;
  } else if (state.mode === 'python') {
    state.python = `# Python\ndados = [&amp;quot;João&amp;quot;, &amp;quot;Maria&amp;quot;, &amp;quot;Pedro&amp;quot;]\nfor i, nome in enumerate(dados, 1):\n    print(f&amp;quot;{i}. {nome}&amp;quot;)`;
  } else {
    state.html = `&amp;lt;div style=&amp;quot;max-width:600px;margin:40px auto;padding:20px;&amp;quot;&amp;gt;\n  &amp;lt;h1&amp;gt;Bem-vindo!&amp;lt;/h1&amp;gt;\n  &amp;lt;p&amp;gt;Cole seu código aqui.&amp;lt;/p&amp;gt;\n&amp;lt;/div&amp;gt;`;
    state.css = '';
    state.js = '';
  }
  loadEditorContent();
  updatePreview();
  autoSave();
  showToast('🔄 Código resetado!');
}

// ========== PROJECT MANAGEMENT ==========
function getProjects() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }
  catch { return []; }
}

function setProjects(list) {
  localStorage.setItem(LS_KEY, JSON.stringify(list));
}

function saveToLocal() {
  const projects = getProjects();
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const item = {
    id,
    title: state.title || 'Sem titulo',
    mode: state.mode,
    html: state.html,
    css: state.css,
    js: state.js,
    jsx: state.jsx,
    python: state.python,
    date: new Date().toISOString()
  };
  projects.unshift(item);
  setProjects(projects);
  showToast('💾 Projeto salvo!');
}

function openSavedModal() {
  document.getElementById('savedModal').classList.add('open');
  renderSavedList();
}

function closeSavedModal() {
  document.getElementById('savedModal').classList.remove('open');
}

function renderSavedList() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const projects = getProjects().filter(s =&amp;gt; s.title.toLowerCase().includes(query));
  const container = document.getElementById('savedList');
  
  if (projects.length === 0) {
    container.innerHTML = '&amp;lt;p style=&amp;quot;text-align:center;color:var(--text2);font-size:12px;padding:20px;&amp;quot;&amp;gt;Nenhum projeto salvo.&amp;lt;/p&amp;gt;';
    return;
  }
  
  container.innerHTML = projects.map(s =&amp;gt; `
    &amp;lt;div class=&amp;quot;snippet-item&amp;quot; onclick=&amp;quot;loadProject('${s.id}')&amp;quot;&amp;gt;
      &amp;lt;div&amp;gt;
        &amp;lt;div class=&amp;quot;name&amp;quot;&amp;gt;${escapeHtml(s.title)}&amp;lt;/div&amp;gt;
        &amp;lt;div class=&amp;quot;meta&amp;quot;&amp;gt;${s.mode || 'html'} • ${new Date(s.date).toLocaleDateString('pt-BR')} ${new Date(s.date).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}&amp;lt;/div&amp;gt;
      &amp;lt;/div&amp;gt;
      &amp;lt;div class=&amp;quot;snippet-actions&amp;quot;&amp;gt;
        &amp;lt;button class=&amp;quot;btn-icon&amp;quot; onclick=&amp;quot;event.stopPropagation();renameProject('${s.id}')&amp;quot; title=&amp;quot;Renomear&amp;quot;&amp;gt;✏️&amp;lt;/button&amp;gt;
        &amp;lt;button class=&amp;quot;btn-icon&amp;quot; onclick=&amp;quot;event.stopPropagation();deleteProject('${s.id}')&amp;quot; title=&amp;quot;Excluir&amp;quot;&amp;gt;🗑️&amp;lt;/button&amp;gt;
      &amp;lt;/div&amp;gt;
    &amp;lt;/div&amp;gt;
  `).join('');
}

function loadProject(id) {
  const projects = getProjects();
  const p = projects.find(x =&amp;gt; x.id === id);
  if (!p) return;
  
  Object.assign(state, {
    title: p.title,
    mode: p.mode || 'html',
    html: p.html || '',
    css: p.css || '',
    js: p.js || '',
    jsx: p.jsx || '',
    python: p.python || ''
  });
  
  titleInput.value = state.title;
  switchMode(state.mode);
  closeSavedModal();
  showToast('📂 &amp;quot;' + p.title + '&amp;quot; carregado!');
}

function deleteProject(id) {
  if (!confirm('Excluir este projeto?')) return;
  const projects = getProjects().filter(s =&amp;gt; s.id !== id);
  setProjects(projects);
  renderSavedList();
  showToast('🗑️ Projeto excluído!');
}

function renameProject(id) {
  const projects = getProjects();
  const p = projects.find(x =&amp;gt; x.id === id);
  if (!p) return;
  const newName = prompt('Novo nome:', p.title);
  if (newName &amp;amp;&amp;amp; newName.trim()) {
    p.title = newName.trim();
    setProjects(projects);
    renderSavedList();
    showToast('✏️ Renomeado!');
  }
}

function askAI() {

    showToast('⚠️ Digite uma pergunta primeiro');

  const responseDiv = document.getElementById('aiResponse');

  // Simulate AI response (replace with real API call)
  setTimeout(() =&amp;gt; {
    const mockResponse = `🤖 Resposta da IA:\n\nPara &amp;quot;${prompt}&amp;quot;, aqui está uma sugestão:\n\n// Exemplo de código\nconst elemento = document.querySelector('.minha-div');\nelemento.style.display = 'flex';\nelemento.style.justifyContent = 'center';\nelemento.style.alignItems = 'center';\n\n💡 Dica: Você também pode usar Flexbox ou Grid para centralização mais robusta!\n\n⚠️ Nota: Esta é uma resposta simulada. Para respostas reais, integre uma API de IA (OpenAI, Claude, Gemini, etc).`;

function escapeHtml(str) {
  return str.replace(/&amp;amp;/g,'&amp;amp;amp;').replace(/&amp;lt;/g,'&amp;amp;lt;').replace(/&amp;gt;/g,'&amp;amp;gt;').replace(/&amp;quot;/g,'&amp;amp;quot;');
}

function showToast(msg) {

}

  });
});

    &amp;lt;div style=&amp;quot;display:flex;gap:8px;margin-bottom:12px;&amp;quot;&amp;gt;
      &amp;lt;input type=&amp;quot;number&amp;quot; id=&amp;quot;gotoLineInput&amp;quot; class=&amp;quot;form-input&amp;quot; placeholder=&amp;quot;Número da linha...&amp;quot; min=&amp;quot;1&amp;quot; style=&amp;quot;flex:1;&amp;quot; /&amp;gt;
      &amp;lt;button class=&amp;quot;btn btn-primary&amp;quot; onclick=&amp;quot;gotoLine()&amp;quot;&amp;gt;Ir&amp;lt;/button&amp;gt;

    &amp;lt;p style=&amp;quot;font-size:11px;color:var(--text2);&amp;quot;&amp;gt;Dica: Use &amp;lt;strong&amp;gt;Ctrl+G&amp;lt;/strong&amp;gt;&amp;lt;/p&amp;gt;

&amp;lt;script&amp;gt;
// ========== STATE ==========
const LS_KEY = 'playground-projects-v3';
const AUTOSAVE_KEY = 'playground-autosave-v3';
const SETTINGS_KEY = 'playground-ai-settings-v3';

let state = {
  mode: 'html',
  activeTab: 'html',
  html: `&amp;lt;div style=&amp;quot;max-width:600px;margin:40px auto;padding:20px;font-family:sans-serif;&amp;quot;&amp;gt;
  &amp;lt;h1 style=&amp;quot;color:#333;&amp;quot;&amp;gt;Bem-vindo ao Playground Pro&amp;lt;/h1&amp;gt;
  &amp;lt;p style=&amp;quot;color:#666;margin:16px 0;&amp;quot;&amp;gt;Cole seu código HTML aqui!&amp;lt;/p&amp;gt;
  &amp;lt;button onclick=&amp;quot;alert('Funcionou!')&amp;quot; style=&amp;quot;padding:10px 24px;font-size:16px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer;&amp;quot;&amp;gt;Clique&amp;lt;/button&amp;gt;
&amp;lt;/div&amp;gt;`,
  css: '',
  js: `console.log(&amp;quot;Hello from Playground Pro!&amp;quot;);`,
  jsx: `function App() {\n  const [count, setCount] = React.useState(0);\n  return (\n    &amp;lt;div style={{padding:40,textAlign:'center'}}&amp;gt;\n      &amp;lt;h1&amp;gt;⚛️ React&amp;lt;/h1&amp;gt;\n      &amp;lt;p&amp;gt;Contador: {count}&amp;lt;/p&amp;gt;\n      &amp;lt;button onClick={() =&amp;gt; setCount(count + 1)}&amp;gt;+&amp;lt;/button&amp;gt;\n    &amp;lt;/div&amp;gt;\n  );\n}`,
  python: `print(&amp;quot;Hello from Python!&amp;quot;)`,
  title: 'Sem titulo',
  editorState: 'normal',
  currentLine: 1
};

let aiSettings = {
  provider: 'openai',
  apiKey: '',
  enableWebSearch: false,
  enableTTS: false
};

// Load saved data
try {
  const saved = localStorage.getItem(AUTOSAVE_KEY);
  if (saved) Object.assign(state, JSON.parse(saved));
  
  const savedSettings = localStorage.getItem(SETTINGS_KEY);
  if (savedSettings) Object.assign(aiSettings, JSON.parse(savedSettings));
} catch(e) {}

// ========== DOM REFS ==========
const editor = document.getElementById('editor');
const previewFrame = document.getElementById('previewFrame');
const lineNumbers = document.getElementById('lineNumbers');
const titleInput = document.getElementById('projectTitle');
const editorPanel = document.getElementById('editorPanel');
const previewPanel = document.getElementById('previewPanel');
const fileInput = document.getElementById('fileInput');

// ========== INIT ==========
titleInput.value = state.title;
updateTabs();
loadEditorContent();
updatePreview();
updateAIButton();

// ========== EDITOR EVENTS ==========
editor.addEventListener('input', () =&amp;gt; {
  saveCurrentTab();
  updateLineNumbers();
  updateCursorPosition();
  autoSave();
  debouncePreview();
});

editor.addEventListener('scroll', () =&amp;gt; {
  lineNumbers.scrollTop = editor.scrollTop;
});

editor.addEventListener('click', updateCursorPosition);
editor.addEventListener('keyup', updateCursorPosition);

editor.addEventListener('keydown', (e) =&amp;gt; {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + 2;
    saveCurrentTab();
  }
  
  if ((e.ctrlKey || e.metaKey) &amp;amp;&amp;amp; e.key === 'g') {
    e.preventDefault();
    openGotoLine();
  }
  
  if ((e.ctrlKey || e.metaKey) &amp;amp;&amp;amp; e.key === 's') {
    e.preventDefault();
    saveToLocal();
  }
});

titleInput.addEventListener('input', () =&amp;gt; {
  state.title = titleInput.value;
  autoSave();
});

// ========== LINE NUMBERS ==========
function updateLineNumbers() {
  const lines = editor.value.split('\n');
  const totalLines = lines.length;
  document.getElementById('lineCount').textContent = totalLines + ' linhas';
  
  lineNumbers.innerHTML = lines.map((_, i) =&amp;gt; {
    const lineNum = i + 1;
    const isCurrent = lineNum === state.currentLine;
    return `&amp;lt;div class=&amp;quot;line ${isCurrent ? 'current' : ''}&amp;quot; onclick=&amp;quot;jumpToLine(${lineNum})&amp;quot;&amp;gt;${lineNum}&amp;lt;/div&amp;gt;`;
  }).join('');
}

function updateCursorPosition() {
  const pos = editor.selectionStart;
  const textBefore = editor.value.substring(0, pos);
  const lines = textBefore.split('\n');
  const line = lines.length;
  const col = lines[lines.length - 1].length + 1;
  
  state.currentLine = line;
  document.getElementById('cursorPos').textContent = `Ln ${line}, Col ${col}`;
  updateLineNumbers();
}

function jumpToLine(lineNum) {
  const lines = editor.value.split('\n');
  let pos = 0;
  for (let i = 0; i &amp;lt; lineNum - 1 &amp;amp;&amp;amp; i &amp;lt; lines.length; i++) {
    pos += lines[i].length + 1;
  }
  editor.focus();
  editor.setSelectionRange(pos, pos);
  updateCursorPosition();
}

function openGotoLine() {
  document.getElementById('gotoModal').classList.add('open');
  setTimeout(() =&amp;gt; {
    const input = document.getElementById('gotoLineInput');
    input.value = '';
    input.max = editor.value.split('\n').length;
    input.focus();
  }, 100);
}

function closeGotoLine() {
  document.getElementById('gotoModal').classList.remove('open');
}

function gotoLine() {
  const lineNum = parseInt(document.getElementById('gotoLineInput').value);
  if (lineNum &amp;amp;&amp;amp; lineNum &amp;gt; 0) {
    jumpToLine(lineNum);
    closeGotoLine();
    showToast(`📍 Linha ${lineNum}`);
  }
}

// ========== TABS &amp;amp; MODES ==========
function saveCurrentTab() {
  const tab = state.activeTab;
  if (state.mode === 'react' &amp;amp;&amp;amp; tab === 'jsx') state.jsx = editor.value;
  else if (state.mode === 'python' &amp;amp;&amp;amp; tab === 'python') state.python = editor.value;
  else if (tab === 'html') state.html = editor.value;
  else if (tab === 'css') state.css = editor.value;
  else if (tab === 'js') state.js = editor.value;
}

function loadEditorContent() {
  const tab = state.activeTab;
  if (state.mode === 'react' &amp;amp;&amp;amp; tab === 'jsx') editor.value = state.jsx;
  else if (state.mode === 'python' &amp;amp;&amp;amp; tab === 'python') editor.value = state.python;
  else if (tab === 'html') editor.value = state.html;
  else if (tab === 'css') editor.value = state.css;
  else if (tab === 'js') editor.value = state.js;
  else editor.value = '';
  updateLineNumbers();
  updateCursorPosition();
}

function switchTab(tab) {
  saveCurrentTab();
  state.activeTab = tab;
  document.querySelectorAll('.tab').forEach(t =&amp;gt; t.classList.remove('active'));
  const tabEl = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));

&amp;lt;script src=&amp;quot;https://unpkg.com/@babel/standalone/babel.min.js&amp;quot;&amp;gt;&amp;lt;\/script&amp;gt;
&amp;lt;style&amp;gt;*{box-sizing:border-box;}body{margin:0;font-family:sans-serif;}${state.css}&amp;lt;/style&amp;gt;
&amp;lt;/head&amp;gt;&amp;lt;body&amp;gt;&amp;lt;div id=&amp;quot;root&amp;quot;&amp;gt;&amp;lt;/div&amp;gt;
&amp;lt;script type=&amp;quot;text/babel&amp;quot;&amp;gt;
const { useState, useEffect, useRef } = React;
${state.jsx}
try {
  const _root = ReactDOM.createRoot(document.getElementById('root'));
  _root.render(&amp;lt;App /&amp;gt;);
} catch(e) {
  document.getElementById('root').innerHTML = '&amp;lt;div style=&amp;quot;color:red;padding:20px&amp;quot;&amp;gt;Erro: '+e.message+'&amp;lt;/div&amp;gt;';
}
&amp;lt;\/script&amp;gt;&amp;lt;/body&amp;gt;&amp;lt;/html&amp;gt;`;
  }
  
  if (state.mode === 'python') {
    const escapedCode = state.python.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/&amp;lt;\/script&amp;gt;/g,'&amp;lt;\\/script&amp;gt;');
    return `&amp;lt;!DOCTYPE html&amp;gt;
&amp;lt;html&amp;gt;&amp;lt;head&amp;gt;&amp;lt;meta charset=&amp;quot;UTF-8&amp;quot;&amp;gt;
&amp;lt;style&amp;gt;body{margin:0;background:#0f172a;color:#e2e8f0;font-family:monospace;padding:20px;}#output{white-space:pre-wrap;}&amp;lt;/style&amp;gt;
&amp;lt;/head&amp;gt;&amp;lt;body&amp;gt;
&amp;lt;div id=&amp;quot;output&amp;quot;&amp;gt;⟳ Carregando Python...&amp;lt;/div&amp;gt;
&amp;lt;script src=&amp;quot;https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js&amp;quot;&amp;gt;&amp;lt;\/script&amp;gt;
&amp;lt;script&amp;gt;
async function main() {
  const out = document.getElementById('output');
  try {
    const pyodide = await loadPyodide();
    out.innerHTML = '';
    pyodide.runPython('import sys; from io import StringIO; sys.stdout = StringIO()');
    pyodide.runPython(\`${escapedCode}\`);
    const stdout = pyodide.runPython('sys.stdout.getvalue()');
    out.textContent = stdout || '(sem output)';
  } catch(e) {
    out.innerHTML = '&amp;lt;span style=&amp;quot;color:#f87171&amp;quot;&amp;gt;Erro: ' + e.message + '&amp;lt;/span&amp;gt;';
  }
}
main();
&amp;lt;\/script&amp;gt;&amp;lt;/body&amp;gt;&amp;lt;/html&amp;gt;`;
  }
  
  const lower = state.html.trim().toLowerCase();
  const isComplete = lower.includes('&amp;lt;!doctype') || (lower.includes('&amp;lt;html') &amp;amp;&amp;amp; lower.includes('&amp;lt;/html&amp;gt;'));
  
  if (isComplete) return state.html;
  
  return `&amp;lt;!DOCTYPE html&amp;gt;
&amp;lt;html&amp;gt;&amp;lt;head&amp;gt;&amp;lt;meta charset=&amp;quot;UTF-8&amp;quot;&amp;gt;
&amp;lt;style&amp;gt;${state.css}&amp;lt;/style&amp;gt;
&amp;lt;/head&amp;gt;&amp;lt;body&amp;gt;

&amp;lt;script&amp;gt;${state.js}&amp;lt;\/script&amp;gt;

function downloadFile() {

fileInput.addEventListener('change', (e) =&amp;gt; {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) =&amp;gt; {
    const content = ev.target.result;
    const ext = file.name.split('.').pop().toLowerCase();
    const name = file.name.replace(/\.[^.]+$/, '');
    
    if (ext === 'py') {
      switchMode('python');
      state.python = content;
    } else if (ext === 'jsx' || ext === 'tsx') {
      switchMode('react');
      state.jsx = content;
    } else if (ext === 'css') {
      state.css = content;
      if (state.mode === 'html') switchTab('css');
    } else if (ext === 'js') {
      state.js = content;
      if (state.mode === 'html') switchTab('js');
    } else {
      const lower = content.trim().toLowerCase();
      if (lower.includes('&amp;lt;!doctype') || lower.includes('&amp;lt;html')) {
        const htmlMatch = content.match(/&amp;lt;body[^&amp;gt;]*&amp;gt;([\s\S]*)&amp;lt;\/body&amp;gt;/i);
        const cssMatch = content.match(/&amp;lt;style[^&amp;gt;]*&amp;gt;([\s\S]*?)&amp;lt;\/style&amp;gt;/i);
        const jsMatch = content.match(/&amp;lt;script[^&amp;gt;]*&amp;gt;([\s\S]*?)&amp;lt;\/script&amp;gt;/i);
        
        state.html = htmlMatch ? htmlMatch[1].trim() : content;
        state.css = cssMatch ? cssMatch[1].trim() : '';
        state.js = jsMatch ? jsMatch[1].trim() : '';
      } else {
        state.html = content;
      }
      switchMode('html');
    }
    
    state.title = name;
    titleInput.value = name;
    loadEditorContent();
    updatePreview();
    autoSave();
    showToast('📂 Importado!');
  };
  reader.readAsText(file);
  fileInput.value = '';
});

function toggleEditor() {

}

function renderSavedList() {
  const query = document.getElementById('searchInput').value.toLowerCase();

function loadProject(id) {
  const p = getProjects().find(x =&amp;gt; x.id === id);
  if (!p) return;
  
  Object.assign(state, {
    title: p.title,
    mode: p.mode || 'html',
    html: p.html || '',
    css: p.css || '',
    js: p.js || '',
    jsx: p.jsx || '',
    python: p.python || ''
  });
  
  titleInput.value = state.title;
  switchMode(state.mode);
  closeSavedModal();
  showToast('📂 Carregado!');
}

function deleteProject(id) {
  if (!confirm('Excluir?')) return;
  setProjects(getProjects().filter(s =&amp;gt; s.id !== id));
  renderSavedList();
  showToast('🗑️ Excluído!');
}

function renameProject(id) {
  const p = getProjects().find(x =&amp;gt; x.id === id);
  if (!p) return;
  const newName = prompt('Novo nome:', p.title);
  if (newName &amp;amp;&amp;amp; newName.trim()) {
    p.title = newName.trim();
    setProjects(getProjects());
    renderSavedList();
    showToast('✏️ Renomeado!');
  }
}

// ========== AI API CALLS ==========
async function callAI(prompt, useWebSearch) {
  const provider = aiSettings.provider;
  
  if (provider === 'openai') {
    return await callOpenAI(prompt, useWebSearch);
  } else if (provider === 'gemini') {
    return await callGemini(prompt, useWebSearch);
  } else if (provider === 'claude') {
    return await callClaude(prompt, useWebSearch);
  }
  
  throw new Error('Provedor não suportado');
}

async function callOpenAI(prompt, useWebSearch) {
  const messages = [
    {
      role: 'system',
      content: 'Você é um assistente de programação especializado em HTML, CSS, JavaScript, React e Python. Seja direto e prático.'
    },
    {
      role: 'user',
      content: prompt
    }
  ];
  
  // Se busca web estiver ativada, adiciona contexto
  if (useWebSearch) {
    try {
      const searchResults = await searchWeb(prompt);
      messages[0].content += `\n\nInformações da web: ${searchResults}`;
    } catch(e) {
      console.warn('Busca web falhou:', e);
    }
  }
  
  const response = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${aiSettings.apiKey}`
    },
    body: JSON.stringify({
      model: 'gpt-4o-mini', // Modelo mais barato e rápido
      messages: messages,
      temperature: 0.7,
      max_tokens: 1000
    })
  });
  
  if (!response.ok) {
    const error = await response.json();
    throw new Error(error.error?.message || 'Erro na API OpenAI');
  }
  
  const data = await response.json();
  return data.choices[0].message.content;
}

async function callGemini(prompt, useWebSearch) {
  let fullPrompt = prompt;
  
  if (useWebSearch) {
    try {
      const searchResults = await searchWeb(prompt);
      fullPrompt = `Contexto da web: ${searchResults}\n\nPergunta: ${prompt}`;
    } catch(e) {
      console.warn('Busca web falhou:', e);
    }
  }
  
  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${aiSettings.apiKey}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      contents: [{
        parts: [{
          text: fullPrompt
        }]
      }]
    })
  });
  
  if (!response.ok) {
    const error = await response.json();
    throw new Error(error.error?.message || 'Erro na API Gemini');
  }
  
  const data = await response.json();
  return data.candidates[0].content.parts[0].text;
}

async function callClaude(prompt, useWebSearch) {
  let fullPrompt = prompt;
  
  if (useWebSearch) {

// ========== WEB SEARCH ==========
async function searchWeb(query) {
  // Usando DuckDuckGo Instant Answer API (gratuita, sem API key)
  try {
    const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&amp;amp;format=json&amp;amp;no_html=1&amp;amp;skip_disambig=1`);
    const data = await response.json();
    
    let results = '';
    if (data.AbstractText) results += data.AbstractText + '\n';
    if (data.RelatedTopics &amp;amp;&amp;amp; data.RelatedTopics.length &amp;gt; 0) {
      results += data.RelatedTopics.slice(0, 3).map(t =&amp;gt; t.Text).filter(Boolean).join('\n');
    }
    
    return results || 'Nenhum resultado encontrado';
  } catch(e) {
    console.error('Erro na busca:', e);
    return '';
  }
}
// ========== TEXT-TO-SPEECH ==========
function speakText(text) {
  if (!window.speechSynthesis) {
    console.warn('TTS não suportado neste navegador');
    return;
  }
  
  // Cancela qualquer fala anterior
  window.speechSynthesis.cancel();
  
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'pt-BR';
  utterance.rate = 1.0;
  utterance.pitch = 1.0;
  utterance.volume = 1.0;
  
  // Tenta usar uma voz em português
  const voices = window.speechSynthesis.getVoices();
  const ptVoice = voices.find(v =&amp;gt; v.lang.startsWith('pt'));
  if (ptVoice) utterance.voice = ptVoice;
  
  window.speechSynthesis.speak(utterance);
  showToast('🔊 Reproduzindo áudio...');
}

// Carrega vozes disponíveis
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = () =&amp;gt; {
    window.speechSynthesis.getVoices();
  };
}

// ========== UTILS ==========
function escapeHtml(str) {
  return str.replace(/&amp;amp;/g,'&amp;amp;amp;').replace(/&amp;lt;/g,'&amp;amp;lt;').replace(/&amp;gt;/g,'&amp;amp;gt;').replace(/&amp;quot;/g,'&amp;amp;quot;');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() =&amp;gt; toast.classList.remove('show'), 2800);
}
