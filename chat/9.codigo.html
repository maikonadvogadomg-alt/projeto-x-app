        ollama:      ['llama3.2','codellama','mistral','phi3','qwen2.5-coder','deepseek-coder-v2']
    };

    function onChange() {
        updateSelect();
    }

    function updateSelect() {
        const provider = document.getElementById('aiProvider').value;
        const sel = document.getElementById('modelSelect');
        const models = MODELS[provider] || [];
        sel.innerHTML = models.map(m =&gt; `&lt;option value=&quot;${m}&quot;&gt;${m}&lt;/option&gt;`).join('');
        if (STATE.settings.provider === provider &amp;&amp; STATE.settings.model) {
            if (models.includes(STATE.settings.model)) sel.value = STATE.settings.model;
        }
    }

    function current() {
        return {
            provider: document.getElementById('aiProvider').value,
            model:    document.getElementById('modelSelect').value
        };
    }

    return { onChange, updateSelect, current, MODELS };
})();

/* ============================================================
   MÓDULO: STORAGE (localStorage)
   ============================================================ */
const MODULE_Storage = (() =&gt; {
    const KEY = 'aiStudio_v1';

    function save() {
        try {
            localStorage.setItem(KEY, JSON.stringify({
                conversations: STATE.conversations,
                activeConvId:  STATE.activeConvId,
                codeTabs:      STATE.codeTabs,
                activeCodeTab: STATE.activeCodeTab,
                memories:      STATE.memories,
                settings:      STATE.settings,
                _version:      STATE._version
            }));
        } catch(e) {
            MODULE_UI.toast('⚠️ Erro ao salvar (storage cheio?)', 'error');
        }
    }

    function load() {
        try {
            const raw = localStorage.getItem(KEY);
            if (!raw) return;
            const d = JSON.parse(raw);
            STATE.conversations = d.conversations || {};
            STATE.activeConvId  = d.activeConvId  || null;
            STATE.codeTabs      = d.codeTabs       || [];
            STATE.activeCodeTab = d.activeCodeTab  || 0;
            STATE.memories      = d.memories       || [];
            if (d.settings) STATE.settings = { ...STATE.settings, ...d.settings };
        } catch(e) {
            console.error('Erro ao carregar storage:', e);
        }
    }

    function setupAutoSave() {
        if (STATE._autoSaveTimer) clearInterval(STATE._autoSaveTimer);
        const sec = parseInt(STATE.settings.autoSaveInterval) || 0;
        if (sec &gt; 0) {
            STATE._autoSaveTimer = setInterval(() =&gt; {
                save();
                MODULE_UI.toast('💾 Auto-saved', 'success');
            }, sec * 1000);
        }
    }

    function exportAll() {
        const data = {
            exportedAt:    new Date().toISOString(),
            conversations: STATE.conversations,
            codeTabs:      STATE.codeTabs,
            memories:      STATE.memories,
            settings:      { ...STATE.settings, apiKey:'***', anthropicKey:'***', geminiKey:'***', serperKey:'***' },
            _version:      STATE._version
        };
        _download(JSON.stringify(data, null, 2), `ai-studio-backup-${Date.now()}.json`, 'application/json');
        MODULE_UI.toast('💾 Backup exportado!', 'success');
    }

    function importBackup() {
        document.getElementById('fileImportBackup').click();
    }

    function handleImport(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev =&gt; {
            try {
                const d = JSON.parse(ev.target.result);
                if (d.conversations) STATE.conversations = { ...STATE.conversations, ...d.conversations };
                if (d.memories)      STATE.memories      = [...STATE.memories, ...d.memories];
                if (d.codeTabs)      STATE.codeTabs      = [...STATE.codeTabs, ...d.codeTabs];
                save();
                MODULE_Chat.renderConversations();
                MODULE_Brain.render();
                MODULE_Code.renderTabs();
                MODULE_UI.toast('✅ Backup importado!', 'success');
            } catch(err) {
                MODULE_UI.toast('❌ Arquivo inválido', 'error');
            }
        };
        reader.readAsText(file);
        e.target.value = '';
    }

    function _download(content, filename, type) {
        const blob = new Blob([content], { type });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
    }

    return { save, load, setupAutoSave, exportAll, importBackup, handleImport, _download };
})();

/* ============================================================
   MÓDULO: CÉREBRO / MEMÓRIA 🧠
   ============================================================ */
const MODULE_Brain = (() =&gt; {

    function toggle() {
        const panel = document.getElementById('brainPanel');
        panel.classList.toggle('open');
        if (panel.classList.contains('open')) render();
    }

    function render() {
        const container = document.getElementById('brainContent');
        if (!STATE.memories.length) {
            container.innerHTML = '&lt;p style=&quot;font-size:12px;color:var(--text2);text-align:center;padding:20px&quot;&gt;Nenhuma memória salva.&lt;br&gt;As memórias ajudam a IA a lembrar&lt;br&gt;de contextos entre conversas.&lt;/p&gt;';
            return;
        }

        // Mostra as mais recentes primeiro
        const sorted = [...STATE.memories].sort((a, b) =&gt; b.createdAt - a.createdAt);
        container.innerHTML = sorted.map((m, i) =&gt; `
            &lt;div class=&quot;memory-item&quot;&gt;
                &lt;span class=&quot;mem-del&quot; onclick=&quot;MODULE_Brain.deleteMemory('${m.id}')&quot;&gt;✕&lt;/span&gt;
                &lt;div&gt;
                    &lt;span class=&quot;memory-tag ${m.type}&quot;&gt;${m.type}&lt;/span&gt;
                    ${(m.tags||[]).map(t =&gt; `&lt;span class=&quot;memory-tag&quot;&gt;${t}&lt;/span&gt;`).join('')}
                &lt;/div&gt;
                &lt;div style=&quot;margin-top:5px&quot;&gt;${escapeHtml(m.content.substring(0, 200))}${m.content.length &gt; 200 ? '...' : ''}&lt;/div&gt;
                &lt;div class=&quot;mem-time&quot;&gt;${new Date(m.createdAt).toLocaleString('pt-BR')}&lt;/div&gt;
            &lt;/div&gt;
        `).join('');
    }

    function addManual() {
        document.getElementById('memoryContent').value = '';
        document.getElementById('memoryTags').value = '';
        document.getElementById('memoryType').value = 'context';
        document.getElementById('memoryModal').classList.add('open');
    }

    function closeMemoryModal() {
        document.getElementById('memoryModal').classList.remove('open');
    }

    function saveManual() {
        const content = document.getElementById('memoryContent').value.trim();
        if (!content) { MODULE_UI.toast('Conteúdo vazio!', 'error'); return; }
        const tags = document.getElementById('memoryTags').value
            .split(',').map(t =&gt; t.trim()).filter(Boolean);
        const type = document.getElementById('memoryType').value;
        addMemory(content, type, tags);
        closeMemoryModal();
        render();
        MODULE_UI.toast('🧠 Memória salva!', 'success');
    }

    function addMemory(content, type = 'context', tags = [], source = 'manual') {
        const mem = {
            id:        'mem_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
            content,
            type,
            tags,
            source,    // 'manual' | 'auto' | 'chat'
            createdAt: Date.now()
        };
        STATE.memories.unshift(mem);
        // Limita a 200 memórias para não explodir o storage
        if (STATE.memories.length &gt; 200) STATE.memories = STATE.memories.slice(0, 200);
        MODULE_Storage.save();
        return mem;
    }

    function deleteMemory(id) {
        STATE.memories = STATE.memories.filter(m =&gt; m.id !== id);
        MODULE_Storage.save();
        render();
    }

    function clearAll() {
        if (!confirm('Limpar TODAS as memórias? Isso não pode ser desfeito.')) return;
        STATE.memories = [];
        MODULE_Storage.save();
        render();
        MODULE_UI.toast('🗑️ Memórias limpas', 'success');
    }

    // Retorna as N memórias mais recentes formatadas para injetar no contexto
    function getContextBlock() {
        const n = parseInt(STATE.settings.memoryInjectCount) || 5;
        if (n === 0 || !STATE.memories.length) return '';
        const recent = STATE.memories.slice(0, n);
        const lines = recent.map(m =&gt;
            `[${m.type.toUpperCase()}] ${m.content.substring(0, 300)}`
        ).join('\n---\n');
        return `\n\n🧠 MEMÓRIAS RECENTES (${recent.length}):\n${lines}`;
    }

    // Salva resumo da conversa como memória ao iniciar novo chat
    function saveConvAsMemory(conv) {
        if (!conv || !conv.messages || conv.messages.length &lt; 2) return;
        const userMsgs = conv.messages.filter(m =&gt; m.role === 'user').slice(-3);
        const summary = `Conversa: &quot;${conv.title}&quot;\nTópicos: ${userMsgs.map(m =&gt; m.content.substring(0,100)).join(' | ')}`;
        addMemory(summary, 'context', ['auto', 'conversa'], 'auto');
    }

    function exportMemory() {
        const data = JSON.stringify({ memories: STATE.memories, exportedAt: new Date().toISOString() }, null, 2);
        MODULE_Storage._download(data, `memorias-${Date.now()}.json`, 'application/json');
        MODULE_UI.toast('💾 Memórias exportadas!', 'success');
    }

    function importMemory() {
        document.getElementById('fileImportMemory').click();
    }

    function handleImport(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev =&gt; {
            try {
                const d = JSON.parse(ev.target.result);
                const mems = d.memories || d;
                if (Array.isArray(mems)) {
                    STATE.memories = [...mems, ...STATE.memories];
                    MODULE_Storage.save();
                    render();
                    MODULE_UI.toast(`✅ ${mems.length} memórias importadas!`, 'success');
                }
            } catch(err) {
                MODULE_UI.toast('❌ Arquivo inválido', 'error');
            }
        };
        reader.readAsText(file);
        e.target.value = '';
    }

    return {
        toggle, render, addManual, closeMemoryModal, saveManual,
        addMemory, deleteMemory, clearAll, getContextBlock,
        saveConvAsMemory, exportMemory, importMemory, handleImport
    };
})();

/* ============================================================
   MÓDULO: CHAT
   ============================================================ */
const MODULE_Chat = (() =&gt; {

    function confirmNewChat() {
        const conv = STATE.conversations[STATE.activeConvId];
        // Se não tem conversa ativa ou está vazia, cria direto
        if (!conv || !conv.messages || conv.messages.length === 0) {
            _createNew();
            return;
        }
        document.getElementById('newChatModal').classList.add('open');
    }

    function closeNewChatModal() {
        document.getElementById('newChatModal').classList.remove('open');
    }

    function newChatAction(action) {
        closeNewChatModal();
        const conv = STATE.conversations[STATE.activeConvId];

        if (action === 'save' || action === 'both') {
            // Já está salvo automaticamente, apenas confirma
            MODULE_UI.toast('💾 Conversa salva!', 'success');
        }
        if (action === 'memory' || action === 'both') {
            MODULE_Brain.saveConvAsMemory(conv);
            MODULE_UI.toast('🧠 Memória criada!', 'success');
        }
        // 'discard' apenas cria novo sem fazer nada

        _createNew();
    }

    function _createNew() {
        const id = 'conv_' + Date.now();
        STATE.conversations[id] = {
            id,
            title:     'Nova Conversa',
            messages:  [],
            createdAt: Date.now(),
            provider:  MODULE_Provider.current().provider,
            model:     MODULE_Provider.current().model
        };
        STATE.activeConvId = id;
        MODULE_Storage.save();
        renderConversations();
        _loadConv(id);
        MODULE_UI.toast('✅ Novo chat iniciado!', 'success');
    }

    function _loadConv(id) {
        STATE.activeConvId = id;
        const conv = STATE.conversations[id];
        if (!conv) return;
        document.getElementById('convTitleEdit').value = conv.title;
        renderMessages(conv.messages);
        MODULE_Context.updateBar(conv.messages);
        renderConversations();
    }

    function renameConv(title) {
        const conv = STATE.conversations[STATE.activeConvId];
        if (!conv || !title.trim()) return;
        conv.title = title.trim();
        renderConversations();
        MODULE_Storage.save();
    }

    function deleteConv(id, e) {
        e.stopPropagation();
        if (!confirm('Deletar esta conversa?')) return;
        delete STATE.conversations[id];
        if (STATE.activeConvId === id) {
            const keys = Object.keys(STATE.conversations);
            if (keys.length &gt; 0) _loadConv(keys[keys.length - 1]);
            else _createNew();
        }
        MODULE_Storage.save();
        renderConversations();
    }

    function renderConversations() {
        const list = document.getElementById('convList');
        list.innerHTML = '';
        const convs = Object.values(STATE.conversations)
            .sort((a, b) =&gt; b.createdAt - a.createdAt);
        convs.forEach(conv =&gt; {
            const div = document.createElement('div');
            div.className = 'conv-item' + (conv.id === STATE.activeConvId ? ' active' : '');
            div.innerHTML = `
                &lt;div style=&quot;flex:1;overflow:hidden&quot;&gt;
                    &lt;div class=&quot;conv-title&quot;&gt;${escapeHtml(conv.title)}&lt;/div&gt;
                    &lt;div class=&quot;conv-meta&quot;&gt;${conv.messages?.length || 0} msgs&lt;/div&gt;
                &lt;/div&gt;
                &lt;span class=&quot;conv-delete&quot; onclick=&quot;MODULE_Chat.deleteConv('${conv.id}',event)&quot;&gt;✕&lt;/span&gt;
            `;
            div.onclick = (e) =&gt; {
                if (e.target.classList.contains('conv-delete')) return;
                _loadConv(conv.id);
            };
            list.appendChild(div);
        });
    }

    function renderMessages(messages) {
        const container = document.getElementById('messages');
        container.innerHTML = '';
        (messages || []).forEach(msg =&gt; _appendMsg(msg));
        container.scrollTop = container.scrollHeight;
    }

    function _appendMsg(msg) {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        const roleClass = msg.role === 'user' ? 'user'
                        : msg.role === 'system' ? 'system-msg'
                        : msg.role === 'memory' ? 'memory-msg'
                        : 'ai';
        const emoji = msg.role === 'user' ? '👤'
                    : msg.role === 'system' ? '⚙️'
                    : msg.role === 'memory' ? '🧠'
                    : '🤖';
        div.className = `message ${roleClass}`;
        const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString('pt-BR') : '';
        div.innerHTML = `
            &lt;div class=&quot;avatar&quot;&gt;${emoji}&lt;/div&gt;
            &lt;div class=&quot;bubble&quot;&gt;
                ${formatMessage(msg.content)}
                ${time ? `&lt;div class=&quot;msg-time&quot;&gt;${time}&lt;/div&gt;` : ''}
            &lt;/div&gt;
        `;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        return div;
    }

    function _addLoadingMsg() {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = 'message ai';
        div.innerHTML = `&lt;div class=&quot;avatar&quot;&gt;🤖&lt;/div&gt;&lt;div class=&quot;bubble&quot;&gt;&lt;div class=&quot;typing&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        return div;
    }

    async function send() {
        if (STATE.isLoading) return;
        const input = document.getElementById('userInput');
        let text = input.value.trim();
        if (!text) return;

        const codeMode = document.getElementById('codeMode').checked;
        const codeContent = document.getElementById('codeEditor').value.trim();
        if (codeMode &amp;&amp; codeContent) {
            const lang = document.getElementById('codeLang').value;
            text += `\n\n**Código no editor:**\n\`\`\`${lang}\n${codeContent}\n\`\`\``;
        }

        const conv = STATE.conversations[STATE.activeConvId];
        if (!conv) { _createNew(); return; }

        const userMsg = { role: 'user', content: text, timestamp: Date.now() };
        conv.messages.push(userMsg);
        _appendMsg(userMsg);

        if (conv.messages.length === 1) {
            conv.title = text.substring(0, 45) + (text.length &gt; 45 ? '...' : '');
            document.getElementById('convTitleEdit').value = conv.title;
            renderConversations();
        }

        input.value = '';
        MODULE_UI.autoResize(input);
        MODULE_Context.updateBar(conv.messages);

        STATE.isLoading = true;
        document.getElementById('sendBtn').disabled = true;
        const loader = _addLoadingMsg();

        try {
            let webCtx = '';
            if (document.getElementById('webSearchCheck').checked) {
                webCtx = await MODULE_WebSearch.search(text);
            }

            const reply = await MODULE_AI.call(conv.messages, webCtx);
            loader.remove();

            const aiMsg = { role: 'assistant', content: reply, timestamp: Date.now() };
            conv.messages.push(aiMsg);
            _appendMsg(aiMsg);

            // Auto-extrai código para o editor
            if (codeMode) {
                const match = reply.match(/```(\w+)?\n?([\s\S]*?)```/);
                if (match) {
                    const clean = cleanCode(match[2]);
                    const tab = STATE.codeTabs[STATE.activeCodeTab];
                    if (tab) {
                        tab.content  = clean;
                        tab.language = match[1] || 'text';
                        document.getElementById('codeEditor').value = clean;
                        document.getElementById('codeLang').value = match[1] || 'text';
                        MODULE_UI.toast('💻 Código extraído para o editor!', 'success');
                    }
                }
            }

            MODULE_Context.updateBar(conv.messages);
            MODULE_Context.checkLimit(conv);
            MODULE_Storage.save();

        } catch(err) {
            loader.remove();
            const errMsg = { role: 'system', content: `❌ Erro: ${err.message}`, timestamp: Date.now() };
            conv.messages.push(errMsg);
            _appendMsg(errMsg);
            MODULE_UI.toast('❌ ' + err.message, 'error');
        }

        STATE.isLoading = false;
        document.getElementById('sendBtn').disabled = false;
    }

    return {
        confirmNewChat, closeNewChatModal, newChatAction,
        renameConv, deleteConv, renderConversations,
        renderMessages, send
    };
})();

/* ============================================================
   MÓDULO: CONTEXTO
   ============================================================ */
const MODULE_Context = (() =&gt; {

    function estimateTokens(messages) {
        return Math.ceil((messages || []).reduce((a, m) =&gt; a + (m.content?.length || 0), 0) / 4);
    }

    function updateBar(messages) {
        const tokens = estimateTokens(messages);
        const limit  = parseInt(STATE.settings.contextLimit) || 8000;
        const pct    = Math.min(100, (tokens / limit) * 100);
        document.getElementById('tokenCount').textContent = tokens.toLocaleString('pt-BR');
        const fill = document.getElementById('contextFill');
        fill.style.width      = pct + '%';
        fill.style.background = pct &gt; 80 ? 'var(--red)' : pct &gt; 55 ? 'var(--yellow)' : 'var(--green)';
    }

    function checkLimit(conv) {
        const tokens = estimateTokens(conv.messages);
        const limit  = parseInt(STATE.settings.contextLimit) || 8000;
        if (tokens &lt;= limit) return;
        const strategy = STATE.settings.contextStrategy;
        if (strategy === 'trim') {
            while (estimateTokens(conv.messages) &gt; limit &amp;&amp; conv.messages.length &gt; 4) {
                conv.messages.splice(0, 1);
            }
            MODULE_UI.toast('✂️ Contexto trimado', 'success');
        } else if (strategy === 'summarize') {
            summarize();
        } else {
            MODULE_UI.toast('⚠️ Limite de contexto atingido!', 'warn');
        }
    }

    function clear() {
        const conv = STATE.conversations[STATE.activeConvId];
        if (!conv) return;
        if (!confirm('Limpar contexto? As mensagens serão mantidas visualmente mas a IA não vai lembrar delas.')) return;
        conv.messages = [];
        MODULE_Chat.renderMessages([]);
        updateBar([]);
        MODULE_Storage.save();
        MODULE_UI.toast('✂️ Contexto limpo!', 'success');
    }

    async function summarize() {
        const conv = STATE.conversations[STATE.activeConvId];
        if (!conv || conv.messages.length &lt; 4) {
            MODULE_UI.toast('Poucas mensagens para resumir', 'error');
            return;
        }
        MODULE_UI.toast('📋 Resumindo...', 'success');
        const prompt = `Resuma esta conversa em bullet points técnicos concisos:\n\n${
            conv.messages.map(m =&gt; `${m.role}: ${m.content.substring(0,400)}`).join('\n')
        }`;
        try {
            const summary = await MODULE_AI.call([
                { role: 'system', content: 'Resuma conversas de forma concisa e técnica.' },
                { role: 'user',   content: prompt }
            ]);
            conv.messages = [{
                role: 'system',
                content: `📋 Resumo da conversa anterior:\n${summary}`,
                timestamp: Date.now()
            }];
            MODULE_Chat.renderMessages(conv.messages);
            updateBar(conv.messages);
            MODULE_Storage.save();
            MODULE_UI.toast('✅ Contexto resumido!', 'success');
                } catch(e) {
            MODULE_UI.toast('❌ Erro ao resumir: ' + e.message, 'error');
        }
    }

    // Monta as mensagens respeitando o limite de contexto
    function buildMessages(messages, webCtx) {
        const s = STATE.settings;
        let sysContent = s.systemPrompt ||
            'Você é um assistente especialista em programação. Gere código limpo, sem caracteres estranhos, comentado em português.';

        // Injeta memórias do cérebro
        sysContent += MODULE_Brain.getContextBlock();

        if (webCtx) sysContent += `\n\n🌐 RESULTADOS WEB:\n${webCtx}`;

        const sys = [{ role: 'system', content: sysContent }];
        const limit = parseInt(s.contextLimit) || 8000;
        let tokenCount = sysContent.length / 4;
        const filtered = [];

        for (let i = messages.length - 1; i &gt;= 0; i--) {
            const msg = messages[i];
            if (msg.role === 'system' || msg.role === 'memory') continue;
            const cost = (msg.content?.length || 0) / 4;
            if (tokenCount + cost &gt; limit &amp;&amp; filtered.length &gt; 0) break;
            tokenCount += cost;
            filtered.unshift({
                role:    msg.role === 'assistant' ? 'assistant' : 'user',
                content: msg.content
            });
        }

        return [...sys, ...filtered];
    }

    return { estimateTokens, updateBar, checkLimit, clear, summarize, buildMessages };
})();

/* ============================================================
   MÓDULO: AI (chamadas às APIs)
   ============================================================ */
const MODULE_AI = (() =&gt; {

    async function call(messages, webCtx = '') {
        const { provider, model } = MODULE_Provider.current();
        const s    = STATE.settings;
        const temp = parseFloat(document.getElementById('tempSlider').value);
        const maxT = parseInt(document.getElementById('maxTokens').value);
        const msgs = MODULE_Context.buildMessages(messages, webCtx);

        switch (provider) {
            case 'openai':      return await _openai(msgs, model, s.apiKey, temp, maxT);
            case 'anthropic':   return await _anthropic(msgs, model, s.anthropicKey, temp, maxT);
            case 'gemini':      return await _gemini(msgs, model, s.geminiKey, temp, maxT);
            case 'groq':        return await _groq(msgs, model, s.apiKey, temp, maxT);
            case 'openrouter':  return await _openrouter(msgs, model, s.apiKey, temp, maxT);
            case 'ollama':      return await _ollama(msgs, model, temp, maxT);
            default: throw new Error('Provider não suportado');
        }
    }

    async function _openai(messages, model, apiKey, temp, maxTokens) {
        if (!apiKey) throw new Error('API Key OpenAI não configurada! Vá em ⚙️ Config');
        const res = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type':  'application/json',
                'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({ model, messages, temperature: temp, max_tokens: maxTokens })
        });
        if (!res.ok) {
            const err = await res.json().catch(() =&gt; ({}));
            throw new Error(err.error?.message || `OpenAI HTTP ${res.status}`);
        }
        const data = await res.json();
        return data.choices[0].message.content;
    }

    async function _anthropic(messages, model, apiKey, temp, maxTokens) {
        if (!apiKey) throw new Error('API Key Anthropic não configurada! Vá em ⚙️ Config');
        const system = messages.find(m =&gt; m.role === 'system')?.content || '';
        const msgs   = messages.filter(m =&gt; m.role !== 'system');
        const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
                'Content-Type':      'application/json',
                'x-api-key':         apiKey,
                'anthropic-version': '2023-06-01'
            },
            body: JSON.stringify({ model, messages: msgs, system, temperature: temp, max_tokens: maxTokens })
        });
        if (!res.ok) {
            const err = await res.json().catch(() =&gt; ({}));
            throw new Error(err.error?.message || `Anthropic HTTP ${res.status}`);
        }
        const data = await res.json();
        return data.content[0].text;
    }

    async function _gemini(messages, model, apiKey, temp, maxTokens) {
        if (!apiKey) throw new Error('API Key Gemini não configurada! Vá em ⚙️ Config');
        const contents = messages
            .filter(m =&gt; m.role !== 'system')
            .map(m =&gt; ({
                role:  m.role === 'assistant' ? 'model' : 'user',
                parts: [{ text: m.content }]
            }));
        const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
            {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents,
                    generationConfig: { temperature: temp, maxOutputTokens: maxTokens }
                })
            }
        );
        if (!res.ok) {
            const err = await res.json().catch(() =&gt; ({}));
            throw new Error(err.error?.message || `Gemini HTTP ${res.status}`);
        }
        const data = await res.json();
        return data.candidates[0].content.parts[0].text;
    }

    async function _groq(messages, model, apiKey, temp, maxTokens) {
        if (!apiKey) throw new Error('API Key Groq não configurada! Vá em ⚙️ Config');
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type':  'application/json',
                'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify({ model, messages, temperature: temp, max_tokens: maxTokens })
        });
        if (!res.ok) {
            const err = await res.json().catch(() =&gt; ({}));
            throw new Error(err.error?.message || `Groq HTTP ${res.status}`);
        }
        const data = await res.json();
        return data.choices[0].message.content;
    }

    async function _openrouter(messages, model, apiKey, temp, maxTokens) {
        if (!apiKey) throw new Error('API Key OpenRouter não configurada! Vá em ⚙️ Config');
        const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type':  'application/json',
                'Authorization': `Bearer ${apiKey}`,
                'HTTP-Referer':  window.location.href,
                'X-Title':       'AI Code Studio'
            },
            body: JSON.stringify({ model, messages, temperature: temp, max_tokens: maxTokens })
        });
        if (!res.ok) {
            const err = await res.json().catch(() =&gt; ({}));
            throw new Error(err.error?.message || `OpenRouter HTTP ${res.status}`);
        }
        const data = await res.json();
        return data.choices[0].message.content;
    }

    async function _ollama(messages, model, temp, maxTokens) {
        const url = STATE.settings.ollamaUrl || 'http://localhost:11434';
        const res = await fetch(`${url}/api/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model,
                messages: messages.map(m =&gt; ({ role: m.role, content: m.content })),
                options:  { temperature: temp, num_predict: maxTokens },
                stream:   false
            })
        });
        if (!res.ok) throw new Error(`Ollama HTTP ${res.status} — servidor rodando?`);
        const data = await res.json();
        return data.message.content;
    }

    return { call };
})();

const MODULE_WebSearch = (() =&gt; {

    async function search(query) {
        const key = STATE.settings.serperKey;
        if (!key) {
            MODULE_UI.toast('⚠️ Configure a Serper Key em ⚙️ Config', 'warn');
            return '';
        }
        try {
            const res = await fetch('https://google.serper.dev/search', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json', 'X-API-KEY': key },
                body:    JSON.stringify({ q: query, num: 5, hl: 'pt' })
            });
            const data = await res.json();
            return (data.organic || []).slice(0, 5)
                .map(r =&gt; `**${r.title}**\n${r.snippet}\n${r.link}`)
                .join('\n\n');
        } catch(e) {
            MODULE_UI.toast('⚠️ Erro na busca web', 'warn');
            return '';
        }
    }

    return { search };
})();

/* ============================================================
   MÓDULO: CÓDIGO (editor + tabs)
   ============================================================ */
const MODULE_Code = (() =&gt; {

    function togglePanel() {
        document.getElementById('codePanel').classList.toggle('collapsed');
    }

    function newTab(name = null) {
        const tab = {
            id:       'tab_' + Date.now(),
            name:     name || `código_${STATE.codeTabs.length + 1}`,
            content:  '',
            language: 'javascript'
        };
        STATE.codeTabs.push(tab);
        STATE.activeCodeTab = STATE.codeTabs.length - 1;
        renderTabs();
        _loadTab(STATE.activeCodeTab);
        MODULE_Storage.save();
    }

    function renderTabs() {
        const container = document.getElementById('codeTabs');
        container.innerHTML = '';
        STATE.codeTabs.forEach((tab, i) =&gt; {
            const div = document.createElement('div');
            div.className = 'code-tab' + (i === STATE.activeCodeTab ? ' active' : '');
            div.innerHTML = `
                &lt;span onclick=&quot;MODULE_Code.switchTab(${i})&quot;&gt;${escapeHtml(tab.name)}&lt;/span&gt;
                &lt;span class=&quot;code-tab-close&quot; onclick=&quot;MODULE_Code.closeTab(${i},event)&quot;&gt;✕&lt;/span&gt;
            `;
            container.appendChild(div);
        });
    }

    function switchTab(i) {
        _saveCurrentTab();
        STATE.activeCodeTab = i;
        _loadTab(i);
        renderTabs();
    }

    function closeTab(i, e) {
        e.stopPropagation();
        if (STATE.codeTabs.length === 1) { MODULE_UI.toast('Mínimo 1 tab', 'error'); return; }
        STATE.codeTabs.splice(i, 1);
        if (STATE.activeCodeTab &gt;= STATE.codeTabs.length) STATE.activeCodeTab = STATE.codeTabs.length - 1;
        renderTabs();
        _loadTab(STATE.activeCodeTab);
        MODULE_Storage.save();
    }

    function _loadTab(i) {
        const tab = STATE.codeTabs[i];
        if (!tab) return;
        document.getElementById('codeEditor').value   = tab.content;
        document.getElementById('codeLang').value     = tab.language || 'javascript';
    }

    function _saveCurrentTab() {
        const tab = STATE.codeTabs[STATE.activeCodeTab];
        if (!tab) return;
        tab.content  = document.getElementById('codeEditor').value;
        tab.language = document.getElementById('codeLang').value;
    }

    function copyClean() {
        _saveCurrentTab();
        const code = cleanCode(document.getElementById('codeEditor').value);
        navigator.clipboard.writeText(code).then(() =&gt; {
            MODULE_UI.toast('✅ Código limpo copiado!', 'success');
        });
    }

    function sendToChat() {
        _saveCurrentTab();
        const code = document.getElementById('codeEditor').value.trim();
        const lang = document.getElementById('codeLang').value;
        if (!code) { MODULE_UI.toast('Editor vazio!', 'error'); return; }
        const input = document.getElementById('userInput');
        input.value = `Analise e melhore este código:\n\`\`\`${lang}\n${code}\n\`\`\``;
        MODULE_UI.autoResize(input);
        input.focus();
    }

    function clear() {
        if (!confirm('Limpar editor?')) return;
        document.getElementById('codeEditor').value = '';
        _saveCurrentTab();
    }

    function download() {
        _saveCurrentTab();
        const tab = STATE.codeTabs[STATE.activeCodeTab];
        const code = cleanCode(tab.content);
        const extMap = {
            javascript:'js', python:'py', html:'html', css:'css',
            typescript:'ts', java:'java', csharp:'cs', cpp:'cpp',
            php:'php', sql:'sql', rust:'rs', go:'go', bash:'sh', text:'txt'
        };
        const ext = extMap[tab.language] || 'txt';
        MODULE_Storage._download(code, `${tab.name}.${ext}`, 'text/plain');
        MODULE_UI.toast('⬇️ Download iniciado!', 'success');
    }

    async function pasteToEditor() {
        try {
            const text = await navigator.clipboard.readText();
            if (!text) { MODULE_UI.toast('Clipboard vazio', 'error'); return; }
            const looksLikeCode = /[{}();=&gt;&lt;\/\\]/.test(text) || /def |function |class |import /.test(text);
            if (looksLikeCode) {
                const toEditor = confirm('Parece código!\n\nOK = Colar no Editor\nCancelar = Colar no Chat');
                if (toEditor) {
                    document.getElementById('codeEditor').value = text;
                    _saveCurrentTab();
                    MODULE_UI.toast('✅ Colado no editor!', 'success');
                    return;
                }
            }
            const input = document.getElementById('userInput');
            input.value += text;
            MODULE_UI.autoResize(input);
            MODULE_UI.toast('✅ Colado no chat!', 'success');
        } catch(e) {
            MODULE_UI.toast('❌ Sem permissão para clipboard', 'error');
        }
    }

    function importFile() {
        document.getElementById('fileImportCode').click();
    }

    function handleFileImport(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev =&gt; {
            const extMap = {
                js:'javascript', py:'python', html:'html', css:'css',
                ts:'typescript', java:'java', cs:'csharp', cpp:'cpp',
                php:'php', sql:'sql', rs:'rust', go:'go', sh:'bash'
            };
            const ext  = file.name.split('.').pop().toLowerCase();
            const lang = extMap[ext] || 'text';
            newTab(file.name);
            const tab    = STATE.codeTabs[STATE.activeCodeTab];
            tab.content  = ev.target.result;
            tab.language = lang;
            document.getElementById('codeEditor').value = ev.target.result;
            document.getElementById('codeLang').value   = lang;
            renderTabs();
            MODULE_Storage.save();
            MODULE_UI.toast(`📂 ${file.name} importado!`, 'success');
        };
        reader.readAsText(file);
        e.target.value = '';
    }

    // Expõe _saveCurrentTab para uso externo
    function saveCurrentTab() { _saveCurrentTab(); }

    return {
        togglePanel, newTab, renderTabs, switchTab, closeTab,
        copyClean, sendToChat, clear, download,
        pasteToEditor, importFile, handleFileImport, saveCurrentTab
    };
})();

/* ============================================================
   MÓDULO: UI (helpers visuais)
   ============================================================ */
const MODULE_UI = (() =&gt; {

    function toast(msg, type = '') {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className   = `toast show ${type}`;
        clearTimeout(el._t);
        el._t = setTimeout(() =&gt; { el.className = 'toast'; }, 3000);
    }

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 180) + 'px';
    }

    function handleKey(e) {
        if (e.ctrlKey &amp;&amp; e.key === 'Enter') {
            e.preventDefault();
            MODULE_Chat.send();
        }
    }

    function togglePass(id) {
        const el = document.getElementById(id);
        el.type = el.type === 'password' ? 'text' : 'password';
    }

    return { toast, autoResize, handleKey, togglePass };
})();

/* ============================================================
   FUNÇÕES UTILITÁRIAS GLOBAIS
   ============================================================ */
function escapeHtml(text) {
    return String(text)
        .replace(/&amp;/g,'&amp;amp;')
        .replace(/&lt;/g,'&amp;lt;')
        .replace(/&gt;/g,'&amp;gt;')
        .replace(/&quot;/g,'&amp;quot;');
}

function cleanCode(code) {
    return String(code)
        .replace(/\r\n/g,'\n')
        .replace(/\r/g,'\n')
        .replace(/[\u200B-\u200D\uFEFF]/g,'')
        .replace(/\u00A0/g,' ')
        .replace(/[&quot;&quot;]/g,'&quot;')
        .replace(/['']/g,&quot;'&quot;)
        .replace(/…/g,'...')
        .trim();
}

function formatMessage(text) {
    text = String(text);
    // Blocos de código
    text = text.replace(/```(\w+)?\n?([\s\S]*?)```/g, (_, lang, code) =&gt; {
        const clean = escapeHtml(cleanCode(code.trim()));
        return `&lt;pre&gt;&lt;button class=&quot;copy-code-btn&quot; onclick=&quot;copyCodeBlock(this)&quot;&gt;📋 Copiar&lt;/button&gt;&lt;code class=&quot;lang-${lang||'code'}&quot;&gt;${clean}&lt;/code&gt;&lt;/pre&gt;`;
    });
    // Negrito
    text = text.replace(/\*\*(.*?)\*\*/g,'&lt;strong&gt;$1&lt;/strong&gt;');
    // Inline code
    text = text.replace(/`([^`]+)`/g,'&lt;code style=&quot;background:var(--bg3);padding:1px 5px;border-radius:3px;font-family:monospace&quot;&gt;$1&lt;/code&gt;');
    // Quebras de linha
    text = text.replace(/\n/g,'&lt;br&gt;');
    return text;
}

function copyCodeBlock(btn) {
    const code = cleanCode(btn.nextElementSibling.textContent);
    navigator.clipboard.writeText(code).then(() =&gt; {
        btn.textContent = '✅ Copiado!';
        setTimeout(() =&gt; btn.textContent = '📋 Copiar', 2000);
    });
}

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
function INIT() {
    MODULE_Storage.load();

    // Restaura UI das settings
    const s = STATE.settings;
    if (s.provider) document.getElementById('aiProvider').value = s.provider;
    if (s.maxTokens) document.getElementById('maxTokens').value = s.maxTokens;
    if (s.temperature) {
        document.getElementById('tempSlider').value = s.temperature;
        document.getElementById('tempVal').textContent = s.temperature;
    }

    MODULE_Provider.updateSelect();
    MODULE_Chat.renderConversations();
    MODULE_Brain.render();

    // Carrega conversa ativa ou cria nova
    if (STATE.activeConvId &amp;&amp; STATE.conversations[STATE.activeConvId]) {
        // Dispara loadConv via click na conversa ativa
        const conv = STATE.conversations[STATE.activeConvId];
        document.getElementById('convTitleEdit').value = conv.title;
        MODULE_Chat.renderMessages(conv.messages);
        MODULE_Context.updateBar(conv.messages);
    } else {
        MODULE_Chat.confirmNewChat();
    }

    // Tabs de código
    if (STATE.codeTabs.length === 0) {
        MODULE_Code.newTab();
    } else {
        MODULE_Code.renderTabs();
        // Carrega tab ativa
        const tab = STATE.codeTabs[STATE.activeCodeTab];
        if (tab) {
            document.getElementById('codeEditor').value = tab.content || '';
            document.getElementById('codeLang').value   = tab.language || 'javascript';
        }
    }

    MODULE_Storage.setupAutoSave();
    MODULE_UI.toast('🚀 AI Code Studio pronto!', 'success');
}

INIT();
