&lt;script&gt;
// ============================================================
// ESTADO GLOBAL
// ============================================================
let historico = [];

// ============================================================
// INICIALIZAÇÃO
// ============================================================
window.addEventListener('load', () =&gt; {
  carregarHistorico();
});

// ============================================================
// FUNÇÕES BÁSICAS
// ============================================================
function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() =&gt; { t.style.display = 'none'; }, 3000);
}

function mudarAba(id, btn) {
  document.querySelectorAll('.tab-content').forEach(e =&gt; e.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(e =&gt; e.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

function mostrarHistorico() {
  document.getElementById('modal').classList.add('active');
  renderizarHistorico();
}

function fecharModal() {
  document.getElementById('modal').classList.remove('active');
}

// ============================================================
// TEMPLATES
// ============================================================
const TEMPLATES = {
  'sw': `// Service Worker
const CACHE = 'pwa-v1';
self.addEventListener('install', e =&gt; {
  e.waitUntil(caches.open(CACHE));
});
self.addEventListener('fetch', e =&gt; {
  e.respondWith(caches.match(e.request).then(r =&gt; r || fetch(e.request)));
});`,

  'manifest': `{
  &quot;name&quot;: &quot;Meu App&quot;,
  &quot;short_name&quot;: &quot;App&quot;,
  &quot;start_url&quot;: &quot;/&quot;,
  &quot;display&quot;: &quot;standalone&quot;,
  &quot;background_color&quot;: &quot;#ffffff&quot;,
  &quot;theme_color&quot;: &quot;#000000&quot;,
  &quot;icons&quot;: [
    {&quot;src&quot;: &quot;/icon-192.png&quot;, &quot;sizes&quot;: &quot;192x192&quot;, &quot;type&quot;: &quot;image/png&quot;}
  ]
}`,

  'api': `class API {
  constructor(url) { this.url = url; }
  async get(path) {
    const res = await fetch(this.url + path);
    return res.json();
  }
  async post(path, data) {
    const res = await fetch(this.url + path, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    return res.json();
  }
}`,

  'auth': `class Auth {
  login(email, pass) {
    localStorage.setItem('token', 'token_' + Date.now());
    return true;
  }
  logout() {
    localStorage.removeItem('token');
  }
  isAuth() {
    return !!localStorage.getItem('token');
  }
}`,

  'db': `class DB {
  async init() {
    return new Promise((r, j) =&gt; {
      const req = indexedDB.open('mydb', 1);
      req.onsuccess = () =&gt; r(req.result);
      req.onerror = () =&gt; j(req.error);
    });
  }
}`,

  'express': `const express = require('express');
const app = express();
app.use(express.json());
app.get('/api/data', (req, res) =&gt; {
  res.json({data: []});
});
app.listen(3000, () =&gt; console.log('Rodando...'));`
};

function carregarTemplate(tipo) {
  const codigo = TEMPLATES[tipo];
  if (codigo) {
    document.getElementById('editor').value = codigo;
    mostrarToast('✅ Template carregado!');
  }
}

// ============================================================
// GERAR CÓDIGO
// ============================================================
function gerarCodigoCustom() {
  const prompt = document.getElementById('promptCustom').value;
  if (!prompt) {
    mostrarToast('❌ Digite um prompt!');
    return;
  }
  
  const el = document.getElementById('respostaCustom');
  el.innerHTML = '&lt;span class=&quot;spinner&quot;&gt;&lt;/span&gt; Gerando...';
  
  setTimeout(() =&gt; {
    const codigo = `// Código gerado\n// Prompt: ${prompt}\n\nfunction exemplo() {\n  console.log('Implementar lógica');\n}`;
    el.innerHTML = `&lt;div class=&quot;success-msg&quot;&gt;✅ Código gerado!&lt;/div&gt;&lt;div class=&quot;code-box&quot;&gt;${codigo}&lt;/div&gt;&lt;button class=&quot;btn-secondary&quot; onclick=&quot;copiarDe(this)&quot;&gt;📋 Copiar&lt;/button&gt;`;
    salvarHistorico('custom', prompt, codigo);
    mostrarToast('✅ Gerado!');
  }, 500);
}

function corrigirCodigo() {
  const codigo = document.getElementById('codigoCorrigir').value;
  if (!codigo) {
    mostrarToast('❌ Cole um código!');
    return;
  }
  
  const el = document.getElementById('respostaFix');
  el.innerHTML = '&lt;span class=&quot;spinner&quot;&gt;&lt;/span&gt; Corrigindo...';
  
  setTimeout(() =&gt; {
    const corrigido = `// Código corrigido\n${codigo}\n\n// Melhorias aplicadas:\n// - Melhor estrutura\n// - Tratamento de erros`;
    el.innerHTML = `&lt;div class=&quot;success-msg&quot;&gt;✅ Código corrigido!&lt;/div&gt;&lt;div class=&quot;code-box&quot;&gt;${corrigido}&lt;/div&gt;&lt;button class=&quot;btn-secondary&quot; onclick=&quot;copiarDe(this)&quot;&gt;📋 Copiar&lt;/button&gt;`;
    mostrarToast('✅ Corrigido!');
  }, 500);
}

function refatorarCodigo() {
  const codigo = document.getElementById('codigoRefatorar').value;
  if (!codigo) {
    mostrarToast('❌ Cole um código!');
    return;
  }
  
  const el = document.getElementById('respostaRefactor');
  el.innerHTML = '&lt;span class=&quot;spinner&quot;&gt;&lt;/span&gt; Refatorando...';
  
  setTimeout(() =&gt; {
    const refatorado = `// Código refatorado\n${codigo}\n\n// Padrões aplicados:\n// - DRY (Don't Repeat Yourself)\n// - SOLID principles`;
    el.innerHTML = `&lt;div class=&quot;success-msg&quot;&gt;✅ Código refatorado!&lt;/div&gt;&lt;div class=&quot;code-box&quot;&gt;${refatorado}&lt;/div&gt;&lt;button class=&quot;btn-secondary&quot; onclick=&quot;copiarDe(this)&quot;&gt;📋 Copiar&lt;/button&gt;`;
    mostrarToast('✅ Refatorado!');
  }, 500);
}

// ============================================================
// EDITOR
// ============================================================
function validarCodigo() {
  const codigo = document.getElementById('editor').value;
  const tipo = document.getElementById('tipoArquivo').value;
  
  if (!codigo) {
    mostrarToast('❌ Cole um código!');
    return;
  }
  
  const el = document.getElementById('resultadoValidacao');
  let resultado = '✅ Validação OK\n';
  resultado += `Tipo: ${tipo}\n`;
  resultado += `Linhas: ${codigo.split('\n').length}\n`;
  resultado += `Caracteres: ${codigo.length}`;
  
  if (tipo === 'json') {
    try {
      JSON.parse(codigo);
      resultado += '\n✅ JSON válido!';
    } catch (e) {
      resultado = '❌ JSON inválido: ' + e.message;
    }
  }
  
  el.innerHTML = `&lt;div class=&quot;code-box&quot;&gt;${resultado}&lt;/div&gt;`;
  mostrarToast('✅ Validado!');
}

function formatarCodigo() {
  const codigo = document.getElementById('editor').value;
  const tipo = document.getElementById('tipoArquivo').value;
  
  if (!codigo) return;
  
  let formatado = codigo;
  if (tipo === 'json') {
    try {
      formatado = JSON.stringify(JSON.parse(codigo), null, 2);
    } catch (e) {
      mostrarToast('❌ JSON inválido!');
      return;
    }
  }
  
  document.getElementById('editor').value = formatado;
  mostrarToast('✅ Formatado!');
}

function analisarCodigo() {
  const codigo = document.getElementById('editor').value;
  if (!codigo) return;
  
  let analise = '📊 ANÁLISE:\n\n';
  analise += `Linhas: ${codigo.split('\n').length}\n`;
  analise += `Caracteres: ${codigo.length}\n\n`;
  analise += '🔍 DETECTADO:\n';
  
  if (codigo.includes('async')) analise += '✅ Async/Await\n';
  if (codigo.includes('try')) analise += '✅ Try/Catch\n';
  if (codigo.includes('class')) analise += '✅ Classes\n';
  if (codigo.includes('function')) analise += '✅ Funções\n';
  if (codigo.includes('=&gt;')) analise += '✅ Arrow Functions\n';
  if (codigo.includes('const')) analise += '✅ Const\n';
  
  analise += '\n⚠️ SUGESTÕES:\n';
  if (codigo.includes('var ')) analise += '⚠️ Usar const/let em vez de var\n';
  if (codigo.includes('console.log')) analise += '⚠️ Remover console.log\n';
  
  document.getElementById('analiseResultado').textContent = analise;
  mostrarToast('✅ Analisado!');
}

function salvarArquivo() {
  const codigo = document.getElementById('editor').value;
  const tipo = document.getElementById('tipoArquivo').value;
  
  if (!codigo) return;
  
  const blob = new Blob([codigo], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `arquivo.${tipo}`;
  a.click();
  mostrarToast('⬇️ Arquivo salvo!');
}

// ============================================================
// HISTÓRICO
// ============================================================
function salvarHistorico(tipo, titulo, conteudo) {
  historico.push({
    id: Date.now(),
    tipo,
    titulo: titulo.substring(0, 50),
    conteudo,
    data: new Date().toLocaleString('pt-BR')
  });
  localStorage.setItem('pwa_historico', JSON.stringify(historico));
}

function carregarHistorico() {
  const saved = localStorage.getItem('pwa_historico');
  if (saved) historico = JSON.parse(saved);
}

function renderizarHistorico() {
  const el = document.getElementById('modalConteudo');
  
  if (!historico.length) {
    el.innerHTML = '&lt;p&gt;Nenhum item no histórico.&lt;/p&gt;';
    return;
  }
  
  el.innerHTML = historico.slice().reverse().map(h =&gt; `
    &lt;div class=&quot;item-list&quot;&gt;
      &lt;strong&gt;${h.titulo}&lt;/strong&gt;
      &lt;small&gt;${h.data}&lt;/small&gt;
      &lt;div style=&quot;margin-top:10px;&quot;&gt;
        &lt;button class=&quot;btn-secondary&quot; onclick=&quot;copiarHistoricoItem('${h.id}')&quot;&gt;📋 Copiar&lt;/button&gt;
        &lt;button class=&quot;btn-danger&quot; onclick=&quot;excluirHistoricoItem('${h.id}')&quot;&gt;🗑️ Deletar&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  `).join('');
}

function copiarHistoricoItem(id) {
  const item = historico.find(h =&gt; h.id == id);
  if (item) {
    navigator.clipboard.writeText(item.conteudo);
    mostrarToast('✅ Copiado!');
  }
}

function excluirHistoricoItem(id) {
  historico = historico.filter(h =&gt; h.id != id);
  localStorage.setItem('pwa_historico', JSON.stringify(historico));
  renderizarHistorico();
  mostrarToast('🗑️ Deletado!');
}

function limparHistorico() {
  if (confirm('Limpar TODO o histórico?')) {
    historico = [];
    localStorage.removeItem('pwa_historico');
    mostrarToast('🗑️ Histórico limpo!');
  }
}

function exportarHistorico() {
  const blob = new Blob([JSON.stringify(historico, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `historico_${Date.now()}.json`;
  a.click();
  mostrarToast('⬇️ Exportado!');
}

// ============================================================
// UTILITÁRIOS
// ============================================================
function copiarDe(btn) {
  const txt = btn.previousElementSibling.textContent;
  navigator.clipboard.writeText(txt);
  mostrarToast('✅ Copiado!');
}

function copiarAnalise() {
  const txt = document.getElementById('analiseResultado').textContent;
  navigator.clipboard.writeText(txt);
  mostrarToast('✅ Copiado!');
}

function baixarAnalise() {
  const txt = document.getElementById('analiseResultado').textContent;
  const blob = new Blob([txt], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `analise_${Date.now()}.txt`;
  a.click();
  mostrarToast('⬇️ Baixado!');
}

// ============================================================

let replitToken = '';
let replitURL = '';
let arquivosReplit = [];

// ============================================================
// INICIALIZAÇÃO
// ============================================================
window.addEventListener('load', () =&gt; {
  carregarConfigReplit();
});

// ============================================================
// TOAST
// ============================================================
function mostrarToast(msg, tipo = 'info', duracao = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${tipo} show`;
  setTimeout(() =&gt; { t.className = 'toast'; }, duracao);
}

// ============================================================
// MODAL
// ============================================================
function mostrarModal(id) { document.getElementById(id).classList.add('active'); }
function fecharModal(id) { document.getElementById(id).classList.remove('active'); }

// ============================================================
// ABAS
// ============================================================
function mudarAba(nomeAba, btnEl) {
  document.querySelectorAll('.tab-content').forEach(el =&gt; el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el =&gt; el.classList.remove('active'));
  document.getElementById(nomeAba).classList.add('active');
  if (btnEl) btnEl.classList.add('active');
}

// ============================================================
// CONEXÃO RÉPLIT
// ============================================================
function toggleSenha() {
  const inp = document.getElementById('replitToken');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

function salvarConfigReplit() {
  const config = {
    token: document.getElementById('replitToken').value,
    url: document.getElementById('replitURL').value
  };
  localStorage.setItem('replit_config', JSON.stringify(config));
  mostrarToast('✅ Configuração salva!', 'success');
}

function carregarConfigReplit() {
  const saved = localStorage.getItem('replit_config');
  if (!saved) return;
  const config = JSON.parse(saved);
  document.getElementById('replitToken').value = config.token || '';
  document.getElementById('replitURL').value = config.url || '';
}

async function conectarReplit() {
  replitToken = document.getElementById('replitToken').value;
  replitURL = document.getElementById('replitURL').value;

  if (!replitToken || !replitURL) {
    mostrarToast('Preencha token e URL.', 'error');
    return;
  }

  const statusEl = document.getElementById('statusReplit');
  statusEl.innerHTML = '&lt;span class=&quot;spinner&quot;&gt;&lt;/span&gt; Conectando...';

  try {
    // Simular conexão (em produção, fazer requisição real)
    await new Promise(resolve =&gt; setTimeout(resolve, 1000));

    replitConectado = true;
    statusEl.innerHTML = `&lt;span class=&quot;ok&quot;&gt;✅ Conectado ao Réplit!&lt;/span&gt;`;
    mostrarToast('✅ Conectado!', 'success');
    listarArquivosReplit();
  } catch (e) {
    replitConectado = false;
    statusEl.innerHTML = `&lt;span class=&quot;bad&quot;&gt;❌ Erro: ${e.message}&lt;/span&gt;`;
    mostrarToast('Erro: ' + e.message, 'error');
  }
}

// ============================================================
// LISTAR ARQUIVOS
// ============================================================
async function listarArquivosReplit() {
  if (!replitConectado) {
    mostrarToast('Conecte ao Réplit primeiro.', 'error');
    return;
  }

  const el = document.getElementById('listaArquivosReplit');
  el.innerHTML = '&lt;span class=&quot;spinner&quot;&gt;&lt;/span&gt; Carregando...';

  try {
    // Simular listagem
    arquivosReplit = [
      { nome: 'package.json', tamanho: 1024, tipo: 'file' },
      { nome: 'index.js', tamanho: 2048, tipo: 'file' },
      { nome: 'src/', tamanho: 0, tipo: 'dir' },
      { nome: '.env', tamanho: 512, tipo: 'file' },
      { nome: 'README.md', tamanho: 1500, tipo: 'file' }
    ];

    const filtro = document.getElementById('filtroArquivos').value.toLowerCase();
    const filtrados = arquivosReplit.filter(a =&gt; a.nome.toLowerCase().includes(filtro));

    el.innerHTML = filtrados.map(arq =&gt; `
      &lt;div class=&quot;replit-item&quot;&gt;
        &lt;div class=&quot;replit-item-titulo&quot;&gt;${arq.tipo === 'dir' ? '📁' : '📄'} ${arq.nome}&lt;/div&gt;
        &lt;div class=&quot;replit-item-status&quot;&gt;${(arq.tamanho / 1024).toFixed(2)} KB&lt;/div&gt;
        &lt;div style=&quot;margin-top:8px;display:flex;gap:4px;&quot;&gt;
          &lt;button class=&quot;btn-mini&quot; onclick=&quot;abrirArquivoReplit('${arq.nome}')&quot;&gt;👁️ Ver&lt;/button&gt;
          &lt;button class=&quot;btn-mini blue&quot; onclick=&quot;editarArquivoReplit('${arq.nome}')&quot;&gt;✏️ Editar&lt;/button&gt;
          &lt;button class=&quot;btn-mini red&quot; onclick=&quot;deletarArquivoReplit('${arq.nome}')&quot;&gt;🗑️ Deletar&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    `).join('');

    mostrarToast(`✅ ${filtrados.length} arquivos encontrados`, 'success');
  } catch (e) {
    el.innerHTML = `&lt;div class=&quot;bad&quot;&gt;Erro: ${e.message}&lt;/div&gt;`;
    mostrarToast('Erro: ' + e.message, 'error');
  }
}

function baixarRelatorio(texto) {
  const blob = new Blob([texto], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `relatorio_replit_${Date.now()}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  mostrarToast('⬇️ Download!', 'success');
}

// ============================================================
// CONFIGURAÇÃO IA
// ============================================================
const PROVEDORES = {
  openai: {
    url: 'https://api.openai.com/v1/chat/completions',
    modelos: ['gpt-4o','gpt-4o-mini','gpt-4-turbo','gpt-3.5-turbo'],
    headers: (token) =&gt; ({ 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) =&gt; JSON.stringify({ model: modelo, messages: msgs, max_tokens: maxTokens }),
    extrairResposta: (data) =&gt; data.choices[0].message.content
  },
  anthropic: {
    url: 'https://api.anthropic.com/v1/messages',
    modelos: ['claude-3-5-sonnet-20241022','claude-3-opus-20240229'],
    headers: (token) =&gt; ({ 'x-api-key': token, 'anthropic-version': '2023-06-01', 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) =&gt; {
      const system = msgs.find(m =&gt; m.role === 'system');
      const userMsgs = msgs.filter(m =&gt; m.role !== 'system');
      const payload = { model: modelo, max_tokens: maxTokens, messages: userMsgs };
      if (system) payload.system = system.content;
      return JSON.stringify(payload);
    },
    extrairResposta: (data) =&gt; data.content[0].text
  },
  gemini: {
    url: (modelo, token) =&gt; `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${token}`,
    modelos: ['gemini-1.5-pro-latest','gemini-1.5-flash-latest'],
    headers: () =&gt; ({ 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) =&gt; {
      const parts = msgs.map(m =&gt; ({ text: m.content }));
      return JSON.stringify({ contents: [{ parts }], generationConfig: { maxOutputTokens: maxTokens } });
    },
    extrairResposta: (data) =&gt; data.candidates[0].content.parts[0].text
  },
  groq: {
    url: 'https://api.groq.com/openai/v1/chat/completions',
    modelos: ['llama-3.1-70b-versatile','llama-3.1-8b-instant','mixtral-8x7b-32768'],
    headers: (token) =&gt; ({ 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) =&gt; JSON.stringify({ model: modelo, messages: msgs, max_tokens: maxTokens }),
    extrairResposta: (data) =&gt; data.choices[0].message.content
  },
  ollama: {
    url: () =&gt; 'http://localhost:11434/api/chat',
    modelos: ['llama3.1','llama3','mistral','codellama'],
    headers: () =&gt; ({ 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) =&gt; JSON.stringify({ model: modelo, messages: msgs, stream: false }),
    extrairResposta: (data) =&gt; data.message.content
  }
};

function atualizarConfigIA() {
  const provedor = document.getElementById('iaProvedor').value;
  const config = PROVEDORES[provedor];
  const modeloSel = document.getElementById('iaModelo');
  modeloSel.innerHTML = config.modelos.map(m =&gt; `&lt;option value=&quot;${m}&quot;&gt;${m}&lt;/option&gt;`).join('');
}

function salvarConfigIA() {
  const config = {
    provedor: document.getElementById('iaProvedor').value,
    modelo: document.getElementById('iaModelo').value,
    token: document.getElementById('iaToken').value
  };
  localStorage.setItem('analyzer_ia_config', JSON.stringify(config));
  mostrarToast('✅ Configuração salva!', 'success');
}

function carregarConfigIA() {
  const saved = localStorage.getItem('analyzer_ia_config');
  if (!saved) return;
  const config = JSON.parse(saved);
  document.getElementById('iaProvedor').value = config.provedor || 'openai';
  atualizarConfigIA();
  document.getElementById('iaModelo').value = config.modelo || '';
  document.getElementById('iaToken').value = config.token || '';
}

async function testarConexaoIA() {
  const statusEl = document.getElementById('statusIA');
  statusEl.innerHTML = '&lt;span class=&quot;spinner&quot;&gt;&lt;/span&gt; Testando...';
  try {
    const resposta = await chamarIA([{ role: 'user', content: 'OK' }]);
    iaConectada = true;
    statusEl.innerHTML = `&lt;span class=&quot;ok&quot;&gt;✅ Conectado!&lt;/span&gt;`;
    mostrarToast('IA conectada!', 'success');
  } catch (e) {
    iaConectada = false;
    statusEl.innerHTML = `&lt;span class=&quot;bad&quot;&gt;❌ ${e.message}&lt;/span&gt;`;
    mostrarToast('Erro: ' + e.message, 'error');
  }
}

async function chamarIA(mensagens) {
  const provedor = document.getElementById('iaProvedor').value;
  const modelo = document.getElementById('iaModelo').value;
  const token = document.getElementById('iaToken').value;
  const config = PROVEDORES[provedor];

  if (!config) throw new Error('Provedor não configurado');
  if (provedor !== 'ollama' &amp;&amp; !token) throw new Error('Configure sua chave de API');

  const url = typeof config.url === 'function' ? config.url(modelo, token) : config.url;
  const headers = config.headers(token);
  const maxTokens = 4000;
  const body = config.body(modelo, mensagens, maxTokens);

  const response = await fetch(url, { method: 'POST', headers, body });

  if (!response.ok) {
    const errText = await response.text();
    throw new Error(`HTTP ${response.status}`);
  }

  const data = await response.json();
  return config.extrairResposta(data);
}

// CARREGAR PROJETO
// ============================================================
async function carregarProjeto() {
  const input = document.getElementById('arquivoInput');
  if (!input.files || !input.files[0]) {
    mostrarToast('Selecione um arquivo.', 'error');
    return;
  }

  const file = input.files[0];
  const buffer = await file.arrayBuffer();
  const formato = document.getElementById('formatoArquivo').value;

  arquivos = [];
  conteudosTexto = {};

  try {
    if (formato === 'auto' || formato === 'zip') {
      if (file.name.endsWith('.zip')) {
        await processarZIP(buffer);
        return;
      }
    }

    if (formato === 'auto' || formato === 'tar' || formato === 'taz') {
      if (file.name.endsWith('.tar') || file.name.endsWith('.tar.gz') || file.name.endsWith('.tgz')) {
        await processarTAR(buffer);
        return;
      }
    }

    if (formato === 'auto' || formato === 'html') {
      if (file.name.endsWith('.html')) {
        processarHTML(buffer);
        return;
      }
    }

    mostrarToast('Formato não suportado.', 'error');
  } catch (e) {
    mostrarToast('Erro: ' + e.message, 'error');
  }
}

async function processarZIP(buffer) {
  const zip = await JSZip.loadAsync(buffer);
  zip.forEach((path, entry) =&gt; {
    arquivos.push({ nome: path, dir: entry.dir, tamanho: entry._data.uncompressedSize });
  });

  for (const item of arquivos) {
    if (!item.dir &amp;&amp; ehTexto(item.nome) &amp;&amp; item.tamanho &lt; 1000000) {
      try {
        conteudosTexto[item.nome] = await zip.file(item.nome).async('string');
      } catch (e) {
        conteudosTexto[item.nome] = '[ERRO]';
      }
    }
  }

  arquivos.sort((a, b) =&gt; a.nome.localeCompare(b.nome));
  atualizarResumoGeral();
  mostrarToast(`✅ ${arquivos.length} arquivos carregados`, 'success');
}

async function processarTAR(buffer) {
  let dados = new Uint8Array(buffer);

  if (document.getElementById('arquivoInput').files[0].name.endsWith('.gz') ||
      document.getElementById('arquivoInput').files[0].name.endsWith('.tgz')) {
    dados = pako.inflate(dados);
  }

  let offset = 0;

  while (offset &lt; dados.length) {
    const headerBytes = dados.slice(offset, offset + 512);
    if (headerBytes.every(b =&gt; b === 0)) break;

    const nome = new TextDecoder().decode(headerBytes.slice(0, 100)).split('\0')[0];
    const tamanhoStr = new TextDecoder().decode(headerBytes.slice(124, 136)).trim();
    const tamanho = parseInt(tamanhoStr, 8);
    const tipo = String.fromCharCode(headerBytes[156]);

    offset += 512;

    if (nome &amp;&amp; tipo !== '5') {
      arquivos.push({ nome, dir: false, tamanho });

      if (ehTexto(nome) &amp;&amp; tamanho &lt; 1000000) {
        const conteudo = new TextDecoder().decode(dados.slice(offset, offset + tamanho));
        conteudosTexto[nome] = conteudo;
      }
    }

    offset += Math.ceil(tamanho / 512) * 512;
  }

  arquivos.sort((a, b) =&gt; a.nome.localeCompare(b.nome));
  atualizarResumoGeral();
  mostrarToast(`✅ ${arquivos.length} arquivos carregados`, 'success');
}

function processarHTML(buffer) {
  const html = new TextDecoder().decode(buffer);
  const nome = document.getElementById('arquivoInput').files[0].name;

  arquivos.push({ nome, dir: false, tamanho: buffer.byteLength });
  conteudosTexto[nome] = html;

  const scriptRegex = /&lt;script[^&gt;]*&gt;([\s\S]*?)&lt;\/script&gt;/gi;
  const styleRegex = /&lt;style[^&gt;]*&gt;([\s\S]*?)&lt;\/style&gt;/gi;

  let match;
  let contador = 1;

  while ((match = scriptRegex.exec(html)) !== null) {
    const nomeScript = `extracted_script_${contador}.js`;
    arquivos.push({ nome: nomeScript, dir: false, tamanho: match[1].length });
    conteudosTexto[nomeScript] = match[1];
    contador++;
  }

  contador = 1;
  while ((match = styleRegex.exec(html)) !== null) {
    const nomeStyle = `extracted_style_${contador}.css`;
    arquivos.push({ nome: nomeStyle, dir: false, tamanho: match[1].length });
    conteudosTexto[nomeStyle] = match[1];
    contador++;
  }

  atualizarResumoGeral();
  mostrarToast(`✅ HTML processado`, 'success');
}

function ehTexto(nome) {
  const lower = nome.toLowerCase();
  if (lower.endsWith('/')) return false;
  return extensoesTexto.some(ext =&gt; lower.endsWith(ext));
}

// ============================================================
function detectarDependencias() {
  let resultado = '=== DEPENDÊNCIAS DETECTADAS ===\n\n';
  let deps = {};

  // Procurar package.json
  const packageJson = Object.entries(conteudosTexto).find(([nome]) =&gt; nome.includes('package.json'));
  if (packageJson) {
    try {
      const pkg = JSON.parse(packageJson[1]);
      resultado += '📦 DEPENDÊNCIAS (package.json):\n';
      if (pkg.dependencies) {
        Object.entries(pkg.dependencies).forEach(([nome, versao]) =&gt; {
          resultado += `  ✅ ${nome}: ${versao}\n`;
          deps[nome] = versao;
        });
      }
      resultado += '\n📦 DEV DEPENDÊNCIAS:\n';
      if (pkg.devDependencies) {
        Object.entries(pkg.devDependencies).forEach(([nome, versao]) =&gt; {
          resultado += `  🔧 ${nome}: ${versao}\n`;
          deps[nome] = versao;
        });
      }
    } catch (e) {
      resultado += '❌ Erro ao parsear package.json\n';
    }
  }

  // Procurar imports
  resultado += '\n📥 IMPORTS DETECTADOS:\n';
  const importRegex = /import\s+.*\s+from\s+['&quot;](.*?)['&quot;]/g;
  const requireRegex = /require\s*\(\s*['&quot;](.*?)['&quot;]\s*\)/g;

  Object.entries(conteudosTexto).forEach(([arquivo, conteudo]) =&gt; {
    let match;
    while ((match = importRegex.exec(conteudo)) !== null) {
      const lib = match[1];
      if (!lib.startsWith('.')) {
        resultado += `  📦 ${lib} (em ${arquivo})\n`;
      }
    }

    while ((match = requireRegex.exec(conteudo)) !== null) {
      const lib = match[1];
      if (!lib.startsWith('.')) {
        resultado += `  📦 ${lib} (em ${arquivo})\n`;
      }
    }
  });

  resultado += `\n=== RESUMO ===\n`;
  resultado += `Total de dependências: ${Object.keys(deps).length}\n`;

  document.getElementById('conteudoDeps').textContent = resultado;
  document.getElementById('resultadoDeps').style.display = 'block';
  memoriaAnalises.push({ tipo: 'deps', data: new Date().toISOString(), conteudo: resultado });
}

function salvarEmMemoria(tipo) {

  else if (tipo === 'bugs') conteudo = document.getElementById('conteudoBugs').textContent;
  else if (tipo === 'deps') conteudo = document.getElementById('conteudoDeps').textContent;
  else if (tipo === 'replit') conteudo = document.getElementById('conteudoReplit').textContent;

    id: Date.now(),

function salvarMemoriaLocalStorage() {
  localStorage.setItem('analyzer_memoria', JSON.stringify(memoriaAnalises));
}

function carregarMemoriaLocalStorage() {
  const saved = localStorage.getItem('analyzer_memoria');
  if (saved) {
    memoriaAnalises = JSON.parse(saved);
    renderizarMemoria();
  }
}

function renderizarMemoria() {
  const el = document.getElementById('listaMemoria');
  if (!memoriaAnalises.length) {
    el.innerHTML = '&lt;div class=&quot;small&quot; style=&quot;color:#64748b;&quot;&gt;Nenhuma análise salva.&lt;/div&gt;';
    return;
  }

  el.innerHTML = memoriaAnalises.slice().reverse().map(analise =&gt; `
    &lt;div class=&quot;memoria-item&quot;&gt;
      &lt;div class=&quot;memoria-item-header&quot;&gt;
        &lt;div&gt;
          &lt;div class=&quot;memoria-item-titulo&quot;&gt;📌 ${analise.tipo.toUpperCase()}&lt;/div&gt;
          &lt;div class=&quot;memoria-item-data&quot;&gt;${new Date(analise.data).toLocaleString('pt-BR')}&lt;/div&gt;
        &lt;/div&gt;
        &lt;div style=&quot;display:flex;gap:4px;&quot;&gt;
          &lt;button class=&quot;btn-mini blue&quot; onclick=&quot;copiarMemoria(${analise.id})&quot;&gt;📋&lt;/button&gt;
          &lt;button class=&quot;btn-mini green&quot; onclick=&quot;baixarMemoria(${analise.id})&quot;&gt;⬇️&lt;/button&gt;
          &lt;button class=&quot;btn-mini red&quot; onclick=&quot;excluirMemoria(${analise.id})&quot;&gt;🗑&lt;/button&gt;

      &lt;/div&gt;
      &lt;div class=&quot;memoria-item-conteudo&quot;&gt;${analise.conteudo.substring(0, 300)}${analise.conteudo.length &gt; 300 ? '...' : ''}&lt;/div&gt;
    &lt;/div&gt;
  `).join('');
}

function copiarMemoria(id) {
  const analise = memoriaAnalises.find(a =&gt; a.id === id);
  if (!analise) return;
  navigator.clipboard.writeText(analise.conteudo).then(() =&gt; mostrarToast('✅ Copiado!', 'success'));
}

function baixarMemoria(id) {
  const analise = memoriaAnalises.find(a =&gt; a.id === id);
  if (!analise) return;
  const blob = new Blob([analise.conteudo], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `analise_${analise.tipo}_${analise.id}.txt`;
  a.click();

// ============================================================
// IA: CORRIGIR PROJETO
// ============================================================
async function corrigirComIA() {
  if (!iaConectada) {
    mostrarToast('Configure a IA primeiro.', 'error');
    return;
  }

  const prompt = document.getElementById('promptCorrigir').value;
  if (!prompt) {
    mostrarToast('Digite um prompt.', 'error');
    return;
  }

  const respEl = document.getElementById('respostaCorrigir');
  respEl.innerHTML = '&lt;div style=&quot;color:#a78bfa;&quot;&gt;&lt;span class=&quot;spinner&quot;&gt;&lt;/span&gt; Gerando correções...&lt;/div&gt;';

  try {
    // Construir contexto
    let ctx = '=== PROJETO ===\n\n';
    Object.entries(conteudosTexto).slice(0, 10).forEach(([nome, conteudo]) =&gt; {
      ctx += `\n--- ${nome} ---\n${conteudo.substring(0, 1000)}\n`;
    });

    const msgs = [
      { role: 'user', content: `${ctx}\n\n${prompt}` }
    ];

    const resposta = await chamarIA(msgs);
    
    const correcao = {
      id: Date.now(),
      data: new Date().toISOString(),
      prompt: prompt,
      resposta: resposta
    };

    correcoesGeradas.push(correcao);
    localStorage.setItem('analyzer_correcoes', JSON.stringify(correcoesGeradas));

    respEl.innerHTML = `
      &lt;div class=&quot;detector-resultado&quot;&gt;
        &lt;div class=&quot;resultado-header&quot;&gt;
          &lt;span class=&quot;resultado-titulo&quot;&gt;✏️ Correções Geradas&lt;/span&gt;
          &lt;div class=&quot;resultado-acoes&quot;&gt;
            &lt;button class=&quot;btn-mini blue&quot; onclick=&quot;copiarCorrecao(${correcao.id})&quot;&gt;📋&lt;/button&gt;
            &lt;button class=&quot;btn-mini green&quot; onclick=&quot;baixarCorrecao(${correcao.id})&quot;&gt;⬇️&lt;/button&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;resultado-texto&quot;&gt;${resposta}&lt;/div&gt;
      &lt;/div&gt;
    `;

    mostrarToast('✅ Correções geradas!', 'success');
    renderizarCorrecoes();
  } catch (e) {
    respEl.innerHTML = `&lt;div class=&quot;bad&quot;&gt;Erro: ${e.message}&lt;/div&gt;`;
    mostrarToast('Erro: ' + e.message, 'error');
  }
}

function renderizarCorrecoes() {
  const saved = localStorage.getItem('analyzer_correcoes');
  if (!saved) return;
  correcoesGeradas = JSON.parse(saved);

  const el = document.getElementById('listaCorrecoes');
  if (!correcoesGeradas.length) {
    el.innerHTML = '&lt;div class=&quot;small&quot; style=&quot;color:#64748b;&quot;&gt;Nenhuma correção.&lt;/div&gt;';
    return;
  }

  el.innerHTML = correcoesGeradas.slice().reverse().map(cor =&gt; `
    &lt;div class=&quot;memoria-item&quot;&gt;
      &lt;div class=&quot;memoria-item-header&quot;&gt;
        &lt;div&gt;
          &lt;div class=&quot;memoria-item-titulo&quot;&gt;✏️ Correção&lt;/div&gt;
          &lt;div class=&quot;memoria-item-data&quot;&gt;${new Date(cor.data).toLocaleString('pt-BR')}&lt;/div&gt;
        &lt;/div&gt;
        &lt;div style=&quot;display:flex;gap:4px;&quot;&gt;
          &lt;button class=&quot;btn-mini blue&quot; onclick=&quot;copiarCorrecao(${cor.id})&quot;&gt;📋&lt;/button&gt;
          &lt;button class=&quot;btn-mini green&quot; onclick=&quot;baixarCorrecao(${cor.id})&quot;&gt;⬇️&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;memoria-item-conteudo&quot;&gt;&lt;strong&gt;Prompt:&lt;/strong&gt; ${cor.prompt.substring(0, 150)}...\n\n&lt;strong&gt;Resposta:&lt;/strong&gt; ${cor.resposta.substring(0, 200)}...&lt;/div&gt;
    &lt;/div&gt;
  `).join('');
}

function copiarCorrecao(id) {
  const cor = correcoesGeradas.find(c =&gt; c.id === id);
  if (!cor) return;
  navigator.clipboard.writeText(cor.resposta).then(() =&gt; mostrarToast('✅ Copiado!', 'success'));
}

function baixarCorrecao(id) {
  const cor = correcoesGeradas.find(c =&gt; c.id === id);
  if (!cor) return;
  const txt = `PROMPT:\n${cor.prompt}\n\n---\n\nRESPOSTA:\n${cor.resposta}`;
  const blob = new Blob([txt], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `correcao_${cor.id}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  mostrarToast('⬇️ Download!', 'success');
}

<script>
function trocarProjeto(index) {
  // Esconde todos
  document.querySelectorAll('.project-container').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  
  // Mostra o selecionado
  document.getElementById('projeto' + index).classList.add('active');
  document.querySelectorAll('.nav-btn')[index].classList.add('active');
  
  // Salva preferência
  localStorage.setItem('ultimo-projeto', index);
}

// Restaura último projeto aberto
window.onload = function() {
  const ultimo = localStorage.getItem('ultimo-projeto');
  if (ultimo !== null) trocarProjeto(parseInt(ultimo));
};
</script>
