<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const resultsDiv = document.getElementById('results');
const loadingDiv = document.getElementById('loading');

let allFiles = {};
let fileMetadata = {};
let currentFileContent = '';
let currentFileName = '';
let openTabs = {};
let tabCounter = 0;

// DRAG AND DROP
dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('dragover');
});
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});

fileInput.addEventListener('change', e => {
  handleFiles(e.target.files);
});

async function handleFiles(files) {
  loadingDiv.style.display = 'block';
  
  for (let file of files) {
    try {
      if (file.name.endsWith('.zip')) {
        await handleZip(file);
      } else if (file.name.endsWith('.tar.gz') || file.name.endsWith('.tgz')) {
        await handleTarGz(file);
      } else if (file.name.endsWith('.tar')) {
        await handleTar(file);
      } else {
        await handleSingleFile(file);
      }
    } catch (err) {
      console.error('Erro ao processar arquivo:', err);
    }
  }
  
  loadingDiv.style.display = 'none';
  displayReport();
}

async function handleZip(file) {
  const zip = new JSZip();
  const content = await zip.loadAsync(file);
  
  for (let [path, zipEntry] of Object.entries(content.files)) {
    if (!zipEntry.dir) {
      try {
        const data = await zipEntry.async('text');
        const ext = path.split('.').pop().toLowerCase();
        const size = zipEntry._data.uncompressedSize;
        
        allFiles[path] = data;
        fileMetadata[path] = {
          name: path.split('/').pop(),
          path: path,
          ext: ext,
          size: size,
          sizeKB: (size / 1024).toFixed(2),
          type: getFileType(ext),
          source: file.name
        };
      } catch (e) {
        // Arquivo binário, pula
      }
    }
  }
}

async function handleSingleFile(file) {
  try {
    const data = await file.text();
    const ext = file.name.split('.').pop().toLowerCase();
    
    allFiles[file.name] = data;
    fileMetadata[file.name] = {
      name: file.name,
      path: file.name,
      ext: ext,
      size: file.size,
      sizeKB: (file.size / 1024).toFixed(2),
      type: getFileType(ext),
      source: file.name
    };
  } catch (e) {
    console.error('Erro ao ler arquivo:', e);
  }
}

  // Implementação simplificada - em produção usaria pako

  // Implementação simplificada

  if (['js', 'jsx', 'ts', 'tsx'].includes(ext)) return 'js';
  if (['html', 'htm'].includes(ext)) return 'html';
  if (['css', 'scss', 'sass'].includes(ext)) return 'css';
  if (['json'].includes(ext)) return 'json';
  return 'other';

            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  
  html += `<div id=&quot;searchResults&quot;></div>`;
  
  resultsDiv.innerHTML = html;
}

function openTab(filePath) {
  const meta = fileMetadata[filePath];
  const content = allFiles[filePath];
  
  const tabId = 'tab-' + (tabCounter++);
  openTabs[tabId] = { path: filePath, content: content, meta: meta };
  
  updateTabs();
  selectTab(tabId);
}

function updateTabs() {
  const tabsContainer = document.getElementById('tabsContainer');
  const tabsContent = document.getElementById('tabsContent');
  
  if (!tabsContainer) return;
  
  tabsContainer.innerHTML = Object.entries(openTabs).map(([tabId, data]) => `
    <button class=&quot;tab active&quot; onclick=&quot;selectTab('${tabId}')&quot;>
      ${data.meta.name}
      <span class=&quot;close-tab&quot; onclick=&quot;closeTab('${tabId}', event)&quot;>✕</span>
    </button>
  `).join('');
  
  tabsContent.innerHTML = Object.entries(openTabs).map(([tabId, data]) => `
    <div class=&quot;tab-content active&quot; id=&quot;content-${tabId}&quot;>
      <div class=&quot;code-preview&quot;>
        ${data.content.split('\n').slice(0, 100).map((line, i) => `
          <div class=&quot;code-line&quot;>
            <span class=&quot;code-num&quot;>${i + 1}</span>
            <span class=&quot;code-content&quot;>${escapeHtml(line)}</span>
          </div>
        `).join('')}
        ${data.content.split('\n').length > 100 ? `<div style=&quot;color: #94a3b8; margin-top: 10px;&quot;>... ${data.content.split('\n').length - 100} linhas restantes</div>` : ''}
      </div>
      <div style=&quot;margin-top: 15px; display: flex; gap: 10px;&quot;>
        <button class=&quot;btn btn-secondary&quot; onclick=&quot;viewFullFile('${data.path}')&quot;>👁️ Ver Completo</button>
        <button class=&quot;btn btn-success&quot; onclick=&quot;saveAsNote('${data.path}')&quot;>📝 Salvar Nota</button>
        <button class=&quot;btn btn-secondary&quot; onclick=&quot;copyToClipboard('${data.path}')&quot;>📋 Copiar</button>
      </div>
    </div>
  `).join('');
}

function selectTab(tabId) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  
  document.querySelector(`[onclick=&quot;selectTab('${tabId}')&quot;]`)?.classList.add('active');
  document.getElementById(`content-${tabId}`)?.classList.add('active');
}

function closeTab(tabId, event) {
  event.stopPropagation();
  delete openTabs[tabId];
  updateTabs();
}

async function analyzeWithAI(filePath) {
  const content = allFiles[filePath];
  const meta = fileMetadata[filePath];
  
  // Análise básica (sem API externa)
  const analysis = {
    linhas: content.split('\n').length,
    caracteres: content.length,
    funcoes: (content.match(/function\s+\w+|const\s+\w+\s*=\s*\(|async\s+\w+/g) || []).length,
    comentarios: (content.match(/\/\/|\/\*|\*\//g) || []).length,
    imports: (content.match(/import\s+|require\s*\(|from\s+/g) || []).length,
    erros: detectErrors(content),
    sugestoes: generateSuggestions(content, meta.type),
    keywords: detectKeywords(content)
  };
  
  currentFileContent = content;
  currentFileName = meta.name;
  
  let html = `
    <div class=&quot;ai-analysis&quot;>
      <h3>🤖 Análise Inteligente: ${meta.name}</h3>
      
      <div class=&quot;ai-section&quot;>

        <div class=&quot;stats-grid&quot;>
          <div class=&quot;stat-box&quot;>
            <strong>${analysis.linhas}</strong>
            <span>Linhas</span>
          </div>
          <div class=&quot;stat-box&quot;>
            <strong>${analysis.funcoes}</strong>
            <span>Funções</span>
          </div>
          <div class=&quot;stat-box&quot;>
            <strong>${analysis.imports}</strong>
            <span>Imports</span>
          </div>
          <div class=&quot;stat-box&quot;>
            <strong>${analysis.comentarios}</strong>
            <span>Comentários</span>
          </div>
        </div>
      </div>
      
      ${analysis.erros.length > 0 ? `
        <div class=&quot;ai-section&quot;>
          <h4 style=&quot;color: #f87171; margin-bottom: 10px;&quot;>⚠️ Possíveis Problemas</h4>
          ${analysis.erros.map(e => `<div class=&quot;error&quot;>🔴 ${e}</div>`).join('')}
        </div>
      ` : ''}
      
      ${analysis.sugestoes.length > 0 ? `
        <div class=&quot;ai-section&quot;>
          <h4 style=&quot;color: #fbbf24; margin-bottom: 10px;&quot;>💡 Sugestões</h4>
          ${analysis.sugestoes.map(s => `<div class=&quot;suggestion&quot;>💡 ${s}</div>`).join('')}
        </div>
      ` : ''}
      
      ${analysis.keywords.length > 0 ? `
        <div class=&quot;ai-section&quot;>

          <div style=&quot;display: flex; flex-wrap: wrap; gap: 8px;&quot;>

          </div>
        </div>
      ` : ''}

  document.getElementById('modalTitle').textContent = `🤖 Análise: ${meta.name}`;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('fileModal').classList.add('open');
}

function detectErrors(content) {
  const errors = [];
  
  if (content.includes('console.log') &amp;&amp; content.includes('var ')) {
    errors.push('Uso de var detectado - considere usar const ou let');
  }
  if ((content.match(/\=\=/g) || []).length > (content.match(/\=\=\=/g) || []).length) {
    errors.push('Comparação com == detectada - use === para segurança');
  }
  if (content.includes('eval(')) {
    errors.push('Uso de eval() detectado - evite por segurança');
  }
  if (!content.includes('use strict') &amp;&amp; content.endsWith('.js')) {
    errors.push('Modo strict não ativado');
  }
  
  return errors;
}

function generateSuggestions(content, type) {
  const suggestions = [];
  
  if (type === 'js') {
    if (!content.includes('async') &amp;&amp; content.includes('fetch')) {
      suggestions.push('Considere usar async/await em vez de .then()');
    }
    if (content.includes('setTimeout') &amp;&amp; !content.includes('clearTimeout')) {
      suggestions.push('Adicione limpeza de timeouts para evitar memory leaks');
    }
    if (content.length > 1000 &amp;&amp; !content.includes('//')) {
      suggestions.push('Adicione comentários para melhor documentação');
    }
  }
  
  if (type === 'html') {
    if (!content.includes('meta charset')) {
      suggestions.push('Adicione meta charset UTF-8');
    }
    if (!content.includes('viewport')) {
      suggestions.push('Adicione meta viewport para responsividade');
    }
  }
  
  return suggestions;
}

function detectKeywords(content) {
  const keywords = [];
  const patterns = {
    'API': /fetch|axios|http|request/i,
    'Database': /sql|mongodb|firebase|database/i,
    'Auth': /auth|token|password|login/i,
    'UI': /react|vue|angular|component/i,
    'Backend': /express|node|server|api/i,
    'Testing': /test|jest|mocha|chai/i,
    'Async': /async|await|promise/i
  };
  
  for (let [key, pattern] of Object.entries(patterns)) {
    if (pattern.test(content)) {
      keywords.push(key);
    }
  }
  
  return keywords;
}

function globalSearch() {
  const query = document.getElementById('globalSearch').value.toLowerCase();
  
  if (!query) {
    document.getElementById('searchResults').innerHTML = '';
    return;
  }
  
  const results = [];
  
  for (let [path, content] of Object.entries(allFiles)) {
    const lines = content.split('\n');
    lines.forEach((line, lineNum) => {
      if (line.toLowerCase().includes(query)) {
        results.push({
          file: path,
          line: lineNum + 1,
          content: line.trim(),
          meta: fileMetadata[path]
        });
      }
    });
  }
  
  let html = `
    <div class=&quot;results&quot;>
      <h2>🔍 Resultados da Busca (${results.length})</h2>
      <div class=&quot;search-results&quot;>
        ${results.slice(0, 50).map(r => `
          <div class=&quot;search-result-item&quot; onclick=&quot;openTab('${r.file}')&quot;>
            <div class=&quot;search-result-file&quot;>📄 ${r.meta.name} (linha ${r.line})</div>
            <div class=&quot;search-result-preview&quot;>${escapeHtml(r.content.substring(0, 100))}</div>
          </div>
        `).join('')}
        ${results.length > 50 ? `<div style=&quot;color: #94a3b8; padding: 10px;&quot;>... e mais ${results.length - 50} resultados</div>` : ''}
      </div>
    </div>
  `;
  
  document.getElementById('searchResults').innerHTML = html;
}

function filterFiles() {
  const search = document.getElementById('searchInput')?.value.toLowerCase() || '';
  const typeFilter = document.getElementById('typeFilter')?.value || '';
  const sizeFilter = document.getElementById('sizeFilter')?.value || '';
  
  const fileItems = document.querySelectorAll('.file-item');
  fileItems.forEach(item => {
    const type = item.dataset.type;
    const size = parseInt(item.dataset.size);
    
    let show = true;
    
    if (typeFilter &amp;&amp; type !== typeFilter) show = false;
    if (sizeFilter === 'small' &amp;&amp; size >= 10240) show = false;
    if (sizeFilter === 'medium' &amp;&amp; (size < 10240 || size > 102400)) show = false;
    if (sizeFilter === 'large' &amp;&amp; size <= 102400) show = false;
    
    item.style.display = show ? 'flex' : 'none';
  });
}

function viewFullFile(filePath) {
  const content = allFiles[filePath];
  const meta = fileMetadata[filePath];
  
  currentFileContent = content;
  currentFileName = meta.name;
  
  const lines = content.split('\n');
  const preview = lines.map((line, i) => `
    <div class=&quot;code-line&quot;>
      <span class=&quot;code-num&quot;>${i + 1}</span>
      <span class=&quot;code-content&quot;>${escapeHtml(line)}</span>
    </div>
  `).join('');
  
  document.getElementById('modalTitle').textContent = `📄 ${meta.name}`;
  document.getElementById('modalBody').innerHTML = `<div class=&quot;code-preview&quot;>${preview}</div>`;
  document.getElementById('fileModal').classList.add('open');
}

function saveAsNote(filePath) {
  const content = allFiles[filePath];
  const meta = fileMetadata[filePath];
  
  const note = {
    title: meta.name,
    content: content,
    date: new Date().toLocaleString('pt-BR'),
    type: meta.type
  };
  
  const notes = JSON.parse(localStorage.getItem('projectNotes') || '[]');
  notes.push(note);
  localStorage.setItem('projectNotes', JSON.stringify(notes));
  
  alert('✅ Arquivo salvo como nota!');
}

function downloadFile(filePath) {
  const content = allFiles[filePath];
  const meta = fileMetadata[filePath];
  
  const blob = new Blob([content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = meta.name;
  a.click();
  URL.revokeObjectURL(url);
}

function downloadCurrentFile() {
  const blob = new Blob([currentFileContent], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = currentFileName;
  a.click();
  URL.revokeObjectURL(url);
}

function copyCurrentFile() {
  navigator.clipboard.writeText(currentFileContent).then(() => {
    alert('✅ Copiado!');
  });
}

function copyToClipboard(filePath) {
  navigator.clipboard.writeText(allFiles[filePath]).then(() => {
    alert('✅ Copiado!');
  });
}

function closeModal() {
  document.getElementById('fileModal').classList.remove('open');
}

function exportAll() {
  const files = Object.values(fileMetadata);
  
  let md = `# Relatório de Projeto\n\n`;
  md += `**Gerado em:** ${new Date().toLocaleString('pt-BR')}\n\n`;
  md += `## 📊 Resumo\n`;
  md += `- Total: ${files.length} arquivos\n`;
  md += `- Tamanho: ${(files.reduce((sum, f) => sum + f.size, 0) / 1024 / 1024).toFixed(2)}MB\n\n`;
  md += `## 📁 Arquivos\n\n`;
  
  files.forEach(f => {
    md += `- **${f.name}** (${f.sizeKB}KB)\n`;
  });
  
  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `relatorio-${new Date().toISOString().split('T')[0]}.md`;
  a.click();
  URL.revokeObjectURL(url);
}

function escapeHtml(text) {
  const map = { '&amp;': '&amp;amp;', '<': '&amp;lt;', '>': '&amp;gt;', '&quot;': '&amp;quot;', &quot;'&quot;: '&amp;#039;' };
  return text.replace(/[&amp;<>&quot;']/g, m => map[m]);
}

<script src=&quot;https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js&quot;></script>

<script>
  // ═══════════════════════════════════════════════════════════
  // ESTADO GLOBAL
  // ═══════════════════════════════════════════════════════════
  let arquivos = [];
  let conteudosTexto = {};
  let iaProvider = 'openai';
  let iaChave = '';
  let iaConectado = false;

  const extensoesTexto = [
    '.txt', '.md', '.json', '.js', '.jsx', '.ts', '.tsx', '.html', '.css',
    '.scss', '.xml', '.yml', '.yaml', '.toml', '.env', '.sql', '.gitignore',
    '.nix', '.config', '.cjs', '.mjs', '.py', '.java', '.cpp', '.c', '.go',
    '.rb', '.php', '.sh', '.bash', '.dockerfile', '.properties', '.gradle'
  ];

  // ═══════════════════════════════════════════════════════════
  // IA - CONFIGURAÇÃO
  // ═══════════════════════════════════════════════════════════
  function atualizarProvedor() {
    iaProvider = document.getElementById('iaProvider').value;
    document.getElementById('statusIA').textContent = `Provedor: ${iaProvider} - Cole sua chave`;
    document.getElementById('statusIA').style.color = '#fde68a';
  }

  async function testarConexaoIA() {
    iaChave = document.getElementById('iaChave').value.trim();
    if (!iaChave) {
      alert('Cole uma chave de API primeiro!');
      return;
    }

    const status = document.getElementById('statusIA');
    status.innerHTML = '<span class=&quot;spinner&quot;></span> Testando...';

    try {
      const resposta = await chamarIA('Responda com uma única palavra: OK');
      if (resposta.includes('OK') || resposta.length > 0) {
        status.innerHTML = '<span class=&quot;ok&quot;>✅ IA Conectada!</span>';
        iaConectado = true;
      }
    } catch (e) {
      status.innerHTML = `<span class=&quot;bad&quot;>❌ Erro: ${e.message}</span>`;
      iaConectado = false;
    }
  }

  // ═══════════════════════════════════════════════════════════
  // CARREGAR ARQUIVO
  // ═══════════════════════════════════════════════════════════
  async function carregarArquivo() {
    const input = document.getElementById('arquivoInput');
    if (!input.files || !input.files[0]) {
      alert('Selecione um arquivo primeiro.');
      return;
    }

    const file = input.files[0];
    const buffer = await file.arrayBuffer();
    const formato = document.getElementById('formatoArquivo').value;

    arquivos = [];
    conteudosTexto = {};

    try {
      if (formato === 'auto' || formato === 'zip') {
        if (file.name.endsWith('.zip')) {
          await processarZIP(buffer);
          return;
        }
      }

      if (formato === 'auto' || formato === 'tar' || formato === 'taz') {
        if (file.name.endsWith('.tar') || file.name.endsWith('.tar.gz') || file.name.endsWith('.tgz')) {
          await processarTAR(buffer);
          return;
        }
      }

      if (formato === 'auto' || formato === 'html') {
        if (file.name.endsWith('.html')) {
          processarHTML(buffer);
          return;
        }
      }

      alert('Formato não suportado.');
    } catch (e) {
      alert('Erro: ' + e.message);
      console.error(e);
    }
  }

  async function processarZIP(buffer) {
    const zip = await JSZip.loadAsync(buffer);
    zip.forEach((path, entry) => {
      arquivos.push({ nome: path, dir: entry.dir, tamanho: entry._data.uncompressedSize });
    });

    for (const item of arquivos) {
      if (!item.dir &amp;&amp; ehTexto(item.nome)) {
        try {
          conteudosTexto[item.nome] = await zip.file(item.nome).async('string');
        } catch (e) {
          conteudosTexto[item.nome] = '[ERRO AO LER]';
        }
      }
    }

    arquivos.sort((a, b) => a.nome.localeCompare(b.nome));
    renderArquivos();
  }

  async function processarTAR(buffer) {
    let dados = new Uint8Array(buffer);

    if (document.getElementById('arquivoInput').files[0].name.endsWith('.gz') ||
        document.getElementById('arquivoInput').files[0].name.endsWith('.tgz')) {
      dados = pako.inflate(dados);
    }

    const view = new DataView(dados.buffer);
    let offset = 0;

    while (offset < dados.length) {
      const headerBytes = dados.slice(offset, offset + 512);
      if (headerBytes.every(b => b === 0)) break;

      const nome = new TextDecoder().decode(headerBytes.slice(0, 100)).split('\0')[0];
      const tamanhoStr = new TextDecoder().decode(headerBytes.slice(124, 136)).trim();
      const tamanho = parseInt(tamanhoStr, 8);
      const tipo = String.fromCharCode(headerBytes[156]);

      offset += 512;

      if (nome &amp;&amp; tipo !== '5') {
        arquivos.push({ nome, dir: false, tamanho });

        if (ehTexto(nome)) {
          const conteudo = new TextDecoder().decode(dados.slice(offset, offset + tamanho));
          conteudosTexto[nome] = conteudo;
        }
      }

      offset += Math.ceil(tamanho / 512) * 512;
    }

    arquivos.sort((a, b) => a.nome.localeCompare(b.nome));
    renderArquivos();
  }

  function processarHTML(buffer) {
    const html = new TextDecoder().decode(buffer);
    const nome = document.getElementById('arquivoInput').files[0].name;

    arquivos.push({ nome, dir: false, tamanho: buffer.byteLength });
    conteudosTexto[nome] = html;

    renderArquivos();
  }

  function ehTexto(nome) {
    const lower = nome.toLowerCase();
    if (lower.endsWith('/')) return false;
    return extensoesTexto.some(ext => lower.endsWith(ext));
  }

  // ═══════════════════════════════════════════════════════════
  // RENDERIZAR ARQUIVOS
  // ═══════════════════════════════════════════════════════════
  function renderArquivos() {
    const filtro = document.getElementById('filtroArquivo').value.toLowerCase();
    const el = document.getElementById('listaArquivos');

    if (!arquivos.length) {
      el.innerHTML = 'Nenhum arquivo carregado.';
      document.getElementById('contadorArquivos').textContent = '0 arquivos';
      return;
    }

    const filtrados = arquivos.filter(a => a.nome.toLowerCase().includes(filtro));
    document.getElementById('contadorArquivos').textContent = `${filtrados.length} de ${arquivos.length} arquivos`;

    el.innerHTML = filtrados.map(a => {
      const tipo = a.dir ? '📁' : ehTexto(a.nome) ? '📄' : '📦';
      const tamanhoKB = a.tamanho ? (a.tamanho / 1024).toFixed(1) : '?';
      return `<div class=&quot;file-item&quot; onclick=&quot;abrirArquivo('${a.nome.replace(/'/g, &quot;\\'&quot;)}')&quot; title=&quot;${a.nome}&quot;>
        ${tipo} ${a.nome} <span class=&quot;small&quot;>(${tamanhoKB} KB)</span>
      </div>`;
    }).join('');
  }

  function abrirArquivo(nome) {
    document.getElementById('arquivoAtual').textContent = nome;
    const area = document.getElementById('conteudoArquivo');

    if (conteudosTexto[nome] !== undefined) {
      area.value = conteudosTexto[nome]; // SEM TRUNCAR!
    } else {
      area.value = '[Arquivo binário, pasta, ou tipo não lido como texto]';
    }
  }

  // ═══════════════════════════════════════════════════════════
  // DETECTAR PROBLEMAS
  // ═══════════════════════════════════════════════════════════
  function detectarReplit() {
    let resultado = '=== DETECÇÃO DE REPLIT ===\n\n';
    let encontrados = 0;

    Object.entries(conteudosTexto).forEach(([nome, conteudo]) => {
      const linhas = conteudo.split(/\r?\n/);
      linhas.forEach((linha, idx) => {
        if (linha.toLowerCase().includes('replit')) {
          encontrados++;
          resultado += `📄 ${nome}:${idx + 1}\n`;
          resultado += `   ${linha.trim().substring(0, 100)}\n\n`;
          if (encontrados >= 20) return; // Limitar a 20
        }
      });
    });

    if (encontrados === 0) {
      resultado += '✅ Nenhuma referência ao Replit encontrada!';
    } else {
      resultado += `\n🚨 Total: ${encontrados} referências (mostrando até 20)`;
    }

    document.getElementById('resultadoDeteccao').textContent = resultado;
  }

  function detectarAPIs() {
    let resultado = '=== DETECÇÃO DE APIs/Endpoints ===\n\n';
    const regexAPI = /(?:https?:\/\/[^\s'&quot;]+|\/api\/[^\s'&quot;]+|fetch\(['&quot;](.*?)['&quot;]\)|axios\.(get|post|put|delete)\(['&quot;](.*?)['&quot;]\))/gi;
    let encontrados = 0;

    Object.entries(conteudosTexto).forEach(([nome, conteudo]) => {
      let match;
      while ((match = regexAPI.exec(conteudo)) !== null &amp;&amp; encontrados < 20) {
        encontrados++;
        resultado += `📄 ${nome}\n`;
        resultado += `   ${match[0].substring(0, 100)}\n\n`;
      }
    });

    if (encontrados === 0) {
      resultado += 'Nenhuma API/endpoint encontrada.';
    } else {
      resultado += `\n✅ Total: ${encontrados} APIs (mostrando até 20)`;
    }

    document.getElementById('resultadoDeteccao').textContent = resultado;
  }

  function detectarFuncoes() {
    let resultado = '=== DETECÇÃO DE FUNÇÕES ===\n\n';
    const regexFunc = /(?:function|const|let|var)\s+(\w+)\s*(?:=\s*)?(?:function|\(|async)/g;
    let funcoes = new Set();

    Object.entries(conteudosTexto).forEach(([nome, conteudo]) => {
      let match;
      while ((match = regexFunc.exec(conteudo)) !== null) {
        funcoes.add(match[1]);
      }
    });

    if (funcoes.size === 0) {
      resultado += 'Nenhuma função encontrada.';
    } else {
      resultado += `✅ Total: ${funcoes.size} funções\n\n`;
      Array.from(funcoes).slice(0, 30).forEach(f => {
        resultado += `  • ${f}\n`;
      });
      if (funcoes.size > 30) {
        resultado += `\n  ... e ${funcoes.size - 30} mais`;
      }
    }

    document.getElementById('resultadoDeteccao').textContent = resultado;
  }

  function detectarBugs() {
    let resultado = '=== DETECÇÃO DE BUGS POTENCIAIS ===\n\n';
    const padroes = [
      { regex: /console\.log\(/g, nome: 'console.log (debug)' },
      { regex: /TODO|FIXME|BUG|HACK/gi, nome: 'Comentários de TODO/FIXME' },
      { regex: /var\s+/g, nome: 'Uso de var (use let/const)' },
      { regex: /==\s*(?![=])/g, nome: 'Comparação == (use ===)' },
      { regex: /catch\s*\(\s*\)/g, nome: 'Catch vazio' },
      { regex: /undefined/g, nome: 'Referências a undefined' }
    ];

    let totalBugs = 0;

    padroes.forEach(padrao => {
      let count = 0;
      Object.values(conteudosTexto).forEach(conteudo => {
        const matches = conteudo.match(padrao.regex);
        if (matches) count += matches.length;
      });

      if (count > 0) {
        resultado += `⚠️ ${padrao.nome}: ${count} ocorrências\n`;
        totalBugs += count;
      }
    });

    if (totalBugs === 0) {
      resultado += '✅ Nenhum bug potencial detectado!';
    } else {
      resultado += `\n🐛 Total: ${totalBugs} problemas potenciais`;
    }

    document.getElementById('resultadoDeteccao').textContent = resultado;
  }

  function detectarDependencias() {
    let resultado = '=== DETECÇÃO DE DEPENDÊNCIAS ===\n\n';

    const packageJson = conteudosTexto['package.json'];
    if (packageJson) {
      try {
        const pkg = JSON.parse(packageJson);
        resultado += '📦 Dependências:\n';
        if (pkg.dependencies) {
          Object.entries(pkg.dependencies).slice(0, 15).forEach(([nome, versao]) => {
            resultado += `  • ${nome}: ${versao}\n`;
          });
        }
        resultado += '\n📦 Dev Dependências:\n';
        if (pkg.devDependencies) {
          Object.entries(pkg.devDependencies).slice(0, 15).forEach(([nome, versao]) => {
            resultado += `  • ${nome}: ${versao}\n`;
          });
        }
      } catch (e) {
        resultado += '❌ Erro ao parsear package.json';
      }
    } else {
      resultado += '⚠️ Nenhum package.json encontrado';
    }

    document.getElementById('resultadoDeteccao').textContent = resultado;
  }

  // ═══════════════════════════════════════════════════════════
  // IA - CHAMAR API
  // ═══════════════════════════════════════════════════════════
  async function chamarIA(mensagem) {
    if (!iaChave) {
      throw new Error('Configure sua chave de IA primeiro!');
    }

    let url, headers, body;

    if (iaProvider === 'openai') {
      url = 'https://api.openai.com/v1/chat/completions';
      headers = {
        'Authorization': `Bearer ${iaChave}`,
        'Content-Type': 'application/json'
      };
      body = {
        model: 'gpt-3.5-turbo',
        messages: [{ role: 'user', content: mensagem }],
        max_tokens: 2000
      };
    } else if (iaProvider === 'anthropic') {
      url = 'https://api.anthropic.com/v1/messages';
      headers = {
        'x-api-key': iaChave,
        'anthropic-version': '2023-06-01',
        'Content-Type': 'application/json'
      };
      body = {
        model: 'claude-3-sonnet-20240229',
        max_tokens: 2000,
        messages: [{ role: 'user', content: mensagem }]
      };
    } else if (iaProvider === 'groq') {
      url = 'https://api.groq.com/openai/v1/chat/completions';
      headers = {
        'Authorization': `Bearer ${iaChave}`,
        'Content-Type': 'application/json'
      };
      body = {
        model: 'mixtral-8x7b-32768',
        messages: [{ role: 'user', content: mensagem }],
        max_tokens: 2000
      };
    } else if (iaProvider === 'google') {
      url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${iaChave}`;
      headers = { 'Content-Type': 'application/json' };
      body = {
        contents: [{
          parts: [{ text: mensagem }]
        }]
      };
    }

    const response = await fetch(url, {
      method: 'POST',
      headers,
      body: JSON.stringify(body)
    });

    if (!response.ok) {
      throw new Error(`Erro ${response.status}: ${response.statusText}`);
    }

    const data = await response.json();

    if (iaProvider === 'openai' || iaProvider === 'groq') {
      return data.choices[0].message.content;
    } else if (iaProvider === 'anthropic') {
      return data.content[0].text;
    } else if (iaProvider === 'google') {
      return data.candidates[0].content.parts[0].text;
    }
  }

  async function enviarParaIA(tipo) {
    let prompt = '';
    let respEl = '';

    if (tipo === 'analise') {
      prompt = document.getElementById('promptAnalise').value;
      respEl = 'respostaAnalise';
    } else if (tipo === 'correcao') {
      prompt = document.getElementById('promptCorrecao').value;
      respEl = 'respostaCorrecao';
    } else if (tipo === 'orientacao') {
      prompt = document.getElementById('promptOrientacao').value;
      respEl = 'respostaOrientacao';
    }

    if (!prompt.trim()) {
      alert('Digite um prompt primeiro.');
      return;
    }

    if (!iaConectado) {
      alert('Conecte a IA primeiro!');
      return;
    }

    const resposta = document.getElementById(respEl);
    resposta.innerHTML = '<div class=&quot;spinner&quot;></div> Processando...';

    try {
      // Construir contexto
      let contexto = 'CONTEXTO DO PROJETO:\n\n';
      const arquivosPrincipais = Object.keys(conteudosTexto)
        .filter(a => a.includes('package.json') || a.includes('README') || a.includes('main') || a.includes('index'))
        .slice(0, 3);

      for (const arquivo of arquivosPrincipais) {
        let conteudo = conteudosTexto[arquivo];
        if (conteudo.length > 1500) {
          conteudo = conteudo.substring(0, 1500) + '\n[... truncado]';
        }
        contexto += `\n--- ${arquivo} ---\n${conteudo}\n`;
      }

      const mensagemCompleta = `${contexto}\n\nPERGUNTA:\n${prompt}`;
      const respostaIA = await chamarIA(mensagemCompleta);
      resposta.innerHTML = `<pre>${respostaIA}</pre>`;
    } catch (e) {
      resposta.innerHTML = `<div class=&quot;bad&quot;>❌ Erro: ${e.message}</div>`;
    }
  }

  // ═══════════════════════════════════════════════════════════
  // COPIAR/BAIXAR
  // ═══════════════════════════════════════════════════════════
  function copiarConteudo() {
    const area = document.getElementById('conteudoArquivo');
    navigator.clipboard.writeText(area.value).then(() => {
      alert('✅ Copiado!');
    }).catch(() => alert('❌ Erro ao copiar.'));
  }

  function baixarConteudo() {
    const area = document.getElementById('conteudoArquivo');
    const nome = document.getElementById('arquivoAtual').textContent || 'arquivo.txt';
    const blob = new Blob([area.value], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nome;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ═══════════════════════════════════════════════════════════
  // SALVAR NOTA
  // ═══════════════════════════════════════════════════════════
  function mostrarOpcoesSaida() {
    if (!arquivos.length) {
      alert('Carregue um arquivo primeiro.');
      return;
    }
    document.getElementById('modalNota').classList.add('active');
  }

  function fecharModal(id) {
    document.getElementById(id).classList.remove('active');
  }

  function salvarNotaJSON() {
    const nome = document.getElementById('nomaNota').value || 'nota';
    const obs = document.getElementById('conteudoNota').value;

    const nota = {
      data: new Date().toISOString(),
      nome,
      observacoes: obs,
      arquivos: arquivos.map(a => ({ nome: a.nome, tamanho: a.tamanho })),
      diagnostico: document.getElementById('resultadoDeteccao').textContent
    };

    const blob = new Blob([JSON.stringify(nota, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${nome}_${new Date().getTime()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    fecharModal('modalNota');
    alert('✅ Nota salva!');
  }

  function salvarNotaTXT() {
    const nome = document.getElementById('nomaNota').value || 'nota';
    const obs = document.getElementById('conteudoNota').value;

    let conteudo = `NOTA: ${nome}\nData: ${new Date().toLocaleString('pt-BR')}\n\n`;
    conteudo += `OBSERVAÇÕES:\n${obs}\n\n`;
    conteudo += `DIAGNÓSTICO:\n${document.getElementById('resultadoDeteccao').textContent}`;

    const blob = new Blob([conteudo], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${nome}_${new Date().getTime()}.txt`;
    a.click();
    URL.revokeObjectURL(url);
    fecharModal('modalNota');
    alert('✅ Nota salva!');
  }

  // ═══════════════════════════════════════════════════════════
  // ABAS
  // ═══════════════════════════════════════════════════════════
  function mudarAba(nomeAba) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(nomeAba).classList.add('active');
    event.target.classList.add('active');
  }

  // ═══════════════════════════════════════════════════════════
  // LIMPAR
  // ═══════════════════════════════════════════════════════════
  function limparTudo() {
    if (confirm('Limpar tudo?')) {
      arquivos = [];
      conteudosTexto = {};

      document.getElementById('conteudoArquivo').value = '';
      document.getElementById('resultadoDeteccao').textContent = 'Clique em um botão para detectar.';
      alert('✅ Tudo limpo!');
    }
  }
</script>

    if (!input.files || !input.files[0]) {
      alert('Selecione um arquivo primeiro.');
      return;
    }

    const file = input.files[0];
    const buffer = await file.arrayBuffer();
    const formato = document.getElementById('formatoArquivo').value;

    arquivos = [];
    conteudosTexto = {};

    try {
      if (formato === 'auto' || formato === 'zip') {
        if (file.name.endsWith('.zip')) {
          await processarZIP(buffer);
          return;
        }
      }

      if (formato === 'auto' || formato === 'tar' || formato === 'taz') {
        if (file.name.endsWith('.tar') || file.name.endsWith('.tar.gz') || file.name.endsWith('.tgz')) {
          await processarTAR(buffer);
          return;
        }
      }

      if (formato === 'auto' || formato === 'html') {
        if (file.name.endsWith('.html')) {
          processarHTML(buffer);
          return;
        }
      }

      alert('Formato não suportado ou não reconhecido.');
    } catch (e) {
      alert('Erro ao processar arquivo: ' + e.message);
      console.error(e);
    }
  }

  async function processarZIP(buffer) {
    const zip = await JSZip.loadAsync(buffer);
    zip.forEach((path, entry) => {
      arquivos.push({ nome: path, dir: entry.dir, tamanho: entry._data.uncompressedSize });
    });

    for (const item of arquivos) {
      if (!item.dir &amp;&amp; ehTexto(item.nome) &amp;&amp; item.tamanho < maxTamanhoByte) {
        try {
          conteudosTexto[item.nome] = await zip.file(item.nome).async('string');
        } catch (e) {
          conteudosTexto[item.nome] = '[ERRO AO LER]';
        }
      }
    }

    arquivos.sort((a, b) => a.nome.localeCompare(b.nome));
    renderArquivos();
    diagnosticar();
  }

  async function processarTAR(buffer) {
    // Descompactar TAR/TAZ usando pako
    let dados = new Uint8Array(buffer);

    if (document.getElementById('arquivoInput').files[0].name.endsWith('.gz') ||
        document.getElementById('arquivoInput').files[0].name.endsWith('.tgz')) {
      dados = pako.inflate(dados);
    }

    // Parsing TAR simples
    const view = new DataView(dados.buffer);
    let offset = 0;

    while (offset < dados.length) {
      const headerBytes = dados.slice(offset, offset + 512);
      if (headerBytes.every(b => b === 0)) break;

      const nome = new TextDecoder().decode(headerBytes.slice(0, 100)).split('\0')[0];
      const tamanhoStr = new TextDecoder().decode(headerBytes.slice(124, 136)).trim();
      const tamanho = parseInt(tamanhoStr, 8);
      const tipo = String.fromCharCode(headerBytes[156]);

      offset += 512;

      if (nome &amp;&amp; tipo !== '5') { // tipo 5 = diretório
        arquivos.push({ nome, dir: false, tamanho });

        if (ehTexto(nome) &amp;&amp; tamanho < maxTamanhoByte) {
          const conteudo = new TextDecoder().decode(dados.slice(offset, offset + tamanho));
          conteudosTexto[nome] = conteudo;
        }
      }

      offset += Math.ceil(tamanho / 512) * 512;
    }

    arquivos.sort((a, b) => a.nome.localeCompare(b.nome));
    renderArquivos();
    diagnosticar();
  }

  function processarHTML(buffer) {
    const html = new TextDecoder().decode(buffer);
    const nome = document.getElementById('arquivoInput').files[0].name;

    arquivos.push({ nome, dir: false, tamanho: buffer.byteLength });
    conteudosTexto[nome] = html;

    // Extrair scripts e estilos
    const scriptRegex = /<script[^>]*>([\s\S]*?)<\/script>/gi;
    const styleRegex = /<style[^>]*>([\s\S]*?)<\/style>/gi;

    let match;
    let contador = 1;

    while ((match = scriptRegex.exec(html)) !== null) {
      const nomeScript = `extracted_script_${contador}.js`;
      arquivos.push({ nome: nomeScript, dir: false, tamanho: match[1].length });
      conteudosTexto[nomeScript] = match[1];
      contador++;
    }

    contador = 1;
    while ((match = styleRegex.exec(html)) !== null) {
      const nomeStyle = `extracted_style_${contador}.css`;
      arquivos.push({ nome: nomeStyle, dir: false, tamanho: match[1].length });
      conteudosTexto[nomeStyle] = match[1];
      contador++;
    }

    renderArquivos();
    diagnosticar();
  }

  function ehTexto(nome) {
    const lower = nome.toLowerCase();
    if (lower.endsWith('/')) return false;
    return extensoesTexto.some(ext => lower.endsWith(ext));
  }

  // ===== RENDERIZAR ARQUIVOS =====
  function renderArquivos() {
    const filtro = document.getElementById('filtroArquivo').value.toLowerCase();
    const el = document.getElementById('listaArquivos');

    if (!arquivos.length) {
      el.innerHTML = 'Nenhum arquivo carregado.';
      document.getElementById('contadorArquivos').textContent = '0 arquivos';
      return;
    }

    const filtrados = arquivos.filter(a => a.nome.toLowerCase().includes(filtro));
    document.getElementById('contadorArquivos').textContent = `${filtrados.length} de ${arquivos.length} arquivos`;

    el.innerHTML = filtrados.map(a => {
      const tipo = a.dir ? '📁' : ehTexto(a.nome) ? '📄' : '📦';
      const tamanhoKB = a.tamanho ? (a.tamanho / 1024).toFixed(1) : '?';
      return `<div class=&quot;file-item&quot; onclick=&quot;abrirArquivo('${a.nome.replace(/'/g, &quot;\\'&quot;)}')&quot; title=&quot;${a.nome}&quot;>
        ${tipo} ${a.nome} <span class=&quot;small&quot;>(${tamanhoKB} KB)</span>
      </div>`;
    }).join('');
  }

  function abrirArquivo(nome) {
    document.getElementById('arquivoAtual').textContent = nome;
    const area = document.getElementById('conteudoArquivo');

    if (conteudosTexto[nome] !== undefined) {
      let conteudo = conteudosTexto[nome];
      if (conteudo.length > maxTamanhoByte) {
        conteudo = conteudo.substring(0, maxTamanhoByte) + '\n\n[... ARQUIVO TRUNCADO - Ajuste o limite de tamanho para ver mais]';
      }
      area.value = conteudo;
    } else {
      area.value = '[Arquivo binário, pasta, ou tipo não lido como texto]';
    }
  }

  // ===== BUSCAR TERMOS =====
  function buscarTermos() {
    const termos = document.getElementById('termosBusca').value
      .split(',')
      .map(t => t.trim().toLowerCase())
      .filter(Boolean);

    let saida = '';
    let totalEncontrados = 0;

    Object.entries(conteudosTexto).forEach(([nome, conteudo]) => {
      const linhas = conteudo.split(/\r?\n/);
      linhas.forEach((linha, idx) => {
        const low = linha.toLowerCase();
        termos.forEach(termo => {
          if (low.includes(termo)) {
            totalEncontrados++;
            saida += `${nome}:${idx + 1} | termo: ${termo}\n`;
            saida += linha.slice(0, 300) + '\n\n';
          }
        });
      });
    });

    if (!saida) saida = 'Nenhum termo encontrado.';
    else saida = `Total encontrado: ${totalEncontrados}\n\n` + saida;

    document.getElementById('resultadoBusca').textContent = saida;
  }

  // ===== DIAGNÓSTICO =====
  function temArquivo(parte) {
    return arquivos.some(a => a.nome.toLowerCase().includes(parte.toLowerCase()));
  }

  function temConteudo(parte) {
    const p = parte.toLowerCase();
    return Object.values(conteudosTexto).some(c => c.toLowerCase().includes(p));
  }

  function diagnosticar() {
    let d = '=== DIAGNÓSTICO AUTOMÁTICO ===\n\n';
    d += `Total de itens: ${arquivos.length}\n`;
    d += `Arquivos de texto lidos: ${Object.keys(conteudosTexto).length}\n`;
    d += `Tamanho máximo por arquivo: ${(maxTamanhoByte / 1024).toFixed(0)} KB\n\n`;

    const hasPackage = temArquivo('package.json');
    const hasSrc = temArquivo('src/');
    const hasDist = temArquivo('dist/') || temArquivo('assets/');
    const hasVite = temArquivo('vite.config') || temConteudo('&quot;vite&quot;');
    const hasReact = temConteudo('&quot;react&quot;') || temArquivo('.tsx');
    const hasNext = temArquivo('next.config') || temConteudo('&quot;next&quot;');
    const hasCapacitor = temArquivo('capacitor.config');
    const hasNetlify = temArquivo('netlify.toml');
    const hasManifest = temArquivo('manifest.json');
    const hasServiceWorker = temArquivo('service-worker') || temArquivo('sw.js');
    const hasSupabase = temConteudo('supabase');
    const hasNeon = temConteudo('neon');

    d += hasPackage ? '✅ Tem package.json\n' : '❌ Não achei package.json\n';
    d += hasSrc ? '✅ Tem pasta src/\n' : '⚠️ Sem src/ claro\n';
    d += hasDist ? '⚠️ Tem dist/assets (pode ser build compilado)\n' : '✅ Não é só dist/build\n';
    d += hasVite ? '✅ Indício de Vite\n' : '';
    d += hasReact ? '✅ Indício de React\n' : '';
    d += hasNext ? '⚠️ Indício de Next.js\n' : '';
    d += hasCapacitor ? '⚠️ Indício de Capacitor/APK\n' : '';
    d += hasNetlify ? '✅ Indício de Netlify\n' : '';
    d += hasManifest ? '✅ Tem manifest.json (PWA)\n' : '⚠️ Sem manifest.json\n';
    d += hasServiceWorker ? '✅ Tem service worker (PWA)\n' : '⚠️ Sem service worker\n';
    d += hasSupabase ? '⚠️ Indício de Supabase\n' : '';
    d += hasNeon ? '⚠️ Indício de Neon\n' : '';

    d += '\n=== INTERPRETAÇÃO ===\n';
    if (hasPackage &amp;&amp; hasSrc &amp;&amp; hasVite &amp;&amp; hasReact) {
      d += 'Projeto React + Vite. Build: npm run build, publicar em Netlify/Vercel.\n';
    } else if (!hasPackage &amp;&amp; hasDist) {
      d += 'Versão compilada. Abrir como site, mas difícil de editar.\n';
    } else {
      d += 'Tipo não confirmado. Verifique package.json.\n';
    }

    document.getElementById('diagnostico').textContent = d;
  }

  // ===== RELATÓRIO =====
  function gerarRelatorioCompleto() {
    diagnosticar();
    buscarTermos();

    const rel = [
      '=== RELATÓRIO COMPLETO ===\n',
      new Date().toLocaleString('pt-BR'),
      '\n\n',
      document.getElementById('diagnostico').textContent,
      '\n\n=== BUSCA DE TERMOS ===\n',

      '\n\n=== LISTA DE ARQUIVOS ===\n',
      arquivos.map(a => `${a.nome} (${(a.tamanho / 1024).toFixed(1)} KB)`).join('\n')
    ].join('');

    return rel;
  }

  function copiarConteudo() {
    const area = document.getElementById('conteudoArquivo');

  function copiarRelatorio() {

  // ===== SAÍDA: BAIXAR =====
  function baixarConteudo() {

  // ===== IA INTEGRADA =====
  async function enviarParaIA(tipo) {
    let prompt = '';
    let respEl = '';

    if (tipo === 'analise') {
      prompt = document.getElementById('promptAnalise').value;
      respEl = 'respostaAnalise';
    } else if (tipo === 'correcao') {
      prompt = document.getElementById('promptCorrecao').value;
      respEl = 'respostaCorrecao';
    } else if (tipo === 'orientacao') {
      prompt = document.getElementById('promptOrientacao').value;
      respEl = 'respostaOrientacao';
    }

    if (!prompt.trim()) {
      alert('Digite um prompt primeiro.');
      return;
    }

    const resposta = document.getElementById(respEl);
    resposta.innerHTML = '<div class=&quot;spinner&quot;></div> Processando...';

    // Construir contexto com arquivos
    let contexto = 'CONTEXTO DO PROJETO:\n\n';
    contexto += document.getElementById('diagnostico').textContent + '\n\n';
    contexto += 'ARQUIVOS PRINCIPAIS:\n';

    // Limitar a quantidade de arquivos para não estourar token
    const arquivosPrincipais = Object.keys(conteudosTexto)
      .filter(a => a.includes('package.json') || a.includes('README') || a.includes('main') || a.includes('index'))
      .slice(0, 5);

    for (const arquivo of arquivosPrincipais) {
      let conteudo = conteudosTexto[arquivo];
      if (conteudo.length > 2000) {
        conteudo = conteudo.substring(0, 2000) + '\n[... truncado]';
      }
      contexto += `\n--- ${arquivo} ---\n${conteudo}\n`;
    }

    const mensagemCompleta = `${contexto}\n\nPERGUNTA DO USUÁRIO:\n${prompt}`;

    try {
      // Simular resposta da IA (você precisa configurar sua API)
      const respostaIA = await chamarIA(mensagemCompleta);
      resposta.innerHTML = `<pre>${respostaIA}</pre>`;
    } catch (e) {
      resposta.innerHTML = `<div class=&quot;bad&quot;>Erro: ${e.message}</div><p>Configure sua chave de API da IA nas configurações.</p>`;
    }
  }

<script src=&quot;https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js&quot;></script>
<script src=&quot;https://cdn.jsdelivr.net/npm/pako@2.0.4/dist/pako.min.js&quot;></script>

<script>
  // ESTADO GLOBAL
  let arquivoCarregado = null;
  let arquivos = [];
  let conteudosTexto = {};
  let maxTamanhoByte = 5000 * 1024;
  let maxRespostaIA = 10000;
  let iaAPI = 'https://api.openai.com/v1/chat/completions'; // Será configurado
  let iaToken = '';

  const extensoesTexto = [
    '.txt', '.md', '.json', '.js', '.jsx', '.ts', '.tsx', '.html', '.css',
    '.scss', '.xml', '.yml', '.yaml', '.toml', '.env', '.sql', '.gitignore',
    '.nix', '.config', '.cjs', '.mjs', '.py', '.java', '.cpp', '.c', '.go',
    '.rb', '.php', '.sh', '.bash', '.dockerfile', '.properties', '.gradle'
  ];

  // ===== CONTROLES DE TAMANHO =====
  function atualizarTamanho() {
    const val = document.getElementById('maxTamanho').value;
    document.getElementById('maxTamanhoNum').value = val;
    maxTamanhoByte = val * 1024;
    document.getElementById('tamanhoInfo').textContent = `${val} KB (~${(val/1024).toFixed(1)} MB)`;
  }

  function sincronizarTamanho() {
    const val = document.getElementById('maxTamanhoNum').value;
    document.getElementById('maxTamanho').value = val;
    atualizarTamanho();
  }

  function atualizarRespostaIA() {
    const val = document.getElementById('maxRespostaIA').value;
    document.getElementById('maxRespostaIANum').value = val;
    maxRespostaIA = val;
    document.getElementById('respostaIAInfo').textContent = `${val} caracteres`;
  }

  function sincronizarRespostaIA() {
    const val = document.getElementById('maxRespostaIANum').value;
    document.getElementById('maxRespostaIA').value = val;
    atualizarRespostaIA();
  }

  // ===== ABAS =====
  function mudarAba(nomeAba) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(nomeAba).classList.add('active');
    event.target.classList.add('active');
  }

  // ===== MODAL =====
  function mostrarModal(id) {
    document.getElementById(id).classList.add('active');
  }

  function fecharModal(id) {
    document.getElementById(id).classList.remove('active');
  }

  function mostrarOpcoesSaida() {
    if (!arquivos.length) {
      alert('Carregue um arquivo primeiro.');
      return;
    }
    mostrarModal('modalSaida');
  }

  // ===== CARREGAR ARQUIVO =====
  async function carregarArquivo() {
    const input = document.getElementById('arquivoInput');
    if (!input.files || !input.files[0]) {
      alert('Selecione um arquivo primeiro.');
      return;
    }

    const file = input.files[0];
    const buffer = await file.arrayBuffer();
    const formato = document.getElementById('formatoArquivo').value;

    arquivos = [];
    conteudosTexto = {};

    try {
      if (formato === 'auto' || formato === 'zip') {
        if (file.name.endsWith('.zip')) {
          await processarZIP(buffer);
          return;
        }
      }

      if (formato === 'auto' || formato === 'tar' || formato === 'taz') {
        if (file.name.endsWith('.tar') || file.name.endsWith('.tar.gz') || file.name.endsWith('.tgz')) {
          await processarTAR(buffer);
          return;
        }
      }

      if (formato === 'auto' || formato === 'html') {
        if (file.name.endsWith('.html')) {
          processarHTML(buffer);
          return;
        }
      }

      alert('Formato não suportado ou não reconhecido.');
    } catch (e) {
      alert('Erro ao processar arquivo: ' + e.message);
      console.error(e);
    }
  }

  async function processarZIP(buffer) {
    const zip = await JSZip.loadAsync(buffer);
    zip.forEach((path, entry) => {
      arquivos.push({ nome: path, dir: entry.dir, tamanho: entry._data.uncompressedSize });
    });

    for (const item of arquivos) {
      if (!item.dir &amp;&amp; ehTexto(item.nome) &amp;&amp; item.tamanho < maxTamanhoByte) {
        try {
          conteudosTexto[item.nome] = await zip.file(item.nome).async('string');
        } catch (e) {
          conteudosTexto[item.nome] = '[ERRO AO LER]';
        }
      }
    }

    arquivos.sort((a, b) => a.nome.localeCompare(b.nome));
    renderArquivos();
    diagnosticar();
  }

  async function processarTAR(buffer) {
    // Descompactar TAR/TAZ usando pako
    let dados = new Uint8Array(buffer);

    if (document.getElementById('arquivoInput').files[0].name.endsWith('.gz') ||
        document.getElementById('arquivoInput').files[0].name.endsWith('.tgz')) {
      dados = pako.inflate(dados);
    }

    // Parsing TAR simples
    const view = new DataView(dados.buffer);
    let offset = 0;

    while (offset < dados.length) {
      const headerBytes = dados.slice(offset, offset + 512);
      if (headerBytes.every(b => b === 0)) break;

      const nome = new TextDecoder().decode(headerBytes.slice(0, 100)).split('\0')[0];
      const tamanhoStr = new TextDecoder().decode(headerBytes.slice(124, 136)).trim();
      const tamanho = parseInt(tamanhoStr, 8);
      const tipo = String.fromCharCode(headerBytes[156]);

      offset += 512;

      if (nome &amp;&amp; tipo !== '5') { // tipo 5 = diretório
        arquivos.push({ nome, dir: false, tamanho });

        if (ehTexto(nome) &amp;&amp; tamanho < maxTamanhoByte) {
          const conteudo = new TextDecoder().decode(dados.slice(offset, offset + tamanho));
          conteudosTexto[nome] = conteudo;
        }
      }

      offset += Math.ceil(tamanho / 512) * 512;
    }

    arquivos.sort((a, b) => a.nome.localeCompare(b.nome));
    renderArquivos();
    diagnosticar();
  }

  function processarHTML(buffer) {
    const html = new TextDecoder().decode(buffer);
    const nome = document.getElementById('arquivoInput').files[0].name;

    arquivos.push({ nome, dir: false, tamanho: buffer.byteLength });
    conteudosTexto[nome] = html;

    // Extrair scripts e estilos
    const scriptRegex = /<script[^>]*>([\s\S]*?)<\/script>/gi;
    const styleRegex = /<style[^>]*>([\s\S]*?)<\/style>/gi;

    let match;
    let contador = 1;

    while ((match = scriptRegex.exec(html)) !== null) {
      const nomeScript = `extracted_script_${contador}.js`;
      arquivos.push({ nome: nomeScript, dir: false, tamanho: match[1].length });
      conteudosTexto[nomeScript] = match[1];
      contador++;
    }

    contador = 1;
    while ((match = styleRegex.exec(html)) !== null) {
      const nomeStyle = `extracted_style_${contador}.css`;
      arquivos.push({ nome: nomeStyle, dir: false, tamanho: match[1].length });
      conteudosTexto[nomeStyle] = match[1];
      contador++;
    }

    renderArquivos();
    diagnosticar();
  }

  function ehTexto(nome) {
    const lower = nome.toLowerCase();
    if (lower.endsWith('/')) return false;
    return extensoesTexto.some(ext => lower.endsWith(ext));
  }

  // ===== RENDERIZAR ARQUIVOS =====
  function renderArquivos() {
    const filtro = document.getElementById('filtroArquivo').value.toLowerCase();
    const el = document.getElementById('listaArquivos');

    if (!arquivos.length) {
      el.innerHTML = 'Nenhum arquivo carregado.';
      document.getElementById('contadorArquivos').textContent = '0 arquivos';
      return;
    }

    const filtrados = arquivos.filter(a => a.nome.toLowerCase().includes(filtro));
    document.getElementById('contadorArquivos').textContent = `${filtrados.length} de ${arquivos.length} arquivos`;

    el.innerHTML = filtrados.map(a => {
      const tipo = a.dir ? '📁' : ehTexto(a.nome) ? '📄' : '📦';
      const tamanhoKB = a.tamanho ? (a.tamanho / 1024).toFixed(1) : '?';
      return `<div class=&quot;file-item&quot; onclick=&quot;abrirArquivo('${a.nome.replace(/'/g, &quot;\\'&quot;)}')&quot; title=&quot;${a.nome}&quot;>
        ${tipo} ${a.nome} <span class=&quot;small&quot;>(${tamanhoKB} KB)</span>
      </div>`;
    }).join('');
  }

  function abrirArquivo(nome) {
    document.getElementById('arquivoAtual').textContent = nome;
    const area = document.getElementById('conteudoArquivo');

    if (conteudosTexto[nome] !== undefined) {
      let conteudo = conteudosTexto[nome];
      if (conteudo.length > maxTamanhoByte) {
        conteudo = conteudo.substring(0, maxTamanhoByte) + '\n\n[... ARQUIVO TRUNCADO - Ajuste o limite de tamanho para ver mais]';
      }
      area.value = conteudo;
    } else {
      area.value = '[Arquivo binário, pasta, ou tipo não lido como texto]';
    }
  }

  // ===== BUSCAR TERMOS =====
  function buscarTermos() {
    const termos = document.getElementById('termosBusca').value
      .split(',')
      .map(t => t.trim().toLowerCase())
      .filter(Boolean);

    let saida = '';
    let totalEncontrados = 0;

    Object.entries(conteudosTexto).forEach(([nome, conteudo]) => {
      const linhas = conteudo.split(/\r?\n/);
      linhas.forEach((linha, idx) => {
        const low = linha.toLowerCase();
        termos.forEach(termo => {
          if (low.includes(termo)) {
            totalEncontrados++;
            saida += `${nome}:${idx + 1} | termo: ${termo}\n`;
            saida += linha.slice(0, 300) + '\n\n';
          }
        });
      });
    });

    if (!saida) saida = 'Nenhum termo encontrado.';
    else saida = `Total encontrado: ${totalEncontrados}\n\n` + saida;

    document.getElementById('resultadoBusca').textContent = saida;
  }

  // ===== DIAGNÓSTICO =====
  function temArquivo(parte) {
    return arquivos.some(a => a.nome.toLowerCase().includes(parte.toLowerCase()));
  }

  function temConteudo(parte) {
    const p = parte.toLowerCase();
    return Object.values(conteudosTexto).some(c => c.toLowerCase().includes(p));
  }

  function diagnosticar() {
    let d = '=== DIAGNÓSTICO AUTOMÁTICO ===\n\n';
    d += `Total de itens: ${arquivos.length}\n`;
    d += `Arquivos de texto lidos: ${Object.keys(conteudosTexto).length}\n`;
    d += `Tamanho máximo por arquivo: ${(maxTamanhoByte / 1024).toFixed(0)} KB\n\n`;

    const hasPackage = temArquivo('package.json');
    const hasSrc = temArquivo('src/');
    const hasDist = temArquivo('dist/') || temArquivo('assets/');
    const hasVite = temArquivo('vite.config') || temConteudo('&quot;vite&quot;');
    const hasReact = temConteudo('&quot;react&quot;') || temArquivo('.tsx');
    const hasNext = temArquivo('next.config') || temConteudo('&quot;next&quot;');
    const hasCapacitor = temArquivo('capacitor.config');
    const hasNetlify = temArquivo('netlify.toml');
    const hasManifest = temArquivo('manifest.json');
    const hasServiceWorker = temArquivo('service-worker') || temArquivo('sw.js');
    const hasSupabase = temConteudo('supabase');
    const hasNeon = temConteudo('neon');

    d += hasPackage ? '✅ Tem package.json\n' : '❌ Não achei package.json\n';
    d += hasSrc ? '✅ Tem pasta src/\n' : '⚠️ Sem src/ claro\n';
    d += hasDist ? '⚠️ Tem dist/assets (pode ser build compilado)\n' : '✅ Não é só dist/build\n';
    d += hasVite ? '✅ Indício de Vite\n' : '';
    d += hasReact ? '✅ Indício de React\n' : '';
    d += hasNext ? '⚠️ Indício de Next.js\n' : '';
    d += hasCapacitor ? '⚠️ Indício de Capacitor/APK\n' : '';
    d += hasNetlify ? '✅ Indício de Netlify\n' : '';
    d += hasManifest ? '✅ Tem manifest.json (PWA)\n' : '⚠️ Sem manifest.json\n';

  function limparTudo() {

<script src=&quot;https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js&quot;></script>
<script>
  let zipGlobal = null;
  let arquivos = [];
  let conteudosTexto = {};

  const extensoesTexto = [
    '.txt', '.md', '.json', '.js', '.jsx', '.ts', '.tsx', '.html', '.css',
    '.scss', '.xml', '.yml', '.yaml', '.toml', '.env', '.sql', '.gitignore',
    '.nix', '.config', '.cjs', '.mjs'
  ];

  function ehTexto(nome) {
    const lower = nome.toLowerCase();
    if (lower.includes('package.json')) return true;
    if (lower.endsWith('/')) return false;
    return extensoesTexto.some(ext => lower.endsWith(ext));
  }

  async function carregarZip() {
    const input = document.getElementById('zipInput');
    if (!input.files || !input.files[0]) {
      alert('Selecione um arquivo ZIP primeiro.');
      return;
    }

    const file = input.files[0];
    const buffer = await file.arrayBuffer();

    zipGlobal = await JSZip.loadAsync(buffer);
    arquivos = [];
    conteudosTexto = {};

    zipGlobal.forEach((path, entry) => {
      arquivos.push({
        nome: path,
        dir: entry.dir
      });
    });

    arquivos.sort((a, b) => a.nome.localeCompare(b.nome));

    for (const item of arquivos) {
      if (!item.dir &amp;&amp; ehTexto(item.nome)) {
        try {
          conteudosTexto[item.nome] = await zipGlobal.file(item.nome).async('string');
        } catch (e) {
          conteudosTexto[item.nome] = '[ERRO AO LER COMO TEXTO]';
        }
      }
    }

    renderArquivos();
    diagnosticar();
  }

  function renderArquivos() {
    const filtro = document.getElementById('filtroArquivo').value.toLowerCase();
    const el = document.getElementById('listaArquivos');

    if (!arquivos.length) {
      el.innerHTML = 'Nenhum ZIP carregado.';
      return;
    }

    const filtrados = arquivos.filter(a => a.nome.toLowerCase().includes(filtro));

    el.innerHTML = filtrados.map(a => {
      const tipo = a.dir ? '📁' : ehTexto(a.nome) ? '📄' : '📦';
      return '<div class=&quot;file-item&quot; onclick=&quot;abrirArquivo(' + JSON.stringify(a.nome).replace(/&quot;/g, '&amp;quot;') + ')&quot;>' + tipo + ' ' + a.nome + '</div>';
    }).join('');
  }

  function abrirArquivo(nome) {
    document.getElementById('arquivoAtual').textContent = nome;
    const area = document.getElementById('conteudoArquivo');

    if (conteudosTexto[nome] !== undefined) {
      area.value = conteudosTexto[nome];
    } else {
      area.value = '[Arquivo binário, pasta, ou tipo não lido como texto]';
    }
  }

  function buscarTermos() {
    const termos = document.getElementById('termosBusca').value
      .split(',')
      .map(t => t.trim().toLowerCase())
      .filter(Boolean);

    let saida = '';

    Object.entries(conteudosTexto).forEach(([nome, conteudo]) => {
      const linhas = conteudo.split(/\r?\n/);
      linhas.forEach((linha, idx) => {
        const low = linha.toLowerCase();
        termos.forEach(termo => {
          if (low.includes(termo)) {
            saida += nome + ':' + (idx + 1) + ' | termo: ' + termo + '\n';
            saida += linha.slice(0, 300) + '\n\n';
          }
        });
      });
    });

    if (!saida) saida = 'Nenhum termo encontrado.';
    document.getElementById('resultadoBusca').textContent = saida;
  }

  function temArquivo(parte) {
    return arquivos.some(a => a.nome.toLowerCase().includes(parte.toLowerCase()));
  }

  function temConteudo(parte) {
    const p = parte.toLowerCase();
    return Object.values(conteudosTexto).some(c => c.toLowerCase().includes(p));
  }

  function diagnosticar() {
    let d = '';
    d += '=== DIAGNÓSTICO ===\n\n';
    d += 'Total de itens no ZIP: ' + arquivos.length + '\n';
    d += 'Arquivos de texto lidos: ' + Object.keys(conteudosTexto).length + '\n\n';

    const hasPackage = temArquivo('package.json');
    const hasSrc = temArquivo('src/');
    const hasDist = temArquivo('dist/') || temArquivo('assets/');
    const hasVite = temArquivo('vite.config') || temConteudo('&quot;vite&quot;') || temConteudo('vite build');
    const hasReact = temConteudo('&quot;react&quot;') || temArquivo('.tsx') || temArquivo('App.tsx') || temArquivo('main.tsx');
    const hasNext = temArquivo('next.config') || temConteudo('&quot;next&quot;');
    const hasCapacitor = temArquivo('capacitor.config') || temConteudo('@capacitor') || temArquivo('android/');
    const hasReplit = temArquivo('.replit') || temArquivo('replit.nix') || temArquivo('.config/') || temConteudo('replit');
    const hasNetlify = temArquivo('netlify.toml') || temConteudo('netlify');
    const hasManifest = temArquivo('manifest.json');
    const hasServiceWorker = temArquivo('service-worker') || temArquivo('sw.js') || temConteudo('serviceWorker');
    const hasSupabase = temConteudo('supabase') || temArquivo('supabase/');
    const hasNeon = temConteudo('neon');

    d += hasPackage ? '✅ Tem package.json\n' : '❌ Não achei package.json\n';
    d += hasSrc ? '✅ Tem pasta src/ ou código fonte\n' : '⚠️ Não achei src/ claramente\n';
    d += hasDist ? '⚠️ Tem dist/assets. Pode ser build compilado.\n' : '✅ Não parece ser só dist/build\n';
    d += hasVite ? '✅ Indício de Vite\n' : '⚠️ Não confirmei Vite\n';
    d += hasReact ? '✅ Indício de React\n' : '⚠️ Não confirmei React\n';
    d += hasNext ? '⚠️ Indício de Next.js\n' : '';
    d += hasCapacitor ? '⚠️ Indício de Capacitor/APK\n' : '';
    d += hasReplit ? '⚠️ Tem marcas/arquivos ligados ao Replit\n' : '✅ Não achei marcas óbvias do Replit\n';
    d += hasNetlify ? '✅ Indício de Netlify\n' : '';
    d += hasManifest ? '✅ Tem manifest.json\n' : '⚠️ Não achei manifest.json\n';
    d += hasServiceWorker ? '✅ Tem service worker\n' : '⚠️ Não achei service worker\n';
    d += hasSupabase ? '⚠️ Indício de Supabase\n' : '';
    d += hasNeon ? '⚠️ Indício de Neon\n' : '';

    d += '\n=== INTERPRETAÇÃO ===\n';

    if (hasPackage &amp;&amp; hasSrc &amp;&amp; hasVite &amp;&amp; hasReact) {
      d += 'Parece ser um projeto fonte React + Vite. Melhor caminho: corrigir package.json/build e publicar como web/PWA.\n';
      d += 'Netlify provável: build command npm run build, publish directory dist.\n';
    } else if (!hasPackage &amp;&amp; hasDist) {
      d += 'Parece ser uma versão compilada. Pode abrir como site, mas é ruim para editar.\n';
    } else if (hasNext) {
      d += 'Parece Next.js. Vercel costuma ser mais fácil que Netlify.\n';
    } else {
      d += 'Tipo não confirmado. Precisa olhar package.json e estrutura.\n';
    }

    d += '\n=== SOBRE REPLIT ===\n';
    d += 'Arquivos como .replit e replit.nix geralmente são configuração do ambiente, não necessariamente o erro principal.\n';
    d += 'Não apague cegamente antes de saber se o build funciona.\n';

    document.getElementById('diagnostico').textContent = d;
  }

  function gerarRelatorio() {
    diagnosticar();
    buscarTermos();

    const rel = [
      document.getElementById('diagnostico').textContent,
      '\n\n=== BUSCA ===\n',
      document.getElementById('resultadoBusca').textContent,
      '\n\n=== LISTA DE ARQUIVOS ===\n',
      arquivos.map(a => a.nome).join('\n')
    ].join('');

    navigator.clipboard.writeText(rel).then(() => {
      alert('Relatório copiado para a área de transferência.');
    }).catch(() => {
      document.getElementById('conteudoArquivo').value = rel;
      document.getElementById('arquivoAtual').textContent = 'Relatório gerado';
      alert('Não consegui copiar automático. Coloquei o relatório na caixa de conteúdo.');
    });
  }

  function limparTudo() {
    zipGlobal = null;
    arquivos = [];
    conteudosTexto = {};
    document.getElementById('listaArquivos').innerHTML = 'Nenhum ZIP carregado.';
    document.getElementById('conteudoArquivo').value = '';
    document.getElementById('arquivoAtual').textContent = 'Nenhum arquivo selecionado.';
    document.getElementById('resultadoBusca').textContent = 'Resultado da busca aparecerá aqui.';
    document.getElementById('diagnostico').textContent = 'Carregue um ZIP para diagnosticar.';
  }
</script>

<script>

  document.querySelectorAll('.projeto').forEach(function(el){ el.classList.remove('ativo'); });
  document.querySelectorAll('.nav-btn').forEach(function(el){ el.classList.remove('active'); });
  document.getElementById('p'+i).classList.add('ativo');

  localStorage.setItem('mc-ultimo', i);

  if (u !== null) trocar(parseInt(u));
