const PROVEDORES = {
  openai: {
    url: 'https://api.openai.com/v1/chat/completions',
    modelos: ['gpt-4o','gpt-4o-mini','gpt-4-turbo','gpt-3.5-turbo'],
    headers: (token) => ({ 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) => JSON.stringify({ model: modelo, messages: msgs, max_tokens: maxTokens }),
    extrairResposta: (data) => data.choices[0].message.content
  },
  anthropic: {
    url: 'https://api.anthropic.com/v1/messages',
    modelos: ['claude-3-5-sonnet-20241022','claude-3-opus-20240229'],
    headers: (token) => ({ 'x-api-key': token, 'anthropic-version': '2023-06-01', 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) => {
      const system = msgs.find(m => m.role === 'system');
      const userMsgs = msgs.filter(m => m.role !== 'system');
      const payload = { model: modelo, max_tokens: maxTokens, messages: userMsgs };
      if (system) payload.system = system.content;
      return JSON.stringify(payload);
    },
    extrairResposta: (data) => data.content[0].text
  },
  gemini: {
    url: (modelo, token) => `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${token}`,
    modelos: ['gemini-1.5-pro-latest','gemini-1.5-flash-latest'],
    headers: () => ({ 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) => {
      const parts = msgs.map(m => ({ text: m.content }));
      return JSON.stringify({ contents: [{ parts }], generationConfig: { maxOutputTokens: maxTokens } });
    },
    extrairResposta: (data) => data.candidates[0].content.parts[0].text
  },
  groq: {
    url: 'https://api.groq.com/openai/v1/chat/completions',

    body: (modelo, msgs, maxTokens) => JSON.stringify({ model: modelo, messages: msgs, max_tokens: maxTokens }),

async function chamarIA(mensagens) {
  const provedor = document.getElementById('iaProvedor').value;
  const modelo = document.getElementById('iaModelo').value;
  const token = document.getElementById('iaToken').value;
  const config = PROVEDORES[provedor];

  if (!config) throw new Error('Provedor não configurado');
  if (provedor !== 'ollama' &amp;&amp; !token) throw new Error('Configure sua chave de API');

  const url = typeof config.url === 'function' ? config.url(modelo, token) : config.url;
  const headers = config.headers(token);
  const maxTokens = 4000;
  const body = config.body(modelo, mensagens, maxTokens);

  const response = await fetch(url, { method: 'POST', headers, body });

  if (!response.ok) {
    const errText = await response.text();
    throw new Error(`HTTP ${response.status}`);
  }

  const data = await response.json();
  return config.extrairResposta(data);
}

// ============================================================
// CARREGAR PROJETO
// ============================================================
async function carregarProjeto() {
  const input = document.getElementById('arquivoInput');
  if (!input.files || !input.files[0]) {
    mostrarToast('Selecione um arquivo.', 'error');
    return;
  }

  const file = input.files[0];
  const buffer = await file.arrayBuffer();
  const formato = document.getElementById('formatoArquivo').value;

  arquivos = [];
  conteudosTexto = {};

  try {
    if (formato === 'auto' || formato === 'zip') {
      if (file.name.endsWith('.zip')) {
        await processarZIP(buffer);
        return;
      }
    }

    if (formato === 'auto' || formato === 'tar' || formato === 'taz') {
      if (file.name.endsWith('.tar') || file.name.endsWith('.tar.gz') || file.name.endsWith('.tgz')) {
        await processarTAR(buffer);
        return;
      }
    }

    if (formato === 'auto' || formato === 'html') {
      if (file.name.endsWith('.html')) {
        processarHTML(buffer);
        return;
      }
    }

    mostrarToast('Formato não suportado.', 'error');
  } catch (e) {
    mostrarToast('Erro: ' + e.message, 'error');
  }
}

async function processarZIP(buffer) {
  const zip = await JSZip.loadAsync(buffer);
  zip.forEach((path, entry) => {
    arquivos.push({ nome: path, dir: entry.dir, tamanho: entry._data.uncompressedSize });
  });

  for (const item of arquivos) {
    if (!item.dir &amp;&amp; ehTexto(item.nome) &amp;&amp; item.tamanho < 1000000) {
      try {
        conteudosTexto[item.nome] = await zip.file(item.nome).async('string');
      } catch (e) {
        conteudosTexto[item.nome] = '[ERRO]';
      }
    }
  }

  arquivos.sort((a, b) => a.nome.localeCompare(b.nome));
  atualizarResumoGeral();
  mostrarToast(`✅ ${arquivos.length} arquivos carregados`, 'success');
}

async function processarTAR(buffer) {
  let dados = new Uint8Array(buffer);

  if (document.getElementById('arquivoInput').files[0].name.endsWith('.gz') ||
      document.getElementById('arquivoInput').files[0].name.endsWith('.tgz')) {
    dados = pako.inflate(dados);
  }

  let offset = 0;

  while (offset < dados.length) {
    const headerBytes = dados.slice(offset, offset + 512);
    if (headerBytes.every(b => b === 0)) break;

    const nome = new TextDecoder().decode(headerBytes.slice(0, 100)).split('\0')[0];
    const tamanhoStr = new TextDecoder().decode(headerBytes.slice(124, 136)).trim();
    const tamanho = parseInt(tamanhoStr, 8);
    const tipo = String.fromCharCode(headerBytes[156]);

    offset += 512;

    if (nome &amp;&amp; tipo !== '5') {
      arquivos.push({ nome, dir: false, tamanho });

      if (ehTexto(nome) &amp;&amp; tamanho < 1000000) {
        const conteudo = new TextDecoder().decode(dados.slice(offset, offset + tamanho));
        conteudosTexto[nome] = conteudo;
      }
    }

    offset += Math.ceil(tamanho / 512) * 512;
  }

  arquivos.sort((a, b) => a.nome.localeCompare(b.nome));
  atualizarResumoGeral();
  mostrarToast(`✅ ${arquivos.length} arquivos carregados`, 'success');
}

function processarHTML(buffer) {
  const html = new TextDecoder().decode(buffer);
  const nome = document.getElementById('arquivoInput').files[0].name;

  arquivos.push({ nome, dir: false, tamanho: buffer.byteLength });
  conteudosTexto[nome] = html;

  const scriptRegex = /<script[^>]*>([\s\S]*?)<\/script>/gi;
  const styleRegex = /<style[^>]*>([\s\S]*?)<\/style>/gi;

  let match;
  let contador = 1;

  while ((match = scriptRegex.exec(html)) !== null) {
    const nomeScript = `extracted_script_${contador}.js`;
    arquivos.push({ nome: nomeScript, dir: false, tamanho: match[1].length });
    conteudosTexto[nomeScript] = match[1];
    contador++;
  }

  contador = 1;
  while ((match = styleRegex.exec(html)) !== null) {
    const nomeStyle = `extracted_style_${contador}.css`;
    arquivos.push({ nome: nomeStyle, dir: false, tamanho: match[1].length });
    conteudosTexto[nomeStyle] = match[1];
    contador++;
  }

  atualizarResumoGeral();
  mostrarToast(`✅ HTML processado`, 'success');
}

function ehTexto(nome) {
  const lower = nome.toLowerCase();
  if (lower.endsWith('/')) return false;
  return extensoesTexto.some(ext => lower.endsWith(ext));
}

// ============================================================
// DETECTOR: APIs
// ============================================================
function detectarAPIs() {
  let resultado = '=== APIs DETECTADAS ===\n\n';
  let apis = [];

  const padroes = {
    'fetch': /fetch\s*\(\s*['&quot;]/g,
    'axios': /axios\.(get|post|put|delete|patch)\s*\(/g,
    'XMLHttpRequest': /new\s+XMLHttpRequest\s*\(\s*\)/g,
    'WebSocket': /new\s+WebSocket\s*\(\s*['&quot;]/g,
    'GraphQL': /graphql|gql\s*`/g,
    'REST': /\/api\/|\/v\d+\//g,
    'Supabase': /supabase|createClient/g,
    'Firebase': /firebase|firestore|realtime/g,
    'MongoDB': /mongodb|mongoose|db\.collection/g,
    'PostgreSQL': /postgres|pg\.|sequelize/g,
    'MySQL': /mysql|mariadb/g,
    'Redis': /redis|cache/g,
    'AWS': /aws|s3|lambda|dynamodb/g,
    'Google Cloud': /google|gcp|cloud\.google/g,
    'Azure': /azure|microsoft/g,
    'Stripe': /stripe|payment/g,
    'PayPal': /paypal|checkout/g,
    'Auth0': /auth0|authentication/g,
    'JWT': /jwt|jsonwebtoken/g,
    'OAuth': /oauth|oauth2/g,
    'CORS': /cors|cross-origin/g
  };

  Object.entries(conteudosTexto).forEach(([arquivo, conteudo]) => {
    Object.entries(padroes).forEach(([tipo, padrao]) => {
      if (padrao.test(conteudo)) {
        apis.push({ arquivo, tipo });
        resultado += `✅ ${tipo}\n   Arquivo: ${arquivo}\n\n`;
      }
    });
  });

  resultado += `\n=== RESUMO ===\n`;
  resultado += `Total de APIs encontradas: ${apis.length}\n`;
  resultado += `Tipos únicos: ${new Set(apis.map(a => a.tipo)).size}\n`;

  document.getElementById('conteudoAPIs').textContent = resultado;
  document.getElementById('resultadoAPIs').style.display = 'block';
  memoriaAnalises.push({ tipo: 'apis', data: new Date().toISOString(), conteudo: resultado });
}

// ============================================================
// DETECTOR: BUGS
// ============================================================
function detectarBugs() {
  let resultado = '=== BUGS POTENCIAIS ===\n\n';
  let bugs = [];

  const padroes = {
    'console.log': /console\.(log|warn|error)\s*\(/g,
    'TODO': /TODO|FIXME|HACK|XXX/g,
    'undefined': /undefined|null/g,
    'any type': /:\s*any\s*[,;=\n]/g,
    'var': /\bvar\s+/g,
    'eval': /eval\s*\(/g,
    'innerHTML': /\.innerHTML\s*=/g,
    'setTimeout': /setTimeout\s*\(/g,
    'try-catch': /try\s*\{[\s\S]*?\}\s*catch/g,
    'async-await': /async\s+function|await\s+/g,
    'Promise': /new\s+Promise|\.then\(|\.catch\(/g,
    'callback hell': /function.*\(.*function.*\(.*function/g,
    'empty catch': /catch\s*\(\w*\)\s*\{\s*\}/g,
    'hardcoded URL': /https?:\/\/[a-zA-Z0-9.-]+/g,
    'hardcoded key': /(password|secret|key|token)\s*[:=]\s*['&quot;]/g
  };

  Object.entries(conteudosTexto).forEach(([arquivo, conteudo]) => {
    Object.entries(padroes).forEach(([tipo, padrao]) => {
      const matches = conteudo.match(padrao);
      if (matches) {
        bugs.push({ arquivo, tipo, count: matches.length });
        resultado += `⚠️ ${tipo}\n   Arquivo: ${arquivo}\n   Ocorrências: ${matches.length}\n\n`;
      }
    });
  });

  resultado += `\n=== RESUMO ===\n`;
  resultado += `Total de problemas: ${bugs.length}\n`;
  resultado += `Severidade: ${bugs.length > 10 ? '🔴 ALTA' : bugs.length > 5 ? '🟡 MÉDIA' : '🟢 BAIXA'}\n`;

  document.getElementById('conteudoBugs').textContent = resultado;
  document.getElementById('resultadoBugs').style.display = 'block';
  memoriaAnalises.push({ tipo: 'bugs', data: new Date().toISOString(), conteudo: resultado });
}

// ============================================================
// DETECTOR: DEPENDÊNCIAS
// ============================================================
function detectarDependencias() {
  let resultado = '=== DEPENDÊNCIAS DETECTADAS ===\n\n';
  let deps = {};

  // Procurar package.json
  const packageJson = Object.entries(conteudosTexto).find(([nome]) => nome.includes('package.json'));
  if (packageJson) {
    try {
      const pkg = JSON.parse(packageJson[1]);
      resultado += '📦 DEPENDÊNCIAS (package.json):\n';
      if (pkg.dependencies) {
        Object.entries(pkg.dependencies).forEach(([nome, versao]) => {
          resultado += `  ✅ ${nome}: ${versao}\n`;
          deps[nome] = versao;
        });
      }
      resultado += '\n📦 DEV DEPENDÊNCIAS:\n';
      if (pkg.devDependencies) {
        Object.entries(pkg.devDependencies).forEach(([nome, versao]) => {
          resultado += `  🔧 ${nome}: ${versao}\n`;
          deps[nome] = versao;
        });
      }
    } catch (e) {
      resultado += '❌ Erro ao parsear package.json\n';
    }
  }

  // Procurar imports
  resultado += '\n📥 IMPORTS DETECTADOS:\n';
  const importRegex = /import\s+.*\s+from\s+['&quot;](.*?)['&quot;]/g;
  const requireRegex = /require\s*\(\s*['&quot;](.*?)['&quot;]\s*\)/g;

  Object.entries(conteudosTexto).forEach(([arquivo, conteudo]) => {
    let match;
    while ((match = importRegex.exec(conteudo)) !== null) {
      const lib = match[1];
      if (!lib.startsWith('.')) {
        resultado += `  📦 ${lib} (em ${arquivo})\n`;
      }
    }

    while ((match = requireRegex.exec(conteudo)) !== null) {
      const lib = match[1];
      if (!lib.startsWith('.')) {

// DETECTOR: RÉPLIT
// ============================================================
function detectarReplit() {
  let resultado = '=== RÉPLIT &amp; VÍNCULOS DETECTADOS ===\n\n';
  let replits = [];

  const padroes = {
    'URL Réplit': /replit\.com|repl\.it/g,
    'Replit DB': /replit\.db|ReplitDB/g,
    'Replit Auth': /replit\.auth|replit\.user/g,
    'Replit Secrets': /REPLIT_|secrets\.|process\.env/g,
    'Replit Web': /replit\.web|web\.listen/g
  };

  Object.entries(conteudosTexto).forEach(([arquivo, conteudo]) => {
    Object.entries(padroes).forEach(([tipo, padrao]) => {
      if (padrao.test(conteudo)) {
        replits.push({ arquivo, tipo });
        resultado += `🔗 ${tipo}\n   Arquivo: ${arquivo}\n\n`;
      }
    });
  });

  // Procurar URLs
  resultado += '\n🌐 URLs ENCONTRADAS:\n';
  const urlRegex = /https?:\/\/[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}/g;
  Object.entries(conteudosTexto).forEach(([arquivo, conteudo]) => {
    const urls = conteudo.match(urlRegex);
    if (urls) {
      [...new Set(urls)].forEach(url => {
        resultado += `  🔗 ${url}\n`;
      });
    }
  });

  resultado += `\n=== RESUMO ===\n`;
  resultado += `Vínculos Réplit encontrados: ${replits.length}\n`;

  document.getElementById('conteudoReplit').textContent = resultado;
  document.getElementById('resultadoReplit').style.display = 'block';
  memoriaAnalises.push({ tipo: 'replit', data: new Date().toISOString(), conteudo: resultado });
}

// ============================================================
// DETECTOR: FUNÇÕES
// ============================================================
function detectarFuncoes() {
  let resultado = '=== FUNÇÕES DETECTADAS ===\n\n';
  let funcoes = [];

  const funcaoRegex = /(?:function\s+(\w+)|const\s+(\w+)\s*=\s*(?:async\s*)?\(|async\s+function\s+(\w+))/g;

  Object.entries(conteudosTexto).forEach(([arquivo, conteudo]) => {
    let match;
    while ((match = funcaoRegex.exec(conteudo)) !== null) {
      const nome = match[1] || match[2] || match[3];
      if (nome &amp;&amp; nome.length > 2) {
        funcoes.push({ arquivo, nome });
        resultado += `⚙️ ${nome}()\n   Arquivo: ${arquivo}\n\n`;
      }
    }
  });

  resultado += `\n=== RESUMO ===\n`;
  resultado += `Total de funções: ${funcoes.length}\n`;
  resultado += `Arquivos analisados: ${Object.keys(conteudosTexto).length}\n`;

  document.getElementById('conteudoFuncoes').textContent = resultado;
  document.getElementById('resultadoFuncoes').style.display = 'block';
  memoriaAnalises.push({ tipo: 'funcoes', data: new Date().toISOString(), conteudo: resultado });
}

// ATUALIZAR RESUMO GERAL
// ============================================================
function atualizarResumoGeral() {
  let resumo = `📊 RESUMO DO PROJETO\n\n`;
  resumo += `Total de arquivos: ${arquivos.length}\n`;
  resumo += `Arquivos lidos: ${Object.keys(conteudosTexto).length}\n`;
  resumo += `Tamanho total: ${(Object.values(conteudosTexto).reduce((a, b) => a + b.length, 0) / 1024).toFixed(2)} KB\n\n`;

  // Detectar tecnologias
  const temPackageJson = arquivos.some(a => a.nome.includes('package.json'));
  const temReact = Object.values(conteudosTexto).some(c => c.includes('react'));
  const temVue = Object.values(conteudosTexto).some(c => c.includes('vue'));
  const temAngular = Object.values(conteudosTexto).some(c => c.includes('angular'));
  const temNode = temPackageJson;
  const temPython = arquivos.some(a => a.nome.endsWith('.py'));
  const temManifest = arquivos.some(a => a.nome.includes('manifest.json'));
  const temServiceWorker = arquivos.some(a => a.nome.includes('service-worker') || a.nome.includes('sw.js'));

  resumo += '🛠️ TECNOLOGIAS DETECTADAS:\n';
    if (temReact) resumo += '  ✅ React\n';
  if (temVue) resumo += '  ✅ Vue.js\n';
  if (temAngular) resumo += '  ✅ Angular\n';
  if (temNode) resumo += '  ✅ Node.js\n';
  if (temPython) resumo += '  ✅ Python\n';
  if (temManifest) resumo += '  ✅ PWA (manifest.json)\n';
  if (temServiceWorker) resumo += '  ✅ Service Worker\n';

  resumo += '\n📁 ESTRUTURA:\n';
  const pastas = [...new Set(arquivos.map(a => a.nome.split('/')[0]))].filter(Boolean);
  pastas.slice(0, 10).forEach(pasta => {
    resumo += `  📂 ${pasta}\n`;
  });

  document.getElementById('resumoGeral').innerHTML = `<pre>${resumo}</pre>`;
}

// ============================================================
// SALVAR EM MEMÓRIA
// ============================================================
function salvarEmMemoria(tipo) {
  let conteudo = '';
  
  if (tipo === 'apis') conteudo = document.getElementById('conteudoAPIs').textContent;
  else if (tipo === 'bugs') conteudo = document.getElementById('conteudoBugs').textContent;
  else if (tipo === 'deps') conteudo = document.getElementById('conteudoDeps').textContent;
  else if (tipo === 'replit') conteudo = document.getElementById('conteudoReplit').textContent;
  else if (tipo === 'funcoes') conteudo = document.getElementById('conteudoFuncoes').textContent;

  if (!conteudo) {
    mostrarToast('Nada para salvar.', 'error');
    return;
  }

  const analise = {
    id: Date.now(),
    tipo: tipo,
    data: new Date().toISOString(),
    conteudo: conteudo
  };

  memoriaAnalises.push(analise);
  salvarMemoriaLocalStorage();
  mostrarToast(`✅ ${tipo.toUpperCase()} salvo em memória!`, 'success');
  renderizarMemoria();
}

function salvarMemoriaLocalStorage() {
  localStorage.setItem('analyzer_memoria', JSON.stringify(memoriaAnalises));
}

function carregarMemoriaLocalStorage() {
  const saved = localStorage.getItem('analyzer_memoria');
  if (saved) {
    memoriaAnalises = JSON.parse(saved);
    renderizarMemoria();
  }
}

function renderizarMemoria() {
  const el = document.getElementById('listaMemoria');
  if (!memoriaAnalises.length) {
    el.innerHTML = '<div class=&quot;small&quot; style=&quot;color:#64748b;&quot;>Nenhuma análise salva.</div>';
    return;
  }

  el.innerHTML = memoriaAnalises.slice().reverse().map(analise => `
    <div class=&quot;memoria-item&quot;>
      <div class=&quot;memoria-item-header&quot;>
        <div>
          <div class=&quot;memoria-item-titulo&quot;>📌 ${analise.tipo.toUpperCase()}</div>
          <div class=&quot;memoria-item-data&quot;>${new Date(analise.data).toLocaleString('pt-BR')}</div>
        </div>
        <div style=&quot;display:flex;gap:4px;&quot;>
          <button class=&quot;btn-mini blue&quot; onclick=&quot;copiarMemoria(${analise.id})&quot;>📋</button>
          <button class=&quot;btn-mini green&quot; onclick=&quot;baixarMemoria(${analise.id})&quot;>⬇️</button>
          <button class=&quot;btn-mini red&quot; onclick=&quot;excluirMemoria(${analise.id})&quot;>🗑</button>
        </div>
      </div>
      <div class=&quot;memoria-item-conteudo&quot;>${analise.conteudo.substring(0, 300)}${analise.conteudo.length > 300 ? '...' : ''}</div>
    </div>
  `).join('');
}

function copiarMemoria(id) {
  const analise = memoriaAnalises.find(a => a.id === id);
  if (!analise) return;
  navigator.clipboard.writeText(analise.conteudo).then(() => mostrarToast('✅ Copiado!', 'success'));
}

function baixarMemoria(id) {
  const analise = memoriaAnalises.find(a => a.id === id);
  if (!analise) return;
  const blob = new Blob([analise.conteudo], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `analise_${analise.tipo}_${analise.id}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  mostrarToast('⬇️ Download!', 'success');
}

function excluirMemoria(id) {
  if (!confirm('Excluir?')) return;
  memoriaAnalises = memoriaAnalises.filter(a => a.id !== id);
  salvarMemoriaLocalStorage();
  renderizarMemoria();
  mostrarToast('🗑️ Excluído', 'info');
}

function limparMemoria() {
  if (!confirm('Excluir TODA a memória?')) return;
  memoriaAnalises = [];
  salvarMemoriaLocalStorage();
  renderizarMemoria();
  mostrarToast('🗑️ Memória limpa', 'info');
}

function exportarMemoria() {
  const blob = new Blob([JSON.stringify(memoriaAnalises, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `memoria_completa_${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  mostrarToast('⬇️ Exportado!', 'success');
}

// ============================================================
// CONFIGURAÇÃO DA IA
// ============================================================
const PROVEDORES = {
  openai: {
    url: 'https://api.openai.com/v1/chat/completions',
    modelos: ['gpt-4o','gpt-4o-mini','gpt-4-turbo','gpt-4','gpt-3.5-turbo'],
    headers: (token) => ({ 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) => JSON.stringify({ model: modelo, messages: msgs, max_tokens: maxTokens }),
    extrairResposta: (data) => data.choices[0].message.content
  },
  anthropic: {
    url: 'https://api.anthropic.com/v1/messages',
    modelos: ['claude-3-5-sonnet-20241022','claude-3-opus-20240229','claude-3-sonnet-20240229','claude-3-haiku-20240307'],
    headers: (token) => ({ 'x-api-key': token, 'anthropic-version': '2023-06-01', 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) => {
      const system = msgs.find(m => m.role === 'system');
      const userMsgs = msgs.filter(m => m.role !== 'system');
      const payload = { model: modelo, max_tokens: maxTokens, messages: userMsgs };
      if (system) payload.system = system.content;
      return JSON.stringify(payload);
    },
    extrairResposta: (data) => data.content[0].text
  },
  gemini: {
    url: (modelo, token) => `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${token}`,
    modelos: ['gemini-1.5-pro-latest','gemini-1.5-flash-latest','gemini-pro'],
    headers: () => ({ 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) => {
      const parts = msgs.map(m => ({ text: `${m.role === 'user' ? 'Usuário' : 'Assistente'}: ${m.content}` }));
      return JSON.stringify({ contents: [{ parts }], generationConfig: { maxOutputTokens: maxTokens } });
    },
    extrairResposta: (data) => data.candidates[0].content.parts[0].text
  },
  groq: {
    url: 'https://api.groq.com/openai/v1/chat/completions',
    modelos: ['llama-3.1-70b-versatile','llama-3.1-8b-instant','mixtral-8x7b-32768','gemma2-9b-it'],
    headers: (token) => ({ 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) => JSON.stringify({ model: modelo, messages: msgs, max_tokens: maxTokens }),
    extrairResposta: (data) => data.choices[0].message.content
  },
  openrouter: {
    url: 'https://openrouter.ai/api/v1/chat/completions',
    modelos: ['anthropic/claude-3.5-sonnet','openai/gpt-4o','meta-llama/llama-3.1-70b-instruct','google/gemini-flash-1.5'],
    headers: (token) => ({ 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'HTTP-Referer': window.location.href }),
    body: (modelo, msgs, maxTokens) => JSON.stringify({ model: modelo, messages: msgs, max_tokens: maxTokens }),
    extrairResposta: (data) => data.choices[0].message.content
  },
  ollama: {
    url: () => document.getElementById('iaUrlCustom').value || 'http://localhost:11434/api/chat',
    modelos: ['llama3.1','llama3','mistral','codellama','phi3','qwen2'],
    headers: () => ({ 'Content-Type': 'application/json' }),
    body: (modelo, msgs, maxTokens) => JSON.stringify({ model: modelo, messages: msgs, stream: false }),
    extrairResposta: (data) => data.message.content
  }

// ============================================================
// CHAMAR IA - UNIVERSAL
// ============================================================
async function chamarIA(mensagens) {
  const provedor = document.getElementById('iaProvedor').value;
  const modelo = document.getElementById('iaModelo').value;
  const token = document.getElementById('iaToken').value;
  const config = PROVEDORES[provedor];

  if (!config) throw new Error('Provedor não configurado');
  if (provedor !== 'ollama' &amp;&amp; !token) throw new Error('Configure sua chave de API');

  const url = typeof config.url === 'function' ? config.url(modelo, token) : config.url;
  const headers = config.headers(token);
  const maxTokens = Math.min(Math.ceil(maxRespostaIAChars / 4), 32000);
  const body = config.body(modelo, mensagens, maxTokens);

  const response = await fetch(url, { method: 'POST', headers, body });

  if (!response.ok) {
    const errText = await response.text();
    throw new Error(`HTTP ${response.status}: ${errText.substring(0, 200)}`);
  }

  const data = await response.json();
  let resposta = config.extrairResposta(data);

  if (resposta.length > maxRespostaIAChars) {
    resposta = resposta.substring(0, maxRespostaIAChars) + '\n\n[... truncado]';
  }

  atualizarInfoModelo();
  return resposta;
}

// ============================================================
// CONSTRUIR CONTEXTO
// ============================================================
function construirContexto(incluirTodos = false) {
  let ctx = '=== CONTEXTO DO PROJETO ===\n\n';
  ctx += document.getElementById('diagnostico').textContent + '\n\n';

  const arquivosParaIncluir = incluirTodos
    ? Object.keys(conteudosTexto)
    : Object.keys(conteudosTexto)
        .filter(a =>
          a.includes('package.json') || a.includes('README') ||
          a.includes('main') || a.includes('index') ||
          a.includes('app') || a.includes('config')
        )
        .slice(0, 15);

  ctx += `=== ARQUIVOS (${arquivosParaIncluir.length} de ${Object.keys(conteudosTexto).length}) ===\n\n`;

  let totalChars = ctx.length;
  for (const arquivo of arquivosParaIncluir) {
    let conteudo = conteudosTexto[arquivo] || '';
    const maxPorArquivo = Math.floor((maxContextoIAChars - totalChars) / Math.max(1, arquivosParaIncluir.length));
    if (conteudo.length > maxPorArquivo) {
      conteudo = conteudo.substring(0, maxPorArquivo) + '\n[... truncado]';
    }
    const bloco = `\n--- ${arquivo} ---\n${conteudo}\n`;
    if (totalChars + bloco.length > maxContextoIAChars) break;
    ctx += bloco;
    totalChars += bloco.length;
  }

  return ctx;
}

// ============================================================
// RENDERIZAR RESPOSTA IA
// ============================================================
function renderizarRespostaIA(containerEl, resposta, nomeArquivo = null) {

          <button class=&quot;btn-mini orange&quot; onclick=&quot;salvarRespostaComNota('${id}', '${(nomeArquivo||'projeto').replace(/'/g,&quot;\\'&quot;)}')&quot;>📝 Salvar</button>
        </div>
      </div>
      <div class=&quot;ia-resposta-texto&quot; id=&quot;${id}&quot;>${escapeHtml(resposta)}</div>
      <div class=&quot;nota-ia-box&quot; id=&quot;nota_${id}&quot; style=&quot;display:none;&quot;>
        <h4>📝 Adicionar Nota</h4>
        <textarea class=&quot;arquivo-ia-prompt&quot; id=&quot;notaTexto_${id}&quot; placeholder=&quot;Sua observação...&quot;></textarea>
        <div class=&quot;nota-ia-actions&quot;>

        </div>
      </div>
    </div>`;
}

function escapeHtml(str) {
  return str.replace(/&amp;/g,'&amp;amp;').replace(/</g,'&amp;lt;').replace(/>/g,'&amp;gt;');
}

function copiarResposta(id) {
  const txt = document.getElementById(id).textContent;
  navigator.clipboard.writeText(txt).then(() => mostrarToast('✅ Copiado!', 'success'));
}

function baixarResposta(id) {
  const txt = document.getElementById(id).textContent;
  const blob = new Blob([txt], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `resposta_ia_${Date.now()}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  mostrarToast('⬇️ Download!', 'success');
}

function salvarRespostaComNota(id, nomeArquivo) {

function confirmarSalvarNota(id, nomeArquivo) {

  const notaExtra = document.getElementById('notaTexto_' + id).value;

  const nota = {
    id: Date.now(),
    data: new Date().toISOString(),
    arquivo: nomeArquivo,
    respostaIA: respostaIA,
    notaUsuario: notaExtra,
    tipo: 'analise_ia'
  };

  notasSalvas.push(nota);
  salvarNotasLocalStorage();
  document.getElementById('nota_' + id).style.display = 'none';
  mostrarToast('✅ Nota salva!', 'success');
  renderizarNotasSalvas();
}

    el.innerHTML = '<div class=&quot;small&quot; style=&quot;color:#64748b;&quot;>Nenhuma nota.</div>';

  el.innerHTML = notasSalvas.slice().reverse().map(nota => `

          <div class=&quot;nota-salva-titulo&quot;>📄 ${nota.arquivo}</div>

async function carregarArquivo() {
  const input = document.getElementById('arquivoInput');
  if (!input.files || !input.files[0]) {
    mostrarToast('Selecione um arquivo.', 'error');
    return;
  }

  const file = input.files[0];
  const buffer = await file.arrayBuffer();
  const formato = document.getElementById('formatoArquivo').value;

  arquivos = [];
  conteudosTexto = {};

  try {
    if (formato === 'auto' || formato === 'zip') {
      if (file.name.endsWith('.zip')) {
        await processarZIP(buffer);
        return;
      }
    }

    if (formato === 'auto' || formato === 'tar' || formato === 'taz') {
      if (file.name.endsWith('.tar') || file.name.endsWith('.tar.gz') || file.name.endsWith('.tgz')) {
        await processarTAR(buffer);
        return;
      }
    }

    if (formato === 'auto' || formato === 'html') {
      if (file.name.endsWith('.html')) {
        processarHTML(buffer);
        return;
      }
    }

    mostrarToast('Formato não suportado.', 'error');
  } catch (e) {
    mostrarToast('Erro: ' + e.message, 'error');
    console.error(e);
  }
}

async function processarZIP(buffer) {
  const zip = await JSZip.loadAsync(buffer);
  zip.forEach((path, entry) => {
    arquivos.push({ nome: path, dir: entry.dir, tamanho: entry._data.uncompressedSize });
  });

  for (const item of arquivos) {
    if (!item.dir &amp;&amp; ehTexto(item.nome) &amp;&amp; item.tamanho < maxTamanhoByte) {
      try {
        conteudosTexto[item.nome] = await zip.file(item.nome).async('string');
      } catch (e) {
        conteudosTexto[item.nome] = '[ERRO]';
      }
    }
  }

  arquivos.sort((a, b) => a.nome.localeCompare(b.nome));
  renderArquivos();
  diagnosticar();
  mostrarToast(`✅ ${arquivos.length} arquivos carregados`, 'success');
  atualizarStatusBar();
}

async function processarTAR(buffer) {
  let dados = new Uint8Array(buffer);

  if (document.getElementById('arquivoInput').files[0].name.endsWith('.gz') ||
      document.getElementById('arquivoInput').files[0].name.endsWith('.tgz')) {
    dados = pako.inflate(dados);
  }

  const view = new DataView(dados.buffer);
  let offset = 0;

  while (offset < dados.length) {
    const headerBytes = dados.slice(offset, offset + 512);
    if (headerBytes.every(b => b === 0)) break;

    const nome = new TextDecoder().decode(headerBytes.slice(0, 100)).split('\0')[0];
    const tamanhoStr = new TextDecoder().decode(headerBytes.slice(124, 136)).trim();
    const tamanho = parseInt(tamanhoStr, 8);
    const tipo = String.fromCharCode(headerBytes[156]);

    offset += 512;

        if (nome &amp;&amp; tipo !== '5') {
      arquivos.push({ nome, dir: false, tamanho });

      if (ehTexto(nome) &amp;&amp; tamanho < maxTamanhoByte) {
        const conteudo = new TextDecoder().decode(dados.slice(offset, offset + tamanho));
        conteudosTexto[nome] = conteudo;
      }
    }

    offset += Math.ceil(tamanho / 512) * 512;
  }

  arquivos.sort((a, b) => a.nome.localeCompare(b.nome));
  renderArquivos();
  diagnosticar();
  mostrarToast(`✅ ${arquivos.length} arquivos carregados`, 'success');
  atualizarStatusBar();
}

function processarHTML(buffer) {
  const html = new TextDecoder().decode(buffer);
  const nome = document.getElementById('arquivoInput').files[0].name;

  arquivos.push({ nome, dir: false, tamanho: buffer.byteLength });
  conteudosTexto[nome] = html;

  const scriptRegex = /<script[^>]*>([\s\S]*?)<\/script>/gi;
  const styleRegex = /<style[^>]*>([\s\S]*?)<\/style>/gi;

  let match;
  let contador = 1;

  while ((match = scriptRegex.exec(html)) !== null) {
    const nomeScript = `extracted_script_${contador}.js`;
    arquivos.push({ nome: nomeScript, dir: false, tamanho: match[1].length });
    conteudosTexto[nomeScript] = match[1];
    contador++;
  }

  contador = 1;
  while ((match = styleRegex.exec(html)) !== null) {
    const nomeStyle = `extracted_style_${contador}.css`;
    arquivos.push({ nome: nomeStyle, dir: false, tamanho: match[1].length });
    conteudosTexto[nomeStyle] = match[1];
    contador++;
  }

  renderArquivos();
  diagnosticar();
  mostrarToast(`✅ HTML processado com ${arquivos.length} itens`, 'success');
  atualizarStatusBar();
}

function ehTexto(nome) {
  const lower = nome.toLowerCase();
  if (lower.endsWith('/')) return false;
  return extensoesTexto.some(ext => lower.endsWith(ext));
}

function atualizarStatusBar() {
  const bar = document.getElementById('statusBar');
  const total = arquivos.length;
  const textos = Object.keys(conteudosTexto).length;
  bar.innerHTML = `<span><span class=&quot;status-dot green&quot;></span> ${total} arquivos | ${textos} lidos</span>`;
}

// ============================================================
function buscarTermos() {
  const termos = document.getElementById('termosBusca').value
    .split(',')
    .map(t => t.trim().toLowerCase())
    .filter(Boolean);

  let saida = '';
  let totalEncontrados = 0;

  Object.entries(conteudosTexto).forEach(([nome, conteudo]) => {
    const linhas = conteudo.split(/\r?\n/);
    linhas.forEach((linha, idx) => {
      const low = linha.toLowerCase();
      termos.forEach(termo => {
        if (low.includes(termo)) {
          totalEncontrados++;
          saida += `${nome}:${idx + 1} | termo: ${termo}\n`;
          saida += linha.slice(0, 300) + '\n\n';
        }
      });
    });
  });

  if (!saida) saida = 'Nenhum termo encontrado.';
  else saida = `Total encontrado: ${totalEncontrados}\n\n` + saida;

  document.getElementById('resultadoBusca').textContent = saida;
}

// ============================================================
function temArquivo(parte) {
  return arquivos.some(a => a.nome.toLowerCase().includes(parte.toLowerCase()));
}

function temConteudo(parte) {
  const p = parte.toLowerCase();
  return Object.values(conteudosTexto).some(c => c.toLowerCase().includes(p));
}

function diagnosticar() {
  let d = '=== DIAGNÓSTICO AUTOMÁTICO ===\n\n';
  d += `Total de itens: ${arquivos.length}\n`;
  d += `Arquivos de texto lidos: ${Object.keys(conteudosTexto).length}\n`;
  d += `Tamanho máximo por arquivo: ${(maxTamanhoByte / 1024).toFixed(0)} KB\n\n`;

  const hasPackage = temArquivo('package.json');
  const hasSrc = temArquivo('src/');
  const hasDist = temArquivo('dist/') || temArquivo('assets/');
  const hasVite = temArquivo('vite.config') || temConteudo('&quot;vite&quot;');
  const hasReact = temConteudo('&quot;react&quot;') || temArquivo('.tsx');
  const hasNext = temArquivo('next.config') || temConteudo('&quot;next&quot;');
  const hasManifest = temArquivo('manifest.json');
  const hasServiceWorker = temArquivo('service-worker') || temArquivo('sw.js');
  const hasSupabase = temConteudo('supabase');
  const hasNeon = temConteudo('neon');
  const hasDocker = temArquivo('dockerfile') || temArquivo('docker-compose');
  const hasGit = temArquivo('.git');
  const hasEnv = temArquivo('.env');

  d += hasPackage ? '✅ Tem package.json\n' : '❌ Sem package.json\n';
  d += hasSrc ? '✅ Tem pasta src/\n' : '⚠️ Sem src/\n';
  d += hasDist ? '⚠️ Tem dist/assets (compilado)\n' : '✅ Sem dist\n';
  d += hasVite ? '✅ Vite detectado\n' : '';
  d += hasReact ? '✅ React detectado\n' : '';
  d += hasNext ? '⚠️ Next.js detectado\n' : '';
  d += hasManifest ? '✅ PWA (manifest.json)\n' : '⚠️ Sem PWA\n';
  d += hasServiceWorker ? '✅ Service Worker (PWA)\n' : '⚠️ Sem SW\n';
  d += hasSupabase ? '⚠️ Supabase detectado\n' : '';
  d += hasNeon ? '⚠️ Neon detectado\n' : '';
  d += hasDocker ? '✅ Docker detectado\n' : '';
  d += hasGit ? '✅ Git detectado\n' : '';
  d += hasEnv ? '✅ Arquivo .env\n' : '⚠️ Sem .env\n';

  d += '\n=== RECOMENDAÇÕES ===\n';
  if (hasPackage &amp;&amp; hasSrc &amp;&amp; hasVite &amp;&amp; hasReact) {
    d += '✅ Projeto React + Vite bem estruturado.\n';
    d += '   Build: npm run build\n';
    d += '   Deploy: Netlify, Vercel ou similar\n';
  } else if (!hasPackage &amp;&amp; hasDist) {
    d += '⚠️ Versão compilada. Difícil de editar.\n';
  } else if (hasManifest &amp;&amp; hasServiceWorker) {
    d += '✅ PWA detectado. Funciona offline.\n';
  } else {
    d += '❓ Tipo não confirmado. Verifique package.json.\n';
  }

  document.getElementById('diagnostico').textContent = d;
}

    respEl.innerHTML = `<span class=&quot;bad&quot;>Erro: ${e.message}</span>`;
    mostrarToast('Erro: ' + e.message, 'error');
  }
}

async function resumirArquivoAtual() {
  if (!iaConectada) {
    mostrarToast('Configure a IA primeiro.', 'error');
    return;
  }

  if (!arquivoAtualNome) {
    mostrarToast('Abra um arquivo primeiro.', 'error');
    return;
  }

  const conteudo = conteudosTexto[arquivoAtualNome];
  const respEl = document.getElementById('respostaArquivoIA');
  respEl.innerHTML = '<span class=&quot;spinner&quot;></span> Resumindo...';

  try {
    const msgs = [
      { role: 'user', content: `Resuma este arquivo em 3-5 linhas:\n\n${conteudo}` }
    ];
    const resposta = await chamarIA(msgs);
    renderizarRespostaIA(respEl, resposta, arquivoAtualNome);
  } catch (e) {
    respEl.innerHTML = `<span class=&quot;bad&quot;>Erro: ${e.message}</span>`;
    mostrarToast('Erro: ' + e.message, 'error');
  }
}

// ============================================================
// IA: ANÁLISE PRINCIPAL
// ============================================================
async function enviarParaIA(tipo) {
  if (!iaConectada) {
    mostrarToast('Configure a IA primeiro.', 'error');
    return;
  }

  let prompt = '';
  let respEl = '';

  if (tipo === 'analise') {
    prompt = document.getElementById('promptAnalise').value;
    respEl = 'respostaAnalise';
  } else if (tipo === 'correcao') {
    prompt = document.getElementById('promptCorrecao').value;
    respEl = 'respostaCorrecao';
  } else if (tipo === 'orientacao') {
    prompt = document.getElementById('promptOrientacao').value;
    respEl = 'respostaOrientacao';
  }

  if (!prompt.trim()) {
    mostrarToast('Digite um prompt.', 'error');
    return;
  }

  const resposta = document.getElementById(respEl);
  resposta.innerHTML = '<span class=&quot;spinner&quot;></span> Processando...';

  try {
    const incluirTodos = document.getElementById('incluirTodosArquivos').checked;
    const ctx = construirContexto(incluirTodos);
    
    const msgs = [
      { role: 'user', content: `${ctx}\n\n${prompt}` }
    ];
    
    const respIa = await chamarIA(msgs);
    renderizarRespostaIA(resposta, respIa, 'projeto');
  } catch (e) {
    resposta.innerHTML = `<span class=&quot;bad&quot;>Erro: ${e.message}</span>`;
    mostrarToast('Erro: ' + e.message, 'error');
  }
}

// ============================================================
// IA: GERAR RELATÓRIO COM IA
// ============================================================
async function gerarRelatorioIACompleto() {
  if (!iaConectada) {
    mostrarToast('Configure a IA primeiro.', 'error');
    return;
  }

  const respEl = document.getElementById('modalSaida');
  respEl.innerHTML = '<div class=&quot;modal-content&quot;><span class=&quot;spinner&quot;></span> Gerando relatório com IA...</div>';

  try {
    const ctx = construirContexto(true);
    const msgs = [
      { role: 'user', content: `${ctx}\n\nGere um relatório completo e profissional deste projeto. Inclua: estrutura, tecnologias, pontos fortes, pontos fracos, recomendações.` }
    ];
    
    const resposta = await chamarIA(msgs);
    const blob = new Blob([resposta], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `relatorio_ia_${Date.now()}.txt`;
    a.click();
    URL.revokeObjectURL(url);
    
    fecharModal('modalSaida');
    mostrarToast('📊 Relatório gerado com IA!', 'success');
  } catch (e) {
    mostrarToast('Erro: ' + e.message, 'error');
    mostrarOpcoesSaida();
  }
}

// ============================================================
// CHAT LIVRE
// ============================================================
async function enviarChat() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();

  if (!msg) return;
  if (!iaConectada) {
    mostrarToast('Configure a IA primeiro.', 'error');
    return;
  }

  // Adicionar mensagem do usuário ao histórico
  chatHistoricoArr.push({ role: 'user', content: msg });
  renderizarChat();
  input.value = '';

  try {
    const comContexto = document.getElementById('chatComContexto').checked;
    let mensagens = [...chatHistoricoArr];

    if (comContexto &amp;&amp; chatHistoricoArr.length === 1) {
      const ctx = construirContexto(false);
      mensagens[0].content = `${ctx}\n\n${msg}`;
    }

    const resposta = await chamarIA(mensagens);
    chatHistoricoArr.push({ role: 'assistant', content: resposta });
    renderizarChat();
  } catch (e) {
    mostrarToast('Erro: ' + e.message, 'error');
  }
}

function renderizarChat() {
  const el = document.getElementById('chatHistorico');
  if (!chatHistoricoArr.length) {
    el.innerHTML = '<div class=&quot;small&quot; style=&quot;color:#64748b;&quot;>Chat vazio...</div>';
    return;
  }

  el.innerHTML = chatHistoricoArr.map(msg => `
    <div class=&quot;chat-msg ${msg.role}&quot;>
      <div class=&quot;chat-msg-label&quot;>${msg.role === 'user' ? '👤 Você' : '🤖 IA'}</div>
      <div class=&quot;chat-msg-texto&quot;>${escapeHtml(msg.content)}</div>
    </div>
  `).join('');

  el.scrollTop = el.scrollHeight;
}

function limparChat() {
  if (!confirm('Limpar histórico do chat?')) return;
  chatHistoricoArr = [];
  renderizarChat();
  mostrarToast('💬 Chat limpo', 'info');
}

function exportarChat() {
  const txt = chatHistoricoArr.map(msg => `${msg.role === 'user' ? 'Você' : 'IA'}: ${msg.content}`).join('\n\n---\n\n');
  const blob = new Blob([txt], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `chat_${Date.now()}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  mostrarToast('💾 Chat exportado!', 'success');
}

// ============================================================
// LIMPAR TUDO
// ============================================================
function limparTudo() {
  if (confirm('Tem certeza que quer limpar TUDO?')) {

    conteudosTexto = {};

    document.getElementById('contadorArquivos').textContent = '0 arquivos';
    document.getElementById('arquivoIAPanel').style.display = 'none';
    atualizarStatusBar();
    mostrarToast('🗑️ Tudo limpo!', 'info');
  }
}

</script>

function validarCodigo() {
  const codigo = document.getElementById('editor').value;
  const tipo = document.getElementById('tipoArquivo').value;
  
  if (!codigo) {
    mostrarToast('❌ Cole um código!');
    return;
  }
  
  const el = document.getElementById('resultadoValidacao');
  let resultado = '✅ Validação OK\n';
  resultado += `Tipo: ${tipo}\n`;
  resultado += `Linhas: ${codigo.split('\n').length}\n`;
  resultado += `Caracteres: ${codigo.length}`;
  
  if (tipo === 'json') {
    try {
      JSON.parse(codigo);
      resultado += '\n✅ JSON válido!';
    } catch (e) {
      resultado = '❌ JSON inválido: ' + e.message;
    }
  }
  
  el.innerHTML = `<div class=&quot;code-box&quot;>${resultado}</div>`;
  mostrarToast('✅ Validado!');
}

function formatarCodigo() {
  const codigo = document.getElementById('editor').value;
  const tipo = document.getElementById('tipoArquivo').value;
  
  if (!codigo) return;
  
  let formatado = codigo;
  if (tipo === 'json') {
    try {
      formatado = JSON.stringify(JSON.parse(codigo), null, 2);
    } catch (e) {
      mostrarToast('❌ JSON inválido!');
      return;
    }
  }
  
  document.getElementById('editor').value = formatado;
  mostrarToast('✅ Formatado!');
}

function analisarCodigo() {
  const codigo = document.getElementById('editor').value;
  if (!codigo) return;
  
  let analise = '📊 ANÁLISE:\n\n';
  analise += `Linhas: ${codigo.split('\n').length}\n`;
  analise += `Caracteres: ${codigo.length}\n\n`;
  analise += '🔍 DETECTADO:\n';
  
  if (codigo.includes('async')) analise += '✅ Async/Await\n';
  if (codigo.includes('try')) analise += '✅ Try/Catch\n';
  if (codigo.includes('class')) analise += '✅ Classes\n';
  if (codigo.includes('function')) analise += '✅ Funções\n';
  if (codigo.includes('=>')) analise += '✅ Arrow Functions\n';
  if (codigo.includes('const')) analise += '✅ Const\n';
  
  analise += '\n⚠️ SUGESTÕES:\n';
  if (codigo.includes('var ')) analise += '⚠️ Usar const/let em vez de var\n';
  if (codigo.includes('console.log')) analise += '⚠️ Remover console.log\n';
  
  document.getElementById('analiseResultado').textContent = analise;
  mostrarToast('✅ Analisado!');
}

function salvarArquivo() {

  const tipo = document.getElementById('tipoArquivo').value;
  
  if (!codigo) return;
  
  const blob = new Blob([codigo], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `arquivo.${tipo}`;
  a.click();
  mostrarToast('⬇️ Arquivo salvo!');
}

// ============================================================
// HISTÓRICO
// ============================================================
function salvarHistorico(tipo, titulo, conteudo) {
  historico.push({
    id: Date.now(),
    tipo,
    titulo: titulo.substring(0, 50),
    conteudo,
    data: new Date().toLocaleString('pt-BR')
  });
  localStorage.setItem('pwa_historico', JSON.stringify(historico));
}

function carregarHistorico() {
  const saved = localStorage.getItem('pwa_historico');
  if (saved) historico = JSON.parse(saved);
}

function renderizarHistorico() {
  const el = document.getElementById('modalConteudo');
  
  if (!historico.length) {
    el.innerHTML = '<p>Nenhum item no histórico.</p>';
    return;
  }
  
  el.innerHTML = historico.slice().reverse().map(h => `
    <div class=&quot;item-list&quot;>
      <strong>${h.titulo}</strong>
      <small>${h.data}</small>
      <div style=&quot;margin-top:10px;&quot;>
        <button class=&quot;btn-secondary&quot; onclick=&quot;copiarHistoricoItem('${h.id}')&quot;>📋 Copiar</button>
        <button class=&quot;btn-danger&quot; onclick=&quot;excluirHistoricoItem('${h.id}')&quot;>🗑️ Deletar</button>
      </div>
    </div>
  `).join('');
}

function copiarHistoricoItem(id) {
  const item = historico.find(h => h.id == id);
  if (item) {
    navigator.clipboard.writeText(item.conteudo);
    mostrarToast('✅ Copiado!');
  }
}

function excluirHistoricoItem(id) {
  historico = historico.filter(h => h.id != id);
  localStorage.setItem('pwa_historico', JSON.stringify(historico));
  renderizarHistorico();
  mostrarToast('🗑️ Deletado!');
}

function limparHistorico() {
  if (confirm('Limpar TODO o histórico?')) {
    historico = [];
    localStorage.removeItem('pwa_historico');
    mostrarToast('🗑️ Histórico limpo!');
  }
}

function exportarHistorico() {
  const blob = new Blob([JSON.stringify(historico, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `historico_${Date.now()}.json`;
  a.click();
  mostrarToast('⬇️ Exportado!');
}

// ============================================================
// UTILITÁRIOS
// ============================================================
function copiarDe(btn) {
  const txt = btn.previousElementSibling.textContent;
  navigator.clipboard.writeText(txt);
  mostrarToast('✅ Copiado!');
}

function copiarAnalise() {
  const txt = document.getElementById('analiseResultado').textContent;
  navigator.clipboard.writeText(txt);
  mostrarToast('✅ Copiado!');
}

function baixarAnalise() {
  const txt = document.getElementById('analiseResultado').textContent;

  const url = URL.createObjectURL(blob);

  a.href = url;
  a.download = `analise_${Date.now()}.txt`;
  a.click();
  mostrarToast('⬇️ Baixado!');
}

</script>

</body>

        hideLoader();
      }
    });

    async function processZip(zip) {
      currentFiles = [];
      fileContents = {};

      zip.forEach((path, entry) => {
        if (!entry.dir) currentFiles.push(path);
      });

      currentFiles.sort();
      showLoader(`Processando ${currentFiles.length} arquivos...`);

      let promises = currentFiles.map(async (path) => {
        const ext = path.split('.').pop().toLowerCase();
        if (SKIP_EXT.has(ext)) {
          fileContents[path] = &quot;[Arquivo binário/mídia não legível]&quot;;
          return;
        }
        try {
          fileContents[path] = await zip.file(path).async('string');
        } catch(e) {
          fileContents[path] = &quot;[Erro ao ler arquivo]&quot;;
        }
      });

      await Promise.all(promises);
      renderFileList();
      showSection('editor');
    }

    function renderFileList() {
      const container = document.getElementById('fileList');
      document.getElementById('filesCount').innerText = currentFiles.length;
      
      if (currentFiles.length === 0) {
        container.innerHTML = '<p class=&quot;text-gray-500 italic p-2 text-center&quot;>Nenhum arquivo encontrado.</p>';
        return;
      }

      container.innerHTML = currentFiles.map(file => {
        const isSujo = checkSingleFileIsDirty(file);
        const badge = isSujo ? '<span class=&quot;text-[9px] bg-red-950 text-red-400 px-1 rounded&quot;>sujo</span>' : '';
        return `<div class=&quot;p-1.5 hover:bg-borderGreen rounded cursor-pointer flex justify-between items-center truncate border-b border-borderGreen/10&quot; onclick=&quot;openFile('${file}')&quot;>
          <span class=&quot;truncate&quot;>📄 ${file}</span>
          ${badge}
        </div>`;
      }).join('');
    }

    function checkSingleFileIsDirty(filename) {
      const content = fileContents[filename] || &quot;&quot;;
      return PATS.some(p => {
        p.re.lastIndex = 0;
        const test = p.re.test(content);
        p.re.lastIndex = 0;
        return test;
      });
    }

    function openFile(filename) {
      activeFile = filename;
      document.getElementById('currentFileName').innerText = `📝 ${filename}`;
      document.getElementById('fileContent').value = fileContents[filename] || &quot;&quot;;
      showSection('editor');
    }

    function filterFiles() {
      const term = document.getElementById('fileSearch').value.toLowerCase();
      const filtered = currentFiles.filter(f => f.toLowerCase().includes(term));
      const container = document.getElementById('fileList');
      container.innerHTML = filtered.map(file => {
        const isSujo = checkSingleFileIsDirty(file);
        const badge = isSujo ? '<span class=&quot;text-[9px] bg-red-950 text-red-400 px-1 rounded&quot;>sujo</span>' : '';
        return `<div class=&quot;p-1.5 hover:bg-borderGreen rounded cursor-pointer flex justify-between items-center truncate border-b border-borderGreen/10&quot; onclick=&quot;openFile('${file}')&quot;>
          <span class=&quot;truncate&quot;>📄 ${file}</span>
          ${badge}
        </div>`;
      }).join('');
    }

    function saveCurrentFileChanges() {
      if (!activeFile) return alert(&quot;Selecione um arquivo primeiro!&quot;);
      fileContents[activeFile] = document.getElementById('fileContent').value;
      alert(&quot;Alteração salva na memória local!&quot;);
      renderFileList();
    }

    async function downloadModifiedZip() {
      showLoader(&quot;Gerando novo arquivo ZIP...&quot;);
      const zip = new JSZip();
      currentFiles.forEach(file => {
        zip.file(file, fileContents[file]);
      });
      const content = await zip.generateAsync({type:&quot;blob&quot;});
      const link = document.createElement(&quot;a&quot;);
      link.href = URL.createObjectURL(content);
      link.download = &quot;projeto-corrigido-sk.zip&quot;;
      link.click();
      hideLoader();
    }

    // ==================== GITHUB IMPORT ====================
    async function loadFromGitHub() {
      let url = document.getElementById('githubUrl').value.trim();
      let branch = document.getElementById('githubBranch').value.trim() || 'main';
      let token = document.getElementById('githubToken').value.trim();

      if (!url) return alert(&quot;Por favor, cole o link do repositório GitHub.&quot;);
      
      const m = url.match(/github\.com\/([^/]+)\/([^/]+)/);
      if (!m) return alert(&quot;URL inválida. Use: https://github.com/usuario/repositorio&quot;);
      const [, owner, repo] = m;

      showLoader(&quot;Baixando repositório do GitHub...&quot;);
      const zipUrl = `https://codeload.github.com/${owner}/${repo}/zip/refs/heads/${branch}`;
      const hdrs = token ? { Authorization: `token ${token}` } : {};

      try {
        let resp = await fetch(zipUrl, { headers: hdrs });
        if (!resp.ok) {
          showLoader(&quot;Tentando via proxy secundário...&quot;);
          const px = `https://api.allorigins.win/raw?url=${encodeURIComponent(zipUrl)}`;
          resp = await fetch(px);
        }
        if (!resp.ok) throw new Error(&quot;Não foi possível baixar o repositório. Verifique se ele é público.&quot;);
        
        const blob = await resp.blob();
        const buffer = await blob.arrayBuffer();
        const zip = await JSZip.loadAsync(buffer);
        
        // Remove prefixo de pasta que o GitHub coloca no ZIP
        const tempFiles = Object.keys(zip.files).filter(n => !zip.files[n].dir);
        const prefix = (tempFiles[0]?.split(&quot;/&quot;)[0] ?? &quot;&quot;) + &quot;/&quot;;

        currentFiles = [];
        fileContents = {};

        for (const n of tempFiles) {
          const rel = n.startsWith(prefix) ? n.slice(prefix.length) : n;
          if (!rel) continue;
          currentFiles.push(rel);
          fileContents[rel] = await zip.files[n].async(&quot;string&quot;);
        }

        currentFiles.sort();
        renderFileList();
        showSection('editor');
        alert(&quot;Repositório importado com sucesso!&quot;);
      } catch(e) {
        alert(&quot;Erro: &quot; + e.message);
      } finally {
        hideLoader();
      }
    }

    // ==================== LÓGICA DO SCANNER ====================
    let scanResultsData = [];

    function runScan() {
      if (currentFiles.length === 0) return alert(&quot;Por favor, carregue um projeto primeiro!&quot;);
      
      const customTerm = document.getElementById('customSearchTerm').value.trim();
      let customRegex = null;
      if (customTerm) {
        customRegex = new RegExp(customTerm, &quot;gi&quot;);
      }

      scanResultsData = [];
      showLoader(&quot;Escaneando arquivos...&quot;);

      currentFiles.forEach(file => {
        const content = fileContents[file] || &quot;&quot;;
        const lines = content.split('\n');
        const hits = [];

        lines.forEach((line, idx) => {
          const foundLabels = [];
          
          // Verifica regras padrões do Replit
          PATS.forEach(p => {
            p.re.lastIndex = 0;
            if (p.re.test(line)) {
              foundLabels.push(p.lb);
            }
            p.re.lastIndex = 0;
          });

          // Verifica termo customizado
          if (customRegex) {
            customRegex.lastIndex = 0;
            if (customRegex.test(line)) {
              foundLabels.push(`busca:&quot;${customTerm}&quot;`);
            }
            customRegex.lastIndex = 0;
          }

          if (foundLabels.length > 0) {
            hits.push({
              ln: idx + 1,
              txt: line.trim().slice(0, 150),
              labels: foundLabels
            });
          }
        });

        if (hits.length > 0) {
          scanResultsData.push({
            nome: file,
            hits: hits
          });
        }
      });

      renderScanResults();
      document.getElementById('scannerActions').classList.remove('hidden');
      hideLoader();
    }

    function renderScanResults() {
      const container = document.getElementById('scannerResults');
      if (scanResultsData.length === 0) {
        container.innerHTML = `
          <div class=&quot;text-center py-8 text-matrixGreen bg-matrixBg/20 border border-matrixBorder rounded-lg&quot;>
            🟢 Nenhuma dependência indesejada ou termo de busca encontrado! Projeto limpo.
          </div>`;
        return;
      }

      container.innerHTML = `
        <div class=&quot;text-xs text-red-400 mb-2 font-mono&quot;>⚠️ Encontrados ${scanResultsData.length} arquivos com possíveis problemas:</div>
        <div class=&quot;space-y-2&quot;>
          ${scanResultsData.map((res, idx) => `
            <div class=&quot;bg-darkBg border border-red-950 rounded-lg overflow-hidden&quot;>
              <div class=&quot;bg-red-950/20 px-3 py-2 flex justify-between items-center border-b border-red-950/40&quot;>
                <span class=&quot;font-mono text-xs text-red-300 truncate cursor-pointer hover:underline&quot; onclick=&quot;openFile('${res.nome}')&quot;>📄 ${res.nome}</span>
                <button onclick=&quot;openFile('${res.nome}')&quot; class=&quot;text-[10px] bg-brandGreen/20 text-brandGreen px-2 py-0.5 rounded hover:bg-brandGreen hover:text-black&quot;>Abrir no Editor</button>
              </div>
              <div class=&quot;p-2 space-y-1 bg-black/30&quot;>
                ${res.hits.map(h => `
                  <div class=&quot;text-[11px] font-mono text-red-200/80 flex gap-2&quot;>
                    <span class=&quot;text-gray-600&quot;>Linha ${h.ln}:</span>
                    <span class=&quot;text-yellow-500/80 bg-yellow-500/10 px-1 rounded text-[9px]&quot;>${h.labels.join(', ')}</span>
                    <span class=&quot;truncate&quot;>${h.txt}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('')}
        </div>`;
    }

    function downloadScanReport() {
      let txt = `=== RELATÓRIO DE DEPENDÊNCIAS ===\n`;
      txt += `Gerado em: ${new Date().toLocaleString('pt-BR')}\n`;
      txt += `Assinado: Maikon Caldeira OAB/MG 183712\n`;
      txt += `Total de arquivos com problemas: ${scanResultsData.length}\n\n`;

      scanResultsData.forEach(res => {
        txt += `\n► ARQUIVO: ${res.nome}\n`;
        res.hits.forEach(h => {
          txt += `  [L${h.ln}] [${h.labels.join(', ')}] -> ${h.txt}\n`;
        });
      });

      const blob = new Blob([txt], {type: &quot;text/plain;charset=utf-8&quot;});
      const link = document.createElement(&quot;a&quot;);
      link.href = URL.createObjectURL(blob);
      link.download = &quot;relatorio-scanner-maikon.txt&quot;;
      link.click();
    }

    async function autoCleanReplitFiles() {
      if (!confirm(&quot;Isso vai remover automaticamente as linhas contendo referências do Replit nos arquivos detectados. Deseja continuar?&quot;)) return;
      
      showLoader(&quot;Limpando arquivos...&quot;);
      scanResultsData.forEach(res => {
        let content = fileContents[res.nome] || &quot;&quot;;
        let lines = content.split('\n');
        
        // Filtra as linhas que não dão match com nenhum padrão do Replit
        let cleanLines = lines.filter(line => {
          return !PATS.some(p => {
            p.re.lastIndex = 0;
            const isMatch = p.re.test(line);
            p.re.lastIndex = 0;
            return isMatch;
          });
        });

        fileContents[res.nome] = cleanLines.join('\n');
      });

      alert(&quot;Arquivos limpos localmente! Iniciando download do ZIP corrigido.&quot;);
      await downloadModifiedZip();
      runScan(); // Refaz o scan para atualizar a tela
    }

    // ==================== LÓGICA DO COMBINADOR ====================
    const COMBINER_STORAGE_KEY = &quot;sk-combinador-v3:data&quot;;

    function createEmptyApp() {
      return {
        id: Math.random().toString(36).slice(2, 9),
        name: &quot;&quot;,
        sourceType: &quot;github&quot;,
        sourceLocation: &quot;&quot;,
        works: &quot;&quot;,
        broken: &quot;&quot;
      };
    }

    function loadCombiner() {
      try {
        const raw = localStorage.getItem(COMBINER_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          appsToCombine = parsed.apps || [];
          document.getElementById('combinerGoal').value = parsed.goal || &quot;&quot;;
        }
      } catch(e) {}

      if (appsToCombine.length === 0) {
        appsToCombine.push(createEmptyApp());
      }
      renderAppCards();
    }

    function saveCombiner() {
      const goal = document.getElementById('combinerGoal').value;
      localStorage.setItem(COMBINER_STORAGE_KEY, JSON.stringify({ apps: appsToCombine, goal }));
    }

    function renderAppCards() {
      const container = document.getElementById('appsContainer');
      container.innerHTML = appsToCombine.map((app, idx) => `
        <div class=&quot;bg-darkBg border border-matrixBorder rounded-xl p-4 space-y-3&quot;>
          <div class=&quot;flex justify-between items-center&quot;>
            <span class=&quot;text-matrixGreen text-xs font-bold uppercase&quot;>📦 Código Fonte #${idx + 1}</span>
            ${appsToCombine.length > 1 ? `<button onclick=&quot;removeAppCard('${app.id}')&quot; class=&quot;text-xs text-red-400 hover:underline&quot;>Remover</button>` : ''}
          </div>
          <div class=&quot;grid grid-cols-1 md:grid-cols-3 gap-3&quot;>
            <input type=&quot;text&quot; value=&quot;${app.name}&quot; onchange=&quot;updateAppField('${app.id}', 'name', this.value)&quot; placeholder=&quot;Nome (ex: PWA Jurídico)&quot; class=&quot;bg-matrixBg border border-matrixBorder rounded-lg px-3 py-1.5 text-xs text-textGreen outline-none&quot;>
            <select onchange=&quot;updateAppField('${app.id}', 'sourceType', this.value)&quot; class=&quot;bg-matrixBg border border-matrixBorder rounded-lg px-3 py-1.5 text-xs text-textGreen outline-none&quot;>
              <option value=&quot;github&quot; ${app.sourceType === 'github' ? 'selected' : ''}>GitHub</option>
              <option value=&quot;zip&quot; ${app.sourceType === 'zip' ? 'selected' : ''}>Arquivo ZIP</option>
            </select>
            <input type=&quot;text&quot; value=&quot;${app.sourceLocation}&quot; onchange=&quot;updateAppField('${app.id}', 'sourceLocation', this.value)&quot; placeholder=&quot;Link do GitHub ou Nome do ZIP&quot; class=&quot;bg-matrixBg border border-matrixBorder rounded-lg px-3 py-1.5 text-xs text-textGreen outline-none&quot;>
          </div>
          <div class=&quot;grid grid-cols-1 md:grid-cols-2 gap-3&quot;>
            <textarea rows=&quot;2&quot; onchange=&quot;updateAppField('${app.id}', 'works', this.value)&quot; placeholder=&quot;✅ O que funciona perfeitamente...&quot; class=&quot;bg-matrixBg border border-matrixBorder rounded-lg px-3 py-2 text-xs text-textGreen outline-none resize-none&quot;>${app.works}</textarea>
            <textarea rows=&quot;2&quot; onchange=&quot;updateAppField('${app.id}', 'broken', this.value)&quot; placeholder=&quot;❌ O que está quebrado...&quot; class=&quot;bg-matrixBg border border-matrixBorder rounded-lg px-3 py-2 text-xs text-textGreen outline-none resize-none&quot;>${app.broken}</textarea>
          </div>
        </div>
      `).join('');
    }

    function addAppCard() {
      appsToCombine.push(createEmptyApp());
      renderAppCards();
      saveCombiner();
    }

    function removeAppCard(id) {
      appsToCombine = appsToCombine.filter(app => app.id !== id);
      renderAppCards();
      saveCombiner();
    }

    function updateAppField(id, field, value) {
      appsToCombine = appsToCombine.map(app => app.id === id ? { ...app, [field]: value } : app);
      saveCombiner();
    }

    function clearCombiner() {
      if (confirm(&quot;Limpar dados do combinador?&quot;)) {
        appsToCombine = [createEmptyApp()];
        document.getElementById('combinerGoal').value = &quot;&quot;;
        document.getElementById('promptResultContainer').classList.add('hidden');
        renderAppCards();
        saveCombiner();
      }
    }

    function generateSuperPrompt() {
      const goal = document.getElementById('combinerGoal').value.trim();
      const filled = appsToCombine.filter(a => a.name || a.sourceLocation || a.works);

      let prompt = `Estou usando o SK Editor Jurídico v3 e preciso unificar códigos de projetos diferentes em uma única versão estável.

🎯 OBJETIVO DO PROJETO UNIFICADO:
${goal ? goal : &quot;Combinar os códigos mantendo a estabilidade e eliminando erros de dependência/Replit.&quot;}

--------------------------------------------------
📦 FONTES DE CÓDIGO A SEREM ANALISADAS:
`;

      filled.forEach((app, idx) => {
        prompt += `\n[CÓDIGO ${idx + 1}: ${app.name || 'Sem Nome'}]\n`;
        prompt += `- Origem: ${app.sourceType === 'github' ? 'Repositório GitHub' : 'Arquivo ZIP'}\n`;
        prompt += `- Endereço/Referência: ${app.sourceLocation || 'Não especificado'}\n`;
        prompt += `- ✅ O QUE FUNCIONA E DEVE SER MANTIDO:\n  ${app.works || 'Não especificado'}\n`;
        prompt += `- ❌ O QUE ESTÁ QUEBRADO E DEVE SER CORRIGIDO:\n  ${app.broken || 'Não especificado'}\n`;
      });

      prompt += `
--------------------------------------------------
🛠️ INSTRUÇÕES DE ARQUITETURA PARA A IA (CRÍTICAS):
1. NÃO comece o projeto do zero. Aproveite a lógica de importação de arquivos pesados e persistência local que já funciona.
2. Remova qualquer dependência desnecessária do Replit (como arquivos .replit, replit.nix ou pacotes que dependem de terminal).
3. O projeto final deve rodar como um PWA de arquivo único (HTML/JS) ou uma estrutura limpa de Vite+React que possa ser aberta diretamente no navegador sem precisar de servidores locais complexos.
4. Explique detalhadamente quais partes de código você unificou e de qual arquivo original elas vieram.
5. Apresente o código pronto e limpo para ser copiado.`;

      document.getElementById('generatedPromptTextarea').value = prompt;
      document.getElementById('promptResultContainer').classList.remove('hidden');
    }

    function copyGeneratedPrompt() {
      const txt = document.getElementById('generatedPromptTextarea');
      txt.select();
      document.execCommand('copy');
      alert(&quot;Prompt copiado! Cole na IA para unificar seu projeto.&quot;);
    }

    // Inicialização
    window.onload = () => {
      loadCombiner();
      showSection('importar');
    };
  </script>
</body>
</html>

<script>
function trocar(i) {
  document.querySelectorAll('.projeto').forEach(function(el){ el.classList.remove('ativo'); });
  document.querySelectorAll('.nav-btn').forEach(function(el){ el.classList.remove('active'); });
  document.getElementById('p'+i).classList.add('ativo');
  document.querySelectorAll('.nav-btn')[i].classList.add('active');
  localStorage.setItem('mc-ultimo', i);
}
window.onload = function() {
  var u = localStorage.getItem('mc-ultimo');
  if (u !== null) trocar(parseInt(u));
};
</script>
