        .checks input { transform: translateY(1px); }
        .status { white-space: pre-wrap; font-size: 12px; color: var(--txt); background: rgba(0,0,0,.18); border: 1px solid rgba(255,255,255,.08); padding: 10px; border-radius: 10px; }
        .paper { background: var(--paper); border-radius: 12px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.18); display: flex; flex-direction: column; height: 100%; }
        .paper h3 { margin: 0 0 10px; font-size: 14px; }
        .out { white-space: pre-wrap; font-family: &amp;quot;Times New Roman&amp;quot;, Times, serif; font-size: 12pt; line-height: 1.5; flex: 1; overflow: auto; border: 1px solid #ddd; padding: 10px; margin-top: 10px; }
        .small { font-size: 11px; color: var(--txt); }
        details { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.10); padding: 10px; border-radius: 10px; }
        summary { cursor: pointer; font-weight: 700; color: var(--txt); }
        .removedItem { padding: 8px; border-left: 3px solid var(--bad); background: rgba(239,68,68,.08); border-radius: 8px; margin-top: 8px; color: var(--txt); font-size: 12px; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 9999; }
        .ovbox { background: white; border-radius: 12px; padding: 16px 18px; min-width: 280px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
        .spin { width: 18px; height: 18px; border: 3px solid #cbd5e1; border-top-color: var(--accent); border-radius: 50%; display: inline-block; animation: sp 1s linear infinite; vertical-align: middle; margin-right: 10px; }
        @keyframes sp { to { transform: rotate(360deg); } }
        select {
            width: 100%; background: rgba(0,0,0,.3); color: var(--txt); border: 1px solid rgba(255,255,255,.14);
            border-radius: 8px; padding: 10px; outline: none; font-size: 12px; margin-top: 4px;
        }
    &amp;lt;/style&amp;gt;
&amp;lt;/head&amp;gt;
&amp;lt;body&amp;gt;
    &amp;lt;div class=&amp;quot;overlay&amp;quot; id=&amp;quot;ov&amp;quot;&amp;gt;
        &amp;lt;div class=&amp;quot;ovbox&amp;quot;&amp;gt;
            &amp;lt;div&amp;gt;&amp;lt;span class=&amp;quot;spin&amp;quot;&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;b id=&amp;quot;ovMsg&amp;quot;&amp;gt;Processando…&amp;lt;/b&amp;gt;&amp;lt;/div&amp;gt;
            &amp;lt;div class=&amp;quot;small&amp;quot; id=&amp;quot;ovSub&amp;quot; style=&amp;quot;margin-top:6px;color:#475569&amp;quot;&amp;gt;Aguarde.&amp;lt;/div&amp;gt;
        &amp;lt;/div&amp;gt;
    &amp;lt;/div&amp;gt;
    &amp;lt;div class=&amp;quot;wrap&amp;quot;&amp;gt;
        &amp;lt;div class=&amp;quot;left&amp;quot;&amp;gt;
            &amp;lt;h1&amp;gt;Filtrador Jurídico Avançado (Atualizado)&amp;lt;/h1&amp;gt;
            &amp;lt;div class=&amp;quot;hint&amp;quot;&amp;gt;
                Objetivo: &amp;lt;b&amp;gt;cortar repetição&amp;lt;/b&amp;gt; (modelos duplicados, citações repetidas), limpar sujeira e gerar texto enxuto.
            &amp;lt;/div&amp;gt;
            &amp;lt;h2&amp;gt;1) Importar&amp;lt;/h2&amp;gt;
            &amp;lt;input id=&amp;quot;files&amp;quot; type=&amp;quot;file&amp;quot; multiple accept=&amp;quot;.txt,.pdf,.docx,.json,.md&amp;quot; /&amp;gt;
            &amp;lt;label&amp;gt;&amp;lt;input type=&amp;quot;checkbox&amp;quot; id=&amp;quot;useOCR&amp;quot;&amp;gt; Usar OCR para PDFs digitalizados (lento)&amp;lt;/label&amp;gt;
            &amp;lt;h2&amp;gt;2) Texto Bruto&amp;lt;/h2&amp;gt;
            &amp;lt;textarea id=&amp;quot;raw&amp;quot; placeholder=&amp;quot;Cole aqui o texto gigante…&amp;quot;&amp;gt;&amp;lt;/textarea&amp;gt;
            &amp;lt;h2&amp;gt;3) Configurações Gerais&amp;lt;/h2&amp;gt;
            &amp;lt;div class=&amp;quot;box&amp;quot;&amp;gt;
                &amp;lt;div class=&amp;quot;checks&amp;quot;&amp;gt;
                    &amp;lt;label&amp;gt;&amp;lt;input type=&amp;quot;checkbox&amp;quot; id=&amp;quot;cleanSymbols&amp;quot; checked&amp;gt; Limpar , #, markdown&amp;lt;/label&amp;gt;
                    &amp;lt;label&amp;gt;&amp;lt;input type=&amp;quot;checkbox&amp;quot; id=&amp;quot;dedupeExact&amp;quot; checked&amp;gt; Remover duplicatas exatas&amp;lt;/label&amp;gt;
                    &amp;lt;label&amp;gt;&amp;lt;input type=&amp;quot;checkbox&amp;quot; id=&amp;quot;dedupeNear&amp;quot; checked&amp;gt; Remover duplicatas aproximadas&amp;lt;/label&amp;gt;
                    &amp;lt;label&amp;gt;&amp;lt;input type=&amp;quot;checkbox&amp;quot; id=&amp;quot;keepOrder&amp;quot; checked&amp;gt; Manter ordem original&amp;lt;/label&amp;gt;
                    &amp;lt;label&amp;gt;&amp;lt;input type=&amp;quot;checkbox&amp;quot; id=&amp;quot;splitLarge&amp;quot; checked&amp;gt; Dividir trechos grandes antes de excluir&amp;lt;/label&amp;gt;
                    &amp;lt;label&amp;gt;&amp;lt;input type=&amp;quot;checkbox&amp;quot; id=&amp;quot;cleanAsterisk1&amp;quot; checked&amp;gt; Limpar * (1x)&amp;lt;/label&amp;gt;
                    &amp;lt;label&amp;gt;&amp;lt;input type=&amp;quot;checkbox&amp;quot; id=&amp;quot;cleanAsterisk2&amp;quot; checked&amp;gt; Limpar ** (2x)&amp;lt;/label&amp;gt;
                    &amp;lt;label&amp;gt;&amp;lt;input type=&amp;quot;checkbox&amp;quot; id=&amp;quot;cleanAsterisk3&amp;quot; checked&amp;gt; Limpar *** (3x)&amp;lt;/label&amp;gt;
                    &amp;lt;label&amp;gt;&amp;lt;input type=&amp;quot;checkbox&amp;quot; id=&amp;quot;cleanHash1&amp;quot; checked&amp;gt; Limpar # (1x)&amp;lt;/label&amp;gt;
                    &amp;lt;label&amp;gt;&amp;lt;input type=&amp;quot;checkbox&amp;quot; id=&amp;quot;cleanHash2&amp;quot; checked&amp;gt; Limpar ## (2x)&amp;lt;/label&amp;gt;
                    &amp;lt;label&amp;gt;&amp;lt;input type=&amp;quot;checkbox&amp;quot; id=&amp;quot;cleanHash3&amp;quot; checked&amp;gt; Limpar ### (3x)&amp;lt;/label&amp;gt;
                &amp;lt;/div&amp;gt;
                &amp;lt;div class=&amp;quot;row&amp;quot; style=&amp;quot;margin-top:10px&amp;quot;&amp;gt;
                    &amp;lt;div&amp;gt;
                        &amp;lt;label&amp;gt;Mínimo caracteres&amp;lt;/label&amp;gt;
                        &amp;lt;input id=&amp;quot;minChars&amp;quot; type=&amp;quot;number&amp;quot; value=&amp;quot;20&amp;quot; /&amp;gt;
                    &amp;lt;/div&amp;gt;
                    &amp;lt;div&amp;gt;
                        &amp;lt;label&amp;gt;Similaridade (0.50-0.95)&amp;lt;/label&amp;gt;
                        &amp;lt;input id=&amp;quot;sim&amp;quot; type=&amp;quot;number&amp;quot; step=&amp;quot;0.01&amp;quot; value=&amp;quot;0.72&amp;quot; /&amp;gt;
                    &amp;lt;/div&amp;gt;
                &amp;lt;/div&amp;gt;
                &amp;lt;div class=&amp;quot;row&amp;quot; style=&amp;quot;margin-top:10px&amp;quot;&amp;gt;
                    &amp;lt;div&amp;gt;
                        &amp;lt;label&amp;gt;Shingle (2-5)&amp;lt;/label&amp;gt;
                        &amp;lt;input id=&amp;quot;shingle&amp;quot; type=&amp;quot;number&amp;quot; value=&amp;quot;3&amp;quot; /&amp;gt;
                    &amp;lt;/div&amp;gt;
                    &amp;lt;div&amp;gt;
                        &amp;lt;label&amp;gt;Janela (parágrafos)&amp;lt;/label&amp;gt;
                        &amp;lt;input id=&amp;quot;windowN&amp;quot; type=&amp;quot;number&amp;quot; value=&amp;quot;250&amp;quot; /&amp;gt;
                    &amp;lt;/div&amp;gt;
                &amp;lt;/div&amp;gt;
            &amp;lt;/div&amp;gt;
            &amp;lt;h2&amp;gt;4) Regras de Exclusão (Filtro)&amp;lt;/h2&amp;gt;
            &amp;lt;div class=&amp;quot;box&amp;quot;&amp;gt;
                &amp;lt;label&amp;gt;Excluir se contiver (1 por linha)&amp;lt;/label&amp;gt;
                &amp;lt;textarea id=&amp;quot;banWords&amp;quot; placeholder=&amp;quot;Ex.: modelo padrão&amp;amp;#10;pede deferimento&amp;quot;&amp;gt;&amp;lt;/textarea&amp;gt;
                &amp;lt;label&amp;gt;Excluir por REGEX&amp;lt;/label&amp;gt;
                &amp;lt;textarea id=&amp;quot;banRegex&amp;quot; placeholder=&amp;quot;Ex.: ^\s{3,}.$&amp;quot;&amp;gt;&amp;lt;/textarea&amp;gt;
                &amp;lt;div class=&amp;quot;row&amp;quot; style=&amp;quot;margin-top:10px&amp;quot;&amp;gt;
                    &amp;lt;button class=&amp;quot;b4&amp;quot; id=&amp;quot;btnSaveRules&amp;quot;&amp;gt;Salvar Regras&amp;lt;/button&amp;gt;
                    &amp;lt;button class=&amp;quot;b2&amp;quot; id=&amp;quot;btnClearRules&amp;quot;&amp;gt;Limpar&amp;lt;/button&amp;gt;
                &amp;lt;/div&amp;gt;
            &amp;lt;/div&amp;gt;
            &amp;lt;h2&amp;gt;5) Regras de Manutenção (VIP)&amp;lt;/h2&amp;gt;
            &amp;lt;div class=&amp;quot;box&amp;quot;&amp;gt;
                &amp;lt;label&amp;gt;Manter se contiver (Whitelist)&amp;lt;/label&amp;gt;
                &amp;lt;textarea id=&amp;quot;keepWords&amp;quot; placeholder=&amp;quot;Ex.: importante&amp;amp;#10;urgente&amp;quot;&amp;gt;&amp;lt;/textarea&amp;gt;
                &amp;lt;label&amp;gt;Manter por REGEX&amp;lt;/label&amp;gt;
                &amp;lt;textarea id=&amp;quot;keepRegex&amp;quot; placeholder=&amp;quot;Ex.: ^URGENTE.$&amp;quot;&amp;gt;&amp;lt;/textarea&amp;gt;
                &amp;lt;div class=&amp;quot;row&amp;quot; style=&amp;quot;margin-top:10px&amp;quot;&amp;gt;
                    &amp;lt;button class=&amp;quot;b4&amp;quot; id=&amp;quot;btnSaveKeepRules&amp;quot;&amp;gt;Salvar VIP&amp;lt;/button&amp;gt;
                    &amp;lt;button class=&amp;quot;b2&amp;quot; id=&amp;quot;btnClearKeepRules&amp;quot;&amp;gt;Limpar VIP&amp;lt;/button&amp;gt;
                &amp;lt;/div&amp;gt;
            &amp;lt;/div&amp;gt;
            &amp;lt;h2&amp;gt;6) Regras de Captura (Extrator)&amp;lt;/h2&amp;gt;
            &amp;lt;div class=&amp;quot;box&amp;quot;&amp;gt;
                &amp;lt;label&amp;gt;Capturar se contiver (1 por linha)&amp;lt;/label&amp;gt;
                &amp;lt;textarea id=&amp;quot;captureWords&amp;quot; placeholder=&amp;quot;Ex.: falsificação&amp;amp;#10;estelionato&amp;quot;&amp;gt;&amp;lt;/textarea&amp;gt;
                &amp;lt;label&amp;gt;Capturar por REGEX&amp;lt;/label&amp;gt;
                &amp;lt;textarea id=&amp;quot;captureRegex&amp;quot; placeholder=&amp;quot;Ex.: \\b(falsificação|fraude)\\b[\\s\\S]{0,500}&amp;quot;&amp;gt;&amp;lt;/textarea&amp;gt;
                &amp;lt;div class=&amp;quot;row&amp;quot; style=&amp;quot;margin-top:10px&amp;quot;&amp;gt;
                    &amp;lt;button class=&amp;quot;b4&amp;quot; id=&amp;quot;btnSaveCaptureRules&amp;quot;&amp;gt;Salvar Captura&amp;lt;/button&amp;gt;
                    &amp;lt;button class=&amp;quot;b2&amp;quot; id=&amp;quot;btnClearCaptureRules&amp;quot;&amp;gt;Limpar Captura&amp;lt;/button&amp;gt;
                &amp;lt;/div&amp;gt;
            &amp;lt;/div&amp;gt;

            &amp;lt;!-- ☁️ SEÇÃO NOVA: EXPORTAR PARA NUVEM --&amp;gt;
            &amp;lt;h2&amp;gt;7) ☁️ Exportar para Nuvem&amp;lt;/h2&amp;gt;
            &amp;lt;div class=&amp;quot;box-nuvem&amp;quot;&amp;gt;
                &amp;lt;label&amp;gt;Destino:&amp;lt;/label&amp;gt;
                &amp;lt;select id=&amp;quot;destinoNuvem&amp;quot;&amp;gt;
                    &amp;lt;option value=&amp;quot;drive&amp;quot;&amp;gt;Google Drive (Documento)&amp;lt;/option&amp;gt;
                    &amp;lt;option value=&amp;quot;gmail&amp;quot;&amp;gt;Gmail (E-mail)&amp;lt;/option&amp;gt;
                    &amp;lt;option value=&amp;quot;outro&amp;quot;&amp;gt;Outro (API Genérica)&amp;lt;/option&amp;gt;
                &amp;lt;/select&amp;gt;
                &amp;lt;label style=&amp;quot;margin-top:8px;&amp;quot;&amp;gt;Link do Webhook / API:&amp;lt;/label&amp;gt;
                &amp;lt;input type=&amp;quot;text&amp;quot; id=&amp;quot;apiLink&amp;quot; placeholder=&amp;quot;https://script.google.com/macros/s/SEU_ID/exec&amp;quot; /&amp;gt;
                &amp;lt;p style=&amp;quot;font-size:10px; color:#93c5fd; margin:6px 0 0;&amp;quot;&amp;gt;Cole o link gerado no Google Apps Script ou outra API para enviar direto para a nuvem.&amp;lt;/p&amp;gt;
                &amp;lt;button class=&amp;quot;b-nuvem&amp;quot; onclick=&amp;quot;enviarParaNuvem()&amp;quot;&amp;gt;☁️ ENVIAR RESULTADO PARA A NUVEM&amp;lt;/button&amp;gt;
            &amp;lt;/div&amp;gt;
            &amp;lt;!-- FIM DA SEÇÃO NOVA --&amp;gt;

            &amp;lt;div class=&amp;quot;btnrow&amp;quot; style=&amp;quot;margin-top:14px;&amp;quot;&amp;gt;
                &amp;lt;button class=&amp;quot;b1&amp;quot; id=&amp;quot;btnRun&amp;quot;&amp;gt;Filtrar Agora&amp;lt;/button&amp;gt;
                &amp;lt;button class=&amp;quot;b2&amp;quot; id=&amp;quot;btnClearAll&amp;quot;&amp;gt;Limpar Tudo&amp;lt;/button&amp;gt;
            &amp;lt;/div&amp;gt;
            &amp;lt;h2&amp;gt;Status&amp;lt;/h2&amp;gt;
            &amp;lt;div class=&amp;quot;status&amp;quot; id=&amp;quot;status&amp;quot;&amp;gt;Pronto.&amp;lt;/div&amp;gt;
            &amp;lt;h2&amp;gt;Removidos&amp;lt;/h2&amp;gt;
            &amp;lt;details&amp;gt;
                &amp;lt;summary&amp;gt;Ver removidos&amp;lt;/summary&amp;gt;
                &amp;lt;div id=&amp;quot;removedBox&amp;quot;&amp;gt;&amp;lt;/div&amp;gt;
            &amp;lt;/details&amp;gt;
            &amp;lt;h2&amp;gt;Exportar Itens Removidos&amp;lt;/h2&amp;gt;
            &amp;lt;div class=&amp;quot;btnrow-export&amp;quot;&amp;gt;
                &amp;lt;button class=&amp;quot;b3&amp;quot; id=&amp;quot;btnExportRemovedWord&amp;quot;&amp;gt;Exportar Word&amp;lt;/button&amp;gt;
                &amp;lt;button class=&amp;quot;b3&amp;quot; id=&amp;quot;btnExportRemovedTxt&amp;quot;&amp;gt;Exportar TXT&amp;lt;/button&amp;gt;
                &amp;lt;button class=&amp;quot;b4&amp;quot; id=&amp;quot;btnExportRemovedJson&amp;quot;&amp;gt;Exportar JSON&amp;lt;/button&amp;gt;
                &amp;lt;button class=&amp;quot;b4&amp;quot; id=&amp;quot;btnExportRemovedMarkdown&amp;quot;&amp;gt;Exportar Markdown&amp;lt;/button&amp;gt;
            &amp;lt;/div&amp;gt;
            &amp;lt;h2&amp;gt;Manual de Regex (Guia Rápido)&amp;lt;/h2&amp;gt;
            &amp;lt;details&amp;gt;
                &amp;lt;summary&amp;gt;Como criar regras de captura/exclusão&amp;lt;/summary&amp;gt;
                &amp;lt;div style=&amp;quot;font-size:12px; color:var(--txt); line-height:1.4;&amp;quot;&amp;gt;
                    &amp;lt;p&amp;gt;&amp;lt;b&amp;gt;Regex (Expressões Regulares)&amp;lt;/b&amp;gt; são padrões para buscar ou excluir texto.&amp;lt;/p&amp;gt;
                    &amp;lt;h3&amp;gt;Comandos Básicos:&amp;lt;/h3&amp;gt;
                    &amp;lt;ul style=&amp;quot;padding-left:20px;&amp;quot;&amp;gt;
                        &amp;lt;li&amp;gt;&amp;lt;b&amp;gt;\b&amp;lt;/b&amp;gt;: Limite de palavra (ex.: &amp;lt;code&amp;gt;\bFraude\b&amp;lt;/code&amp;gt;).&amp;lt;/li&amp;gt;
                        &amp;lt;li&amp;gt;&amp;lt;b&amp;gt;^&amp;lt;/b&amp;gt;: Início de linha (ex.: &amp;lt;code&amp;gt;^Modelo&amp;lt;/code&amp;gt;).&amp;lt;/li&amp;gt;
                        &amp;lt;li&amp;gt;&amp;lt;b&amp;gt;$&amp;lt;/b&amp;gt;: Fim de linha (ex.: &amp;lt;code&amp;gt;deferimento$&amp;lt;/code&amp;gt;).&amp;lt;/li&amp;gt;
                        &amp;lt;li&amp;gt;&amp;lt;b&amp;gt;|&amp;lt;/b&amp;gt;: Ou (ex.: &amp;lt;code&amp;gt;Fraude|Estelionato&amp;lt;/code&amp;gt;).&amp;lt;/li&amp;gt;
                        &amp;lt;li&amp;gt;&amp;lt;b&amp;gt;[\\s\\S]{0,500}&amp;lt;/b&amp;gt;: Pega até 500 caracteres após o termo.&amp;lt;/li&amp;gt;
                        &amp;lt;li&amp;gt;&amp;lt;b&amp;gt;.*?&amp;lt;/b&amp;gt;: Pega qualquer texto até o próximo padrão.&amp;lt;/li&amp;gt;
                    &amp;lt;/ul&amp;gt;
                    &amp;lt;h3&amp;gt;Exemplos para Captura:&amp;lt;/h3&amp;gt;
                    &amp;lt;ul style=&amp;quot;padding-left:20px;&amp;quot;&amp;gt;
                        &amp;lt;li&amp;gt;&amp;lt;code&amp;gt;\b(Falsificação|Fraude)\b[\\s\\S]{0,500}&amp;lt;/code&amp;gt;&amp;lt;/li&amp;gt;
                        &amp;lt;li&amp;gt;&amp;lt;code&amp;gt;\bSentença\b[\\s\\S]*?(?=\bId\s+no\s+PJE|\bEvento\s+\d+|$)&amp;lt;/code&amp;gt;&amp;lt;/li&amp;gt;
                    &amp;lt;/ul&amp;gt;
                    &amp;lt;h3&amp;gt;Exemplos para Exclusão:&amp;lt;/h3&amp;gt;
                    &amp;lt;ul style=&amp;quot;padding-left:20px;&amp;quot;&amp;gt;
                        &amp;lt;li&amp;gt;&amp;lt;code&amp;gt;^Modelo\s+Padrão&amp;lt;/code&amp;gt;&amp;lt;/li&amp;gt;
                        &amp;lt;li&amp;gt;&amp;lt;code&amp;gt;^(?=\s{3,})&amp;lt;/code&amp;gt;&amp;lt;/li&amp;gt;
                    &amp;lt;/ul&amp;gt;
                    &amp;lt;p&amp;gt;&amp;lt;b&amp;gt;Dica:&amp;lt;/b&amp;gt; Teste em regex101.com antes de usar aqui.&amp;lt;/p&amp;gt;
                &amp;lt;/div&amp;gt;
            &amp;lt;/details&amp;gt;
        &amp;lt;/div&amp;gt;
        &amp;lt;div class=&amp;quot;right&amp;quot;&amp;gt;
            &amp;lt;div class=&amp;quot;paper&amp;quot;&amp;gt;
                &amp;lt;div style=&amp;quot;display:flex; justify-content:space-between; align-items:center;&amp;quot;&amp;gt;
                    &amp;lt;h3&amp;gt;Resultado Filtrado&amp;lt;/h3&amp;gt;
                    &amp;lt;button class=&amp;quot;b-copy&amp;quot; id=&amp;quot;btnCopyText&amp;quot; title=&amp;quot;Copia o texto limpo para colar no Word&amp;quot;&amp;gt;&amp;amp;#x1F4CB; Copiar Texto Limpo&amp;lt;/button&amp;gt;
                &amp;lt;/div&amp;gt;
                &amp;lt;div class=&amp;quot;small&amp;quot;&amp;gt;Use o botão acima para copiar ou os botões abaixo para baixar arquivo.&amp;lt;/div&amp;gt;
                &amp;lt;div class=&amp;quot;btnrow-export&amp;quot;&amp;gt;
                    &amp;lt;button class=&amp;quot;b3&amp;quot; id=&amp;quot;btnExportWord&amp;quot;&amp;gt;Exportar Word&amp;lt;/button&amp;gt;
                    &amp;lt;button class=&amp;quot;b3&amp;quot; id=&amp;quot;btnExportTxt&amp;quot;&amp;gt;Exportar TXT&amp;lt;/button&amp;gt;
                    &amp;lt;button class=&amp;quot;b4&amp;quot; id=&amp;quot;btnExportJson&amp;quot;&amp;gt;Exportar JSON&amp;lt;/button&amp;gt;
                    &amp;lt;button class=&amp;quot;b4&amp;quot; id=&amp;quot;btnExportMarkdown&amp;quot;&amp;gt;Exportar Markdown&amp;lt;/button&amp;gt;
                &amp;lt;/div&amp;gt;
                &amp;lt;hr style=&amp;quot;margin:10px 0; border:0; border-top:1px solid #ddd;&amp;quot; /&amp;gt;
                &amp;lt;div id=&amp;quot;out&amp;quot; class=&amp;quot;out&amp;quot;&amp;gt;[O texto filtrado aparece aqui]&amp;lt;/div&amp;gt;
            &amp;lt;/div&amp;gt;
        &amp;lt;/div&amp;gt;
    &amp;lt;/div&amp;gt;

    &amp;lt;script&amp;gt;
        // Banco de dados IndexedDB para salvamento robusto
        const dbPromise = idb.openDB(&amp;quot;FiltradorDB&amp;quot;, 1, {
            upgrade(db) {
                db.createObjectStore(&amp;quot;state&amp;quot;, { keyPath: &amp;quot;id&amp;quot; });
            }
        });

        async function loadState() {
            const db = await dbPromise;
            const state = await db.get(&amp;quot;state&amp;quot;, &amp;quot;current&amp;quot;);
            if (!state) return;
            if (state.raw != null) document.getElementById(&amp;quot;raw&amp;quot;).value = state.raw;
            if (state.banWords != null) document.getElementById(&amp;quot;banWords&amp;quot;).value = state.banWords;
            if (state.banRegex != null) document.getElementById(&amp;quot;banRegex&amp;quot;).value = state.banRegex;
            if (state.keepWords != null) document.getElementById(&amp;quot;keepWords&amp;quot;).value = state.keepWords;
            if (state.keepRegex != null) document.getElementById(&amp;quot;keepRegex&amp;quot;).value = state.keepRegex;
            if (state.captureWords != null) document.getElementById(&amp;quot;captureWords&amp;quot;).value = state.captureWords;
            if (state.captureRegex != null) document.getElementById(&amp;quot;captureRegex&amp;quot;).value = state.captureRegex;
            if (state.apiLink != null) document.getElementById(&amp;quot;apiLink&amp;quot;).value = state.apiLink;
            if (state.destinoNuvem != null) document.getElementById(&amp;quot;destinoNuvem&amp;quot;).value = state.destinoNuvem;
            if (state.cfg) {
                for (const [k, v] of Object.entries(state.cfg)) {
                    const el = document.getElementById(k);
                    if (!el) continue;
                    if (el.type === &amp;quot;checkbox&amp;quot;) el.checked = !!v;
                    else el.value = v;
                }
            }
            if (state.lastOut != null) document.getElementById(&amp;quot;out&amp;quot;).textContent = state.lastOut;
        }

        async function saveState(extra = {}) {
            const db = await dbPromise;

        // Text utilities
        function cleanMarkdownNoise(t) {
            let s = t || &amp;quot;&amp;quot;;
            if (document.getElementById(&amp;quot;cleanAsterisk1&amp;quot;).checked) s = s.replace(/\*/g, &amp;quot;&amp;quot;);
            if (document.getElementById(&amp;quot;cleanAsterisk2&amp;quot;).checked) s = s.replace(/\*\*/g, &amp;quot;&amp;quot;);
            if (document.getElementById(&amp;quot;cleanAsterisk3&amp;quot;).checked) s = s.replace(/\*\*\*/g, &amp;quot;&amp;quot;);
            if (document.getElementById(&amp;quot;cleanHash1&amp;quot;).checked) s = s.replace(/#/g, &amp;quot;&amp;quot;);
            if (document.getElementById(&amp;quot;cleanHash2&amp;quot;).checked) s = s.replace(/##/g, &amp;quot;&amp;quot;);
            if (document.getElementById(&amp;quot;cleanHash3&amp;quot;).checked) s = s.replace(/###/g, &amp;quot;&amp;quot;);
            if (document.getElementById(&amp;quot;cleanSymbols&amp;quot;).checked) {
                s = s.replace(/^\s{0,6}(?:[•\-–—]+|#{1,6}|&amp;gt;+)\s+/gm, &amp;quot;&amp;quot;);
                s = s.replace(/[#~]{2,}/g, &amp;quot; &amp;quot;);
            }
            s = s.replace(/[&amp;quot;&amp;quot;]/g, '&amp;quot;').replace(/[']/g, &amp;quot;'&amp;quot;);
            s = s.replace(/[ \t]+/g, &amp;quot; &amp;quot;);
            s = s.replace(/\n{3,}/g, &amp;quot;\n\n&amp;quot;);
            return s;
        }
        function splitParagraphs(t, splitLarge = false) {
            const paragraphs = (t || &amp;quot;&amp;quot;)
                .replace(/\r\n/g, &amp;quot;\n&amp;quot;)
                .split(/\n{2,}|\n(?=\s*[A-ZÁÀÂÃÉÊÍÓÔÕÚÇ]{3,}[\s:])/g)
                .map(p =&amp;gt; p.trim())
                .filter(Boolean);
            if (splitLarge) {
                const splitSize = 500;
                const result = [];
                paragraphs.forEach(p =&amp;gt; {
                    if (p.length &amp;gt; splitSize) {
                        let start = 0;
                        while (start &amp;lt; p.length) {
                            result.push(p.slice(start, start + splitSize));
                            start += splitSize;
                        }
                    } else {
                        result.push(p);
                    }
                });
                return result;
            }
            return paragraphs;
        }
        function normalizeForCompare(s) {
            return (s || &amp;quot;&amp;quot;).toLowerCase().normalize(&amp;quot;NFD&amp;quot;).replace(/[\u0300-\u036f]/g, &amp;quot;&amp;quot;).replace(/[^a-z0-9\s]/g, &amp;quot; &amp;quot;).replace(/\s+/g, &amp;quot; &amp;quot;).trim();
        }
        function makeShingles(words, size) {
            const out = [];
            for (let i = 0; i + size &amp;lt;= words.length; i++) out.push(words.slice(i, i + size).join(&amp;quot; &amp;quot;));
            return out;
        }
        function signature(norm, shingleSize) {
            const words = norm.split(&amp;quot; &amp;quot;).filter(Boolean);
            const sh = makeShingles(words, shingleSize);
            const limited = sh.length &amp;gt; 250 ? sh.slice(0, 250) : sh;
            return new Set(limited);
        }
        function jaccard(a, b) {
            if (!a.size || !b.size) return 0;
            let inter = 0;
            const small = a.size &amp;lt; b.size ? a : b;
            const big = a.size &amp;lt; b.size ? b : a;
            for (const x of small) if (big.has(x)) inter++;
            const uni = a.size + b.size - inter;
            return uni ? inter / uni : 0;
        }
        function parseLines(text) {
            return (text || &amp;quot;&amp;quot;).split(&amp;quot;\n&amp;quot;).map(s =&amp;gt; s.trim()).filter(Boolean);
        }
        function buildRegexList(lines) {
            const out = [];
            for (const l of lines) {
                try { out.push(new RegExp(l, &amp;quot;i&amp;quot;)); } catch (e) {}
            }
            return out;
        }

        // Importers
        async function extractTextFromPDF(file, useOCR) {
            const buf = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
            let full = &amp;quot;&amp;quot;;
            for (let i = 1; i &amp;lt;= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                if (content.items.length &amp;gt; 0) {
                    full += `--- Página ${i} ---\n` + content.items.map(it =&amp;gt; it.str).join(&amp;quot; &amp;quot;) + &amp;quot;\n\n&amp;quot;;
                } else if (useOCR) {
                    ov(true, `OCR: Processando Página ${i}...`, &amp;quot;Isso pode demorar um pouco.&amp;quot;);
                    try {
                        const viewport = page.getViewport({ scale: 2.0 });
                        const canvas = document.createElement(&amp;quot;canvas&amp;quot;);
                        const context = canvas.getContext(&amp;quot;2d&amp;quot;);
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        await page.render({ canvasContext: context, viewport }).promise;
                        const imageData = canvas.toDataURL(&amp;quot;image/png&amp;quot;);
                        const worker = await Tesseract.createWorker('por');
                        const result = await worker.recognize(imageData);
                        await worker.terminate();
                        full += `--- Página ${i} (OCR) ---\n` + result.data.text + &amp;quot;\n\n&amp;quot;;
                    } catch (e) {
                        full += `--- Página ${i} (Erro OCR) ---\nNão foi possível extrair texto.\n\n`;
                    } finally {
                        ov(false);
                    }
                } else {
                    full += `--- Página ${i} ---\nTexto não extraído (ative OCR se necessário).\n\n`;
                }
            }
            return full;
        }

        async function extractTextFromJSON(file) {
            const txt = await file.text();
            let obj;
            try { obj = JSON.parse(txt); } catch (e) { return txt; }
            const parts = [];
            (function walk(x) {
                if (x == null) return;
                if (typeof x === &amp;quot;string&amp;quot;) { if (x.trim().length &amp;gt; 0) parts.push(x); return; }
                if (Array.isArray(x)) { x.forEach(walk); return; }
                if (typeof x === &amp;quot;object&amp;quot;) { Object.values(x).forEach(walk); return; }
            })(obj);
            return parts.join(&amp;quot;\n\n&amp;quot;);
        }

        // Core filtering
        let res = { removed: [], outText: &amp;quot;&amp;quot;, outPars: [], stats: { total: 0, kept: 0, removed: 0 } };
        function applyBanRules(par, banWords, banRegexList, keepWords, keepRegexList) {
            const low = par.toLowerCase();
            for (const w of keepWords) if (w &amp;amp;&amp;amp; low.includes(w.toLowerCase())) return { drop: false, reason: `mantido por palavra: &amp;quot;${w}&amp;quot;` };
            for (const rx of keepRegexList) if (rx.test(par)) return { drop: false, reason: `mantido por regex: /${rx.source}/i` };
            for (const w of banWords) if (w &amp;amp;&amp;amp; low.includes(w.toLowerCase())) return { drop: true, reason: `regra palavra: &amp;quot;${w}&amp;quot;` };
            for (const rx of banRegexList) if (rx.test(par)) return { drop: true, reason: `regex: /${rx.source}/i` };
            return { drop: false };
        }
        function applyCaptureRules(par, captureWords, captureRegexList) {
            const low = par.toLowerCase();
            for (const w of captureWords) if (w &amp;amp;&amp;amp; low.includes(w.toLowerCase())) return { highlight: true, reason: `capturado por palavra: &amp;quot;${w}&amp;quot;` };
            for (const rx of captureRegexList) if (rx.test(par)) return { highlight: true, reason: `capturado por regex: /${rx.source}/i` };
            return { highlight: false };
        }
        function filterText(rawText, cfg) {
            const removed = [];
            let text = rawText || &amp;quot;&amp;quot;;
            if (cfg.cleanSymbols) text = cleanMarkdownNoise(text);
            let pars = splitParagraphs(text, cfg.splitLarge)
                .map(p =&amp;gt; p.replace(/\s+/g, &amp;quot; &amp;quot;).trim())
                .filter(p =&amp;gt; p.length &amp;gt;= cfg.minChars);
            const exactSet = new Set();
            const kept = [];
            const out = [];
            for (const p of pars) {
                const rule = applyBanRules(p, cfg.banWords, cfg.banRegexList, cfg.keepWords, cfg.keepRegexList);
                if (rule.drop) {
                    removed.push({ motivo: rule.reason, texto: p });
                    continue;
                }
                const capture = applyCaptureRules(p, cfg.captureWords, cfg.captureRegexList);
                const norm = normalizeForCompare(p);
                if (cfg.dedupeExact) {
                    if (exactSet.has(norm)) {
                        removed.push({ motivo: &amp;quot;duplicata exata&amp;quot;, texto: p });
                        continue;
                    }
                    exactSet.add(norm);
                }
                if (cfg.dedupeNear) {
                    const sig = signature(norm, cfg.shingleSize);
                    let dup = false;
                    const start = Math.max(0, kept.length - cfg.windowN);
                    for (let i = start; i &amp;lt; kept.length; i++) {
                        if (jaccard(sig, kept[i].sig) &amp;gt;= cfg.sim) {
                            dup = true;
                            break;
                        }
                    }
                    if (dup) {
                        removed.push({ motivo: &amp;quot;duplicata aproximada&amp;quot;, texto: p });
                        continue;
                    }
                    kept.push({ raw: p, norm, sig });
                }
                out.push(capture.highlight ? `**${p}** (Destacado: ${capture.reason})` : p);
            }
            return {
                outText: out.join(&amp;quot;\n\n&amp;quot;),
                outPars: out,
                removed,
                stats: { total: pars.length, kept: out.length, removed: removed.length }
            };
        }

                    document.getElementById(&amp;quot;out&amp;quot;).textContent = res.outText || &amp;quot;&amp;quot;;
                    const rb = document.getElementById(&amp;quot;removedBox&amp;quot;);
                    rb.innerHTML = &amp;quot;&amp;quot;;
                    const sample = res.removed.slice(0, 300);
                    for (let i = 0; i &amp;lt; sample.length; i++) {
                        const r = sample[i];
                        const div = document.createElement(&amp;quot;div&amp;quot;);
                        div.className = &amp;quot;removedItem&amp;quot;;
                        div.innerHTML = `&amp;lt;b&amp;gt;${i+1}. ${escapeHtml(r.motivo)}&amp;lt;/b&amp;gt;&amp;lt;br&amp;gt;${escapeHtml(r.texto)}`;
                        rb.appendChild(div);

                    if (res.removed.length &amp;gt; sample.length) {

                        more.className = &amp;quot;small&amp;quot;;

* { box-sizing: border-box; margin: 0; padding: 0; }
:root {

html, body { height: 100%; background: var(--bg); color: var(--text); font-family: Arial, sans-serif; overflow: hidden; }

/* ── LAYOUT ── */
.app { display: flex; flex-direction: column; height: 100dvh; }

/* ── HEADER ── */
.header {

.badge-demo  { background: #78350f33; color: #fbbf24; border-color: #92400e55; }
.badge-ok    { background: #14532d33; color: #4ade80; border-color: #16653355; }
.badge-pro   { background: #4c1d9533; color: var(--purple); border-color: #8b5cf633; }
.btn-icon { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 8px; color: var(--muted); display: flex; align-items: center; }

.btn-icon.ativo { background: #ffffff15; color: var(--text); }

/* ── PAINEL CONFIG ── */
.config-panel {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 12px 14px;
  display: none; flex-direction: column; gap: 10px;

}

.config-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
.config-row { display: flex; gap: 6px; align-items: center; }
.inp {
  flex: 1; height: 32px; padding: 0 10px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 11px; outline: none;

}

.provider-tag { font-size: 10px; color: var(--amber2); white-space: nowrap; }

.tabs {

  display: flex; flex-shrink: 0; overflow-x: auto;
}
.tab-btn {
  flex: 1; padding: 9px 4px; font-size: 11px; font-weight: 600;
  background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--muted); cursor: pointer; transition: all .15s;
  white-space: nowrap; min-width: 80px;
}
.tab-btn.ativo { border-bottom-color: var(--amber); color: var(--amber2); }

/* ── BARRA ESFORÇO ── */
.effort-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px; background: #1a2411;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.effort-label { font-size: 10px; font-weight: 700; white-space: nowrap; }
.effort-bar input[type=range] { flex: 1; accent-color: var(--amber); height: 3px; }
.verbosity-btn {
  font-size: 10px; padding: 3px 10px; border-radius: 20px;
  border: 1px solid; cursor: pointer; background: none; white-space: nowrap;
}

/* ── CONTEÚDO ── */
.content { flex: 1; overflow-y: auto; }
.tab-pane { display: none; padding: 12px 14px; }
.tab-pane.ativo { display: block; }

/* ── TEXTAREA ── */
textarea {
  width: 100%; resize: none;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); font-size: 12px;
  padding: 10px 12px; outline: none; line-height: 1.6; font-family: Arial;
}
textarea:focus { border-color: var(--amber); }

/* ── BOTÕES ── */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 14px; border-radius: 8px; border: 1px solid;
  font-size: 11px; font-weight: 600; cursor: pointer; transition: all .15s;
  white-space: nowrap; background: none;
}
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-amber  { background: #92400e33; border-color: #d9770655; color: var(--amber2); }
.btn-amber:hover:not(:disabled)  { background: #92400e55; }
.btn-ghost  { background: none; border-color: var(--border); color: var(--muted); }
.btn-ghost:hover:not(:disabled)  { color: var(--text); border-color: #4b5563; }
.btn-red    { background: #7f1d1d33; border-color: #ef444433; color: var(--red); }
.btn-red:hover:not(:disabled)    { background: #7f1d1d55; }
.btn-green  { background: #14532d33; border-color: #22c55e33; color: var(--green); }
.btn-green:hover:not(:disabled)  { background: #14532d55; }
.btn-purple { background: #4c1d9533; border-color: #8b5cf633; color: var(--purple); }
.btn-purple:hover:not(:disabled) { background: #4c1d9555; }
.btn-blue   { background: #1e3a5f33; border-color: #3b82f633; color: var(--blue); }
.btn-blue:hover:not(:disabled)   { background: #1e3a5f55; }
.btn-cyan   { background: #164e6333; border-color: #22d3ee33; color: var(--cyan); }
.btn-cyan:hover:not(:disabled)   { background: #164e6355; }
.btn-full { width: 100%; justify-content: center; }

.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

.action-btn {

  padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);

  cursor: pointer; transition: all .15s; font-weight: 600;
}
.format-btn:hover { background: #ffffff10; color: var(--text); }
.format-btn.ativo { background: var(--amber); color: #000; border-color: var(--amber); }

/* ── CHAT ── */
.chat-msgs { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; padding: 4px 0; }
.msg-user { background: #78350f33; border: 1px solid #92400e44; border-radius: 10px; padding: 8px 12px; font-size: 12px; margin-left: 20px; }

/* ── CARDS ── */
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; }

.card-sub   { font-size: 11px; color: var(--muted); }
.card-selected { border-color: #22c55e55; background: #14532d22; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: #00000088; backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;

.modal {

.modal-close:hover { background: #ffffff10; color: var(--text); }

/* ── MISC ── */
.section-title { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; margin-top: 14px; }
.section-title:first-child { margin-top: 0; }

.text-green  { color: var(--green); }

.text-amber  { color: var(--amber2); }
.text-muted  { color: var(--muted); }

.text-cyan   { color: var(--cyan); }

.ementa-check { width: 16px; height: 16px; border: 1px solid var(--border); border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; margin-top: 2px; }

.stop-bar { padding: 8px 14px; flex-shrink: 0; }

.tts-controls {

//  LOCALSTORAGE
// ══════════════════════════════════════════════════════
function loadLS(k, def) {
  try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; }
}
function saveLS(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
}

//  CHAVES
// ══════════════════════════════════════════════════════
const PROVIDERS = [
  ['AIza',   'Gemini'],
  ['gsk_',   'Groq'],
  ['sk-ant', 'Claude'],
  ['sk-or-', 'OpenRouter'],
  ['pplx-',  'Perplexity'],
  ['xai-',   'xAI/Grok'],
  ['sk-',    'OpenAI'],
];
function detectProvider(k) {
  for (const [p,n] of PROVIDERS) if ((k||'').startsWith(p)) return n;
  return null;
}
function getChaveResumo()  { return (document.getElementById('key-resumo').value  || '').trim(); }
function getChaveGeracao() { return (document.getElementById('key-geracao').value || '').trim(); }
function getModelo()       { return (document.getElementById('modelo-geracao').value || '').trim(); }
function getPromptGlobal() { return (document.getElementById('prompt-global').value || '').trim(); }

function salvarChaves() {
  const kr = getChaveResumo(), kg = getChaveGeracao(), m = getModelo();
  saveLS('aj_key_resumo',   kr);
  saveLS('aj_key_geracao',  kg);
  saveLS('aj_modelo',       m);
  document.getElementById('tag-resumo').textContent  = detectProvider(kr) || '';
  document.getElementById('tag-geracao').textContent = detectProvider(kg) || '';
  atualizarBadge();
}
function salvarPromptGlobal() {
  saveLS('aj_prompt_global', getPromptGlobal());
}
function limparChaves() {
  ['key-resumo','key-geracao','modelo-geracao'].forEach(id =&amp;gt; document.getElementById(id).value = '');
  ['aj_key_resumo','aj_key_geracao','aj_modelo'].forEach(k =&amp;gt; localStorage.removeItem(k));
  salvarChaves();
}
function atualizarBadge() {
  const kg = getChaveGeracao();
  const badge = document.getElementById('badge-status');
  if (kg) {
    badge.textContent = detectProvider(kg) || 'Chave Própria';
    badge.className = 'badge badge-ok';
  } else {
    badge.textContent = 'Demo';
    badge.className = 'badge badge-demo';
  }
}

// Carregar chaves salvas
window.addEventListener('DOMContentLoaded', () =&amp;gt; {
  document.getElementById('key-resumo').value   = loadLS('aj_key_resumo','');
  document.getElementById('key-geracao').value  = loadLS('aj_key_geracao','');
  document.getElementById('modelo-geracao').value = loadLS('aj_modelo','');
  document.getElementById('prompt-global').value = loadLS('aj_prompt_global','');
  salvarChaves();
  atualizarEsforco();
  atualizarVerbosity();
  renderEmentas();
  renderHistorico();
  renderAcoes();
  renderAcoesCustomGrid();
  renderTemplates();
  carregarVozesTTS();
  carregarEditor();
  // PDF.js worker
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
});

// ══════════════════════════════════════════════════════
//  TESTAR CHAVES
// ══════════════════════════════════════════════════════
async function testarChaves() {
  const kr = getChaveResumo(), kg = getChaveGeracao();
  const sp = document.getElementById('test-spinner');
  const rt = document.getElementById('test-result');
  sp.classList.remove('hidden'); rt.textContent = '';
  try {
    if (kr) {
      await chamarGemini(kr, [{ role:'user', content:'Responda apenas: OK' }], 'gemini-1.5-flash');
      rt.textContent = '✅ Resumo OK';
    }
    if (kg) {
      const prov = detectProvider(kg);
      let r = '';
      if (prov === 'Gemini')      r = await chamarGemini(kg, [{role:'user',content:'Responda apenas: OK'}]);
      else if (prov === 'Claude') r = await chamarClaude(kg, [{role:'user',content:'Responda apenas: OK'}], getModelo()||'claude-haiku-3-5');
      else                        r = await chamarOpenAI(kg, [{role:'user',content:'Responda apenas: OK'}], getModelo()||'gpt-4o-mini');
      rt.textContent += (kr?' | ':'') + `✅ Geração OK (${prov||'Custom'})`;
    }
    if (!kr &amp;amp;&amp;amp; !kg) rt.textContent = '⚠️ Insira ao menos uma chave.';
  } catch(e) {
    rt.textContent = '❌ ' + e.message.substring(0,100);
    rt.className = 'fs11 text-red';
  } finally { sp.classList.add('hidden'); }
}

//  IMPORTAR ARQUIVO
// ══════════════════════════════════════════════════════
async function importarArquivo(input) {
  const file = input.files[0]; input.value = '';
  if (!file) return;
  const sp = document.getElementById('import-spinner');
  sp.classList.remove('hidden');
  try {
    const ext = file.name.split('.').pop().toLowerCase();
    let texto = '';
    if (ext === 'pdf') {
      texto = await extrairPDF(file);
    } else if (ext === 'docx' || ext === 'doc') {
      texto = await extrairDOCX(file);
    } else if (ext === 'md' || ext === 'markdown') {
      texto = await file.text();
    } else {
      texto = await file.text();
    }
    if (!texto.trim()) throw new Error('Arquivo sem texto legível.');
    const ta = document.getElementById('txt-processo');
    ta.value = ta.value ? ta.value + '\n\n' + texto : texto;
  } catch(e) { alert('Erro ao importar: ' + e.message); }
  finally { sp.classList.add('hidden'); }
}

async function extrairPDF(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let texto = '';
  for (let i = 1; i &amp;lt;= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    texto += content.items.map(it =&amp;gt; it.str).join(' ') + '\n';
  }
  return texto;
}

async function extrairDOCX(file) {
  const buf = await file.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer: buf });
  return result.value;
}

async function importarImagem(input) {

  if (!file) return;
  const sp = document.getElementById('import-spinner');
  sp.classList.remove('hidden');
  try {

function toggleVoz() {
  if (isListening) { recognition?.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Use Chrome ou Edge para ditar por voz.'); return; }
  recognition = new SR();
  recognition.lang = 'pt-BR'; recognition.continuous = true; recognition.interimResults = true;
  let fullText = ''; let timer = null;
  const scheduleStop = () =&amp;gt; {
    if (timer) clearTimeout(timer);
    timer = setTimeout(() =&amp;gt; { try { recognition.stop(); } catch {} }, 1800);
  };
  recognition.onresult = e =&amp;gt; {
    let f = '', itr = '';
    for (let i = 0; i &amp;lt; e.results.length; i++) {
      if (e.results[i].isFinal) f += e.results[i][0].transcript;
      else itr += e.results[i][0].transcript;
    }
    fullText = f || itr;
    if (fullText) scheduleStop();
  };
  recognition.onend = () =&amp;gt; {
    if (timer) clearTimeout(timer);
    isListening = false;
    document.getElementById('btn-voz').textContent = '🎤 Ditar';
    if (fullText.trim()) {
      const ta = document.getElementById('txt-processo');
      ta.value = ta.value ? ta.value.trimEnd() + '\n\n' + fullText.trim() : fullText.trim();
    }
  };
  recognition.onerror = () =&amp;gt; { isListening = false; document.getElementById('btn-voz').textContent = '🎤 Ditar'; };
  recognition.start();
  isListening = true;
  document.getElementById('btn-voz').textContent = '🔴 Parar';
}

// ══════════════════════════════════════════════════════
//  CHAMADAS DE API
// ══════════════════════════════════════════════════════
async function chamarGemini(chave, msgs, modelo) {
  modelo = modelo || 'gemini-1.5-flash';
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${chave}`;
  const system = msgs.find(m =&amp;gt; m.role === 'system');
  const contents = msgs.filter(m =&amp;gt; m.role !== 'system').map(m =&amp;gt; ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.content }]
  }));
  if (system &amp;amp;&amp;amp; contents.length &amp;gt; 0) contents[0].parts[0].text = system.content + '\n\n' + contents[0].parts[0].text;
  const resp = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents, generationConfig: { temperature: 0.7 } })
  });
  if (!resp.ok) { const e = await resp.json().catch(()=&amp;gt;({})); throw new Error(e.error?.message || `Gemini erro ${resp.status}`); }
  const d = await resp.json();
  return d.candidates[0].content.parts[0].text;
}

async function chamarOpenAI(chave, msgs, modelo, baseUrl) {
  modelo = modelo || 'gpt-4o';
  baseUrl = baseUrl || 'https://api.openai.com/v1';
  const resp = await fetch(`${baseUrl}/chat/completions`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${chave}` },
    body: JSON.stringify({ model: modelo, messages: msgs, temperature: 0.7, stream: false })
  });
  if (!resp.ok) { const e = await resp.json().catch(()=&amp;gt;({})); throw new Error(e.error?.message || `OpenAI erro ${resp.status}`); }
  const d = await resp.json();
  return d.choices[0].message.content;
}

async function chamarClaude(chave, msgs, modelo) {
  modelo = modelo || 'claude-haiku-3-5';
  const system = msgs.find(m =&amp;gt; m.role === 'system');
  const messages = msgs.filter(m =&amp;gt; m.role !== 'system');
  const body = { model: modelo, max_tokens: 8192, messages, temperature: 0.7 };
  if (system) body.system = system.content;
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': chave,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify(body)
  });
  if (!resp.ok) { const e = await resp.json().catch(()=&amp;gt;({})); throw new Error(e.error?.message || `Claude erro ${resp.status}`); }
  const d = await resp.json();
  return d.content[0].text;
}

async function chamarGroq(chave, msgs, modelo) {
  modelo = modelo || 'llama-3.3-70b-versatile';
  return chamarOpenAI(chave, msgs, modelo, 'https://api.groq.com/openai/v1');
}

async function chamarIA(chave, msgs, modeloOverride) {
  const prov = detectProvider(chave);
  const modelo = modeloOverride || getModelo() || '';
  if (prov === 'Gemini')  return chamarGemini(chave, msgs, modelo || 'gemini-1.5-pro');
  if (prov === 'Claude')  return chamarClaude(chave, msgs, modelo || 'claude-haiku-3-5');
  if (prov === 'Groq')    return chamarGroq(chave, msgs, modelo);
  return chamarOpenAI(chave, msgs, modelo || 'gpt-4o');
}

// ══════════════════════════════════════════════════════
//  EXECUTAR AÇÃO PRINCIPAL
// ══════════════════════════════════════════════════════
async function executar(acao, customPrompt) {
  const texto = document.getElementById('txt-processo').value.trim();
  if (!texto) { alert('Cole ou importe o texto do documento antes.'); return; }

  const kr = getChaveResumo();
  const kg = getChaveGeracao();

  // Ementas selecionadas
  const emsTexto = [...emsSelected].map(id =&amp;gt; {
    const em = ementas.find(e =&amp;gt; e.id === id);
    return em ? `[${em.titulo} — ${em.categoria}]\n${em.texto}` : '';
  }).filter(Boolean).join('\n\n');

  const jurisManual = document.getElementById('txt-juris').value.trim();
  const jurisFull = [jurisManual, emsTexto].filter(Boolean).join('\n\n');

  setLoading(true);
  document.getElementById('badge-demo').classList.add('hidden');

  try {
    let textoFinal = texto;

    // ── PASSO 1: Resumir/limpar com Gemini (se chave disponível e texto longo) ──
    if (kr &amp;amp;&amp;amp; texto.length &amp;gt; 1500) {
      atualizarResultado('⏳ Limpando e resumindo o texto com Gemini...');
      const resumoMsgs = [
        { role: 'system', content: 'Você é um assistente jurídico. Resuma o texto abaixo de forma objetiva, mantendo todos os fatos relevantes, partes, pedidos, decisões e fundamentos legais. Elimine cabeçalhos de página, rodapés, certificados digitais e repetições.' },
        { role: 'user', content: texto }
      ];
      textoFinal = await chamarGemini(kr, resumoMsgs, 'gemini-1.5-flash');
      textoResumido = textoFinal;
    }

    // ── PASSO 2: Gerar peça com chave principal ──
    const promptSistema = buildPromptSistema(acao, customPrompt);
    const userContent = jurisFull
      ? `${textoFinal}\n\n---\nJURISPRUDÊNCIA E EMENTAS PARA CITAR:\n${jurisFull}`
      : textoFinal;

    const msgs = [
      { role: 'system', content: promptSistema },
      { role: 'user', content: userContent }
    ];

    let resposta = '';
    if (kg) {
      atualizarResultado('⏳ Gerando peça...');
      resposta = await chamarIA(kg, msgs);
    } else {
      // Demo: usa Gemini Flash gratuito se tiver chave de resumo, senão avisa
      if (kr) {
        atualizarResultado('⏳ Gerando (modo demo com Gemini)...');
        resposta = await chamarGemini(kr, msgs, 'gemini-1.5-flash');
        document.getElementById('badge-demo').classList.remove('hidden');
      } else {
        atualizarResultado('⚠️ Configure ao menos uma chave de API em ⚙️ Configurações.');
        setLoading(false);
        return;
      }
    }

    // Salvar resultado
    resultado = resposta;
    renderResultado(resposta);
    chatHistory = [
      { role: 'system', content: 'Você é um advogado consultor jurídico experiente de Minas Gerais. Responda de forma direta e técnica.' },
      { role: 'user', content: `O documento gerado foi:\n\n${resposta}` },
      { role: 'assistant', content: 'Entendido. Estou pronto para refinar.' }
    ];

    // Salvar no histórico
    const labelAcao = customPrompt
      ? (acoesCustom.find(a =&amp;gt; a.id === acao)?.label || 'Ação Custom')
      : ({ resumir:'Resumir', revisar:'Revisar', refinar:'Refinar', simplificar:'Linguagem Simples', minuta:'Gerar Minuta', analisar:'Analisar', 'modo-estrito':'Corrigir Texto', 'modo-redacao':'Redação Jurídica', 'modo-interativo':'Verificar Lacunas' }[acao] || acao);
    historico = [{ id: Date.now().toString(), acao: labelAcao, inputSnippet: texto.substring(0,120), resultado: resposta, timestamp: new Date().toLocaleString('pt-BR') }, ...historico].slice(0,15);
    saveLS('aj_historico', historico);
    renderHistorico();

  } catch(e) {
    if (e.name === 'AbortError') return;
    atualizarResultado('❌ Erro: ' + e.message);
  } finally {
    setLoading(false);
  }
}

// ══════════════════════════════════════════════════════
//  RENDER RESULTADO
// ══════════════════════════════════════════════════════
function atualizarResultado(txt) {
  document.getElementById('secao-resultado').classList.remove('hidden');
  const box = document.getElementById('resultado-box');
  box.innerHTML = '';
  box.textContent = txt;
}

function renderResultado(txt) {
  document.getElementById('secao-resultado').classList.remove('hidden');
  const box = document.getElementById('resultado-box');
  box.innerHTML = '';
  const blocks = txt.split(/\n{2,}/);
  blocks.forEach(block =&amp;gt; {
    const t = block.trim(); if (!t) return;
    const p = document.createElement('p');
    const lines = t.split('\n');
    const isSingle = lines.length === 1;
    const isTitulo = isSingle &amp;amp;&amp;amp; t === t.toUpperCase() &amp;amp;&amp;amp; t.length &amp;gt; 2 &amp;amp;&amp;amp; /[A-ZÁÉÍÓÚÃÕ]/.test(t) &amp;amp;&amp;amp; !/^\d+\./.test(t);
    const isLista  = /^\d+[.)]\s/.test(t) || /^[a-z]\)/.test(t) || /^[-–]\s/.test(t);
    const isCitacao = (t.startsWith('&amp;quot;') || t.startsWith('\u201c')) &amp;amp;&amp;amp; t.length &amp;gt; 60;
    if (isTitulo)  p.className = 'titulo-peca';
    else if (isLista)   p.className = 'item-lista';
    else if (isCitacao) p.className = 'citacao';
    else p.className = 'paragrafo';
    lines.forEach((l, i) =&amp;gt; { if (i &amp;gt; 0) p.appendChild(document.createElement('br')); p.appendChild(document.createTextNode(l)); });
    box.appendChild(p);
  });
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function baixarWord() {
  if (!resultado || !window.docx) { alert('Biblioteca docx não carregada.'); return; }
  
  const { Document, Paragraph, TextRun, AlignmentType, HeadingLevel } = docx;
  const paragrafos = resultado.split(/\n{2,}/).map(block =&amp;gt; {
    const t = block.trim();
    if (!t) return null;
    
    const isTitulo = t === t.toUpperCase() &amp;amp;&amp;amp; t.length &amp;gt; 2 &amp;amp;&amp;amp; /[A-Z]/.test(t) &amp;amp;&amp;amp; !/^\d/.test(t);
    
    if (isTitulo) {
      return new Paragraph({
        text: t,
        heading: HeadingLevel.HEADING_1,
        alignment: AlignmentType.CENTER,
        spacing: { before: 240, after: 120 }
      });
    }
    
    return new Paragraph({
      children: [new TextRun(t)],
      alignment: AlignmentType.JUSTIFIED,
      indent: { firstLine: 1134 },
      spacing: { line: 360 }
    });
  }).filter(Boolean);

  const doc = new Document({
    sections: [{
      properties: {},
      children: paragrafos
    }]
  });

  docx.Packer.toBlob(doc).then(blob =&amp;gt; {
    saveAs(blob, `juridico-${Date.now()}.docx`);
  });
}

// ══════════════════════════════════════════════════════
function toggleChat() {
  const a = document.getElementById('chat-area');
  const ar = document.getElementById('chat-arrow');
  a.classList.toggle('hidden');
  ar.textContent = a.classList.contains('hidden') ? '▼' : '▲';
}
async function enviarChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim(); if (!msg || !resultado) return;
  input.value = '';
  chatHistory.push({ role: 'user', content: msg });
  renderChat();
  const kg = getChaveGeracao();
  const kr = getChaveResumo();
  const chave = kg || kr;
  if (!chave) { chatHistory.push({ role:'assistant', content:'⚠️ Configure uma chave de API para usar o chat.' }); renderChat(); return; }
  try {
    const resposta = await chamarIA(chave, chatHistory);
    chatHistory.push({ role:'assistant', content: resposta });
    if (resposta.length &amp;gt; resultado.length * 0.5 &amp;amp;&amp;amp; !resposta.toLowerCase().startsWith('para'))
      resultado = resposta;
    renderChat();
    renderResultado(resultado);
  } catch(e) {
    chatHistory.push({ role:'assistant', content:'❌ Erro: ' + e.message });
    renderChat();
  }
}
document.getElementById('chat-input')?.addEventListener('keydown', e =&amp;gt; {
  if (e.key === 'Enter' &amp;amp;&amp;amp; !e.shiftKey) { e.preventDefault(); enviarChat(); }
});
function renderChat() {
  const container = document.getElementById('chat-msgs');
  container.innerHTML = '';
  chatHistory.filter(m =&amp;gt; m.role !== 'system').forEach(m =&amp;gt; {
    const div = document.createElement('div');
    div.className = m.role === 'user' ? 'msg-user' : 'msg-ia';
    const role = document.createElement('div');
    role.className = 'msg-role';
    role.textContent = m.role === 'user' ? 'Você' : 'IA';
    div.appendChild(role);
    div.appendChild(document.createTextNode(m.content));
    container.appendChild(div);
  });
  container.scrollTop = container.scrollHeight;
}

function carregarEditor() {
  const conteudoSalvo = loadLS('aj_editor_content', '');
  if (conteudoSalvo) document.getElementById('editor-content').innerHTML = conteudoSalvo;
  
  const fmt = loadLS('aj_formatacao', formatacaoAtual);
  formatacaoAtual = { ...formatacaoAtual, ...fmt };
  
  document.getElementById('ed-fonte').value = formatacaoAtual.fonte;
  document.getElementById('ed-tamanho').value = formatacaoAtual.tamanho;
  document.getElementById('ed-recuo').value = formatacaoAtual.recuo;
  document.getElementById('ed-espacamento').value = formatacaoAtual.espacamento;
  
  aplicarFormatacao();
}

function salvarEditorAuto() {
  const conteudo = document.getElementById('editor-content').innerHTML;
  saveLS('aj_editor_content', conteudo);
}

function aplicarFormatacao() {
  formatacaoAtual.fonte = document.getElementById('ed-fonte').value;
  formatacaoAtual.tamanho = parseInt(document.getElementById('ed-tamanho').value);
  formatacaoAtual.recuo = parseFloat(document.getElementById('ed-recuo').value);
  formatacaoAtual.espacamento = parseFloat(document.getElementById('ed-espacamento').value);
  
  const editor = document.getElementById('editor-content');
  editor.style.fontFamily = formatacaoAtual.fonte;
  editor.style.fontSize = formatacaoAtual.tamanho + 'pt';
  editor.style.lineHeight = formatacaoAtual.espacamento;
  editor.style.textIndent = formatacaoAtual.recuo + 'cm';
  editor.style.textAlign = formatacaoAtual.alinhamento;
  
  saveLS('aj_formatacao', formatacaoAtual);
}

function toggleFormatacao(tipo) {
  formatacaoAtual[tipo] = !formatacaoAtual[tipo];
  document.getElementById(`fmt-${tipo}`).classList.toggle('ativo', formatacaoAtual[tipo]);
  
  const editor = document.getElementById('editor-content');
  if (tipo === 'bold') editor.style.fontWeight = formatacaoAtual.bold ? 'bold' : 'normal';
  if (tipo === 'italic') editor.style.fontStyle = formatacaoAtual.italic ? 'italic' : 'normal';
  if (tipo === 'underline') editor.style.textDecoration = formatacaoAtual.underline ? 'underline' : 'none';
  
  saveLS('aj_formatacao', formatacaoAtual);
}

function setAlinhamento(align) {
  formatacaoAtual.alinhamento = align;
  ['left','center','right','justify'].forEach(a =&amp;gt; {
    document.getElementById(`align-${a}`).classList.toggle('ativo', a === align);
  });
  document.getElementById('editor-content').style.textAlign = align;
  saveLS('aj_formatacao', formatacaoAtual);
}

function limparEditor() {
  if (!confirm('Limpar todo o conteúdo do editor?')) return;
  document.getElementById('editor-content').innerHTML = '&amp;lt;p&amp;gt;Digite ou cole seu texto aqui para formatar...&amp;lt;/p&amp;gt;';
  salvarEditorAuto();
}

function enviarParaEditor() {
  if (!resultado) return;
  document.getElementById('editor-content').innerHTML = resultado.split('\n\n').map(p =&amp;gt; `&amp;lt;p&amp;gt;${p}&amp;lt;/p&amp;gt;`).join('');
  salvarEditorAuto();
  mudarAba('editor', document.querySelectorAll('.tab-btn')[1]);
}

async function gerarPecaDoEditor() {
  const conteudo = document.getElementById('editor-content').innerText.trim();
  if (!conteudo) { alert('Editor vazio.'); return; }
  
  document.getElementById('txt-processo').value = conteudo;
  mudarAba('processar', document.querySelector('.tab-btn'));
  await executar('modo-redacao');
}

function baixarEditorWord() {
  const conteudo = document.getElementById('editor-content').innerText.trim();
  if (!conteudo || !window.docx) { alert('Editor vazio ou biblioteca não carregada.'); return; }
  
  const { Document, Paragraph, TextRun, AlignmentType } = docx;
  const paragrafos = conteudo.split(/\n{2,}/).map(t =&amp;gt; {
    if (!t.trim()) return null;
    return new Paragraph({
      children: [new TextRun(t.trim())],
      alignment: AlignmentType.JUSTIFIED,
      indent: { firstLine: formatacaoAtual.recuo * 567 },
      spacing: { line: formatacaoAtual.espacamento * 240 }
    });
  }).filter(Boolean);

  const doc = new Document({ sections: [{ properties: {}, children: paragrafos }] });
  docx.Packer.toBlob(doc).then(blob =&amp;gt; saveAs(blob, `editor-${Date.now()}.docx`));
}

function baixarEditorMarkdown() {
  const conteudo = document.getElementById('editor-content').innerText.trim();
  if (!conteudo) { alert('Editor vazio.'); return; }
  
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([conteudo], { type: 'text/markdown' }));
  a.download = `editor-${Date.now()}.md`;
  a.click();
}

function salvarComoTemplate() {
  abrirFormTemplate();
}

function abrirFormTemplate(id) {
  editTemplateId = id || null;
  const modal = document.getElementById('modal-template');
  const titulo = document.getElementById('modal-template-titulo');
  
  if (id) {
    const tpl = templates.find(t =&amp;gt; t.id === id);
    document.getElementById('tpl-nome').value = tpl.nome;
    document.getElementById('tpl-desc').value = tpl.descricao || '';
    titulo.textContent = 'Editar Template';
  } else {
    document.getElementById('tpl-nome').value = '';
    document.getElementById('tpl-desc').value = '';
    titulo.textContent = 'Novo Template';
  }
  
  modal.classList.add('aberto');
}

function fecharModalTemplate() {
  document.getElementById('modal-template').classList.remove('aberto');
  editTemplateId = null;
}

function confirmarSalvarTemplate() {
  const nome = document.getElementById('tpl-nome').value.trim();
  if (!nome) { alert('Digite um nome para o template.'); return; }
  
  const desc = document.getElementById('tpl-desc').value.trim();
  const config = { ...formatacaoAtual };
  
  if (editTemplateId) {
    templates = templates.map(t =&amp;gt; t.id === editTemplateId ? { ...t, nome, descricao: desc, config } : t);
  } else {
    templates.push({
      id: Date.now().toString(),
      nome,
      descricao: desc,
      config,
      criadoEm: new Date().toLocaleString('pt-BR')
    });
  }
  
  saveLS('aj_templates', templates);
  fecharModalTemplate();
  renderTemplates();
}

function deletarTemplate(id) {
  if (!confirm('Remover este template?')) return;
  templates = templates.filter(t =&amp;gt; t.id !== id);
  if (templateAtivo === id) {
    templateAtivo = null;
    saveLS('aj_template_ativo', null);
  }
  saveLS('aj_templates', templates);
  renderTemplates();
}

function ativarTemplate(id) {
  templateAtivo = id;
  saveLS('aj_template_ativo', id);
  renderTemplates();
}

function aplicarTemplateAtivo() {
  if (!templateAtivo) { alert('Selecione um template primeiro.'); return; }
  const tpl = templates.find(t =&amp;gt; t.id === templateAtivo);
  if (!tpl) return;
  
  formatacaoAtual = { ...tpl.config };
  
  document.getElementById('ed-fonte').value = formatacaoAtual.fonte;
  document.getElementById('ed-tamanho').value = formatacaoAtual.tamanho;
  document.getElementById('ed-recuo').value = formatacaoAtual.recuo;
  document.getElementById('ed-espacamento').value = formatacaoAtual.espacamento;
  
  ['bold','italic','underline'].forEach(t =&amp;gt; {
    document.getElementById(`fmt-${t}`).classList.toggle('ativo', formatacaoAtual[t]);
  });
  
  ['left','center','right','justify'].forEach(a =&amp;gt; {
    document.getElementById(`align-${a}`).classList.toggle('ativo', a === formatacaoAtual.alinhamento);
  });
  
  aplicarFormatacao();
  alert(`Template &amp;quot;${tpl.nome}&amp;quot; aplicado!`);
}

function renderTemplates() {
  const lista = document.getElementById('lista-templates');
  lista.innerHTML = '';
  
  document.getElementById('tab-templates-btn').textContent = 
    `📐 Templates${templates.length ? ` (${templates.length})` : ''}`;
  
  if (!templates.length) {
    lista.innerHTML = '&amp;lt;div class=&amp;quot;text-muted fs12&amp;quot; style=&amp;quot;text-align:center;padding:20px&amp;quot;&amp;gt;Nenhum template salvo. Configure o editor e clique em &amp;quot;💾 Salvar Template&amp;quot;.&amp;lt;/div&amp;gt;';
    return;
  }
  
  templates.forEach(tpl =&amp;gt; {
    const ativo = tpl.id === templateAtivo;
    const div = document.createElement('div');
    div.className = 'card' + (ativo ? ' card-selected' : '');
    div.innerHTML = `
      &amp;lt;div class=&amp;quot;row&amp;quot; style=&amp;quot;justify-content:space-between;margin-bottom:4px&amp;quot;&amp;gt;
        &amp;lt;span class=&amp;quot;card-title&amp;quot; style=&amp;quot;margin:0&amp;quot;&amp;gt;${ativo ? '✓ ' : ''}${tpl.nome}&amp;lt;/span&amp;gt;
        &amp;lt;div class=&amp;quot;row&amp;quot; style=&amp;quot;gap:4px&amp;quot;&amp;gt;
          &amp;lt;button class=&amp;quot;btn-icon&amp;quot; onclick=&amp;quot;ativarTemplate('${tpl.id}')&amp;quot; title=&amp;quot;Ativar&amp;quot;&amp;gt;⭐&amp;lt;/button&amp;gt;
          &amp;lt;button class=&amp;quot;btn-icon&amp;quot; onclick=&amp;quot;abrirFormTemplate('${tpl.id}')&amp;quot; title=&amp;quot;Editar&amp;quot;&amp;gt;✏️&amp;lt;/button&amp;gt;
          &amp;lt;button class=&amp;quot;btn-icon&amp;quot; onclick=&amp;quot;deletarTemplate('${tpl.id}')&amp;quot; title=&amp;quot;Remover&amp;quot;&amp;gt;🗑&amp;lt;/button&amp;gt;
        &amp;lt;/div&amp;gt;
      &amp;lt;/div&amp;gt;
      ${tpl.descricao ? `&amp;lt;div class=&amp;quot;card-sub&amp;quot; style=&amp;quot;margin-bottom:6px&amp;quot;&amp;gt;${tpl.descricao}&amp;lt;/div&amp;gt;` : ''}
      &amp;lt;div class=&amp;quot;fs10 text-muted&amp;quot;&amp;gt;
        Fonte: ${tpl.config.fonte} ${tpl.config.tamanho}pt | 
        Recuo: ${tpl.config.recuo}cm | 
        Espaço: ${tpl.config.espacamento}x | 
        Alinhamento: ${tpl.config.alinhamento}
      &amp;lt;/div&amp;gt;
      &amp;lt;button class=&amp;quot;btn btn-purple&amp;quot; style=&amp;quot;margin-top:8px&amp;quot; onclick=&amp;quot;aplicarTemplate('${tpl.id}')&amp;quot;&amp;gt;▶ Aplicar&amp;lt;/button&amp;gt;`;
    lista.appendChild(div);
  });

function aplicarTemplate(id) {
  ativarTemplate(id);
  aplicarTemplateAtivo();
}

function restaurarHistorico(id) {
  const h = historico.find(x =&amp;gt; x.id === id); if (!h) return;
  resultado = h.resultado;
  renderResultado(h.resultado);
  mudarAba('processar', document.querySelector('.tab-btn'));
}
function copiarHistorico(id) {
  const h = historico.find(x =&amp;gt; x.id === id); if (!h) return;
  navigator.clipboard.writeText(h.resultado);
}

function abrirFormAcao(id) {
  editAcaoId = id || null;
  const form = document.getElementById('form-acao');
  const titulo = document.getElementById('form-acao-titulo');
  if (id) {
    const a = acoesCustom.find(x =&amp;gt; x.id === id);
    document.getElementById('ca-label').value  = a.label;
    document.getElementById('ca-desc').value   = a.descricao;
    document.getElementById('ca-prompt').value = a.prompt;
    titulo.textContent = 'Editar Ação';
  } else {
    document.getElementById('ca-label').value  = '';
    document.getElementById('ca-desc').value   = '';
    document.getElementById('ca-prompt').value = '';
    titulo.textContent = 'Nova Ação';
  }
  form.classList.remove('hidden');
}
function fecharFormAcao() {
  document.getElementById('form-acao').classList.add('hidden');
  editAcaoId = null;
}
function salvarAcao() {
  const label  = document.getElementById('ca-label').value.trim();
  const desc   = document.getElementById('ca-desc').value.trim();
  const prompt = document.getElementById('ca-prompt').value.trim();
  if (!label || !prompt) { alert('Preencha nome e prompt.'); return; }
  if (editAcaoId) {
    acoesCustom = acoesCustom.map(a =&amp;gt; a.id === editAcaoId ? { ...a, label, descricao:desc, prompt } : a);
  } else {
    acoesCustom.push({ id: Date.now().toString(), label, descricao:desc, prompt });
  }
  saveLS('aj_acoes_custom', acoesCustom);
  fecharFormAcao();
  renderAcoes();
  renderAcoesCustomGrid();
}
function deletarAcao(id) {
  if (!confirm('Remover esta ação?')) return;
  acoesCustom = acoesCustom.filter(a =&amp;gt; a.id !== id);
  saveLS('aj_acoes_custom', acoesCustom);
  renderAcoes();
  renderAcoesCustomGrid();
}
function renderAcoes() {
  const lista = document.getElementById('lista-acoes');
  lista.innerHTML = '';
  document.getElementById('tab-acoes-btn').textContent =
    `🪄 Ações${acoesCustom.length ? ` (${acoesCustom.length})` : ''}`;
  if (!acoesCustom.length) {
    lista.innerHTML = '&amp;lt;div class=&amp;quot;text-muted fs12&amp;quot; style=&amp;quot;text-align:center;padding:20px&amp;quot;&amp;gt;Nenhuma ação personalizada. Clique em &amp;quot;+ Nova&amp;quot; para criar.&amp;lt;/div&amp;gt;';
    return;
  }
  acoesCustom.forEach(a =&amp;gt; {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      &amp;lt;div class=&amp;quot;row&amp;quot; style=&amp;quot;justify-content:space-between;margin-bottom:4px&amp;quot;&amp;gt;
        &amp;lt;span class=&amp;quot;card-title text-purple&amp;quot; style=&amp;quot;margin:0&amp;quot;&amp;gt;🪄 ${a.label}&amp;lt;/span&amp;gt;

          &amp;lt;button class=&amp;quot;btn-icon&amp;quot; onclick=&amp;quot;abrirFormAcao('${a.id}')&amp;quot;&amp;gt;✏️&amp;lt;/button&amp;gt;
          &amp;lt;button class=&amp;quot;btn-icon&amp;quot; onclick=&amp;quot;deletarAcao('${a.id}')&amp;quot;&amp;gt;🗑&amp;lt;/button&amp;gt;
        &amp;lt;/div&amp;gt;

}
function renderAcoesCustomGrid() {
  const grid = document.getElementById('grid-acoes-custom');
  const secao = document.getElementById('secao-acoes-custom');
  grid.innerHTML = '';
  if (!acoesCustom.length) { secao.classList.add('hidden'); return; }
  secao.classList.remove('hidden');
  acoesCustom.forEach(a =&amp;gt; {
    const btn = document.createElement('button');
    btn.className = 'action-btn';
    btn.style.cssText = 'border-color:#8b5cf633;color:var(--purple)';
    btn.textContent = '🪄 ' + a.label;
    btn.title = a.descricao || '';
    btn.onclick = () =&amp;gt; executarAcaoCustom(a.id);
    grid.appendChild(btn);
  });
}
function executarAcaoCustom(id) {
  const a = acoesCustom.find(x =&amp;gt; x.id === id); if (!a) return;
  executar(id, a.prompt);
}

//  FUNÇÕES DE FILTROS
// ══════════════════════════════════════════════════════
function carregarFiltros() {
  const filtrosSalvos = loadLS('aj_filtros', {});
  
  if (filtrosSalvos.regexManter) document.getElementById('regex-manter').value = filtrosSalvos.regexManter.join('\n');
  if (filtrosSalvos.regexExcluir) document.getElementById('regex-excluir').value = filtrosSalvos.regexExcluir.join('\n');
  if (filtrosSalvos.termosManter) document.getElementById('termos-manter').value = filtrosSalvos.termosManter.join(', ');
  if (filtrosSalvos.termosExcluir) document.getElementById('termos-excluir').value = filtrosSalvos.termosExcluir.join(', ');
  
  document.getElementById('filtro-ocr').checked = filtrosSalvos.limparOCR !== false;
  document.getElementById('filtro-markdown').checked = filtrosSalvos.limparMarkdown !== false;
  document.getElementById('filtro-certificados').checked = filtrosSalvos.limparCertificados !== false;
}

function salvarFiltros() {
  const regexManter = document.getElementById('regex-manter').value.split('\n').filter(Boolean);
  const regexExcluir = document.getElementById('regex-excluir').value.split('\n').filter(Boolean);
  const termosManter = document.getElementById('termos-manter').value.split(',').map(t =&amp;gt; t.trim()).filter(Boolean);
  const termosExcluir = document.getElementById('termos-excluir').value.split(',').map(t =&amp;gt; t.trim()).filter(Boolean);
  
  const filtros = {
    regexManter,
    regexExcluir,
    termosManter,
    termosExcluir,
    limparOCR: document.getElementById('filtro-ocr').checked,
    limparMarkdown: document.getElementById('filtro-markdown').checked,
    limparCertificados: document.getElementById('filtro-certificados').checked
  };
  
  saveLS('aj_filtros', filtros);
  filtrosAtivos = filtros;
}

function adicionarRegexPreset(tipo, preset) {
  const presets = {
    manter: {
      ementa: '^EMENTA.*|^Ementa.*',
      acordao: '^ACÓRDÃO.*|^Acórdão.*',
      sentenca: '^SENTENÇA.*|^Sentença.*|^DECISÃO.*'
    },
    excluir: {
      pagina: '^Página \\d+.*|^Pág\\. \\d+.*|^\\d+/\\d+$',
      certificado: '.*[Cc]ertificado [Dd]igital.*|.*[Aa]ssinado eletronicamente.*|.*[Aa]ssinatura [Ee]letrônica.*',
      cabecalho: '^PODER JUDICIÁRIO.*|^TRIBUNAL.*|^JUSTIÇA.*'
    }
  };
  
  const campo = tipo === 'manter' ? 'regex-manter' : 'regex-excluir';
  const textarea = document.getElementById(campo);
  const valor = textarea.value.trim();
  const novoValor = valor ? valor + '\n' + presets[tipo][preset] : presets[tipo][preset];
  textarea.value = novoValor;
  salvarFiltros();
}

function limparTexto(texto) {
  let resultado = texto;
  
  // Limpar OCR
  if (filtrosAtivos.limparOCR) {
    // Remover caracteres estranhos comuns em OCR
    resultado = resultado.replace(/[�]/g, '');
    resultado = resultado.replace(/\s{3,}/g, ' ');
    resultado = resultado.replace(/\n{4,}/g, '\n\n\n');
    resultado = resultado.replace(/[^\S\n]{2,}/g, ' ');
  }
  
  // Limpar Markdown
  if (filtrosAtivos.limparMarkdown) {
    resultado = resultado.replace(/^#{1,6}\s+/gm, '');
    resultado = resultado.replace(/\*\*(.+?)\*\*/g, '$1');
    resultado = resultado.replace(/__(.+?)__/g, '$1');
    resultado = resultado.replace(/\*(.+?)\*/g, '$1');
    resultado = resultado.replace(/_(.+?)_/g, '$1');
    resultado = resultado.replace(/~~(.+?)~~/g, '$1');
    resultado = resultado.replace(/`(.+?)`/g, '$1');
  }
  
  // Limpar certificados
  if (filtrosAtivos.limparCertificados) {
    const linhas = resultado.split('\n');
    resultado = linhas.filter(linha =&amp;gt; {
      const l = linha.toLowerCase();
      return !l.includes('certificado digital') &amp;amp;&amp;amp;
             !l.includes('assinado eletronicamente') &amp;amp;&amp;amp;
             !l.includes('assinatura eletrônica') &amp;amp;&amp;amp;
             !l.includes('documento assinado digitalmente') &amp;amp;&amp;amp;
             !/^[A-F0-9]{32,}$/.test(linha.trim());
    }).join('\n');
  }
  
  return resultado;
}

function aplicarFiltros() {
  salvarFiltros();
  
  const textoProcesso = document.getElementById('txt-processo').value.trim();
  if (!textoProcesso) {
    alert('Cole um texto na aba Processar primeiro.');
    return;
  }
  
  textoOriginal = textoProcesso;
  let texto = limparTexto(textoOriginal);
  
  const linhas = texto.split('\n');
  let linhasMantidas = [...linhas];
  let linhasExcluidas = [];
  
  // Aplicar filtros de regex para manter
  if (filtrosAtivos.regexManter &amp;amp;&amp;amp; filtrosAtivos.regexManter.length &amp;gt; 0) {
    const regexs = filtrosAtivos.regexManter.map(r =&amp;gt; {
      try { return new RegExp(r, 'i'); } catch { return null; }
    }).filter(Boolean);
    
    if (regexs.length &amp;gt; 0) {
      const novasLinhasMantidas = [];
      linhasMantidas.forEach(linha =&amp;gt; {
        const mantida = regexs.some(regex =&amp;gt; regex.test(linha));
        if (mantida) novasLinhasMantidas.push(linha);
        else linhasExcluidas.push(linha);
      });
      linhasMantidas = novasLinhasMantidas;
    }
  }
  
  // Aplicar filtros de regex para excluir
  if (filtrosAtivos.regexExcluir &amp;amp;&amp;amp; filtrosAtivos.regexExcluir.length &amp;gt; 0) {
    const regexs = filtrosAtivos.regexExcluir.map(r =&amp;gt; {
      try { return new RegExp(r, 'i'); } catch { return null; }
    }).filter(Boolean);
    
    if (regexs.length &amp;gt; 0) {
      const novasLinhasMantidas = [];
      linhasMantidas.forEach(linha =&amp;gt; {
        const excluida = regexs.some(regex =&amp;gt; regex.test(linha));
        if (excluida) linhasExcluidas.push(linha);
        else novasLinhasMantidas.push(linha);
      });
      linhasMantidas = novasLinhasMantidas;
    }
  }
  
  // Aplicar filtros por termo para manter
  if (filtrosAtivos.termosManter &amp;amp;&amp;amp; filtrosAtivos.termosManter.length &amp;gt; 0) {
    const paragrafos = linhasMantidas.join('\n').split(/\n\n+/);
    const paragrafosMantidos = [];
    const paragrafosExcluidos = [];
    
    paragrafos.forEach(p =&amp;gt; {
      const mantido = filtrosAtivos.termosManter.some(termo =&amp;gt; 
        p.toLowerCase().includes(termo.toLowerCase())
      );
      if (mantido) paragrafosMantidos.push(p);
      else paragrafosExcluidos.push(p);
    });
    
    linhasMantidas = paragrafosMantidos.join('\n\n').split('\n');
    linhasExcluidas.push(...paragrafosExcluidos.join('\n\n').split('\n'));
  }
  
  // Aplicar filtros por termo para excluir
  if (filtrosAtivos.termosExcluir &amp;amp;&amp;amp; filtrosAtivos.termosExcluir.length &amp;gt; 0) {
    const paragrafos = linhasMantidas.join('\n').split(/\n\n+/);
    const paragrafosMantidos = [];
    const paragrafosExcluidos = [];
    
    paragrafos.forEach(p =&amp;gt; {
      const excluido = filtrosAtivos.termosExcluir.some(termo =&amp;gt; 
        p.toLowerCase().includes(termo.toLowerCase())
      );
      if (excluido) paragrafosExcluidos.push(p);
      else paragrafosMantidos.push(p);
    });
    
    linhasMantidas = paragrafosMantidos.join('\n\n').split('\n');
    linhasExcluidas.push(...paragrafosExcluidos.join('\n\n').split('\n'));
  }
  
  textoFiltrado = linhasMantidas.join('\n').trim();
  textoExcluido = linhasExcluidas.join('\n').trim();
  
  // Atualizar estatísticas
  atualizarEstatisticas();
  
  // Mostrar resultado
  verTextoMantido();
}
